/* =========================================================
 * ★ 联机对战（PvP）
 *
 * 单人流程完全不受影响：mode 默认为 'solo'，只有从这里进来才切到 'pvp'。
 *
 * 同步模型：
 *   双方各自规划 → 都把计划交给房间服务 → 服务端凑齐后广播两份计划 + 一颗种子
 *   → 两端各自跑 pvpResolveTurn（纯函数）→ 得到同一串事件 → 各自播动画
 *   → 都播完报 ready → 服务端推进回合。
 *
 * 因为结算是纯函数且种子一致，两端画面必然一致，不需要任何「谁是权威」的仲裁。
 * 代价是服务端无法校验计划合法性（规则只存在于客户端），只适合熟人局。
 *
 * PvP v1 支持：移动 / 普通攻击 / 闪避（等待节点）。
 * 技能节点（冲锋 / 反击 / 爆发 / 血浆）未接入，规划时会被忽略并提示。
 * ========================================================= */
let pvpUnits = null;          // [slot0, slot1] 结算权威状态
let pvpSlot = 0;              // 我是哪个座位
let pvpTurn = 0;
let pvpChars = ['', ''];
let pvpNames = ['', ''];
let pvpWaiting = false;       // 已交计划，等对手
let pvpOver = false;
let pvpPick = 'vampire';      // 面板里选的角色
const PVP_SPAWNS = [{ x: 2, y: 4 }, { x: 6, y: 4 }];   // 9x9 竞技场，左右对称

/* ---------------- 传输层（与 net/net.js 同协议，内联以维持单文件） ------------- */
const PVP_NET = (function () {
  let base = '', room = null, token = null, slot = 0, seq = 0, alive = false, ctrl = null;
  const hs = {};
  function on(k, fn) { (hs[k] = hs[k] || []).push(fn); }
  function fire(k, d) {
    (hs[k] || []).forEach(function (f) { try { f(d); } catch (e) { console.error('[PVP]', e); } });
  }
  function req(path, body) {
    const opt = { method: body ? 'POST' : 'GET', cache: 'no-store' };
    if (body) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
    return fetch(base + path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }
  function absorb(list) {
    for (let i = 0; i < list.length; i++) {
      const ev = list[i];
      if (ev.seq > seq) seq = ev.seq;
      if (ev.type === 'turn') pvpTurn = ev.turn + 1;
      if (ev.type === 'next') pvpTurn = ev.turn;
      fire(ev.type, ev); fire('*', ev);
    }
  }
  function loop() {
    if (!alive) return;
    ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    const opt = { cache: 'no-store' };
    if (ctrl) opt.signal = ctrl.signal;
    fetch(base + '/api/poll?room=' + encodeURIComponent(room) +
          '&token=' + encodeURIComponent(token) + '&since=' + seq + '&wait=25', opt)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j.events && j.events.length) absorb(j.events);
        if (typeof j.turn === 'number' && j.turn > pvpTurn) pvpTurn = j.turn;
        loop();
      })
      .catch(function (e) {
        if (!alive) return;
        if (e && (e.status === 403 || e.status === 404)) { alive = false; fire('closed', { reason: e.message }); return; }
        setTimeout(loop, 1000);
      });
  }
  function start() { if (alive) return; alive = true; loop(); }
  return {
    on: on,
    setBase: function (b) {
      base = String(b || '').replace(/\/+$/, '');
      if (location.protocol === 'https:' && /^http:\/\//i.test(base)) {
        throw new Error('页面是 https，服务地址却是 http://，浏览器会拦截。请改用 https 隧道地址。');
      }
    },
    room: function () { return room; },
    slot: function () { return slot; },
    create: function (name, charId) {
      return req('/api/create', { name: name, charId: charId }).then(function (j) {
        room = j.room; token = j.token; slot = j.slot; seq = 0; start(); return j;
      });
    },
    join: function (r, name, charId) {
      return req('/api/join', { room: r, name: name, charId: charId }).then(function (j) {
        room = String(r).toUpperCase(); token = j.token; slot = j.slot; seq = 0; start(); return j;
      });
    },
    plan: function (t, plan) { return req('/api/plan', { room: room, token: token, turn: t, plan: plan }); },
    ready: function (t) { return req('/api/ready', { room: room, token: token, turn: t }); }
  };
})();

function pvpNameOf(slot) {
  if (slot === pvpSlot) return '你';
  return pvpNames[1 - pvpSlot] || '对手';
}

/* ---------------- 战场初始化 ---------------- */
function pvpStartMatch() {
  mode = 'pvp';
  pvpOver = false;
  pvpTurn = 0;
  pvpWaiting = false;
  setDebugMode(false);
  isMoving = false; dragging = false; dragDownCell = null; hasDragged = false;
  level = 1; levelHpBonus = 0; heroLevel = 1; playerShield = 0;
  buffs = freshBuffs();
  bloodDrops = []; rewardItems = [];
  enemies = []; enemyPaths = []; enemyArrows = [];
  ROWS = 9; COLS = 9;
  /* ISSUE-20261028-13 方案 A：联机竞技场用独立快照，不再复用选角地图
   * （大厅已删内部障碍；这样做联机地形逐格不变，不会顺手改到平衡） */
  map = buildPvpArena();
  stopFreeMove();
  selectedChar = pvpChars[pvpSlot] || 'fencer';

  playerStats = createPlayerStats(selectedChar);
  /* ISSUE-20261028-19：预备干员的自由加点**不进联机**。
   * pvpMakeUnit() 用的是 CHARACTERS 静态值重建双方单位（快照只传 charId，不传六维），
   * 本地点数若真能加，面板会变、结算却不变（联机结算只读 pvpUnits），是「假加点」。
   * 因此联机里预备干员一律按全 8 静态值打，双方对称、公平性不变；
   * 真同步需要 bot 侧在 create/join 里转发 abilities 字段（本机无 bot 源码），已单开 issue 跟踪。 */
  const rookieInPvp = charIsDynamic(selectedChar);
  if (rookieInPvp) {
    playerStats.abilities = { ...CHARACTERS[selectedChar].abilities };
    playerStats.abilityPoints = 0;
  }
  recomputePlayerDerivedStats();
  playerStats.currentHp = playerStats.maxHp;
  player = createPlayerUnit(PVP_SPAWNS[pvpSlot]);

  pvpUnits = [
    pvpMakeUnit(CHARACTERS, pvpChars[0] || 'fencer', 0, PVP_SPAWNS[0].x, PVP_SPAWNS[0].y),
    pvpMakeUnit(CHARACTERS, pvpChars[1] || 'fencer', 1, PVP_SPAWNS[1].x, PVP_SPAWNS[1].y)
  ];
  const foeUnit = pvpUnits[1 - pvpSlot];
  peer = {
    charId: pvpChars[1 - pvpSlot] || 'fencer',
    x: foeUnit.x, y: foeUnit.y, hp: foeUnit.hp, maxHp: foeUnit.maxHp,
    alive: true, facing: foeUnit.facing, stunTurns: 0
  };
  pvpSyncDisplay();
  playerPath = [{ x: player.x, y: player.y }];
  attackIndices = []; skillIndices = [];
  resetTurnState({ clearCounter: true });
  phase = PHASE.PLANNING;
  battleRound = 1;
  clearLog();
  log('⚔️ 联机对战开始');
  log('你：' + (CHARACTERS[selectedChar] ? CHARACTERS[selectedChar].name : selectedChar) +
      '　对手：' + pvpNames[1 - pvpSlot] + '（' + (CHARACTERS[peer.charId] ? CHARACTERS[peer.charId].name : peer.charId) + '）');
  log('回合 ' + (pvpTurn + 1) + '：规划你的路径与攻击节点，然后点「开始」。');
  if (rookieInPvp) log('⚠️ 联机模式里「预备干员」不参与自由分配：双方都按全 8 静态六维作战（加点仅单人局生效）。');
  if (typeof updateCellSize === 'function') updateCellSize();
  render();
}

function pvpSyncDisplay() {
  if (!pvpUnits || !player || !peer) return;
  const mine = pvpUnits[pvpSlot], foe = pvpUnits[1 - pvpSlot];
  player.x = mine.x; player.y = mine.y;
  player.hp = mine.hp; player.maxHp = mine.maxHp; player.alive = mine.alive;
  if (mine.facing) player.facing = mine.facing;
  playerStats.currentHp = mine.hp;
  peer.x = foe.x; peer.y = foe.y;
  peer.hp = foe.hp; peer.maxHp = foe.maxHp; peer.alive = foe.alive;
  if (foe.facing) peer.facing = foe.facing;
}

/* ---------------- 回合：提交计划 ---------------- */
function pvpSubmitPlan() {
  if (pvpOver || pvpWaiting || phase !== PHASE.PLANNING) return;
  if (skillIndices.length) log('⚠️ 联机模式暂不支持技能节点，本回合的技能标记已被忽略。');
  const plan = {
    charId: selectedChar,
    path: playerPath.map(function (p) { return { x: p.x, y: p.y }; }),
    attackIndices: attackIndices.slice()
  };
  pvpWaiting = true;
  phase = PHASE.RESOLVING;
  log('📤 计划已提交，等待对手…');
  render();
  PVP_NET.plan(pvpTurn, plan).then(function (r) {
    if (!r.waiting) log('双方计划齐备，开始结算…');
  }).catch(function (e) {
    pvpWaiting = false;
    phase = PHASE.PLANNING;
    log('⚠️ 提交失败：' + e.message);
    render();
  });
}

/* ---------------- 回合：播放结算 ---------------- */
async function pvpPlayTurn(turn, plans, seed) {
  log('—— 第 ' + (turn + 1) + ' 回合结算（seed ' + seed + '）——');
  let res;
  try {
    res = pvpResolveTurn(CHARACTERS, pvpUnits, plans, seed);
  } catch (e) {
    log('⚠️ 结算异常：' + e.message);
    return;
  }
  /* 播放动画失败不能拖死整局：ready 必须照发，否则对手会一直卡在等待 */
  try {
    await pvpPlayEvents(res.events);
  } catch (e) {
    log('⚠️ 结算动画异常（已跳过剩余特效）：' + e.message);
    console.error('[PVP] playEvents', e);
  }
  pvpUnits = res.units;
  pvpSyncDisplay();
  refreshUnits();
  if (res.winner >= 0) { pvpFinish(res.winner); return; }
  PVP_NET.ready(turn).catch(function () {});
}

async function pvpPlayEvents(events) {
  for (let i = 0; i < events.length; i++) {
    const ev = events[i];
    const mine = (ev.slot === pvpSlot);
    if (ev.t === 'move') {
      const d = mine ? player : peer;
      d.x = ev.to.x; d.y = ev.to.y;
      refreshUnits();
      await sleep(UNIT_MOVE_MS);
    } else if (ev.t === 'dodge') {
      const d = mine ? player : peer;
      floatText(d.x, d.y, '闪避 +3AC', '#7dd3fc', true);
      ringFx(d.x, d.y, '#7dd3fc');
      log(pvpNameOf(ev.slot) + ' 驻足闪避，AC → ' + ev.ac);
      await sleep(200);
    } else if (ev.t === 'hit') {
      const t = mine ? peer : player;
      slashFx(t.x, t.y, '#ff4500');
      hitFlashCell(t.x, t.y);
      floatText(t.x, t.y, (ev.crit ? '暴击 -' : '-') + ev.dmg, ev.crit ? '#ffd700' : '#ff5c5c', true);
      t.hp = ev.hp;
      refreshUnits();
      log(pvpNameOf(ev.slot) + ' 命中 ' + pvpNameOf(1 - ev.slot) + '，' + (ev.crit ? '暴击 ' : '') +
          ev.dmg + ' 点（d20=' + ev.d20 + (ev.crit ? ' 自然20' : '') + ' vs AC' + ev.ac + '）');
      await sleep(280);
    } else if (ev.t === 'miss') {
      const t = mine ? peer : player;
      missFx(t.x, t.y);
      log(pvpNameOf(ev.slot) + ' 落空（d20=' + ev.d20 + ' vs AC' + ev.ac + '）');
      await sleep(220);
    } else if (ev.t === 'whiff') {
      const d = mine ? player : peer;
      floatText(d.x, d.y, '射程外', '#888');
      log(pvpNameOf(ev.slot) + ' 的攻击够不着对手，空挥');
      await sleep(200);
    } else if (ev.t === 'clash') {
      floatText(ev.cell.x, ev.cell.y, '相杀！', '#ff4500', true);
      ringFx(ev.cell.x, ev.cell.y, '#ff4500');
      slashFx(ev.cell.x, ev.cell.y, '#ff4500');
      player.hp = ev.hp[pvpSlot];
      peer.hp = ev.hp[1 - pvpSlot];
      refreshUnits();
      log('相杀！双方各受暴击 ' + ev.dmg[0] + ' / ' + ev.dmg[1] + ' 点');
      await sleep(400);
    } else if (ev.t === 'blocked') {
      const d = mine ? player : peer;
      floatText(d.x, d.y, '被挡', '#bbb');
      log(pvpNameOf(ev.slot) + ' 被挡住，停止移动');
      await sleep(160);
    } else if (ev.t === 'invalid') {
      log('⚠️ ' + pvpNameOf(ev.slot) + ' 的计划含非法步，移动被中止');
    } else if (ev.t === 'death') {
      const d = (ev.slot === pvpSlot) ? player : peer;
      d.alive = false;
      refreshUnits();
      log('💀 ' + pvpNameOf(ev.slot) + ' 倒下了');
      await sleep(320);
    }
  }
}

function pvpFinish(winner) {
  pvpOver = true;
  pvpWaiting = false;
  const draw = winner < 0;
  const win = (winner === pvpSlot);
  phase = PHASE.PVP_OVER;   // 不能是 GAMEOVER，否则会被主页钩子当成单人死亡上报成绩
  log(draw ? '🤝 同归于尽，平局。' : (win ? '🏆 你赢了！' : '💀 你输了。'));
  render();
  pvpShowResult(draw ? null : win);
}

function pvpShowResult(result) {
  const draw = (result === null);
  const title = draw ? '🤝 平局' : (result ? '🏆 胜利' : '💀 落败');
  const color = draw ? '#9aa0c0' : (result ? '#ffd166' : '#e74c3c');
  const mask = document.createElement('div');
  mask.className = 'pvp-result';
  mask.innerHTML =
    '<div class="pvp-result-card">' +
      '<div class="pvp-result-title" style="color:' + color + '">' + title + '</div>' +
      '<div class="pvp-result-sub">对手：' + (pvpNames[1 - pvpSlot] || '对手') + '</div>' +
      '<button id="pvpBack">返回角色选择</button>' +
    '</div>';
  document.body.appendChild(mask);
  mask.querySelector('#pvpBack').onclick = function () {
    mask.remove();
    mode = 'solo';
    pvpUnits = null; peer = null;
    initCharSelect();
  };
}

/* ---------------- 事件接线 ---------------- */
PVP_NET.on('start', function (ev) {
  pvpNames = ev.slots || ['房主', '挑战者'];
  pvpChars = ev.chars || ['', ''];
  pvpSlot = PVP_NET.slot();
  pvpClosePanel();
  pvpStartMatch();
});
PVP_NET.on('turn', function (ev) {
  if (mode !== 'pvp' || pvpOver) return;
  const plans = [ev.plans && ev.plans['0'], ev.plans && ev.plans['1']];
  if (!plans[0] || !plans[1]) { log('⚠️ 对手计划缺失，本回合跳过'); return; }
  pvpPlayTurn(ev.turn, plans, ev.seed).catch(function (e) {
    log('⚠️ 回合结算失败：' + e.message);
    console.error('[PVP] playTurn', e);
    PVP_NET.ready(ev.turn).catch(function () {});   // 兜底推进，避免双方互相等待
  });
});
PVP_NET.on('next', function (ev) {
  if (mode !== 'pvp' || pvpOver) return;
  pvpTurn = ev.turn;
  pvpWaiting = false;
  playerPath = [{ x: player.x, y: player.y }];
  attackIndices = []; skillIndices = [];
  resetTurnState({ clearCounter: true });
  phase = PHASE.PLANNING;
  log('—— 第 ' + (ev.turn + 1) + ' 回合：请规划 ——');
  render();
});
PVP_NET.on('peer_left', function (ev) {
  if (mode !== 'pvp') return;
  log('⚠️ 对手离开了房间');
  pvpOver = true;
  phase = PHASE.PVP_OVER;
  render();
  pvpShowResult(true);
});
PVP_NET.on('closed', function (ev) {
  if (mode !== 'pvp') return;
  log('⚠️ 与房间服务的连接断开：' + ev.reason);
  pvpOver = true;
  phase = PHASE.PVP_OVER;
  render();
});

/* ---------------- UI ---------------- */

/* ★★ ISSUE-20261029-27（2026-10-29，人类拍板「先关闭联机系统，PVP 搁置」）
 * 联机唯一开关。改回 true 即完整恢复（按钮 / 面板 / 建房 / 加入 / 房间流程的代码一行没删）。
 * 为什么用开关而不是删代码：联机不是「坏的」，是「先不开」；删了以后要重写，
 * 而且 pvp-core.js 的协议、pvpMakeUnit 的镜像逻辑都是花时间调出来的。
 * ★ 关闭时的实际效果：设置抽屉里看不到「⚔️ 联机」按钮，且 #pvpMask 根本不会被创建
 *   → 客户端不存在任何可达的联机入口（连手改 DOM 找按钮也没有，因为它 display:none 且没绑定）。 */
const PVP_ENABLED = true;

function pvpInjectUI() {
  /* 闸门放在最前面：不建 style、不建 #pvpMask、不给 #setPvpBtn 绑 onclick */
  if (!PVP_ENABLED) {
    const b = document.getElementById('setPvpBtn');
    if (b) { b.hidden = true; b.style.display = 'none'; }
    return;
  }
  const style = document.createElement('style');
  style.textContent = [
    '#pvpBtn{position:fixed;right:10px;bottom:64px;z-index:9000;padding:9px 14px;border-radius:22px;',
    'font-size:14px;font-weight:600;font-family:inherit;background:rgba(45,108,223,.9);color:#fff;',
    'border:1px solid rgba(255,255,255,.25);cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4)}',
    '#pvpMask{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;',
    'background:rgba(6,8,20,.9);padding:16px;font-family:inherit}',
    '#pvpMask.open{display:flex}',
    '.pvp-card{width:100%;max-width:380px;background:#1b1e3a;border:1px solid #2f3460;border-radius:14px;',
    'padding:16px;color:#e8e8f0}',
    '.pvp-card h3{margin:0 0 12px;font-size:16px}',
    '.pvp-card label{display:block;font-size:12px;color:#9aa0c0;margin:10px 0 4px}',
    '.pvp-card input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid #33385f;',
    'background:#12142a;color:#e8e8f0;font-size:14px;box-sizing:border-box}',
    '.pvp-chars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}',
    '.pvp-chars button{padding:8px 0;border-radius:8px;border:1px solid #33385f;background:#20244a;',
    'color:#cfd3e8;font-size:12px;cursor:pointer;font-family:inherit}',
    '.pvp-chars button.on{border-color:#ffd166;background:#3a3410;color:#ffd166}',
    '.pvp-actions{display:flex;gap:8px;margin-top:14px}',
    '.pvp-actions button{flex:1;padding:10px;border-radius:8px;border:1px solid #3a3f6e;',
    'background:#2a2e52;color:#e8e8f0;font-size:14px;cursor:pointer;font-family:inherit}',
    '.pvp-actions button.primary{background:#2d6cdf;border-color:#2d6cdf;font-weight:600}',
    '#pvpStatus{margin-top:12px;font-size:12px;color:#9aa0c0;line-height:1.6;word-break:break-all}',
    '#pvpRoom{color:#ffd166;font-size:18px;font-weight:700;letter-spacing:3px}',
    '.pvp-result{position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;',
    'background:rgba(6,8,20,.92);font-family:inherit}',
    '.pvp-result-card{background:#1b1e3a;border:1px solid #2f3460;border-radius:14px;padding:26px 30px;text-align:center}',
    '.pvp-result-title{font-size:26px;font-weight:700;margin-bottom:8px}',
    '.pvp-result-sub{color:#9aa0c0;font-size:13px;margin-bottom:18px}',
    '.pvp-result-card button{padding:10px 18px;border-radius:8px;border:1px solid #3a3f6e;background:#2a2e52;',
    'color:#e8e8f0;font-size:14px;cursor:pointer;font-family:inherit}'
  ].join('');

  document.head.appendChild(style);
  // 「联机」按钮已并入左上角「设置」面板（#setPvpBtn），不再生成右下角悬浮按钮
  const btn = document.getElementById('setPvpBtn');

  const mask = document.createElement('div');
  mask.id = 'pvpMask';
  mask.innerHTML =
    '<div class="pvp-card">' +
      '<h3>⚔️ 联机对战</h3>' +
      '<label>房间服务地址（https 隧道域名，末尾不要斜杠）</label>' +
      '<input id="pvpBase" placeholder="https://xxx.trycloudflare.com">' +
      '<label>昵称</label>' +
      '<input id="pvpName" value="玩家">' +
      '<label>选角色</label>' +
      '<div class="pvp-chars" id="pvpChars"></div>' +
      '<label>房间号（加入时填）</label>' +
      '<input id="pvpRoomIn" placeholder="A1B2C3" style="text-transform:uppercase">' +
      '<div class="pvp-actions">' +
        '<button class="primary" id="pvpCreate">建房</button>' +
        '<button id="pvpJoin">加入</button>' +
      '</div>' +
      '<div id="pvpStatus"></div>' +
    '</div>';
  document.body.appendChild(mask);

  const charsBox = mask.querySelector('#pvpChars');
  Object.keys(CHARACTERS).forEach(function (id) {
    const b = document.createElement('button');
    b.textContent = CHARACTERS[id].icon + ' ' + CHARACTERS[id].name;
    b.dataset.id = id;
    if (id === pvpPick) b.classList.add('on');
    b.onclick = function () {
      pvpPick = id;
      charsBox.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    };
    charsBox.appendChild(b);
  });

  try {
    const saved = localStorage.getItem('ark_pvp_base');
    if (saved) mask.querySelector('#pvpBase').value = saved;
  } catch (e) {}

  function status(t) { mask.querySelector('#pvpStatus').innerHTML = t; }
  function base() {
    const b = mask.querySelector('#pvpBase').value.trim();
    if (!b) { status('⚠️ 先填房间服务地址'); return null; }
    try {
      PVP_NET.setBase(b);
      try { localStorage.setItem('ark_pvp_base', b); } catch (e) {}
      return b;
    } catch (e) { status('⚠️ ' + e.message); return null; }
  }

  btn.onclick = function () { mask.classList.add('open'); };
  mask.onclick = function (e) { if (e.target === mask) mask.classList.remove('open'); };

  mask.querySelector('#pvpCreate').onclick = function () {
    if (!base()) return;
    status('建房中…');
    PVP_NET.create(mask.querySelector('#pvpName').value.trim() || '房主', pvpPick)
      .then(function (j) {
        status('房间已创建，把房间号发给对手：<br><span id="pvpRoom">' + j.room + '</span><br>等他加入…');
      })
      .catch(function (e) { status('⚠️ 建房失败：' + e.message); });
  };
  mask.querySelector('#pvpJoin').onclick = function () {
    if (!base()) return;
    const r = mask.querySelector('#pvpRoomIn').value.trim().toUpperCase();
    if (!r) { status('⚠️ 先填房间号'); return; }
    status('加入中…');
    PVP_NET.join(r, mask.querySelector('#pvpName').value.trim() || '挑战者', pvpPick)
      .catch(function (e) { status('⚠️ 加入失败：' + e.message); });
  };
}

function pvpClosePanel() {
  const m = document.getElementById('pvpMask');
  if (m) m.classList.remove('open');
}

<!-- @inject:scripts:beforeDlcChrome -->

initCharSelect();
pvpInjectUI();
</script>
