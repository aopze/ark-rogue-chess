<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟战棋</title>
<style>
  * { box-sizing: border-box; }
  :root { --cell: 50px; --unit-move-ms: 120ms;
          /* ISSUE-20261029-21：角标相对 #boardWrap 的偏移（棋盘居中留下的边距），
             updateCellSize() 会改写；无 JS 时退回 0，角标仍贴在容器角上不跑位。 */
          --corner-x: 0px; --corner-y: 0px; }
  body { font-family: system-ui, -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; background:#1a1a2e; color:#eee; margin:0; padding:0; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; display:flex; flex-direction:column; touch-action: manipulation; }
  #topbar { display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; padding: 4px 12px; }
  #topbar h1 { font-size:18px; margin:4px 0; text-align:center; }
  /* ISSUE-20261028-09 A：地图贴左（原来 justify-content:center 会在侧栏挤压下把地图推到中间，
     左右都留白）；棋盘容器尺寸由 updateCellSize() 按「可用短边」写死，故 flex 不再增长。 */
  #game { display:flex; gap:8px; padding: 8px 16px 16px 16px; flex-grow: 1; min-height: 0; justify-content:flex-start; }
  /* 正方形棋盘：宽高都由 JS 设成同一个像素值（短边），aspect-ratio 只是无 JS 时的兜底。
     不能用 flex-grow —— 一旦拉伸就会破坏 1:1。 */
  #boardWrap { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; position:relative; min-width: 0; min-height: 0; overflow: hidden; aspect-ratio: 1 / 1; }
  /* ISSUE-18 B5：iOS Safari 长按会弹「拷贝/放大镜」，拖动跟随前必须关掉 callout */
  #board { display:grid; grid-auto-rows: var(--cell); gap:2px; padding:0; border-radius:4px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; position: relative; }
  #unitLayer { position:absolute; inset:0; pointer-events:none; z-index:40; overflow:visible; }
  #fxLayer { position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:50; }
  /* 正方形格子（ISSUE-20261028-09 A）：原来 height 是 calc(var(--cell) * 1.12)，
     整块地图因此永远被竖向拉长；1:1 后地图才是正方。 */
  .cell { width: var(--cell); height: var(--cell); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.44); border-radius:2px; cursor:pointer; user-select:none; position:relative; overflow:hidden; }
  .cell.empty { background:#2d2d44; }
  .cell.void { background:transparent; cursor:default; pointer-events:none; }
  .cell.wall { background:#4a4a5a; cursor:not-allowed; border-radius:4px; }
  /* ISSUE-20261028-10-B：粗圆岩 = Boss 落的动态墙。用暖褐 + 内描边和灰墙区分开，
     但又不能比敌人/玩家更抢眼（它是地形，不是单位）。 */
  .cell.rock { background:#6b5233; cursor:not-allowed; border-radius:4px;
    box-shadow: inset 0 0 0 1px rgba(255,206,140,.45); }
  .cell.path { background:#3a5a8c; }
  /* 闪避节点：第一次等待（蓝色描边 + 内部蓝调） */
  .cell.dodge { box-shadow: inset 0 0 0 2px #7dd3fc; background:#2f5578; }
  .cell.dodge.attack { box-shadow: inset 0 0 0 2px #7dd3fc, inset 0 0 0 999px rgba(192,57,43,.35); }
  /* ISSUE-20261029-41：路径格朝向箭头 —— 指向「从这一格出发」的下一步方向。
     放右上角（右下角是单位朝向指示、格中央是节点/图标），0.3 格大小、30% 不透明，不抢注意力。
     四个方向靠旋转同一个向上三角实现，避免四套 border 组合写错。 */
  .cell-dir { position:absolute; top:9%; right:9%; width:0; height:0; opacity:.3; pointer-events:none;
    border-left: calc(var(--cell) * 0.13) solid transparent;
    border-right: calc(var(--cell) * 0.13) solid transparent;
    border-bottom: calc(var(--cell) * 0.22) solid #dbe4ff; }
  .cell-dir.l { transform: rotate(-90deg); }
  .cell-dir.r { transform: rotate(90deg); }
  .cell-dir.d { transform: rotate(180deg); }
  .cell.attack { background:#c0392b; }
  .cell.attack.used { background:#5c2b29; }
  /* 技能节点（双击设置）：紫色底 + 紫描边 + ✦ */
  .cell.skill { background:#5b3a8c; box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.used { background:#3d2a5c; }
  .cell.attack.skill { background: linear-gradient(135deg, #c0392b 0 45%, #5b3a8c 55% 100%); box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.dodge { box-shadow: inset 0 0 0 2px #c9a0ff, inset 0 0 0 4px #7dd3fc; }
  /* 攻击范围：在地块上叠一层蓝色（与路径格 #3a5a8c 接近），不遮挡格子内容 */
  .cell.in-range { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25); }
  .cell.in-range.attack, .cell.in-range.skill { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25), inset 0 0 0 1px rgba(201,160,255,.65); }
  .cell.item-cell { background: #4a1e2f; box-shadow: inset 0 0 10px #ff6b6b; }
  .cell.blood-cell { background: #3d1515; }
  .cell.exit-cell { background: #27ae60; box-shadow: inset 0 0 15px #2ecc71; }
  .cell.hitflash { animation: hitflash .35s ease-out; }
  @keyframes hitflash { 0%{box-shadow: inset 0 0 0 40px rgba(255,80,80,.9);} 100%{box-shadow: inset 0 0 0 0 rgba(255,80,80,0);} }
  .item-pulse { animation: itemPulse 1.5s ease-in-out infinite; display:inline-block; }
  @keyframes itemPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  /* 单位渲染（格内静态 .unit + 绝对定位 .unit-abs）共用同一套外观，避免两处分别维护 */
  .unit, .unit-abs { display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; pointer-events:none; position:relative; }
  .unit { width:100%; height:100%; }
  .unit-abs { position:absolute; left:0; top:0; width:auto; height:auto; transition: transform var(--unit-move-ms) linear; will-change: transform; border-radius:2px; }
  .unit .icon, .unit-abs .icon { font-size: calc(var(--cell) * 0.55); line-height:1; display:flex; align-items:center; justify-content:center; }
  .unit .icon.ghost-icon, .unit-abs .icon.ghost-icon { opacity: 0.7; filter: drop-shadow(0 0 5px #fff); }
  /* 选角大厅角色（ISSUE-20261028-12）：连续坐标 + 绝对定位。
     自由移动期间必须 transition:none —— 每帧写 transform 时若还有 transition，
     会把每帧目标再缓动一次，出现拖尾/松手后还在滑。 */
  .cand-unit { position:absolute; left:0; top:0; display:flex; align-items:center; justify-content:center;
    transition:none; will-change:transform; pointer-events:none; border-radius:6px; }
  .cand-unit .cand-icon { font-size: calc(var(--cell) * 0.55); line-height:1; display:flex; align-items:center; justify-content:center; }
  .cand-unit.sel { outline:3px solid #f39c12; box-shadow: inset 0 0 15px rgba(243,156,18,0.55); }
  /* 词缀 / 精英标记（ISSUE-20261028-05）：词缀做成右上角小标签，精英用金边 + 星标。
     刻意不用 CSS filter 改图标色 —— 会把 emoji 与后续像素画（ISSUE-07）的色阶一起毁掉。 */
  .affix-tag { position:absolute; top:0; right:0; display:flex; gap:1px; align-items:center;
    font-size: calc(var(--cell) * 0.2); line-height:1; padding:1px 2px; border-radius:4px;
    background: rgba(0,0,0,0.66); color:#ffd93d; font-weight:900; letter-spacing:0;
    pointer-events:none; z-index:46; white-space:nowrap; }
  .unit-abs.ua-elite { outline:2px solid #ffd700; outline-offset:-2px;
    box-shadow: inset 0 0 10px rgba(255,215,0,0.45); }
  .unit-abs.ua-elite .icon { text-shadow: 0 0 6px #ffd700; }
  .unit .hp-bar, .unit-abs .hp-bar { width: 78%; height: 3px; background: rgba(0,0,0,0.55); border-radius: 2px; margin-top: 1px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 2px rgba(0,0,0,0.6); }
  .unit .hp-fill, .unit-abs .hp-fill { height: 100%; border-radius: 2px; transition: width 0.25s ease; }
  .unit-abs.ua-player { outline:2px solid #4ecdc4; outline-offset:-2px; }
  .unit-abs.ua-player.ua-charging { outline:3px solid #ffd700; outline-offset:-3px; box-shadow: inset 0 0 15px #ffd700; }
  .unit-abs.ua-player.ua-attacked { outline:2px dashed #ffb86b; outline-offset:-2px; }
  .unit-abs.ua-enemy { outline:2px solid #e74c3c; outline-offset:-2px; }
  /* ISSUE-20261029-28：召唤出来的小队成员 = 友军，绿框，与玩家青框 / 敌人红框区分 */
  .unit-abs.ua-squad { outline:2px solid #4ade80; outline-offset:-2px; box-shadow: inset 0 0 8px rgba(74,222,128,0.25); }
  .unit-abs.ua-stunned { opacity: 0.55; filter: grayscale(0.35); }
  .unit-abs.ua-stunned::after {
    content: '💫';
    position: absolute;
    top: -2px;
    right: -2px;
    font-size: calc(var(--cell) * 0.28);
    animation: stunSpin 1.8s linear infinite;
    pointer-events: none;
    text-shadow: 0 0 4px #ffd700;
  }
  @keyframes stunSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .facing-ind { position: absolute; font-size: calc(var(--cell) * 0.2); color: rgba(255,255,255,0.55); text-shadow: 0 0 3px #000, 0 0 2px #000; line-height: 1; pointer-events: none; font-weight: 900; z-index: 2; }
  .facing-ind.r { right: 1px; top: 50%; transform: translateY(-50%); }
  .facing-ind.l { left: 1px; top: 50%; transform: translateY(-50%); }
  .facing-ind.d { bottom: 0; left: 50%; transform: translateX(-50%); }
  .facing-ind.u { top: 0; left: 50%; transform: translateX(-50%); }
  .enemy-arrow { position:absolute; width: calc(var(--cell) * 0.4); height: calc(var(--cell) * 0.4); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.3); font-weight:900; color:#ffd93d; background:rgba(0,0,0,0.6); border-radius:50%; text-shadow:0 0 4px #000, 0 0 6px #ffd93d; transform:translate(-50%,-50%); z-index:45; pointer-events:none; }
  .bullet { position:absolute; width:12px; height:12px; border-radius:50%; background:#ffe66d; box-shadow:0 0 10px 3px #ffd93d, 0 0 22px 6px rgba(255,217,61,.5); transform:translate(-50%,-50%); z-index:20; }
  .bullet.crit { background:#ff4500; box-shadow:0 0 12px 4px #ff4500, 0 0 26px 8px rgba(255,69,0,.6); width:14px; height:14px; }
  .bullet.alien { background:#a55eea; box-shadow:0 0 10px 3px #a55eea, 0 0 22px 6px rgba(165,94,234,.5); width:14px; height:14px; }
  .float-text { position:absolute; font-weight:900; font-size:20px; text-shadow:0 0 6px #000, 0 0 2px #000; pointer-events:none; z-index:30; transform:translate(-50%,-50%); white-space:nowrap; }
  .float-text.crit { font-size:26px; color:#ffd700 !important; text-shadow:0 0 10px #ff4500, 0 0 4px #000; }
  .float-text.crosskill { font-size:26px; color:#ff4500 !important; text-shadow:0 0 12px #ff4500, 0 0 4px #000, 0 0 2px #000; letter-spacing:2px; }
  .ring-fx { position:absolute; width:46px; height:46px; border:4px solid #fff; border-radius:50%; transform:translate(-50%,-50%); z-index:25; }
  .slash-fx { position:absolute; width:52px; height:52px; z-index:26; transform:translate(-50%,-50%); }
  .slash-fx::before, .slash-fx::after { content:''; position:absolute; left:50%; top:50%; width:6px; height:46px; background:linear-gradient(180deg,#fff,#ffb86b); border-radius:4px; transform:translate(-50%,-50%) rotate(45deg); box-shadow:0 0 8px #ffb86b; }
  .slash-fx::after { transform:translate(-50%,-50%) rotate(-45deg); }
  /* 侧栏收窄（ISSUE-20261028-09 B）：六维图搬进抽屉后，侧栏只剩角色卡与日志占位，
     再留 33vw 会把棋盘挤成小方块。 */
  #sidebar { width: clamp(280px, 28vw, 450px); flex-shrink: 0; display:flex; flex-direction:column; gap:8px; height: 100%; min-height: 0; overflow: hidden; }
  #dragHandle { flex: 0 0 16px; align-self: stretch; cursor: col-resize; position: relative; user-select: none; touch-action: none; }
  /* 细分隔线（颜色加深） */
  #dragHandle::before { content: ""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; transform: translateX(-50%); background: #10101e; border-radius: 2px; }
  /* 中间竖胶囊 */
  #dragHandle .grip { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 9px; height: 50px; border-radius: 6px; background: linear-gradient(180deg, #34334d, #2d2d44); box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.45); transition: background .15s, box-shadow .15s; }
  /* 胶囊上的细小抓握点 */
  #dragHandle .grip::before, #dragHandle .grip::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; border-radius: 50%; background: rgba(220,226,255,.55); }
  #dragHandle .grip::before { top: 16px; }
  #dragHandle .grip::after { bottom: 16px; }
  #dragHandle:hover .grip, #dragHandle.dragging .grip { background: linear-gradient(180deg, #3f3e5c, #353552); box-shadow: 0 0 0 1px rgba(150,160,210,.45), 0 2px 8px rgba(0,0,0,.5); }
  /* 侧栏角色卡 #hero 已整块删除（ISSUE-20261029-38）：信息并入「行动按钮上方 HUD」 */
  #radarWrap { display: flex; align-items: center; justify-content: center; }
  /* 六维图搬进抽屉后可以画大一点：抽屉宽 min(360px,86vw)，减 padding 后仍有余量 */
  #radarCanvas { display: block; width: min(268px, 74vw); height: min(268px, 74vw); touch-action: manipulation; }
  .hero-top { display:flex; align-items:baseline; gap:5px; flex-wrap:wrap; }
  .hero-name { font-size:14px; font-weight:900; color:#4ecdc4; letter-spacing:1px; white-space:nowrap; }
  /* 等级：紧贴名字右侧（金色），用于替代原先画在六维图中心的 Lv */
  .hero-lv-gold { font-size:12px; font-weight:900; color:#ffd700; letter-spacing:.5px; white-space:nowrap; text-shadow:0 0 6px rgba(255,215,0,.25); }
  .hero-lv { font-size:11px; font-weight:800; color:#8a8aa5; white-space:nowrap; margin-left:auto; }
  .hp-track { position:relative; height:13px; border-radius:7px; background:#101019; box-shadow:inset 0 0 0 1px #34344f; overflow:hidden; }
  .hp-fill-lg { display:block; height:100%; border-radius:7px; background:linear-gradient(90deg,#2ecc71,#4ecdc4); transition:width .25s ease; }
  .hp-track.warn .hp-fill-lg { background:linear-gradient(90deg,#e67e22,#f1c40f); }
  .hp-track.danger .hp-fill-lg { background:linear-gradient(90deg,#c0392b,#e74c3c); }
  .hp-track.danger { box-shadow:inset 0 0 0 1px rgba(231,76,60,.75), 0 0 8px rgba(231,76,60,.25); }
  .hp-text { position:absolute; inset:0; display:block; text-align:center; line-height:13px; font-size:10px; font-weight:900; letter-spacing:.5px; text-shadow:0 0 3px #000,0 0 2px #000; }
  /* ---- 技力条：比血条短、细，蓝色调（风格与血条一致） ---- */
  .sp-track { position:relative; width:100%; height:10px; border-radius:5px; background:#101019; box-shadow:inset 0 0 0 1px #30425f; overflow:hidden; }
  .sp-fill { display:block; height:100%; border-radius:5px; background:linear-gradient(90deg,#2f6fe0,#5cc9f5); transition:width .25s ease; }
  .sp-track.max .sp-fill { background:linear-gradient(90deg,#3f86ff,#7fd9ff); box-shadow:0 0 8px rgba(110,190,255,.9); }
  .sp-track.max { box-shadow:inset 0 0 0 1px rgba(120,200,255,.85), 0 0 8px rgba(90,170,255,.35); }
  .sp-track.max .sp-text { color:#062339; text-shadow:0 1px 1px rgba(255,255,255,.35); }
  .sp-text { position:absolute; inset:0; display:block; text-align:center; line-height:10px; font-size:8px; font-weight:900; letter-spacing:.5px; color:#eaf6ff; text-shadow:0 1px 2px #000,0 0 3px #001a33; }
  /* 条内标签（HP / SP）：半透明字母，位于数值左侧 */
  .bar-lbl { font-style:normal; opacity:.5; font-weight:700; letter-spacing:.5px; margin-right:3px; }
  /* ---- 经验条：方形无圆角（「方形=信息」，ISSUE-20261028-10） ---- */
  .xp-track { position:relative; width:100%; height:4px; background:#101019; box-shadow:inset 0 0 0 1px #3a3550; overflow:hidden; }
  .xp-fill { display:block; height:100%; background:linear-gradient(90deg,#8a6b1f,#ffd700); transition:width .25s ease; }
  /* ---- 护盾（药枚）：血条内右侧叠一段白条，每层 12% ---- */
  .hp-shield { position:absolute; top:0; bottom:0; right:0; border-radius:0 7px 7px 0;
    background:linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,.92));
    box-shadow:0 0 6px rgba(255,255,255,.55); transition:width .25s ease; pointer-events:none; }
  .hp-shield::after { content:''; position:absolute; left:0; top:0; bottom:0; width:1px; background:rgba(255,255,255,.95); }

  /* ---- 升级奖励选择（全屏遮罩） ---- */
  .lv-mask { position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(4,6,12,.82); backdrop-filter:blur(3px); }
  .lv-panel { width:min(900px,100%); max-height:90vh; overflow:auto; background:#12121c;
    border:1px solid #2f2f4a; border-radius:14px; padding:18px 18px 20px;
    box-shadow:0 18px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(255,215,0,.12) inset; }
  .lv-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .lv-title { font-size:20px; font-weight:900; color:#ffd700; letter-spacing:1px; }
  .lv-lv { font-size:13px; font-weight:900; color:#8fe28a; }
  .lv-sub { font-size:12px; color:#8f95a8; margin:6px 0 14px; line-height:1.6; }
  .lv-cards { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  .lv-card { position:relative; background:#171724; border:1px solid #33334d; border-radius:12px;
    padding:14px 13px; cursor:pointer; transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:4px; text-align:left; color:inherit; font:inherit; }
  .lv-card:hover { transform:translateY(-3px); border-color:#ffd700; box-shadow:0 10px 24px rgba(255,215,0,.16); }
  .lv-card:active { transform:translateY(-1px); }
  .lv-card .ico { font-size:26px; line-height:1.1; }
  .lv-card .nm { font-size:14px; font-weight:900; color:#fff; letter-spacing:.5px; }
  .lv-card .ds { font-size:12px; color:#a9b0c2; line-height:1.5; }
  .lv-card .own { margin-top:auto; padding-top:8px; font-size:11px; color:#7f8698; }
  .lv-card .own b { color:#ffd700; }
  @media (max-width:760px) {
    .lv-cards { grid-template-columns:1fr; gap:9px; }
    .lv-panel { padding:14px; border-radius:12px; }
    .lv-title { font-size:17px; }
    .lv-card { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:10px; row-gap:2px; align-items:center; }
    .lv-card .ico { grid-row:1 / span 3; font-size:22px; }
    .lv-card .nm, .lv-card .ds, .lv-card .own { grid-column:2; }
    .lv-card .own { padding-top:2px; }
  }
  .chip { font-size:11px; font-weight:700; padding:0 7px; border-radius:9px; background:#2c2c47; color:#c3c3da; white-space:nowrap; line-height:1.6; }
  .chip.teal { background:#0f3a38; color:#4ecdc4; }
  .chip.gold { background:#453609; color:#ffd700; }
  .chip.green { background:#20380f; color:#8fe28a; }
  #stats { flex: 1 1 auto; min-height: 0; overflow-y: auto; display:flex; flex-direction:column; gap:6px; }
  #footBar { flex-shrink:0; }
  /* 竖屏：把「开始行动」按钮放到六维图上方（横屏时按钮仍在底部 #controls） */
  #actionSlot { display: none; }
  body.layout-v #actionSlot { display: block; flex: 0 0 auto; }
  body.layout-v #actionSlot .start-btn { width: 100%; }
  #controls { flex-shrink: 0; display:flex; flex-direction:column; gap:8px; min-height: 90px; }
  #controls:empty { min-height: 0; }
  /* =========================================================================
   * 抽屉体系（ISSUE-20261028-09 G）
   * 设计语言：方形 = 信息 · 圆形 = 交互（仅手机）· 浮层 = 从右侧滑入的侧边栏。
   * 旧的 #logPanel「可拖动悬浮窗」整体废除 —— 不允许凭空悬浮，也没有拖动位置记忆。
   * z-index 一律收敛成变量，禁止各处硬编码（--z-corner 是地图角标专用：30，必须低于单位层 40）。
   * ========================================================================= */
  :root { --z-corner: 30; --z-mask: 1100; --z-drawer: 1101; --z-vpad: 1002; }
  /* 地图角标（ISSUE-20261029-21 · B 方案「叠层」；20261029-36 增角色面板）：
     ⚙ 设置 → 棋盘右上格；👤 账号与排行 → 棋盘左上格；♟️ 角色面板 → 棋盘右下格。尺寸 = 恰好一个格子（var(--cell)），
     随格子缩放；两者共用同一套样式（大小 / 圆角 / 配色 / 高亮态 / aria）。
     --corner-x / --corner-y 由 updateCellSize() 算出：#board 在 #boardWrap 里居中，
     四周可能各剩几像素，角标要贴的是「棋盘」的角而不是容器的角。
     ★ z-index 必须低于 #unitLayer(40)，且单位层本身 pointer-events:none —— 站在角落的
       敌人绘制在角标之上，血条 / 词缀 / 意图不会被盖住（本号 §B 强制处理 1）。
     ★ 代价（人类明确接受）：这两格点不到、也走不上去；攻击 / 技能 / 闪避都是点路径节点，
       所以角落里的敌人照样能打（§B 强制处理 3）。 */
  #setOpenBtn, #lobbyOpenBtn, #charOpenBtn, #cornerExtra {
    position: absolute; top: var(--corner-y); z-index: var(--z-corner);
    display: flex; width: var(--cell); height: var(--cell);
    align-items: center; justify-content: center; padding: 0;
    /* ISSUE-20261029-44 第1项：与「开始行动」(.start-btn) 同款绿色胶囊 */
    background: linear-gradient(135deg, #4ecdc4, #2ecc71); color: #fff;
    border: 1px solid rgba(255,255,255,.28); border-radius: 3px;
    font-size: calc(var(--cell) * 0.5); line-height: 1;
    cursor: pointer; touch-action: manipulation; font-family: inherit;
    box-shadow: 0 2px 8px rgba(46,204,113,.35), inset 0 0 0 1px rgba(0,0,0,.12);
    transition: filter .15s, box-shadow .15s, transform .12s;
  }
  #setOpenBtn { right: var(--corner-x); }
  #lobbyOpenBtn { left: var(--corner-x); }
  /* ★ 角色面板按钮：地图右下格（ISSUE-20261029-36） */
  #charOpenBtn { top: auto; bottom: var(--corner-y); right: var(--corner-x); }
  /* ★ ISSUE-20261029-44 第1项：第 4 角标（地图左下格），先留空占位，绿色，不接功能 */
  #cornerExtra { top: auto; bottom: var(--corner-y); left: var(--corner-x); pointer-events: none; cursor: default; }
  #setOpenBtn:hover, #lobbyOpenBtn:hover, #charOpenBtn:hover { filter: brightness(1.08); }
  #setOpenBtn:active, #lobbyOpenBtn:active, #charOpenBtn:active { transform: scale(.92); }
  /* ★ ISSUE-20261029-44 第3项：打开面板时角标浮到面板之上（z-index > --z-drawer），
     图标变 ✕（drawerSyncChrome），再按一下关闭；不再使用面板内的独立关闭按钮。 */
  #setOpenBtn.on, #lobbyOpenBtn.on, #charOpenBtn.on {
    z-index: calc(var(--z-drawer) + 1);
    box-shadow: 0 0 0 2px #fff inset, 0 2px 8px rgba(46,204,113,.5);
  }
  /* 直开 game.html（无外壳）时 ♟ 由 chrome.js 置 hidden，不留死按钮 */
  #lobbyOpenBtn[hidden] { display: none; }
  /* 遮罩：全屏半透明，抽屉本体 z-index 更高所以露在上面 */
  #drawerMask {
    position: fixed; inset: 0; z-index: var(--z-mask);
    background: rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: opacity .22s ease-out;
  }
  #drawerMask.on { opacity: 1; pointer-events: auto; }
  /* 抽屉本体：统一从右侧滑入 220ms ease-out，宽度 min(360px,86vw) */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: var(--z-drawer);
    width: min(360px, 86vw); display: flex; flex-direction: column;
    background: #15151f; border-left: 1px solid #33334f;
    box-shadow: -12px 0 32px rgba(0,0,0,.5);
    transform: translateX(100%); transition: transform .22s ease-out;
    will-change: transform; overflow: hidden;
  }
  .drawer.on { transform: translateX(0); }
  .drawer-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 10px 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07);
    background: #1b1b2a;
  }
  .drawer-title { font-size: 13px; font-weight: 900; color: #cfe6ff; letter-spacing: 1px; white-space: nowrap; }
  .drawer-x {
    flex: 0 0 auto; margin-left: auto; width: 30px; height: 30px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2c2c47; color: #cfe6ff; border: 1px solid #44445f; border-radius: 7px;
    font-size: 14px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .drawer-x:active { transform: scale(.94); }
  /* ★ 设置面板专用关闭按钮（2026-10-29 人类 01:42 指令）：
     「删掉面板里那个小 ✕，改成和 ⚙ 入口按钮同位置、同尺寸的关闭按钮，再按一下关闭，标题挪到顶部右侧」。
     尺寸/圆角/配色/边框全部照抄 #setOpenBtn（var(--cell)），位置也用同一套 --corner-x / --corner-y，
     所以抽屉滑进来时，视觉上就是「棋盘右上格那个 ⚙ 原地变成了 ✕」，点它即收起（.drawer 是 fixed，
     内部绝对定位的 top/right 与屏幕坐标同源）。
     属性/升级两个抽屉**不动**：它们的入口不在棋盘角上，没有「同一个位置」可对齐。 */
  /* ISSUE-20261029-44 第3项：设置面板内独立关闭按钮已删除，
     改由棋盘右上格的 ⚙ 角标本体（.on 时浮到面板上、变 ✕）关闭。 */
  /* =========================================================================
   * ★ 设置面板改为「覆盖棋盘格」（ISSUE-20261029-29，人类 2026-10-29 04:42）
   *   「设置按钮点开之后，弹窗改成覆盖棋盘格，相当于地图变成了显示设置的面板」。
   * 旧行为：从屏幕右侧滑入的 360px 宽抽屉，地图还露在左边。
   * 新行为：面板直接盖在棋盘那块正方形上（--board-* 由 JS 按 #board 的实时矩形写入），
   *   视觉上就是「地图原地变成了设置面板」，关掉后地图原样露出来。
   * ★ 显隐机制必须换掉：原 .drawer 靠 translateX(100%) 平移到屏幕外收起，
   *   而现在面板左边缘在棋盘位置，向右平移 100% 会正好盖住右侧栏 —— 收起=盖住别的东西。
   *   所以这里改用 opacity + visibility 淡入淡出（ID 选择器优先级高于 .drawer.on，覆盖安全）。
   * ★ 关闭按钮也从「对齐屏幕上的棋盘角」改成「对齐面板自己的右上角」：
   *   面板现在就是棋盘那块，top/right 归零即与 ⚙ 原位重合。
   * ========================================================================= */
  #drawerSettings {
    top: var(--board-top, 0); left: var(--board-left, 0);
    right: auto; bottom: auto;
    width: var(--board-w, min(360px, 86vw));
    height: var(--board-h, 100%);
    max-width: none; border-left: 1px solid #33334f; border-radius: 0; box-shadow: none;
    opacity: 0; visibility: hidden; transform: scale(.985);
    transition: opacity .18s ease-out, transform .18s ease-out, visibility .18s;
  }
  #drawerSettings.on { opacity: 1; visibility: visible; transform: none; }
  /* ISSUE-20261029-44：.drawer-corner-x 已移除（见上） */
  /* =========================================================================
   * ★ 角色面板弹窗（ISSUE-20261029-36）：与设置面板同款「覆盖棋盘格」机制。
   * 正方形（9×9 棋盘 = 正方形），视觉上就是「地图原地变成角色面板」。
   * 显隐同样用 opacity + visibility（ID 选择器优先级高于 .drawer.on，覆盖平移）。
   * 内容：顶部 = 名字；名字下 = 血条；左下 = 六维图；右下 = 空出一栏。无属性按钮。
   * ========================================================================= */
  #drawerChar {
    top: var(--board-top, 0); left: var(--board-left, 0);
    right: auto; bottom: auto;
    width: var(--board-w, min(360px, 86vw));
    height: var(--board-h, 100%);
    max-width: none; border-left: 1px solid #33334f; border-radius: 0; box-shadow: none;
    opacity: 0; visibility: hidden; transform: scale(.985);
    transition: opacity .18s ease-out, transform .18s ease-out, visibility .18s;
  }
  #drawerChar.on { opacity: 1; visibility: visible; transform: none; }
  /* ✕ 已删除（ISSUE-20261029-42）：点面板外部或 Esc 关闭 */
  /* 角色面板内部：上 = 角色信息（与 HUD 同源）／下 = 左六维 · 右 BUFF 池 */
  .char-body { gap: 10px; padding: 10px; }
  .char-top { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px;
    padding: 8px 10px 8px 8px; border-radius: 10px;
    background: linear-gradient(135deg,#26263f,#1c1c2d); border: 1px solid #33334f; }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; flex: 1 1 auto; min-height: 0; }
  .char-radar { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; min-height: 0; }
  .char-radar canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 1 / 1; touch-action: manipulation; }
  .char-alloc { font-size: 11px; font-weight: 800; color: #ffd700; text-align: center; min-height: 14px; line-height: 14px; }
  /* 右下：升级 BUFF 奖励池（层数常驻可见） */
  .char-buffs { display: flex; flex-direction: column; gap: 5px; min-width: 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .char-buffs-title { font-size: 11px; font-weight: 900; color: #8a8aa5; letter-spacing: 1px; flex: 0 0 auto; }
  .char-buff { display: flex; align-items: center; gap: 6px; padding: 4px 7px; border-radius: 6px;
    background: #20202f; box-shadow: inset 0 0 0 1px #33334d; flex: 0 0 auto; }
  .char-buff .ico { font-size: 15px; line-height: 1; flex: 0 0 auto; }
  .char-buff .nm { flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 800; color: #cdd3e2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-buff .ct { flex: 0 0 auto; font-size: 12px; font-weight: 900; color: #ffd700; }
  .char-buffs-empty { padding: 10px 8px; border-radius: 6px; border: 1px dashed #33334d;
    font-size: 11.5px; color: #6f6f8a; text-align: center; }
  /* 标题靠右：右侧要给那个格子大小的关闭按钮让出位置（不然会压在标题上） */
  .drawer-head.head-end { justify-content: flex-end; padding-right: calc(var(--corner-x) + var(--cell) + 8px); }
  .drawer-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  /* 二层（属性说明卡）：在同一个抽屉容器内再滑一层，不新开浮层 */
  .drawer-layer {
    position: absolute; inset: 0; z-index: 2; background: #15151f;
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .2s ease-out;
  }
  .drawer-layer.on { transform: translateX(0); }
  /* 「+1」加点：方形按钮（方形 = 信息块里的操作），不用圆形 */
  .ab-plus { padding: 6px 14px; font-size: 14px; font-weight: 900; border-radius: 6px;
    background: #ffd166; color: #3a2a00; border: 0; cursor: pointer; font-family: inherit; }
  .ab-plus:disabled { background: #3a3a4d; color: #7e7e97; cursor: not-allowed; }
  .ab-info-name { font-size: 15px; font-weight: 900; color: #4ecdc4; letter-spacing: 1px; }
  .ab-info-val { font-size: 12px; color: #c3c3da; }
  .ab-info-val b { color: #ffd700; font-size: 14px; }
  .ab-info-desc { font-size: 12.5px; line-height: 1.65; color: #d5d5e6; }
  .ab-info-desc code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    background: #232338; color: #9fe6ff; padding: 1px 5px; border-radius: 4px; }
  .ab-back { align-self: flex-start; padding: 5px 12px; font-size: 12px; font-weight: 700;
    background: #2c2c47; color: #cfe6ff; border: 1px solid #44445f; border-radius: 6px;
    cursor: pointer; font-family: inherit; }
  /* 属性抽屉里的雷达图 + 剩余点数行 */
  #statsDrawerRadar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #abilityPointsRow { font-size: 12px; color: #ffd700; font-weight: 800; text-align: center; min-height: 16px; }
  /* 六维图入口（方形信息块按钮） */
  #statsOpenBtn { flex: 0 0 auto; width: 100%; padding: 6px 8px; font-size: 12px; font-weight: 800;
    background: #232338; color: #cfe6ff; border: 1px solid #3a3a55; border-radius: 7px;
    cursor: pointer; font-family: inherit; touch-action: manipulation; }
  #statsOpenBtn:active { transform: scale(.97); }
  #statsOpenBtn.on { color: #ffd700; border-color: #6b5a1f; }
  body.layout-v #statsOpenBtn { max-width: 760px; margin: 0 auto; }
  /* 升级奖励在抽屉里：三选一改竖排（360px 宽放不下三列） */
  .drawer .lv-cards { grid-template-columns: 1fr; gap: 9px; }
  .drawer .lv-card { display: grid; grid-template-columns: auto minmax(0,1fr); column-gap: 10px; row-gap: 2px; align-items: center; }
  .drawer .lv-card .ico { grid-row: 1 / span 3; font-size: 22px; }

  /* ---- 布局模式：layout-h 地图左/UI右（桌面默认）；layout-v 地图上/UI下（竖版） ---- */
  body.layout-v #game { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
  /* 竖版：宽度撑满，高度由 updateCellSize() 按「宽度 vs 剩余高度」的短边写死（正方形）；

  body.layout-v #boardWrap { width: 100%; flex: 0 0 auto; min-height: 96px; align-self: center; }

     「开始行动」要落在拇指区（就在方向键上方），不能留在侧栏顶部够不着。 */
  body.layout-v #sidebar { display: flex; flex-direction: column; }
  body.layout-v #statsOpenBtn{ order: 2; }

  /* 竖版中间的可上下拖动分隔条（横线 + 横胶囊），与横版竖线呼应 */

  body.layout-v #dragHandle { display: none; }
  #logBar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; font-size: 12px; font-weight: 800; color: #9a9ab5; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,.06); user-select: none; touch-action: none; }

  #setVer { flex: 1 1 auto; min-width: 0; font-size: 10px; font-weight: 700; letter-spacing: .3px;

  #logBar button { padding: 2px 6px; font-size: 12px; line-height: 1.1; background: #2c2c47; color: #cfe6ff; border: 1px solid #44445f; border-radius: 5px; cursor: pointer; touch-action: manipulation; }

   *   左下方向键，右下 等待/攻击/技能」。
   *   旧版是「方向键 + 三键」平铺在 #sidebar 底部（文档流），「开始行动」另找槽位；

   *   面板 z-index(--z-vpad:1002) 低于抽屉遮罩(--z-mask:1100) —— 抽屉一开它自动被盖住，
   *   不会出现在「设置面板之上还能点棋盘」的荒唐状态。
   *   形状规则不变：圆形 = 交互，胶囊 = 特殊动作（开始行动）。
   * ========================================================================= */
  #vpadHost { display: none; }
  /* ★ ISSUE-20261029-31：长按虚拟按键会选中文字、弹出「拷贝 / 全选」菜单。
   * touch-action:none 只管「手势」（滚动 / 缩放），**管不住文本选择** ——
   * 必须再补 user-select:none（禁拖蓝）与 -webkit-touch-callout:none（禁 iOS 长按菜单）。
   * 作用域取「面板整体 + 所有子元素」：注入进 .vpad-top 的「开始行动」不在 .vbtn 里，
   * 只写 .vbtn 会漏掉它，只写面板又漏不掉缝隙里的残留选区。 */
  #vpadHost, #vpadHost * {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #vpadHost.on {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-vpad);
    display: flex; flex-direction: column; gap: 6px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(17,17,32,.96);
    border-top: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 -10px 26px rgba(0,0,0,.5);
  }
  /* 顶行：开始行动（renderControls 注入 .start-btn） */
  .vpad-top { display: flex; flex: 0 0 auto; }
  .vpad-top .start-btn { flex: 1 1 auto; width: 100%; }
  .vpad-top:empty { display: none; }
  /* 面板脱离文档流，用 --vpad-h（JS 实测写入）给 #game 补一圈底部留白。
     boardAvailSize() 算的是 clientHeight − padding，棋盘因此自动缩小让位，
     不需要在 JS 里再减一次高度。 */
  body.vpad-on #game { padding-bottom: calc(var(--vpad-h, 0px) + 8px); }
  /* 底行：左方向键 / 右三键 */
  .vpad-bot { display: flex; flex: 0 0 auto; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .vpad-dir { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 5px; }
  .vpad-dir .vbtn:nth-child(1) { grid-column: 2; grid-row: 1; }
  .vpad-dir .vbtn:nth-child(2) { grid-column: 1; grid-row: 2; }
  .vpad-dir .vbtn:nth-child(3) { grid-column: 2; grid-row: 2; }
  .vpad-dir .vbtn:nth-child(4) { grid-column: 3; grid-row: 2; }
  .vpad-act { display: flex; gap: 8px; align-items: flex-end; }
  .vact-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .vbtn-reset { width: 38px; height: 38px; font-size: 18px; background: rgba(120,58,58,.92); border: 1px solid #6b3a3a; }
  .vbtn-reset:active { transform: scale(.92); background: rgba(150,70,70,.96); }
  .vbtn { position: relative; width: 46px; height: 46px; padding: 0; border-radius: 50%;
    border: 1px solid #44445f; background: rgba(38,38,60,.94); color: #dbe6ff;
    font-size: 15px; font-weight: 900; line-height: 1; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;

    box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  .vbtn:active { transform: scale(.92); background: rgba(62,62,96,.96); }
  .vbtn:disabled { opacity: .38; pointer-events: none; }
  .vbtn .vnum { font-size: 10px; font-weight: 900; color: #9fe6ff; line-height: 1; }
  .vbtn .vlab { font-size: 9px; font-weight: 700; color: #8f95a8; line-height: 1; }
  /* 攻击键上「×N」角标 */
  .vbtn .vbadge { position: absolute; top: -2px; right: -2px; min-width: 14px; height: 14px;
    padding: 0 3px; border-radius: 7px; background: #c0392b; color: #fff;

<script>
/* ---- P0.1-1 冻结基线：版本号 ----
 * 用途：排障与回滚定位 + 让玩家确认「是不是最新版」。
 * 查法：控制台 `window.__ARK_VERSION__`，或点左上角 ⚙ 展开「设置」，标题栏「设置」右侧即可见。
 *
 * 字段说明：
 *   version  —— 语义版本（跟随 README §5 阶段里程碑）
 *   build    —— 构建号 `MMDDHHmm`（月日时分，如 10282132 = 10月28日 21:32）；★ 每次发版必须同时改这里和 DLC index.html 的 BUILD，
 *               否则 iframe 的 `game.html?v=BUILD` 不会刷新缓存，玩家会继续看旧版。
 *   commit   —— ★ 冻结基线提交（9a4137c），不是当前提交：git 无法自引用自身 sha。
 *               P0.1-3 构建脚本上线后，改为构建时注入真实 sha。
 *   builtAt  —— 基线冻结时间 */
window.__ARK_VERSION__ = {
  version: '0.1.0-prototype',
  build:   '20261028b',
  commit:  '9a4137c2e7273788655a03b2effc231c6640c01d',
  builtAt: '2026-10-27T16:12:52Z'
};
(function () {
  var v = window.__ARK_VERSION__, el = document.getElementById('setVer');
  if (!el) return;
  // 标题栏空间有限：只显示日期构建号；完整信息放 title，鼠标悬停/长按可看
  el.textContent = 'v' + v.build;
  el.title = 'v' + v.version + '\n构建 ' + v.build + '\n基线 ' + v.commit.slice(0, 7) + ' (' + v.builtAt.slice(0, 10) + ')';
})();

/* =========================================================================
 * 方舟战棋 · 单文件版（无构建、无依赖，双击即可玩）
 *

 *   4. 掷骰与面板        — d20 检定、AC、派生属性、敌人面板
 *   5. 六维雷达图        — canvas 绘制 + 属性点点击热区
 *   6. 规则判定（纯逻辑） — 路径 → 主动行动（攻击 / 技能 / 闪避节点）、技力、冲锋
 *   7. 战斗反馈（DX）    — 浮动文字 / 粒子 / 弹道 / 受击闪烁
 *   8. 结算工具          — 击杀、落败、通关、玩家受伤反馈（收敛重复逻辑）
 *   9. 地图生成          — 连通区域生长 + 障碍 + 敌人 / 道具落点
 *  10. 关卡与回合生命周期 — initLevel / initCharSelect / 重置
 *  11. 渲染              — 棋盘、单位层、角色卡、数值面板、按钮
 *  12. 输入              — 键盘、指针拖拽、日志窗、布局切换
 *  13. 战斗结算          — resolveStep 及其子步骤
 *  14. 成长与奖励        — 升级、buff、下一关
 *  15. 启动              — initCharSelect()
 *
 * 约定：
 *   - 所有跨函数状态仍为顶层 let（便于热改与调试），命名统一见第 2 区。
 *   - 纯逻辑函数不碰 DOM；渲染函数不改战斗状态；结算函数通过返回值报告「是否致死」。
 *   - 新增角色时，只需在 CHARACTERS 里加数据 + 在「规则判定」区加它的技能分支。
 * ========================================================================= */
<!-- @inject:scripts -->

/* =========================================================
 * ★ 结算收尾工具（击杀 / 落败 / 通关 / 玩家受伤反馈）
 *
 * 这些「收尾动作」原先在 resolveStep 里被复制了 6~8 份，
 * 且各份细节并不一致（有的漏了阿米娅技力、有的漏了击杀特效）。
 * 统一入口后，新增角色或调整规则只需要改一处。
 * ========================================================= */
const IMMUNE_CHARGE = '冲锋免疫';
const IMMUNE_COUNTER = '满技力免疫';

/* 敌人死亡：清血、标记、可选特效与日志、阿米娅击杀技力。
 * opts.killedIds 传入本 tick 的击杀集合（相杀 / 冲锋撞击需要额外记账）。 */
function killEnemy(e, opts = {}) {
  if (!e || !e.alive) return false;
  const {
    showRing = true, showFloat = true, floatMsg = '击杀!',
    logText = true, amiyaSp = true, killedIds = null,
  } = opts;
  e.alive = false;
  if (killedIds) killedIds.add(e.id);
  if (showRing) ringFx(e.x, e.y, '#ff6b6b');
  if (showFloat) floatText(e.x, e.y, floatMsg, '#ff6b6b');
  if (logText) log(logText === true ? `敌人${e.id + 1}被击败` : logText);
  /* 精英击杀奖励（ISSUE-20261028-05）：在死亡格留下一个恢复道具 ❤️。
   * 只碰 rewardItems 数组，不新增单位、不动 enemyPathOrder —— 这是首轮排除「分裂」词缀的原因。 */
  if (e.isElite && typeof rewardItems !== 'undefined') {
    if (!rewardItems.some(r => r.x === e.x && r.y === e.y)) rewardItems.push({ x: e.x, y: e.y });
    log('★ 精英被击败，掉落了恢复道具 ❤️！');
  }
  if (amiyaSp && selectedChar === 'amiya') amiyaGainKillBonus();
  return true;
}

/* 玩家落败：统一置阶段、清箭头、写日志、重绘。 */
function endGame(message = '你死了。游戏结束。', markDead = true) {
  if (markDead && player) player.alive = false;
  phase = PHASE.GAMEOVER;
  clearEnemyArrows();
  log(message);
  render();
}

/* 通关：先刷新一帧让最后一次击杀可见，再进入通关结算。 */
async function finishLevel() {
  render();
  await sleep(300);
  onLevelClear();
}

/* 玩家承伤的浮动文字：护盾抵消 / 正常伤害 两态统一在这里判定。
 * 调试无敌分支已移除（ISSUE-20261028-11 B4）：隐藏开关下不弹任何浮字，玩家侧零感知。 */
function showPlayerDamage(res, normalText, opts = {}) {
  const { color = '#ff6b6b', crit = false, x = player.x, y = player.y } = opts;
  if (res.immune) return;
  floatText(x, y, res.shielded ? '护盾抵消' : normalText, res.shielded ? '#ffffff' : color, !res.shielded && crit);
}

/* 近战暴击判定：自然20 → 朝向 → 角色暴击率（所有角色同一条 critChance，无角色特例）。
 * 2026-10-28 ISSUE-20：删掉泥岩隐藏的 +42%（原为 0.08 + 0.42 = 50%）。
 * facingMode：'cone' 用于攻击节点范围攻击（面向的 3 格扇形），'target' 用于趁乱打击（正对目标）。
 * 注意 Math.random 的调用顺序：与旧版一致，改动会影响整局随机序列。 */
function meleeCritTag(target, atk, facingMode = 'target') {
  if (atk.nat20) return '自然20暴击';
  const facing = facingMode === 'cone' ? isInFacingCone(player, target) : isFacingTarget(player, target);
  if (facing) return '朝向暴击';
  return rng() < player.critChance ? '暴击' : '';
}

/* 玩家当前是否处于「免疫本次伤害」的状态（风笛冲锋 / 泥岩满技力反击）。 */
function playerImmuneState() {
  if (selectedChar === 'wheelchair' && playerChargingThisTurn) return IMMUNE_CHARGE;
  if (selectedChar === 'fencer' && fencerCounterActive && fencerSp >= FENCER_SP_MAX) return IMMUNE_COUNTER;
  return null;
}

/* 免疫命中时的统一表现（日志文案按来源传入，保持原有措辞）。
 * 泥岩的免疫同样要结算一次反击，否则会「满技力→免疫→不反击→技力永不清零」死锁。 */
function tryPlayerImmuneHit(state, chargeLabel, counterLabel, hitTag) {
  if (!state) return false;
  const tag = hitTag ? `（${hitTag}）` : '';
  log(state === IMMUNE_CHARGE
    ? `${chargeLabel}${tag}，冲锋状态免疫所有伤害！`
    : `${counterLabel}${tag}，但泥岩反击状态+满技力，免疫所有攻击！`);
  floatText(player.x, player.y, state, '#ffd700');
  if (state === IMMUNE_COUNTER && player.hp > 0) triggerFencerCounter();
  return true;
}

/* 敌人攻击玩家：泥岩反击状态下敌人掷骰取劣势。 */
function rollEnemyAttack(attackerMod, prof, targetAC) {
  return (selectedChar === 'fencer' && fencerCounterActive)
    ? attackRollDisadvantage(attackerMod, prof, targetAC)
    : attackRoll(attackerMod, prof, targetAC);
}

function triggerFencerCounter() {
  if (selectedChar !== 'fencer' || !fencerCounterActive) return;
  if (!player || !player.alive || player.hp <= 0) return;
  const targets = enemies.filter(e => e.alive && cheb(e, player) === 1);
  if (targets.length > 0) {
    const target = targets[randInt(targets.length)];
    const dmg = rollPlayerMeleeDamage() * 2;
    /* 护盾词缀（ISSUE-20261028-05）：第一击被完全吸收 */
    const dealt = enemyTakeDamage(target, dmg);
    if (dealt > 0) {
      slashFx(target.x, target.y, '#ffd700');
      hitFx(target.x, target.y, dealt, true, '反击暴击');
      log(`泥岩触发反击，对敌人${target.id+1}造成${dealt}点暴击伤害！`);
    }
    /* 荆棘词缀：近战命中后反弹（被打死的不反弹，函数内已判） */
    if (enemyThornsReflect(target)) return;
    if (target.hp <= 0 && target.alive) {
      target.alive = false;
      floatText(target.x, target.y, '击杀!', '#ff6b6b');
      log(`敌人${target.id+1}被击败`);
    }
    // ★ 技力满 5：眩晕周围 8 格所有敌人 + 回复 1/2 最大 HP
    if (fencerSp >= FENCER_SP_MAX) {
      const stunTargets = enemies.filter(e => e.alive && cheb(e, player) === 1);
      for (const e of stunTargets) {
        e.stunTurns = 2;
        floatText(e.x, e.y, '眩晕！', '#ffcc00');
        ringFx(e.x, e.y, '#ffcc00');
        log(`敌人${e.id+1}被眩晕（本回合剩余 + 下回合无法行动）`);
      }
      const healAmt = Math.floor(player.maxHp / 2);
      const oldHp = player.hp;
      player.hp = Math.min(player.maxHp, player.hp + healAmt);
      const actualHeal = player.hp - oldHp;
      if (actualHeal > 0) {
        floatText(player.x, player.y, `+${actualHeal} HP`, '#2ecc71');
        log(`💚 「岩崩锤」回复 ${actualHeal} HP（1/2 最大 HP）`);
      }
      fencerSp = 0;
      fencerCounterActive = false;  // 发动后退出反击状态，避免「SP 已清零却仍处反击态」的门槛失效
      floatText(player.x, player.y, '岩崩锤！', '#ffd700', true);
      ringFx(player.x, player.y, '#ffd700');
      log(`⚡ 泥岩发动「岩崩锤」！周围 ${stunTargets.length} 名敌人被眩晕，回复HP后技力清零，反击状态结束。`);
    }
  } else {
    log(`泥岩触发反击，但周围8格没有敌人。`);
    floatText(player.x, player.y, '反击落空', '#bbb');
  }
}

async function executeAmiyaBurst(count) {
  /* 精神爆发范围 = 普通射程（不再翻倍） */
  const burstRange = player.range;
  const intMod = abilityMod(player.abilities.int);
  for (let i = 0; i < count; i++) {
    if (!player.alive || player.hp <= 0) break;
    if (enemies.filter(e => e.alive).length === 0) break;
    let targets = enemies.filter(e => e.alive && canRangedAttack({ x: player.x, y: player.y }, e, burstRange));
    if (targets.length === 0) {
      log(`「精神爆发」${i + 1}/${count}：无有效目标，停止攻击。`);
      break;
    }
    targets.sort((a, b) => cheb(a, player) - cheb(b, player));
    const target = targets[0];
    const atk = attackRoll(intMod, player.rangedProf || 0, target.ac);
    /* 精神爆发：必定命中 + 必定暴击（不吃 d20，自然 1 与高 AC 也照样打中） */
    atk.hit = true;
    const isCrit = true;
    /* 只要出手就能看到目标意图 */
    amiyaMarkReveal(target);
    await animateBullet({ x: player.x, y: player.y }, 'enemy-' + target.id, target, isCrit, false, 'player');
    const dmg = rollPlayerRangedDamage() * 2;
    const dealt = enemyTakeDamage(target, dmg);
    /* 精神爆发的击杀不给技力（否则倾泻过程中边杀边攒，会滚雪球） */
    if (target.hp <= 0) target.alive = false;
    if (dealt > 0) {
      hitFx(target.x, target.y, dealt, true, '爆发暴击');
      log(`「精神爆发」${i + 1}/${count}：必定命中·必定暴击，对敌人${target.id + 1}造成${dealt}伤害 (${fmtRoll(atk, target.ac)})`);
    } else {
      log(`「精神爆发」${i + 1}/${count}：被护盾词缀吸收，未造成伤害。`);
    }
    refreshUnits();
    await sleep(180);
  }
}

/* 阿米娅技力上限 = 感知：击败敌人攒技力，「等待 → 攻击」倾泻消耗 */
function amiyaSpMax() {
  const ab = (player && player.abilities) || (playerStats && playerStats.abilities);
  const wis = (ab && ab.wis != null) ? ab.wis : CHARACTERS.amiya.abilities.wis;
  return Math.max(1, wis);
}

/* 技力上限 = 感知：击败敌人攒技力，「等待 → 攻击」倾泻消耗 */
const AMIYA_KILL_SP_GAIN = 2;

function amiyaGainKillBonus() {
  if (selectedChar !== 'amiya') return;
  const cap = amiyaSpMax();
  if (amiyaBonusTargets >= cap) {
    log(`阿米娅技力已满（${cap}/${cap}），击败敌人不再增加技力。`);    updateStats();
    return;
  }
  const before = amiyaBonusTargets;
  const sass = sassExtraSp();
  amiyaBonusTargets = Math.min(cap, amiyaBonusTargets + AMIYA_KILL_SP_GAIN + sass);
  const gained = amiyaBonusTargets - before;
  log(`阿米娅技力 +${gained}（${amiyaBonusTargets}/${cap}）：每击败 1 个敌人获得 ${AMIYA_KILL_SP_GAIN} 点技力，等待后接攻击节点即可倾泻。`);
  if (sass) log('🥤 香草沙士：额外获得 1 点技力！');
  updateStats();
}

/* 阿米娅：每次攻击（攻击节点出手，命中与否都算）+1 技力；精神爆发自身连射不额外加 */
function amiyaGainAttackSp() {
  if (selectedChar !== 'amiya') return;
  const cap = amiyaSpMax();
  if (amiyaBonusTargets >= cap) return;
  const sass = sassExtraSp();
  amiyaBonusTargets = Math.min(cap, amiyaBonusTargets + 1 + sass);
  log(`阿米娅技力 +${1 + sass}（${amiyaBonusTargets}/${cap}）：每次攻击积攒技力。${sass ? ' 🥤 香草沙士 +1' : ''}`);
  updateStats();
}

function amiyaMarkReveal(enemy) {
  if (selectedChar !== 'amiya' || !enemy) return;
  enemy.amiyaRevealBonus = (enemy.amiyaRevealBonus || 0) + 3;
  enemy.amiyaRevealForNext = true;
  log(`阿米娅标记敌人${enemy.id + 1}：下一次移动意图额外显示 3 步（累计 +${enemy.amiyaRevealBonus}）。`);
}

<!-- @inject:scripts:beforeInitLevel -->

function initLevel() {
  try {
    battleRound = 1;
    clearEnemyArrows();
    clearUnitLayer();
    pendingAttack = false;
    pendingChargeInfo = null;
    vampireSkillActive = false;   // 不稳定血浆只在本关内持续
    const numEnemies = Math.min(3 + Math.floor((level - 1) / 2), MAX_ENEMIES_PER_LEVEL);
    /* ★ ISSUE-20261029-29：棋盘固定 9×9（人类 04:42）。
     * 旧的「按关卡长地图」公式整段删除 —— 现在行 / 列恒为 9，
     * 随机地形、起点筛选、奖励摆放全部沿用原逻辑，只是尺寸参数换成了常量。
     * 视觉侧不受影响：updateCellSize() 仍按可用区域短边算正方形格边长，格子只会更大更清楚。 */
    const targetWalkable = BOARD_TARGET_WALKABLE;
    ROWS = BOARD_ROWS;
    COLS = BOARD_COLS;
    const gen = generateMap(numEnemies, targetWalkable);
    map = gen.map;
    rewardItems = gen.rewards || [];
    bloodDrops = [];
    recomputePlayerDerivedStats();
    /* 药枚：每关开始时获得 1 层护盾（层数 = buff 层数，不跨关累积） */
    playerShield = buffs.pill;
    if (playerStats.currentHp > playerStats.maxHp) playerStats.currentHp = playerStats.maxHp;
    if (playerStats.currentHp <= 0) playerStats.currentHp = playerStats.maxHp;
    player = createPlayerUnit(gen.playerStart);
    /* 经验制口径（ISSUE-20261028-10）：失血 = 关卡开始时血量 − 关卡结束时血量。
     * 必须取 player.hp（战斗中的唯一真实血量），且时机在 createPlayerUnit 之后：
     * playerStats.currentHp 是跨关持久值，前面还有「>maxHp 夹取」「<=0 兜底成满血」两步。 */
    levelStartHp = player.hp;
    levelActions = 0;
    enemies = [];
    /* ISSUE-20261028-10-B：粗圆岩是跨关的全局集合，map 虽然每关重生成，但集合必须显式清空，
     * 否则上一关的坐标会落到新地图上，把随机一格错误地标成石头。 */
    roughRocks.clear();
    /* ISSUE-20261029-28：小队成员不跨关（每关重新召唤）；技力跨关继承，所以 rookieSp 不在这里清。
     * lastSquadType 保留 —— 「不连续重复」跨关也要成立。 */
    squadUnits = [];
    const bossHere = isBossLevel(level) && numEnemies > 0;
    for (let i = 0; i < numEnemies; i++) {
      const s = gen.enemyStarts[i];
      /* 类型按关卡解锁 + 权重（ISSUE-20261028-04）：L1-2 只有骷髅，L3 起幽灵，
       * L5 起外星人（远程狙击），L8 起盾卫，L12 起自爆虫。 */
      /* ★ ISSUE-20261028-10-B：Boss 关把**最后一只**换成圆岩巨像，而不是额外加一只
       * （否则第 10 关等于「6 普通 + 1 Boss」，难度直接崩）。
       * Boss 不参与词缀/精英抽取：它自己就是关底，再叠 2 个词缀会失控。 */
      const isBossSlot = bossHere && i === numEnemies - 1;
      const type = isBossSlot ? BOSS_TYPE : pickEnemyType(level);
      /* 成长面板（ISSUE-20261028-03）：第 level 关的敌人已推演过 level 次属性提升 + 每 3 关的升级 */
      const grow = computeEnemyGrowth(type, level, i, RUN_SEED);
      const eAbilities = grow.abilities;
      const eProf = getEnemyProf(type);
      const eAC = computeAC(eAbilities);
      const eMove = Math.max(1, Math.floor(eAbilities.dex / 2));
      /* 词缀与精英（ISSUE-20261028-05）：L5 起每关 1 个精英（HP×1.5、必带 2 词缀），
       * 普通敌人按关卡概率带 1 个词缀。全部由 RUN_SEED 派生 → 同种子重开完全一致。 */
      const affixPlan = isBossSlot
        ? { isElite: false, affixes: [] }
        : rollEnemyAffixPlan(level, i, numEnemies, RUN_SEED);
      const hp = affixPlan.isElite ? Math.ceil(grow.maxHp * ELITE_HP_MUL) : grow.maxHp;
      /* 伤害骰（ISSUE-20261028-04）：结算走 rollEnemyDamage(e, kind) 掷骰，
       * meleeDmg/rangedDmg 保留为**骰子期望值**，供 AI 估值与日志面板展示。 */
      const baseDice = ENEMY_STATS[type].dice || {};
      const meleeDice = baseDice.melee ? { n: baseDice.melee[0], s: baseDice.melee[1] } : null;
      const rangedDice = baseDice.ranged ? { n: baseDice.ranged[0], s: baseDice.ranged[1] } : null;
      enemies.push({
        id: i, x: s.x, y: s.y, hp, maxHp: hp, type,
        move: eMove,
        abilities: { ...eAbilities },
        ac: eAC,
        prof: eProf,
        enemyLevel: grow.level,
        enemyGrowths: level,
        meleeDmg: diceAvg(meleeDice),
        rangedDmg: diceAvg(rangedDice),
        meleeDice,
        rangedDice,
        explodeDmg: ENEMY_STATS[type].explode || 0,
        isElite: affixPlan.isElite,
        affixes: affixPlan.affixes,
        shieldLeft: affixPlan.affixes.indexOf('shield') >= 0 ? 1 : 0,
        alive: true, attackedThisRound: false,
        facing: faceToward(s, player),
        amiyaRevealBonus: 0,
        amiyaRevealForNext: false,
        amiyaRevealActive: 0,
        stunTurns: 0,
        /* ISSUE-20261028-10-B：Boss 落石计时（回合末递减，到 0 就落一块并重置）。
         * 首回合不落 —— 让玩家先看清它长什么样、意图往哪走，再开始被堵。 */
        rockCd: isBossSlot ? COLOSSUS_ROCK_EVERY : 0,
      });
    }
    playerPath = [{ x: player.x, y: player.y }];
    attackIndices = [];
    skillIndices = [];
    lastClick = null;
    enemyPaths = [];
    lastPathSignature = '';
    phase = PHASE.PLANNING;
    playerChargingThisTurn = false; playerAttacksDone = 0; fencerCounterActive = false;
    playerChargeStopReason = null;
    playerChargeCausedDamage = false;
    logLines = logLines.slice(-5);
    if (logLines.length > 0) logLines.push('');
    renderLogAll();   // 保留上一关最近 5 行作为上下文，再重绘可视区
    const charName = CHARACTERS[selectedChar] ? CHARACTERS[selectedChar].name : '未知';
    log(`=== 第 ${level} 关　角色：${charName}　地图 ${COLS}×${ROWS}　敌人 ${numEnemies} 个 ===`);
    if (selectedChar === 'amiya' && amiyaBonusTargets > 0) {
      log(`阿米娅继承了 ${amiyaBonusTargets}/${amiyaSpMax()} 点技力（跨关继承）。`);
    }
    if (selectedChar === 'fencer') {
      log(`泥岩技力：${fencerSp}/${FENCER_SP_MAX}（跨关继承）`);
    }
    if (selectedChar === 'rookie' && rookieSp > 0) {

    });

    if (level === 1) {

      log(`敌人成长：每关每个敌人随机 +1 项属性（只从当时最高的 4 项里选，相邻两次不重复），每 ${LEVELUP_EVERY_N_LEVELS} 关升级一次（HP 上限 + 体质加值）。`);
    }

    log(`AC ${player.ac}　熟练+${player.prof}（近战${player.meleeProf}／远程${player.rangedProf}）　HP = 体质${player.abilities.con} + 基础${BASE_HP_BONUS} + 升级加成${levelHpBonus}${buffHpBonus() ? ' + 热水壶' + buffHpBonus() : ''} = ${player.maxHp}`);
    if (rewardItems.length > 0) log(`地图中发现了 ${rewardItems.length} 个恢复道具 ❤️！`);
    if (playerShield > 0) log(`💊 药枚：本关开始获得 ${playerShield} 层护盾（可抵消 ${playerShield} 次伤害）。`);
    generateEnemyPaths();
    logEnemyMainDirections();
    /* 手机圆钮必须在本关开始的那一刻就显示对：
     * 下面第一次 render() 被推迟 50ms（等离开选角大厅、格子尺寸稳定后才量得出布局），
     * 而这期间 phase 已经是 planning，若不在这里补一次同步，纯触屏玩家会看到

     * 这里只写数值与技力环，不依赖 --cell，所以可以早于 updateCellSize()。 */
    if (typeof syncVirtualPad === 'function') syncVirtualPad();

  } catch (err) {
    console.error(err);
    clearLog();

    log(String(err && err.stack ? err.stack : ''));

}

/* 棋盘可用区域（ISSUE-20261028-09 A）：返回能放下正方形的最大边长。
 * 横版：宽度 = #game 内容宽 − 侧栏 − 竖分隔条 − 两个 gap；高度 = #game 内容高。
 * 竖版：宽度 = 内容宽；高度 = 内容高 − 侧栏最小高度 − gap。
 * 取两者短边并 floor 成整数像素，保证 #boardWrap 严格 1:1 且不溢出。 */
function boardAvailSize() {
  const cs = getComputedStyle(gameEl);
  const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  const gap = parseFloat(cs.columnGap || cs.gap) || 0;
  let w = gameEl.clientWidth - padX;
  let h = gameEl.clientHeight - padY;
  if (document.body.classList.contains('layout-v')) {
    // 侧栏在下方：用它的最小高度做预算（超出部分由 #stats 自己滚动）
    const minSide = window.innerWidth <= 760 ? 210 : 240;
    h -= minSide + gap;
  } else {
    const sw = sidebarEl ? sidebarEl.offsetWidth : 0;
    const dh = (dragHandle && getComputedStyle(dragHandle).display !== 'none') ? dragHandle.offsetWidth : 0;
    w -= sw + dh + gap * 2;
  }
  return { w: Math.max(120, w), h: Math.max(120, h) };
}

function updateCellSize() {
  const m = phase === PHASE.CHAR_SELECT ? selMap : map;
  if (!m || m.length === 0) return;
  const bbox = getBoundingBox();
  const bc = bbox.maxX - bbox.minX + 1;
  const br = bbox.maxY - bbox.minY + 1;
  const gap = 2;
  const avail = boardAvailSize();
  // 正方形边长 = 可用区域短边；ROWS≠COLS 的关卡靠格子变小 + 居中消化，不改地图行列数
  const side = Math.floor(Math.min(avail.w, avail.h));
  boardWrap.style.width = side + 'px';
  boardWrap.style.height = side + 'px';
  const pad = 16;                                   // 与旧版一致的四周内边距预算
  const wl = (side - pad - (bc - 1) * gap) / bc;
  const hl = (side - pad - (br - 1) * gap) / br;    // 不再 /1.12：格子必须正方
  let cell = Math.floor(Math.min(wl, hl));
  cell = Math.max(16, Math.min(cell, 80));
  document.documentElement.style.setProperty('--cell', cell + 'px');
  /* ISSUE-20261029-21：角标要贴「棋盘」的两角，而 #board 在 #boardWrap 里居中，
     四周各剩 (side - 棋盘边长)/2。用公式算、不去量 offsetWidth —— 本函数可能早于
     render() 写 gridTemplateColumns，量到的是上一张图的尺寸。 */
  const bw = bc * cell + (bc - 1) * gap;
  const bh = br * cell + (br - 1) * gap;
  document.documentElement.style.setProperty('--corner-x', Math.max(0, Math.round((side - bw) / 2)) + 'px');
  document.documentElement.style.setProperty('--corner-y', Math.max(0, Math.round((side - bh) / 2)) + 'px');
  /* 棋盘尺寸刚变过 → 覆盖棋盘的「设置面板」矩形也要跟着变（ISSUE-20261029-29）。
   * 转屏/换布局时窗口尺寸不一定变，只靠 resize 监听会漏，所以在这里补一次。 */
  try { if (typeof syncBoardOverlayRect === 'function') syncBoardOverlayRect(); } catch (_) {}
  /* 选角厅的技能说明层是按格子矩形实算的，格子一变它也要重新贴一次 */
  try { if (typeof layoutCharInfoSheet === 'function') layoutCharInfoSheet(); } catch (_) {}
}

function logEnemyMainDirections() {
  if (phase !== PHASE.PLANNING) return;
  enemies.forEach((e, i) => {
    if (!e.alive) return;
    if (e.stunTurns > 0) { log(`敌人${i+1} 眩晕中（无意图）`); return; }
    const path = enemyPaths[i];
    if (!path || path.length < 2) { log(`敌人${i+1} 主方向：无`); return; }
    const counts = {};
    for (let j = 1; j < path.length; j++) {
      const dx = path[j].x - path[j-1].x, dy = path[j].y - path[j-1].y;
      const d = DIR_NAMES[`${dx},${dy}`] || '?';
      counts[d] = (counts[d] || 0) + 1;
    }
    let max = 0, main = [];
    for (const d in counts) { if (counts[d] > max) { max = counts[d]; main = [d]; } else if (counts[d] === max) main.push(d); }
    log(`敌人${i+1} 主方向：${main.join('/') || '无'}`);
  });
}

function buildBoardHtml() {
  let html = '';
  const bbox = getBoundingBox();
  const m = phase === PHASE.CHAR_SELECT ? selMap : map;
  /* 攻击节点 / 技能节点 / 闪避节点 / 攻击范围（只在规划阶段生效） */
  const isAttackStep = (idx) => attackIndices.includes(idx);
  const isSkillStep = (idx) => skillIndices.includes(idx);
  const rangeSet = (phase === PHASE.PLANNING && showRangeOverlay) ? playerAttackRangeCells() : null;
  const planInfo = (phase === PHASE.PLANNING) ? plannedActionInfo(playerPath, attackIndices, skillIndices) : null;
  const dodgeIdx = planInfo ? planInfo.dodgeIndex : -1;
  const nodeReady = (phase === PHASE.PLANNING) ? skillReadyInfo(playerPath).ready : false;
  for (let y = bbox.minY; y <= bbox.maxY; y++) {
    for (let x = bbox.minX; x <= bbox.maxX; x++) {
      let cls = 'cell';
      let content = '';
      let dirHtml = '';
      if (m[y][x] === 1) {
        const hw = DIR4.some(([dx,dy]) => isWalkable(x+dx, y+dy));
        if (hw) cls += ' wall'; else cls += ' void';
        /* ISSUE-20261028-10-B：粗圆岩标记在 roughRocks 里，渲染成石头而不是灰墙。
         * 它在 map 里同样是 1，所以寻路 / 视线 / 站位全部自动当墙处理。 */
        if (phase !== PHASE.CHAR_SELECT && roughRocks.has(key(x, y))) {
          cls += ' rock';
          /* ⚠️ 别换回 🪨：那是 Emoji 13.0（2020），本机 Chrome 的 Segoe UI Emoji 没有这个字形，
           * 实测渲染成豆腐块「□」—— 截图上就是两个褐色格子中间一个空方框。
           * ⛰️ 是 Emoji 1.0，和骷髅/幽灵同代，同一字体栈下必然可显示。
           * （同类坑见 ISSUE-19 的 🪖 → 💂。） */
          content = '⛰️';
        }
      } else cls += ' empty';
      if (rangeSet && rangeSet.has(key(x, y))) cls += ' in-range';
      if (phase === PHASE.CHAR_SELECT) {
        if (selExit.x === x && selExit.y === y) { cls += ' exit-cell'; content = '🚪'; }
        /* 角色不再画进格子里（ISSUE-20261028-12）：位置是连续的，
         * 由 unitLayer 里的 .cand-unit 绝对定位渲染，这里只画地形。 */
      } else {
        const stepsAtCell = [];
        playerPath.forEach((p, idx) => { if (p.x === x && p.y === y) stepsAtCell.push(idx); });
        if (stepsAtCell.length > 0) {
          cls += ' path';
          const hasAttack = stepsAtCell.some(isAttackStep);
          const hasSkill = stepsAtCell.some(isSkillStep);
          if (hasAttack) cls += ' attack';
          if (hasSkill) cls += ' skill';
          /* 攻击节点的「已用」要按攻击次数上限判，不是动作预算（ISSUE-20261029-25：2 动作但 1 攻击） */
          if (playerAttacksDone >= maxAttacksThisTurn()) cls += ' used';
          /* 闪避节点：第一次等待 → 蓝色标记 */
          if (dodgeIdx >= 0 && stepsAtCell.includes(dodgeIdx)) cls += ' dodge';
          /* ISSUE-20261029-41：朝向箭头（起点格不画 —— 单位自身的朝向指示已经够了）。
           * 取该格**最小**步号：等待步会返回同一格里重复的下标，facingAt 内部已跳过等待步，
           * 所以「落地格 + 之后的等待」得到的是同一个方向。终点格 = 进入方向。 */
          const dirIdx = stepsAtCell[0];
          if (dirIdx > 0) {
            const f = facingAt(playerPath, dirIdx, null);
            if (f.dx || f.dy) {
              const dCls = f.dy < 0 ? 'u' : f.dy > 0 ? 'd' : f.dx > 0 ? 'r' : 'l';
              dirHtml = `<i class="cell-dir ${dCls}"></i>`;
            }
          }
        }
        const playerHere = player.alive && player.x === x && player.y === y;
        const enemyHere = enemies.find(e => e.alive && e.x === x && e.y === y);
        const bloodHere = bloodDrops.some(b => b.x === x && b.y === y);
        /* ★ ISSUE-20261029-29：血迹的底色**必须先于单位判断**加上。
         * 旧写法把 blood-cell 放在「格子空着」的分支里，结果是：敌人踩在自己流的血上时
         * 整格一点提示都没有，等它走开、另一个敌人路过，那格才突然冒出 🩸
         * —— 玩家看到的就是「血迹显示在另一个敌人的位置」。
         * 现在血迹格永远带底色（单位站上去只是盖住图标，底色照旧），
         * 「血是谁流的」一眼可辨，拾取点也不会因为敌人走位而错位。 */
        if (bloodHere) cls += ' blood-cell';
        if (playerHere || enemyHere) {
          /* 有单位站在这格时看不见格内文字，节点靠底色 + 描边提示 */
        } else if (rewardItems.some(r => r.x === x && r.y === y)) {
          cls += ' item-cell';
          content = `<span class="item-pulse" style="font-size:calc(var(--cell)*0.5);">❤️</span>`;
        } else if (bloodHere) {
          content = `<span class="item-pulse" style="font-size:calc(var(--cell)*0.5);">🩸</span>`;
        } else if (stepsAtCell.length > 0) {
          const lastIdx = stepsAtCell[stepsAtCell.length - 1];
          const atkIdx = stepsAtCell.find(isAttackStep);
          const sklIdx = stepsAtCell.find(isSkillStep);
          if (sklIdx !== undefined) content = nodeReady ? '✦' : '✧';
          else if (atkIdx !== undefined) content = '🎯';
          else if (dodgeIdx >= 0 && stepsAtCell.includes(dodgeIdx)) content = '💨';
          else if (stepsAtCell.length > 1) content = `⏳${lastIdx}`;
          else if (lastIdx > 0) content = `${lastIdx}`;
          else content = '';
        }
      }
      html += `<div class="${cls}" data-x="${x}" data-y="${y}">${content}${dirHtml}</div>`;
    }
  }
  return html;
}

/* =========================================================================
 * 角色信息面板 —— 全屏唯一的「一份 HTML」
 *
 * ISSUE-20261029-38（人类 15:41 / 15:52）：两块重复面板合并成一块。
 *   · 位置 = 「开始行动」按钮正上方（.action-wrap > .hud，#hud）；
 *   · 外观逐项照抄原侧栏 #hero 卡；旧 .hud-line/.hud-* 那套半透明黑底作废；
 *   · 侧栏 #hero 整块删除；SP 条下整排胶囊（技力数值 / 闪避 / 技能节点 / 护盾 /
 *     小队 / buff 药丸 …）按人类 15:52 拍板**一个都不留**。
 *
 * ISSUE-20261029-42：角色面板（♟️ #drawerChar）顶部要「和操作界面一样的 UI」——
 *   直接吃这里的 heroInnerHtml()，**不允许再写第二套标记**。
 *   想改面板长相只改这一个函数，两个调用点自动跟着变。
 * ========================================================================= */
function hpStateClass(hp, maxHp) {
  const r = maxHp > 0 ? hp / maxHp : 0;
  if (r <= 0.3) return 'danger';
  if (r <= 0.6) return 'warn';
  return '';
}

/* 面板 HTML（纯函数：只吃 opt 与相位，不吃别的 UI 状态） */
function heroInnerHtml(opt) {
  const maxHp = opt.maxHp || 0;
  const pct = maxHp > 0 ? Math.max(0, Math.min(100, (opt.hp / maxHp) * 100)) : 0;
  const hpText = opt.hpText || (maxHp > 0 ? `${Math.max(0, opt.hp)} / ${maxHp}` : '—');
  const shieldN = opt.shield || 0;
  const shieldBar = shieldN > 0
    ? `<div class="hp-shield" style="width:${Math.min(100, shieldN * 12)}%" title="护盾 ${shieldN} 层"></div>`
    : '';
  const hpBar = maxHp > 0
    ? `<div class="hp-track ${hpStateClass(opt.hp, maxHp)}"><div class="hp-fill-lg" style="width:${pct}%"></div>${shieldBar}<span class="hp-text"><i class="bar-lbl">HP</i>${hpText}</span></div>`
    : '';
  let spBar = '';
  if (opt.sp && opt.sp.max > 0) {
    const sp = Math.max(0, Math.min(opt.sp.max, opt.sp.cur || 0));
    const maxed = sp >= opt.sp.max;
    spBar = `<div class="sp-track ${maxed ? 'max' : ''}"><div class="sp-fill" style="width:${(sp / opt.sp.max) * 100}%"></div><span class="sp-text"><i class="bar-lbl">SP</i>${sp}/${opt.sp.max}</span></div>`;
  }
  const lvBadge = (phase === PHASE.CHAR_SELECT)
    ? ''
    : `<span class="hero-lv-gold" title="等级">Lv.${heroLevel || 1}</span>`;
  /* 经验条（ISSUE-20261028-10）：方形细条贴在等级下面，宽度 = xp / 升级阈值 */
  let xpBar = '';
  if (phase !== PHASE.CHAR_SELECT) {
    const xpNeed = xpThresholdForLevel(heroLevel || 1);
    const xpPct = xpNeed > 0 ? Math.max(0, Math.min(100, (xp / xpNeed) * 100)) : 0;
    xpBar = `<div class="xp-track" title="经验 ${xp}/${xpNeed}（升到 Lv.${(heroLevel || 1) + 1}）"><div class="xp-fill" style="width:${xpPct}%"></div></div>`;
  }
  return `
    <div class="hero-top">
      <span class="hero-name">${opt.name}</span>${lvBadge}
      <span class="hero-lv">${opt.tag || ''}</span>
    </div>
    ${xpBar}
    ${hpBar}
    ${spBar}
  `;
}

/* 选角相位的数据源（未选角色时也给一份占位，面板不会空着） */
function heroOptCharSelect() {
  if (!selectedCandidate) return { name: '选择角色', tag: '', hp: 0, maxHp: 0, hpText: '—' };
  const char = CHARACTERS[selectedCandidate.id] || null;
  /* ISSUE-20261028-19：动态角色读「候选副本」（加点后立刻反映），静态角色仍读常量对象 */
  const a = candidateAbilitiesOf(selectedCandidate.id);
  const selRanged = isRangedCharOf(selectedCandidate.id, a);
  /* 选角阶段预览技力槽：泥岩/风笛/华法琳 5、阿米娅上限 = 感知，其余角色无技力机制 */
  const spPreview = (selectedCandidate.id === 'fencer' || selectedCandidate.id === 'wheelchair' || selectedCandidate.id === 'vampire')
    ? { cur: 0, max: FENCER_SP_MAX }
    : (selectedCandidate.id === 'amiya' ? { cur: 0, max: Math.max(1, a.wis) } : null);
  const hp = a.con + BASE_HP_BONUS;
  return {
    name: `${char ? char.name : '?'} ${char ? char.icon : ''}`,
    /* 预备干员把「熟练 / 攻击方式」直接写在 tag 上：加点会实时翻转，玩家不用自己推 */
    tag: charIsDynamic(selectedCandidate.id)
      ? (selRanged ? '待选择 · 远程熟练' : '待选择 · 近战熟练')
      : '待选择',
    hp: hp, maxHp: hp, sp: spPreview,
  };
}

/* 对局相位的数据源 */
function heroOptBattle() {
  if (!player) return null;
  const charInfo = CHARACTERS[selectedChar] || null;
  /* 技力槽：泥岩固定上限 5；阿米娅上限 = 感知；风笛上限 5（沿直线移动积累，规划时预览增量）；华法琳上限 5（捡血迹） */
  let spInfo = null;
  if (selectedChar === 'fencer') spInfo = { cur: fencerSp, max: FENCER_SP_MAX };
  else if (selectedChar === 'amiya') spInfo = { cur: amiyaBonusTargets, max: amiyaSpMax() };
  else if (selectedChar === 'wheelchair') spInfo = { cur: wheelchairPreviewSp(), max: WHEELCHAIR_SP_MAX };
  else if (selectedChar === 'vampire') spInfo = { cur: vampireSp, max: VAMPIRE_SP_MAX };
  else if (selectedChar === 'rookie') spInfo = { cur: rookieSp, max: ROOKIE_SP_MAX };
  return {
    name: `${charInfo ? charInfo.name : '未知'} ${charInfo ? charInfo.icon : ''}`,
    tag: `第 ${level} 关 · AC ${playerEffectiveAC()}${playerDodging ? ` (+${playerDodgeACBonus})` : ''}`,
    hp: player.hp, maxHp: player.maxHp,
    shield: playerShield,
    sp: spInfo,
  };
}

/** 当前相位的面板数据 */
function heroCardOpt() {
  return phase === PHASE.CHAR_SELECT ? heroOptCharSelect() : heroOptBattle();
}

/* 唯一写入点：#hud（行动按钮正上方）+ #charTop（角色面板顶部，ISSUE-20261029-42）。
 * 两处内容完全同源 —— 这就是「面板 HTML 只留一份」的落点。 */
function renderHeroCard(opt) {
  let html = '';
  if (opt === undefined) {
    const o = heroCardOpt();
    html = o ? heroInnerHtml(o) : '';
  } else if (opt) {
    html = heroInnerHtml(opt);
  }
  const hud = document.getElementById('hud');
  if (hud) hud.innerHTML = html;
  const top = document.getElementById('charTop');
  if (top) top.innerHTML = html;
}

/* 技能说明列表：「技力/技能/被动/」前缀和「[技能名]」上色，其余保持普通文本 */
function renderTips(tips) {
  const labelRe = /^(\[[^\]]{1,14}\]|[^：:]{1,4})[：:]\s*/;
  return (tips || []).map(t => {
    const s = String(t);
    const m = s.match(labelRe);
    if (!m) return `<li>${s}</li>`;
    const key = m[1];
    const rest = s.slice(m[0].length);
    const cls = key.startsWith('[') ? 'tip-k skill' : 'tip-k';
    return `<li><span class="${cls}">${key}：</span>${rest}</li>`;
  }).join('');
}

/* 点仪表格已废弃（ISSUE-20261028-09 E）。本函数保留为「主动行动」的唯一出口：
 *   手机圆钮 → wait / attack / skill；键盘 V 与手机长按攻击钮 → range。
 * 不允许再新增第二套语义（同一函数出口是这条 UI 重构的硬要求）。 */
function handleKvAction(action) {
  if (phase !== PHASE.PLANNING || isMoving || !player) return;
  if (action === 'wait') {
    if (countWaitSteps(playerPath) >= player.move) { log('等待次数已用完（等待上限 = 移动力）。'); return; }
    /* ★ ISSUE-20261029-34：等待步 = 闪避动作，第一个等待步要占 1 件动作预算。
     * 旧版这里直接 push，完全不查预算 → 「攻击 + 技能 + 闪避」三件能被规划出来。 */
    const gate = canAddWaitStep(playerPath, attackIndices, skillIndices);
    if (!gate.ok) { log(`⚠️ ${gate.reason}`); return; }
    const last = playerPath.length ? playerPath[playerPath.length - 1] : { x: player.x, y: player.y };
    playerPath.push({ x: last.x, y: last.y });
    refreshBoardOnly();
  } else if (action === 'attack') {
    if (playerPath.length === 0) return;
    toggleAttack(playerPath.length - 1);
    refreshBoardOnly();
  } else if (action === 'skill') {
    /* ★ ISSUE-20261029-34：起点（原地）也能放技能节点了 —— 只剩起点时按 R 就是「原地施法」。 */
    if (playerPath.length < 1) { log('先在棋盘上规划路径，再在路径节点上设置技能节点。'); return; }
    toggleSkill(playerPath.length - 1);
    refreshBoardOnly();
  } else if (action === 'reset') {
    /* ★ ISSUE-20261029-36：虚拟按钮「重置路径」键（攻击键上方）—— 与键盘 X 等价。 */
    if (playerPath.length > 1 || attackIndices.length > 0 || skillIndices.length > 0) {
      playerPath = [{ x: player.x, y: player.y }];
      attackIndices = [];
      skillIndices = [];
      refreshBoardOnly();
    }
  } else if (action === 'range') {
    showRangeOverlay = !showRangeOverlay;
    log(showRangeOverlay ? '📐 显示攻击范围（蓝色地块）。' : '关闭攻击范围显示。');
    refreshBoardOnly();
  }
}

/* 方向移动的唯一出口：键盘 WASD 与手机方向钮都走这里（避免两套寻路逻辑打架） */
function stepPathByDir(k) {
  if (!player || phase !== PHASE.PLANNING) return;
  const dir = KEY_DIRS[k];
  if (!dir) return;
  const last = playerPath.length ? playerPath[playerPath.length - 1] : { x: player.x, y: player.y };
  const nx = last.x + dir.dx, ny = last.y + dir.dy;
  const idx = findLastIndex(playerPath, p => p.x === nx && p.y === ny);
  if (idx >= 0) {
    if (idx === 0 && playerPath.length > 1) return;
    if (idx < playerPath.length - 1) {
      playerPath = playerPath.slice(0, idx + 1);
      attackIndices = attackIndices.filter(i => i < playerPath.length);
      skillIndices = skillIndices.filter(i => i < playerPath.length);
      refreshBoardOnly();
    }
    return;
  }
  if (countMoveSteps(playerPath) < player.move && isWalkable(nx, ny) && !(nx === player.x && ny === player.y)) {
    playerPath.push({ x: nx, y: ny });
    refreshBoardOnly();
  }
}

/* 选角阶段的侧栏：只剩「行为提示 + 未分配点数」。
 * 角色信息本体已并入共用面板（heroInnerHtml），这里不再各画一套（ISSUE-20261029-38）。 */
function renderCharSelectStats() {

    return;
  }
  /* ISSUE-20261028-19：动态角色在选角阶段显示剩余点数（没加完也能直接出门，点数带进第 1 关） */
  const ptsLeft = candidatePointsLeft();
  const ptsLine = (charIsDynamic(selectedCandidate.id) && ptsLeft > 0)
    ? `<div class="stat" style="color:#ffd700">剩余 ${ptsLeft} 点属性未分配 · 点六维图上的属性名加点</div>`
    : '';
  /* ★ ISSUE-20261029-29（人类 04:16 / 04:42）：原先这里还挂着一张「技能说明」卡片
   * （char.desc + tips 列表）。现在技能说明改由棋盘上那块 #charInfoSheet 展开层承担
   * ——「点击角色之后，角色这一行以上的部分展开角色技能说明文字，可以滚轮滑动查看，
   * 删掉之前的技能说明面板」。侧栏只留点数提醒，避免同一份文字两处各写一遍。 */
  statsEl.innerHTML = ptsLine;
}

function updateStats() {
  drawRadar();
  if (phase === PHASE.CHAR_SELECT) {
    renderCharSelectStats();
    /* ★ ISSUE-20261029-35：大厅分支必须同步虚拟面板。
     * 原来 syncVirtualPad() 只写在「对局中」那段代码里，大厅走 early return 就跳过了它 ——
     * 于是面板一直停在上一个界面的状态：
     *   「打完一局 → 重新开始 → 回大厅」时，停的是结算界面的状态（四个方向键全部 disabled），
     *   而 .vbtn:disabled 带 pointer-events:none，事件根本进不来 →
     *   手机上回大厅后虚拟按钮全废，走不到 🚪 出口、开不了下一局。
     * （新开大厅之所以正常，只是因为 mountVirtualPad() 挂载时恰好同步过一次 —— 那条路是唯一的。） */
    if (typeof syncVirtualPad === 'function') syncVirtualPad();
    return;
  }

  /* ---------- 对局中 ---------- */
  if (!player) return;
  if (player.hp > 0 && player.alive) playerStats.currentHp = player.hp;
  const isRanged = playerIsRanged();   /* ISSUE-20261028-19：动态角色按六维现算，别读静态表 */

  /* ★ ISSUE-20261029-38：角色信息全屏只有一份（heroInnerHtml），renderHeroCard() 同时写
   * #hud（行动按钮正上方）与角色面板顶部 #charTop。
   * SP 条下那排徽章按人类 15:52 拍板**整排删除**（技力数值 / 闪避中 / 闪避节点 /
   * 技力满提示 / 护盾 / 小队 / 技能节点 / 动作超限 / 技能未就绪 / buff 药丸 全不留）：
   *   · buff 改在 ♟️ 角色面板右下角常驻显示（ISSUE-20261029-42）；
   *   · 动作计数与节点提示由「开始行动」按钮文案承担（buildActionLabel）；
   *   · 护盾在血条右侧还有一道白条（.hp-shield）。 */
  renderHeroCard();

  /* 底部信息 */
  const phaseText = phase === PHASE.PLANNING ? '规划' : phase === PHASE.RESOLVING ? '结算' : phase === PHASE.LEVELCLEAR ? '通关' : '结束';
  const footParts = [`回合 ${battleRound}`, `敌人 ${enemies.filter(e => e.alive).length}`, `阶段 ${phaseText}`, `格 ${countWalkable(map)}`];
  if (isRanged) footParts.push(`射程 ${player.range}`);
  const foot = `<div class="mini">${footParts.join(' · ')}</div>`;

  statsEl.innerHTML = '';   // 徽章行已随 ISSUE-20261029-38 整排删除，侧栏此处不再有内容
  if (footEl) footEl.innerHTML = foot;
  // 手机圆钮的数值 / 技力环跟随状态刷新；角色面板开着时同步六维图与 BUFF 池
  if (typeof syncVirtualPad === 'function') syncVirtualPad();
  if (typeof drawerIsOpen === 'function' && drawerIsOpen('char')) renderCharPanel();
}

/* ★ ISSUE-20261029-42：角色面板内容。
 *   顶部 #charTop —— 由 renderHeroCard() 写入，和「行动按钮上方 HUD」同一份 HTML；
 *   左下 #charRadarCanvas —— 六维图，点属性名直接加点（drawRadar 记 charRadarLabelHits）；
 *   右下 #charBuffs —— 升级获得的 BUFF 奖励池（33 号之前它是 #stats 里的胶囊，已被 38 号删掉）。
 * 选角相位显示当前候选角色，对局中显示当前玩家：两者都由 heroCardOpt() 统一给出。 */
function renderCharPanel() {
  renderHeroCard();
  const canvas = document.getElementById('charRadarCanvas');
  if (canvas) {
    /* 不传 forceAbilities → canAlloc 按 phase 自动判定，六维顶点金框 = 可加点 */
    try { drawRadar(canvas); } catch (_) {}
  }
  const hint = document.getElementById('charAllocHint');
  if (hint) {
    /* ★ 选角相位时 playerStats 还没建好，必须用 pointsLeftNow()（已分相位），
     * 否则预备干员在大厅那 5 点「剩余 N 点」提示永远为空、雷达也点不动。 */
    const pts = pointsLeftNow();
    hint.textContent = pts > 0 ? `剩余 ${pts} 点属性 · 点六维图上的属性名加点` : '';
  }
  const box = document.getElementById('charBuffs');
  if (box) box.innerHTML = charBuffPoolHtml();
}

/* 右下 BUFF 池：数据源与升级奖励同一个 BUFF_POOL × buffs 层数。
 * 一层都没有时给灰色占位（人类 2026-10-29 16:2x 拍板），不留半块空白。 */
function charBuffPoolHtml() {
  const owned = BUFF_POOL.filter(b => (buffs[b.id] || 0) > 0);
  const head = '<div class="char-buffs-title">升级奖励</div>';
  if (!owned.length) return head + '<div class="char-buffs-empty">暂无升级奖励</div>';
  return head + owned.map(b =>
    `<div class="char-buff" title="${b.name}：${b.desc}"><span class="ico">${b.icon}</span><span class="nm">${b.name}</span><span class="ct">×${buffs[b.id]}</span></div>`
  ).join('');
}

function allocateAbilityPoint(abilityKey) {
  /* ISSUE-20261028-19：选角阶段加的是「候选副本」，不进 playerStats（那时它还不该存在）。
   * 注意这里只放行**动态角色**（预备干员）：前四个角色在选角相位仍然加不了点，行为与之前完全一致。 */
  if (phase === PHASE.CHAR_SELECT) {
    if (!allocateCandidatePoint(abilityKey)) return;
    renderCharSelectStats();      /* 面板数值实时跟手 */
    if (typeof drawerIsOpen === 'function' && drawerIsOpen('char')) renderCharPanel();
    return;
  }
  if (phase !== PHASE.PLANNING && phase !== PHASE.LEVELCLEAR) return;
  if (playerStats.abilityPoints <= 0) return;
  if (playerStats.abilities[abilityKey] >= ABILITY_CAP) return;
  playerStats.abilities[abilityKey] += 1;
  playerStats.abilityPoints -= 1;
  const oldMaxHp = playerStats.maxHp;
  recomputePlayerDerivedStats();
  const diff = playerStats.maxHp - oldMaxHp;
  if (diff > 0) {
    playerStats.currentHp += diff;
    if (player && player.alive) player.hp += diff;
  } else if (diff < 0) {
    playerStats.currentHp = Math.min(playerStats.currentHp, playerStats.maxHp);
    if (player && player.alive) player.hp = Math.min(player.hp, playerStats.maxHp);
  }
  if (player) syncPlayerFromStats();
  /* 升级加点直接在角色面板（♟️）六维图上点：刷新面板 + 全量重绘（下一关按钮随点数归零启用） */
  if (typeof drawerIsOpen === 'function' && drawerIsOpen('char')) renderCharPanel();
  /* 升级加点全部加完 → 自动收起角色面板，放行下一关（ISSUE-20261029-37） */
  if (phase === PHASE.LEVELCLEAR && playerStats.abilityPoints <= 0 && typeof drawerClose === 'function') drawerClose();
  render();
}

/* ★ ISSUE-20261029-36：动作 UI 合并进「开始行动」按钮。
 * 框沿用 .start-btn（原本的绿色胶囊配色），内部文字换成动作标签，去掉「开始行动」四字。
 * 标签按实际结算顺序（plannedActionInfo.order）拼：闪避 / 攻击×N / 技能×N，并附 已用/上限。 */
function buildActionLabel() {
  if (phase !== PHASE.PLANNING) return '—';
  const planInfo = plannedActionInfo(playerPath, attackIndices, skillIndices);
  const actionUsed = planInfo.actions;
  const actionMax = maxActionsThisTurn();
  const kinds = (planInfo.order || []).map(o =>
    o.kind === 'dodge' ? '闪避' : (o.kind === 'attack' ? `攻击×${o.count}` : `技能×${o.count}`));
  if (!kinds.length) return '未规划动作';
  return `${kinds.join('+')}${actionMax > 1 ? ` ${actionUsed}/${actionMax}` : ''}`;
}

function updateStartBtn() {
  if (phase !== PHASE.PLANNING) return;
  /* 开始行动按钮现在可能有三个位置（ISSUE-20261029-29）：
   * 手机底栏面板顶部（vpadStartSlot）> 竖屏 #actionSlot > 底部 #controls（横屏桌面）。 */
  const vpadSlot = (typeof vpadStartSlotEl === 'function') ? vpadStartSlotEl() : null;
  const btn = (vpadSlot && vpadSlot.querySelector('.start-btn'))
    || controlsEl.querySelector('.start-btn')
    || (actionSlotEl ? actionSlotEl.querySelector('.start-btn') : null);
  if (btn) { btn.disabled = playerPath.length === 0; btn.textContent = buildActionLabel(); }
}

/* ★ ISSUE-20261029-37 / 38：行动按钮上方 HUD。
 * 现在它只是「共用角色面板」的一个容器：内容由 heroInnerHtml() 生成（与 ♟️ 角色面板
 * 顶部同一份），这里只负责建壳。旧 .hud-line/.hud-* 那套白色小字标记已删除。 */
function buildHud() {
  const hud = document.createElement('div');
  hud.className = 'hud';
  hud.id = 'hud';
  const opt = heroCardOpt();
  if (opt) hud.innerHTML = heroInnerHtml(opt);
  return hud;
}

function renderControls() {
  controlsEl.innerHTML = '';
  if (actionSlotEl) actionSlotEl.innerHTML = '';
  /* ISSUE-20261029-29：手机端「开始行动」进底栏面板顶部（最高优先级），
   * 否则竖屏走 #actionSlot、横屏走 #controls —— 与改造前逐条等价。 */
  const vpadSlot = (typeof vpadStartSlotEl === 'function') ? vpadStartSlotEl() : null;
  if (vpadSlot) vpadSlot.innerHTML = '';
  const vertical = document.body.classList.contains('layout-v');
  const btnHost = vpadSlot || ((vertical && actionSlotEl) ? actionSlotEl : controlsEl);
  // 行动区外层：HUD 紧贴行动按钮上方，纵向堆叠
  // ★ ISSUE-20261029-38：原来只在 PLANNING/LEVELCLEAR/GAMEOVER 建 HUD，选角相位没有面板；
  //   现在所有相位都建 —— 大厅显示候选角色（未选则「选择角色」），战死/通关显示玩家。
  const wrap = document.createElement('div');
  wrap.className = 'action-wrap';
  wrap.appendChild(buildHud());
  if (phase === PHASE.PLANNING) {
    const confirm = document.createElement('button');
    /* ★ ISSUE-20261029-36：去掉「开始行动」四字，按钮内部显示动作 UI，框沿用 .start-btn 配色 */
    confirm.className = 'start-btn action-start-btn';
    confirm.textContent = buildActionLabel();
    confirm.disabled = playerPath.length === 0;
    confirm.onclick = confirmAction;
    wrap.appendChild(confirm);
    const tip = document.createElement('div');
    tip.style.cssText = 'font-size:12px; color:#888; text-align:center; padding:2px; line-height:1.35; white-space:pre-wrap;';
    // 手机端不显示键盘快捷键（ISSUE-20261028-09 D），换成一行触摸说明
    tip.textContent = (typeof vpadMounted !== 'undefined' && vpadMounted)
      ? '点棋盘移动 · 单击路径节点=攻击（点脚下那格=原地攻击）· 双击=技能（双击脚下那格=原地施法）\n左下方向键移动 · 右下键 = 「↺重置」/ 等待 / 攻击 / 技能\n长按攻击键 = 看攻击范围'
      : 'WASD/点击移动 · 单击路径节点=攻击（点脚下那格=原地攻击）· 双击=技能（双击脚下那格=原地施法）\nE=攻击 · R=技能 · Q=等待 · V=攻击范围 · 空格确认 · X 重置路径\n右键路径格=技能节点 · 主动行动三选一：攻击 / 技能 / 闪避（第一个等待）';
    wrap.appendChild(tip);
  } else if (phase === PHASE.GAMEOVER) {
    const btn = document.createElement('button');
    btn.className = 'start-btn';
    btn.textContent = '重新开始';
    btn.onclick = () => initCharSelect();
    wrap.appendChild(btn);
  } else if (phase === PHASE.LEVELCLEAR) {
    const tip = document.createElement('div');
    tip.style.cssText = 'font-size:13px; color:#ffd700; text-align:center; padding:4px;';
    if (pendingLevelUps > 0) {
      tip.textContent = '升级！请选择一项奖励…';
    } else if (playerStats.abilityPoints > 0) {
      tip.textContent = `把 ${playerStats.abilityPoints} 点属性加完就能进下一关`;
      /* 属性抽屉已移除（ISSUE-20261029-37）：奖励选完后若还有属性点，自动弹出 ♟️ 角色面板加点。
         只在当前没有任何抽屉时弹，避免把玩家已经打开的面板顶掉。 */
      if (typeof drawerCurrent !== 'undefined' && !drawerCurrent) {
        setTimeout(() => { if (phase === PHASE.LEVELCLEAR && playerStats.abilityPoints > 0 && !drawerCurrent) drawerOpen('char'); }, 80);
      }
    } else {
      tip.textContent = `关卡通过！（本次未升级，经验 ${xp}/${xpThresholdForLevel(heroLevel)}）即将进入下一关…`;
    }
    wrap.appendChild(tip);
    // 未选奖励前不显示下一关按钮；选完奖励后若还有属性点，按钮禁用直到加完
    if (pendingLevelUps <= 0) {
      const btn = document.createElement('button');
      btn.className = 'start-btn';
      if (playerStats.abilityPoints > 0) {
        btn.textContent = '⬇️ 下一关（先把属性点加完）';
        btn.disabled = true;
      } else {
        btn.textContent = '⬇️ 下一关';
        btn.onclick = proceedNextLevel;
      }

function toggleAttack(idx) {

   * 那段「原地攻击」的支持代码永远是死分支（ISSUE-20261028-17 / BUG-STARTCELL-ATTACK）。
   * 越界仍然要挡：idx 必须落在当前路径范围内。 */
  if (idx < 0 || idx >= playerPath.length) return;
  if (selectedChar === 'fencer' && fencerCounterActive) {
    log('反击状态不能设置攻击节点。');
    return;

  if (selectedChar === 'wheelchair' && playerChargingThisTurn) {
    log('冲锋中不能设置攻击节点（冲锋会自动撞击前方敌人）。');

    log('该节点是技能节点：双击（或再按 R）可取消技能节点。');
    return;
  }
  const ai = attackIndices.indexOf(idx);
  if (ai >= 0) {
    attackIndices.splice(ai, 1);
    return;

  if (!nodeFitsBudget(playerPath, [...attackIndices, idx], skillIndices)) {
    log(budgetRejectReason(playerPath, [...attackIndices, idx], skillIndices));
    return;
  }
  attackIndices.push(idx);

    ? '🎯 原地攻击：不移动，进入本回合后先在起始格出手（占一次动作）。'

 * ★ ISSUE-20261029-34：起点格（idx 0）现在也允许放技能节点 = 「原地施法」——

function toggleSkill(idx) {

  if (idx === 0 && selectedChar === 'wheelchair') {

    return;

  const nextAtk = attackIndices.filter(i => i !== idx);

    log(budgetRejectReason(playerPath, nextAtk, [...skillIndices, idx]));

  attackIndices = nextAtk;
