<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟战棋</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1a2e; overflow:hidden; }
  #game { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#eee; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;
  }
</style>
</head>
<body>
<div id="loading">游戏加载中…</div>
<iframe id="game" src="game.html" onload="onGameLoad()"></iframe>

<!--
  成绩上报钩子源码（type=text/plain 不会被浏览器执行，仅作为文本被注入到游戏 iframe 中）。
  它通过轮询游戏的顶层变量判定「游戏结束」并上报，与具体游戏版本解耦：
  只要游戏仍用 phase / level / enemies 这三个变量名，换 HTML 内容也无需改动此处。
-->
<script id="hooksrc" type="text/plain">
(function () {
  var sent = false;
  function tick() {
    try {
      var p = (typeof phase !== 'undefined') ? phase : null;
      if (p === 'gameover') {
        if (!sent) {
          sent = true;
          var en = (typeof enemies !== 'undefined') ? enemies : [];
          var kills = (en && en.filter) ? en.filter(function (e) { return !e.alive; }).length : 0;
          var lvl = (typeof level !== 'undefined') ? level : 0;
          parent.postMessage({ type: 'rogue_score', level: lvl, kills: kills }, '*');
        }
      } else {
        sent = false; // 下一局重新开始判定
      }
    } catch (e) {}
    setTimeout(tick, 300);
  }
  setTimeout(tick, 300);
})();
</script>

<script>
// ===== 游戏 iframe 加载完成后，把上报钩子注入进去 =====
function onGameLoad() {
  var l = document.getElementById('loading');
  if (l) l.remove();
  try { injectHook(); } catch (e) {}
}

function injectHook() {
  var f = document.getElementById('game');
  var d = f.contentDocument || (f.contentWindow && f.contentWindow.document);
  if (!d || !d.body) return;
  var s = d.createElement('script');
  s.textContent = document.getElementById('hooksrc').textContent;
  d.body.appendChild(s);
}

// ===== 接收游戏 iframe 的成绩，补上 Telegram 身份后 sendData 回 bot =====
window.addEventListener('message', function (e) {
  try {
    var d = e.data;
    if (!d || d.type !== 'rogue_score') return;
    var W = window.Telegram && window.Telegram.WebApp;
    if (!W || !W.sendData) return;
    var u = (W.initDataUnsafe && W.initDataUnsafe.user) || {};
    var payload = {
      type: 'rogue_score',
      level: d.level || 0,
      kills: d.kills || 0,
      tg_id: u.id || 0,
      tg_name: u.username || u.first_name || '匿名',
      initData: W.initData
    };
    W.sendData(JSON.stringify(payload));
  } catch (e) {}
});

// ===== Telegram Mini App 初始化 =====
try {
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
} catch (e) {}
</script>
</body>
</html>
