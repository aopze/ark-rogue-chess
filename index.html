<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟战棋</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
  html, body { margin:0; padding:0; height:100%; background:#1a1a2e; overflow:hidden; }
  #game { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#eee; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;
  }
  /* 提示条：说明当前入口能不能上报成绩 */
  #hint {
    position:fixed; left:0; right:0; top:0; z-index:9999;
    padding:9px 12px; font-size:13px; line-height:1.5;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#8a5a00; color:#fff; text-align:center;
  }
  #hint.ok { background:#1f6f3f; }
  #hint.hide { display:none; }
  #toast {
    position:fixed; left:50%; bottom:14%; transform:translateX(-50%); z-index:9999;
    max-width:86%; padding:12px 16px; border-radius:10px; font-size:14px; line-height:1.6;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:rgba(0,0,0,.82); color:#fff; text-align:center; display:none;
  }
  /* ===== 排行榜浮层（DLC 模块入口）===== */
  #rankBtn {
    position:fixed; right:10px; bottom:14px; z-index:9998;
    padding:9px 14px; border-radius:22px; font-size:14px; font-weight:600;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:rgba(20,22,44,.82); color:#ffd166; border:1px solid rgba(255,209,102,.45);
    box-shadow:0 4px 16px rgba(0,0,0,.45); cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  #rankBtn:active { transform:scale(.96); }
  #rankPanel {
    position:fixed; inset:0; z-index:10000; display:none;
    background:rgba(8,9,20,.94); backdrop-filter:blur(3px);
  }
  #rankPanel.open { display:block; }
  #rankPanel iframe { position:absolute; left:0; top:0; width:100%; height:100%; border:0; }
  #rankClose {
    position:absolute; right:12px; top:12px; z-index:10001;
    width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.2);
    background:rgba(30,32,58,.9); color:#fff; font-size:18px; line-height:1; cursor:pointer;
  }
  </style>
</head>
<body>
<div id="loading">游戏加载中…</div>
<div id="hint" class="hide"></div>
<div id="toast"></div>
<button id="rankBtn">🏆 排行榜</button>
<div id="rankPanel">
  <button id="rankClose">✕</button>
  <iframe id="rankFrame" src="leaderboard.html"></iframe>
</div>
<iframe id="game" src="game.html" onload="onGameLoad()"></iframe>

<!--
  成绩上报钩子源码（type=text/plain 不会被浏览器执行，仅作为文本被注入到游戏 iframe 中）。
  它通过轮询游戏的顶层变量判定「游戏结束」并上报，与具体游戏版本解耦：
  只要游戏仍用 phase / level / enemies 这三个变量名，换 HTML 内容也无需改动此处。

  kills 语义 = 整局累计击杀：
    游戏每关会重建 enemies 数组（enemies = [] 后重新 push），且没有内置累计击杀变量，
    所以钩子自己维护 carry —— 检测到 enemies 数组引用变化（=换关）时，
    把上一关的击杀数并入 carry；检测到 level 回退（= 重新开新一局）时清零。
-->
<script id="hooksrc" type="text/plain">
(function () {
  var sent = false;
  var prevEnemies = null;   // 上一 tick 的 enemies 数组引用
  var prevDead = 0;         // 上一 tick 的本关已死数
  var carry = 0;            // 已结束关卡的累计击杀
  var prevLevel = 0;        // 上一 tick 的层数

  function collect() {
    var p = (typeof phase !== 'undefined') ? phase : null;
    var lvl = (typeof level !== 'undefined') ? level : 0;
    var en = (typeof enemies !== 'undefined') ? enemies : null;

    // 换关：enemies 数组被重建 → 上一关的击杀并入累计
    if (prevEnemies !== null && en !== prevEnemies) {
      carry += prevDead;
      prevDead = 0;
    }
    // 新一局：层数回退 → 累计清零
    if (lvl < prevLevel) {
      carry = 0;
      prevDead = 0;
    }
    prevLevel = lvl;

    var dead = (en && en.filter) ? en.filter(function (e) { return !e.alive; }).length : 0;
    prevEnemies = en;
    prevDead = dead;

    return { phase: p, level: lvl, kills: carry + dead };
  }

  function tick() {
    try {
      var s = collect();
      if (s.phase === 'gameover') {
        if (!sent) {
          sent = true;
          parent.postMessage({ type: 'rogue_score', level: s.level, kills: s.kills }, '*');
        }
      } else {
        sent = false; // 下一局重新开始判定
      }
    } catch (e) {}
    setTimeout(tick, 300);
  }
  setTimeout(tick, 300);
})();
</script>

<script>
// ===== 入口能力判定 =====
// Telegram 官方规定：Telegram.WebApp.sendData **只在 keyboard button（回复键盘上的
// web_app 按钮）入口下可用**；inline button / menu button 打开的 Mini App
// 调 sendData 不会产生任何 web_app_data 更新（那两个入口只有 initData）。
// 反过来 keyboard button 入口的 initData 是空的。
// 所以：initData 为空 => 是 keyboard 入口 => 能上报；initData 非空 => 不能上报。
var W = (window.Telegram && window.Telegram.WebApp) || null;
var HAS_SDK = !!W;
var HAS_INIT = !!(W && W.initData);              // 非空 = inline/menu 入口
var CAN_REPORT = HAS_SDK && !HAS_INIT;           // keyboard 按钮入口才可上报
var IN_TG = HAS_SDK && W.platform !== 'unknown';  // 是否在真实 Telegram 客户端里

function showHint(text, ok) {
  var h = document.getElementById('hint');
  if (!h) return;
  h.textContent = text;
  h.className = ok ? 'ok' : '';
}
function hideHint() {
  var h = document.getElementById('hint');
  if (h) h.className = 'hide';
}
function toast(text, ms) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = text;
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, ms || 6000);
}

// 入口提示
if (IN_TG) {
  if (CAN_REPORT) {
    showHint('✅ 键盘入口 · 成绩会自动记录', true);
    setTimeout(hideHint, 4000);
  } else {
    showHint('⚠️ 当前入口不记录成绩。请私聊 bot 发 /play，点键盘上的「▶️ 方舟战棋」进入（那个入口才能上报）', false);
  }
} else {
  showHint('🌐 浏览器预览模式：成绩不会记录（需在 Telegram 内从键盘按钮进入）', false);
}
// ===== 排行榜浮层（DLC 模块）=====
var MY_SCORE = null;   // 我这次的成绩，游戏结束时写入

function openRank(){
  var p = document.getElementById('rankPanel');
  if (!p) return;
  p.classList.add('open');
  // 浮层刚开，iframe 可能还没 ready → 先把成绩存着，onload 时补发
  pushMyScore();
}
function closeRank(){
  var p = document.getElementById('rankPanel');
  if (p) p.classList.remove('open');
}
function pushMyScore(){
  if (!MY_SCORE) return;
  try {
    var f = document.getElementById('rankFrame');
    if (f && f.contentWindow) {
      f.contentWindow.postMessage({type:'my_score', level: MY_SCORE.level, kills: MY_SCORE.kills}, '*');
    }
  } catch (e) {}
}
document.addEventListener('DOMContentLoaded', function(){
  var b = document.getElementById('rankBtn');
  var c = document.getElementById('rankClose');
  var f = document.getElementById('rankFrame');
  if (b) b.addEventListener('click', openRank);
  if (c) c.addEventListener('click', closeRank);
  if (f) f.addEventListener('load', pushMyScore);
});

// ===== 游戏 iframe 加载完成后，把上报钩子注入进去 =====
function onGameLoad() {
  var l = document.getElementById('loading');
  if (l) l.remove();
  try { injectHook(); } catch (e) {}
}

function injectHook() {
  var f = document.getElementById('game');
  var d = f.contentDocument || (f.contentWindow && f.contentWindow.document);
  if (!d || !d.body) return;
  var s = d.createElement('script');
  s.textContent = document.getElementById('hooksrc').textContent;
  d.body.appendChild(s);
}

// ===== 接收游戏 iframe 的成绩，补上 Telegram 身份后 sendData 回 bot =====
window.addEventListener('message', function (e) {
  try {
    var d = e.data;
    if (!d || d.type !== 'rogue_score') return;
    var payload = {
      type: 'rogue_score',
      level: d.level || 0,
      kills: d.kills || 0,
      tg_id: 0,
      tg_name: '',
      initData: (W && W.initData) || ''
    };
    // 记下我的成绩 → 排行榜浮层里高亮「我」的那一行
    MY_SCORE = {level: payload.level, kills: payload.kills};
    pushMyScore();

    if (CAN_REPORT && W && W.sendData) {
      W.sendData(JSON.stringify(payload));
      toast('📊 成绩已提交：第 ' + payload.level + ' 层 / 击杀 ' + payload.kills
            + '\n点右下角 🏆 看排行榜', 5000);
    } else if (IN_TG) {
      // inline / 菜单入口：sendData 无效，明确告诉玩家怎么才能记成绩
      toast('⚠️ 这个入口不能记录成绩。\n请私聊 bot 发 /play，点键盘上的「▶️ 方舟战棋」重开一局。', 9000);
      showHint('⚠️ 当前入口不记录成绩 · 请用 /play 的键盘按钮进入', false);
    } else {
      toast('🌐 浏览器预览模式，成绩不会记录。\n（你的成绩：第 ' + payload.level + ' 层 / 击杀 ' + payload.kills + '）', 7000);
    }
  } catch (e) {}
});

// ===== Telegram Mini App 初始化 =====
try {
  if (W) {
    W.ready();
    W.expand();
  }
} catch (e) {}
</script>
</body>
</html>
