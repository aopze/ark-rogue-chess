// 连按 5 次 Shift 进入 / 退出调试态
let shiftPressCount=0;
let lastShiftAt=0;
document.addEventListener('keydown',e=>{
  if(e.key!=='Shift'||e.repeat) return;
  const now=Date.now();
  if(now-lastShiftAt>1200) shiftPressCount=0;
  lastShiftAt=now;
  shiftPressCount++;
  if(shiftPressCount>=5){
    shiftPressCount=0;
    toggleEditMode();
  }
});

// 读取磁盘上的原始 HTML 源码（优先 fetch 自身；file:// 下则用 DOM 兜底）
async function fetchSourceHTML(){
  try{
    const r=await fetch(location.href+'?_src='+Date.now(),{cache:'no-store'});
    if(r.ok){const t=await r.text();if(t&&t.includes('id="quiz-container"')) return t;}
  }catch(e){}
  // 兜底：序列化当前 DOM（去掉运行态痕迹）
  const c=document.documentElement.cloneNode(true);
  $$('[contenteditable]',c).forEach(el=>el.removeAttribute('contenteditable'));
  return '<!DOCTYPE html>\n'+c.outerHTML;
}

// 收集编辑映射：data-edit-orig（原始文本）-> 当前文本
function collectEditMap(){
  const map=[];
  $$('[data-edit-orig]').forEach(el=>{
    const orig=el.getAttribute('data-edit-orig');
    const now=el.textContent;
    if(orig!=null&&now!==orig) map.push([orig,now]);
  });
  return map;
}

// 生成编辑后的完整 HTML：在原始源码上做文本替换
async function buildEditedHTML(){
  let src=await fetchSourceHTML();
  const map=collectEditMap();
  map.forEach(([orig,now])=>{
    if(orig&&orig.length&&orig!==now) src=src.split(orig).join(now);
  });
  // 防止把调试运行态写进文件（file:// 下读不到源码时会序列化当前 DOM，必须清掉运行态痕迹）
  src=src.replace(/<body([^>]*)>/i,function(m,attrs){return '<body'+attrs.replace(/class="[^"]*"/i,'').replace(/class='[^']*'/i,'')+'>';});
  src=src.replace(/(<button id="save-edit-btn"[^>]*style=")[^"]*(")/i,'$1display:none;$2');
  src=src.replace(/(<button id="debug-btn"[^>]*style=")[^"]*(")/i,'$1display:none;$2');
  src=src.replace(/(<button id="debug-btn"[^>]*>)[^<]*(<\/button>)/i,'$1🛠️ 调试模式$2');
  src=src.replace(/\s+data-edit-orig="[^"]*"/g,'');
  return {html:src,map};
}

async function saveEditsToFile(){
  syncEdits();
  const {html}=await buildEditedHTML();
  const saveBlob=(blob)=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='角色卡填写.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  };
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  // 优先：让用户选择原文件直接覆盖写回（Chrome/Edge 支持）
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({
        suggestedName:'角色卡填写.html',
        types:[{description:'HTML',accept:{'text/html':['.html']}}]
      });
      const writable=await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      toast('✅ 已写回文件');
      return;
    }catch(e){
      if(e&&e.name==='AbortError'){toast('已取消保存');return;}
      // 权限/环境不支持时降级为下载
    }
  }
  saveBlob(blob);
  toast('已下载修改版，请替换原文件');
}

/* ============ 我创建过的角色卡（本地即时缓存 + GitHub 对账）============ */
const CARDS_JSON_URL='https://aopze.github.io/ark-rogue-chess/cards.json';
let _myCardsCache=[];
function _tgUserId(){
  try{
    const w=window.Telegram&&Telegram.WebApp;
    if(!w) return '';
    const u=w.initDataUnsafe&&w.initDataUnsafe.user;
    return u?String(u.id):'';
  }catch(e){return '';}
}
function _cacheKey(uid){ return 'yu7_cards_'+(uid||'guest'); }
function _loadLocal(uid){
  try{
    const cards=JSON.parse(localStorage.getItem(_cacheKey(uid))||'{"cards":[]}').cards||[];
    // 给有完整卡的记录挂上 html（从独立 key 读）
    cards.forEach(c=>{ if(c.hasFull) c.html=_getCardHtml(uid,c.name); });
    return cards;
  }
  catch(e){ return []; }
}
function _saveLocal(uid,cards){
  // 主索引不存完整 HTML（太大），只存标记；html 由 _saveCardHtml 单独存
  const slim=(cards||[]).map(c=>{ const o=Object.assign({},c); delete o.html; return o; });
  try{ localStorage.setItem(_cacheKey(uid),JSON.stringify({cards:slim,synced_at:Date.now()})); return true; }
  catch(e){ return false; }
}
/* 单张完整卡 HTML 单独存，key 按 uid+卡名，避免主索引过大 */
function _cardHtmlKey(uid,name){ return 'yu7_card_html_'+uid+'_'+encodeURIComponent(name); }
function _saveCardHtml(uid,name,html){
  try{ if(html) localStorage.setItem(_cardHtmlKey(uid,name),html); return true; }
  catch(e){ return false; }
}
function _getCardHtml(uid,name){
  try{ return localStorage.getItem(_cardHtmlKey(uid,name))||''; }
  catch(e){ return ''; }
}
/* 已删除名单（墓碑）：防止 bot 对账把删掉的卡又加回来 */
function _deletedKey(uid){ return 'yu7_deleted_cards_'+uid; }
function _getDeleted(uid){
  try{ return JSON.parse(localStorage.getItem(_deletedKey(uid))||'[]'); }
  catch(e){ return []; }
}
function _addDeleted(uid,name){
  try{
    const arr=_getDeleted(uid);
    if(arr.indexOf(name)<0) arr.push(name);
    localStorage.setItem(_deletedKey(uid),JSON.stringify(arr));
  }catch(e){}
}
function _delCardHtml(uid,name){
  try{ localStorage.removeItem(_cardHtmlKey(uid,name)); }catch(e){}
}
/* 待同步操作队列：删除/改名先记本地，点「完成」时一次性 sendData 给 bot */
function _pendingKey(uid){ return 'yu7_pending_ops_'+(uid||'guest'); }
function _getPending(uid){
  try{ const a=JSON.parse(localStorage.getItem(_pendingKey(uid))||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function _addPending(uid,op){
  try{
    const arr=_getPending(uid);
    arr.push(op);
    localStorage.setItem(_pendingKey(uid),JSON.stringify(arr.slice(-50)));
  }catch(e){}
}
function _clearPending(uid){ try{ localStorage.removeItem(_pendingKey(uid)); }catch(e){} }
function _flushPendingOps(){
  const uid=_tgUserId();
  if(!uid) return false;
  const pending=_getPending(uid);
  if(!pending.length) return false;
  const wa=window.Telegram&&window.Telegram.WebApp;
  if(!wa||typeof wa.sendData!=='function') return false;  // 浏览器直开：留在队列，下次在 Telegram 内再发
  try{
    wa.sendData(JSON.stringify({kind:'card_ops',ops:pending}));
    _clearPending(uid);
    return true;
  }catch(e){ return false; }
}
/* 显示我创建的卡片墙（含末尾加号卡片） */
let _editMode=false;
function toggleEditModeCards(){

    // 编辑模式：卡片顶部显示重命名/删除按钮
    const ops=_editMode
      ? '<div style="display:flex;gap:4px;justify-content:center;margin-bottom:4px;">'

        +'<button onclick="event.stopPropagation();askDeleteCard('+i+')" style="padding:2px 7px;border:1px solid #fca5a5;background:#fef2f2;color:#dc2626;border-radius:10px;font-size:.68rem;cursor:pointer;">🗑 删除</button>'
        +'</div>'
      : '';
    return '<div onclick="'+( _editMode?'void(0)':'_showCardDetail('+i+')')+'" style="cursor:'+( _editMode?'default':'pointer')+';aspect-ratio:3/4;border:2px solid '+(c._local?'#fcd34d':'#c7d2fe')+';border-radius:12px;background:'+(c._local?'#fffbeb':'linear-gradient(160deg,#eef2ff,#fff)')+';padding:12px;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .15s;">'

  + '<div onclick="startCreate()" style="cursor:pointer;aspect-ratio:3/4;border:2px dashed #a5b4fc;border-radius:12px;background:#f8fafc;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#6366f1;transition:transform .15s;">'
  +'<div style="font-size:2.6rem;line-height:1;">＋</div>'

/* 点卡片：打开完整角色卡（和旧导出一致，可编辑/添加/保存），用全屏 iframe */
let _cardBlobUrl=null;
function _showCardDetail(idx){
  const c=_myCardsCache[idx];
  if(!c) return;

    // 有完整独立卡 HTML → iframe 打开，功能完整

function closeCardFull(){

/* ===== 卡片管理：删除 / 重命名 ===== */
let _cardAction={mode:'',idx:-1};
function askDeleteCard(i){
  const c=_myCardsCache[i]; if(!c) return;
  _cardAction={mode:'delete',idx:i};
  $('#ca-title').textContent='🗑 删除角色卡';
  $('#ca-rename-body').style.display='none';
  $('#ca-delete-body').style.display='block';
  $('#ca-delete-body').innerHTML='确定删除「<b>'+escCardText(c.name||'未命名')+'</b>」吗？<br>此操作不可恢复。';
  const btn=$('#ca-confirm'); btn.textContent='🗑 删除'; btn.style.background='#dc2626';
  $('#card-action-modal').classList.add('show');
}
function askRenameCard(i){
  const c=_myCardsCache[i]; if(!c) return;
  _cardAction={mode:'rename',idx:i};
  $('#ca-title').textContent='✎ 重命名角色卡';
  $('#ca-rename-body').style.display='block';
  $('#ca-delete-body').style.display='none';
  $('#ca-newname').value=c.name||'';
  const btn=$('#ca-confirm'); btn.textContent='✎ 保存'; btn.style.background='#4f46e5';
  $('#card-action-modal').classList.add('show');
  setTimeout(()=>{ const el=$('#ca-newname'); if(el){el.focus();el.select();} },80);
}
function closeCardAction(){ $('#card-action-modal').classList.remove('show'); }
function confirmCardAction(){
  const uid=_tgUserId(), idx=_cardAction.idx, mode=_cardAction.mode;
  const c=_myCardsCache[idx];
  if(!uid||!c) return closeCardAction();
  const oldName=c.name||'未命名';
  const cards=_loadLocal(uid);
  if(mode==='delete'){
    const target=cards.find(x=>x.name===oldName);
    if(target&&target.hasFull) _delCardHtml(uid,oldName);
    const next=cards.filter(x=>x.name!==oldName);
    _addDeleted(uid,oldName);
    _addPending(uid,{a:'del',name:oldName});   // 排队同步给 bot
    _saveLocal(uid,next);
    _renderMyCards(next);
    toast('🗑 已删除「'+oldName+'」');
  }else if(mode==='rename'){
    const newName=String($('#ca-newname').value||'').trim().replace(/[\\/:*?"<>|]/g,'').slice(0,40);
    if(!newName){ toast('⚠️ 新名字不能为空'); return; }
    if(newName===oldName) return closeCardAction();
    if(cards.some(x=>x.name===newName)){ toast('⚠️ 已有同名角色卡'); return; }
    const target=cards.find(x=>x.name===oldName);
    // 迁移完整 HTML：旧 key → 新 key，并把卡内姓名写成新名
    if(target&&target.hasFull){
      let html=_getCardHtml(uid,oldName);
      if(html){
        html=html.split('value="'+oldName+'"').join('value="'+escCardText(newName)+'"');
        html=html.split('>'+oldName+'<').join('>'+escCardText(newName)+'<');
        _saveCardHtml(uid,newName,html);
      }
      _delCardHtml(uid,oldName);
      target.name=newName; target.updated_at=Math.floor(Date.now()/1000);
    }else{
      // 线上同步来的卡（无完整 HTML）：只改索引名
      target.name=newName;
    }
    _addDeleted(uid,oldName);  // 旧名加墓碑，防止对账把旧卡加回
    _addPending(uid,{a:'ren',old:oldName,new:newName});   // 排队同步给 bot
    _saveLocal(uid,cards);
    _renderMyCards(cards);
    toast('✎ 已改名为「'+newName+'」');
  }
  closeCardAction();
}
/* 首页 / 开始创建 切换 */
function showHome(){
  $('#result-area').style.display='none';
  $('#quiz-wrap').style.display='none';
  $('#home-view').style.display='block';

function startCreate(){

/* 保存时调用：解析命令里的 name/state，同时存完整卡 HTML + payload（0 延迟显示） */
window._onCardCopied=function(cmd, fullHTML, payload){
  const uid=_tgUserId();
  if(!uid) return false;
  const name=_currentCardName();
  const stateRaw=((cmd||'').match(/state\[([^\]]*)\]/)||[])[1]||'';
  const state={};
  stateRaw.split(';').forEach(p=>{
    const i=p.indexOf(':');
    if(i>0 && p.trim()) state[p.slice(0,i).trim()]=p.slice(i+1).trim();
  });
  // 完整 HTML 单独存；失败则回滚，提示空间不足
  if(fullHTML && !_saveCardHtml(uid,name,fullHTML)) return false;
  const local=_loadLocal(uid).filter(c=>c.name!==name); // 同名去重（重制卡）
  const now=Math.floor(Date.now()/1000);
  const rec={name:name,state:state,notes:'',created_at:now,updated_at:now,_local:true,hasFull:!!fullHTML,html:fullHTML||''};
  // 摘要：从 payload.resultCards 提取更丰富的展示字段
  if(payload&&payload.resultCards){
    rec.summary=payload.resultCards.slice(0,8).map(c=>({label:c.label,value:c.value}));
  }
  local.unshift(rec);
  if(!_saveLocal(uid,local)) return false;
  _renderMyCards(local);
  return true;
};
async function loadMyCards(){
  const uid=_tgUserId();
  if(!uid) return;  // 浏览器直接打开、无 Telegram 身份时不显示
  // 0) 上次没点「完成」就退出：这次在 Telegram 内打开时自动补发队列
  if(_getPending(uid).length && window.Telegram && window.Telegram.WebApp &&
     typeof window.Telegram.WebApp.sendData==='function'){
    setTimeout(()=>{ _flushPendingOps(); }, 600);
    return;  // sendData 会关闭 Mini App，不必再对账
  }
  // 1) 先渲染本地缓存：复制过的卡立刻可见
  const local=_loadLocal(uid);
  _renderMyCards(local);
  // 2) 后台 fetch GitHub 对账
  try{
    const r=await fetch(CARDS_JSON_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const payload=await r.json();
    let remote=(((payload.users||{})[uid]||{}).cards)||[];
    // 墓碑过滤：已删除/已改名的卡不再从线上加回
    const deleted=_getDeleted(uid);
    remote=remote.filter(c=>deleted.indexOf(c.name)<0);
    // 合并：线上卡为准（去掉 _local），但保留本地已存的完整卡 HTML
    const byName={};
    remote.forEach(c=>{ byName[c.name]=Object.assign({},c,{_local:false}); });
    local.forEach(c=>{
      if(c.hasFull && byName[c.name]){
        // 线上已同步，但本地有完整卡：保留完整功能和摘要，只去掉待同步标记
        byName[c.name]=Object.assign({},byName[c.name],{
          hasFull:true, html:c.html, summary:c.summary, _local:false
        });
      }else if(c._local && !byName[c.name]){
        byName[c.name]=c; // 线上还没有，保留待同步
      }
    });
    const merged=Object.values(byName).sort((a,b)=>(b.updated_at||0)-(a.updated_at||0));
    _saveLocal(uid,merged);
    _renderMyCards(merged);
  }catch(e){ /* 网络失败：本地缓存继续显示，不影响体验 */ }
}
/* 启动：显示首页卡片墙 + 后台对账 */
showHome();
loadMyCards();
</script>

  var DATA=null,OPTIONS={},SELECTED_WEAPONS=[],KEY='',inputs=[],byField={},added=[],confirmed=[],freeCustomLeft=0,freeEquipLeft=0,activeCtx=null,msgTimer=null,boundSet=new WeakSet();

  window.prepareCardDom=function(box){

      var saveBtn=document.createElement('button');saveBtn.type='button';saveBtn.id='save-card-btn';saveBtn.textContent='💾 保存修改后的角色卡';

  window.initCardRuntime=function(){
    var box=document.getElementById('result-area');
    if(!box) return;
    var tag=document.getElementById('card-data');
    try{DATA=tag?JSON.parse(tag.textContent):null;}catch(e){DATA=null;}
    OPTIONS=(DATA&&DATA.options)||{};
    SELECTED_WEAPONS=(DATA&&DATA.selectedWeaponNames)||[];
    KEY='role-card-runtime-'+hash(box.innerHTML);
    inputs=[].slice.call(box.querySelectorAll('.num-input'));
    byField={};inputs.forEach(inp=>{byField[inp.getAttribute('data-field')]=inp;});
    inputs.forEach(inp=>{
      if(boundSet.has(inp)) return;
      boundSet.add(inp);
      inp.addEventListener('input',save);
      inp.addEventListener('change',save);
    });
    added=[];confirmed=[];
    freeCustomLeft=(DATA&&DATA.freeCustomRemaining)||0;
    freeEquipLeft=(DATA&&DATA.freeEquipRemaining)||0;
    var isExport=document.body.getAttribute('data-card-export')==='1';
    var lsState=null;
    try{lsState=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
    // 追加项/确认项/额度：只认文件内嵌的 runtimeState，绝不用 localStorage 的旧快照
    // （主页面重生成或反复导出时，localStorage 里可能残留上一次的追加内容）
    var state=(DATA&&DATA.runtimeState)||null;
    if(state){
      if(Array.isArray(state.added)) added=state.added;
      if(Array.isArray(state.confirmed)) confirmed=state.confirmed;
      if(typeof state.freeCustomLeft==='number') freeCustomLeft=state.freeCustomLeft;
      if(typeof state.freeEquipLeft==='number') freeEquipLeft=state.freeEquipLeft;
    }
    // 数值框：导出文件允许 localStorage 里用户上次改过的数值覆盖内嵌默认值
    var numState=lsState||state;
    if(numState){
      var nums=numState.nums||numState;
      Object.keys(nums||{}).forEach(k=>{if(byField[k]&&String(nums[k]).trim()!=='') byField[k].value=nums[k];});
    }
    renderConfirmed();
    renderAdded();
    if(document.body.getAttribute('data-card-export')==='1'){
      window.openDetail=cardOpenDetail;
      window.closeDetail=cardCloseDetail;
    }
  };

  function getNum(f){return parseFloat(byField[f]&&byField[f].value)||0;}
  function setNum(f,v){if(byField[f]) byField[f].value=v;}
  window._cardRuntimeState=function(){
    var nums={};inputs.forEach(inp=>{nums[inp.getAttribute('data-field')]=inp.value;});
    return {nums:nums,added:added,confirmed:confirmed,freeCustomLeft:freeCustomLeft,freeEquipLeft:freeEquipLeft};
  };
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(window._cardRuntimeState()));}catch(e){}
  }
  function msg(text){
    var el=document.getElementById('add-msg');
    if(!el) return;
    el.textContent=text?BASE_MSG+' '+text:BASE_MSG;
    clearTimeout(msgTimer);
    msgTimer=setTimeout(()=>{el.textContent=BASE_MSG;},2200);
  }
  function purchase(cost){
    cost=Math.max(0,cost||0);
    var credit=getNum('credit');
    if(cost>credit){msg('信用点不足，无法添加。');return false;}
    var next=credit-cost,loan=Math.max(0,getNum('loanLimit')-next);
    setNum('credit',next);setNum('loan',loan);setNum('interest',Math.ceil(loan*0.1));
    return true;
  }
  function refund(rec){
    var credit=getNum('credit')+(rec.cost||0);
    setNum('credit',credit);
    var loan=Math.max(0,getNum('loanLimit')-credit);
    setNum('loan',loan);setNum('interest',Math.ceil(loan*0.1));
    setNum('upkeep',Math.max(0,getNum('upkeep')-(rec.upkeep||0)));
    if(rec.tab==='custom') freeCustomLeft+=(rec.waived||0);
    if(rec.tab==='equipment') freeEquipLeft+=(rec.waived||0);
  }
  function keyOf(tab,item){
    if(tab==='custom') return tab+'|'+item.weapon+'|'+item.name;
    if(tab==='contract') return tab+'|'+item.kind+'|'+item.name;
    if(tab==='connection') return tab+'|'+item.label;
    return tab+'|'+item.name;
  }
  function listForCtx(ctx){
    var cfg=CONTEXTS[ctx];if(!cfg) return [];
    var arr=OPTIONS[cfg.list]||[];
    if(ctx==='custom') arr=arr.filter(x=>SELECTED_WEAPONS.indexOf(x.weapon)>=0);
    return arr;
  }
  function calc(tab,item){
    if(tab==='custom'){
      var p=item.price||0,w=item.gun?Math.min(p,freeCustomLeft):0,c=p-w;
      return {cost:c,upkeep:Math.ceil(c/10),waived:w};
    }
    if(tab==='equipment'){
      var p2=item.price||0,w2=Math.min(p2,freeEquipLeft),c2=p2-w2;
      return {cost:c2,upkeep:Math.ceil(c2/10),waived:w2};
    }
    if(tab==='item'){
      // 道具是一次性消耗品：只花信用点，不产生维护费
      return {cost:item.price||0,upkeep:0,waived:0};
    }
    return {cost:0,upkeep:0,waived:0};
  }
  function labelOf(tab,item){
    if(tab==='ability') return {name:'《'+item.name+'》（'+item.type+'）',desc:'【'+item.system+'】'+item.effect};
    if(tab==='custom'){
      var applied=item.applied&&item.applied.length?('　【实际生效：'+item.applied.join('；')+'】'):'';
      return {name:item.weapon+' · '+item.name,desc:item.effect+applied};
    }
    if(tab==='equipment') return {name:item.name+'（'+item.category+'）',desc:item.effect};
    if(tab==='item') return {name:item.name+'（'+item.price+'点 · 消耗品）',desc:item.effect};
    if(tab==='contract') return {name:item.kind+' · '+item.name,desc:'能力系统：'+item.sysText+'　特征：'+item.feature+'　性质：'+item.nature+'　由来：'+item.source};
    return {name:item.label,desc:'角色：'+item.role+'　'+item.effect};
  }
  function itemHtml(rec){
    var l=labelOf(rec.tab,rec.item);
    var extra=(rec.tab==='custom'||rec.tab==='equipment')?'　信用点 -'+rec.cost+'，维护费 +'+rec.upkeep
      :(rec.tab==='item'?'　信用点 -'+rec.cost+'（消耗品，不计维护费）':'');
    return '<b>'+esc(l.name)+'</b><div>'+esc(l.desc)+extra+'</div>';
  }
  function renderAdded(){
    var sec=document.getElementById('added-section');if(!sec) return;
    var groups=[['ability','能力'],['custom','定制'],['equipment','装备'],['item','道具'],['contract','契约'],['connection','人脉']];
    var html='';
    groups.forEach(g=>{
      var arr=added.filter(a=>a.tab===g[0]);if(!arr.length) return;
      html+='<div class="added-group"><div class="added-group-title">'+g[1]+'</div>';
      arr.forEach(rec=>{
        html+='<div class="added-item"><div>'+itemHtml(rec)+'</div><button type="button" data-remove-key="'+esc(rec.key)+'">移除</button></div>';
      });
      html+='</div>';
    });
    sec.innerHTML=added.length
      ?'<div class="added-head"><div class="added-title">➕ 追加内容</div><button type="button" id="confirm-added-btn" class="confirm-added-btn">确认</button></div>'+html
      :'';
  }
  // 确认后：把追加项从暂存区落到上方各自栏目（与原有区块同款样式）
  function confirmAdded(){
    if(!added.length) return;
    confirmed=confirmed.concat(added);
    added=[];
    save();renderConfirmed();renderAdded();renderList();
    msg('追加内容已确认，已显示在上方对应栏目');
  }
  // 把已确认的追加项按分类落到上方对应栏目，并重算合计
  function renderConfirmed(){
    var box=document.getElementById('result-area');if(!box) return;
    [].slice.call(box.querySelectorAll('[data-runtime-added]')).forEach(function(el){el.remove();});
    // 动态创建的分类块每次重建，避免移除后留下空壳
    [].slice.call(box.querySelectorAll('[data-runtime-block]')).forEach(function(el){el.remove();});
    var groups={ability:[],custom:[],equipment:[],item:[],contract:[],connection:[]};
    confirmed.forEach(function(rec){(groups[rec.tab]||groups.ability).push(rec);});
    function appendTo(sec,el){var c=sec.lastElementChild;if(c) sec.insertBefore(el,c.nextSibling);else sec.appendChild(el);}
    function mk(cls,html,key){var d=document.createElement('div');d.className=cls;d.setAttribute('data-runtime-added',key||cls);d.innerHTML=html;return d;}
    function rm(rec){return '<button type="button" class="runtime-remove" data-remove-key="'+esc(rec.key)+'">移除</button>';}
    function cell(label,value){return '<div class="weapon-cell"><b>'+esc(label)+':</b>'+esc(value==null||value===''?'—':value)+'</div>';}
    function rawCell(label,html){return '<div class="weapon-cell"><b>'+esc(label)+':</b>'+html+'</div>';}
    function head(rec,title){return '<div class="runtime-added-head"><b>'+esc(title)+'</b>'+rm(rec)+'</div>';}
    // 胶囊的原始基线只记录一次，后续按基线 + 已确认追加项重算，避免重复累加
    function baseOf(el){
      if(!el) return 0;
      var v=el.getAttribute('data-runtime-base');
      if(v==null){var m=String(el.textContent||'').match(/-?\d+(?:\.\d+)?/);v=m?m[0]:'0';el.setAttribute('data-runtime-base',v);}
      return parseFloat(v)||0;
    }
    function findBlock(sec,blockSel,titleSel,text){
      var bs=[].slice.call(sec.querySelectorAll(blockSel));
      for(var i=0;i<bs.length;i++){var t=bs[i].querySelector(titleSel);if(t&&t.textContent.trim()===text) return bs[i];}
      return null;
    }
    function findWeaponBlock(wsec,weapon){
      var bs=[].slice.call(wsec.querySelectorAll('.weapon-block'));
      for(var i=0;i<bs.length;i++){
        var n=bs[i].querySelector('.weapon-row .weapon-cell');
        if(n&&n.textContent.replace(/^武器名:\s*/,'').trim()===weapon) return bs[i];

        if(ref&&ref.parentNode) ref.parentNode.insertBefore(sec,ref);else box.appendChild(sec);

          cell('定制',wname+' · '+it.name+'（价格 '+(it.price||0)+'）')+
          cell('效果',it.effect||'—')+
          cell('实际生效',it.applied&&it.applied.length?it.applied.join('；'):'—')+
          rawCell('维护费',esc(rec.upkeep||0)+' '+rm(rec)),rec.key));
        var cpill=block.querySelector('.weapon-custom-title .upkeep-pill');
        if(cpill){

          var cadd=groups.custom.filter(function(x){return (x.item.weapon||'')===wname;})
            .reduce(function(s,x){return s+(x.upkeep||0);},0);

        }

    }
    // 能力 → 能力列表下方

      if(!grid){grid=document.createElement('div');grid.className='result-grid';box.appendChild(grid);}
      groups.contract.forEach(function(rec){
        var l=labelOf('contract',rec.item);
        appendTo(grid,mk('result-card runtime-contract','<div class="result-label">'+esc(l.name)+rm(rec)+'</div><div class="result-value">'+esc(l.desc)+'</div>'));
      });
    }
  }
  // 渲染添加弹窗的候选列表（费用为 0 的项不显示费用行）
  function renderList(){
    if(!activeCtx) return;
    var html=listForCtx(activeCtx).map((item,idx)=>{
      var key=keyOf(activeCtx,item);
      var q=(document.getElementById('add-search').value||'').trim().toLowerCase();
      if(q&&(JSON.stringify(item)+key).toLowerCase().indexOf(q)<0) return '';
      var c=calc(activeCtx,item),l=labelOf(activeCtx,item);
      var meta=(c.waived?'免费额度 -'+c.waived+'，':'')+'信用点 -'+c.cost+(activeCtx==='item'?'（消耗品，不计维护费）':'　维护费 +'+c.upkeep);
      // 能力/人脉/契约等不消耗信用点、也不产生维护费，则不显示费用行
      var showMeta=!!(c.waived||c.cost||c.upkeep);
      var disabled=added.concat(confirmed).some(a=>a.key===key);
      return '<button type="button" class="add-option" data-ctx="'+activeCtx+'" data-idx="'+idx+'"'+(disabled?' disabled':'')+'>'+
        '<b>'+esc(l.name)+'</b>'+(disabled?'<span class="add-meta">已添加</span>':(showMeta?'<div class="add-meta">'+esc(meta)+'</div>':''))+
        '<div class="add-desc">'+esc(l.desc)+'</div></button>';
    }).join('');
    document.getElementById('add-list').innerHTML=html||'<div class="hint">没有匹配项</div>';
  }
  function openAdd(ctx){
    if(!CONTEXTS[ctx]) return;
    activeCtx=ctx;
    document.getElementById('add-modal-title').textContent=CONTEXTS[ctx].title;
    document.getElementById('add-search').value='';
    renderList();
    document.getElementById('add-modal').classList.add('show');
  }
  function closeAdd(){
    document.getElementById('add-modal').classList.remove('show');
    activeCtx=null;
  }
  function addItem(ctx,idx){
    var item=listForCtx(ctx)[idx];if(!item) return;
    var c=calc(ctx,item);
    var rec={tab:ctx,key:keyOf(ctx,item),item:item,cost:c.cost,upkeep:c.upkeep,waived:c.waived};
    if(!purchase(rec.cost)) return;
    if(ctx==='custom') freeCustomLeft-=rec.waived;
    if(ctx==='equipment') freeEquipLeft-=rec.waived;
    setNum('upkeep',getNum('upkeep')+rec.upkeep);
    added.push(rec);save();renderAdded();renderList();
    msg('已添加：'+labelOf(ctx,item).name);
  }
  function cardFileName(){
    var name='';
    try{name=decodeURIComponent((location.pathname||'').split('/').pop()||'');}catch(e){}
    if(!name||!/\.html?$/i.test(name)) name=((document.title||'角色卡').trim()||'角色卡')+'.html';
    return name;
  }
  function downloadHTML(html,name){
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
  }
  // 优先让用户选择覆盖原文件；不支持时自动下载新文件
  function writeHTML(html,name){
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    if(window.showSaveFilePicker){
      window.showSaveFilePicker({suggestedName:name,types:[{description:'HTML',accept:{'text/html':['.html']}}]})
        .then(function(h){return h.createWritable();})
        .then(function(w){return w.write(blob).then(function(){return w.close();});})
        .then(function(){msg('已保存到文件');})
        .catch(function(err){
          if(err&&err.name==='AbortError') return;
          downloadHTML(html,name);msg('已下载新文件，请替换原文件');
        });
    }else{
      downloadHTML(html,name);msg('已下载新文件，请替换原文件');
    }
  }
  // 保存当前角色卡：独立文件优先覆盖原文件，主页面则导出角色卡
  function saveCard(){
    save();
    if(document.body.getAttribute('data-card-export')==='1'){
      // 独立角色卡：把当前修改写回自身并覆盖保存
      var tag=document.getElementById('card-data');
      if(tag){
        var payload={};
        try{payload=JSON.parse(tag.textContent)||{};}catch(e){}
        payload.runtimeState=window._cardRuntimeState();
        tag.textContent=JSON.stringify(payload).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');
      }
      var clone=document.documentElement.cloneNode(true);
      [].slice.call(clone.querySelectorAll('[contenteditable]')).forEach(function(el){el.removeAttribute('contenteditable');});
      writeHTML('<!DOCTYPE html>\n'+clone.outerHTML,cardFileName());
      return;
    }
    // 主填写页：重新生成角色卡文件（含当前修改）
    if(window.exportResultHTML){window.exportResultHTML();msg('已生成修改后的角色卡文件');}
    else{msg('当前页面不支持保存，请使用「导出角色卡」');}
  }
  function cardOpenDetail(i,list){
    var source=list||((DATA&&DATA.resultCards)||[]);
    var c=source[i];if(!c) return;
    window._currentDetailList=source;
    window._currentDetailIdx=i;
    document.getElementById('modal-title').textContent=c.label;
    document.getElementById('modal-content').innerHTML=c.detail||c.value;
    document.getElementById('detail-modal').classList.add('show');
    if(window.applyEditable) window.applyEditable(document.getElementById('detail-modal'));
  }
  function cardCloseDetail(e){
    if(!e||e.target.id==='detail-modal'||e.target.classList.contains('modal-close')){
      if(document.body.classList.contains('debug-mode')&&window.syncEdits) window.syncEdits();
      document.getElementById('detail-modal').classList.remove('show');
    }
  }

  document.addEventListener('click',function(e){
    var addBtn=e.target.closest?e.target.closest('[data-add-context]'):null;
    if(addBtn){e.stopPropagation();openAdd(addBtn.getAttribute('data-add-context'));return;}
    if(e.target.id==='close-add-btn'){e.stopPropagation();closeAdd();return;}
    if(e.target.id==='save-card-btn'){e.stopPropagation();saveCard();return;}
    var confirmBtn=e.target.closest?e.target.closest('#confirm-added-btn'):null;
    if(confirmBtn){e.stopPropagation();confirmAdded();return;}
    var removeBtn=e.target.closest?e.target.closest('[data-remove-key]'):null;
    if(removeBtn){
      e.stopPropagation();
      var key=removeBtn.getAttribute('data-remove-key'),idx=-1,isConfirmed=false;
      added.forEach((a,i)=>{if(a.key===key) idx=i;});
      if(idx<0){confirmed.forEach((a,i)=>{if(a.key===key){idx=i;isConfirmed=true;}});}
      if(idx>=0){
        var list=isConfirmed?confirmed:added;
        refund(list[idx]);list.splice(idx,1);
        save();renderConfirmed();renderAdded();renderList();msg('已移除');
      }
      return;
    }
    var detail=e.target.closest?e.target.closest('[data-detail-index]'):null;
    if(detail){
      e.stopPropagation();
      var list=detail.getAttribute('data-detail-list')==='finance'?((DATA&&DATA.financeCards)||[]):((DATA&&DATA.resultCards)||[]);
      cardOpenDetail(parseInt(detail.getAttribute('data-detail-index'),10),list);
    }
  },true);
  document.addEventListener('click',function(e){
    if(e.target.id==='add-modal') closeAdd();
  });
  document.getElementById('add-list').addEventListener('click',function(e){
    var btn=e.target.closest('.add-option');
    if(btn&&!btn.disabled) addItem(btn.getAttribute('data-ctx'),parseInt(btn.getAttribute('data-idx'),10));
  });
  document.getElementById('add-search').addEventListener('input',renderList);

  document.addEventListener('DOMContentLoaded',function(){
    var box=document.getElementById('result-area');
    if(box&&box.style.display!=='none'){prepareCardDom(box);initCardRuntime();}
  });
})();
</script>

</body></html>
