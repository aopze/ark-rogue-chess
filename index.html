 }
  /* 兜底：任何没写 cursor 的元素也走 PRTS 箭头（含 body 空白区） */
  html, body { cursor: var(--cur-arrow), auto; }
  /* ★ ISSUE-20261031-98 · Part B 的 F1「根级收敛」：cursor 是继承属性，全站只留上面这一条 +
     下面这条表单控件覆盖，其余 23 条逐元素的 `cursor: var(--cur-arrow), auto;` 已全部删除。
     为什么还留这一条：`<button>`（含 `<select>`/`<textarea>`）有 **UA 自带 cursor**，
     UA 规则优先于继承 → 光靠 html/body 继承，按钮会退回原生箭头（F1 首轮实测抓到，
     `#setOpenBtn` 等 10 个按钮 computed 从 url(...) 变成 default）。这一条把表单控件拉回 PRTS，
     其子孙（`.vico`/`span`/`svg`）自动继承。`.grip`/`#dragHandle`(col-resize)、输入框(text) 是字面值，不受影响。
     ⚠️ 红线：**不许再逐条往回加** —— 新增控件保持不写 cursor 即自动继承。 */
  button, select, textarea { cursor: var(--cur-arrow), auto; }
  /* ★ ISSUE-20261031-98 · 一键关掉 PRTS 自定义光标（设置面板的「光标」按钮）。
     只重定义两个变量就够：全文件 31 条 cursor: 规则都走 var(--cur-arrow)/var(--cur-no)，
     变量一变全体同时失效（custom property 天然向下继承），千万别逐条去改那 31 条。
     #dragHandle / .grip（col-resize）、input（text）是字面值、不走变量 → 会自动存活。
     ⚠️ 红线：不许动 --cur-src —— 91 号的教程指引 #tutCursor 拿它当 background 用，
     本开关只关「玩家鼠标」，不关教程指引。 */
  html.no-prts-cursor { --cur-arrow: default; --cur-no: not-allowed; }

  * { box-sizing: border-box; }
  :root { --cell: 50px; --unit-move-ms: 120ms;
          /* ISSUE-20261031-113：统一格栅间距（地图格 + 分隔列 + UI 区共用同一模数）。
             与 #board 的 gap:2px 保持一致，是「缝隙即格线」的唯一来源。 */
          --gap: 2px;
          /* ISSUE-20261029-21：角标相对 #boardWrap 的偏移（棋盘居中留下的边距），
             updateCellSize() 会改写；无 JS 时退回 0，角标仍贴在容器角上不跑位。 */
          --corner-x: 0px; --corner-y: 0px;
          /* 地板色：.cell.empty 与 #floorFill 的格子共用，改一处两边同时变（别再写死第二份）。 */
          --floor: #2d2d44;
          /* ★ ISSUE-20261101-137：边框色。长边/短边取整后剩下的那几 px 露出 #game 的背景，
             就是人类要的「纯色窄边，无格线」。别单独画 border —— 会和这条背景边叠成两层。 */
          --frame: #0b0b14;
          /* ★ 140：UI 尺度单位 —— 全部由 --cell 派生，格子一变 UI 整体跟着变。
             「嵌入固定格子数量」的落实方式：面板占几格由 grid-area 决定，里面的字与间距
             由这几个变量决定，于是不需要为任何分辨率单独写一套媒体查询。
             ⚠️ 为什么带 clamp：纯比例在两头会崩 ——
               · 手机竖屏（13 格塞进 390px，cell≈28）纯比例字号只有 7~8px，读不清；
               · 4K 且系统缩放 100%（cell≈164）纯比例正文会到 46px，一屏放不下两行。
             11 / 24 这两个端点是实测出来的可读区间，不是拍脑袋。 */
          --u: clamp(11px, calc(var(--cell) * 0.28), 24px);      /* 正文 */
          --u-sm: clamp(9.5px, calc(var(--cell) * 0.22), 18px);   /* 辅助信息 */
          --u-lg: clamp(13px, calc(var(--cell) * 0.36), 30px);    /* 按钮 / 标题 */
          --pad: calc(var(--cell) * 0.14);                        /* 面板内边距 */
          --rad: calc(var(--cell) * 0.12); }                      /* 圆角（与格子同模数） */
  body { font-family: system-ui, -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; background:#1a1a2e; color:#eee; margin:0; padding:0; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; display:flex; flex-direction:column; touch-action: manipulation; }
  /* ★ ISSUE-20261101-137：顶栏已删（人类 02:12「去掉，格子从画面顶端开始」）。
     原来这里有一条 18px 的标题行，把可用高度切掉 30 多 px，导致短边永远凑不满 13 格。
     标题信息移到设置抽屉（见 #setVer / drawer-title），游戏内不再占纵向空间。 */
  /* ISSUE-20261028-09 A：地图贴左（原来 justify-content:center 会在侧栏挤压下把地图推到中间，
     左右都留白）；棋盘容器尺寸由 updateCellSize() 按「可用短边」写死，故 flex 不再增长。 */
  #game { display:flex; gap:8px; padding: 8px 16px 16px 16px; flex-grow: 1; min-height: 0; justify-content:flex-start; }
  /* 正方形棋盘：宽高都由 JS 设成同一个像素值（短边），aspect-ratio 只是无 JS 时的兜底。
     不能用 flex-grow —— 一旦拉伸就会破坏 1:1。 */
  #boardWrap { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; position:relative; min-width: 0; min-height: 0; overflow: hidden; aspect-ratio: 1 / 1; }
  /* ISSUE-18 B5：iOS Safari 长按会弹「拷贝/放大镜」，拖动跟随前必须关掉 callout */
  #board { display:grid; grid-auto-rows: var(--cell); gap:2px; padding:0; border-radius:4px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; position: relative; }
  #unitLayer { position:absolute; inset:0; pointer-events:none; z-index:40; overflow:visible; }
  #fxLayer { position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:50; }
  /* 正方形格子（ISSUE-20261028-09 A）：原来 height 是 calc(var(--cell) * 1.12)，
     整块地图因此永远被竖向拉长；1:1 后地图才是正方。 */
  .cell { width: var(--cell); height: var(--cell); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.48); border-radius:2px; user-select:none; position:relative; overflow:hidden; }
  .cell.empty { background: var(--floor, #2d2d44); }
  .cell.void { background:transparent; pointer-events:none; }
  .cell.wall { background:#4a4a5a; cursor: var(--cur-no), auto; border-radius:4px; }
  /* ISSUE-20261028-10-B：粗圆岩 = Boss 落的动态墙。用暖褐 + 内描边和灰墙区分开，
     但又不能比敌人/玩家更抢眼（它是地形，不是单位）。 */
  .cell.rock { background:#6b5233; cursor: var(--cur-no), auto; border-radius:4px;
    box-shadow: inset 0 0 0 1px rgba(255,206,140,.45); }
  .cell.path { background:#3a5a8c; }
  /* 闪避节点：第一次等待（蓝色描边 + 内部蓝调） */
  .cell.dodge { box-shadow: inset 0 0 0 2px #7dd3fc; background:#2f5578; }
  .cell.dodge.attack { box-shadow: inset 0 0 0 2px #7dd3fc, inset 0 0 0 999px rgba(192,57,43,.35); }
  /* ISSUE-20261029-41：路径格朝向箭头 —— 指向「从这一格出发」的下一步方向。
     放右上角（右下角是单位朝向指示、格中央是节点/图标），0.3 格大小、30% 不透明，不抢注意力。
     四个方向靠旋转同一个向上三角实现，避免四套 border 组合写错。 */
  .cell-dir { position:absolute; top:9%; right:9%; width:0; height:0; opacity:.3; pointer-events:none;
    border-left: calc(var(--cell) * 0.13) solid transparent;
    border-right: calc(var(--cell) * 0.13) solid transparent;
    border-bottom: calc(var(--cell) * 0.22) solid #dbe4ff; }
  .cell-dir.l { transform: rotate(-90deg); }
  .cell-dir.r { transform: rotate(90deg); }
  .cell-dir.d { transform: rotate(180deg); }
  .cell.attack { background:#c0392b; }
  .cell.attack.used { background:#5c2b29; }
  /* 技能节点（右键设置）：紫色底 + 紫描边 + ✦ */
  .cell.skill { background:#5b3a8c; box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.used { background:#3d2a5c; }
  .cell.attack.skill { background: linear-gradient(135deg, #c0392b 0 45%, #5b3a8c 55% 100%); box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.dodge { box-shadow: inset 0 0 0 2px #c9a0ff, inset 0 0 0 4px #7dd3fc; }
  /* 攻击范围：在地块上叠一层蓝色（与路径格 #3a5a8c 接近），不遮挡格子内容 */
  .cell.in-range { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25); }
  .cell.in-range.attack, .cell.in-range.skill { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25), inset 0 0 0 1px rgba(201,160,255,.65); }
  .cell.item-cell { background: #4a1e2f; box-shadow: inset 0 0 10px #ff6b6b; }
  /* ★ ISSUE-20261031-120：🍌 香蕉格 —— 与 ❤️ 同一套 item-pulse 壳，只换底色（暖黄），
     让玩家一眼分出「这个回 1 血、那个回 3 血」。 */
  .cell.banana-cell { background: #4a3d16; box-shadow: inset 0 0 10px #ffd166; }
  .cell.blood-cell { background: #3d1515; }
  /* ISSUE-20261031-118：骨头底色 —— 比血迹更暖更暗，避免和 🩸 的红混在一起 */
  .cell.bone-cell { background: #3a3226; }
  /* ISSUE-20261031-92（人类 00:1x「门的背景颜色和角标 UI 用一样的」）：
   * 出口格底色统一成角标那套青绿 135° 渐变（与 #setOpenBtn/.start-btn 同款），
   * 只把内部光晕从纯绿换成青绿，避免纯绿压青绿底色出现色阶断层。
   * 不动 border / border-radius —— 棋盘网格由 .cell 统一控制。 */
  .cell.exit-cell { background: linear-gradient(135deg, #4ecdc4, #2ecc71); box-shadow: inset 0 0 15px rgba(78,205,196,.85); }

  /* ===== ISSUE-20261031-126：事件关卡的格子样式 =====
   * 设计约束（人类拍板 9「纯空大地，只有外墙」）：
   *   · 地板比战斗关**亮一点点、暖一点点**，进房间第一眼就能感到「这里不是战场」；
   *   · 出口沿用 .exit-cell 同一套青绿渐变（开态）—— 锁态复用同一块底色但要「暗下去」，
   *     所以用 filter 而不是换色：换色会让玩家以为那是两扇不同的门；
   *   · ❓ 用脉冲动画，和奖励格 .item-pulse 同源，视觉上属「可交互物」这一族。 */
  .cell.event-floor { background: #242a33; }
  /* 锁着的门：同一扇门，只是暗 + 灰度 + 虚线框（不挂锁图标，见 buildBoardHtml 的注释） */
  .cell.event-exit.locked {
    background: linear-gradient(135deg, #4ecdc4, #2ecc71);
    box-shadow: inset 0 0 15px rgba(78,205,196,.85), inset 0 0 0 2px rgba(0,0,0,.35);
    filter: grayscale(.85) brightness(.42);
  }
  /* 开启的门：青绿渐变 + 呼吸光晕，和战斗关出口一模一样 */
  .cell.event-exit.open {
    background: linear-gradient(135deg, #4ecdc4, #2ecc71);
    box-shadow: inset 0 0 15px rgba(78,205,196,.85);
    animation: eventDoorPulse 1.8s ease-in-out infinite;
  }
  @keyframes eventDoorPulse {
    0%, 100% { box-shadow: inset 0 0 15px rgba(78,205,196,.85); }
    50%      { box-shadow: inset 0 0 26px rgba(120,255,220,1); }
  }
  /* ❓ 事件点：紫底 + 脉冲，与「可交互物」同族 */
  .cell.event-obj { background: #3a2f52; box-shadow: inset 0 0 12px #a78bfa; }
  .cell.event-obj svg { animation: eventObjPulse 1.6s ease-in-out infinite; }
  @keyframes eventObjPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  /* 已用过：褪成地板色，图标压到 30% —— 让玩家一眼看出「这格没东西了」而又知道曾经有过 */
  .cell.event-obj.used { background: #242a33; box-shadow: none; }
  .cell.event-obj.used svg { opacity: .3; animation: none; }
  /* 事件关操作区那行说明（替代「开始行动」按钮的位置） */
  .event-tip { font-size: 13px; color: #9fb3c8; text-align: center; padding: 6px 4px; line-height: 1.5; border-radius: 8px;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); }
  .cell.hitflash { animation: hitflash .35s ease-out; }
  @keyframes hitflash { 0%{box-shadow: inset 0 0 0 40px rgba(255,80,80,.9);} 100%{box-shadow: inset 0 0 0 0 rgba(255,80,80,0);} }
  .item-pulse { animation: itemPulse 1.5s ease-in-out infinite; display:inline-block; }
  @keyframes itemPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  /* 单位渲染（格内静态 .unit + 绝对定位 .unit-abs）共用同一套外观，避免两处分别维护。
     ★ ISSUE-20261030-56：--stk-* 是「同格斜分」的参数，默认值 = 独占一格（等价于没有斜分），
       只有 N>1 时才由 renderUnits 改成实际值 —— N=1 时下面那套 clip-path 一条都不匹配。 */
  .unit, .unit-abs { display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; pointer-events:none; position:relative;
    --stk-i: 0; --stk-n: 1; --stk-f: 1; --stk-dx: 0px; --stk-dy: 0px; }
  .unit { width:100%; height:100%; }
  .unit-abs { position:absolute; left:0; top:0; width:auto; height:auto; transition: transform var(--unit-move-ms) linear; will-change: transform; border-radius:2px; }
  /* ★ ISSUE-20261030-56：图标 / 血条按 N 缩放（--stk-f 默认 1 → 单格单单位与改动前完全一致） */
  .unit .icon, .unit-abs .icon { font-size: calc(var(--cell) * 0.60 * var(--stk-f)); line-height:1; display:flex; align-items:center; justify-content:center; }
  .unit .icon.ghost-icon, .unit-abs .icon.ghost-icon { opacity: 0.7; filter: drop-shadow(0 0 5px #fff); }

  /* ===================================================================
   * ★ ISSUE-20261030-56：同格多单位「斜向分格」
   *
   * 一格沿 45°（带方向左下→右上，即「x+y」恒定）切成 N 条斜带：
   * 第 i 条覆盖 x+y ∈ [2i/N, 2(i+1)/N]（方格内 x+y 取值 0..2），
   * 于是 N=2 就是「左上 / 右下」两块三角，玩家（i=0）永远在左上。
   * 内容再由 --stk-dx/--stk-dy 平移到本带中心（偏移量由 renderUnits 按实测格宽算好写行内）。
   *
   * ★ N 硬上限 = 5（1 干员 + 4 成员，各不重复），所以 N=2..5 全部穷举，
   *   不需要「+N 角标」之类的退化方案 —— 超过 5 的情况不存在。
   * ★ data-stk / data-stk-i 只在 N>1 时由 JS 挂上（N=1 时 DOM 与改动前逐字节一致，
   *   这是 §7-8 的回归底线：斜分逻辑必须走这个开关，不能在 N=1 时也挂 clip-path）。
   * =================================================================== */
  /* 斜带内：内容整体平移到自己那条带的中心（var 都给 0px 兜底 —— 万一 JS 没写行内值，
     缺一个 var 会让整条 transform 变成 invalid at computed-value time，居中直接失效） */
  .unit-abs[data-stk] .icon,
  .unit-abs[data-stk] .hp-bar,
  .unit-abs[data-stk] .affix-tag { transform: translate(var(--stk-dx, 0px), var(--stk-dy, 0px)); }
  /* 朝向指示本来就带 translateX/Y(-50%)，只能整条重写（不能只加 translate，会覆盖原居中） */
  .unit-abs[data-stk] .facing-ind.r, .unit-abs[data-stk] .facing-ind.l { transform: translate(var(--stk-dx, 0px), var(--stk-dy, 0px)) translateY(-50%); }
  .unit-abs[data-stk] .facing-ind.d, .unit-abs[data-stk] .facing-ind.u { transform: translate(var(--stk-dx, 0px), var(--stk-dy, 0px)) translateX(-50%); }
  /* N≥3：斜带太窄，朝向与词缀已经不可读 → 直接隐掉，只留描边颜色辨敌我（§4.2）。
     !important 是必须的：renderUnits 会用行内 display:flex 把它们显示出来。 */
  .unit-abs[data-stk="3"] .facing-ind, .unit-abs[data-stk="4"] .facing-ind, .unit-abs[data-stk="5"] .facing-ind,
  .unit-abs[data-stk="3"] .affix-tag, .unit-abs[data-stk="4"] .affix-tag, .unit-abs[data-stk="5"] .affix-tag { display: none !important; }
  /* --- N=2 --- */
  .unit-abs[data-stk="2"][data-stk-i="0"] { clip-path: polygon(0% 0%, 100% 0%, 0% 100%); }
  .unit-abs[data-stk="2"][data-stk-i="1"] { clip-path: polygon(100% 0%, 100% 100%, 0% 100%); }
  /* --- N=3 --- */
  .unit-abs[data-stk="3"][data-stk-i="0"] { clip-path: polygon(0% 0%, 66.67% 0%, 0% 66.67%); }
  .unit-abs[data-stk="3"][data-stk-i="1"] { clip-path: polygon(0% 66.67%, 66.67% 0%, 100% 0%, 100% 33.33%, 33.33% 100%, 0% 100%); }
  .unit-abs[data-stk="3"][data-stk-i="2"] { clip-path: polygon(100% 33.33%, 100% 100%, 33.33% 100%); }
  /* --- N=4 --- */
  .unit-abs[data-stk="4"][data-stk-i="0"] { clip-path: polygon(0% 0%, 50% 0%, 0% 50%); }
  .unit-abs[data-stk="4"][data-stk-i="1"] { clip-path: polygon(0% 50%, 50% 0%, 100% 0%, 0% 100%); }
  .unit-abs[data-stk="4"][data-stk-i="2"] { clip-path: polygon(100% 0%, 100% 50%, 50% 100%, 0% 100%); }
  .unit-abs[data-stk="4"][data-stk-i="3"] { clip-path: polygon(100% 50%, 100% 100%, 50% 100%); }
  /* --- N=5 --- */
  .unit-abs[data-stk="5"][data-stk-i="0"] { clip-path: polygon(0% 0%, 40% 0%, 0% 40%); }
  .unit-abs[data-stk="5"][data-stk-i="1"] { clip-path: polygon(0% 40%, 40% 0%, 80% 0%, 0% 80%); }
  .unit-abs[data-stk="5"][data-stk-i="2"] { clip-path: polygon(0% 80%, 80% 0%, 100% 0%, 100% 20%, 20% 100%, 0% 100%); }
  .unit-abs[data-stk="5"][data-stk-i="3"] { clip-path: polygon(100% 20%, 100% 60%, 60% 100%, 20% 100%); }
  .unit-abs[data-stk="5"][data-stk-i="4"] { clip-path: polygon(100% 60%, 100% 100%, 60% 100%); }

  /* 同格时的动作标记（✦ / 🎯 / 💨 / ⏳n）：画进**自己那条斜带**。
     ★ z-index 41：必须高于 #unitLayer(40)，否则标记会被单位图标整个盖住
       （#board 与 .cell 都是 position:relative + z-index:auto，不建层叠上下文，
        所以这个 41 能直接和 40 比）；低于 #fxLayer(50)，浮字仍在最上层。
     ★ 深色圆底是必要的：标记会压在图标中心，没有底衬会糊成一团。 */
  .cell-mark { position:absolute; left:50%; top:50%; z-index:41; pointer-events:none; line-height:1;
    display:flex; align-items:center; justify-content:center; white-space:nowrap;
    /* 用 min-width 不用 width：⏳2 是两个字符，写死宽度会把第二个字符挤出圆底之外 */
    min-width: calc(var(--cell) * 0.40 * var(--stk-f, 1)); height: calc(var(--cell) * 0.40 * var(--stk-f, 1));
    padding: 0 calc(var(--cell) * 0.05 * var(--stk-f, 1));
    font-size: calc(var(--cell) * 0.28 * var(--stk-f, 1));
    background: rgba(6,8,14,0.74); border-radius: 999px; box-shadow: 0 0 3px rgba(0,0,0,.9);
    text-shadow: 0 0 3px #000, 0 0 2px #000;
    transform: translate(-50%,-50%) translate(var(--stk-dx, 0px), var(--stk-dy, 0px)); }
  /* ★ ISSUE-20261030-74：同格多个动作的「同心方框」。外圈 = 最先放置的那件，内圈 = 最后放置的；
   * 每圈线宽一致（均为 3px）；按类型配色：闪避=蓝 / 攻击=红 / 技能=紫（对应截图"先闪避→攻击→技能"）。
   * 中心留白给单位本体（单位层 z40 < 本层 z41，框会压在图标之上但不挡中心观感）。 */
  .act-frames { position:absolute; inset:0; z-index:41; pointer-events:none; }
  .act-frames .af { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);

  .act-frames .af-dodge { border-color:#3aa0ff; }
  .act-frames .af-attack { border-color:#ff5a5a; }
  .act-frames .af-skill { border-color:#b06bff; }
  .facing-ind { position: absolute; font-size: calc(var(--cell) * 0.2); color: rgba(255,255,255,0.55); text-shadow: 0 0 3px #000, 0 0 2px #000; line-height: 1; pointer-events: none; font-weight: 900; z-index: 2; }
  .facing-ind.r { right: 1px; top: 50%; transform: translateY(-50%); }
  .facing-ind.l { left: 1px; top: 50%; transform: translateY(-50%); }
  .facing-ind.d { bottom: 0; left: 50%; transform: translateX(-50%); }
  .facing-ind.u { top: 0; left: 50%; transform: translateX(-50%); }
  .enemy-arrow { position:absolute; width: calc(var(--cell) * 0.4); height: calc(var(--cell) * 0.4); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.3); font-weight:900; color:#ffd93d; background:rgba(0,0,0,0.6); border-radius:50%; text-shadow:0 0 4px #000, 0 0 6px #ffd93d; transform:translate(-50%,-50%); z-index:45; pointer-events:none; }
  .bullet { position:absolute; width:12px; height:12px; border-radius:50%; background:#ffe66d; box-shadow:0 0 10px 3px #ffd93d, 0 0 22px 6px rgba(255,217,61,.5); transform:translate(-50%,-50%); z-index:20; }
  .bullet.crit { background:#ff4500; box-shadow:0 0 12px 4px #ff4500, 0 0 26px 8px rgba(255,69,0,.6); width:14px; height:14px; }
  .bullet.alien { background:#a55eea; box-shadow:0 0 10px 3px #a55eea, 0 0 22px 6px rgba(165,94,234,.5); width:14px; height:14px; }
  /* ISSUE-20261031-114 · 阿米娅音符弹道：去掉圆点底，改 Fluent Flat SVG。
     尺寸靠 font-size 一处控制 —— iconTag 输出的是 .vico，宽高都是 1em。

  .bullet.note { width:auto; height:auto; border-radius:0; background:none; box-shadow:none;

  /* 侧栏收窄（ISSUE-20261028-09 B）：六维图搬进抽屉后，侧栏只剩角色卡与日志占位，

  /* ===== 货币：金币（ISSUE-20261030-80；2026-10-31 17:03 人类 TG msg 101「源石锭→金币」）=====
   * 图标 = 图标系统的 coin（🪙 = Fluent Emoji Flat 矢量，`icons.js` 的 `#ico-coin`），
   * 由 `iconify(CURRENCY_ICON)` 渲染 —— 与全站其它 UI 图标同一套，一处注册、处处复用。

  /* =========================================================================
   * 抽屉体系（ISSUE-20261028-09 G）
   * 设计语言：方形 = 信息 · 圆形 = 交互（仅手机）· 浮层 = 从右侧滑入的侧边栏。
   * 旧的 #logPanel「可拖动悬浮窗」整体废除 —— 不允许凭空悬浮，也没有拖动位置记忆。

  /* ★ ISSUE-20261101-152：--z-vpad 已随手机虚拟圆钮底栏一起删除。 */
  :root { --z-corner: 30; --z-mask: 1100; --z-drawer: 1101; }
  /* 地图角标（ISSUE-20261029-21 · B 方案「叠层」；20261029-36 增角色面板）：
     ⚙ 设置 → 棋盘右上格；👤 账号与排行 → 棋盘左上格；♟️ 角色面板 → 棋盘右下格。尺寸 = 恰好一个格子（var(--cell)），
     随格子缩放；两者共用同一套样式（大小 / 圆角 / 配色 / 高亮态 / aria）。
     --corner-x / --corner-y 由 updateCellSize() 算出：#board 在 #boardWrap 里居中，
     四周可能各剩几像素，角标要贴的是「棋盘」的角而不是容器的角。

  #setOpenBtn, #lobbyOpenBtn, #charOpenBtn, #rewardOpenBtn {

    display: flex; width: var(--cell); height: var(--cell);
    align-items: center; justify-content: center; padding: 0;
    /* ISSUE-20261029-44 第1项：与「开始行动」(.start-btn) 同款绿色胶囊 */
    background: linear-gradient(135deg, #4ecdc4, #2ecc71); color: #fff;

 }
  #setOpenBtn { right: var(--corner-x); }
  #lobbyOpenBtn { left: var(--corner-x); }
  /* ★ 角色面板按钮：地图右下格（ISSUE-20261029-36） */
  #charOpenBtn { top: auto; bottom: var(--corner-y); right: var(--corner-x); }
  /* ★ ISSUE-20261030-84：第 4 角标（地图左下格）从纯占位接成 **📟 奖励与事件入口**。

  #rewardOpenBtn { top: auto; bottom: var(--corner-y); left: var(--corner-x); }

  #setOpenBtn.on, #lobbyOpenBtn.on, #charOpenBtn.on {

  /* ★ 设置面板专用关闭按钮（2026-10-29 人类 01:42 指令）：

  /* ISSUE-20261029-44 第3项：设置面板内独立关闭按钮已删除，

  /* =========================================================================
   * ★ 设置面板改为「覆盖棋盘格」（ISSUE-20261029-29，人类 2026-10-29 04:42）

   * 旧行为：从屏幕右侧滑入的 360px 宽抽屉，地图还露在左边。

  #drawerSettings {

  /* =========================================================================

  #drawerOnline {

  /* =========================================================================

   *   位置尺寸全靠 --board-top / --board-left / --board-w / --board-h（src/ui/drawer.js
   *   #syncBoardOverlayRect 按 #board 实时矩形写入）；显隐用 opacity + visibility

  /* =========================================================================
   * ★ ISSUE-20261028-14 教程提示条（#tutBar）
   *   为什么不做进 log()：手机竖屏下日志面板在视口外，新手根本看不到 → 等于没提示。
   * ========================================================================= */
  /* ===== ISSUE-20261030-91 · 教程 HUD 三件套 =====
   * 人类 2026-10-30 23:4x：
   *   「现在的弹窗说明几乎完全遮住了地图，弹窗面板可以保留：PC 端[贴合顶部] /
   *     移动端[贴合角色面板顶部]，可以短暂遮挡地图，但教程关不要用这个弹窗说明文字。
   *     教程关地图是固定的，可以用地图显示文字…下面 4×9 的区域用来说明。」
   *
   * → 于是拆成三块，各管一件事：
   *   #tutBar    顶部 chip：只剩「教程 3/6 · 基础操作」一行，不再放说明文字，也不挡点击。
   *   #tutText   叠在地图 y=6..9（4×9）上的说明区：**说明文字都在这里**，顶部一排方向键（← 上一步 / → 下一步）。
   *   #tutCursor 会平滑移动的光标指引：指向本步该点/该去的那一格。
   * 位置全部由 JS 按 getCellEl() 的实时矩形算（tutorialZoneRect / cellCenter），
   * 手算 gap 像素必错 —— 棋盘是 grid + 2px gap，且 --cell 会随窗口变。 */
  #tutBar {
    /* ★ ISSUE-20261101-137：原来 left:50% 是「视口居中」，铺满格栅之后视口中心落在
       地图与 UI 的交界上，chip 直接飞到 UI 面板头顶把提示条盖住（教程关实测）。
       改成跟棋盘走：--tut-chip-x / --tut-chip-top 由 updateCellSize() 按 #boardWrap 的
       实时矩形写入，棋盘在哪它就在哪，转屏/缩放自动跟。 */
    position: fixed; left: var(--tut-chip-x, 50%); transform: translateX(-50%);
    top: var(--tut-chip-top, 8px);
    z-index: 1090; width: auto; max-width: 92vw;
    background: rgba(24,24,40,.94); border: 1px solid rgba(255,215,0,.75); border-radius: 999px;
    padding: 5px 14px; color: #ffd700; font-size: 12px; font-weight: 800; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    /* 一条 chip 横在棋盘顶沿也会吃掉点击（教程里玩家要不停点格子），必须穿透。 */
    pointer-events: none;
 }
  #tutBar[hidden] { display: none; }
  /* 4×9 说明区：半透明，底下的格子/单位仍透得出来（人类要「不遮挡全部地图」） */
  #tutText {
    position: absolute; z-index: 60; display: flex; flex-direction: column;
    justify-content: center; gap: 6px; padding: 10px 12px;
    background: linear-gradient(180deg, rgba(14,14,24,.72), rgba(14,14,24,.90));
    border: 1px solid rgba(255,215,0,.55); border-radius: 10px;
    color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.45);
    opacity: 0; transition: opacity .25s ease;
    /* 说明区盖在棋盘下半部分：除按钮外全部穿透，否则「点不到下面那几行格子」 */
    pointer-events: none;
 }
  #tutText.on { opacity: 1; }
  #tutText .tut-step { font-size: 11px; font-weight: 800; color: #ffd700; letter-spacing: .5px; }
  #tutText .tut-body { font-size: 12.5px; line-height: 1.5; overflow: auto; }
  /* ★ ISSUE-教程导航：上一步 / 下一步（方向键图标 ← / →），位于说明区顶部、说明文字上方。
   * 两个按钮都恢复可点（pointer-events:auto），其余说明区仍穿透，否则吃不到下面的格子。 */
  #tutText .tut-nav { display: flex; gap: 8px; margin-bottom: 2px; }
  #tutText .tut-nav button {
    flex: 0 0 auto; width: 34px; height: 30px; padding: 0; box-sizing: border-box;
    border: 1px solid rgba(255,215,0,.6); border-radius: 8px; background: rgba(255,215,0,.16);
    color: #ffd700; font-size: 18px; font-weight: 900; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    /* ISSUE-20261030-87 口径：可点元素一律走 PRTS 箭头变量，不许留裸的系统手型光标 */
    font-family: inherit; pointer-events: auto; touch-action: manipulation;
 }
  #tutText .tut-nav button:active { transform: scale(.94); }
  #tutText .tut-nav button:disabled {
    /* 同 87 号：禁用态走禁行图（与全局 button:disabled / .ab-plus:disabled / .cell.wall 同口径） */
    opacity: .35; cursor: var(--cur-no), auto; background: rgba(255,255,255,.06);
    border-color: rgba(255,255,255,.2); color: #aaa;
 }
  /* 门禁要求：下一步按钮必须可点（兼容旧 .tut-next 选择器，样式交给 .tut-nav button） */
  #tutText .tut-next { pointer-events: auto; }
  #tutText .tut-next:active { transform: scale(.96); }
  /* 光标指引：用 87 号的 PRTS 箭头本体（-cur-src 只有图，不带 hotspot），
   * 靠 transform 平移 → 浏览器能走合成层，移动是平滑的而不是跳格。 */
  #tutCursor {
    position: absolute; z-index: 61; width: 26px; height: 26px; left: 0; top: 0;
    background: var(--cur-src) center/contain no-repeat;
    filter: drop-shadow(0 0 6px rgba(255,215,0,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.6));
    transform: translate(-999px, -999px);
    transition: transform .55s cubic-bezier(.34, 1.2, .4, 1), opacity .2s ease;
    opacity: 0; pointer-events: none;
    /* 轻微上下浮动，和「静止的箭头」区分开：它是在指，不是在摆 */
    will-change: transform;
 }
  #tutCursor.on { opacity: 1; }
  #tutCursor::after {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(255,215,0,.55); animation: tutCursorPulse 1.5s ease-out infinite;
 }
  @keyframes tutCursorPulse {
    0%   { transform: scale(.55); opacity: .9; }
    100% { transform: scale(1.35); opacity: 0; }
 }
  /* ★ ISSUE-教程：教程某步需要「按开始行动」时，给开始行动按钮套一圈脉动高亮，
   * 替代棋盘上的格子光标（按钮不在棋盘内，用 #tutCursor 指不到它）。 */
  .start-btn.tut-point-start {

    #tutBar { font-size: 11px; padding: 4px 11px; }

  /* =========================================================================
   * ISSUE-20261101-137：★ 全平台铺满格栅（人类 2026-11-01 02:12 拍板，取代 113 的固定 21×11）。
   *
   * 三条铁律（改之前先读）：
   *   ① **横版格子边长只由短边决定**：cell = 短边 / 13。不是「取能塞下的最大值」，
   *      是「横版短边必须正好 13 格」—— 换任何屏幕，横版短边永远是 13 个格子。
   *      （★ ISSUE-20261101-154：**竖版例外** —— 竖版改为「宽正好 11 格、高正好 22 行」
   *       两条同时约束取小，见 computeGridFit 的竖版分支。）
   *   ② **长边一直填格子**：能放几格放几格（16:9 桌面 = 25 格、21:9 = 30 格），
   *      放不满的零头不铺格线，直接留成 --frame 色的窄边（人类选「纯色窄边，无格线」）。
   *   ③ **UI 与地图都是 11×11，等大，且两边直接相邻**（人类 02:22「UI 改成固定 11 格*11 格，
   *      和地图一样大」+ ISSUE-20261101-154「删掉中间的格子，两边并在一起」）。
   *      横屏 22 = 11 地图 + 11 UI（无分隔列）；短边 13 = 1 + 11 + 1，上下各一圈地板格。
   *
   * 所以整块内容 = **22×13 的格栅（横版）/ 11×22（竖版）**，多出来的行/列全是地板格。
   * 尺寸全部由 updateCellSize() 写成 CSS 变量，这里只负责把它们用起来 ——
   * 本段**不允许**再出现任何写死的格数（22 / 11 / 9）或像素值。
   * ========================================================================= */
  #game {
    display: grid !important;
    grid-template-columns: repeat(var(--gcols, 22), var(--cell)) !important;
    grid-template-rows: repeat(var(--grows, 13), var(--cell)) !important;
    gap: var(--gap) !important;
    /* ★ place-content:center 就是「余量并入边框」的实现本体：
       格栅按整数格尺寸居中，四周剩下那几 px 露出 #game 的背景 → 天然一条无格线窄边。
       不要再单独画 border，会与这条背景边叠成两层。 */
    place-content: center !important;
    background: var(--frame, #0b0b14) !important;
    /* ★ ISSUE-20261101-138 → ISSUE-20261101-152：底部那圈留白原本是给手机虚拟圆钮底栏
       （position:fixed 浮层）让位的补偿，靠 JS 实测高度写进 --vpad-h。底栏删除后没有浮层要躲，
       --vpad-h 也不再有人写 → 四边一律 0，格子从画面顶端铺到底端（与这条规则的初衷一致）。 */
    padding: 0 !important;
    width: 100% !important;
    flex: 1 1 auto !important;
    min-height: 0 !important;
  }
  #boardWrap {
    /* 位置（第几行到第几行 / 第几列到第几列）由 JS 按横竖屏写入，别在这里写死 */
    grid-column: var(--bx1, 1) / var(--bx2, 12) !important;
    grid-row: var(--by1, 2) / var(--by2, 13) !important;
    width: auto !important;
    height: auto !important;
    aspect-ratio: auto !important;
    flex: none !important;
    overflow: hidden !important;
  }
  /* =========================================================================
   * ISSUE-20261031-131：全屏地板层（人类 23:18「中间部分用地图的地板格填充，
   * 现在全屏幕本质都是地图，只是角色到不了 UI 那边，因为有墙」）。
   *
   * UI 区在 113 里只是**空着的格位**，于是露出 #game 的 #000 —— 中间那条黑竖条就是这么来的。
   * 这层把 UI 区铺满与 .cell.empty 同色的格子，全屏读起来是一整张地图：
   *   · 与地图同一套模数（repeat(整数格) / gap: var(--gap)），格子与地图格严格对齐；
   *   · pointer-events:none —— 不进任何命中测试，点击/拖拽/选角判定一律不受影响；
   *   · z-index:0 且在 DOM 最前 → 永远在 #boardWrap 与 #sidebar 之下，
   *     UI 面板（#stats / #controls）照旧不透明地盖在上面，只有面板之间那 2px 缝隙透出地板。
   *   · 不写死像素：尺寸只由 --cell / --gap 决定，跟着 updateCellSize() 变。
   * ========================================================================= */
  #floorFill {
    /* 铺满整个格栅：地板圈、超宽屏多出来的闲置格，全靠这一层兜住，
       否则会露出 #game 的 --frame 边框色，读起来像画面被裁过。 */
    grid-column: 1 / -1 !important;
    grid-row: 1 / -1 !important;
    display: grid !important;
    grid-template-columns: repeat(var(--gcols, 22), var(--cell)) !important;
    grid-template-rows: repeat(var(--grows, 13), var(--cell)) !important;
    gap: var(--gap) !important;
    pointer-events: none !important;
    z-index: 0 !important;
  }
  /* ★ 反面教训：网格项一旦带 z-index 就会**自成一层**，z-index:0 也高于 z-index:auto 的兄弟。
     第一次实现只给 #floorFill 写了 z-index:0，结果地板直接盖住了 #sidebar 的整块面板。
     #sidebar（与地板重叠）必须显式抬到它上面。
     #boardWrap 不用抬 —— 它跟地板根本不重叠，
     而它自己是 position:relative，天然画在非定位内容之上。 */
  #sidebar { z-index: 1 !important; }
  #floorFill > i {
    display: block !important;
    background: var(--floor, #2d2d44) !important;
    border-radius: 2px;
  }
  /* =========================================================================
   * ISSUE-20261031-127：UI 区按格拼装（人类 22:03「格栅做了吗，现在版本看不到」）。
   *
   * 113 只把 #sidebar 拉成 9 列宽，它自己是**透明**的、内部还是 flex 流式子块，
   * 于是右侧 9×11 = 99 格一个面板都没有 → 直接露出 #game 的 #000，
   * 观感仍是「左边一张地图 + 右边一片黑」。
   *
   * 这里把 #sidebar 变成第二块棋盘：11 列 × 11 行（140 号改成与地图等大），子块各占整数格，
   * 面板**不透明**，缝隙只来自相邻面板之间恰好一个 --gap。
   * ★ 禁止改成「铺格线」（repeating-linear-gradient / 半透明底格）——
   *   113 §一-3 与人类 16:06 原话「盖住格栅，全屏棋盘的感觉是通过 UI 之间的拼接实现的」
   *   已明确否掉那条路线，做了也会被打回。
   * ========================================================================= */
  #sidebar {
    /* 位置由 JS 按横竖屏写入（横屏在地图右侧、竖屏在地图下方），别在这里写死。
       ISSUE-20261101-154：分隔列删除后横屏从第 12 列起（地图 1–11 + UI 12–22）。 */
    grid-column: var(--sx1, 12) / var(--sx2, 23) !important;
    grid-row: var(--sy1, 2) / var(--sy2, 13) !important;
    display: grid !important;
    /* ★ 11×11，与地图等大（人类 02:22 拍板）。这块网格必须与 #board 同模数，
       否则 UI 面板的边线跟棋盘格对不上，「整屏一张棋盘」的观感当场断掉。
       UI 宽度恒 11 列、高度 11 行或 8 行（掉信息格），行列数走变量不写死。 */
    grid-template-columns: repeat(var(--scols, 11), var(--cell)) !important;
    grid-template-rows: repeat(var(--srows, 11), var(--cell)) !important;
    gap: var(--gap) !important;
    width: auto !important;
    height: auto !important;
    max-width: none !important;
    flex: none !important;
    overflow: visible !important;
    background: none !important;
    padding: 0 !important;
  }
  /* =========================================================================
   * ★ ISSUE-20261101-144：UI 四单元格化 —— 状态 11×3 / 信息 11×3 / 操作 11×5。
   *
   * 人类 2026-11-01 15:48 原话：「就像 Excel 表格一样，每个 UI 都是由格子组成的，
   * 逻辑上就不可能脱离格子，UI 相当于合并了的单元格」。
   *
   * 三条硬规则，违反任意一条偏差立刻回来：
   *   ① 面板自己**不许**有 padding / border —— 它们占布局、吃掉格高，内部再用 1fr 均分
   *      就会逐行累积（137 起正是这样，实测底部少 0.28·cell + 2px ≈ ⅓ 格）。要边框用 inset 阴影。

<!-- ★ ISSUE-20261101-145：下载截断看门狗（**不依赖主脚本**）。
     主脚本内联在 <body> 末尾（约 1.3 MB）。一旦下载中途断开，内联脚本会因为块注释/字符串被截断而
     **语法错误 → 整段不执行**，页面只剩静态骨架（4 个角标 + 空面板）= 玩家眼里的「黑屏」。
     本段位于 </head> 前（产物内约 100 KB 处），几乎不可能被截断：
       · 正常：主脚本画出 121 格后，定时器发现 #board 有子元素 → 立即返回，**DOM 零改动**；
       · 异常：先自动重载一次（穿透缓存），仍失败才显示提示卡片。
     不要把判定改成依赖主脚本，那等于没有兜底。 -->
<script>
(function () {
  var RETRY_KEY = 'ark_boot_retry';
  var handled = false;

  /* 主脚本**第一件事**就是给 window.__ARK_VERSION__ 赋值（见产物内 `P0.1-1 冻结基线`）。
     它存在 ⇔ 内联主脚本至少完整解析并开始执行 → 不是被截断，看门狗一律不插手。
     ★ 不要退回「检查 #board 有没有格子」：jsdom 门禁里棋盘常常是空的（还没进关、或在测空态），
       那会让 8 s 定时器误判，进而调 location.replace —— jsdom 不支持导航，会以
       `jsdomError: Not implemented: navigation` 污染「无未捕获异常」断言（本次踩过）。 */
  function mainScriptRan() {
    return !!window.__ARK_VERSION__;
  }

  function reloadOnce() {
    try {
      if (sessionStorage.getItem(RETRY_KEY) === '1') return false;
      sessionStorage.setItem(RETRY_KEY, '1');
      var u = location.href.split('#')[0];
      var h = location.hash || '';
      location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + '_reload=1' + h);
      return true;
    } catch (e) { return false; }
  }

  function showCard() {
    if (handled || mainScriptRan() || !document.body) return;
    handled = true;
    var d = document.createElement('div');
    d.id = 'bootRetry';
    d.setAttribute('data-debug-name', '\u52a0\u8f7d\u5931\u8d25\u63d0\u793a');
    d.innerHTML = '<div class="br-card">' +
      '<div class="br-ico">\u26a0\ufe0f</div>' +
      '<div class="br-t">\u9875\u9762\u6ca1\u6709\u52a0\u8f7d\u5b8c\u6574</div>' +
      '<div class="br-s">\u591a\u534a\u662f\u7f51\u7edc\u4e2d\u65ad\uff0c\u53ea\u4e0b\u5230\u4e86\u9875\u9762\u7684\u4e00\u90e8\u5206\u3002<br>' +
      '\u70b9\u4e0b\u9762\u7684\u6309\u94ae\u91cd\u65b0\u52a0\u8f7d\u4e00\u6b21\u901a\u5e38\u5c31\u597d\u4e86\u3002</div>' +
      '<button type="button" class="br-b" id="bootRetryBtn">\u91cd\u65b0\u52a0\u8f7d</button>' +
      '</div>';
    document.body.appendChild(d);
    var btn = document.getElementById('bootRetryBtn');
    if (btn) btn.onclick = function () { location.reload(); };
  }

  function onFail() {
    if (mainScriptRan()) return;
    if (reloadOnce()) return;
    showCard();
  }

  /* ① 语法错误是最强信号：内联主脚本被截断时必定抛 SyntaxError，不必等 8 s 定时器。
     addEventListener 与 window.onerror 两个都挂：实测前者对内联脚本的解析期错误收不到，
     后者能立刻拿到（不冲突，重复触发由 onFail 的 mainScriptRan() 兜住）。 */
  function looksLikeSyntaxError(m) {
    return /SyntaxError|Unexpected end of input|Unexpected token/i.test(m);
  }
  window.addEventListener('error', function (e) {
    if (looksLikeSyntaxError(String((e && e.message) || ''))) setTimeout(onFail, 60);
  });
  window.onerror = function (msg) {
    if (looksLikeSyntaxError(String(msg || ''))) setTimeout(onFail, 60);
    return false;
  };

  /* ② 兜底定时器：线上完整下载约 4 s，8 s 后棋盘仍是空的就判定没起来。 */
  setTimeout(onFail, 8000);

  /* ③ 成功路径清掉重试标记，免得下次真出问题时连自动重载的机会都没有。 */
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!mainScriptRan()) return;
      try { sessionStorage.removeItem(RETRY_KEY); } catch (e) {}
    }, 1200);
  });
})();
</script>
</head>

    <!-- 地图角标（ISSUE-20261029-21）：👤 左上格 / ⚙ 右上格 / ♟️ 右下格，尺寸 = 一格。

    <button id="lobbyOpenBtn" title="账号与排行" aria-label="账号与排行" aria-expanded="false">👤</button>
    <button id="setOpenBtn" data-debug-name="⚙ 设置角标" title="设置" aria-label="设置" aria-expanded="false">⚙</button>
    <button id="charOpenBtn" data-debug-name="♟️ 角色角标" title="角色面板" aria-label="角色面板" aria-expanded="false">♟️</button>
    <!-- ISSUE-20261030-84：第 4 角标（地图左下格）接上功能 —— 📟 = 升级奖励 / 收藏品 / 关卡事件
         三块面板的统一入口。有奖励待领取时高亮（.has-pending），点一下按「加点 → 收藏品 → 事件」
         顺序继续往下走（复用 afterClearGate，天然幂等，不另写分支）。 -->
    <button id="rewardOpenBtn" data-debug-name="📟 奖励角标" title="奖励与事件" aria-label="奖励与事件" aria-expanded="false">📟</button>
    <!-- 选角厅「技能说明展开层」（ISSUE-20261029-29）：点角色后盖在棋盘中部（第 1 行 ~ 倒数第 2 行），
         出口所在的第一行不遮。放在 #boardWrap 里而不是 #board 里：paintBoard() 每次都 innerHTML
         重建 #board 那一层，放进去会被冲掉。位置由 layoutCharInfoSheet() 按格子矩形实算。 -->
    <div id="charInfoSheet" hidden></div>
  </div>
  <div id="dragHandle" title="拖动调整地图与右侧UI的比例"><span class="grip"></span></div>
  <div id="sidebar" data-debug-name="右侧栏">
    <!-- ★ ISSUE-20261101-144：四单元格化。状态 11×3 + 信息 11×3 + 操作 11×5 = 11 行，
         与地图 11×11 等大；三块之间只用 --gap 缝隙分隔（人类 15:48「就像 Excel」）。
         #actionSlot / #footBar 已删除：一个自 137 起只清空不填充、一个自 97 起永远空，
         留着就是两个「没有 grid-area 的自动流隐患」—— 当初 HUD 飘到 y=790 正是这个坑。
         以后往 #sidebar 里加东西，**必须**先给它分配整数 grid-area（或进某一块的内部网格）。 -->
    <div id="stats" data-debug-name="状态格（11×3）"></div>
    <div id="info" data-debug-name="信息格（11×3）"></div>
    <div id="controls" data-debug-name="操作格（11×5）"></div>
  </div>
</div>

<!-- 设置抽屉的开关 ⚙ 已搬进棋盘右上格（ISSUE-20261029-21），见 #boardWrap 内的角标 -->

<!-- 抽屉遮罩：点一下关闭当前抽屉 -->
<div id="drawerMask" data-debug-name="抽屉遮罩"></div>

<!-- ★ ISSUE-20261028-14 教程提示条：**独立于日志面板**。
     日志在手机竖屏下多半在视口外，新手看不到等于没提示；这条固定在棋盘下方居中。 -->
<div id="tutBar" hidden></div>

<!-- ① 设置抽屉（原 #logPanel 悬浮窗：⚔️联机 / ⟲重开 / ⟳旋转 + 战斗日志） -->
<section class="drawer" id="drawerSettings" data-drawer="settings" aria-hidden="true">
  <header class="drawer-head head-end">
    <span id="setVer" title="当前版本"></span>
    <span class="drawer-title">设置</span>
  </header>
  <!-- ISSUE-20261029-44 第3项：删掉面板内独立 ✕，改由棋盘右上格的 ⚙ 角标本体关闭
       （打开时该角标浮到面板之上并变 ✕，再按一下收起）。 -->
  <div class="drawer-body">
    <div id="setBtns">
      <button id="logResetBtn" title="重开游戏（回到选角界面）">⟲ 重开</button>
      <button id="logRotateBtn" title="旋转屏幕 / 切换布局">⟳ 旋转</button>
      <!-- ★ ISSUE-20261028-14 D3：教程重看入口。默认只自动播「通用课 + 你选的那个角色」，
           其余角色的课在这里可以单独进入，不做成「4 节全强制看完」。 -->
      <button id="tutReplayBtn" title="重看教程（通用课 / 各角色专属课）">📖 教程</button>
      <!-- ★ ISSUE-20261031-98：「恢复系统光标」开关。**用纯文字，不用 emoji/图标** ——
           96 号铁律要求新增图标必须是 Win10 SVG，而 sprite 里没有鼠标字形；
           纯文字零新素材、不过 96 号闸门。文案由 setPrtsCursor() 动态改写。 -->
      <button id="curToggleBtn" title="自定义光标 开/关">光标·开</button>
      <!-- ★ ISSUE-20261031-130：「移动方式」开关。**只影响选角厅** —— 事件关强制逐格，
           按钮在那种相位下没有任何作用（代码里也不读它）。文案刻意不用「新/旧」：
           半年后没人知道哪个是新的，写「逐格 / 平滑」才是描述行为本身。 -->
      <button id="stepToggleBtn" title="移动方式：逐格 / 平滑（仅选角厅）">移动·逐格</button>
      <!-- ★ ISSUE-20261031-95：「导出文案改动」。默认 hidden —— 只有管理员开 debugMode 后
           才由 src/ui/text_edit.js 显出来。正式玩家永远看不到这个按钮（零界面污染）。 -->
      <button id="textExportBtn" title="导出 Alt 就地改过的文案（text-overrides.json）" hidden>导出文案</button>
    </div>
    <div id="tutReplayList" hidden></div>
    <div id="log"></div>
  </div>
</section>

<!-- ③ 升级奖励抽屉（通关自动弹出；选完奖励后自动弹 ♟️ 角色面板做六维加点，ISSUE-20261029-37） -->
<section class="drawer" id="drawerLevelUp" data-drawer="levelup" aria-hidden="true">
  <header class="drawer-head">
    <span class="drawer-title" id="drawerLevelUpTitle">升级奖励</span>
    <!-- 这里**没有 ✕**（ISSUE-20261030-47）：奖励必须选一个才能继续，
         留个点不动的按钮只会让玩家以为坏了。遮罩/Esc 也由 drawerClose 统一拒绝。 -->
  </header>
  <div class="drawer-body" id="drawerLevelUpBody"></div>
</section>

<!-- ⑤ 收藏品三选一（ISSUE-20261028-06）：每通关 3 关一次，与经验升级解耦。
     同样**没有 ✕** —— 收藏品是纯正收益，没有「跳过」的道理，必须选一件才走。 -->
<section class="drawer" id="drawerRelic" data-drawer="relic" aria-hidden="true">
  <header class="drawer-head">
    <span class="drawer-title" id="drawerRelicTitle">收藏品</span>
  </header>
  <div class="drawer-body" id="drawerRelicBody"></div>
</section>

<!-- ⑥ 关卡事件（ISSUE-20261028-06）：每关通关必弹，选项有取舍或随机。
     **没有 ✕**：每个事件都自带一个「什么都不做」的安全选项（等价于跳过），
     但不允许关掉抽屉直接逃到下一关 —— 否则事件就成了可选福利，失去取舍意义。 -->
<section class="drawer" id="drawerEvent" data-drawer="event" aria-hidden="true">
  <header class="drawer-head">
    <span class="drawer-title" id="drawerEventTitle">关卡事件</span>
  </header>
  <div class="drawer-body" id="drawerEventBody"></div>
</section>

<!-- ④ 角色面板（ISSUE-20261029-36 奠基 / 20261029-42 重做）：与设置面板同款「覆盖棋盘」弹窗。
     形状 = 棋盘本身（棋盘已正方形化，ISSUE-20261029-43），所以面板就是正方形。
     内容：顶部 = 与「行动按钮上方 HUD」**完全同源**的角色信息（#charTop 由 renderHeroCard 写入）；
           左下 = 六维图（点属性名直接加点，下挂剩余点数提示）；
           右下 = 升级获得的 BUFF 奖励池（代替被删掉的那排徽章）。
     ★ 没有标题栏、没有 ✕：点面板外面（遮罩）或按 Esc 关闭 —— 人类 2026-10-29 16:18 要求。 -->
<section class="drawer" id="drawerChar" data-drawer="char" aria-hidden="true">
  <div class="drawer-body char-body">
    <div class="char-top" id="charTop"></div>
    <!-- ISSUE-20261030-74 ②：六维图上方加 AC / 熟练两个圆角方框（值由 renderCharPanel 填） -->
    <div class="char-stats-row" id="charStatsRow">
      <div class="char-stat-box"><span class="char-stat-label">AC</span><span class="char-stat-val" id="charAcVal">—</span></div>
      <div class="char-stat-box"><span class="char-stat-label">熟练</span><span class="char-stat-val" id="charProfVal">—</span></div>
      <div class="char-stat-box"><span class="char-stat-label" id="charDmgLbl">伤害</span><span class="char-stat-val" id="charDmgVal">—</span></div>
    </div>
    <div class="char-grid">
      <div class="char-radar">
        <canvas id="charRadarCanvas" data-debug-name="六维雷达图"></canvas>
        <div class="char-alloc" id="charAllocHint"></div>
      </div>
      <div class="char-relics" id="charRelics"></div>
    </div>
  </div>
</section>

<!-- ===================================================================
     ISSUE-20261029-46：联机大厅面板（覆盖棋盘，与设置 / 角色面板同一套 .drawer 机制）
     -------------------------------------------------------------------
     入口 = 选角厅地图上的 🌐 那格（代码 (9,5)，人类 (9,5)）—— 走过去或点一下都能进。
     布局：上面 = 玩家昵称（与账号一致，JS 从 ArkShell.account 取，不是让玩家重填）；
           中间 = 房间号输入栏（域名固定 https://arkroguelike.top，所以只填房间号）；
           左下 = 建房、右下 = 加入。
     建房 → 进「房间地图」，五位房间码渲染在棋盘**底行** x=3..7、y=ROWS-1（人类最底一行）。
     节点挂在 <body> 直属（不能挂 #sidebar：render() 每次重刷侧栏会把面板冲掉）。
     =================================================================== -->
<section class="drawer" id="drawerOnline" data-drawer="online" aria-hidden="true">
  <div class="drawer-body online-body">
    <div class="online-nick">昵称：<b id="onlineNick">—</b></div>
    <!-- ★ ISSUE-20261031-128：模式选择。默认「对战」= 改动前的行为，一个字节都没变；
         选「合作」才走 4 人大厅那条新链路。 -->
    <div class="online-modes" id="onlineModes">
      <button class="online-mode on" id="onlineModePvp" data-mode="pvp" type="button">⚔ 对战</button>
      <button class="online-mode" id="onlineModeCoop" data-mode="coop" type="button">🤝 合作闯关</button>
    </div>
    <div class="online-mid">
      <!-- ★ DEBUG-20261030-02：原来 maxlength=6 隐含「房间号 6 位」的假设，与服务端/显示层三方各说各话。
           位数归一交给服务端（服务端只认 ROOMS{} 里的键），前端放宽到 8 只为挡住粘贴垃圾，
           不再做「猜测性」硬限制 —— 那正是这次联机全挂的成因类别。 -->
      <input id="onlineRoomIn" maxlength="8" placeholder="房间号" autocomplete="off" spellcheck="false">
    </div>
    <div id="onlineStatus"></div>
    <!-- ★ 合作房大厅：座位表 + 房主「开始」。只在合作模式且已进房时显示。 -->
    <div id="onlineRoom" class="online-room" hidden>
      <div class="or-head">房间号 <b id="orCode">—</b><span id="orCount" class="or-count"></span></div>
      <ul id="orSlots" class="or-slots"></ul>
      <div id="orHint" class="or-hint"></div>
    </div>
  </div>
  <div class="online-foot">
    <button id="onlineCreate" class="online-btn" type="button">建房</button>
    <button id="onlineJoin" class="online-btn" type="button">加入</button>
    <button id="onlineStart" class="online-btn or-start" type="button" hidden>开始闯关</button>
  </div>
</section>

<!-- ===================================================================
     ISSUE-20261029-45：账号与排行榜（原 index.html 外壳，已内联进单文件）
     -------------------------------------------------------------------
     面板内「只显示排行榜」：原左 1/3 账号卡（.acct / .avatar / .pnameLine / .pstats）
     已整块删除。账号信息改为「自己那一行 + 该行下方的内联编辑抽屉」（由 JS 按需插入），
     玩家未上榜时由底部 setRow 提供同一套编辑入口。
     =================================================================== -->
<div id="arkUi">
  <div id="lobbyMask"></div>

  <aside id="lobbyDrawer" tabindex="-1" aria-hidden="true" aria-label="排行榜">
    <header class="dhead">
      <span class="dtitle">🏆 排行榜</span>
      <span class="meta" id="boardMeta"></span>
    </header>
    <div class="dbody" id="rankScroll">
      <ol id="miniBoard"></ol>
      <div class="empty" id="boardEmpty" hidden>还没有人上榜<br>去玩一把，把名字留在上面 ✦</div>
    </div>
  </aside>

  <div id="hint" class="hide"></div>
  <div id="toast"></div>
</div>

<script src="app.js?v=11012252"></script>
</body>
</html>
