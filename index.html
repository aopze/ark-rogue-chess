  dragHandle.classList.add('dragging');
  try { dragHandle.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
dragHandle.addEventListener('pointermove', (e) => {
  if (!sideDragging) return;
  // 右侧内边距16 + 半个调整块5 + 两个gap 8*2 ≈ 29
  sideDragPendingW = window.innerWidth - e.clientX - 29;
  if (!sideDragRaf) sideDragRaf = requestAnimationFrame(sideDragFlush);
});
function endSideDrag() {
  if (!sideDragging) return;
  sideDragging = false;
  dragHandle.classList.remove('dragging');
  if (sideDragRaf) { cancelAnimationFrame(sideDragRaf); sideDragRaf = 0; sideDragFlush(); }
  const cur = parseFloat(sidebarEl.style.width) || sidebarEl.offsetWidth;
  applySidebarWidth(cur, true);
  if (player || phase === 'char_select') render();
}
dragHandle.addEventListener('pointerup', endSideDrag);
dragHandle.addEventListener('pointercancel', endSideDrag);

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    if (window.innerWidth > 760) {
      if (sidebarEl.style.width) applySidebarWidth(parseFloat(sidebarEl.style.width) || sidebarEl.offsetWidth, false);
      else fitSidebarToWidth();
    } else {
      radarCanvas.style.width = '';
      radarCanvas.style.height = '';
      updateCellSize();
    }
    if (player || phase === 'char_select') render();
  }, 100);
});

function updateCellSize() {
  const m = phase === 'char_select' ? selMap : map;
  if (!m || m.length === 0) return;
  const bbox = getBoundingBox();
  const bc = bbox.maxX - bbox.minX + 1;
  const br = bbox.maxY - bbox.minY + 1;
  const gap = 2;
  let ww = boardWrap.clientWidth, wh = boardWrap.clientHeight;
  if (ww <= 0) ww = window.innerWidth - (window.innerWidth > 760 ? 350 : 20);
  if (wh <= 0) wh = window.innerHeight - (window.innerWidth > 760 ? 60 : 200);
  const wl = (ww - 16 - (bc - 1) * gap) / bc;
  const hl = (wh - 16 - (br - 1) * gap) / br / 1.12;
  let cell = Math.floor(Math.min(wl, hl));
  cell = Math.max(16, Math.min(cell, 80));
  document.documentElement.style.setProperty('--cell', cell + 'px');
}

function logEnemyMainDirections() {
  if (phase !== 'planning') return;
  const dirNames = { '0,-1': '上', '0,1': '下', '-1,0': '左', '1,0': '右' };
  enemies.forEach((e, i) => {
    if (!e.alive) return;
    if (e.stunTurns > 0) { log(`敌人${i+1} 眩晕中（无意图）`); return; }
    const path = enemyPaths[i];
    if (!path || path.length < 2) { log(`敌人${i+1} 主方向：无`); return; }
    const counts = {};
    for (let j = 1; j < path.length; j++) {
      const dx = path[j].x - path[j-1].x, dy = path[j].y - path[j-1].y;
      const d = dirNames[`${dx},${dy}`] || '?';
      counts[d] = (counts[d] || 0) + 1;
    }
    let max = 0, main = [];
    for (const d in counts) { if (counts[d] > max) { max = counts[d]; main = [d]; } else if (counts[d] === max) main.push(d); }
    log(`敌人${i+1} 主方向：${main.join('/') || '无'}`);
  });
}

function buildBoardHtml() {
  let html = '';
  const bbox = getBoundingBox();
  const m = phase === 'char_select' ? selMap : map;
  let previewCounter = false;
  let attackSuppressFromIdx = Infinity;
  if (phase === 'planning') {
    if (selectedChar === 'fencer') {
      previewCounter = canEnterCounterState(playerPath);
    }
  }
  /* 攻击范围高亮 / 阿米娅倾泻节点（只在规划阶段生效） */
  const rangeSet = (phase === 'planning' && showRangeOverlay) ? playerAttackRangeCells() : null;
  const burstIdx = (phase === 'planning' && selectedChar === 'amiya') ? amiyaBurstAttackIndex(playerPath) : null;
  for (let y = bbox.minY; y <= bbox.maxY; y++) {
    for (let x = bbox.minX; x <= bbox.maxX; x++) {
      let cls = 'cell';
      let content = '';
      if (m[y][x] === 1) {
        const hw = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => isWalkable(x+dx, y+dy));
        if (hw) cls += ' wall'; else cls += ' void';
      } else cls += ' empty';
      if (rangeSet && rangeSet.has(key(x, y))) cls += ' in-range';
      if (phase === 'char_select') {
        if (selExit.x === x && selExit.y === y) { cls += ' exit-cell'; content = '🚪'; }
        else {
          const cand = charCandidates.find(c => c.x === x && c.y === y);
          if (cand) { cls += ' candidate'; if (selectedCandidate === cand) cls += ' selected'; content = unitHtml(CHARACTERS[cand.id].icon, 1, { maxHp: 1, isPlayer: true }); }
        }
      } else {
        const stepsAtCell = [];
        playerPath.forEach((p, idx) => { if (p.x === x && p.y === y) stepsAtCell.push(idx); });
        if (stepsAtCell.length > 0) {
          cls += ' path';
          const hasAttack = !previewCounter && stepsAtCell.some(idx =>
            attackIndices.includes(idx) && idx < attackSuppressFromIdx
          );
          if (hasAttack) {
            cls += ' attack';
            if (burstIdx !== null && stepsAtCell.includes(burstIdx)) cls += ' burst';
            if (playerAttacksDone >= 1 + player.extraAttacks) cls += ' used';
          }
        }
        const playerHere = player.alive && player.x === x && player.y === y;
        const enemyHere = enemies.find(e => e.alive && e.x === x && e.y === y);
        const bloodHere = bloodDrops.some(b => b.x === x && b.y === y);
        if (playerHere || enemyHere) {
          /* 有单位站在这格时看不见格内文字：倾泻节点改用右上角小皇冠标记 */
          if (burstIdx !== null && stepsAtCell.includes(burstIdx)) cls += ' burst-mark';
        } else if (rewardItems.some(r => r.x === x && r.y === y)) {
          cls += ' item-cell';
          content = `<span class="item-pulse" style="font-size:calc(var(--cell)*0.5);">❤️</span>`;
        } else if (bloodHere) {
          cls += ' blood-cell';
          content = `<span class="item-pulse" style="font-size:calc(var(--cell)*0.5);">🩸</span>`;
        } else if (stepsAtCell.length > 0) {
          const lastIdx = stepsAtCell[stepsAtCell.length - 1];
          const hasAttack = !previewCounter && stepsAtCell.some(idx =>
            attackIndices.includes(idx) && idx < attackSuppressFromIdx
          );
          if (hasAttack) {
            content = (burstIdx !== null && attackIndices.includes(burstIdx)) ? '👑' : '🎯';
          }
          else if (stepsAtCell.length > 1) content = `⏳${lastIdx}`;
          else if (lastIdx > 0) content = `${lastIdx}`;
          else content = '';
        }
      }
      html += `<div class="${cls}" data-x="${x}" data-y="${y}">${content}</div>`;
    }
  }
  return html;
}

/* ===== 角色卡（六维图 + 关键数值） ===== */
function hpStateClass(hp, maxHp) {
  const r = maxHp > 0 ? hp / maxHp : 0;
  if (r <= 0.3) return 'danger';
  if (r <= 0.6) return 'warn';
  return '';
}

function renderHero(opt) {
  if (!heroInfoEl) return;
  const maxHp = opt.maxHp || 0;
  const pct = maxHp > 0 ? Math.max(0, Math.min(100, (opt.hp / maxHp) * 100)) : 0;
  const hpText = opt.hpText || (maxHp > 0 ? `${opt.hp} / ${maxHp}` : '—');
  const shieldN = opt.shield || 0;
  const shieldBar = shieldN > 0
    ? `<div class="hp-shield" style="width:${Math.min(100, shieldN * 12)}%" title="护盾 ${shieldN} 层"></div>`
    : '';
  const hpBar = maxHp > 0
    ? `<div class="hp-track ${hpStateClass(opt.hp, maxHp)}"><div class="hp-fill-lg" style="width:${pct}%"></div>${shieldBar}<span class="hp-text"><i class="bar-lbl">HP</i>${hpText}</span></div>`
    : '';
  let spBar = '';
  if (opt.sp && opt.sp.max > 0) {
    const sp = Math.max(0, Math.min(opt.sp.max, opt.sp.cur || 0));
    const maxed = sp >= opt.sp.max;
    spBar = `<div class="sp-track ${maxed ? 'max' : ''}"><div class="sp-fill" style="width:${(sp / opt.sp.max) * 100}%"></div><span class="sp-text"><i class="bar-lbl">SP</i>${sp}/${opt.sp.max}</span></div>`;
  }
  heroInfoEl.innerHTML = `
    <div class="hero-top">
      <span class="hero-name">${opt.name}</span>
      <span class="hero-lv">${opt.tag || ''}</span>
    </div>
    ${hpBar}
    ${spBar}
  `;
  if (heroKvEl) {
    heroKvEl.innerHTML = opt.kvHtml || '';
    heroKvEl.querySelectorAll('[data-kv-action]').forEach(el => {
      el.onclick = (ev) => { ev.stopPropagation(); handleKvAction(el.dataset.kvAction); };
    });
  }
}

/* 2×2 仪表：把 [[标题, 数值, 样式类, 点击动作?, 是否高亮?], ...] 渲染成格子（传 null 占位 = 空格子） */
function renderKvGrid(rows) {
  return `<div class="kv-grid">${rows.map(row => {
    if (!row || row[0] == null) return '<div class="kv kv-empty"></div>';
    const action = row[3] || '';
    const lit = row[4] ? ' lit' : '';
    const cls = `kv ${row[2] || ''}${action ? ' click' : ''}${lit}`;
    return `<div class="${cls}"${action ? ` data-kv-action="${action}"` : ''}><b>${row[0]}</b><span>${row[1]}</span></div>`;
  }).join('')}</div>`;
}

/* 技能说明列表：「技力/技能/被动/」前缀和「[技能名]」上色，其余保持普通文本 */
function renderTips(tips) {
  const labelRe = /^(\[[^\]]{1,14}\]|[^：:]{1,4})[：:]\s*/;
  return (tips || []).map(t => {
    const s = String(t);
    const m = s.match(labelRe);
    if (!m) return `<li>${s}</li>`;
    const key = m[1];
    const rest = s.slice(m[0].length);
    const cls = key.startsWith('[') ? 'tip-k skill' : 'tip-k';
    return `<li><span class="${cls}">${key}：</span>${rest}</li>`;
  }).join('');
}

/* 点角色卡仪表格：步数 = 等待 · 攻击 = 攻击节点 · 伤害 = 显示攻击范围 */
function handleKvAction(action) {
  if (phase !== 'planning' || isMoving || !player) return;
  if (action === 'wait') {
    if (countWaitSteps(playerPath) >= player.move) { log('等待次数已用完（等待上限 = 移动力）。'); return; }
    const last = playerPath.length ? playerPath[playerPath.length - 1] : { x: player.x, y: player.y };
    playerPath.push({ x: last.x, y: last.y });
    refreshBoardOnly();
  } else if (action === 'attack') {
    if (playerPath.length === 0) return;
    toggleAttack(playerPath.length - 1);
    refreshBoardOnly();
  } else if (action === 'range') {
    showRangeOverlay = !showRangeOverlay;
    log(showRangeOverlay ? '📐 显示攻击范围（蓝色地块）。' : '关闭攻击范围显示。');
    refreshBoardOnly();
  }
}

function renderAbilityAllocator() {
  if ((phase !== 'planning' && phase !== 'levelclear') || playerStats.abilityPoints <= 0) return '';
  const tip = (phase === 'levelclear')
    ? `⚠️ 请先点击左侧六维图上的属性名，分配完 ${playerStats.abilityPoints} 点属性才能进入下一关`
    : `点击左侧六维图上的属性名加点（剩余 ${playerStats.abilityPoints} 点）`;
  return `<div class="stat" style="color:#ffd700">${tip}</div>`;
}

function updateStats() {
  drawRadar();

  /* ---------- 选角色 ---------- */
  if (phase === 'char_select') {
    if (!selectedCandidate) {
      renderHero({
        name: '选择角色', tag: '', hp: 0, maxHp: 0, hpText: '—',
        kvHtml: renderKvGrid([
          ['移动', '—', 'dim'], ['AC', '—', 'dim'],
          ['伤害', '—', 'dim'], null,
        ]),
      });
      statsEl.innerHTML = `<div class="mini">点击地图上的角色，然后移动至 🚪 出口。六维图中<b style="color:#8fe28a">绿色</b> = 熟练项与最高属性。</div>`;
      return;
    }
    const char = CHARACTERS[selectedCandidate.id];
    const a = char.abilities;
    const mv = Math.max(1, Math.floor(a.dex / 2));
    /* 每个角色只有一种伤害方式（攻击节点类型决定），四格只显示对应的那一个伤害 */
    const selRanged = isRangedChar(selectedCandidate.id);
    const selDmg = selRanged ? Math.max(1, 1 + abilityMod(a.int)) : Math.max(1, 1 + abilityMod(a.str));
    const selDmgProf = selRanged ? char.profRanged : char.profMelee;
    /* 选角阶段预览技力槽：泥岩/风笛/华法琳 5、阿米娅上限 = 感知，其余角色无技力机制 */
    const spPreview = selectedCandidate.id === 'fencer' || selectedCandidate.id === 'wheelchair' || selectedCandidate.id === 'vampire'
      ? { cur: 0, max: FENCER_SP_MAX }
      : (selectedCandidate.id === 'amiya' ? { cur: 0, max: Math.max(1, a.wis) } : null);
    renderHero({
      name: `${char.name} ${char.icon}`,
      tag: '待选择',
      hp: a.con, maxHp: a.con,
      sp: spPreview,
      kvHtml: renderKvGrid([
        ['移动', `${mv}`, ''],
        ['AC', `${computeAC(a)}`, ''],
        [charDmgLabel(selectedCandidate.id), `${selDmg}`, selDmgProf ? 'prof' : ''],
        null,   // 角色只有一种伤害方式 → 另一格留空，保持 2×2
      ]),
    });
    statsEl.innerHTML = `
      <div class="card">
        <div class="card-title">技能说明</div>
        <div class="card-meta">${char.desc}</div>
        <ul class="tips">${renderTips(char.tips)}</ul>
      </div>`;
    return;
  }

  /* ---------- 对局中 ---------- */
  if (!player) return;
  if (player.hp > 0 && player.alive) playerStats.currentHp = player.hp;
  const charInfo = CHARACTERS[selectedChar] || null;
  const a = player.abilities;
  const isRanged = isRangedChar(selectedChar);
  const isFencer = selectedChar === 'fencer';

  /* 角色卡：左六维图 / 右上 HP+技力 / 右下 2×2 仪表 */
  const moveUsed = countMoveSteps(playerPath);
  const atkNodes = attackIndices.length;
  /* 角色只有一种伤害方式（攻击节点类型决定），只显示对应的那一个，另一格留空保持 2×2 */
  const dmgVal = isRanged ? player.rangedDmg : player.meleeDmg;
  const dmgProf = isRanged ? player.rangedProf : player.meleeProf;
  const kvGrid = renderKvGrid([
    ['步数', `${moveUsed}/${player.move}`, moveUsed >= player.move ? 'hi' : '', 'wait'],
    ['攻击', `${atkNodes}`, atkNodes > 0 ? 'on' : 'dim', 'attack'],
    [charDmgLabel(selectedChar), `${dmgVal}`, dmgProf ? 'prof' : '', 'range', showRangeOverlay],
    null,
  ]);
  /* 技力槽：泥岩固定上限 5；阿米娅上限 = 感知；风笛上限 5（沿直线移动积累，规划时预览增量）；华法琳上限 5（捡血迹） */
  let spInfo = null;
  if (isFencer) spInfo = { cur: fencerSp, max: FENCER_SP_MAX };
  else if (selectedChar === 'amiya') spInfo = { cur: amiyaBonusTargets, max: amiyaSpMax() };
  else if (selectedChar === 'wheelchair') spInfo = { cur: wheelchairPreviewSp(), max: WHEELCHAIR_SP_MAX };
  else if (selectedChar === 'vampire') spInfo = { cur: vampireSp, max: VAMPIRE_SP_MAX };
  renderHero({
    name: `${charInfo ? charInfo.name : '未知'} ${charInfo ? charInfo.icon : ''}`,
    tag: `第 ${level} 关 · AC ${player.ac}`,
    hp: player.hp, maxHp: player.maxHp,
    shield: playerShield,
    sp: spInfo,
    kvHtml: kvGrid,
  });

  /* 状态徽章 */
  const badges = [];
  if (selectedChar === 'fencer' && fencerCounterActive) {
    badges.push('<span class="badge gold">反击状态 · 禁攻击节点</span>');
  } else if (selectedChar === 'fencer' && canEnterCounterState(playerPath)) {
    badges.push('<span class="badge gold">第二次等待后进入反击</span>');
  } else if (selectedChar === 'wheelchair' && playerChargingThisTurn) {
    badges.push('<span class="badge gold">冲锋中 · 禁攻击/趁乱</span>');
  }
  if (selectedChar === 'wheelchair' && !playerChargingThisTurn) {
    if (pathHasCharge(playerPath)) {
      badges.push('<span class="badge gold">冲锋就绪 · 攻击节点已变冲锋</span>');
    } else if (wheelchairPreviewSp() >= WHEELCHAIR_SP_MAX) {
      badges.push('<span class="badge gold">技力满 · 规划攻击节点可发动「高效冲击」</span>');
    }
  }
  if (selectedChar === 'amiya' && amiyaBonusTargets >= amiyaSpMax()) {
    badges.push('<span class="badge gold">技力满 · 精神爆发就绪 👑</span>');
  } else if (selectedChar === 'amiya' && amiyaBonusTargets > 0) {
    badges.push(`<span class="badge gold">技力 ${amiyaBonusTargets} · 等待后接攻击可发动精神爆发</span>`);
  }
  if (selectedChar === 'vampire') {
    if (vampireSkillActive) {
      badges.push('<span class="badge gold">不稳定血浆 · 必定命中/暴击/留血迹（每次 -1 HP）</span>');
    } else if (vampireSp >= VAMPIRE_SP_MAX) {
      badges.push('<span class="badge gold">技力满 · 起始点攻击可发动「不稳定血浆」</span>');
    }
  }
  if (isFencer && fencerSp >= FENCER_SP_MAX) {
    badges.push(fencerCounterActive
      ? '<span class="badge gold">岩崩锤就绪 · 免疫一切攻击</span>'
      : '<span class="badge gold">岩崩锤就绪 · 反击时眩晕 + 回血</span>');
  }
  if (playerShield > 0) badges.push(`<span class="badge white">🛡 护盾 ×${playerShield}</span>`);
  if (levelHpBonus > 0) badges.push(`<span class="badge teal">升级 +${levelHpBonus} HP</span>`);
  const buffChips = BUFF_POOL.filter(b => buffs[b.id] > 0)
    .map(b => `<span class="chip buff" title="${b.name}：${b.desc}">${b.icon} ${b.name}${buffs[b.id] > 1 ? ' ×' + buffs[b.id] : ''}</span>`)
    .join('');
  const badgeRow = (badges.length || buffChips)
    ? `<div class="stat">${badges.join('')}${buffChips}</div>` : '';

  /* 底部信息 */
  const phaseText = phase === 'planning' ? '规划' : phase === 'resolving' ? '结算' : phase === 'levelclear' ? '通关' : '结束';
  const footParts = [`回合 ${battleRound}`, `敌人 ${enemies.filter(e => e.alive).length}`, `阶段 ${phaseText}`, `格 ${countWalkable(map)}`];
  if (isRanged) footParts.push(`射程 ${player.range}`);
  const foot = `<div class="mini">${footParts.join(' · ')}</div>`;

  statsEl.innerHTML = `${badgeRow}${renderAbilityAllocator()}`;
  if (footEl) footEl.innerHTML = foot;
  statsEl.querySelectorAll('[data-alloc]').forEach(btn => {
    btn.onclick = () => allocateAbilityPoint(btn.dataset.alloc);
  });
}

function allocateAbilityPoint(abilityKey) {
  if (phase !== 'planning' && phase !== 'levelclear') return;
  if (playerStats.abilityPoints <= 0) return;
  if (playerStats.abilities[abilityKey] >= ABILITY_CAP) return;
  playerStats.abilities[abilityKey] += 1;
  playerStats.abilityPoints -= 1;
  const oldMaxHp = playerStats.maxHp;
  recomputePlayerDerivedStats();
  const diff = playerStats.maxHp - oldMaxHp;
  if (diff > 0) {
    playerStats.currentHp += diff;
    if (player && player.alive) player.hp += diff;
  } else if (diff < 0) {
    playerStats.currentHp = Math.min(playerStats.currentHp, playerStats.maxHp);
    if (player && player.alive) player.hp = Math.min(player.hp, playerStats.maxHp);
  }
  if (player) {
    player.maxHp = playerStats.maxHp;
    player.move = playerStats.move;
    player.meleeDmg = playerStats.meleeDmg;
    player.rangedDmg = playerStats.rangedDmg;
    player.visibleSteps = playerStats.visibleSteps;
    player.abilities = playerStats.abilities;
    player.ac = playerStats.ac;
    player.prof = playerStats.prof;
    player.meleeProf = playerStats.meleeProf;
    player.rangedProf = playerStats.rangedProf;
  }
  refreshBoardOnly();
}

function updateStartBtn() {
  if (phase !== 'planning') return;
  const btn = controlsEl.querySelector('.start-btn');
  if (btn) btn.disabled = playerPath.length === 0;
}

function renderControls() {
  controlsEl.innerHTML = '';
  if (phase === 'planning') {
    const confirm = document.createElement('button');
    confirm.className = 'start-btn';
    confirm.textContent = '⚔️ 开始行动';
    confirm.disabled = playerPath.length === 0;
    confirm.onclick = confirmAction;
    controlsEl.appendChild(confirm);
    const tip = document.createElement('div');
    tip.style.cssText = 'font-size:12px; color:#888; text-align:center; padding:2px; line-height:1.35; white-space:pre-wrap;';
    const isMobile = window.innerWidth <= 760;
    tip.textContent = isMobile
      ? '点击移动 · 点卡面「步数」等待 · 「攻击」切攻击 · 点伤害看范围\n长按地块也可追加等待 · 空格确认 · X 重置路径'
      : 'WASD/点击移动 · E 攻击 · Q 等待 · 空格确认\n点卡面「步数」=等待 · 「攻击」=攻击节点 · 点伤害=显示攻击范围\n长按追加等待 · 点击路径节点切换攻击 · X 重置路径 · F12 调试模式';
    controlsEl.appendChild(tip);
  } else if (phase === 'gameover') {
    const btn = document.createElement('button');
    btn.textContent = '重新开始';
    btn.onclick = () => initCharSelect();
    controlsEl.appendChild(btn);
  } else if (phase === 'levelclear') {
    const tip = document.createElement('div');
    tip.style.cssText = 'font-size:13px; color:#ffd700; text-align:center; padding:4px;';
    if (levelUpPending) {
      tip.textContent = '升级！请选择一项奖励…';
    } else if (playerStats.abilityPoints > 0) {
      tip.textContent = `请点击左侧六维图分配完属性点（剩余 ${playerStats.abilityPoints}）`;
    } else {
      tip.textContent = '关卡通过！即将进入下一关…';
    }
    controlsEl.appendChild(tip);
    // 未选奖励前不显示下一关按钮；选完奖励后若还有属性点，按钮禁用直到加完
    if (!levelUpPending) {
      const btn = document.createElement('button');
      btn.className = 'start-btn';
      if (playerStats.abilityPoints > 0) {
        btn.textContent = '⬇️ 下一关（先把属性点加完）';
        btn.disabled = true;
      } else {
        btn.textContent = '⬇️ 下一关';
        btn.onclick = proceedNextLevel;
      }
      controlsEl.appendChild(btn);
    } else {
      // 保险：定时器万一被清掉，也不会卡在通关界面
      setTimeout(() => openLevelUp(), 400);
    }
  }
  controlsEl.dataset.phase = phase;
}

function syncControlsIfNeeded() {
  if (controlsEl.dataset.phase !== phase) {
    renderControls();
    return;
  }
  if (phase === 'planning') updateStartBtn();
}

function render(skipControls = false) {
  if (phase === 'planning') {
    const sig = calcPathSignature();
    if (sig !== lastPathSignature) generateEnemyPaths();
  }
  const bbox = getBoundingBox();
  const bc = bbox.maxX - bbox.minX + 1;
  updateStats();
  boardEl.style.gridTemplateColumns = `repeat(${bc}, var(--cell))`;
  boardEl.innerHTML = buildBoardHtml();
  renderUnits();
  if (phase === 'planning') showEnemyFirstStepArrows();
  else clearEnemyArrows();
  if (skipControls) return;
  renderControls();
}

function refreshBoardOnly() {
  if (phase === 'planning') {
    const sig = calcPathSignature();
    if (sig !== lastPathSignature) generateEnemyPaths();
  }
  updateStats();
  boardEl.innerHTML = buildBoardHtml();
  renderUnits();
  if (phase === 'planning') {
    showEnemyFirstStepArrows();
  } else {
    clearEnemyArrows();
  }
  syncControlsIfNeeded();
}

async function moveCandidate(path) {
  isMoving = true;
  for (const p of path) {
    selectedCandidate.x = p.x;
    selectedCandidate.y = p.y;
    refreshBoardOnly();
    await sleep(120);
  }
  isMoving = false;
  if (selectedCandidate.x === selExit.x && selectedCandidate.y === selExit.y) {
    log(`你选择了 ${CHARACTERS[selectedCandidate.id].name}！进入关卡。`);
    await sleep(400);
    selectCharacter(selectedCandidate.id);
  }
}

function handleKeyDown(e) {
  const k = e.key.toLowerCase();
  const isSpace = e.code === 'Space' || k === ' ';
  // 调试模式：只认 F12（没有按钮入口），任何阶段都能切
  if (e.key === 'F12' || e.code === 'F12') {
    e.preventDefault();
    debugMode = !debugMode;
    log(debugMode ? '[调试] 已开启：点击敌人直接击杀，玩家不掉血。' : '[调试] 已关闭。');
    render();
    return;
  }
  if (['w','a','s','d','e','q','x'].includes(k) || isSpace) e.preventDefault();
  if (isMoving) return;
  if (phase === 'char_select') {
    if (selectedCandidate && ['w','a','s','d'].includes(k)) {
      const dirs = { 'w': {dx:0, dy:-1}, 's': {dx:0, dy:1}, 'a': {dx:-1, dy:0}, 'd': {dx:1, dy:0} };
      const dir = dirs[k];
      const nx = selectedCandidate.x + dir.dx, ny = selectedCandidate.y + dir.dy;
      if (isWalkable(nx, ny) && !charCandidates.some(c => c !== selectedCandidate && c.x === nx && c.y === ny)) moveCandidate([{x: nx, y: ny}]);
    }
    return;
  }
  if (phase !== 'planning') return;
  if (['w','a','s','d'].includes(k)) {
    const dirs = { 'w': {dx:0, dy:-1}, 's': {dx:0, dy:1}, 'a': {dx:-1, dy:0}, 'd': {dx:1, dy:0} };
    const dir = dirs[k];
    const last = playerPath.length ? playerPath[playerPath.length - 1] : { x: player.x, y: player.y };
    const nx = last.x + dir.dx, ny = last.y + dir.dy;
    const idx = findLastIndex(playerPath, p => p.x === nx && p.y === ny);
    if (idx >= 0) {
      if (idx === 0 && playerPath.length > 1) return;
      if (idx < playerPath.length - 1) {
        playerPath = playerPath.slice(0, idx + 1);
        attackIndices = attackIndices.filter(i => i < playerPath.length);
        refreshBoardOnly();
      }
      return;
    }
    if (countMoveSteps(playerPath) < player.move && isWalkable(nx, ny) && !(nx === player.x && ny === player.y)) {
      playerPath.push({ x: nx, y: ny });
      refreshBoardOnly();
    }
  }
  if (k === 'q') {
    if (countWaitSteps(playerPath) < player.move) {
      const last = playerPath.length ? playerPath[playerPath.length - 1] : { x: player.x, y: player.y };
      playerPath.push({ x: last.x, y: last.y });
      refreshBoardOnly();
    }
  }
  if (k === 'e') {
    if (playerPath.length > 0) { toggleAttack(playerPath.length - 1); refreshBoardOnly(); }
  }
  // X：重置路径（回到起点，清空攻击节点）
  if (k === 'x') {
    if (playerPath.length > 1 || attackIndices.length > 0) {
      playerPath = [{ x: player.x, y: player.y }];
      attackIndices = [];
      refreshBoardOnly();
    }
  }
  if (isSpace) {
    if (playerPath.length > 0) confirmAction();
  }
}
document.addEventListener('keydown', handleKeyDown);

let dragging = false, dragDownCell = null, hasDragged = false, pressTimer = null;

function getCellFromEvent(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY);
  if (!el) return null;
  const cell = el.closest('.cell');
  if (!cell || !boardEl.contains(cell)) return null;
  if (cell.classList.contains('void')) return null;
  const x = parseInt(cell.dataset.x, 10), y = parseInt(cell.dataset.y, 10);
  if (isNaN(x) || isNaN(y)) return null;
  return { x, y };
}

function toggleAttack(idx) {
  if (idx < 0) return;
  if (selectedChar === 'fencer' && fencerCounterActive) {
    log('反击状态不能设置攻击节点。');
    return;
  }
  if (selectedChar === 'wheelchair' && playerChargingThisTurn) {
    log('冲锋中不能设置攻击节点（冲锋会自动撞击前方敌人）。');
    return;
  }
  const ai = attackIndices.indexOf(idx);
  if (ai >= 0) attackIndices.splice(ai, 1);
  else if (attackIndices.length < 1 + player.extraAttacks) attackIndices.push(idx);
}
function tryExtendPath(x, y) {
  if (countMoveSteps(playerPath) >= player.move) return false;
  const last = playerPath.length ? playerPath[playerPath.length - 1] : { x: player.x, y: player.y };
  if (dist(last, { x, y }) !== 1) return false;
  if (x === player.x && y === player.y) return false;
  playerPath.push({ x, y });
  return true;
}
function handleCellDrag(x, y) {
  if (!isWalkable(x, y)) return;
  if (x === player.x && y === player.y) return;
  const idx = findLastIndex(playerPath, p => p.x === x && p.y === y);
  if (idx >= 0) {
    if (idx === 0 && playerPath.length > 1) return;
    if (idx < playerPath.length - 1) {
      playerPath = playerPath.slice(0, idx + 1);
      attackIndices = attackIndices.filter(i => i < playerPath.length);
      refreshBoardOnly();
    }
    return;
  }
  if (tryExtendPath(x, y)) refreshBoardOnly();
}
function killEnemyByDebug(enemy) {
  enemy.hp = 0; enemy.alive = false;
  ringFx(enemy.x, enemy.y, '#ffcc00');
  floatText(enemy.x, enemy.y, 'DEBUG KILL', '#ffcc00');
  log(`[调试] 击杀敌人${enemy.id + 1}`);
  if (selectedChar === 'amiya') amiyaGainKillBonus();
  render();
  if (enemies.filter(e => e.alive).length === 0) onLevelClear();
}

document.addEventListener('pointerdown', (e) => {
  if (phase !== 'planning' || isMoving) return;
  if (e.target.closest('button') || e.target.closest('#heroKv') || e.target.closest('#logToggle') || e.target.closest('#logClose') || e.target.closest('#logPanel')) return;
  const cell = getCellFromEvent(e.clientX, e.clientY);
  if (!cell) {
    playerPath = [{ x: player.x, y: player.y }];
    attackIndices = [];
    refreshBoardOnly();
  }
});

boardEl.addEventListener('pointerdown', (e) => {
  if (isMoving) return;
  const cell = getCellFromEvent(e.clientX, e.clientY);
  if (!cell) return;
  if (phase === 'char_select') {
    const cand = charCandidates.find(c => c.x === cell.x && c.y === cell.y);
    if (cand) { selectedCandidate = cand; render(); e.preventDefault(); return; }
    if (selectedCandidate) {
      if (cell.x === selectedCandidate.x && cell.y === selectedCandidate.y) return;
      const path = findPath(selectedCandidate.x, selectedCandidate.y, cell.x, cell.y);
      if (path && path.length > 0) moveCandidate(path);
    }
    e.preventDefault();
    return;
  }
  if (phase !== 'planning') return;
  if (debugMode) {
    const enemy = enemies.find(en => en.alive && en.x === cell.x && en.y === cell.y);
    if (enemy) { killEnemyByDebug(enemy); e.preventDefault(); return; }
  }
  dragging = true; dragDownCell = cell; hasDragged = false;
  try { boardEl.setPointerCapture(e.pointerId); } catch (_) {}
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    if (dragging && !hasDragged && phase === 'planning') {
      if (countWaitSteps(playerPath) < player.move) {
        const last = playerPath.length ? playerPath[playerPath.length - 1] : { x: player.x, y: player.y };
        playerPath.push({ x: last.x, y: last.y });
        refreshBoardOnly();
        hasDragged = true;
      }
    }
  }, 400);
  e.preventDefault();
}, { passive: false });

boardEl.addEventListener('pointermove', (e) => {
  if (!dragging || phase !== 'planning') return;
  const cell = getCellFromEvent(e.clientX, e.clientY);
  if (!cell) return;
  if (dragDownCell && cell.x === dragDownCell.x && cell.y === dragDownCell.y) return;
  hasDragged = true;
  clearTimeout(pressTimer);
  handleCellDrag(cell.x, cell.y);
  e.preventDefault();
}, { passive: false });

boardEl.addEventListener('pointerup', (e) => {
  clearTimeout(pressTimer);
  if (!dragging) return;
  dragging = false;
  if (!hasDragged && dragDownCell && phase === 'planning') {
    const x = dragDownCell.x, y = dragDownCell.y;
    const idx = findLastIndex(playerPath, p => p.x === x && p.y === y);
    if (idx >= 0) { toggleAttack(idx); refreshBoardOnly(); }
    else if (isWalkable(x, y) && !(x === player.x && y === player.y)) {
      const last = playerPath.length ? playerPath[playerPath.length - 1] : { x: player.x, y: player.y };
      if (dist(last, {x, y}) > 1) {
        const maxSteps = player.move - countMoveSteps(playerPath);
        if (maxSteps > 0) {
          const path = findPath(last.x, last.y, x, y, maxSteps);
          if (path) { for (const p of path) { if (countMoveSteps(playerPath) < player.move) playerPath.push(p); } refreshBoardOnly(); }
        }
      } else {
        if (countMoveSteps(playerPath) < player.move) { playerPath.push({ x, y }); refreshBoardOnly(); }
      }
    }
  }
  dragDownCell = null; hasDragged = false;
  try { boardEl.releasePointerCapture(e.pointerId); } catch (_) {}
});

boardEl.addEventListener('pointercancel', () => {
  clearTimeout(pressTimer);
  dragging = false; dragDownCell = null; hasDragged = false;
});

function confirmAction() {
  phase = 'resolving';
  playerChargingThisTurn = false;
  playerAttacksDone = 0;
  pendingAttack = false;
  pendingChargeInfo = null;
  pendingCounterInfo = null;
  amiyaBurstPlan = null;
  amiyaBurstDone = false;
  clearEnemyArrows();
  playerChargeStopReason = null;
  playerChargeCausedDamage = false;

  if (attackIndices.includes(0)) {
    pendingAttack = true;
  }

  if (selectedChar === 'amiya' && amiyaBonusTargets > 0) {
    /* 倾泻触发：路径里「等待」（同格重复的那一步）上放了攻击节点 → 该节点变成倾泻射击 */
    const burstIdx = amiyaBurstAttackIndex(playerPath, amiyaBonusTargets);
    if (burstIdx !== null) {
      amiyaBurstPlan = { triggerIdx: burstIdx };
      attackIndices = attackIndices.filter(i => i !== burstIdx);  // 该节点改为倾泻，不再单独射击
      log(`阿米娅「精神爆发」：第 ${burstIdx} 步（等待后接攻击 👑）将倾泻 ${amiyaBonusTargets} 点技力，进行连续远程攻击！`);
      floatText(playerPath[burstIdx].x, playerPath[burstIdx].y, '精神爆发', '#ffd700');
    } else if (countWaitSteps(playerPath) > 0) {
      log('阿米娅：在「等待」的那一格放一个攻击节点才能发动「精神爆发」（显示为 👑）。');
    }
  }

  if (selectedChar === 'vampire') {
    if (!vampireSkillActive && vampireSp >= VAMPIRE_SP_MAX && attackIndices.includes(0)) {
      vampireSkillActive = true;
      vampireSp = 0;
      log('华法琳发动技能「不稳定血浆」：本关内远程攻击必定命中、必定暴击、必定留血迹，但每次攻击后自身失去 1 HP（技力清零）。');
      floatText(player.x, player.y, '不稳定血浆', '#ff6b6b');
      ringFx(player.x, player.y, '#ff6b6b');
    } else if (!vampireSkillActive && vampireSp >= VAMPIRE_SP_MAX) {
      log('华法琳技力已满：在起始点（第 0 步）放一个攻击节点即可发动「不稳定血浆」。');
    }
  }

  if (selectedChar === 'wheelchair') {
    /* 1) 结算本回合直线移动获得的技力（等待/转向会断开一段） */
    const gain = pathSpGain(playerPath);
    if (gain > 0) {
      const sass = sassExtraSp();
      const before = wheelchairSp;
      wheelchairSp = Math.min(WHEELCHAIR_SP_MAX, wheelchairSp + gain + sass);
      log(`风笛直线移动 ${gain} 步：技力 +${gain + sass}（${before} → ${wheelchairSp}/${WHEELCHAIR_SP_MAX}）${sass ? '　🥤 香草沙士 +1' : ''}`);
      if (before < WHEELCHAIR_SP_MAX && wheelchairSp >= WHEELCHAIR_SP_MAX) {
        log('风笛技力已满：路径里的攻击节点将变为「高效冲击」！');
      }
    }
    /* 2) 技力满 5 → 第一个攻击节点变成冲锋触发点（沿当前朝向直线冲到底，消耗全部技力） */
    const chargeIdx = findChargeAttackIndex(playerPath, wheelchairSp);
    if (chargeIdx !== null) {
      const fromPos = playerPath[chargeIdx - 1];
      const toPos = playerPath[chargeIdx];
      const trigger = { endIdx: chargeIdx, dir: { dx: Math.sign(toPos.x - fromPos.x), dy: Math.sign(toPos.y - fromPos.y) } };
      const { chargePath, stopReason } = computeStraightChargePath(playerPath, trigger);
      if (chargePath.length > 0) {
        playerPath = [...playerPath.slice(0, chargeIdx + 1), ...chargePath];
        attackIndices = attackIndices.filter(idx => idx < chargeIdx);
        pendingChargeInfo = { startIdx: chargeIdx + 1 };
        playerChargeStopReason = stopReason;
        playerChargeCausedDamage = false;
        wheelchairSp = 0;   // 冲锋消耗全部技力
        log(`风笛发动「高效冲击」！技力清零，从第 ${chargeIdx} 步后沿直线冲锋 ${chargePath.length} 步（停止：${stopReason}）。冲锋期间免疫所有伤害（除撞墙），禁用攻击节点与趁乱攻击。`);
        floatText(playerPath[chargeIdx].x, playerPath[chargeIdx].y, '高效冲击', '#ffd700');
        ringFx(playerPath[chargeIdx].x, playerPath[chargeIdx].y, '#ffd700');
      } else {
        log('「高效冲击」无法发动：攻击节点正前方就是墙（技力保留）。');
      }
    } else if (wheelchairSp >= WHEELCHAIR_SP_MAX) {
      log('风笛技力已满：在路径里规划一个攻击节点即可发动「高效冲击」。');
    }
  }
  if (selectedChar === 'fencer') {
    const activateIdx = findFirstDoubleWaitIndex(playerPath);
    if (activateIdx > 0) {
      if (fencerSp >= FENCER_SP_MAX) {
        pendingCounterInfo = { activateIdx };
        log('泥岩路径中包含连续等待，将在第二次等待完成后进入反击状态！');
      } else {
        fencerCounterActive = false;
        pendingCounterInfo = null;
        log(`泥岩技力不足（${fencerSp}/${FENCER_SP_MAX}）：反击「岩崩锤」需要技力满 ${FENCER_SP_MAX} 才能使用（每次受击 +1）。`);
      }
    } else {
      fencerCounterActive = false;
      pendingCounterInfo = null;
    }
  }
  render();
  setTimeout(() => resolveStep(1, 0), 300);
}

/* =========================================================
 * 通用 BFS（用于敌人寻路）
 * ========================================================= */
// 玩家规划路径去掉连续重复格，并保留每个位置对应的 tick（结算步序号）。
// 保留 tick 是关键：带等待步时「去重后的序号」和「tick」不是一回事，
// 混用会让敌人先冲过头、再折返回来（旧版实战里出现过 12,4 → 11,4 → 12,4）。
function getPlayerEffectivePositions() {
  const positions = [];
  for (let i = 0; i < playerPath.length; i++) {
    const p = playerPath[i];
    const last = positions[positions.length - 1];
    if (!last || last.x !== p.x || last.y !== p.y) {
      positions.push({ x: p.x, y: p.y, tick: i });
    }
  }
  if (positions.length === 0 && player) {
    positions.push({ x: player.x, y: player.y, tick: 0 });
  }
  return positions;
}

// 攻击欲望越高，越倾向于提前堵在玩家路径的更靠后处。
// 用确定性取整（不用 Math.random）：否则玩家每画一格、每次重绘都会重掷目标，
// 敌人意图箭头会不停抖动，「意图可预判」这个核心体验就没了。
// 当前回合下的攻击欲望：基础 wis + 每 2 回合 +1 感知的时间加成，再乘全局系数
function enemyAggression(wis) {
  const base = (wis === undefined || wis === null) ? 10 : wis;
  const aggrWis = base + Math.floor(battleRound / 2) * AGGRESSION_WIS_PER_TWO_ROUNDS;
  return Math.max(0, Math.min(1, aggrWis / 20)) * ENEMY_AGGRESSION_SCALE;
}

function sampleAggressionTargetIndex(n, p) {
  if (n <= 1) return 0;
  const raw = (n - 1) * Math.max(0, Math.min(1, p));
  return Math.max(0, Math.min(n - 1, Math.round(raw)));
}

// 选预判目标：按攻击欲望取索引，但只能取「本回合来得及走到」的位置
// （tick 超过自身移动力的点没有意义，BFS 够不到只会退化成最近的格子）。
function pickEnemyTarget(positions, aggression, move) {
  let idx = sampleAggressionTargetIndex(positions.length, aggression);
  while (idx > 0 && positions[idx].tick > move) idx--;
  return positions[idx];
}

function buildPathFromPrev(prev, endX, endY) {
  const path = [];
  let curX = endX, curY = endY;
  while (true) {
    path.push({ x: curX, y: curY });
    const p = prev.get(key(curX, curY));
    if (p === null || p === undefined) break;
    curX = p.x; curY = p.y;
  }
  path.reverse();
  return path;
}

// 通用 BFS：目标不可达时返回最近可达点
function bfsPathTo(startX, startY, targetX, targetY, maxSteps, isOccupiedAtFn, isGhost, startT) {
  if (startT === undefined) startT = 0;
  if (startX === targetX && startY === targetY) {
    return [{ x: startX, y: startY }];
  }
  const prev = new Map();
  prev.set(key(startX, startY), null);
  const q = [{ x: startX, y: startY, t: 0, d: Math.abs(startX - targetX) + Math.abs(startY - targetY) }];
  let best = { x: startX, y: startY, t: 0, d: q[0].d };
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  // ★ 修复「敌人永远不靠近」：原来 BFS 只展开 maxSteps 步，且 best 只按「曼哈顿距离更近」更新。
  //   遇到必须绕路的地形（例如玩家上方/侧面是墙），绕路第一步必然离目标更远 →
  //   best 永远停在起点 → 返回只有起点的路径 → 敌人原地站桩、永远不去玩家位置。
  //   现在改成：全图 BFS 找真实最短路径，只把「本回合能走的步数」截断，
  //   余下的下回合接着走；确实不可达（目标被墙完全封死）才退回最近可达点。
  const LIMIT = 400;
  while (q.length > 0) {
    const cur = q.shift();
    if (cur.d < best.d) best = cur;
    if (cur.x === targetX && cur.y === targetY) {
      const full = buildPathFromPrev(prev, cur.x, cur.y);
      return full.length > maxSteps + 1 ? full.slice(0, maxSteps + 1) : full;
    }
    if (cur.t >= LIMIT) continue;
    for (const [dx, dy] of dirs) {
      const nx = cur.x + dx, ny = cur.y + dy;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      if (isGhost) {
        // 幽灵：内部区域移动，无视墙
        if (nx === 0 || nx === COLS - 1 || ny === 0 || ny === ROWS - 1) continue;
      } else {
        if (map[ny][nx] === 1) continue;
      }
      const nk = key(nx, ny);
      if (prev.has(nk)) continue;
      if (isOccupiedAtFn && isOccupiedAtFn(startT + cur.t + 1, nx, ny)) continue;
      prev.set(nk, cur);
      q.push({ x: nx, y: ny, t: cur.t + 1, d: Math.abs(nx - targetX) + Math.abs(ny - targetY) });
    }
  }
  return buildPathFromPrev(prev, best.x, best.y);
}

function generateEnemyPaths() {
  if (phase !== 'planning') return;
  enemyPaths = [];
  for (let i = 0; i < enemies.length; i++) enemyPaths.push([]);

  const playerPositions = getPlayerEffectivePositions();
  const aliveList = enemies.filter(e => e.alive);
  if (!aliveList.length || playerPositions.length === 0) {
    for (const e of enemies) if (e.alive) enemyPaths[enemies.indexOf(e)] = [{ x: e.x, y: e.y }];
    lastPathSignature = calcPathSignature();
    return;
  }

  // 占位表 occ[t] = 第 t 个 tick 结束时被占用的格子。
  // 关键修复：还没轮到的敌人先按「原地不动」把所有 tick 都预留住。
  // 旧版只预留 t=0，第一个 tick 却去查 t=1，于是计划层允许踩同伴、结算层 occNow 又拦下来，
  // 路径被 slice 截断 → 窄走廊里幽灵被前方骷髅永久堵死（实测 25 回合零进展）。
  const maxT = Math.max(...aliveList.map(e => e.move)) + 1;
  const occ = [];
  for (let t = 0; t <= maxT; t++) occ.push(new Set());
  for (const e of aliveList) {
    for (let t = 0; t <= maxT; t++) occ[t].add(key(e.x, e.y));
  }
  const isOccupiedAt = (t, x, y) => !!occ[t] && occ[t].has(key(x, y));

  // 离玩家近的敌人先算，占路优先级更高。
  // 旧版按数组顺序算，0 号敌人永远优先，容易出现「后排先占位、前排动不了」。
  const order = aliveList.slice().sort((a, b) =>
    (Math.abs(a.x - player.x) + Math.abs(a.y - player.y)) -
    (Math.abs(b.x - player.x) + Math.abs(b.y - player.y)));
  // 记下来给结算层用，保证两边顺序完全一致
  enemyPathOrder = order.map(e => enemies.indexOf(e));

  for (const e of order) {
    const idx = enemies.indexOf(e);
    if (e.stunTurns > 0) { enemyPaths[idx] = [{ x: e.x, y: e.y }]; continue; }

    // 轮到它了：解除自己的静态预留，后面按真实路径重新占位
    for (let t = 0; t <= maxT; t++) occ[t].delete(key(e.x, e.y));

    const ghost = e.type === 'ghost';
    const wis = e.abilities.wis || 10;
    // 攻击欲望 = (基础 wis + 回合加成)/20，再乘全局系数（见 ENEMY_AGGRESSION_SCALE）。
    // 拖回合会让敌人越来越激进，20 回合后 10 感知的敌人就到顶。
    const aggression = enemyAggression(wis);
    // ★ 预判：目标取玩家路径上更靠后的位置（WIS 越高越靠后）
    let target = pickEnemyTarget(playerPositions, aggression, e.move);
    // ★ 补丁：角色周围 8 格（切比雪夫距离 ≤1）内的敌人，寻路目标固定为角色所在格，
    // 不会再预判到玩家路径末端、也不会随重绘改变。
    if (Math.abs(e.x - player.x) <= 1 && Math.abs(e.y - player.y) <= 1) {
      target = { x: player.x, y: player.y, tick: 0 };
    }

    // BFS 得到的是简单路径（每格只访问一次），所以不会再出现「冲过去又退回来」。
    // 旧版这里还有一段「到达目标后追玩家实际位置」，那段会从目标点折返，
    // 实测 500 局面里 24 次出现 A→B→A 的来回抖动，已移除：
    // 敌人提前到达预判点后原地待命，玩家自己会走进来（这本身就是最好的拦截）。
    let path = bfsPathTo(e.x, e.y, target.x, target.y, e.move, isOccupiedAt, ghost, 0);

    // ★ 反罚站补丁：同伴占位可能把窄口/凹槽里的敌人完全堵死（BFS 一步都扩展不出去、返回原地），
    // 且每回合重算结果相同 → 敌人永久罚站（实测外星人距离玩家 5 格、几何可达，连站 11 回合不动）。
    // 此时忽略同伴占位重算一次：宁可让它在结算层贴着同伴排队（taken 拦截重叠、同伴挪开即跟进），
    // 也不要原地站死。目标本来就是自己格（真没路可走）的不算堵塞。
    const targetIsSelf = target.x === e.x && target.y === e.y;
    if (path.length <= 1 && !targetIsSelf) {
      path = bfsPathTo(e.x, e.y, target.x, target.y, e.move, null, ghost, 0);
    }

    // 路径上如果某一 tick 正好落在「玩家在该 tick 的位置」，就是贴脸/相杀，
    // 结算层会走相杀分支、不落位，敌人实际停在它的前一格。
    // 占位也要按这个来算，否则同伴会误判那格是空的，每回合刷「移动受阻」。
    let stopTick = path.length;
    for (let t = 1; t < path.length; t++) {
      const pp = t < playerPath.length ? playerPath[t] : playerPath[playerPath.length - 1];
      if (path[t].x === pp.x && path[t].y === pp.y) { stopTick = t; break; }
    }
    const lastIdx = path.length - 1;
    for (let t = 0; t < path.length; t++) {
      const c = path[Math.min(t, stopTick - 1)];
      if (occ[t]) occ[t].add(key(c.x, c.y));
    }
    // 路径走完后原地待命，剩下的 tick 继续占住落脚点
    const tail = path[Math.min(lastIdx, stopTick - 1)];
    for (let t = path.length; t <= maxT; t++) occ[t].add(key(tail.x, tail.y));

    enemyPaths[idx] = path;
  }

  lastPathSignature = calcPathSignature();
}

function clearItemCell(x, y) {
  const cell = getCellEl(x, y);
  if (cell) {
    cell.classList.remove('item-cell', 'blood-cell');
    if (cell.textContent.includes('❤️') || cell.textContent.includes('🩸')) {
      cell.innerHTML = '';
    }
  }
}

/* 在指定格留下血迹（同一格只留一处） */
function addBloodAt(x, y) {
  if (bloodDrops.some(b => b.x === x && b.y === y)) return false;
  bloodDrops.push({ x, y });
  log('华法琳的攻击留下了血迹 🩸！');
  return true;
}

function tryPickup() {
  const rIdx = rewardItems.findIndex(r => r.x === player.x && r.y === player.y);
  if (rIdx >= 0) {
    const heal = Math.min(player.maxHp - player.hp, 3);
    if (heal > 0) {
      player.hp += heal;
      floatText(player.x, player.y, `+${heal} HP`, '#2ecc71');
      log(`拾取恢复道具 ❤️，恢复 ${heal} HP！`);
    } else {
      log(`拾取恢复道具 ❤️，但血量已满`);
    }
    rewardItems.splice(rIdx, 1);
    clearItemCell(player.x, player.y);
  }
  const bIdx = bloodDrops.findIndex(b => b.x === player.x && b.y === player.y);
  if (bIdx >= 0) {
    if (selectedChar === 'vampire') {
      /* 华法琳：血迹 = 1 技力 + 2 HP */
      const heal = Math.min(player.maxHp - player.hp, 2);
      if (heal > 0) { player.hp += heal; floatText(player.x, player.y, `+${heal} HP`, '#ff6b6b'); }
      const spBefore = vampireSp;
      const sass = sassExtraSp();
      vampireSp = Math.min(VAMPIRE_SP_MAX, vampireSp + 1 + sass);
      const spGain = vampireSp - spBefore;
      if (spGain > 0) floatText(player.x, player.y, `+${spGain} SP`, '#5cc9f5', false, -22);
      log(`拾取血迹 🩸：技力 +${spGain}（${vampireSp}/${VAMPIRE_SP_MAX}）${sass ? '　🥤 香草沙士 +1' : ''}，${heal > 0 ? `恢复 ${heal} HP` : '血量已满无回血'}。`);
      if (spBefore < VAMPIRE_SP_MAX && vampireSp >= VAMPIRE_SP_MAX) {
        log('华法琳技力已满：在起始点（第 0 步）放攻击节点即可发动「不稳定血浆」。');
      }
    } else {
      const heal = Math.min(player.maxHp - player.hp, 1);
      if (heal > 0) {
        player.hp += heal;
        floatText(player.x, player.y, `+${heal} HP`, '#ff6b6b');
        log(`拾取血迹 🩸，恢复 ${heal} HP！`);
      }
    }
    bloodDrops.splice(bIdx, 1);
    clearItemCell(player.x, player.y);
  }
}

async function resolveStep(pIdxIn, eIdx) {
  let pIdx = pIdxIn;
  if (phase !== 'resolving') return;
  if (!player.alive || player.hp <= 0) { phase = 'gameover'; clearEnemyArrows(); log('你死了。游戏结束。'); render(); return; }
  if (enemies.filter(e => e.alive).length === 0) { clearEnemyArrows(); onLevelClear(); return; }

  if (selectedChar === 'amiya' && amiyaBurstPlan && !amiyaBurstDone && player.alive && player.hp > 0) {
    const plan = amiyaBurstPlan;
    const trigPos = playerPath[plan.triggerIdx];
    const atTrigger = trigPos && player.x === trigPos.x && player.y === trigPos.y;
    if (atTrigger && pIdx >= plan.triggerIdx) {
      amiyaBurstDone = true;
      amiyaBurstPlan = null;
      const count = amiyaBonusTargets;
      amiyaBonusTargets = 0;
      log(`阿米娅发动「精神爆发」！倾泻 ${count} 点技力，进行连续远程攻击！`);
      floatText(player.x, player.y, '精神爆发！', '#ffd700');
      ringFx(player.x, player.y, '#ffd700');
      await executeAmiyaBurst(count);
      if (player.hp <= 0) {
        player.alive = false;
        phase = 'gameover';
        clearEnemyArrows();
        log('你死了。游戏结束。');
        render();
        return;
      }
      if (enemies.filter(e => e.alive).length === 0) {
        render();
        await sleep(300);
        onLevelClear();
        return;
      }
    }
  }

  const enemyMoves = [];
  enemies.forEach((e, i) => {
    if (!e.alive) return;
    if (e.stunTurns > 0) return;
    const p = enemyPaths[i];
    if (p && eIdx + 1 < p.length) {
      enemyMoves.push({ unit: e, from: { x: e.x, y: e.y }, to: p[eIdx + 1], enemyIdx: i });
    }
  });

  const killedEnemyIds = new Set();
  let playerBlocked = false;
  let didAttackThisTick = false;
  let playerActionThisTick = false;

  if (pendingAttack) {
    pendingAttack = false;
    didAttackThisTick = true;
    playerActionThisTick = true;
  } else if (pIdx < playerPath.length) {
    playerActionThisTick = true;
    if (pendingChargeInfo && pIdx >= pendingChargeInfo.startIdx && !playerChargingThisTurn && player.alive) {
      playerChargingThisTurn = true;
      playerChargeCausedDamage = false;
      pendingChargeInfo = null;
      log('「高效冲击」：冲锋开始！');
      floatText(player.x, player.y, '高效冲击！', '#ffd700');
      ringFx(player.x, player.y, '#ffd700');
    }

    const pathIdx = pIdx;
    const targetPos = playerPath[pathIdx];
    const playerFrom = { x: player.x, y: player.y };

    const shootouts = [];
    for (const em of enemyMoves) {
      const isSwap = playerFrom.x === em.to.x && playerFrom.y === em.to.y &&
                     targetPos.x === em.from.x && targetPos.y === em.from.y;
      const isSameDest = targetPos.x === em.to.x && targetPos.y === em.to.y;
      if (isSwap || isSameDest) shootouts.push(em);
    }

    if (shootouts.length > 0) {
      const c1 = cellCenter(targetPos.x, targetPos.y);
      const c2 = cellCenter(playerFrom.x, playerFrom.y);
      floatTextAt((c1.x + c2.x) / 2, (c1.y + c2.y) / 2,
        '相杀！' + (shootouts.length > 1 ? '×' + shootouts.length : ''),
        '#ff4500', false, -6, 'crosskill');
      ringFx(targetPos.x, targetPos.y, '#ff4500');
      slashFx(targetPos.x, targetPos.y, '#ff4500');
      hitFlashCell(playerFrom.x, playerFrom.y);

      for (const em of shootouts) {
        const ex = em.unit.x, ey = em.unit.y;
        let pd = player.meleeDmg * 2;
        if (playerChargingThisTurn) pd *= 2;
        em.unit.hp -= pd;
        if (playerChargingThisTurn) playerChargeCausedDamage = true;
        if (selectedChar === 'amiya') amiyaMarkReveal(em.unit);
        floatText(ex, ey, '暴击 -' + pd, '#ffd700', true);
        log(`相杀！玩家对敌人${em.unit.id+1}造成暴击${pd}伤害`);
        if (em.unit.hp <= 0) {
          em.unit.alive = false;
          killedEnemyIds.add(em.enemyIdx);
          ringFx(ex, ey, '#ff6b6b');
          floatText(ex, ey, '击杀!', '#ff6b6b');
          log(`敌人${em.unit.id+1}被击败`);
          if (selectedChar === 'amiya') amiyaGainKillBonus();
        }
        em.unit.attackedThisRound = true;
      }
      gainFencerSp(shootouts.length);
      const counterImmune = selectedChar === 'fencer' && fencerCounterActive;
      let counterImmuneShown = false;
      let chargeImmuneShown = false;
      for (const em of shootouts) {
        let ed = em.unit.meleeDmg * 2;
        if (playerChargingThisTurn) {
          if (!chargeImmuneShown) {
            floatText(playerFrom.x, playerFrom.y, '冲锋免疫', '#ffd700');
            chargeImmuneShown = true;
          }
          log(`相杀！敌人${em.unit.id+1}对玩家造成暴击${ed}伤害，但风笛处于冲锋状态，免疫本次伤害。`);
          continue;
        }
        if (counterImmune) {
          if (!counterImmuneShown) {
            floatText(playerFrom.x, playerFrom.y, '反击免疫', '#ffd700');
            counterImmuneShown = true;
          }
          log(`相杀！敌人${em.unit.id+1}对玩家造成暴击${ed}伤害，但泥岩处于反击状态，免疫本次伤害。`);
          continue;
        }
        const dmgRes = damagePlayer(ed, '相杀');
        floatText(playerFrom.x, playerFrom.y,
          debugMode ? '无敌' : (dmgRes.shielded ? '护盾抵消' : '暴击 -' + ed),
          debugMode ? '#ffcc00' : (dmgRes.shielded ? '#ffffff' : '#ffd700'), !debugMode && !dmgRes.shielded);
        log(`相杀！敌人${em.unit.id+1}对玩家造成暴击${debugMode ? '（调试：无敌）' : (dmgRes.shielded ? '（护盾抵消）' : ' ' + ed + '伤害')}`);
      }
      if (shootouts.length > 0 && player.hp > 0) triggerFencerCounter();
      if (player.hp <= 0) {
        player.alive = false;
        phase = 'gameover';
        clearEnemyArrows();
        log('你在相杀中阵亡。游戏结束。');
        render();
        return;
      }
      const anySurvivor = shootouts.some(em => em.unit.alive);
      if (!anySurvivor) {
        const dx = Math.sign(targetPos.x - playerFrom.x);
        const dy = Math.sign(targetPos.y - playerFrom.y);
        player.x = targetPos.x; player.y = targetPos.y;
        if (dx || dy) player.facing = { dx, dy };
        if (attackIndices.includes(pathIdx)) {
          if (playerChargingThisTurn) didAttackThisTick = true;
          else pendingAttack = true;
        }
        tryPickup();
      } else {
        if (playerChargingThisTurn) log('冲锋相杀，但仍有敌人存活，冲锋停止。');
        playerBlocked = true;
      }
    } else {
      let blockingEnemy = null;
      for (const e of enemies) {
        if (!e.alive || killedEnemyIds.has(e.id)) continue;
        if (e.x !== targetPos.x || e.y !== targetPos.y) continue;
        const move = enemyMoves.find(em => em.enemyIdx === e.id);
        let willMoveAway = false;
        if (move && (move.to.x !== e.x || move.to.y !== e.y)) {
          const destBlocked = enemies.some(o =>
            o.alive && o.id !== e.id && o.x === move.to.x && o.y === move.to.y
          );
          willMoveAway = !destBlocked;
        }
        if (willMoveAway) continue;
        blockingEnemy = e;
        break;
      }
      if (blockingEnemy) {
        if (playerChargingThisTurn) {
          let dmg = player.meleeDmg * 2;
          blockingEnemy.hp -= dmg;
          playerChargeCausedDamage = true;
          slashFx(blockingEnemy.x, blockingEnemy.y, '#ffd700');
          ringFx(blockingEnemy.x, blockingEnemy.y, '#ff4500');
          hitFlashCell(blockingEnemy.x, blockingEnemy.y);
          floatText(blockingEnemy.x, blockingEnemy.y, '冲锋撞击 -' + dmg, '#ffd700', true);
          log(`冲锋撞击敌人${blockingEnemy.id+1}，造成${dmg}点伤害！`);
          if (blockingEnemy.hp <= 0) {
            blockingEnemy.alive = false;
            killedEnemyIds.add(blockingEnemy.id);
            floatText(blockingEnemy.x, blockingEnemy.y, '击杀!', '#ff6b6b');
            log(`敌人${blockingEnemy.id+1}被撞飞`);
            if (selectedChar === 'amiya') amiyaGainKillBonus();
            const dx = Math.sign(targetPos.x - playerFrom.x);
            const dy = Math.sign(targetPos.y - playerFrom.y);
            player.x = targetPos.x; player.y = targetPos.y;
            if (dx || dy) player.facing = { dx, dy };
            if (attackIndices.includes(pathIdx)) didAttackThisTick = true;
            tryPickup();
          } else {
            log(`冲锋撞击后敌人${blockingEnemy.id+1}未被击倒，冲锋停止。`);
            playerBlocked = true;
          }
        } else {
          log(`玩家被敌人${blockingEnemy.id + 1}挡住，停止移动`);
          if (attackIndices.includes(pathIdx)) {
            log(`⚔️ 路径被挡，攻击节点改为在当前位置触发。`);
            floatText(player.x, player.y, '原地攻击', '#ffd700');
            if (playerChargingThisTurn) didAttackThisTick = true;
            else pendingAttack = true;
          } else {
            floatText(targetPos.x, targetPos.y, '被挡', '#bbb');
          }
          playerBlocked = true;
        }
      } else {
        const dx = Math.sign(targetPos.x - playerFrom.x);
        const dy = Math.sign(targetPos.y - playerFrom.y);
        player.x = targetPos.x; player.y = targetPos.y;
        if (dx || dy) player.facing = { dx, dy };
        if (attackIndices.includes(pathIdx)) {
          if (playerChargingThisTurn) didAttackThisTick = true;
          else pendingAttack = true;
        }
        tryPickup();
      }
    }
    if (playerBlocked) pIdx = playerPath.length;
    else pIdx++;

    if (pendingCounterInfo && pathIdx >= pendingCounterInfo.activateIdx && !fencerCounterActive
        && fencerSp >= FENCER_SP_MAX) {
      fencerCounterActive = true;
      pendingCounterInfo = null;
      log('泥岩完成第二次等待，进入反击状态！（本回合禁止攻击节点）');
      floatText(player.x, player.y, '反击就绪！', '#ffd700');
      ringFx(player.x, player.y, '#ffd700');
    }
  }

  // 结算顺序 = 寻路顺序（离玩家近的优先）。
  // 规划层是「先算近的，远的先按原地不动预留」，结算层用同一顺序落位才能完全对上：
  // 「跟到刚腾出的格子」合法，「撞上还没走的同伴」仍被拦住。
  const taken = new Map();
  for (const e of enemies) if (e.alive) taken.set(key(e.x, e.y), e);

  const moveQueue = enemyMoves.slice().sort((a, b) => {
    const ia = enemyPathOrder.indexOf(a.enemyIdx);
    const ib = enemyPathOrder.indexOf(b.enemyIdx);
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
  });

  for (const em of moveQueue) {
    if (killedEnemyIds.has(em.enemyIdx)) { taken.delete(key(em.from.x, em.from.y)); continue; }
    if (!em.unit.alive) continue;
    if (em.unit.stunTurns > 0) continue;
    const u = em.unit;

    // 走到玩家身上 → 相杀（交给相杀逻辑处理，这里不落位，仍占自己的格）
    if (em.to.x === player.x && em.to.y === player.y) {
      u.facing = faceToward(u, player);
      if (enemyPaths[em.enemyIdx]) {
        enemyPaths[em.enemyIdx] = enemyPaths[em.enemyIdx].slice(0, eIdx + 1);
      }
      continue;
    }

    if (em.to.x === u.x && em.to.y === u.y) continue;

    // 关键：先把自己从占位表里拿掉，再查目标格。
    // 这样「跟到同伴本 tick 腾出的格子」是合法的；旧版反过来先查后放，
    // 结果窄走廊里幽灵被前方骷髅永久堵死（实测 4 回合全员冻结）。
    const destKey = key(em.to.x, em.to.y);
    taken.delete(key(u.x, u.y));
    if (taken.has(destKey)) {
      taken.set(key(u.x, u.y), u);   // 走不了，把格子放回去
      if (enemyPaths[em.enemyIdx]) {
        enemyPaths[em.enemyIdx] = enemyPaths[em.enemyIdx].slice(0, eIdx + 1);
      }
      log(`敌人${u.id + 1}移动受阻，停止前进`);
      continue;
    }

    u.x = em.to.x;
    u.y = em.to.y;
    taken.set(destKey, u);

    const dx = Math.sign(em.to.x - em.from.x);
    const dy = Math.sign(em.to.y - em.from.y);
    if (dx || dy) u.facing = { dx, dy };
  }

  refreshUnits();
  await sleep(UNIT_MOVE_MS);
  clearEnemyArrows();

  if (player.hp <= 0) { player.alive = false; phase = 'gameover'; log('你死了。游戏结束。'); render(); return; }
  if (enemies.filter(e => e.alive).length === 0) { render(); await sleep(300); onLevelClear(); return; }

  // ★ 外星人特殊攻击：只在「它已经停下的格子」开火。
  // 每个 tick 都判一次，但还在移动途中的外星人会被 resolveAlienShots 跳过，
  // 所以它必须走完本回合的落点才会开枪；此时冲锋 / 反击状态仍然有效，免疫能正常生效。
  await resolveAlienShots(eIdx);
  if (player.hp <= 0) { player.alive = false; phase = 'gameover'; clearEnemyArrows(); log('你死了。游戏结束。'); render(); return; }
  if (enemies.filter(e => e.alive).length === 0) { render(); await sleep(300); onLevelClear(); return; }

  if (didAttackThisTick && player.alive) {
    if (selectedChar === 'wheelchair' && playerChargingThisTurn) {
      log('冲锋状态禁止攻击节点，本次攻击取消。');
      floatText(player.x, player.y, '禁止攻击', '#bbb');
    } else if (selectedChar === 'fencer' && fencerCounterActive) {
      log('反击状态禁止攻击节点，本次攻击取消。');
      floatText(player.x, player.y, '禁止攻击', '#bbb');
    } else if (selectedChar === 'wheelchair' || selectedChar === 'fencer') {
      const maxAttacks = 1 + player.extraAttacks;
      if (playerAttacksDone < maxAttacks) {
        playerAttacksDone++;
        const targets = enemies.filter(e => e.alive && cheb(e, player) === 1);
        if (targets.length === 0) {
          log('近战范围攻击挥空，未命中任何敌人。');
          floatText(player.x, player.y, '挥空', '#bbb');
          refreshUnits();
          await sleep(200);
        } else {
          const strMod = abilityMod(player.abilities.str);
          for (const target of targets) {
            if (target.hp <= 0) continue;
            const atk = attackRoll(strMod, player.meleeProf || 0, target.ac);
            if (!atk.hit) {
              missFx(target.x, target.y);
              log(`近战范围攻击未命中敌人${target.id+1} (${fmtRoll(atk, target.ac)})`);
              refreshUnits();
              await sleep(120);
              continue;
            }
            let dmg = player.meleeDmg;
            if (selectedChar === 'wheelchair' && playerChargingThisTurn) dmg *= 2;
            let isCrit = atk.nat20;
            let critTag = atk.nat20 ? '自然20暴击' : '';
            if (!isCrit && isInFacingCone(player, target)) { isCrit = true; critTag = '朝向暴击'; }
            if (!isCrit && Math.random() < (selectedChar === 'fencer' ? player.critChance + 0.42 : player.critChance)) { isCrit = true; critTag = '暴击'; }
            if (isCrit) dmg *= 2;
            target.hp -= dmg;
            if (selectedChar === 'wheelchair' && playerChargingThisTurn) playerChargeCausedDamage = true;
            if (selectedChar === 'amiya') amiyaMarkReveal(target);
            slashFx(target.x, target.y, isCrit ? '#ffd700' : '#ffb86b');
            hitFlashCell(target.x, target.y);
            if (isCrit) {
              ringFx(target.x, target.y, '#ff4500');
              floatText(target.x, target.y, critTag + ' -' + dmg, '#ffd700', true);
              log(`近战范围${critTag}敌人${target.id+1}，造成${dmg}伤害 (${fmtRoll(atk, target.ac)})`);
            } else {
              ringFx(target.x, target.y, '#ffb86b');
              floatText(target.x, target.y, '-' + dmg, '#ff6b6b');
              log(`近战范围命中敌人${target.id+1}，造成${dmg}伤害 (${fmtRoll(atk, target.ac)})`);
            }
            if (target.hp <= 0) {
              target.alive = false;
              floatText(target.x, target.y, '击杀!', '#ff6b6b');
              log(`敌人${target.id+1}被击败`);
              if (selectedChar === 'amiya') amiyaGainKillBonus();
            }
            refreshUnits();
            await sleep(200);
          }
        }
      }
    } else {
      const maxAttacks = 1 + player.extraAttacks;
      if (playerChargingThisTurn) {
        log('冲锋中无法远程攻击。');
      } else {
        if (playerAttacksDone < maxAttacks) {
          const fromPos = { x: player.x, y: player.y, range: player.range };
          let targets = enemies.filter(e => e.alive && canRangedAttack(fromPos, e));
          if (targets.length > 0) {
            targets.sort((a, b) => cheb(a, fromPos) - cheb(b, fromPos));
            targets = targets.slice(0, 1 + player.extraTargets);
            const intMod = abilityMod(player.abilities.int);
            /* 不稳定血浆：本关内远程攻击必定命中 + 必定暴击 */
            const vampPlasma = selectedChar === 'vampire' && vampireSkillActive;
            const actionCrit = vampPlasma || Math.random() < player.critChance;
            if (vampPlasma) log('「不稳定血浆」：本次攻击必定命中、必定暴击、必定留血迹！');
            else if (actionCrit) log('本次攻击行动触发暴击，所有目标共享！');
            const hits = [];
            const bulletPromises = [];
            for (const target of targets) {
              if (target.hp <= 0) continue;
              const atk = attackRoll(intMod, player.rangedProf || 0, target.ac);
              /* 不稳定血浆：必定命中（自然 1 / AC 过高也照样命中） */
              if (vampPlasma && !atk.hit) { atk.hit = true; atk.forcedHit = true; }
              const isCrit = atk.hit && (atk.nat20 || actionCrit);
              hits.push({ target, hit: atk.hit, isCrit, atk });
              bulletPromises.push(animateBullet(fromPos, 'enemy-' + target.id, target, isCrit, false, 'player'));
            }
            if (hits.length > 0) {
              await Promise.all(bulletPromises);
              await sleep(80);
              for (const { target, hit, isCrit, atk } of hits) {
                /* 只要出手（即使 MISS）就能看到目标意图 */
                if (selectedChar === 'amiya') amiyaMarkReveal(target);
                /* 华法琳：血迹只由远程攻击产生 —— 不稳定血浆生效时必定留，平时命中后 50% */
                if (selectedChar === 'vampire' && hit && (vampPlasma || Math.random() < 0.5)) {
                  addBloodAt(target.x, target.y);
                }
                if (hit) {
                  const dmg = player.rangedDmg * (isCrit ? 2 : 1);
                  const forcedTag = atk.forcedHit ? ' · 必定命中' : '';
                  target.hp -= dmg;
                  if (target.hp <= 0) {
                    target.alive = false;
                    if (selectedChar === 'amiya') amiyaGainKillBonus();
                  }
                  if (isCrit) {
                    hitFx(target.x, target.y, dmg, true, '暴击');
                    log(`玩家远程暴击敌人${target.id+1}，造成${dmg}伤害 (${fmtRoll(atk, target.ac)})${forcedTag}`);
                  } else {
                    hitFx(target.x, target.y, dmg, false);
                    log(`玩家远程命中敌人${target.id+1}，造成${dmg}伤害 (${fmtRoll(atk, target.ac)})${forcedTag}`);
                  }
                } else {
                  missFx(target.x, target.y);
                  log(`玩家远程未命中 (${fmtRoll(atk, target.ac)})`);
                }
              }
            }
            /* 阿米娅：每次攻击（攻击节点出手，无论命中与否）+1 技力 */
            if (selectedChar === 'amiya') amiyaGainAttackSp();
            /* 不稳定血浆的代价：每次远程攻击后自身 -1 HP（护盾可抵消） */
            if (selectedChar === 'vampire' && vampireSkillActive) {
              const selfRes = damagePlayer(1, '不稳定血浆');
              floatText(player.x, player.y,
                debugMode ? '无敌' : (selfRes.shielded ? '护盾抵消' : '-1 HP'),
                debugMode ? '#ffcc00' : (selfRes.shielded ? '#ffffff' : '#ff6b6b'));
              log(`不稳定血浆：攻击后失去 1 HP${debugMode ? '（调试：玩家无敌）' : (selfRes.shielded ? '（护盾抵消）' : `（剩 ${player.hp}）`)}。`);
              updateStats();
              if (player.hp <= 0) {
                player.alive = false;
                phase = 'gameover';
                clearEnemyArrows();
                log('不稳定血浆耗尽了生命。游戏结束。');
                render();
                return;
              }
            }
            playerAttacksDone++;
            refreshUnits();
            await sleep(220);
          } else {
            log('攻击节点无视线内目标（不消耗攻击次数）');
            refreshUnits();
            await sleep(160);
          }
        }
      }
    }
  }

  if (playerActionThisTick && !playerChargingThisTurn && player.alive && player.hp > 0) {
    const autoTargets = enemies.filter(e => e.alive && dist(e, player) === 1);
    /* 远程角色没有近战输出手段：被贴身时的趁乱打击固定 1 点保底伤害，
       不吃暴击 / 冲锋倍率，也不读取近战伤害面板。 */
    const scuffleFlatDmg = isRangedChar(selectedChar);
    if (autoTargets.length > 0) {
      log(`⚡ 趁乱攻击：对 ${autoTargets.length} 个相邻敌人发起攻击！${scuffleFlatDmg ? '（远程角色，1 点保底伤害）' : ''}`);
    }
    for (const target of autoTargets) {
      if (!target.alive) continue;
      const strMod = abilityMod(player.abilities.str);
      const atk = attackRoll(strMod, player.meleeProf || 0, target.ac);
      /* 只要出手（即使 MISS）就能看到目标意图 */
      if (selectedChar === 'amiya') amiyaMarkReveal(target);
      if (!atk.hit) {
        missFx(target.x, target.y);
        log(`趁乱攻击未命中敌人${target.id+1} (${fmtRoll(atk, target.ac)})`);
        refreshUnits();
        await sleep(180);
        continue;
      }
      let dmg = scuffleFlatDmg ? (1 + buffMeleeBonus()) : player.meleeDmg;
      if (selectedChar === 'wheelchair' && playerChargingThisTurn) { dmg *= 2; log('玩家冲锋撞击，伤害翻倍！'); }
      let isCrit = false;
      let critTag = '';
      if (!scuffleFlatDmg) {
        isCrit = atk.nat20;
        critTag = atk.nat20 ? '自然20暴击' : '';
        if (!isCrit && isFacingTarget(player, target)) { isCrit = true; critTag = '朝向暴击'; }
        if (!isCrit && Math.random() < (selectedChar === 'fencer' ? player.critChance + 0.42 : player.critChance)) { isCrit = true; critTag = '暴击'; }
        if (isCrit) dmg *= 2;
      }
      target.hp -= dmg;
      if (selectedChar === 'wheelchair' && playerChargingThisTurn) playerChargeCausedDamage = true;
      slashFx(target.x, target.y, isCrit ? '#ffd700' : '#ffb86b');
      hitFlashCell(target.x, target.y);
      if (isCrit) {
        ringFx(target.x, target.y, '#ff4500');
        floatText(target.x, target.y, critTag + ' -' + dmg, '#ffd700', true);
        log(`趁乱攻击${critTag}敌人${target.id+1}，造成${dmg}伤害 (${fmtRoll(atk, target.ac)})`);
      } else {
        ringFx(target.x, target.y, '#ffb86b');
        floatText(target.x, target.y, '-' + dmg, '#ff6b6b');
        log(`趁乱攻击命中敌人${target.id+1}，造成${dmg}伤害${scuffleFlatDmg ? '（远程角色保底伤害）' : ''} (${fmtRoll(atk, target.ac)})`);
      }
      if (target.hp <= 0) {
        target.alive = false;
        floatText(target.x, target.y, '击杀!', '#ff6b6b');
        log(`敌人${target.id+1}被击败`);
        if (selectedChar === 'amiya') amiyaGainKillBonus();
      }
      refreshUnits();
      await sleep(240);
    }
    /* 注：趁乱打击不属于「正常攻击」，不触发不稳定血浆的任何效果（不暴击、不留血迹、不扣血） */
  }

  let chargeWillEnd = false;
  if (playerChargingThisTurn && (playerBlocked || pIdx >= playerPath.length)) {
    chargeWillEnd = true;
    let willHitWall = false;
    if (!playerBlocked && playerChargeStopReason === 'wall' && player.hp > 0) {
      const adjWall = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => {
        const nx = player.x + dx, ny = player.y + dy;
        return !inBounds(nx, ny) || map[ny][nx] === 1;
      });
      willHitWall = adjWall;
    }
    if (willHitWall) {
      if (playerChargeCausedDamage) {
        floatText(player.x, player.y, '减免撞墙', '#4ecdc4');
        log('冲锋过程中已造成过伤害，本次撞墙免伤。');
      } else {
        const oldHp = player.hp;
        const wallDmg = oldHp - Math.floor(oldHp / 2);
        const wallRes = damagePlayer(wallDmg, '冲锋撞墙');
        const txt = debugMode ? '无敌' : (wallRes.shielded ? '护盾抵消' : '撞墙 -' + wallDmg);
        floatText(player.x, player.y, txt, debugMode ? '#ffcc00' : (wallRes.shielded ? '#ffffff' : '#ff6b6b'), false);
        ringFx(player.x, player.y, '#ff6b6b');
        hitFlashCell(player.x, player.y);
        log(`冲锋撞墙，失去一半 HP${debugMode ? '（调试：玩家无敌）' : (wallRes.shielded ? '（护盾抵消）' : '（-' + wallDmg + '，剩 ' + player.hp + '）')}`);
        if (player.hp <= 0) player.alive = false;
      }
    }
    if (player.hp <= 0) {
      refreshUnits();
      phase = 'gameover';
      clearEnemyArrows();
      log('你死了。游戏结束。');
      render();
      return;
    }
  }

  if (player.hp > 0) {
    for (let i = 0; i < enemies.length; i++) {
      if (player.hp <= 0) break;
      const e = enemies[i];
      if (!e.alive || e.type === 'alien') continue;
      if (e.stunTurns > 0) continue;
      if (dist(e, player) === 1 && !e.attackedThisRound) {
        e.attackedThisRound = true;
        gainFencerSp(1);
        const eStrMod = abilityMod(e.abilities.str);
        const eProf = (e.type !== 'alien') ? e.prof : 0;
        const useDefenseAdvantage = selectedChar === 'fencer' && fencerCounterActive;
        const atk = useDefenseAdvantage
          ? attackRollDisadvantage(eStrMod, eProf, player.ac)
          : attackRoll(eStrMod, eProf, player.ac);
        slashFx(player.x, player.y, '#ff6b6b');
        hitFlashCell(player.x, player.y);
        if (atk.hit) {
          let ed = e.meleeDmg;
          let critTag = '';
          if (atk.nat20) { ed *= 2; critTag = '自然20暴击'; }
          else if (isFacingTarget(e, player)) { ed *= 2; critTag = '朝向暴击'; }
          if (selectedChar === 'wheelchair' && playerChargingThisTurn) {
            log(`敌人${i+1}近战攻击${critTag ? '（' + critTag + '）' : ''}，冲锋状态免疫所有伤害！`);
            floatText(player.x, player.y, '冲锋免疫', '#ffd700');
            refreshUnits();
            await sleep(240);
            continue;
          }
          if (selectedChar === 'fencer' && fencerCounterActive && fencerSp >= FENCER_SP_MAX) {
            log(`敌人${i+1}近战命中${critTag ? '（' + critTag + '）' : ''}，但泥岩反击状态+满技力，免疫所有攻击！`);
            floatText(player.x, player.y, '满技力免疫', '#ffd700');
            // ★ 关键修复：免疫后必须仍然结算这次反击。
            // 旧版这里直接 continue，跳过了 triggerFencerCounter()，于是「满技力 → 免疫 → 不反击 → 技力不清零
            // → 永远满技力永远免疫 → 眩晕/回血永远不触发」形成死锁。免疫本身就该算作一次「承伤触发的反击」。
            if (player.hp > 0) triggerFencerCounter();
            refreshUnits();
            await sleep(240);
            continue;
          }
          const meleeRes = damagePlayer(ed, '敌人近战');
          floatText(player.x, player.y,
            debugMode ? '无敌' : (meleeRes.shielded ? '护盾抵消' : ((critTag ? critTag + ' -' : '-') + ed)),
            debugMode ? '#ffcc00' : (meleeRes.shielded ? '#ffffff' : (critTag ? '#ffd700' : '#ff6b6b')),
            !debugMode && !meleeRes.shielded && !!critTag);
          log(`敌人${i+1}近战命中${critTag ? '（' + critTag + '）' : ''}${debugMode ? '（调试：玩家无敌）' : (meleeRes.shielded ? '（护盾抵消）' : '，造成' + ed + '伤害')} (${fmtRoll(atk, player.ac)})`);
          if (player.hp > 0) triggerFencerCounter();
        } else {
          missFx(player.x, player.y);
          log(`敌人${i+1}近战未命中 (${fmtRoll(atk, player.ac)})`);
        }
        refreshUnits();
        await sleep(240);
      }
    }
  }

  if (chargeWillEnd) {
    log('冲锋结束，失去冲锋状态。');
    playerChargingThisTurn = false;
    playerChargeStopReason = null;
    playerChargeCausedDamage = false;
  }

  if (player.hp <= 0) player.alive = false;
  enemies.forEach(e => {
    if (e.alive && e.hp <= 0) {
      e.alive = false;
      ringFx(e.x, e.y, '#ff6b6b');
      floatText(e.x, e.y, '击杀!', '#ff6b6b');
      log(`敌人${e.id+1}被击败`);
      if (selectedChar === 'amiya') amiyaGainKillBonus();
    }
  });
  if (player.hp <= 0) { phase = 'gameover'; clearEnemyArrows(); log('你死了。游戏结束。'); render(); return; }
  if (enemies.filter(e => e.alive).length === 0) { render(); await sleep(300); onLevelClear(); return; }

  const playerFinished = pIdx >= playerPath.length && !pendingAttack;
  const enemiesFinished = enemies.every((e, i) => {
    if (!e.alive) return true;
    if (e.stunTurns > 0) return true;
    const p = enemyPaths[i];
    return !p || eIdx + 1 >= p.length;
  });
  if (playerFinished && enemiesFinished) {
    await endRound();
  } else {
    renderUnits();
    await resolveStep(pIdx, eIdx + 1);
  }
}

// 外星人远程攻击：只在自己「停下的格子」开火。
// 本回合路径没走完（下一 tick 还要移动）时一律不开火 —— 移动途中路过与你同行/同列也不算。
// 停下之后站着不动，你什么时候走进它的行/列就什么时候开枪（每回合每人一次）。
async function resolveAlienShots(eIdx) {
  if (!player || !player.alive || player.hp <= 0) return;
  for (let i = 0; i < enemies.length; i++) {
    if (player.hp <= 0) break;
    const e = enemies[i];
    if (!e.alive || e.type !== 'alien') continue;
    if (e.stunTurns > 0) continue;
    if (e.attackedThisRound) continue;
    // ★ 还在移动途中 → 不开火（必须已经停在落点上）
    const ep = enemyPaths[i];
    if (ep && eIdx + 1 < ep.length) continue;
    if (e.x !== player.x && e.y !== player.y) continue;
    if (!hasLineOfSight(e, player)) continue;
    e.attackedThisRound = true;
    gainFencerSp(1);
    const intMod = abilityMod(e.abilities.int);
    const useDefenseAdvantage = selectedChar === 'fencer' && fencerCounterActive;
    const atk = useDefenseAdvantage
      ? attackRollDisadvantage(intMod, e.prof, player.ac)
      : attackRoll(intMod, e.prof, player.ac);
    await animateBullet({ x: e.x, y: e.y }, 'player', player, atk.nat20, true, 'enemy-' + e.id);
    if (atk.hit) {
      let ed = e.rangedDmg;
      if (atk.nat20) ed *= 2;
      if (selectedChar === 'wheelchair' && playerChargingThisTurn) {
        log(`外星人${i+1}远程命中${atk.nat20 ? '（自然20暴击）' : ''}，冲锋状态免疫所有伤害！`);
        floatText(player.x, player.y, '冲锋免疫', '#ffd700');
        refreshUnits();
        await sleep(240);
        continue;
      }
      if (selectedChar === 'fencer' && fencerCounterActive && fencerSp >= FENCER_SP_MAX) {
        log(`外星人${i+1}远程命中${atk.nat20 ? '（自然20暴击）' : ''}，但泥岩反击状态+满技力，免疫所有攻击！`);
        floatText(player.x, player.y, '满技力免疫', '#ffd700');
        // 免疫不等于跳过反击，否则满技力会永久锁死、眩晕永远不触发
        if (player.hp > 0) triggerFencerCounter();
        refreshUnits();
        await sleep(240);
        continue;
      }
      const shotRes = damagePlayer(ed, '外星人射击');
      floatText(player.x, player.y,
        debugMode ? '无敌' : (shotRes.shielded ? '护盾抵消' : ((atk.nat20 ? '自然20暴击 -' : '-') + ed)),
        debugMode ? '#ffcc00' : (shotRes.shielded ? '#ffffff' : (atk.nat20 ? '#ffd700' : '#a55eea')),
        !debugMode && !shotRes.shielded && atk.nat20);
      log(`外星人${i+1}远程命中${debugMode ? '（调试：玩家无敌）' : (shotRes.shielded ? '（护盾抵消）' : '，造成' + ed + '伤害')} (${fmtRoll(atk, player.ac)})`);
      if (player.hp > 0) triggerFencerCounter();
    } else {
      missFx(player.x, player.y);
      log(`外星人${i+1}远程未命中 (${fmtRoll(atk, player.ac)})`);
    }
    refreshUnits();
    await sleep(240);
  }
}

async function endRound() {
  if (player.hp <= 0) { phase = 'gameover'; clearEnemyArrows(); log('你死了。游戏结束。'); render(); return; }
  clearEnemyArrows();
  enemies.forEach(e => e.attackedThisRound = false);
  playerPath = [{ x: player.x, y: player.y }];
  attackIndices = []; enemyPaths = [];
  playerChargingThisTurn = false; playerAttacksDone = 0; fencerCounterActive = false;
  pendingAttack = false;
  pendingChargeInfo = null;
  pendingCounterInfo = null;
  amiyaBurstPlan = null;
  amiyaBurstDone = false;
  playerChargeStopReason = null;
  playerChargeCausedDamage = false;
  phase = 'planning';
  battleRound++;
  log('--- 回合结束 ---');

  enemies.forEach(e => {
    e.amiyaRevealActive = 0;
    if (e.amiyaRevealForNext) {
      e.amiyaRevealActive = e.amiyaRevealBonus || 0;
      e.amiyaRevealForNext = false;
      e.amiyaRevealBonus = 0;
    }
    if (e.stunTurns > 0) {
      e.stunTurns--;
      if (e.stunTurns <= 0) {
        log(`敌人${e.id+1}解除眩晕。`);
      }
    }
  });

  generateEnemyPaths();
  logEnemyMainDirections();
  render();
}

function onLevelClear() {
  if (phase === 'levelclear' || phase === 'gameover') return;   // 防止同回合被多个入口重复触发
  clearEnemyArrows();
  playerStats.currentHp = player.hp;
  if (selectedChar === 'vampire' && bloodDrops.length > 0) {
    const n = bloodDrops.length;
    let totalHeal = 0, totalSp = 0;
    for (let i = 0; i < n; i++) {
      const heal = Math.min(playerStats.maxHp - playerStats.currentHp, 2);
      if (heal > 0) { playerStats.currentHp += heal; totalHeal += heal; }
      if (vampireSp < VAMPIRE_SP_MAX) { vampireSp++; totalSp++; }
      const sass = sassExtraSp();
      if (sass && vampireSp < VAMPIRE_SP_MAX) { vampireSp++; totalSp++; }
    }
    log(`华法琳吸收了场上 ${n} 处血迹 🩸：恢复 ${totalHeal} HP、技力 +${totalSp}（${vampireSp}/${VAMPIRE_SP_MAX}）。`);
    bloodDrops = [];
    player.hp = playerStats.currentHp;
  }

  if (selectedChar === 'amiya' && amiyaBonusTargets > 0) {
    log(`阿米娅的技力 ${amiyaBonusTargets}/${amiyaSpMax()} 将继承到下一关。`);
  }
  if (selectedChar === 'fencer' && fencerSp > 0) {
    log(`泥岩的技力 ${fencerSp}/${FENCER_SP_MAX} 将继承到下一关。`);
  }
  if (selectedChar === 'vampire' && vampireSp > 0) {
    log(`华法琳的技力 ${vampireSp}/${VAMPIRE_SP_MAX} 将继承到下一关。`);
  }
  log(`第 ${level} 关通过！获得 ${ABILITY_POINTS_PER_LEVEL} 点属性点。`);
  playerStats.abilityPoints += ABILITY_POINTS_PER_LEVEL;

  const clearedLevel = level;
  level += 1;
  const willLevelUp = clearedLevel % LEVELUP_EVERY_N_LEVELS === 0;
  levelUpPending = willLevelUp;
  phase = 'levelclear';
  render();

  /* 每 3 关（第 3/6/9… 关通关）提升 1 级：HP 上限 + 体质加值、回满血，再从奖励池 3 选 1 */
  if (willLevelUp) {
    setTimeout(() => openLevelUp(), 600);
  } else {
    setTimeout(() => enterAllocGate(), 700);
  }
}

/* 通关闸门：若仍有点数未分配，停在 levelclear 并强制先加点；否则进入下一关 */
function enterAllocGate() {
  if (playerStats.abilityPoints > 0) {
    log('📌 还有属性点未分配，请点击左侧六维图上的属性名加点，加完才能进入下一关。');
    render();
  } else {
    initLevel();
  }
}
/* 「下一关」按钮：仅当所有属性点分配完毕才可用 */
function proceedNextLevel() {
  if (phase !== 'levelclear' || playerStats.abilityPoints > 0) return;
  initLevel();
}

/* =========================================================
 * 升级：等级 +1 → HP 上限 + 体质加值 → 回满血 → 奖励池 3 选 1
 * ========================================================= */
function openLevelUp() {
  if (phase !== 'levelclear' || levelUpOpen) return;
  if (levelUpPending) {
    levelUpPending = false;
    heroLevel += 1;
    const conMod = Math.max(0, abilityMod(playerStats.abilities.con));
    lastLevelUpConMod = conMod;
    levelHpBonus += conMod;
    recomputePlayerDerivedStats();
    playerStats.currentHp = playerStats.maxHp;        // 升级回满血
    if (player) { player.maxHp = playerStats.maxHp; player.hp = playerStats.maxHp; }
    log(`⭐ 升级！Lv.${heroLevel}：HP 上限 +${conMod}（体质加值，累计 +${levelHpBonus}），生命已回满（${playerStats.maxHp}/${playerStats.maxHp}）。`);
    updateStats();
  }
  showLevelUpOverlay(lastLevelUpConMod);
}

/* 从奖励池里随机抽 n 个不重复的 buff（同一 buff 可重复获得，效果累加） */
function pickBuffChoices(n = 3) {
  const pool = BUFF_POOL.slice();
  const out = [];
  while (out.length < n && pool.length > 0) {
    out.push(pool.splice(randInt(pool.length), 1)[0]);
  }
  return out;
}

function applyBuff(id) {
  const b = BUFF_BY_ID[id];
  if (!b) return;
  buffs[id] = (buffs[id] || 0) + 1;
  if (id === 'kettle') {
    /* HP 上限 +2，并回复等量生命 */
    const oldMax = playerStats.maxHp;
    recomputePlayerDerivedStats();
    const diff = playerStats.maxHp - oldMax;
    playerStats.currentHp = Math.min(playerStats.maxHp, playerStats.currentHp + diff);
    if (player) {
      player.maxHp = playerStats.maxHp;
      player.hp = Math.min(player.maxHp, player.hp + diff);
    }
  } else if (id === 'blade') {
    recomputePlayerDerivedStats();          // 近战伤害 +1（趁乱在结算时读 buffMeleeBonus）
    if (player) {
      player.meleeDmg = playerStats.meleeDmg;
    }
  } else if (id === 'scout') {
    playerStats.extraAttacks += 1;
    if (player) player.extraAttacks = playerStats.extraAttacks;
  }
  log(`🎁 获得奖励：${b.icon} ${b.name}（${b.desc}）${buffs[id] > 1 ? `　已叠加 ×${buffs[id]}` : ''}`);
}

function showLevelUpOverlay(conMod) {
  if (levelUpOpen) return;
  levelUpOpen = true;
  const choices = pickBuffChoices(3);
  const mask = document.createElement('div');
  mask.className = 'lv-mask';
  mask.innerHTML = `
    <div class="lv-panel">
      <div class="lv-head">
        <span class="lv-title">⭐ 升级！</span>
        <span class="lv-lv">Lv.${heroLevel}</span>
      </div>
      <div class="lv-sub">
        HP 上限 +${conMod}（体质加值）· 生命已回满<br>
        从奖励池中选择 1 个 buff（同一 buff 可重复获得，效果叠加）
      </div>
      <div class="lv-cards">
        ${choices.map(b => `
          <button class="lv-card" data-buff="${b.id}">
            <span class="ico">${b.icon}</span>
            <span class="nm">${b.name}</span>
            <span class="ds">${b.desc}</span>
            <span class="own">已拥有 <b>${buffs[b.id] || 0}</b> 层</span>
          </button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(mask);
  mask.querySelectorAll('[data-buff]').forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (!levelUpOpen) return;
      levelUpOpen = false;
      applyBuff(btn.dataset.buff);
      mask.remove();
      enterAllocGate();
    };
  });
}

/* 战斗日志：底边抽屉，默认收起，只有点按钮才弹出（不再占用布局高度） */
const logToggleBtn = document.getElementById('logToggle');
const logCloseBtn  = document.getElementById('logClose');
const logPanelEl   = document.getElementById('logPanel');

function setLogOpen(open) {
  logPanelEl.classList.toggle('open', open);
  // 抽屉自带 ✕，打开时收起右下角浮标，避免两个关闭按钮
  logToggleBtn.style.display = open ? 'none' : 'flex';
  if (open) logEl.scrollTop = logEl.scrollHeight;
}
logToggleBtn.addEventListener('click', (e) => {
  e.preventDefault();
  setLogOpen(!logPanelEl.classList.contains('open'));
});
logCloseBtn.addEventListener('click', (e) => {
  e.preventDefault();
  setLogOpen(false);
});

initCharSelect();

// 顶部「重开」按钮：随时回到选角界面（重开一局）
(function bindResetBtn() {
  const rb = document.getElementById('resetBtn');
  if (!rb) return;
  rb.addEventListener('click', () => {
    if (window.confirm('确定重开游戏吗？当前进度将丢失。')) initCharSelect();
  });
})();
</script>
