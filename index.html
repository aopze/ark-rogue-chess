<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>方舟战棋</title>
<!-- ============================================================================
     ISSUE-20261029-45：本页已退化为纯入口跳转，不再承载任何业务。
     ----------------------------------------------------------------------------
     原 index.html 是「外壳」：Telegram SDK、账号体系、排行榜、账号抽屉、iframe 容器，
     共 819 行。现在这些全部内联进 game.html（单文件），本页只剩跳转。

     为什么还要留着它：线上静态站（bot 侧 E:\ark-review，由 cloudflared 隧道直供）
     的默认文档就是 index.html，直接删掉会让 https://ark.arkroguelike.top/ 变成 404。

     BUILD 的真值来源已迁到 build/version.json（本页不再有 var BUILD）。
     ========================================================================= -->
<style>
  html, body { margin:0; height:100%; background:#1a1a2e; color:#eee;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; font-size:14px; }
</style>
<meta http-equiv="refresh" content="0;url=game.html">
<script>
  /* 必须带上 search 与 hash：
     · hash 里可能有 #tgWebAppData=... —— 丢掉它 Telegram SDK 就拿不到 initData，
       身份会从「tg user id」退化成「网页游客设备 id」，成绩会记到另一条记录上。
     · search 是一些外部入口带的缓存穿透参数，一并透传无害。 */
  (function () {
    var q = location.search || '';
    var h = location.hash || '';
    location.replace('game.html' + q + h);
  })();
</script>
</head>
<body>
  <div>正在进入游戏…</div>
</body>
</html>
