<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色卡生成器</title>
<style>
:root{--primary:#4f46e5;--bg:#f3f4f6;--card-bg:#fff;--text:#1f2937;--sub:#8b5cf6;--accent:#0ea5e9;--warn:#f59e0b;}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:flex-start;min-height:100vh;margin:0;padding:20px;}
.container{background:var(--card-bg);width:100%;max-width:860px;padding:2rem;border-radius:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);}
.q-title{font-weight:bold;margin-bottom:.5rem;display:block;}
.section-title{font-weight:bold;font-size:.95rem;margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.hint{font-size:.82rem;color:#9ca3af;margin-top:14px;}
.options-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;}
.option-btn{position:relative;padding:10px;border:2px solid #e5e7eb;background:#fff;border-radius:8px;cursor:pointer;transition:all .2s;font-size:.9rem;font-family:inherit;text-align:center;}
.option-btn:hover{border-color:var(--primary);color:var(--primary);}
.option-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.option-btn:disabled{opacity:.45;cursor:not-allowed;}
.option-btn:disabled:hover{border-color:#e5e7eb;color:inherit;}
.option-btn.recommended{border-color:var(--warn);background:#fffbeb;}
.option-btn.recommended::after{content:'⭐';position:absolute;top:-8px;right:-8px;font-size:14px;}

/* 第7页推荐武器：选中后字体保持黑色 */
.option-btn.recommended.active{
  color:var(--text);
  background:#fffbeb;
  border-color:var(--warn);
}

/* 第6页分组按钮配色 */
.role-type-btn{background:#eff6ff;}
.body-form-btn{background:#fefce8;}
.clothes-btn{background:#fef2f2;}
.residence-btn{background:#f3f4f6;}
.role-type-btn:hover{background:#dbeafe;}
.body-form-btn:hover{background:#fef9c3;}
.clothes-btn:hover{background:#fee2e2;}
.residence-btn:hover{background:#e5e7eb;}
.role-type-btn.active,.body-form-btn.active,.clothes-btn.active,.residence-btn.active{
  background:var(--primary);color:#fff;border-color:var(--primary);
}

/* 能力行 / 人脉行：左=名字(右上角类型)，右=直接展开的内容（结果页复用） */
.ability-row,.conn-row{display:flex;gap:12px;background:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid var(--primary);border-radius:8px;padding:10px 12px;margin-top:8px;}
.ability-tag-box{flex:0 0 110px;position:relative;padding-right:46px;display:flex;align-items:flex-start;}
.ability-tag-box .ability-name{font-weight:700;color:#0f172a;font-size:.9rem;line-height:1.4;}
.ability-tag-box .ability-type{position:absolute;top:0;right:0;}
.ability-row-body{flex:1;font-size:.85rem;color:#334155;line-height:1.65;border-left:1px dashed #cbd5e1;padding-left:12px;}
@media (max-width:560px){
  .ability-row,.conn-row{flex-direction:column}
  .ability-tag-box{flex:none;width:100%;padding-right:46px;}
  .ability-row-body{border-left:none;border-top:1px dashed #cbd5e1;padding-left:0;padding-top:8px;}
}
/* 人脉：与能力同款展开行 */
.conn-section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 6px;font-weight:700;color:var(--primary);}
.conn-role{font-size:.78rem;color:#64748b;}
.conn-effect{font-size:.88rem;color:#0f172a;margin-top:3px;}
.conn-note{font-size:.75rem;color:#b45309;margin-top:5px;}
.conn-rules{margin-top:7px;background:#fff;border:1px solid #e2e8f0;border-left:3px solid #cbd5e1;border-radius:6px;}
.conn-rules summary{cursor:pointer;font-size:.78rem;font-weight:700;color:var(--primary);padding:5px 8px;list-style:none;user-select:none;}
.conn-rules summary::-webkit-details-marker{display:none;}
.conn-rules summary::before{content:"▸ ";}
.conn-rules[open] summary::before{content:"▾ ";}
.conn-rules[open] summary{border-bottom:1px dashed #e2e8f0;}
.conn-rules-inner{padding:2px 10px 10px;font-size:.83rem;color:#334155;line-height:1.6;}
/* 第四页人脉：具体身份 / 补充说明输入框 */
.conn-detail-box{margin-top:14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;}
.conn-detail-label{font-weight:700;font-size:.9rem;color:#92400e;margin-bottom:8px;}
.conn-detail-input{width:100%;min-height:76px;resize:vertical;padding:9px 11px;border:1px solid #fcd34d;border-radius:8px;background:#fff;font-family:inherit;font-size:.88rem;line-height:1.6;color:#78350f;outline:none;}
.conn-detail-input:focus{border-color:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.15);}
.conn-detail-input::placeholder{color:#c2a36b;}
.conn-detail{margin-top:6px;background:#fffbeb;border:1px solid #fde68a;border-left:3px solid var(--warn);border-radius:6px;padding:7px 10px;font-size:.85rem;color:#78350f;line-height:1.6;white-space:pre-wrap;word-break:break-word;}

.flat-list{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.flat-row{display:flex;align-items:flex-start;gap:12px;background:#faf5ff;border:2px dashed #ddd6fe;border-radius:10px;padding:9px 11px;cursor:pointer;transition:background-color .2s,border-color .2s,box-shadow .2s;}
.flat-row:hover{border-color:var(--sub);background:#f3e8ff;}
.flat-row.active{border-style:solid;border-color:var(--sub);background:#ede9fe;}
.row-tag{flex:0 0 auto;min-width:96px;text-align:center;background:var(--sub);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-family:monospace;font-size:.95rem;letter-spacing:2px;cursor:pointer;font-weight:bold;}
.flat-row.active .row-tag{background:#6d28d9;box-shadow:0 0 0 3px rgba(139,92,246,.25);}
.row-text{flex:1;font-size:.9rem;line-height:1.75;color:#4c1d95;padding-top:2px;user-select:none;}
.flat-row.active .row-text{color:#3b0764;}
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px;}
.sys-card{border:2px solid #e5e7eb;border-radius:10px;padding:12px;cursor:pointer;transition:all .2s;position:relative;background:#fff;}
.sys-card:hover{border-color:var(--accent);}
.sys-card.active{border-color:var(--accent);background:#f0f9ff;box-shadow:0 0 0 3px rgba(14,165,233,.15);}
.sys-card h4{margin:0 0 6px;font-size:.95rem;color:var(--accent);}
.sys-card p{margin:0;font-size:.82rem;color:#64748b;line-height:1.5;}
.sys-check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
.sys-card.active .sys-check{background:var(--accent);border-color:var(--accent);}
.body-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px;}
.body-preview-box{margin-top:10px;padding:10px 12px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;font-size:.85rem;color:#334155;line-height:1.6;display:none;}
.body-preview-box.visible{display:block;animation:fadeIn .25s ease;}
.body-preview-item{padding:4px 0;border-bottom:1px solid #e2e8f0;}
.body-preview-item:last-child{border-bottom:none;}
.preview-box{background:#f9fafb;border:1px dashed #d1d5db;border-radius:8px;padding:12px;font-size:.88rem;color:#374151;line-height:1.7;min-height:56px;display:none;}
.preview-box.visible{display:block;animation:fadeIn .25s ease;}
.ability-detail-box{margin-top:12px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;display:none;}
.ability-detail-box.visible{display:block;animation:fadeIn .3s ease;}
.ability-item{padding:8px 0 9px;border-bottom:1px dashed #e2e8f0;}
.ability-item:last-child{border-bottom:none;}
.sys-ability-details{border-left:4px solid var(--primary);margin-bottom:8px;border-radius:4px;}
.sys-ability-details summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:.9rem;padding:6px 8px;list-style:none;user-select:none;}
.sys-ability-details summary::-webkit-details-marker{display:none;}
.sys-ability-details summary::before{content:"▸ ";color:var(--primary);}
.sys-ability-details[open] summary::before{content:"▾ ";}
.sys-ability-details[open] summary{background:#eef2ff;}
.sys-ability-list{padding:2px 8px 8px 24px;}
.ability-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.ability-name{font-weight:700;color:#0f172a;font-size:.9rem;}
.ability-type{font-size:.7rem;color:#475569;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:999px;padding:1px 8px;white-space:nowrap;flex:none;}
.ability-body{font-size:.85rem;color:#334155;line-height:1.65;margin-top:3px;}
input[type="text"]{width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:8px;font-family:inherit;}
.nav-buttons{display:flex;justify-content:space-between;margin-top:2rem;gap:10px;}
button.nav-btn{padding:10px 24px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:1rem;font-family:inherit;transition:all .2s;}
button.nav-btn:disabled{background:#ccc;cursor:not-allowed;}
button.secondary{background:transparent;color:var(--text);border:1px solid #d1d5db;}
#result-area{display:none;margin-top:20px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 20px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20000;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.sticky-header{position:sticky;top:10px;z-index:100;background:#fff;padding:12px 16px;border-radius:8px;border:2px solid #fca5a5;box-shadow:0 4px 10px rgba(0,0,0,.1);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.sticky-header .credit-text{font-size:1.1rem;font-weight:bold;color:#dc2626;}
.sticky-header .credit-detail{font-size:.85rem;color:#6b7280;}
.equip-category{margin-top:20px;}
.equip-category-title{font-size:1rem;font-weight:bold;color:var(--primary);border-left:4px solid var(--primary);padding-left:8px;margin-bottom:10px;}
.equip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.equip-card{border:2px solid #e5e7eb;border-radius:8px;padding:12px;cursor:pointer;transition:all .2s;background:#fff;display:flex;flex-direction:column;justify-content:space-between;}
.equip-card:hover{border-color:var(--warn);}
.equip-card.active{border-color:var(--warn);background:#fffbeb;box-shadow:0 0 0 3px rgba(245,158,11,.15);}
.equip-card h4{margin:0 0 8px;font-size:.95rem;color:var(--text);}
.equip-card .eq-price{font-weight:bold;color:#dc2626;margin-bottom:8px;font-size:.9rem;}
.equip-card .eq-effect{font-size:.85rem;color:#4b5563;line-height:1.4;flex-grow:1;margin-bottom:8px;}
.equip-card .eq-desc{font-size:.75rem;color:#9ca3af;font-style:italic;border-top:1px dashed #e5e7eb;padding-top:6px;margin-top:auto;}
.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px;}
.result-card{border:1px solid #e5e7eb;border-left:4px solid var(--primary);border-radius:6px;padding:10px 12px;background:#fff;cursor:pointer;transition:all .2s;}
.result-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1);transform:translateY(-1px);}
.result-label{font-size:.75rem;color:#6b7280;margin-bottom:4px;}
.result-value{font-size:.9rem;font-weight:bold;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.result-card.result-equip .result-label{display:flex;justify-content:space-between;gap:8px;}
.result-label-right{font-size:.75rem;color:#6b7280;font-weight:400;}
.result-card.result-equip .result-value{display:block;white-space:normal;overflow:visible;text-overflow:clip;}
.equip-line{display:flex;justify-content:space-between;gap:8px;}
.equip-line + .equip-line{margin-top:2px;}
.connection-rule{margin-top:8px;padding:8px 10px;background:#f8fafc;border-left:3px solid #cbd5e1;border-radius:4px;font-size:.86rem;line-height:1.65;color:#334155;}
.connection-rule strong{color:#0f172a;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10000;justify-content:center;align-items:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:12px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 20px 25px -5px rgba(0,0,0,.1);}
.modal-close{position:absolute;top:12px;right:16px;font-size:24px;cursor:pointer;color:#9ca3af;background:none;border:none;line-height:1;}
.modal-close:hover{color:#ef4444;}
.modal-title{font-weight:bold;font-size:1.1rem;margin-bottom:12px;padding-right:20px;color:var(--primary);}
.modal-content{font-size:.9rem;color:#374151;line-height:1.7;}
.sheet-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.sheet-btn{flex:1 1 auto;min-width:120px;padding:8px 10px;border:1px solid var(--primary);border-radius:8px;background:#fff;color:var(--primary);font-size:.8rem;font-weight:700;cursor:pointer;}
.sheet-btn:hover{background:#eef2ff;}
.weapon-section{margin-top:10px;}
.weapon-section-title{font-size:1rem;font-weight:700;color:var(--primary);border-left:4px solid var(--primary);padding-left:8px;margin:10px 0 6px;}
.weapon-block + .weapon-block{margin-top:10px;}
.weapon-block-title{font-size:.82rem;font-weight:700;color:#334155;margin-bottom:4px;}
.weapon-row,.weapon-custom-row{display:grid;gap:1px;background:#cbd5e1;border:1px solid #e2e8f0;border-left:4px solid var(--primary);border-radius:6px;overflow:hidden;}
.weapon-row{grid-template-columns:repeat(5,minmax(0,1fr));}
.weapon-custom-row{grid-template-columns:minmax(0,1fr);}
.weapon-custom-item{display:grid;grid-template-columns:1.1fr 2.4fr 1.3fr 70px;gap:1px;background:#cbd5e1;}
.weapon-cell{min-width:0;background:#f8fafc;padding:6px 8px;font-size:.78rem;line-height:1.5;color:#334155;overflow-wrap:anywhere;}
.weapon-cell b{display:block;font-size:.7rem;color:#64748b;margin-bottom:2px;}
.weapon-custom-title{font-size:.78rem;font-weight:700;color:var(--primary);margin:6px 0 3px;display:flex;align-items:center;gap:8px;}
/* 合计维护费胶囊（武器定制 / 装备共用） */
.upkeep-pill{font-size:.74rem;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:1px 8px;white-space:nowrap;}
/* ==== 装备：与武器同样整块展开（不塞进 result-grid 小卡片） ==== */
.equip-section{margin-top:10px;}
.equip-section-title{font-size:1rem;font-weight:700;color:var(--primary);border-left:4px solid var(--primary);padding-left:8px;margin:10px 0 6px;}
.equip-section-title.with-add{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.equip-title-main{display:flex;align-items:center;gap:8px;min-width:0;}
.equip-block + .equip-block{margin-top:10px;}
.equip-block-title{font-size:.82rem;font-weight:700;color:#334155;margin-bottom:4px;}
.equip-row{display:grid;grid-template-columns:1.15fr 2.9fr .7fr 72px;gap:1px;background:#cbd5e1;border:1px solid #e2e8f0;border-left:4px solid var(--primary);border-radius:6px;overflow:hidden;}
.equip-row + .equip-row{margin-top:6px;}
.equip-empty{font-size:.82rem;color:#94a3b8;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:6px;padding:8px 10px;}
@media (max-width:560px){
  .equip-row{grid-template-columns:1fr 1fr;}
}
/* ==== 道具：与装备同款展开块，但只有 名称/效果/价格（消耗品不产生维护费） ==== */
.item-section{margin-top:10px;}
.item-section-title{font-size:1rem;font-weight:700;color:var(--accent);border-left:4px solid var(--accent);padding-left:8px;margin:10px 0 6px;}
.item-section-title.with-add{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.item-block + .item-block{margin-top:10px;}
.item-block-title{font-size:.82rem;font-weight:700;color:#334155;margin-bottom:4px;}
.item-row{display:grid;grid-template-columns:1.15fr 3.4fr .8fr;gap:1px;background:#cbd5e1;border:1px solid #e2e8f0;border-left:4px solid var(--accent);border-radius:6px;overflow:hidden;}
.item-row + .item-row{margin-top:6px;}
@media (max-width:560px){
  .item-row{grid-template-columns:1fr;}
}
.base-stats-panel{background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #f59e0b;border-radius:8px;padding:6px 10px;margin-bottom:14px;display:flex;align-items:baseline;flex-wrap:wrap;row-gap:2px;}
.base-stat-item{display:flex;align-items:baseline;gap:4px;padding:0 9px;border-left:1px solid rgba(180,83,9,.28);white-space:nowrap;}
.base-stat-item:first-child{border-left:none;padding-left:0;}
.base-stat-break{flex-basis:100%;height:0;line-height:0;}
.base-stat-break+.base-stat-item{border-left:none;padding-left:0;}
.base-stat-item.clickable{cursor:pointer;border-radius:4px;}
.base-stat-item.clickable:hover{background:rgba(245,158,11,.14);}
.base-stat-item.clickable:hover .base-stat-value{text-decoration:underline;}
.base-stat-label{font-size:.95rem;color:#92400e;font-weight:bold;}
.base-stat-value{font-size:.95rem;font-weight:bold;color:#b45309;}
.base-stat-value span{font-size:.95rem;color:#a16207;}
.debug-mode [contenteditable="true"]{outline:2px dashed #10b981!important;background-color:rgba(16,185,129,.05)!important;cursor:text!important;border-radius:3px;}
.debug-mode [contenteditable="true"]:focus{outline:2px solid #3b82f6!important;background-color:#fff!important;box-shadow:0 0 8px rgba(59,130,246,.3);}
/* ==== 独立角色卡（主文件最后一页与导出文件共用） ==== */
.num-input{width:auto;min-width:34px;padding:0 2px;border:none;border-bottom:1px dashed rgba(180,83,9,.55);border-radius:0;background:transparent;color:inherit;font-family:inherit;font-size:inherit;font-weight:bold;text-align:center;appearance:textfield;-moz-appearance:textfield;}
.num-input:focus{outline:none;background:rgba(245,158,11,.12);border-bottom-color:#b45309;}
.num-input::-webkit-inner-spin-button,.num-input::-webkit-outer-spin-button{-webkit-appearance:none!important;appearance:none!important;margin:0!important;}
.section-add-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 6px;font-weight:700;color:var(--primary);}
.weapon-section-title.with-add{display:flex;justify-content:space-between;align-items:center;}
.result-card .result-label{display:flex;align-items:center;gap:6px;}
.result-card.result-equip .result-label{justify-content:flex-start;}
.result-label .card-add-btn{margin-left:auto;}
.section-add-btn,.card-add-btn{flex:none;padding:3px 10px;border:1px solid var(--primary);border-radius:12px;background:#fff;color:var(--primary);font-family:inherit;font-size:.75rem;font-weight:600;cursor:pointer;white-space:nowrap;}
.section-add-btn:hover,.card-add-btn:hover{background:#eef2ff;}
.added-section:empty{display:none;}
.added-section{margin-top:14px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:12px;}
.added-title{font-weight:700;color:var(--primary);margin-bottom:8px;}
.added-group{margin-top:8px;}
.added-group-title{font-size:.8rem;font-weight:700;color:#475569;border-left:3px solid var(--primary);padding-left:6px;margin-bottom:4px;}
.added-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #e2e8f0;padding:6px 0;font-size:.84rem;line-height:1.6;}
.added-item:last-child{border-bottom:none;}
.added-item button{align-self:flex-start;flex:none;border:none;background:none;color:#ef4444;cursor:pointer;font-family:inherit;font-size:.78rem;}
.added-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;}
.added-head .added-title{margin-bottom:0;}
.confirm-added-btn{flex:none;padding:4px 18px;border:none;border-radius:14px;background:var(--primary);color:#fff;font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;}
.confirm-added-btn:hover{filter:brightness(1.08);}
.runtime-added-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.78rem;color:#475569;margin:2px 0 3px;}
.runtime-added-head b{font-weight:700;overflow-wrap:anywhere;}
.runtime-remove{flex:none;border:none;background:none;color:#ef4444;cursor:pointer;font-family:inherit;font-size:.75rem;padding:0 2px;}
.runtime-remove:hover{text-decoration:underline;}
.ability-row-body .runtime-remove{float:right;}
.result-label .runtime-remove{margin-left:auto;}
.add-box{max-width:720px;}
.add-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}

const btn=(active,label,click,cls='')=>`<button class="option-btn ${active?'active':''} ${cls}" onclick="${click}">${label}</button>`;

/* 能力文本解析 */
function parseAbility(text){
  const m=/^《([^》]+)》（([^）]+)）：([\s\S]*)$/.exec(text.trim());
  return m?{name:m[1],type:m[2].trim(),body:m[3].trim()}:{name:text.trim(),type:'',body:''};
}
function abilityItemHtml(text){
  const a=parseAbility(text);
  if(!a.type) return `<div class="ability-item"><div class="ability-body">${a.name}</div></div>`;
  return `<div class="ability-item"><div class="ability-head"><span class="ability-name">《${a.name}》</span><span class="ability-type">${a.type}</span></div><div class="ability-body">${a.body}</div></div>`;
}
function abilityBox(title,ab){
  if(!ab) return '';
  return `<div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #f59e0b;border-radius:10px;padding:12px 14px;margin-top:10px;text-align:left;">
    <div style="font-weight:bold;color:#92400e;margin-bottom:6px;font-size:.95rem;">🎁 ${title} · ${ab.name}
      <span style="font-size:.72rem;background:#f59e0b;color:#fff;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;">${ab.type}</span></div>
    <div style="font-size:.88rem;color:#78350f;line-height:1.65;">${ab.effect}</div></div>`;
}
function statsStripHtml(o,extra=[]){
  const it=(l,v,idx=null,field=null)=>{
    const fa=field?` data-num-field="${field}"`:'';
    const val=`<span class="base-stat-value"${fa}>${v}</span>`;
    return idx==null
      ? `<div class="base-stat-item"><span class="base-stat-label">${l}</span>${val}</div>`
      : `<div class="base-stat-item clickable" onclick="openDetail(${idx}, window._financeCards)"><span class="base-stat-label">${l}</span>${val}</div>`;
  };
  // 第一栏顺序：属性 → 等级 → 业力 → 耐力 → 信用点 → 维护费 → 贷款
  const FIELD_BY_LABEL={'信用点:':'credit','维护费:':'upkeep','贷款额度:':'loanLine'};
  const extras=extra.map((x,i)=>it(x.label,x.value,i,FIELD_BY_LABEL[x.label]||null)).join('');
  return `<div class="base-stats-panel">${it('属性',o.attr)}${it('等级',o.level,null,'level')}${it('业力',o.karma,null,'karma')}${it('耐力',`${o.stamina}<span data-num-field="staminaMax">/${o.staminaMax}</span>`,null,'stamina')}<div class="base-stat-break"></div>${extras}</div>`;
}

    {label:"养蛊噬身",preview:"从社会的最底层，抛弃一切，通过噬咬残杀他人，从尸山血海中想方设法活了下来。你脚下的累累尸骸，就是你成为一名追猎者的垫脚石。"},
    {label:"复仇恶鬼",preview:"隐退之后过着平静的生活……直到某一天突然被卷入了一场恐怖的灾难，你家破人亡，千金散尽。充斥着对引起这灾难之人的怨恨，你重新踏入修罗之道。"},
    {label:"企业真相",preview:"你在一家企业工作，知道了令人恐惧的邪恶业务。你在公司注意到这一点之前辞职跑路，成为了一名追猎者。至今为止，你对此仍然守口如瓶。"},
    {label:"马失前蹄",preview:"在企业中积累了不少功绩，也获得了很高的地位和职责……但是你因为一个小失误失去了一切。如今，你只是一个普通的追猎者罢了。"},
    {label:"负伤隐退",preview:"曾经是一名熟练的追猎者，但因为一次大意而受了极为严重的伤。你总归是恢复了行动能力，但曾经的技术与财产均已散去。"},
    {label:"雏鸟初飞",preview:"你曾经作为一名菜鸟完成了许多简单的委托，进而渐渐拥有了足以独当一面的能力。你大显身手的时机即将到来！"},
    {label:"人间废物",preview:"曾经作为熟练的猎人获得了相应的实力与财富……但你自甘堕落，沉溺于享乐安逸的生活之中，如今已经与菜鸟无异了。积蓄已经败光，只能重新开始工作。"},
    {label:"家庭事故",preview:"构建了美满家庭的追猎者隐退了。不过，如今因为伴侣的死亡或离婚，亦或是收入问题等原因，你再次作为追猎者开始了活动。"},
    {label:"离开企业",preview:"曾经作为企业的精英而活动，因为一个念头决定独立，成为一名自由追猎者。或是曾经归属的企业开始走下坡路，或是在工作中犯了错误被炒了鱿鱼。"},
    {label:"聪明绝顶",preview:"与生俱来的真正的天才，不用努力就可以做到任何事情。因为不想被企业当成宠物圈养，所以决定成为自由追猎者。谈到自己的才能，便毫无顾忌。"}],
  "古血统":[
    {label:"耻辱加身",preview:"你曾经被人绑架监禁，并遭到了残酷的凌辱。你被你的家族视为耻辱。为了洗清自己的污名，你成为了一名追猎者……但也无法忘怀那种感觉。"},
    {label:"家门叛徒",preview:"你抛弃了你自己那腐朽的一族，与你的敌人一同摧毁了它。如今，你已经是一个自由的追猎者了。然而，你族群的幸存者对你的恨意刻骨铭心。"},
    {label:"苟活于世",preview:"企业，大妖怪或是神明。某个强大的存在，将你们一族悉数消灭。你和那些仅有的幸存者一起，聚集在城市最黑暗的角落里成为了追猎者。"},
    {label:"天生废材",preview:"对于没有任何才能的你，周围一切人都很冷淡。你的父母把你视为失败品，选择了放养。你为寻求一个可以逆转一切的成就，成为了追猎者。"},
    {label:"力量成瘾",preview:"你意识到了自己与普通人之间力量产生的不可逾越的鸿沟……并且沉迷其中。你想要更多的权威和暴力，将那迂腐的家族抛在脑后。你开始随心所欲地发挥力量。"},
    {label:"始积跬步",preview:"为了被承认为家族的正式成员，需要得到相应的追猎者成就。作为达到目标的垫脚石，你开始了自己的追猎者生涯。"},
    {label:"寻找伴侣",preview:"你的家族以吸纳强者的血脉来强化自身的实力。作为家族的一员，你必须在外界寻找强大之人的血脉。成为追猎者便是你寻找强者的手段。"},
    {label:"暗中调查",preview:"为了探寻黑社会当中的种种，你被家族送进道上成为密探。你真正的目的是调查追猎者们的真实情况，报告那些暗中作乱的妖精或神明。"},
    {label:"血脉觉醒",preview:"旁系血脉也好，被收养的弃婴也好。你从未意识到自己的血脉。直到某一天被卷入了突发事件当中时，被称之为本能的退魔之力觉醒了。"},
    {label:"下代家主",preview:"家族秘术的传统是独子相传。作为人丁稀少一族的年轻人，你继承了这份力量……但是你仍然需要不断地磨练自己的实力，才能参悟其中奥秘。"}],
  "换身灵":[
    {label:"实验产物",preview:"你是某个企业进行的非人道妖精融合实验的产物。趁着其他企业引发的骚乱，你总算是逃了出去……但你并非属于阳光之下的那一类人。"},
    {label:"绝处逢生",preview:"你被卷入了一场可怕的灾难，失去了一切。在绝望之中……你对不公平的愤怒与怨恨召唤出了妖精，因此获得了全新的身体与追猎者的身份。"},
    {label:"救命契约",preview:"你在一次不可能存活的绝境之中，受到了一位妖精的保护。多亏了它，你的命保住了……但你也与那妖精融合到了一起。"},
    {label:"妖精养子",preview:"你被妖精抚养长大，对伦理道德一无所知。你与它们滥交，甚至生下了孩子。你这种价值观想要在人类社会活动的话，只有追猎者是合理的挡箭牌。"},
    {label:"妖精亲友",preview:"你与妖精长期交往，成为了要好的朋友。期间，接受了一份签订契约的提案。没有过多思考的你，按照挚友的愿望成为了「两人一体」的追猎者。"},
    {label:"欲望狂魔",preview:"你与妖精融合以来，性欲增加了一倍，甚至对性爱产生了戒断反应。为了避免成为性犯罪者或娼妇，你只能通过成为追猎者的方式合法地消遣性欲。"},
    {label:"战斗成瘾",preview:"与你签订契约的妖精寻求着战斗。你为了寻找战斗而接受委托，为了下一场战斗而接受报酬。直到你再也无法战斗的那一天。"},
    {label:"灵魂同调",preview:"生来穷困潦倒，但却与认识的妖精融合得以苟延残喘。两个灵魂几乎是完全相同的。你们之间没有任何分歧。"},
    {label:"渴求力量",preview:"虽是凡人，但却渴望着能够使任何人屈服的武力。你与妖精融合，获得了莫大的力量……但还远远不够。你为了获得更强大的力量，成为追猎者来磨炼自身。"},
    {label:"喜怒无常",preview:"可能是与妖精融合带来的影响，你无法像常人一样正常思考。你喜怒无常，经常自找麻烦。换言之，这种人简直就是生来的追猎者。"}],
  "永恒者":[
    {label:"劣品末路",preview:"并非所有的永恒者都属于富裕阶层。有些小缺陷而被认为是劣等品的肉体，将会遭到遗弃……其中也不乏诞生自我意识萌芽的身体。你就是其中之一。"},
    {label:"亡命天涯",preview:"如果杀死了一个永恒者，即使自己也是永恒者，也会遭受可怕而残酷的刑罚。你为了逃脱罪名（也可能只是冤罪），自愿成为了下等人当中的一名追猎者。"},
    {label:"风光不再",preview:"再卑富贵的永恒者，也不乏在权利斗争或自我荒废中毁灭的人。你也是他们中的一员，和失去了一切的老百姓一样沦落到以追猎者谋生的境地。"},
    {label:"屈辱上瘾",preview:"高贵的自己被下等人所凌辱、被降服……你对这种情况感到兴奋。单纯的想象和角色扮演不足以满足你，因此成为了追猎者。"},
    {label:"掉队落伍",preview:"天生在协调性上有障碍的你，成为了同族人虐待的发泄口。你从上流社会逃到黑社会当中，现在成为了一名不经传的追猎者。"},
    {label:"厌恶升格",preview:"如果在企业中升职的话，就会被强制变成永恒者，遭到被称之为欢迎会的轮奸。被迫成为永恒者之后，你开始厌恶这种环境。因此你辞职了。"},
    {label:"实战训练",preview:"虽然作为超上级阶层，但最好也要有自卫的手段。掌握了一定战斗技术的你，为了更加实战性的训练而尝试着开始了追猎者的生涯。"},
    {label:"富人爱好",preview:"你并不缺钱。只是为了追求各种刺激和快乐成为了追猎者。你没有特别的目标，也看不起那些为了生活而拼命的家伙。"},
    {label:"千金散尽",preview:"虽然是靠不正当手段赚来的……但是你对充满欲望的生活感到疲惫。你将全部财产捐给了慈善团体，随后决定作为追猎者开始活动。"},
    {label:"最初末代",preview:"你是一个早早就经受了人格转移的永恒者。在颓废和无所事事中活了几百年，能感觉到自己的能力正在衰退。作为锻炼重拾力量，你开始了追猎者的工作。"}],
  "人造人":[
    {label:"拾荒回收",preview:"作为失败品而遭到遗弃的你，被下层区的技术人员捡到，进行了修复。侥幸逃脱了烂在垃圾堆里的生活……但为了活下去，不得不去赚钱。"},
    {label:"精液便器",preview:"属于强改者的性处理人偶在被无数次注入精液后，产生了自我意识。虽然人偶从那些惊慌失措的强改者手中逃出来了……但是你的谋生之道却极为有限。"},
    {label:"性爱人偶",preview:"作为性爱玩具而制造出来的，美丽而淫荡的人造人。作为追猎者活动是你的主人为了向周围人炫耀你而进行的娱乐活动。你仍然是一个被束缚的奴隶。"},
    {label:"救命稻草",preview:"你本应死于某场事故或是不治之症，但被改造成了人造人而得以苟延残喘。家产也因此全部耗尽，除了成为追猎者之外别无他法。"},
    {label:"超前产品",preview:"你是某个大企业开发的次时代人造人。然而，因为感觉到了研究的危险性而选择了和开发者共同逃走。你成为了一名追猎者，现在正在躲避公司的眼线……"},
    {label:"家道中落",preview:"无论有多么强大的权利和财力，也会有没落的一天。你就是其中的典型例子。失去了一切的你，如今只是一介以追猎者谋生的普通人罢了。"},
    {label:"肉体接续",preview:"某个人造人的核心遭到了破坏。你是它的关系人，所以接管了那人偶的身体。接下来，打倒那破坏核心的人就成了你在追猎路上的终极目标。"},
    {label:"实战试验",preview:"作为公司研发中的最新型人造人，你正在进行运动试验。你所做的一切都受到严密监视。试验时期结束时，虽然可以成为自由身……"},
    {label:"双重生活",preview:"从小就被装在一个过度保护的温室当中的你，对外面的世界一无所知。你厌倦了狭窄单调的生活，得到了追猎者的身份，开始了双重生活。"},
    {label:"最终道路",preview:"一个曾被指控贪污的永恒者遭到名誉剥夺，开始逃亡。而后成为悬赏目标，但行踪不明。你将自我意识转移到人偶身上。虽然如今只是追猎者，但必将卷土重来。"}],
  "魅魔":[
    {label:"期待渴望",preview:"被卷入了某个事件，承受了普通生活中无法遇到的残酷凌辱。但是，那种快感无法忘怀……为了再度寻找那种感觉，踏上了追猎者的道路。"},
    {label:"前任苗床",preview:"负责强改人的性欲处理是你曾经的工作。已经不知道多少次怀上他们的孩子，渐渐对这份工作感到厌倦。为了寻找不同的愉悦，总之成为了追猎者。"},
    {label:"痴情纠葛",preview:"在随性地做着娼妓工作的时候，被卷入了一场麻烦的人际关系问题中。由于你对追求者没有什么感情，所以选择了逃离这种生活，成为了追猎者。"},
    {label:"随波逐流",preview:"作为娼妓的你，曾偶然遇到过一个追猎者顾客。也是偶然地，你被介绍了其他追猎者。回过神来时，你发现自己已经变成了娼妓和追猎者的双重身份。"},
    {label:"妖精代理",preview:"属于某个「异界」的你，被任命为其原住民妖精们的性处理道具，以及和人类社会的中介。为了让你中介身份更加方便，索性得到了追猎者的身份。"},
    {label:"顺水推舟",preview:"你被卷入了某个事件，但凭借着自身的性感与美貌解决了。周围的人都认为你是一个追猎者，你也认为这似乎是一个出乎意料的轻松工作，索性成为了真的追猎者。"},
    {label:"奇心旺盛",preview:"你对当前人类社会的混乱状态感到好奇，想要了解更多有关黑社会的情况。那么，成为追猎者自然就是比当娼妓的更好手段。"},
    {label:"脱团偶像",preview:"你虽然确立了身为一名偶像的地位，但由于压抑的生活方式，你作为魅魔的本能已然无法抑制。你抛弃了一切，成为了一名追猎者。"},
    {label:"眼前恋人",preview:"目前的恋人是一名追猎者。为了支持你的恋人，总之也成为了追猎者。没有考虑长远的问题，只要当下能够时时刻刻陪在恋人身边就好了。"},
    {label:"夜燕伏翼",preview:"和各种各样的组织、企业的VIP保持关系，作为风流美人的身份期间，了解了各种各样的秘密。你在成为他人眼中的麻烦之前先成为了追猎者。"}],
  "吸血鬼":[
    {label:"血畜末路",preview:"你曾是侍奉吸血鬼、提供血液的情人。由于多次吸血，你也被主人无意识之间变成了吸血鬼。你被主人遗弃，成为了追猎者。"},
    {label:"鲜血契约",preview:"在不可能幸存的死亡来临之际，一名吸血鬼现身了。他告诉你如果成为追猎者并追随他的话，就会帮助你。然后，你也遵从了他的要求，成为了吸血鬼。"},
    {label:"异常口味",preview:"作为一个名门家族的吸血鬼，你其实比起血液更喜欢其他体液（精液或母乳）。你如果想要避开同族来吸食这些东西的话，就必须作为追猎者活动。"},
    {label:"半吸血鬼",preview:"你作为被诅咒的半吸血鬼诞生了。自小时候就受到迫害，对吸血鬼充满怨恨。成为了追猎者的理由，也只有想把那个单亲吸血鬼击败。"},
    {label:"新生魔物",preview:"你成为吸血鬼的事情还没过去几天。获得了不可思议的力量的你，半沉醉其中成为了追猎者……尽管每天都被你的主人抱怨。"},
    {label:"宠爱结晶",preview:"在长期侍奉吸血鬼，并赢得了宠爱的之后……你作为家族成员受到了接纳。为了控制自己的力量，你作为修行的一环成为了追猎者。"},
    {label:"新世始祖",preview:"这个魔法充盈的时代，死者有时会自发地变成吸血鬼。你是这种稀有例子的一员。你没有自己的血主，作为追猎者潜藏在阴影中。"},
    {label:"不朽使者",preview:"既是对已经生活了几百年的吸血鬼而言，如今这个时代也充满了奇迹。对他们的不死的威胁也有所增加。为了取回已经衰弱的力量，成为了追猎者。"},
    {label:"不死仪式",preview:"你通过强大的魔法仪式得到了不老不死的手段。过去的魔力几乎已经消失，但从今往后的时间是无限的。你决定成为追猎者再度磨练技艺。"},
    {label:"不朽觉醒",preview:"活了千年以上，其中几百年几乎都在昏睡。醒来之时，不禁感叹这个世界的变化。为了能够看到这个世界各个角落的变化，你成为了追猎者。"}],
  "神使者":[
    {label:"众神青睐",preview:"作为追猎者的活跃表现可以迎来神明降临，并且蒙受独一无二的宠爱。神明能给予你的快感是绝无仅有的。你追求与神明交配的机会，为此付出努力。"},
    {label:"神的奴隶",preview:"毫无信仰可言。那家伙只是个用契约束缚人类的恶魔。作为曾实现愿望的回报，你别无选择，只能遵从他的命令。成为追猎者就是其中之一。"},
    {label:"淫祀邪教",preview:"你属于小规模邪教教团的经营。话虽如此，你们的信徒并不多，因此也没有得到预期规模的收入。你们发现了成为追猎者这种获得新奴隶与收入的全新渠道。"},
    {label:"神罚执行",preview:"你是神罚的代行者。违背神之教诲的人，必将遭到报应。虽然你一直毫不避讳地执行着私刑活动，不过如果有客观的奖金和报酬，也会考虑追猎者的委托。"},
    {label:"自我磨练",preview:"作为神明的使徒，你想要磨练自己，使自己更有力量。于是，你成为了追猎者。毕竟，使徒的力量就是神的威光。"},
    {label:"福利人士",preview:"你经营着一家孤儿院，为那些无家可归的孩子提供上帝的庇护。这不能仅通过信徒的供奉来维持。你成为了追猎者，为自己的事业赚取相应的经费。"},
    {label:"神谕下达",preview:"神明给予了你一个启示，命令你成为追猎者。为此，你也得到了其他使徒或眷属的帮助。一切都掌握在神明手中。"},
    {label:"圣战讨伐",preview:"神明的敌对势力正在不断壮大。你们必须将其彻底摧毁。幸运的是，他们也是社会的敌人。倘若能作为追猎者进行活动的话，就有办法暗中剿灭他们了。"},
    {label:"传播教义",preview:"信仰你的主神的人数量不是很多。为了得到更多信徒，同时不被企业夺取你与你的神明的荣耀……你成为了一名追猎者。"},

/* 把定制效果文本解析为武器的实际属性变更（备注标签增删 / 射程 / 伤害） */
/* applyOne: 把单条效果文本作用到 out 上，tags 数组跨多条定制共享累积 */
function applyCustomEffect(eff,out,tags){
  if(!eff) return;
  const addTag=(t,plus=false)=>{
    if(!t||tags.includes(t)) return;
    tags.push(t);
    out.changes.push((plus?'+':'')+t);
  };
  // 失去「X」→ 移除备注标签
  for(const m of eff.matchAll(/失去「([^」]+)」/g)){
    const x=m[1];
    if(tags.includes(x)){tags.splice(tags.indexOf(x),1);out.changes.push('−'+x);}
  }
  // 获得「X」→ 新增备注标签（排除「获得「+1」修正值」这类数值修正，以及 BS 状态）
  for(const m of eff.matchAll(/获得「([^」]+)」(修正值)?/g)){
    const x=m[1];
    if(m[2]||/^[+-]?\d+(?:D\d+)?$/.test(x)||/BS[:：]/.test(x)) continue;
    addTag(x,true);
  }
  // 无法「X」→ 新增负面标签（如 无法反击）
  for(const m of eff.matchAll(/无法「([^」]+)」/g)) addTag('无法'+m[1],true);
  // 射程变为「Y」
  const mr=/射程变为「([^」]+)」/.exec(eff);
  if(mr&&mr[1]!==out.range){out.range=mr[1];out.changes.push('射程 → '+mr[1]);}
  // 伤害类型从「A」变为「B」
  const md=/伤害类型从「([^」]+)」变为「([^」]+)」/.exec(eff);
  if(md){
    const nd=out.damage.replace('「'+md[1]+'」','「'+md[2]+'」');
    if(nd!==out.damage){out.damage=nd;out.changes.push('伤害类型 → '+md[2]);}
  }
  // 伤害增加 N 点：只把无条件、对全部目标生效的加成写入基础伤害。
  // 「如果接受」「每满足一条」「对属性：妖」等条件/限目标加伤改为场景备注，避免虚增伤害。
  if(!/如果|若|每满足|每有|对「属性：/.test(eff)){
    for(const m of eff.matchAll(/伤害(?:增加|\+)\s*(\d+)\s*点/g)){
      const n=parseInt(m[1],10);
      out.damage=out.damage.replace(/(\d+)/,mm=>String(parseInt(mm,10)+n));
      out.damageBonus=(out.damageBonus||0)+n;
      out.changes.push('伤害 +'+n);
    }
  }
  // 把判定修正/状态等按生效场景写成可读备注，而不是笼统的 +1/+2
  const sgn=n=>{const v=parseInt(n,10);return (v>=0?'+':'−')+Math.abs(v);};
  const rules=[
    [/如果接受修正值[\s\S]*?伤害增加\s*(\d+)\s*点/,m=>`等级−1/伤害+${m[1]}`],
    [/每满足一条[\s\S]*?伤害增加\s*(\d+)\s*点/,m=>`奇效/GB/大失败伤害+${m[1]}`],
    [/对「属性：妖」的伤害增加\s*(\d+)\s*点/,m=>`对妖伤害+${m[1]}`],
    [/失误值[^。；;]{0,12}?(?:降低|减少)\s*(\d+)/,m=>`失误值−${m[1]}`],
    [/奇效值[^。；;]{0,12}?(?:降低|减少)\s*(\d+)/,m=>`奇效值−${m[1]}`],
    [/远[～~-]外距离[\s\S]*?[「]?([+-]?\d+)[」]?修正值/,m=>`远外${sgn(m[1])}`],
    [/远距离[\s\S]*?[「]?([+-]?\d+)[」]?修正值/,m=>`远距离${sgn(m[1])}`],
    [/「攻击」[\s\S]*?[「]?([+-]?\d+)[」]?修正值/,m=>`攻击${sgn(m[1])}`],
    [/「偷袭」[\s\S]*?[「]?([+-]?\d+)[」]?修正值/,m=>`偷袭${sgn(m[1])}`],
    [/「?反击」?[\s\S]*?[「]?([+-]?\d+)[」]?修正值/,m=>`反击${sgn(m[1])}`],
    [/业力判定（运动）[\s\S]*?[「]?([+-]?\d+)[」]?修正值/,m=>`运动${sgn(m[1])}`],
    [/耐力(?:在)?\s*4\s*以下[\s\S]*?[「]?([+-]?\d+)[」]?修正值/,m=>`耐力≤4时${sgn(m[1])}`],
    [/等级判定[\s\S]*?[「]?([+-]?\d+)[」]?修正值/,m=>`等级${sgn(m[1])}`],
    [/受到的「昏迷」伤害减少\s*(\d+)\s*点/,m=>`昏迷伤害−${m[1]}`],
    [/受到的「屈服」伤害减少\s*(\d+)\s*点/,m=>`屈服伤害−${m[1]}`],
    [/战斗开始时，你的耐力增加\s*(\d+)\s*点/,m=>`战斗开始耐力+${m[1]}`],
    [/获得\s*(\d+)\s*点「屏障」/,m=>`战斗开始屏障+${m[1]}`],
    [/获得「BS：发情1」[\s\S]*?耐力增加\s*(\d+)\s*点/,m=>`BS：发情1/耐力+${m[1]}`],
    [/获得「(BS：[^」]+)」/,m=>m[1]],
    [/施加与伤害同值的「(BS：[^」]+)」/,m=>m[1]],
    [/伤害无法被减免/,()=>'伤害不可减免'],
    [/也可以作为「利器」使用/,()=>'可用作利器'],
    [/也可以作为「突击步枪」使用/,()=>'可用作突击步枪'],
    [/缴械[\s\S]*?代替「伤害追加」/,()=>'缴械代替伤害追加'],
    [/与对方判定值相同/,()=>'同值也造成伤害'],
    [/替代「攻击」来再次使用/,()=>'术法代替攻击'],
    [/目标强迫向你「移动」一次/,()=>'受伤目标移动'],
    [/以你为「攻击」对象时/,()=>'被攻击时魅惑1'],
    [/每次造成伤害[\s\S]*?耐力增加/,()=>'伤害一半回耐力'],
    [/产生GB时[\s\S]*?减少\s*(\d+)\s*点业力/,m=>`GB时业力−${m[1]}`],
    [/产生GB或奇效时/,()=>'GB/奇效时追加术法']
  ];
  for(const [re,fn] of rules){
    const m=re.exec(eff);
    if(m){addTag(fn(m));break;}
  }
}
/* 聚合多个定制：按顺序叠加属性变更，tags 跨定制累积 */
function parseCustomEffects(w,subs){
  const out={range:w.range,damage:w.damage,damageBonus:0,note:w.note,changes:[]};
  const tags=(w.note&&w.note!=='—')?w.note.split(/[、,，]/).map(s=>s.trim()).filter(Boolean):[];
  (subs||[]).forEach(s=>{if(s&&s.effect)applyCustomEffect(s.effect,out,tags);});
  out.note=tags.length?tags.join('、'):'—';
  return out;
}
/* 单条定制（兼容旧调用，如导出 payload 目录） */
function parseCustomEffect(w,sub){return parseCustomEffects(w,sub?[sub]:[]);}
/* 伤害显示：把累加后的总和还原成「基础+加成」，如「昏迷」4+1，仅用于界面展示 */
function damageDisplay(out){
  const dmg=out&&out.damage?out.damage:'';
  const bonus=out&&out.damageBonus?out.damageBonus:0;
  if(!bonus) return dmg;
  const m=dmg.match(/(\d+)(?!.*\d)/);
  if(!m) return dmg;
  return dmg.replace(/(\d+)(?!.*\d)/,Math.max(0,parseInt(m[1],10)-bonus)+'+'+bonus);
}

function originSysIds(){
  if(FAIRY_ORIGINS.includes(answers.origin)) return answers.contractFairy?(findFairy(answers.contractFairy)?.sysIds||[]):[];
  if(GOD_ORIGINS.includes(answers.origin)) return answers.contractGod?(findGod(answers.contractGod)?.sysIds||[]):[];
  return originData.find(o=>o.label===answers.origin)?.sysIds||[];
}
function domainSysIds(dom){
  if(FAIRY_DOMAINS.includes(dom.label)) return answers.contractFairy?(findFairy(answers.contractFairy)?.sysIds||[]):[];
  return dom.sysIds||[];
}
function computeSysPoolIds(){
  const ids=[...originSysIds()];
  selectedDomains().forEach(d=>domainSysIds(d).forEach(s=>ids.push(s)));
  return [...new Set(ids)];
}
function finalSysIds(){
  const pool=computeSysPoolIds();
  if(pool.length>=2){
    const sel=(answers.selectedSysIds||[]).filter(id=>pool.includes(id));
    for(const id of pool){if(sel.length>=2)break;if(!sel.includes(id))sel.push(id);}
    return sel.slice(0,2);
  }
  const ex=(answers.extraSysIds||[]).filter(id=>!pool.includes(id));
  return [...pool,...ex].slice(0,2);
}

function characterAttribute(){
  const m=ATTRIBUTE_BY_ORIGIN[answers.origin];
  return m?{attr:m.attr,reason:m.reason}:{attr:"人",reason:"没有其他说明，属性默认为「人」。"};
}
function computedBaseStats(){
  const attrInfo=characterAttribute();
  let karma=BASE.karma;
  let stamina=BASE.stamina;
  let extraStaminaMax=0;
  const applyMods=ab=>{
    if(!ab||!ab.mods) return;
    karma+=ab.mods.karma||0;
    stamina+=ab.mods.stamina||0;
    extraStaminaMax+=ab.mods.staminaMax||0;
  };
  const ori=originData.find(o=>o.label===answers.origin);
  if(ori) applyMods(ori.initialAbility);
  selectedDomains().forEach(d=>applyMods(d.initialAbility));
  (answers.equipments||[]).forEach(n=>{const e=findEquipment(n);if(e)applyMods(e);});
  karma=Math.max(0,karma);
  stamina=Math.max(0,stamina);
  const staminaMax=Math.max(stamina,stamina*2+extraStaminaMax);
  return {attr:attrInfo.attr,reason:attrInfo.reason,level:BASE.level,karma,stamina,staminaMax};
}

/* 契约随机池 */
const contractRolls={fairy:null,god:null};
function rollContract(kind){
  const table=kind==="fairy"?FAIRY_TABLE:GOD_TABLE;
  const key=kind==="fairy"?"contractFairy":"contractGod";
  const keep=answers[key]&&table.some(e=>e.name===answers[key])?[answers[key]]:[];
  const rest=table.map(e=>e.name).filter(n=>!keep.includes(n));
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  contractRolls[kind]=keep.concat(rest.slice(0,3-keep.length));
}
const ensureRoll=kind=>contractRolls[kind]||(rollContract(kind),contractRolls[kind]);

/* ===================== 清理 / 同步 ===================== */
function sanitize(){
  const need=contractNeeds();
  if(!need.fairy){delete answers.contractFairy;contractRolls.fairy=null;}
  if(!need.god){delete answers.contractGod;contractRolls.god=null;}
  // 领域变更后，清除不在当前推荐列表中的主武器（副武器可任选，不动）
  const recs=[...new Set(selectedDomainLabels().flatMap(d=>weaponRecommendations[d]||[]))];
  if(answers.weaponClass&&!recs.includes(answers.weaponClass)){delete answers.weaponClass;delete answers.weaponSub;}
  const pool=computeSysPoolIds();
  if(pool.length<2){delete answers.selectedSysIds;return;}
  delete answers.extraSysIds;
  if(answers.selectedSysIds){
    answers.selectedSysIds=answers.selectedSysIds.filter(id=>pool.includes(id));
    if(!answers.selectedSysIds.length) delete answers.selectedSysIds;
  }
}
function syncWeapons(){
  const mk=(ck,sk)=>{
    const w=weaponData.find(x=>x.name===answers[ck]);
    if(!w) return null;
    const chosen=answers[sk]||[];
    // 按 w.subs 原始顺序取选中的定制，保证展示/计价顺序稳定
    const subs=w.subs.filter(s=>chosen.includes(s.name));
    const eff=parseCustomEffects(w,subs);
    return {className:w.name,range:eff.range,damage:eff.damage,damageBonus:eff.damageBonus,upkeep:w.cost,note:eff.note,
            subs:subs.map(s=>({name:s.name,price:s.price,effect:s.effect,desc:s.desc,changes:parseCustomEffects(w,[s]).changes})),
            sub:subs.map(s=>s.name).join('、')||null,
            price:subs.reduce((sum,s)=>sum+(s.price||0),0),
            effect:subs.map(s=>s.effect).filter(Boolean).join(' '),
            effects:eff.changes};
  };
  answers.weapon1=mk('weaponClass','weaponSub');
  answers.weapon2=mk('weaponClass2','weaponSub2');
  answers.bonusCredits=(answers.weapon1&&!answers.weapon2)?50:0;
}

function pickParent(qid,label){
  if(answers[qid]===label) return;
  if(qid==='origin'){
    delete answers.event;
    if(label!=='老江湖'){delete answers.extraDomain;delete answers.experiences;domainView=null;}
  }else{
    delete answers.experiences;
    delete answers.extraDomain;
  }
  answers[qid]=label;
  render();
}
// 选择/切换/取消领域（老江湖双领域有顺序约束）
function pickDomain(label){
  let chosen=selectedDomainLabels();
  const exps=answers.experiences||{};
  const firstDone=!!(chosen[0]&&exps[chosen[0]]);
  const current=domainView&&chosen.includes(domainView)?domainView:chosen[chosen.length-1];
  if(chosen.includes(label)){
    // 选中两个后，点另一个已选领域＝切换查看它的经历（不取消）
    if(chosen.length>1&&label!==current){domainView=label;render();return;}
    // 取消当前查看的领域：取消第 1 个时第 2 个也一并清空（顺序依赖）
    const idx=chosen.indexOf(label);
    if(idx===0) chosen.forEach(l=>delete exps[l]);
    else delete exps[label];
    chosen=idx===0?[]:[chosen[0]];
    domainView=chosen[chosen.length-1]||null;
  }else{
    if(chosen.length===0){
      chosen=[label];
    }else if(chosen.length===1){
      if(!firstDone){toast('请先完成「'+chosen[0]+'」的重要经历，再选择第 2 个领域');return;}
      chosen=[chosen[0],label];
    }else{
      // 已选满 2 个：替换第 2 个领域，保留第 1 个及其经历
      const first=chosen[0];
      delete exps[chosen[1]];
      chosen=[first,label];
    }
    domainView=label;
  }
  answers.domain=chosen[0]||'';
  answers.extraDomain=chosen[1]||'';
  if(!answers.domain) delete answers.domain;
  if(!answers.extraDomain) delete answers.extraDomain;
  answers.experiences=exps;
  render();
}
function pickChild(qid,label,owner){
  if(qid==='origin') answers.event=label;
  else (answers.experiences||(answers.experiences={}))[owner]=label;
  $$('.child-list').forEach(list=>{
    if(list.dataset.owner!==owner) return;

  });

function pick(key,value){
  if(key==='bodyForms'){
    const a=answers.bodyForms||(answers.bodyForms=[]);
    const i=a.indexOf(value);
    i>-1?a.splice(i,1):a.push(value);
  }else if(key==='weaponSub'||key==='weaponSub2'){
    // 武器定制：按预算多选（toggle）。预算沿用 finance().remaining（含贷款），与主/副武器及装备共享
    const a=answers[key]||(answers[key]=[]);
    const i=a.indexOf(value);
    if(i>-1){a.splice(i,1);}
    else{
      // 找到该定制的价格用于预算校验
      const cls=key==='weaponSub'?'weaponClass':'weaponClass2';
      const w=weaponData.find(x=>x.name===answers[cls]);
      const sub=w&&w.subs.find(s=>s.name===value);
      const price=sub?sub.price:0;
      if(finance().remaining<price){toast('信用点不足，无法选择该定制');return;}
      a.push(value);
    }
  }else if(key==='weaponClass'||key==='weaponClass2'){
    answers[key]=value;
    delete answers[key==='weaponClass'?'weaponSub':'weaponSub2'];
  }else{
    answers[key]=value;
  }
  render();
}
function toggleSys(id,extra=false){
  const key=extra?'extraSysIds':'selectedSysIds';
  const list=answers[key]||(answers[key]=[]);
  const need=extra?Math.max(0,2-computeSysPoolIds().length):2;
  const i=list.indexOf(id);
  if(i>-1) list.splice(i,1);
  else{ if(list.length>=need) list.shift(); list.push(id); }
  render();
}
function toggleEquip(name){
  const a=answers.equipments||(answers.equipments=[]);
  const i=a.indexOf(name);
  if(i>-1){a.splice(i,1);render();return;}
  const item=findEquipment(name);
  if(item&&finance().remaining<item.price){toast('信用点不足，无法购买该装备');return;}
  a.push(name);
  render();
}
function toggleItem(name){
  const a=answers.items||(answers.items=[]);

/* ===================== 财务 ===================== */
function finance(){
  syncWeapons();
  const puppet=answers.origin==='人造人'?100:0;
  const base=100+(answers.bonusCredits||0)+puppet;
  const weapons=[answers.weapon1,answers.weapon2].filter(Boolean);
  const custom=weapons.reduce((s,w)=>s+w.price,0);
  const guns=['手枪','突击步枪','狙击步枪'];
  const free=hasDomain('神枪手')?Math.min(100,weapons.filter(w=>guns.includes(w.className)).reduce((s,w)=>s+w.price,0)):0;
  const spentWeapon=custom-free;
  const spentEquip=(answers.equipments||[]).reduce((s,n)=>{const e=findEquipment(n);return s+(e?e.price:0);},0);
  // 道具为一次性消耗品：计入花费，但不计入维护费
  const spentItem=(answers.items||[]).reduce((s,n)=>{const e=findItem(n);return s+(e?e.price:0);},0);
  const spent=spentWeapon+spentEquip+spentItem;
  const total=base+200;
  const remaining=total-spent;
  const usedLoan=Math.max(0,spent-base);
  const interest=Math.ceil(usedLoan*0.1);
  return {puppet,base,custom,free,spentWeapon,spentEquip,spentItem,spent,total,remaining,usedLoan,interest};
}

    h+=`<div class="body-preview-box ${w2?'visible':''}">${w2?weaponInfoHtml(w2,subs2):''}</div>`;
    if(w2){
      h+=section(`🔍 ${w2.name} 武器定制（按预算多选，可不选）`);
      h+=grid(w2.subs.map(s=>subBtn(s,(answers.weaponSub2||[]).includes(s.name),`pick('weaponSub2','${s.name}')`)).join(''));
    }
  }
  return h;
}
/* 公共余额条：武器页 / 装备页共用（必须带 .sticky-header 包裹层，样式为后代选择器） */
function creditHeaderHtml(f){
  return `<div class="sticky-header">
    <div class="credit-text">💰 剩余可用：${f.remaining} 点</div>
    <div class="credit-detail">总额: ${f.total} (基础${100+(answers.bonusCredits||0)}${f.puppet?' + 拼装玩偶'+f.puppet:''} + 额度200) | 已花: ${f.spent}${f.free?` (免枪械定制${f.free})`:''} | 已用贷款: ${f.usedLoan} (利息: ${f.interest})</div>
  </div>`;
}
function renderEquipment(){
  const f=finance();
  let h=creditHeaderHtml(f);
  if(f.puppet) h+=hint(`🎁 拼装玩偶：额外获得 ${f.puppet} 信用点装备额度，该部分不支付维护费。`);
  if(f.free) h+=hint(`🔫 最佳拍档：减免了 ${f.free} 信用点的枪械定制费，该部分不支付维护费。`);
  equipmentData.forEach(cat=>{
    h+=`<div class="equip-category"><div class="equip-category-title">${cat.category}</div><div class="equip-grid">`;
    cat.items.forEach(item=>{
      const bought=(answers.equipments||[]).includes(item.name);
      let mod='';
      if(item.mods){
        const p=[];
        if(item.mods.stamina)p.push(`耐力+${item.mods.stamina}`);
        if(item.mods.staminaMax)p.push(`耐力上限+${item.mods.staminaMax}`);
        if(item.mods.karma)p.push(`业力${item.mods.karma>0?'+':''}${item.mods.karma}`);
        if(p.length) mod=`<span style="font-size:.7rem;color:#10b981;font-weight:normal;margin-left:4px;">[${p.join(' / ')}]</span>`;
      }
      h+=`<div class="equip-card ${bought?'active':''}" onclick="toggleEquip('${item.name}')">
        <h4>${item.name}${mod} <span style="font-size:.8rem;color:#6b7280;">${bought?'已拥有':''}</span></h4>
        <div class="eq-price">价格：${item.price}</div>
        <div class="eq-effect"><strong>效果：</strong>${item.effect}</div>
        <div class="eq-desc">${item.desc}</div></div>`;
    });
    h+=`</div></div>`;
  });
  return h+hint('ℹ️ 点击卡片购买或取消购买。贷款利息按实际使用的额度（超出基础信用点的部分）的10%计算。');
}
/* 第 8 步：购买道具（一次性消耗品，只花信用点，不计维护费） */
function renderItem(){
  const f=finance();
  let h=creditHeaderHtml(f);
  if(f.spentEquip) h+=hint(`🎒 已投入装备 ${f.spentEquip} 点，剩余 ${f.remaining} 点可用于道具。`);
  h+=hint('🎒 道具是一次性消耗品：只消耗信用点，不产生维护费，可与装备共用同一份预算。');
  itemData.forEach(tier=>{
    h+=`<div class="equip-category"><div class="equip-category-title">${tier.category}</div><div class="equip-grid">`;
    tier.items.forEach(item=>{
      const bought=(answers.items||[]).includes(item.name);
      h+=`<div class="equip-card ${bought?'active':''}" onclick="toggleItem('${item.name}')">
        <h4>${item.name} <span style="font-size:.8rem;color:#6b7280;">${bought?'已购买':''}</span></h4>
        <div class="eq-price">价格：${item.price}</div>
        <div class="eq-effect"><strong>效果：</strong>${item.effect}</div>
        <div class="eq-desc">${item.desc}</div></div>`;
    });
    h+=`</div></div>`;
  });
  return h+hint('ℹ️ 点击卡片购买或取消购买。道具不占维护费，预算不够时会提示「信用点不足」。');
}

const renderers={
  'two-level':q=>q.id==='domain'&&answers.origin==='老江湖'?renderDomainMulti(q):renderTwoLevel(q),
  'contract-page':renderContract,
  'ability-page':renderAbility,
  'connection-page':renderConnection,
  'role-body-page':renderRoleBody,
  'weapon-page':renderWeapon,

};

// 向导主渲染：根据当前步骤渲染题目与选项
function render(){
  sanitize();
  const list=visibleQuestions();
  stepIdx=Math.max(0,Math.min(stepIdx,list.length-1));
  const q=list[stepIdx];
  $('#result-area').style.display='none';
  $('#home-view').style.display='none';
  $('#quiz-wrap').style.display='block';
  $('#quiz-container').style.display='block';
  $('#nav-area').style.display='flex';
  $('#quiz-container').innerHTML=`<div class="question-box"><span class="q-title">${stepIdx+1}. ${q.title}</span>${renderers[q.type](q)}</div>`;
  $('#prev-btn').disabled=stepIdx===0;
  $('#next-btn').textContent=stepIdx===list.length-1?'✅ 生成角色卡':'下一步';
}
function changeStep(delta){
  const list=visibleQuestions();
  if(delta>0&&stepIdx===list.length-1){showResult();return;}
  stepIdx=Math.max(0,Math.min(list.length-1,stepIdx+delta));
  render();
}

/* 结果卡姓名：读取（并顺手保存，供返回修改后重新生成时保留） */
function getCardName(){
  const el=$('#card-name-input');
  let n=el?String(el.value||'').trim():String(window._cardName||'').trim();
  n=n.replace(/[\\/:*?"<>|]/g,'').trim();   // 去掉文件名非法字符
  window._cardName=n||'未命名';
  return window._cardName;
}
const escCardText=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// 生成角色卡：汇总所有选择，构建结果区 DOM
function showResult(){
  const f=finance();
  const base=computedBaseStats();
  const ori=originData.find(o=>o.label===answers.origin);
  const doms=selectedDomains();
  const sysIds=finalSysIds();
  const fairy=answers.contractFairy?findFairy(answers.contractFairy):null;
  const god=answers.contractGod?findGod(answers.contractGod):null;
  const hr='<hr style="border:none;border-top:1px dashed #d1d5db;margin:10px 0;">';
  const cards=[];
  const C=(label,value,detail,opts={})=>cards.push({label,value,detail:detail||value,...opts});

  C('出身',answers.origin||'—',ori
    ?`<div class="sheet-group-title">${ori.label}</div><div>${ori.preview}</div>${ori.initialAbility?abilityBox('出身初始能力',ori.initialAbility):''}${hr}<div><strong>关键事件：</strong>${answers.event||'—'}</div>`
    :'—');

  C('领域',doms.map(d=>d.label).join(' / ')||'—',doms.length
    ?doms.map(d=>`<div class="sheet-group-title">${d.label}</div><div>${d.preview}</div>${d.initialAbility?abilityBox('领域初始能力',d.initialAbility):''}<div><strong>重要经历：</strong>${(answers.experiences||{})[d.label]||'—'}</div>`).join(hr)
    :'—');

  if(fairy||god){
    C('契约',[fairy&&`妖精：${fairy.name}`,god&&`神明：${god.name}`].filter(Boolean).join(' / '),
      (fairy?`<div class="sheet-group-title">契约妖精：${fairy.name}</div><div>能力系统：${fairy.sysText}<br>特征：${fairy.feature}<br>性质：${fairy.nature}<br>由来：${fairy.source}</div>`:'')+
      (fairy&&god?hr:'')+
      (god?`<div class="sheet-group-title">信仰神明：${god.name}</div><div>能力系统：${god.sysText}<br>特征：${god.feature}<br>性质：${god.nature}<br>由来：${god.source}</div>`:''));
  }

  C('能力系统',sysIds.map(id=>sysNamesOf([id])[0]).join(' / ')||'—',
    sysIds.map(id=>{
      const s=ABILITY_SYSTEMS.find(x=>x.id===id);
      return s?`<div class="sheet-group-title">${s.name}</div>${s.abilities.map(abilityItemHtml).join('')}`:'';
    }).join(hr)||'—');

  // 人脉：效果很短，改为与「能力」同款展开行，显示在能力列表下方
  const conn=connectionData.find(c=>c.label===answers.connection);
  const connRowHtml=conn?`<div class="conn-section-title">人脉</div>
    <div class="conn-row">
      <div class="ability-tag-box">
        <span class="ability-name">${conn.label}</span>
        <span class="ability-type">人脉</span>
      </div>
      <div class="ability-row-body">
        <div class="conn-role">${conn.role}</div>
        <div class="conn-effect">${conn.effect}</div>
        ${answers.connectionDetail&&String(answers.connectionDetail).trim()?`<div class="conn-detail">${escCardText(answers.connectionDetail)}</div>`:''}
        <div class="conn-note">※ 人脉效果不是被动，需按下方任一方式激活后获得。</div>
        <details class="conn-rules"><summary>如何获得人脉效果</summary><div class="conn-rules-inner">${connectionRuleHtml(false)}</div></details>
      </div>
    </div>`:'';

  const sel=(sec)=>{const v=answers[sec.key];return Array.isArray(v)?v:[v].filter(Boolean);};
  C('角色形象',[answers.roleType,answers.clothes,answers.residence].filter(Boolean).join(' / ')||'—',
    roleSections.map(sec=>{
      const chosen=sel(sec);
      const items=sec.groups.flatMap(g=>g.items).filter(i=>chosen.includes(i.name));
      return items.length?`<div class="sheet-group-title">${sec.title.replace(/（.*?）/,'')}</div>${items.map(i=>`<div>${i.name}：${i.desc}</div>`).join('')}`:'';
    }).filter(Boolean).join(hr)||'—');

  const wpn=[answers.weapon1,answers.weapon2].filter(Boolean);
  const gunNames=['手枪','突击步枪','狙击步枪'];
  let freeLeft=f.free||0;
  const weaponCell=(label,value)=>`<div class="weapon-cell"><b>${label}:</b>${value??'—'}</div>`;
  const weaponPlain=[];
  let weaponUpkeepTotal=0;
  let customUpkeepTotal=0;
  const weaponBlocks=wpn.map((w,i)=>{
    const gun=gunNames.includes(w.className);
    const subs=w.subs||[];
    // 逐定制计算维护费：免费额度在定制之间连续递减（与导出卡 calc() 口径一致）
    let customUpkeep=0;
    const subLines=subs.map(s=>{
      const waived=gun?Math.min(s.price||0,freeLeft):0;
      if(gun) freeLeft-=waived;
      const up=Math.max(0,Math.ceil(((s.price||0)-waived)/10));
      customUpkeep+=up;
      return {name:s.name,price:s.price,effect:s.effect,up,changes:s.changes};
    });
    weaponUpkeepTotal+=w.upkeep||0;
    customUpkeepTotal+=customUpkeep;
    const title=i===0?'主武器':'副武器';
    const subPlain=subLines.length
      ?subLines.map(s=>`定制:${s.name}  效果:${s.effect||'—'}${s.changes&&s.changes.length?'  [实际生效:'+s.changes.join('；')+']':''}  价格:${s.price}  维护费:${s.up}`).join('\n        ')
      :'定制:无';
    weaponPlain.push(`${title}\n武器名:${w.className}  射程:${w.range}  伤害:${w.damage}  备注:${w.note}  维护费:${w.upkeep}\n        ${subPlain}`);
    const subHtml=subLines.length
      ?subLines.map(s=>`<div class="weapon-custom-item">
        ${weaponCell('定制',`${s.name}（价格 ${s.price}）`)}
        ${weaponCell('效果',s.effect||'—')}
        ${weaponCell('实际生效',s.changes&&s.changes.length?s.changes.join('；'):'—')}
        ${weaponCell('维护费',s.up)}
      </div>`).join('')
      :`<div class="weapon-custom-item"><div class="weapon-cell" style="grid-column:1/-1;">无</div></div>`;
    return `<div class="weapon-block">
      <div class="weapon-block-title">${title}</div>
      <div class="weapon-row">
        ${weaponCell('武器名',w.className)}
        ${weaponCell('射程',w.range)}
        ${weaponCell('伤害',damageDisplay(w))}
        ${weaponCell('备注',w.note)}
        ${weaponCell('维护费',w.upkeep)}
      </div>
      <div class="weapon-custom-title">定制<span class="upkeep-pill">合计维护费 ${customUpkeep}</span></div>
      <div class="weapon-custom-row">
        ${subHtml}
      </div>
    </div>`;
  }).join('');
  const weaponSectionHtml=wpn.length?`<div class="weapon-section"><div class="weapon-section-title">武器</div>${weaponBlocks}</div>`:'';
  window._weaponCopyText=weaponPlain.join('\n\n');

  const eqs=(answers.equipments||[]).map(findEquipment).filter(Boolean);
  const freeEquip=answers.origin==='人造人'?Math.min(100,f.spentEquip):0;
  let freeEquipLeft=freeEquip;
  let equipUpkeep=0;
  const equipCatOf=name=>{for(const c of equipmentData){if(c.items.some(it=>it.name===name)) return c.category;}return '其他装备';};
  const equipItems=eqs.map(e=>{
    const waived=Math.min(e.price||0,freeEquipLeft);
    freeEquipLeft-=waived;
    const upkeep=Math.max(0,Math.ceil(((e.price||0)-waived)/10));
    equipUpkeep+=upkeep;
    return {e,cat:equipCatOf(e.name),upkeep};
  });
  // 按装备大类分组（顺序跟随 equipmentData 的大类顺序，组内保持选择顺序）
  const equipGroups=[];
  equipItems.forEach(it=>{
    let g=equipGroups.find(x=>x.cat===it.cat);
    if(!g){g={cat:it.cat,items:[]};equipGroups.push(g);}
    g.items.push(it);
  });
  // 分组顺序跟随 equipmentData 的大类顺序，避免按选择先后乱序
  const equipCatIdx=cat=>{const i=equipmentData.findIndex(c=>c.category===cat);return i<0?99:i;};
  equipGroups.sort((a,b)=>equipCatIdx(a.cat)-equipCatIdx(b.cat));
  const equipBlocks=equipGroups.map(g=>`<div class="equip-block">
      <div class="equip-block-title">${g.cat}</div>
      ${g.items.map(it=>`<div class="equip-row">
        ${weaponCell('装备名',it.e.name)}
        ${weaponCell('效果',it.e.effect||'—')}
        ${weaponCell('价格',it.e.price)}
        ${weaponCell('维护费',it.upkeep)}
      </div>`).join('')}
    </div>`).join('');
  const equipSectionHtml=`<div class="equip-section">
    <div class="equip-section-title with-add"><span class="equip-title-main">装备${equipItems.length?`<span class="upkeep-pill">合计维护费 ${equipUpkeep}</span>`:''}</span></div>
    ${equipItems.length?equipBlocks:'<div class="equip-empty">尚未选择装备，点右侧「添加」选择。</div>'}
  </div>`;

  // 道具：一次性消耗品，只列 名称/效果/价格，不产生维护费
  const its=(answers.items||[]).map(findItem).filter(Boolean);
  const itemSpent=its.reduce((s,i)=>s+(i.price||0),0);
  const itemCatOf=name=>{for(const c of itemData){if(c.items.some(it=>it.name===name)) return c.category;}return '其他道具';};
  const itemGroups=[];
  its.forEach(it=>{
    const cat=itemCatOf(it.name);
    let g=itemGroups.find(x=>x.cat===cat);
    if(!g){g={cat,items:[]};itemGroups.push(g);}
    g.items.push(it);
  });
  // 分组顺序跟随 itemData 的价格档顺序（10 → 20 → 80），组内保持购买顺序
  const itemCatIdx=cat=>{const i=itemData.findIndex(c=>c.category===cat);return i<0?99:i;};
  itemGroups.sort((a,b)=>itemCatIdx(a.cat)-itemCatIdx(b.cat));
  const itemBlocks=itemGroups.map(g=>`<div class="item-block">
      <div class="item-block-title">${g.cat}</div>
      ${g.items.map(it=>`<div class="item-row">
        ${weaponCell('道具名',it.name)}
        ${weaponCell('效果',it.effect||'—')}
        ${weaponCell('价格',it.price)}
      </div>`).join('')}
    </div>`).join('');
  const itemSectionHtml=`<div class="item-section">
    <div class="item-section-title with-add"><span class="equip-title-main">道具${its.length?`<span class="upkeep-pill">合计花费 ${itemSpent}</span>`:''}</span></div>
    ${its.length?itemBlocks:'<div class="equip-empty">尚未购买道具，点右侧「添加」选择（消耗品不产生维护费）。</div>'}
  </div>`;

  const maintenanceTotal=weaponUpkeepTotal+customUpkeepTotal+equipUpkeep;
  // 财务卡片：三张卡的详情拆开写，便于维护
  const creditDetail=[
    `<div>基础额度：${f.base}</div>`,
    `<div>武器定制：${f.custom}${f.free?`（减免 ${f.free}）`:''}</div>`,
    `<div>装备花费：${f.spentEquip}${freeEquip?`（减免 ${freeEquip}）`:''}</div>`,
    `<div>道具花费：${f.spentItem}（不产生维护费）</div>`,
    hr,
    `<div><strong>剩余：${f.remaining}</strong></div>`
  ].join('');
  const upkeepDetail=[
    `<div>武器维护费：${weaponUpkeepTotal}</div>`,
    `<div>武器定制维护费：${customUpkeepTotal}${f.free?`（减免 ${f.free}）`:''}</div>`,
    `<div>装备维护费：${equipUpkeep}${freeEquip?`（减免 ${freeEquip}）`:''}</div>`,
    hr,
    `<div><strong>合计：${maintenanceTotal}</strong></div>`
  ].join('');
  const loanDetail=[
    `<div>已用贷款：${f.usedLoan}/200</div>`,
    `<div>利息：${f.interest}</div>`,
    hr,
    `<div>总额度：${f.total}（基础 ${f.base} + 贷款额度 200）</div>`
  ].join('');
  const financeCards=[
    {label:'信用点:',value:`${f.remaining}`,detail:creditDetail},
    {label:'维护费:',value:`${maintenanceTotal}`,detail:upkeepDetail},
    {label:'贷款额度:',value:`<span data-num-field="loan">${f.usedLoan}</span>/<span data-num-field="loanLimit">200</span>　利息:<span data-num-field="interest">${f.interest}</span>`,detail:loanDetail}
  ];
  window._financeCards=financeCards;

  window._resultCards=cards;
  $('#quiz-wrap').style.display='none';
  $('#nav-area').style.display='none';
  const wizardTitle=$('.container > h1');
  if(wizardTitle) wizardTitle.style.display='none';

  // 当前已有的初始能力（出身 + 领域），名字直接显示、右上角种类、右侧展开内容
  const initAbilities=[];
  if(ori&&ori.initialAbility) initAbilities.push(ori.initialAbility);
  doms.forEach(d=>{if(d.initialAbility) initAbilities.push(d.initialAbility);});
  const abilityRows=initAbilities.map(ab=>`
    <div class="ability-row">
      <div class="ability-tag-box">
        <span class="ability-name">${ab.name}</span>
        <span class="ability-type">${ab.type}</span>
      </div>
      <div class="ability-row-body">${ab.effect}</div>
    </div>`).join('');
  // 复制指令只读取这里的实际能力效果，不读取「能力系统」卡片里的待选能力
  window._abilityEffects=initAbilities.map(ab=>ab.effect||'');

  const box=$('#result-area');
  box.style.display='block';
  box.innerHTML=`<div class="card-name-bar" style="display:flex;align-items:center;gap:10px;margin:0 0 12px;">
      <label for="card-name-input" style="font-size:.9rem;font-weight:600;color:#475569;white-space:nowrap;">角色姓名</label>
      <input id="card-name-input" class="card-name-input" type="text" maxlength="40"
        placeholder="必填：给角色起个名字（复制命令要用）" value="${escCardText(window._cardName||'')}"
        style="flex:1;min-width:0;font-size:1rem;font-weight:600;padding:7px 12px;border:1px solid #f59e0b;border-radius:8px;background:#fffbeb;color:#92400e;outline:none;"
        onfocus="this.select()" oninput="window._cardName=this.value;window._updateCopyBtn&&window._updateCopyBtn()">
    </div>
    ${statsStripHtml({level:base.level,karma:base.karma,stamina:base.stamina,staminaMax:base.staminaMax,attr:base.attr},financeCards)}
    ${abilityRows}
    ${connRowHtml}
    ${weaponSectionHtml}
    ${equipSectionHtml}
    ${itemSectionHtml}
    <div class="result-grid">${cards.map((c,i)=>`
      <div class="result-card ${c.cls||''}" onclick="openDetail(${i})">
        <div class="result-label">${c.label}${c.rightLabel?`<span class="result-label-right">${c.rightLabel}</span>`:''}</div>
        <div class="result-value">${c.value}</div>
      </div>`).join('')}</div>
    <div class="sheet-btns" style="margin-top:14px;"><button class="sheet-btn" id="copy-all-btn" onclick="copyResult()">💾 保存角色卡</button><button class="sheet-btn" onclick="backToEdit()">↩️ 返回修改</button><button class="sheet-btn" onclick="showHome()">🏠 返回首页</button></div>
    <div id="name-warn" style="display:none;color:#dc2626;font-size:.85rem;margin-top:8px;text-align:center;">⚠️ 请先填写角色姓名，才能保存</div>`;

/* ============ HKTRPG Bot 角色卡指令生成 ============ */
const HK_DICE='2D6';
const HK_KARMA_SKILLS=['交涉','运动','察觉','潜行','情报','幸运'];
const HK_RESERVED=/^(name|state|roll|notes|char|add|edit|use|delete|show|set|cc|ccb|ccn|sc|ch)$/i;
const hkSafe=s=>String(s==null?'':s)
  .replace(/\r?\n/g,'。')
  .replace(/\[/g,'［').replace(/\]/g,'］')
  .replace(/~/g,'～').replace(/:/g,'：').replace(/;/g,'；')
  .trim();
const hkItem=s=>{
  let v=hkSafe(s).replace(/\s+/g,'').slice(0,16);
  if(!v) v='item';
  if(HK_RESERVED.test(v)) v='r_'+v;
  return v;
};
const hkNum=(v,d)=>{const n=parseFloat(v);return isNaN(n)?d:n;};
/* 读取结果页上用户可直接修改的数值（DOM 优先，回退到计算值） */
function readNumFields(){
  const base=computedBaseStats(), fin=finance();
  // 优先读取 prepareCardDom 生成的 .num-input 实时值（用户改过的数值），回退到计算值
  const read=(f,d)=>{
    const inp=$('.num-input[data-field="'+f+'"]');
    if(inp&&String(inp.value).trim()!=='') return hkNum(inp.value,d);
    return d;
  };
  const stam=read('stamina',base.stamina);
  const stamMax=read('staminaMax',base.staminaMax);
  return {
    attr:base.attr, level:read('level',base.level), karma:read('karma',base.karma),
    stamina:stam, staminaMax:Math.max(stam,stamMax),
    credit:read('credit',fin.remaining), upkeep:read('upkeep',0),
    loan:read('loan',fin.usedLoan),
    loanLimit:read('loanLimit',200),
    interest:read('interest',fin.interest)
  };
}
/* 把一段能力文本按句拆分，抽出判定修正到 out（就地累积） */
function extractModifiers(text,out){
  const sentences=String(text==null?'':text).split(/[。！?；;\n]+/).map(s=>s.trim()).filter(Boolean);
  const COND=/当|如果|每|以下|以上|产生|消耗|使用\d+点|到战斗结束|持续|暂时|直至|若|只要|战斗开始时|成功的话|受到「[^」]+」时/;
  const MOD_RE=/[「]?([+-]?\d+(?:D\d+)?)[」]?修正值/g;
  const modsOf=str=>[...String(str).matchAll(MOD_RE)].map(m=>m[1]);
  const pickMod=(mods,i)=>mods.length===1?mods[0]:(mods[i]||mods[mods.length-1]);
  const addSkill=(name,n,dice)=>{
    const k=String(name).trim(); if(!k) return;
    if(!out.skills[k]) out.skills[k]={n:0,dice:0};
    const v=parseFloat(n);
    if(dice) out.skills[k].dice+=(isNaN(v)?1:v); else if(!isNaN(v)) out.skills[k].n+=v;
  };
  const applyLevel=n=>{
    const v=parseFloat(n),dice=/D/i.test(n);
    if(dice) out.levelDice+=(isNaN(v)?1:v); else if(!isNaN(v)) out.level+=v;
  };
  for(const s of sentences){
    // 失误值 / 失误阈值、奇效值是本系统特有概念，优先归类（它们本身不是 +N 判定加值）
    if(/失误(值|阈值)/.test(s)&&/(降低|减少|增加)/.test(s)){out.fumble.push(s);continue;}
    if(/奇效值/.test(s)&&/(降低|减少|增加)/.test(s)){out.critical.push(s);continue;}
    // 条件型判定加值：整句原文保留，不再抽数值（避免条件不满足时数值虚高）
    if(COND.test(s)){out.conditional.push(s);continue;}
    // 可选修正（如「可以获得「-1」修正值」）整体进条件修正，不当作固定加值
    if(/可以获得[^。；;]{0,20}修正值/.test(s)){out.conditional.push(s);continue;}
    // 同一句可能有多个判定来源：先取走技能名，再用句中全部「修正值」配对（只有一个数值时应用到全部技能）
    let rest=s;
    const takeNames=rx=>{const arr=[...rest.matchAll(rx)].map(x=>x[1]);rest=rest.replace(rx,'');return arr;};
    let named=false,names,mods;
    // 业力判定（X）
    names=takeNames(/业力判定[（(]([^）)]+)[）)]/g);
    mods=modsOf(rest);
    if(names.length&&mods.length){names.forEach((name,i)=>{const n=pickMod(mods,i);addSkill(name,n,/D/i.test(n));});named=true;}
    // 无引号的场景限定等级判定：远外 / 远距离 / 反击
    if(!named){
      names=takeNames(/(远[～~-]外距离|远距离|反击)(?=[^。；;]{0,30}?等级判定)/g);
      mods=modsOf(rest);
      if(names.length&&mods.length){
        names.forEach((name,i)=>{const n=pickMod(mods,i);addSkill(/^远[～~-]外距离$/.test(name)?'远外':name,n,/D/i.test(n));});
        named=true;
      }
    }
    // 「X」相关等级判定
    if(!named){
      names=takeNames(/[「]([^」]+)[」][^。；;]{0,30}?等级判定/g);
      mods=modsOf(rest);
      if(names.length&&mods.length){names.forEach((name,i)=>{const n=pickMod(mods,i);addSkill(name,n,/D/i.test(n));});named=true;}
    }
    // 笼统等级判定（无技能名）
    if(!named){
      const levelCount=(rest.match(/等级判定/g)||[]).length;
      mods=modsOf(rest);
      if(levelCount&&mods.length){
        const picked=mods.length===1?Array(levelCount).fill(mods[0]):mods.slice(0,levelCount);
        picked.forEach(applyLevel);
      }
    }
    // 加值提取后继续走伤害/数值分类：同一句可同时包含加值与伤害变化
    // 伤害增减
    if(/伤害[^。；;]{0,10}?(增加|减少|\+)/.test(s)){out.damage.push(s);continue;}
    // 业力/耐力/信用点/维护费/贷款数值变化
    if(/(业力|耐力|信用点|维护费|贷款)/.test(s)&&/(增加|减少|降低|变为)/.test(s)){out.other.push(s);continue;}
    // 系统特有概念
    if(/GB|优势|重启|屏障|BS[:：]|缴械无效|伤害减轻|压制|突袭|潜行状态/.test(s)) out.other.push(s);
  }
}
/* 汇集所有需要扫描判定修正的文本来源 */
function collectModifierTexts(){
  const arr=[];
  const push=t=>{if(t)arr.push(String(t));};
  // 只扫描角色实际拥有的能力（结果卡顶部 ability-row）；「能力系统」里的条目只是待选项，不能算角色能力
  (window._abilityEffects||[]).forEach(push);
  // 人脉只扫描其效果本身，不扫描角色/获取方式说明
  const conn=connectionData.find(c=>c.label===answers.connection);
  if(conn) push(conn.effect);
  push(window._weaponCopyText);
  (answers.equipments||[]).forEach(n=>{const e=findEquipment(n);if(e)push(e.effect);});
  return arr;
}
function copyText(txt,msg){
  const done=()=>toast(msg||'已复制到剪贴板！');
  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';
    document.body.appendChild(ta);ta.focus();ta.select();
    let ok=false;try{ok=document.execCommand('copy');}catch(e){}
    ta.remove();
    ok?done():toast('复制失败，请手动选择文本复制');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(fallback);
  else fallback();
}
/* 主装配：生成 HKTRPG 单行角色卡指令 */
function buildHKTRPGCommand(){
  const n=readNumFields();
  const nameInput=$('#card-name-input');
  let name=nameInput&&nameInput.value!=null?nameInput.value:(window._cardName||'');
  name=hkSafe(String(name).trim()||'未命名').slice(0,40)||'未命名';

  const out={level:0,levelDice:0,skills:{},conditional:[],fumble:[],critical:[],damage:[],other:[]};
  collectModifierTexts().forEach(t=>extractModifiers(t,out));

  // state
  const state=[];
  const S=(k,v)=>state.push(hkSafe(k)+':'+hkSafe(v));
  const skillKeys=[...HK_KARMA_SKILLS,...Object.keys(out.skills).filter(k=>k&&!HK_KARMA_SKILLS.includes(k))];
  S('属性',n.attr); S('等级',n.level); S('业力',n.karma);
  S('耐力',n.stamina+'/'+n.staminaMax); S('信用点',n.credit); S('维护费',n.upkeep);
  S('贷款',n.loan+'/'+n.loanLimit); S('利息',n.interest);
  S('等级加值',out.level||0);
  skillKeys.forEach(k=>{
    const info=out.skills[k]||{n:0,dice:0};
    S(hkSafe(k)+'加值',info.n||0);
  });

  // roll：2D6 + 加值；6 种业力检定始终输出，即使没有加值
  const roll=[];
  let lvExpr=HK_DICE+(out.levelDice?'+'+out.levelDice+'D6':'')+'+{等级加值}';
  roll.push('等级:'+lvExpr);
  skillKeys.forEach(k=>{
    const info=out.skills[k]||{n:0,dice:0};
    const key=hkSafe(k)+'加值';
    const expr=HK_DICE+(info.dice?'+'+info.dice+'D6':'')+'+{'+key+'}';
    roll.push(hkItem('业力'+k)+':'+expr);
  });

  // 仅输出影响检定的 name / state / roll，不再带 notes
  return '.char add name['+name+']~ state['+state.join(';')+';]~ roll['+roll.join(';')+';]~';
}

/* ============ 导出独立角色卡 HTML ============ */
function buildCardPayload(){
  const f=finance();
  const gunNames=['手枪','突击步枪','狙击步枪'];
  const sysIds=finalSysIds();
  const selectedWeaponNames=[answers.weapon1,answers.weapon2].filter(Boolean).map(w=>w.className);
  const options={
    abilities:ABILITY_SYSTEMS.filter(sys=>sysIds.includes(sys.id)).flatMap(sys=>sys.abilities.map(str=>{
      const m=str.match(/^《(.+?)》（(.+?)）：(.*)$/);
      return m?{system:sys.name,name:m[1],type:m[2],effect:m[3]}:null;
    }).filter(Boolean)),
    customs:weaponData.flatMap(w=>w.subs.map(sub=>{const e=parseCustomEffect(w,sub);return {weapon:w.name,name:sub.name,price:sub.price,effect:sub.effect,desc:sub.desc,gun:gunNames.includes(w.name),applied:e.changes,range:e.range,damage:e.damage,note:e.note};})),
    equipments:equipmentData.flatMap(cat=>cat.items.map(it=>({category:cat.category,name:it.name,price:it.price,effect:it.effect,desc:it.desc}))),
    items:itemData.flatMap(tier=>tier.items.map(it=>({category:tier.category,name:it.name,price:it.price,effect:it.effect,desc:it.desc}))),
    contracts:[
      ...FAIRY_TABLE.map(x=>({kind:'妖精',name:x.name,sysText:x.sysText,feature:x.feature,nature:x.nature,source:x.source})),
      ...GOD_TABLE.map(x=>({kind:'神明',name:x.name,sysText:x.sysText,feature:x.feature,nature:x.nature,source:x.source}))
    ],
    connections:connectionData.map(c=>({label:c.label,role:c.role,effect:c.effect}))
  };
  return {
    resultCards:window._resultCards||[],
    financeCards:window._financeCards||[],
    options,
    freeCustomRemaining:hasDomain('神枪手')?Math.max(0,100-f.free):0,
    freeEquipRemaining:answers.origin==='人造人'?Math.max(0,100-f.spentEquip):0,
    selectedWeaponNames,
    runtimeState:window._cardRuntimeState?window._cardRuntimeState():null
  };
}
function cardDataText(payload){
  return JSON.stringify(payload).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');
}
function ensureCardData(){
  const payload=buildCardPayload();
  const tag=$('#card-data');
  if(tag) tag.textContent=cardDataText(payload);
  return payload;
}
// 导出独立角色卡 HTML（携带当前状态，打开后可继续编辑）
/* 生成完整独立角色卡 HTML 字符串（与旧导出完全一致，只是不下载） */
function buildStandaloneCardHTML(){
  syncEdits();
  const box=$('#result-area');
  if(!box||box.style.display==='none'||!box.innerHTML.trim()) return '';
  syncEdits();
  if(window.prepareCardDom) window.prepareCardDom(box);
  if(window.initCardRuntime) window.initCardRuntime();
  ensureCardData();

  // 从主文件当前 DOM 裁出：保留样式、结果页、添加弹窗与共用卡片脚本，去掉问卷引导
  const clone=document.documentElement.cloneNode(true);
  ['#quiz-container','#nav-area','#debug-btn','#save-edit-btn','#toast','#home-view','#quiz-wrap'].forEach(sel=>{
    const el=clone.querySelector(sel);
    if(el) el.remove();
  });
  const wizardTitle=clone.querySelector('.container > h1');
  if(wizardTitle) wizardTitle.remove();
  clone.querySelectorAll('script').forEach(tag=>{
    if(tag.id!=='card-data'&&tag.id!=='card-runtime') tag.remove();
  });
  const result=clone.querySelector('#result-area');
  if(result){
    result.style.display='block';
    result.querySelectorAll('.sheet-btns').forEach(el=>el.remove());
    result.querySelectorAll('[onclick]').forEach(el=>el.removeAttribute('onclick'));
    result.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
    // 把当前输入的姓名写回克隆节点（cloneNode 不复制 input 的实时 value）
    const liveName=$('#card-name-input');
    const cloneName=result.querySelector('#card-name-input');
    if(liveName&&cloneName){
      cloneName.setAttribute('value',liveName.value);
      cloneName.removeAttribute('onfocus');
      cloneName.removeAttribute('oninput');
    }
  }
  clone.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  const bodyEl=clone.querySelector('body');
  if(bodyEl) bodyEl.setAttribute('data-card-export','1');
  const title=clone.querySelector('title');
  if(title) title.textContent='角色卡';
  const style=clone.querySelector('style');
  if(style) style.textContent+='\n#result-area{display:block!important;}#quiz-container,#nav-area{display:none!important;}body{padding:20px;}';
  return '<!DOCTYPE html>\n'+clone.outerHTML;
}
function exportResultHTML(){
  const html=buildStandaloneCardHTML();
  if(!html){toast('请先生成角色卡');return;}
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const rawName=($('#card-name-input')?$('#card-name-input').value:window._cardName)||'';
  const safeName=String(rawName).trim().replace(/[\\/:*?"<>|]/g,'').trim();
  a.download='角色卡'+(safeName?'-'+safeName:'')+'.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('角色卡已导出为 HTML 文件');
}

/* ============ 调试模式：全页面文本可直接编辑 + 保存写回 HTML ============ */
// 可编辑范围：页面上所有「直接含文字」的元素（标题/说明/按钮文字/选项/结果……），
// 排除 script/style。动态渲染后由 render/showResult/openDetail 重新调用。
function applyEditable(root=document){
  if(!document.body.classList.contains('debug-mode')) return;
  const scope=(root&&root.nodeType===1)?root:document.body;
  const els=[scope,...scope.querySelectorAll('*')];
  els.forEach(el=>{
    if(!el||el.nodeType!==1) return;
    const tag=el.tagName.toLowerCase();
    if(tag==='script'||tag==='style') return;
    // summary 不能设为 contenteditable：可编辑后会变成选中文本，折叠条点不开
    if(tag==='summary') return;
    // textarea / input 自带输入机制，不套 contenteditable，避免 oninput 实时存值被干扰
    if(tag==='textarea'||tag==='input') return;
    // 排除调试控制按钮本身，避免误编辑导致无法保存/退出
    if(el.id==='debug-btn'||el.id==='save-edit-btn') return;
    // 直接包含非空文本节点才设为可编辑；按钮文字、span、div 全都覆盖
    const hasOwnText=[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim().length>0);
    if(hasOwnText){
      if(!el.hasAttribute('data-edit-orig')) el.setAttribute('data-edit-orig',el.textContent);
      if(el.contentEditable!=='true') el.setAttribute('contenteditable','true');
    }
  });
}
// 复制前把编辑过的卡片摘要/详情同步回数据，保证「复制全部」拿到修改后的文本
function syncEdits(){
  const box=$('#result-area');
  const readVal=el=>{
    if(!el) return '';
    const ins=el.querySelectorAll('.num-input');
    if(ins.length) return [...ins].map(i=>i.value).join('/');
    const t=el.innerText!=null?el.innerText:el.textContent;
    return (t||'').trim();
  };
  if(box&&box.style.display!=='none'){
    $$('.result-card:not([data-runtime-added])',box).forEach((card,i)=>{
      const c=window._resultCards[i];
      const v=$('.result-value',card);
      if(c) { const t=readVal(v); if(t) c.value=t; }
    });
    $$('.base-stat-item.clickable',box).forEach((item,i)=>{
      const c=(window._financeCards||[])[i];
      const v=$('.base-stat-value',item);
      if(c) { const t=readVal(v); if(t) c.value=t; }
    });
  }
  if(window._currentDetailIdx!=null){
    const list=window._currentDetailList||window._resultCards;
    const c=list[window._currentDetailIdx];
    const mc=$('#modal-content');
    if(c&&mc) c.detail=mc.innerHTML;
  }
}
function toggleEditMode(){
  const on=document.body.classList.toggle('debug-mode');
  if(on){
    applyEditable();
    $('#save-edit-btn').style.display='inline-block';
  }else{
    syncEdits();
    $$('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
    $('#save-edit-btn').style.display='none';
  }
}

// 默认关闭调试态：清掉源码里残留的可编辑属性
