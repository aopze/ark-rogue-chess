<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟战棋</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; background:#14142b; color:#eef0ff;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent; overflow:hidden; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }

  /* ===== 游戏视图（打开即在这里，不再有主页） ===== */
  #gameWrap { position:fixed; inset:0; background:#1a1a2e; }
  #game { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color:#eee; font-size:15px; background:#1a1a2e; z-index:5; }
  #ghint { position:fixed; left:50%; transform:translateX(-50%); top:12px; z-index:6; padding:7px 14px;
    border-radius:18px; font-size:12px; background:rgba(20,22,44,.82); color:#cfd2ff;
    border:1px solid rgba(255,255,255,.12); max-width:80%; text-align:center; }

  /* ===== 左边缘把手（ISSUE-20261028-10 B1/B5） =====
     2026-10-29 02:0x 人类：「再删掉金色的旧侧边栏排行榜按钮」→ 整块删除。
     入口只剩游戏棋盘左上角的 ♟ 角标（ISSUE-20261029-21），开合靠 postMessage。 */

  #lobbyMask { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.45);
    opacity:0; pointer-events:none; transition:opacity .2s ease-out; }
  #lobbyMask.on { opacity:1; pointer-events:auto; }

  /* ===== 账号与排行榜面板（宽 ≤78vw / 桌面 ≤320px） =====
     ★ ISSUE-20261029-29（人类 04:42）：「账号按钮也一样」—— 与游戏内设置面板统一，
       弹窗改为**覆盖棋盘格**：位置/尺寸由游戏 iframe 上报的棋盘矩形决定（JS 写 style），
       视觉上就是「地图原地变成账号面板」。
     ★ 显隐机制同步换掉：原来是 translateX(-100%) 从左侧滑入，
       现在左边是棋盘而不是屏幕边缘，平移会露出半张地图；改用 opacity + visibility 淡入。
       没收到矩形（老版本 game.html / 上报失败）时退回原来的左侧满高布局，不僵死。 */
  #lobbyDrawer { position:fixed; left:0; top:0; bottom:0; z-index:90;
    width:min(320px, 78vw); display:flex; flex-direction:column; outline:none;
    background:#14142b; border:1px solid rgba(255,255,255,.12);
    box-shadow:12px 0 32px rgba(0,0,0,.5);
    opacity:0; visibility:hidden; transform:scale(.985);
    transition:opacity .18s ease-out, transform .18s ease-out, visibility .18s; }
  #lobbyDrawer.on { opacity:1; visibility:visible; transform:none; }
  /* 2026-10-29 人类 01:42：删掉 header 里那个小 ✕，标题挪到顶部右侧；
     关闭改由「与 ♟ 入口角标同位置、同尺寸」的按钮负责（左上角），视觉上等于 ♟ 原地变成 ✕。 */
  .dhead { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:12px 12px 10px 56px;
    border-bottom:1px solid rgba(255,255,255,.08); justify-content:flex-end; }
  .dtitle { font-size:14px; font-weight:800; letter-spacing:1px; color:#ffd166; }
  /* 角标尺寸对齐 ♟（棋盘左上格）：写死 36×36 是因为外壳读不到 iframe 里的 --cell；
     与游戏内 .drawer-corner-x 保持同一套视觉语言（深底 / 细边 / 方角 / 同字重） */
  .dcorner { position:absolute; left:10px; top:10px; z-index:2;
    width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;
    border-radius:3px; border:1px solid #3a3a55; background:rgba(24,24,42,.9); color:#cfe6ff;
    font-size:18px; line-height:1; cursor:pointer; font-family:inherit;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4); }
  .dcorner:hover { background:rgba(48,48,72,.95); color:#fff; }
  .dcorner:active { transform:scale(.92); }
  .dbody { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:12px; display:flex; flex-direction:column; gap:12px; }

  /* 账号卡 */
  .acct { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .acct-top { display:flex; gap:10px; align-items:center; }
  .avatar { width:44px; height:44px; flex:0 0 44px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:22px; background:linear-gradient(135deg,#2b2e55,#3a2f63);
    border:1px solid rgba(255,209,102,.3); }
  .acct-mid { flex:1; min-width:0; }
  .pnameLine { font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pstats { margin-top:3px; font-size:11.5px; color:#9aa0c0; line-height:1.45; }
  .pstats b { color:#ffd166; font-size:13px; }
  .edit { flex:0 0 auto; padding:7px 12px; font-size:12px; font-weight:700; border-radius:9px;
    background:rgba(255,255,255,.08); color:#cfd2ff; border:1px solid rgba(255,255,255,.16); cursor:pointer; font-family:inherit; }
  .edit:active { transform:scale(.96); }
  .acct-edit { display:flex; gap:8px; align-items:center; }
  .pname { flex:1; min-width:0; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.16);
    color:#fff; border-radius:10px; padding:9px 11px; font-size:14px; font-weight:600; outline:none; font-family:inherit; }
  .pname:focus { border-color:#ffd166; }
  .psave { flex:0 0 auto; background:#ffd166; color:#3a2a00; border:0; border-radius:10px;
    padding:9px 14px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; }
  .psave:active { transform:scale(.96); }
  .perr { font-size:12px; color:#ff8a8a; line-height:1.5; }
  .acct-note { font-size:11px; color:#7d83a8; line-height:1.6; }
  .acct-note b { color:#ffd166; font-weight:700; }

  /* 排行榜 */
  .rankhd { display:flex; justify-content:space-between; align-items:center; font-size:13px; font-weight:700; }
  .rankhd .meta { font-size:11px; color:#9aa0c0; font-weight:400; }
  ol#miniBoard { list-style:none; margin:0; padding:0; }
  ol#miniBoard li { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:8px 10px; margin-bottom:6px; }
  ol#miniBoard li.me { border-color:#3ddc84; box-shadow:0 0 0 1px rgba(61,220,132,.3) inset; }
  .rk { width:24px; height:24px; flex:0 0 24px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:12px; font-weight:700; background:rgba(255,255,255,.08); color:#9aa0c0; }
  ol#miniBoard li:nth-child(1) .rk { background:#ffd166; color:#3a2a00; }
  ol#miniBoard li:nth-child(2) .rk { background:#cfd6e6; color:#2c3244; }
  ol#miniBoard li:nth-child(3) .rk { background:#d9a066; color:#3a2400; }
  .who { flex:1; min-width:0; }
  .nm { font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .me .nm { color:#3ddc84; }
  .sc { font-size:11px; color:#9aa0c0; margin-top:1px; }
  .lv { font-size:12.5px; font-weight:700; color:#ffd166; white-space:nowrap; }
  .tag { font-size:9px; background:#3ddc84; color:#063; padding:1px 5px; border-radius:6px; margin-left:5px; vertical-align:middle; }
  .empty { text-align:center; color:#9aa0c0; padding:20px 10px; font-size:12.5px; line-height:1.7; }
  .ghost { display:block; width:100%; background:rgba(255,255,255,.06); color:#cfd2ff;
    border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:11px;
    font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .ghost:active { transform:scale(.98); }

  /* ===== 顶部提示条 ===== */
  #hint { position:fixed; left:0; right:0; top:0; z-index:9999; padding:9px 12px; font-size:13px;
    line-height:1.5; font-family:inherit; background:#8a5a00; color:#fff; text-align:center; }
  #hint.ok { background:#1f6f3f; }
  #hint.hide { display:none; }
  #toast { position:fixed; left:50%; bottom:14%; transform:translateX(-50%); z-index:9999; max-width:86%;
    padding:12px 16px; border-radius:10px; font-size:14px; line-height:1.6; background:rgba(0,0,0,.82);
    color:#fff; text-align:center; display:none; white-space:pre-line; }

  /* ===== 完整排行榜浮层（复用，不改视觉）===== */
  #rankPanel { position:fixed; inset:0; z-index:10000; display:none; background:rgba(8,9,20,.94); }
  #rankPanel.open { display:block; }
  #rankPanel iframe { position:absolute; left:0; top:0; width:100%; height:100%; border:0; }
  #rankClose { position:absolute; right:12px; top:12px; z-index:10001;
    width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center;
    border-radius:9px; border:1px solid #3a3a55; background:rgba(24,24,42,.96); color:#cfe6ff;
    font-size:16px; line-height:1; font-family:inherit; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.45); }
  #rankClose:active { transform:scale(.94); }
</style>

<body>

<!-- ===== 游戏视图：打开即落进 game.html 的选角大厅（ISSUE-20261028-10 A1/A2） ===== -->
<div id="gameWrap" class="screen">
  <div id="loading">游戏加载中…</div>
  <div id="ghint" class="hide"></div>
  <iframe id="game" src="" onload="onGameLoad()"></iframe>
</div>

<!-- 账号与排行榜入口：游戏内棋盘左上格的 ♟ 角标（postMessage 'ark_open_lobby'），外壳不再挂左边缘把手 -->

<div id="lobbyMask"></div>

<!-- 左侧抽屉：① 我的账号 ② 排行榜 Top10 ③ 完整榜入口 -->
<aside id="lobbyDrawer" tabindex="-1" aria-hidden="true" aria-label="账号与排行榜">
  <button id="lobbyCornerClose" class="dcorner" title="关闭">✕</button>

    <span class="dtitle">账号与排行</span>
  </header>

<div id="hint" class="hide"></div>

<!--
  成绩上报钩子源码（type=text/plain 不会被浏览器执行，仅作为文本被注入到游戏 iframe 中）。
  它通过轮询游戏的顶层变量判定「游戏结束」并上报，与具体游戏版本解耦：
  只要游戏仍用 phase / level / enemies 这三个变量名，换 HTML 内容也无需改动此处。
  kills 语义 = 整局累计击杀（跨关累计、重开清零）。
-->
<script id="hooksrc" type="text/plain">
(function () {
  var sent = false;
  var prevEnemies = null;
  var prevDead = 0;
  var carry = 0;
  var prevLevel = 0;

  function collect() {
    var p = (typeof phase !== 'undefined') ? phase : null;
    var lvl = (typeof level !== 'undefined') ? level : 0;
    var en = (typeof enemies !== 'undefined') ? enemies : null;

    if (prevEnemies !== null && en !== prevEnemies) { carry += prevDead; prevDead = 0; }
    if (lvl < prevLevel) { carry = 0; prevDead = 0; }
    prevLevel = lvl;

    var dead = (en && en.filter) ? en.filter(function (e) { return !e.alive; }).length : 0;
    prevEnemies = en;
    prevDead = dead;
    return { phase: p, level: lvl, kills: carry + dead };
  }

  function tick() {
    try {
      var s = collect();
      if (s.phase === 'gameover') {
        if (!sent) {
          sent = true;
          parent.postMessage({ type: 'rogue_score', level: s.level, kills: s.kills }, '*');
        }
      } else { sent = false; }
    } catch (e) {}
    setTimeout(tick, 300);
  }
  setTimeout(tick, 300);
})();
</script>

<script>
// ===== Telegram 入口能力判定 =====
var W = (window.Telegram && window.Telegram.WebApp) || null;
var HAS_SDK = !!W;
var HAS_INIT = !!(W && W.initData);
// 注意：普通浏览器里 telegram-web-app.js 也会注入 WebApp，但 platform === 'unknown'
// 且 sendData 是空壳。不排除这种情况会导致「提示已提交、实际没记录」。
var IN_TG = HAS_SDK && W.platform !== 'unknown';
var CAN_REPORT = IN_TG && !HAS_INIT;            // 键盘按钮入口：sendData 可用
var IS_WEB = !HAS_INIT;                         // 没有 initData（含纯浏览器）→ 走设备身份

// ===== 全局状态 =====
var APP = {
  data: null,            // leaderboard.json 内容
  myId: 0,               // 我的 Telegram user id（菜单/内联入口才有）
  myName: '',            // 显示名（公开用：榜单、账号卡）
  myAccount: '',         // 完整账号 = 显示名 + 数字口令（只在编辑时回填，绝不进公开数据）
  isNewAccount: false,   // 本次是否自动生成（用于提示补口令）
  reportUrl: '',
  botUser: ''
};
var MY_SCORE = null;

// 构建号：每次发布 game.html 时同步改这里，iframe 用 ?v=BUILD 强制拿新版本
var BUILD = '10291647';

var REPORT_URL_FALLBACK = '';
var BOT_USER_FALLBACK = 'yu7_bot';

var ACCT_KEY = 'ark_account';        // 完整账号串（含数字口令），只存本机
var NAME_KEY = 'ark_player_name';    // 显示名（兼容旧字段与上报）
/* 账号格式（ISSUE-20261028-10 C1）：显示名 1–12 个汉字或英文字母 + 数字口令 4–8 位 */
var ACCT_RE = /^([\u4e00-\u9fa5A-Za-z]{1,12})(\d{4,8})$/;

function $(id){ return document.getElementById(id); }

function showHint(text, ok){
  var h = $('hint'); if(!h) return;
  h.textContent = text; h.className = ok ? 'ok' : '';
}
function hideHint(){ var h = $('hint'); if(h) h.className = 'hide'; }
function toast(text, ms){
  var t = $('toast'); if(!t) return;
  t.textContent = text; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display='none'; }, ms||6000);
}

// ===== 账号解析 / 校验（失败必须给具体原因，绝不静默截断）=====
function parseAccount(raw){
  var s = String(raw == null ? '' : raw).trim();
  if (!s) return { ok:false, reason:'请输入「名字 + 4–8 位数字口令」，例如 阿米娅1234' };
  if (/\s/.test(s)) return { ok:false, reason:'不能包含空格：名字后面直接跟数字' };
  if (/^\d+$/.test(s)) return { ok:false, reason:'名字不能全是数字：开头请用汉字或英文字母' };
  var m = s.match(ACCT_RE);
  if (m) return { ok:true, name:m[1], code:m[2] };
  // 逐条给原因，比一句「格式不对」有用得多
  var tail = s.match(/(\d+)$/);
  var head = tail ? s.slice(0, s.length - tail[1].length) : s;
  if (!/[\u4e00-\u9fa5A-Za-z]/.test(head)) return { ok:false, reason:'名字只能用汉字或英文字母' };
  if (/\d/.test(head)) return { ok:false, reason:'数字只能放在最后当口令，不能夹在名字里' };
  if (head.length > 12) return { ok:false, reason:'名字最多 12 个字' };
  if (!tail) return { ok:false, reason:'结尾需要 4–8 位数字口令（例如 阿米娅1234）' };
  if (tail[1].length < 4) return { ok:false, reason:'数字口令至少 4 位' };
  if (tail[1].length > 8) return { ok:false, reason:'数字口令最多 8 位' };
  return { ok:false, reason:'格式是「名字 + 4–8 位数字」，中间不要加字符' };
}

function displayNameOf(acct){
  var p = parseAccount(acct);
  return p.ok ? p.name : '';
}

function showErr(msg){
  var e = $('pErr'); if (!e) return;
  e.textContent = msg || '';
  e.hidden = !msg;
}
function hideErr(){ showErr(''); }

// ===== 本机账号 =====
function loadAccount(){
  try { APP.myAccount = localStorage.getItem(ACCT_KEY) || ''; } catch(e){ APP.myAccount = ''; }
  // 兼容：老版本只存了 ark_player_name（可能没有数字口令）
  if (!APP.myAccount) {
    var legacy = '';
    try { legacy = localStorage.getItem(NAME_KEY) || ''; } catch(e){}
    if (legacy && parseAccount(legacy).ok) APP.myAccount = legacy;
  }
  if (!APP.myAccount) {
    // 首次进入：自动生成「玩家 + 4 位数字」（ISSUE-20261028-10 C4）
    var code = String(1000 + Math.floor(Math.random() * 9000));
    APP.myAccount = '玩家' + code;
    APP.isNewAccount = true;
    saveAccount(APP.myAccount);
  }
  APP.myName = displayNameOf(APP.myAccount);
}
function saveAccount(acct){
  APP.myAccount = acct;
  APP.myName = displayNameOf(acct) || APP.myName;
  try {
    localStorage.setItem(ACCT_KEY, acct);
    if (APP.myName) localStorage.setItem(NAME_KEY, APP.myName);
  } catch(e){}
}

// ===== 设备身份（网页直接打开时用，替代 initData）=====
function deviceId(){
  var k = 'ark_device_id';
  try {
    var v = localStorage.getItem(k);
    if(v && v.length >= 8) return v;
    var id = '';
    if(window.crypto && crypto.randomUUID){ id = crypto.randomUUID().replace(/-/g,''); }
    else {
      var s = 'abcdef0123456789';
      for(var i=0;i<32;i++) id += s.charAt(Math.floor(Math.random()*16));
    }
    localStorage.setItem(k, id);
    return id;
  } catch(e){ return ''; }
}

// ===== 读取排行榜数据 =====
function loadConfig(cb){
  fetch('leaderboard.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      APP.data = d || APP.data;
      if(APP.data){
        APP.reportUrl = APP.data.report_url || REPORT_URL_FALLBACK || '';
        APP.botUser = APP.data.bot_username || BOT_USER_FALLBACK || APP.botUser || '';
        if(onOurDomain()) APP.reportUrl = location.origin + '/api/score';
      }
      if(cb) cb();
    })
    .catch(function(){ if(cb) cb(); });
}

// ===== 实时榜单 =====
function onOurDomain(){
  var h = (location.hostname || '').toLowerCase();
  return h === 'arkroguelike.top' || /\.arkroguelike\.top$/.test(h);
}
function apiBase(){
  if(onOurDomain()) return location.origin;
  var u = APP.reportUrl || '';
  return u.replace(/\/api\/score\/?$/i, '');
}
function applyBoard(d){
  if(!d || !d.entries) return false;
  APP.data = {
    updated_at: d.updated_at || Math.floor(Date.now()/1000),
    entries: d.entries,
    bot_username: d.bot_username || APP.botUser || BOT_USER_FALLBACK,
    report_url: d.report_url || APP.reportUrl
  };
  if(d.report_url && !onOurDomain()) APP.reportUrl = d.report_url;
  if(d.bot_username) APP.botUser = d.bot_username;
  return true;
}
function paintBoard(){
  renderMiniBoard(); renderPlayer();
  pushSnapshot(); pushApiBase();
}
function refreshBoard(){
  var b = apiBase();
  if(!b){ loadConfig(paintBoard); return; }
  fetch(b + '/api/leaderboard?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if(applyBoard(d)) paintBoard();
      else loadConfig(paintBoard);
    })
    .catch(function(){ loadConfig(paintBoard); });
}

// ===== 我的身份 =====
function resolveMyId(){
  if(HAS_INIT && W.initDataUnsafe && W.initDataUnsafe.user){
    APP.myId = W.initDataUnsafe.user.id || 0;
  } else {
    var dev = deviceId();
    APP.myId = dev ? ('dev_' + dev) : 0;
  }
}

/* 公开显示名：老数据可能把口令写在名字里（例如 阿米娅1234），公开位置一律剥掉 4–8 位纯数字尾巴。
 * 这条只影响显示，不回写 leaderboard.json（那是 bot 的事）。 */
function publicName(raw){
  var s = String(raw == null ? '' : raw);
  var stripped = s.replace(/\d{4,8}$/, '');
  return stripped || s;
}
/* 同名序号（ISSUE-20261028-10 风险 2 的可选缓解）：两个「阿米娅」在榜上显示 阿米娅 / 阿米娅 ·2。
 * 序号是公开可推算的，不是口令。 */
function withDisplayNames(list){
  var seen = {};
  return list.map(function(u){
    var n = publicName(u.name) || '匿名';
    seen[n] = (seen[n] || 0) + 1;
    return { u: u, disp: seen[n] > 1 ? (n + ' ·' + seen[n]) : n };
  });
}

// ===== 渲染账号卡 =====
function renderPlayer(){
  var line = $('pNameLine');
  if (line) line.textContent = APP.myName || '玩家';
  var stats = $('pStats');
  var me = findMe();
  if (stats) {
    if (me) {
      stats.innerHTML = '最深层数 <b>' + (me.best_level||0) + '</b> · 累计击杀 <b>' + (me.best_kills||0) + '</b> · 游玩 <b>' + (me.runs||0) + '</b> 次';
    } else {
      stats.textContent = APP.isNewAccount ? '新账号，开一局就上榜 ✦' : '这条账号还没上过榜，开一局就有了 ✦';
    }
  }
}
function findMe(){
  if(!APP.data || !APP.data.entries) return null;
  var list = APP.data.entries;
  if(APP.myId){ for(var i=0;i<list.length;i++){ if(String(list[i].id)===String(APP.myId)) return list[i]; } }
  if(APP.myName){ for(var j=0;j<list.length;j++){ if(publicName(list[j].name)===APP.myName) return list[j]; } }
  return null;
}

// ===== 渲染迷你排行榜（只显示显示名）=====
function renderMiniBoard(){
  var raw = (APP.data && APP.data.entries) ? APP.data.entries.slice().sort(function(a,b){
    if((b.level||0)!==(a.level||0)) return (b.level||0)-(a.level||0);
    return (b.kills||0)-(a.kills||0);
  }) : [];
  var list = withDisplayNames(raw);
  var ol = $('miniBoard'), empty = $('boardEmpty'), meta = $('boardMeta');
  if (!ol) return;
  ol.innerHTML = '';
  if(!list.length){ if(empty) empty.hidden = false; if(meta) meta.textContent=''; return; }
  if(empty) empty.hidden = true;
  if(APP.data && APP.data.updated_at && meta){
    var dt = new Date(APP.data.updated_at*1000);
    function p(n){ return n<10?'0'+n:''+n; }
    meta.textContent = '更新 ' + (dt.getMonth()+1) + '-' + p(dt.getDate()) + ' ' + p(dt.getHours())+':'+p(dt.getMinutes());
  }
  list.slice(0,10).forEach(function(item,i){
    var u = item.u;
    var isMe = (APP.myId && String(u.id)===String(APP.myId)) || (APP.myName && item.disp === APP.myName);
    var li = document.createElement('li'); if(isMe) li.className='me';
    var rk = document.createElement('div'); rk.className='rk'; rk.textContent=(i+1);
    var who = document.createElement('div'); who.className='who';
    var nm = document.createElement('div'); nm.className='nm'; nm.textContent = item.disp;
    if(isMe){ var tag=document.createElement('span'); tag.className='tag'; tag.textContent='我'; nm.appendChild(tag); }
    var sc = document.createElement('div'); sc.className='sc'; sc.textContent='击杀 '+(u.kills||0)+' · 挑战 '+(u.runs||1)+' 次';
    who.appendChild(nm); who.appendChild(sc);
    var lv = document.createElement('div'); lv.className='lv'; lv.textContent='第 '+(u.level||0)+' 层';
    li.appendChild(rk); li.appendChild(who); li.appendChild(lv);
    ol.appendChild(li);
  });
}

// ===== 账号编辑 =====
function toggleEdit(open){
  var box = $('acctEdit');
  if (!box) return;
  box.hidden = !open;
  if (open) {
    var inp = $('pName');
    if (inp) { inp.value = APP.myAccount; inp.focus(); inp.select && inp.select(); }
    hideErr();
  }
}
function syncName(){
  var raw = $('pName') ? $('pName').value : '';
  var p = parseAccount(raw);
  if (!p.ok) { showErr(p.reason); return; }
  hideErr();
  var acct = p.name + p.code;
  var changed = acct !== APP.myAccount;
  saveAccount(acct);
  APP.isNewAccount = false;
  renderPlayer();
  toggleEdit(false);
  if (!changed) { toast('账号未变', 2500); return; }
  postRename(p.name, p.code);
}
/* 改名上报：口令只发给 bot（HTTPS），bot 侧负责「按账号建/改记录、只把显示名写进公开 JSON」。
 * 旧 bot 会忽略未知字段，此时前端只是本机记住 —— 跨设备认领需要 bot 同步改（见 issue 外部依赖）。 */
function postRename(name, code){
  if(CAN_REPORT && W && W.sendData){
    try { W.sendData(JSON.stringify({type:'rename', name:name, account:name+code})); toast('✅ 账号已保存，回聊天确认同步', 4000); return; }
    catch(e){ toast('账号已在本机保存', 3000); return; }
  }
  if(APP.reportUrl && (HAS_INIT || IS_WEB)){
    var body = {kind:'rename', name:name, account:name+code, code:code};
    if(HAS_INIT){ body.initData = W.initData; }
    else { body.device = deviceId(); }
    fetch(APP.reportUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.ok){ toast('✅ 账号已同步到排行榜', 4000); refreshBoard(); }
      else toast('账号已在本机保存（同步失败）', 4000);
    }).catch(function(){ toast('账号已在本机保存（同步失败）', 4000); });
  } else {
    toast('账号已在本机保存', 3000);
  }
}

// ===== 成绩上报（多通道）=====
function reportScore(level, kills){
  MY_SCORE = {level:level, kills:kills};
  pushMyScore();
  if(CAN_REPORT && W && W.sendData){
    W.sendData(JSON.stringify({type:'rogue_score', level:level, kills:kills, tg_id:0, tg_name:APP.myName||'', initData:''}));
    toast('📊 成绩已提交：第 '+level+' 层 / 击杀 '+kills+'\n点棋盘左上角 ♟ 可看排行榜', 5000);
    return;
  }
  if(APP.reportUrl && (HAS_INIT || IS_WEB)){
    var body = {kind:'score', level:level, kills:kills, name:APP.myName||'', account:APP.myAccount||''};
    if(HAS_INIT){ body.initData = W.initData; }
    else {
      var dev = deviceId();
      if(!dev){ toast('⚠️ 浏览器禁用了本地存储，无法识别身份。\n请在 Telegram 内打开。', 9000); return; }
      body.device = dev;
    }
    fetch(APP.reportUrl, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.ok){
        toast('📊 成绩已记录：第 '+level+' 层 / 击杀 '+kills+'\n点棋盘左上角 ♟ 可看排行榜', 5000);
        if(j.leaderboard && applyBoard(j.leaderboard)) paintBoard();
        else refreshBoard();
        setTimeout(refreshBoard, 3000);
      } else if(HAS_INIT){ deepLinkScore(level, kills); }
      else { toast('⚠️ 成绩记录失败（服务器拒绝了请求）。\n稍后再打一局试试。', 8000); }
    }).catch(function(){
      if(HAS_INIT){ deepLinkScore(level, kills); }
      else { toast('⚠️ 连不上成绩服务器。\n确认 bot 正在运行后重试。', 8000); }
    });
    return;
  }
  if(HAS_INIT && APP.botUser){
    deepLinkScore(level, kills);
    return;
  }
  if(IN_TG){
    toast('⚠️ 当前入口无法回传成绩。\n用 /play 的键盘按钮重开一局即可记录。', 9000);
  } else if(!APP.reportUrl){
    toast('⚠️ 成绩服务器地址还没加载到（bot 可能没启动）。\n你的成绩：第 '+level+' 层 / 击杀 '+kills, 8000);
  } else {
    toast('🌐 浏览器预览模式，成绩不会记录。\n（你的成绩：第 '+level+' 层 / 击杀 '+kills+'）', 7000);
  }
}
function deepLinkScore(level, kills){
  try {
    var bot = APP.botUser || BOT_USER_FALLBACK;
    if(!bot){
      toast('⚠️ 未配置 bot 用户名，无法回传成绩。\n用 /play 的键盘按钮重开一局即可记录。', 9000);
      return;
    }
    var dl = 'https://t.me/' + bot + '?start=score:' + level + '_' + kills;
    if(W && W.openTelegramLink){ W.openTelegramLink(dl); }
    else { window.location.href = dl; }
    toast('📊 正在记录成绩…（已切到聊天）\n点机器人回复里的 /rank 看排行榜', 5000);
  } catch(e){
    toast('⚠️ 当前入口无法回传成绩。\n用 /play 的键盘按钮重开一局即可记录。', 9000);
  }
}

// ===== 排行榜浮层 =====
function openRank(){
  var p = $('rankPanel'); if(!p) return;
  p.classList.add('open');
  var f = $('rankFrame');
  if(f) f.src = 'leaderboard.html?t=' + Date.now();
  pushMyScore();
  pushSnapshot();
  pushApiBase();
}
function closeRank(){ var p=$('rankPanel'); if(p) p.classList.remove('open'); }
function pushMyScore(){
  if(!MY_SCORE) return;
  try { var f=$('rankFrame'); if(f && f.contentWindow) f.contentWindow.postMessage({type:'my_score', level:MY_SCORE.level, kills:MY_SCORE.kills}, '*'); } catch(e){}
  try { var f2=$('rankFrame'); if(f2 && f2.contentWindow && APP.myId) f2.contentWindow.postMessage({type:'my_id', id:APP.myId}, '*'); } catch(e){}
}
function pushMyId(){
  try { var f=$('rankFrame'); if(f && f.contentWindow && APP.myId) f.contentWindow.postMessage({type:'my_id', id:APP.myId}, '*'); } catch(e){}
}
function pushSnapshot(){
  if(!APP.data || !APP.data.entries) return;
  try { var f=$('rankFrame'); if(f && f.contentWindow) f.contentWindow.postMessage({type:'board', data:APP.data}, '*'); } catch(e){}
}
function pushApiBase(){
  var b = apiBase(); if(!b) return;
  try { var f=$('rankFrame'); if(f && f.contentWindow) f.contentWindow.postMessage({type:'api_base', base:b}, '*'); } catch(e){}
}

// ===== 游戏 iframe 加载 + 注入钩子 =====
function onGameLoad(){
  var l = $('loading'); if(l) l.remove();
  try { injectHook(); } catch(e){}
}
function injectHook(){
  var f = $('game');
  var d = f.contentDocument || (f.contentWindow && f.contentWindow.document);
  if(!d || !d.body) return;
  var s = d.createElement('script');
  s.textContent = $('hooksrc').textContent;
  d.body.appendChild(s);
}

// ===== 启动：不再有主页，直接进游戏（ISSUE-20261028-10 A1/A2）=====
function startGame(){
  var g = $('game');
  if(g && (!g.src || g.src.indexOf('game.html') < 0)) g.src = 'game.html?v=' + BUILD;
  var gh = $('ghint'); if (gh) gh.className='hide';
}

// ===== 账号与排行榜面板（覆盖棋盘格） =====
var lobbyOpen = false;
/* 游戏内部量到的棋盘矩形（iframe 坐标系），由 postMessage 'ark_board_rect' 更新 */
var lobbyBoardRect = null;
/* 把面板贴到棋盘上：iframe 坐标 → 父窗口坐标 = iframe 偏移 + 棋盘偏移。
 * 量不到 / 没上报时什么也不写，CSS 里的左侧满高布局就是兜底。 */
function placeLobbyOverBoard(){
  var d = $('lobbyDrawer'), f = $('game');
  if(!d || !f || !lobbyBoardRect) return;
  try{
    var fr = f.getBoundingClientRect(), r = lobbyBoardRect;
    if(!(fr.width > 0) || !(r.width > 0)) return;
    d.style.left   = Math.round(fr.left + r.left) + 'px';
    d.style.top    = Math.round(fr.top  + r.top)  + 'px';
    d.style.width  = Math.round(r.width)  + 'px';
    d.style.height = Math.round(r.height) + 'px';
    d.style.bottom = 'auto';
  }catch(e){}
}
function setLobbyOpen(open){
  lobbyOpen = !!open;
  var d = $('lobbyDrawer'), m = $('lobbyMask'), f = $('game');
  if(lobbyOpen) placeLobbyOverBoard();
  if(d){ d.classList.toggle('on', lobbyOpen); d.setAttribute('aria-hidden', lobbyOpen ? 'false' : 'true'); }
  if(m) m.classList.toggle('on', lobbyOpen);
  /* B4：抽屉打开时游戏输入必须暂停，否则点榜单会误触棋盘 */
  if(f){ f.style.pointerEvents = lobbyOpen ? 'none' : '';
    /* ISSUE-20261029-21 S2：把开合状态回发给游戏内的 ♟ 角标，让它同步高亮 / aria-expanded */
    try { if(f.contentWindow) f.contentWindow.postMessage({ type:'ark_lobby_state', open: lobbyOpen }, '*'); } catch(e){}
  }
  if(lobbyOpen){
    if(d && d.focus) { try { d.focus(); } catch(e){} }
    refreshBoard();     // 每次打开都拉一次实时榜
  }
}

/* 2026-10-29 02:0x：左边缘把手删除后，gamePhase() / syncBattleMode() 一并移除（只为它俩服务） */

// ===== 入口提示 + 初始化 =====
function init(){
  resolveMyId();
  loadAccount();
  if(IN_TG){
    if(CAN_REPORT){ showHint('✅ 键盘入口 · 成绩会自动记录', true); setTimeout(hideHint, 4000); }
    else { showHint('✅ 主页/菜单入口 · 成绩也会记录', true); setTimeout(hideHint, 4500); }
  } else {
    showHint('🌐 网页模式 · 正在连接成绩服务器…', false);
  }

  startGame();            // 打开即进选角大厅

  loadConfig(function(){
    renderMiniBoard(); renderPlayer(); pushMyId();
    refreshBoard();
    if(!IN_TG){
      if(APP.reportUrl){
        showHint('✅ 网页模式 · 成绩会自动记录（同一份排行榜）', true);
        setTimeout(hideHint, 4500);
      } else {
        showHint('⚠️ 网页模式 · 成绩服务未连接（bot 没启动？本局成绩不会记录）', false);
      }
    }
    // 新账号：收起提示前先告诉玩家要补口令
    if(APP.isNewAccount) setTimeout(function(){ toast('你的账号是「'+APP.myAccount+'」\n点棋盘左上角 ♟ → 编辑，可以改成自己的名字（数字口令 4–8 位）', 7000); }, 1200);
  });

  var mask = $('lobbyMask'); if(mask) mask.addEventListener('click', function(){ setLobbyOpen(false); });
  var lc = $('lobbyCornerClose'); if(lc) lc.addEventListener('click', function(){ setLobbyOpen(false); });
  /* 点遮罩也能关（保留旧行为，遮罩不在本次改动范围内） */
  // Esc 关闭（焦点在抽屉里时有效；iframe 内的 Esc 由游戏自己处理）
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && lobbyOpen){ setLobbyOpen(false); e.preventDefault(); }
  });

  var ed = $('pEdit');
  if(ed) ed.addEventListener('click', function(){ toggleEdit($('acctEdit').hidden); });
  var sv = $('pSave');
  if(sv) sv.addEventListener('click', syncName);
  var pn = $('pName');
  if(pn) pn.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ syncName(); } });

  var fr = $('btnFullRank'); if(fr) fr.addEventListener('click', openRank);
  var rc = $('rankClose'); if(rc) rc.addEventListener('click', closeRank);
  var rf = $('rankFrame'); if(rf) rf.addEventListener('load', function(){ pushMyScore(); pushMyId(); pushSnapshot(); pushApiBase(); });

  // 接收游戏 iframe 的消息：成绩上报 / 打开账号与排行抽屉（ISSUE-20261029-21 S2）
  window.addEventListener('message', function(e){
    try{
      var d = e.data; if(!d) return;
      if(d.type === 'ark_open_lobby'){ setLobbyOpen(true); return; }
      /* ISSUE-20261029-29：游戏上报棋盘矩形 → 账号面板贴到棋盘上。
         抽屉正开着时收到（转屏 / 换布局后游戏补报）也要立刻重新定位。 */
      if(d.type === 'ark_board_rect'){
        lobbyBoardRect = d.rect || null;
        if(lobbyOpen) placeLobbyOverBoard();
        return;
      }
      if(d.type !== 'rogue_score') return;
      reportScore(d.level||0, d.kills||0);
    }catch(err){}
  });

  try { if(W){ W.ready(); W.expand(); } } catch(e){}
}

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); }
else { init(); }
</script>
