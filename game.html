<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟战棋</title>
<style>
  * { box-sizing: border-box; }
  :root { --cell: 50px; --unit-move-ms: 120ms;
          /* ISSUE-20261029-21：角标相对 #boardWrap 的偏移（棋盘居中留下的边距），
             updateCellSize() 会改写；无 JS 时退回 0，角标仍贴在容器角上不跑位。 */
          --corner-x: 0px; --corner-y: 0px; }
  body { font-family: system-ui, -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; background:#1a1a2e; color:#eee; margin:0; padding:0; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; display:flex; flex-direction:column; touch-action: manipulation; }
  #topbar { display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; padding: 4px 12px; }
  #topbar h1 { font-size:18px; margin:4px 0; text-align:center; }
  /* ISSUE-20261028-09 A：地图贴左（原来 justify-content:center 会在侧栏挤压下把地图推到中间，
     左右都留白）；棋盘容器尺寸由 updateCellSize() 按「可用短边」写死，故 flex 不再增长。 */
  #game { display:flex; gap:8px; padding: 8px 16px 16px 16px; flex-grow: 1; min-height: 0; justify-content:flex-start; }
  /* 正方形棋盘：宽高都由 JS 设成同一个像素值（短边），aspect-ratio 只是无 JS 时的兜底。
     不能用 flex-grow —— 一旦拉伸就会破坏 1:1。 */
  #boardWrap { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; position:relative; min-width: 0; min-height: 0; overflow: hidden; aspect-ratio: 1 / 1; }
  /* ISSUE-18 B5：iOS Safari 长按会弹「拷贝/放大镜」，拖动跟随前必须关掉 callout */
  #board { display:grid; grid-auto-rows: var(--cell); gap:2px; padding:0; border-radius:4px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; position: relative; }
  #unitLayer { position:absolute; inset:0; pointer-events:none; z-index:40; overflow:visible; }
  #fxLayer { position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:50; }
  /* 正方形格子（ISSUE-20261028-09 A）：原来 height 是 calc(var(--cell) * 1.12)，
     整块地图因此永远被竖向拉长；1:1 后地图才是正方。 */
  .cell { width: var(--cell); height: var(--cell); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.44); border-radius:2px; cursor:pointer; user-select:none; position:relative; overflow:hidden; }
  .cell.empty { background:#2d2d44; }
  .cell.void { background:transparent; cursor:default; pointer-events:none; }
  .cell.wall { background:#4a4a5a; cursor:not-allowed; border-radius:4px; }
  /* ISSUE-20261028-10-B：粗圆岩 = Boss 落的动态墙。用暖褐 + 内描边和灰墙区分开，
     但又不能比敌人/玩家更抢眼（它是地形，不是单位）。 */
  .cell.rock { background:#6b5233; cursor:not-allowed; border-radius:4px;
    box-shadow: inset 0 0 0 1px rgba(255,206,140,.45); }
  .cell.path { background:#3a5a8c; }
  /* 闪避节点：第一次等待（蓝色描边 + 内部蓝调） */
  .cell.dodge { box-shadow: inset 0 0 0 2px #7dd3fc; background:#2f5578; }
  .cell.dodge.attack { box-shadow: inset 0 0 0 2px #7dd3fc, inset 0 0 0 999px rgba(192,57,43,.35); }
  /* ISSUE-20261029-41：路径格朝向箭头 —— 指向「从这一格出发」的下一步方向。
     放右上角（右下角是单位朝向指示、格中央是节点/图标），0.3 格大小、30% 不透明，不抢注意力。
     四个方向靠旋转同一个向上三角实现，避免四套 border 组合写错。 */
  .cell-dir { position:absolute; top:9%; right:9%; width:0; height:0; opacity:.3; pointer-events:none;
    border-left: calc(var(--cell) * 0.13) solid transparent;
    border-right: calc(var(--cell) * 0.13) solid transparent;
    border-bottom: calc(var(--cell) * 0.22) solid #dbe4ff; }
  .cell-dir.l { transform: rotate(-90deg); }
  .cell-dir.r { transform: rotate(90deg); }
  .cell-dir.d { transform: rotate(180deg); }
  .cell.attack { background:#c0392b; }
  .cell.attack.used { background:#5c2b29; }
  /* 技能节点（双击设置）：紫色底 + 紫描边 + ✦ */
  .cell.skill { background:#5b3a8c; box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.used { background:#3d2a5c; }
  .cell.attack.skill { background: linear-gradient(135deg, #c0392b 0 45%, #5b3a8c 55% 100%); box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.dodge { box-shadow: inset 0 0 0 2px #c9a0ff, inset 0 0 0 4px #7dd3fc; }
  /* 攻击范围：在地块上叠一层蓝色（与路径格 #3a5a8c 接近），不遮挡格子内容 */
  .cell.in-range { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25); }
  .cell.in-range.attack, .cell.in-range.skill { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25), inset 0 0 0 1px rgba(201,160,255,.65); }
  .cell.item-cell { background: #4a1e2f; box-shadow: inset 0 0 10px #ff6b6b; }
  .cell.blood-cell { background: #3d1515; }
  .cell.exit-cell { background: #27ae60; box-shadow: inset 0 0 15px #2ecc71; }
  .cell.hitflash { animation: hitflash .35s ease-out; }
  @keyframes hitflash { 0%{box-shadow: inset 0 0 0 40px rgba(255,80,80,.9);} 100%{box-shadow: inset 0 0 0 0 rgba(255,80,80,0);} }
  .item-pulse { animation: itemPulse 1.5s ease-in-out infinite; display:inline-block; }
  @keyframes itemPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  /* 单位渲染（格内静态 .unit + 绝对定位 .unit-abs）共用同一套外观，避免两处分别维护。
     ★ ISSUE-20261030-56：--stk-* 是「同格斜分」的参数，默认值 = 独占一格（等价于没有斜分），
       只有 N>1 时才由 renderUnits 改成实际值 —— N=1 时下面那套 clip-path 一条都不匹配。 */
  .unit, .unit-abs { display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; pointer-events:none; position:relative;
    --stk-i: 0; --stk-n: 1; --stk-f: 1; --stk-dx: 0px; --stk-dy: 0px; }
  .unit { width:100%; height:100%; }
  .unit-abs { position:absolute; left:0; top:0; width:auto; height:auto; transition: transform var(--unit-move-ms) linear; will-change: transform; border-radius:2px; }
  /* ★ ISSUE-20261030-56：图标 / 血条按 N 缩放（--stk-f 默认 1 → 单格单单位与改动前完全一致） */
  .unit .icon, .unit-abs .icon { font-size: calc(var(--cell) * 0.55 * var(--stk-f)); line-height:1; display:flex; align-items:center; justify-content:center; }
  .unit .icon.ghost-icon, .unit-abs .icon.ghost-icon { opacity: 0.7; filter: drop-shadow(0 0 5px #fff); }
  /* ISSUE-20261030-64 · 矢量图标：尺寸 = 1em → 自动继承父级 font-size，
   * 所以棋盘那条 calc(--cell)、抽屉里 .ico 的 26px、日志行字号都不用动一行。 */
  .vico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex: 0 0 auto; }
  /* 选角大厅角色（ISSUE-20261028-12）：连续坐标 + 绝对定位。
     自由移动期间必须 transition:none —— 每帧写 transform 时若还有 transition，
     会把每帧目标再缓动一次，出现拖尾/松手后还在滑。 */
  .cand-unit { position:absolute; left:0; top:0; display:flex; align-items:center; justify-content:center;
    transition:none; will-change:transform; pointer-events:none; border-radius:6px; }
  .cand-unit .cand-icon { font-size: calc(var(--cell) * 0.55); line-height:1; display:flex; align-items:center; justify-content:center; }
  .cand-unit.sel { outline:3px solid #f39c12; box-shadow: inset 0 0 15px rgba(243,156,18,0.55); }
  /* 词缀 / 精英标记（ISSUE-20261028-05）：词缀做成右上角小标签，精英用金边 + 星标。
     刻意不用 CSS filter 改图标色 —— 会把 emoji 与后续像素画（ISSUE-07）的色阶一起毁掉。 */
  .affix-tag { position:absolute; top:0; right:0; display:flex; gap:1px; align-items:center;
    font-size: calc(var(--cell) * 0.2); line-height:1; padding:1px 2px; border-radius:4px;
    background: rgba(0,0,0,0.66); color:#ffd93d; font-weight:900; letter-spacing:0;
    pointer-events:none; z-index:46; white-space:nowrap; }
  .unit-abs.ua-elite { outline:2px solid #ffd700; outline-offset:-2px;
    box-shadow: inset 0 0 10px rgba(255,215,0,0.45); }
  .unit-abs.ua-elite .icon { text-shadow: 0 0 6px #ffd700; }
  /* ★ ISSUE-20261030-56：血条同样按 N 缩放（不缩的话 N≥3 时血条比斜带还宽，会被 clip 掉一截） */
  .unit .hp-bar, .unit-abs .hp-bar { width: calc(78% * var(--stk-f)); height: 3px; background: rgba(0,0,0,0.55); border-radius: 2px; margin-top: 1px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 2px rgba(0,0,0,0.6); }
  .unit .hp-fill, .unit-abs .hp-fill { height: 100%; border-radius: 2px; transition: width 0.25s ease; }
  .unit-abs.ua-player { outline:2px solid #4ecdc4; outline-offset:-2px; }
  .unit-abs.ua-player.ua-charging { outline:3px solid #ffd700; outline-offset:-3px; box-shadow: inset 0 0 15px #ffd700; }
  .unit-abs.ua-player.ua-attacked { outline:2px dashed #ffb86b; outline-offset:-2px; }
  .unit-abs.ua-enemy { outline:2px solid #e74c3c; outline-offset:-2px; }
  /* ISSUE-20261029-28：召唤出来的小队成员 = 友军，绿框，与玩家青框 / 敌人红框区分 */
  .unit-abs.ua-squad { outline:2px solid #4ade80; outline-offset:-2px; box-shadow: inset 0 0 8px rgba(74,222,128,0.25); }
  .unit-abs.ua-stunned { opacity: 0.55; filter: grayscale(0.35); }
  .unit-abs.ua-stunned::after {
    /* ISSUE-20261030-64：原来是 CSS content:'💫'（吃 emoji 字体，跨平台会变/变豆腐块）。
       CSS 的 content 引用不到内联 <symbol>，所以这里用 data-URI 背景图 —— 同一套矢量，居中无缩放差异。 */
    content: '';
    position: absolute;
    top: -2px;
    right: -2px;
    width: calc(var(--cell) * 0.3);
    height: calc(var(--cell) * 0.3);
    background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%20%3Cpath%20d%3D%22M3.22755%2011.6784C2.64755%2010.4084%202.16755%209.05836%202.02755%207.60836C1.96755%206.87836%201.99755%206.12836%202.19755%205.37836C2.38755%204.63836%202.77755%203.88836%203.39755%203.34836C4.59755%202.20836%206.30755%201.91836%207.78755%202.01836C9.29755%202.10836%2010.7375%202.48836%2012.0875%203.00836C14.7975%204.07836%2017.2575%205.62836%2019.4875%207.42836C21.7275%209.22836%2023.7675%2011.2684%2025.5375%2013.5884C26.4375%2014.7384%2027.2475%2015.9684%2027.9675%2017.2784C28.6875%2018.5884%2029.3275%2019.9784%2029.7175%2021.5684C30.0675%2023.1284%2030.3075%2024.9584%2029.4275%2026.9284C29.3075%2027.1684%2029.1875%2027.3984%2029.0575%2027.6384C28.8975%2027.8584%2028.7275%2028.0784%2028.5475%2028.2884C28.2275%2028.7384%2027.7475%2029.0384%2027.3175%2029.3684C26.3875%2029.8884%2025.3775%2030.2184%2024.4675%2030.2584C22.6175%2030.3784%2021.0375%2029.9484%2019.5975%2029.3884C18.1775%2028.7884%2016.8475%2028.0884%2015.6775%2027.1984C13.2875%2025.4984%2011.2875%2023.3884%209.71755%2021.0284C9.65755%2020.9284%209.67755%2020.8084%209.77755%2020.7384C9.84755%2020.6884%209.93755%2020.6984%2010.0075%2020.7384C12.3775%2022.2484%2014.6975%2023.6584%2017.1075%2024.7184C18.3075%2025.2484%2019.5175%2025.6984%2020.7175%2025.9684C21.8975%2026.2584%2023.0875%2026.3984%2023.9975%2026.2084C24.4775%2026.1684%2024.7775%2025.9684%2025.0575%2025.8284C25.2575%2025.6084%2025.4975%2025.4784%2025.5975%2025.1384C25.9075%2024.5684%2025.9575%2023.4784%2025.7875%2022.3684C25.6375%2021.2384%2025.2475%2020.0284%2024.7475%2018.8684C24.2375%2017.7084%2023.6175%2016.5584%2022.8975%2015.4684C21.4775%2013.2684%2019.7175%2011.2384%2017.7775%209.42836C15.8375%207.60836%2013.6675%206.01836%2011.2975%204.87836C10.1075%204.28836%208.87755%203.84836%207.62755%203.64836C6.38755%203.44836%205.11755%203.58836%204.21755%204.29836C3.27755%204.96836%202.89755%206.27836%202.88755%207.56836C2.86755%208.88836%203.17755%2010.2284%203.60755%2011.5284C3.64755%2011.6384%203.58755%2011.7484%203.47755%2011.7884C3.38755%2011.8184%203.27755%2011.7684%203.22755%2011.6784Z%22%20fill%3D%22%23F9C23C%22%2F%3E%20%3Cpath%20d%3D%22M9.49755%2018.0582L10.8875%2018.5282C11.3275%2018.6782%2011.8175%2018.5982%2012.1875%2018.3182L13.3675%2017.4382C14.3075%2016.7382%2015.6375%2017.4182%2015.6275%2018.5882L15.6075%2020.0582C15.5975%2020.5282%2015.8275%2020.9582%2016.2075%2021.2282L17.4075%2022.0782C18.3675%2022.7582%2018.1275%2024.2382%2017.0075%2024.5782L15.5975%2025.0182C15.1575%2025.1582%2014.8075%2025.5082%2014.6675%2025.9482L14.2275%2027.3582C13.8775%2028.4782%2012.3975%2028.7082%2011.7275%2027.7582L10.8775%2026.5582C10.6075%2026.1782%2010.1675%2025.9582%209.70755%2025.9582L8.23755%2025.9782C7.07755%2025.9982%206.39755%2024.6582%207.09755%2023.7182L7.97755%2022.5382C8.25755%2022.1682%208.33755%2021.6782%208.18755%2021.2382L7.71755%2019.8482C7.32755%2018.7382%208.38755%2017.6782%209.49755%2018.0582Z%22%20fill%3D%22%23FFB02E%22%2F%3E%20%3C%2Fsvg%3E") no-repeat center / contain;
    animation: stunSpin 1.8s linear infinite;
    pointer-events: none;
    text-shadow: 0 0 4px #ffd700;
  }
  @keyframes stunSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* ===================================================================
   * ★ ISSUE-20261030-56：同格多单位「斜向分格」
   *
   * 一格沿 45°（带方向左下→右上，即「x+y」恒定）切成 N 条斜带：
   * 第 i 条覆盖 x+y ∈ [2i/N, 2(i+1)/N]（方格内 x+y 取值 0..2），
   * 于是 N=2 就是「左上 / 右下」两块三角，玩家（i=0）永远在左上。
   * 内容再由 --stk-dx/--stk-dy 平移到本带中心（偏移量由 renderUnits 按实测格宽算好写行内）。
   *
   * ★ N 硬上限 = 5（1 干员 + 4 成员，各不重复），所以 N=2..5 全部穷举，
   *   不需要「+N 角标」之类的退化方案 —— 超过 5 的情况不存在。
   * ★ data-stk / data-stk-i 只在 N>1 时由 JS 挂上（N=1 时 DOM 与改动前逐字节一致，
   *   这是 §7-8 的回归底线：斜分逻辑必须走这个开关，不能在 N=1 时也挂 clip-path）。
   * =================================================================== */
  /* 斜带内：内容整体平移到自己那条带的中心（var 都给 0px 兜底 —— 万一 JS 没写行内值，
     缺一个 var 会让整条 transform 变成 invalid at computed-value time，居中直接失效） */
  .unit-abs[data-stk] .icon,
  .unit-abs[data-stk] .hp-bar,
  .unit-abs[data-stk] .affix-tag { transform: translate(var(--stk-dx, 0px), var(--stk-dy, 0px)); }
  /* 朝向指示本来就带 translateX/Y(-50%)，只能整条重写（不能只加 translate，会覆盖原居中） */
  .unit-abs[data-stk] .facing-ind.r, .unit-abs[data-stk] .facing-ind.l { transform: translate(var(--stk-dx, 0px), var(--stk-dy, 0px)) translateY(-50%); }
  .unit-abs[data-stk] .facing-ind.d, .unit-abs[data-stk] .facing-ind.u { transform: translate(var(--stk-dx, 0px), var(--stk-dy, 0px)) translateX(-50%); }
  /* N≥3：斜带太窄，朝向与词缀已经不可读 → 直接隐掉，只留描边颜色辨敌我（§4.2）。
     !important 是必须的：renderUnits 会用行内 display:flex 把它们显示出来。 */
  .unit-abs[data-stk="3"] .facing-ind, .unit-abs[data-stk="4"] .facing-ind, .unit-abs[data-stk="5"] .facing-ind,
  .unit-abs[data-stk="3"] .affix-tag, .unit-abs[data-stk="4"] .affix-tag, .unit-abs[data-stk="5"] .affix-tag { display: none !important; }
  /* --- N=2 --- */
  .unit-abs[data-stk="2"][data-stk-i="0"] { clip-path: polygon(0% 0%, 100% 0%, 0% 100%); }
  .unit-abs[data-stk="2"][data-stk-i="1"] { clip-path: polygon(100% 0%, 100% 100%, 0% 100%); }
  /* --- N=3 --- */
  .unit-abs[data-stk="3"][data-stk-i="0"] { clip-path: polygon(0% 0%, 66.67% 0%, 0% 66.67%); }
  .unit-abs[data-stk="3"][data-stk-i="1"] { clip-path: polygon(0% 66.67%, 66.67% 0%, 100% 0%, 100% 33.33%, 33.33% 100%, 0% 100%); }
  .unit-abs[data-stk="3"][data-stk-i="2"] { clip-path: polygon(100% 33.33%, 100% 100%, 33.33% 100%); }
  /* --- N=4 --- */
  .unit-abs[data-stk="4"][data-stk-i="0"] { clip-path: polygon(0% 0%, 50% 0%, 0% 50%); }
  .unit-abs[data-stk="4"][data-stk-i="1"] { clip-path: polygon(0% 50%, 50% 0%, 100% 0%, 0% 100%); }
  .unit-abs[data-stk="4"][data-stk-i="2"] { clip-path: polygon(100% 0%, 100% 50%, 50% 100%, 0% 100%); }
  .unit-abs[data-stk="4"][data-stk-i="3"] { clip-path: polygon(100% 50%, 100% 100%, 50% 100%); }
  /* --- N=5 --- */
  .unit-abs[data-stk="5"][data-stk-i="0"] { clip-path: polygon(0% 0%, 40% 0%, 0% 40%); }
  .unit-abs[data-stk="5"][data-stk-i="1"] { clip-path: polygon(0% 40%, 40% 0%, 80% 0%, 0% 80%); }
  .unit-abs[data-stk="5"][data-stk-i="2"] { clip-path: polygon(0% 80%, 80% 0%, 100% 0%, 100% 20%, 20% 100%, 0% 100%); }
  .unit-abs[data-stk="5"][data-stk-i="3"] { clip-path: polygon(100% 20%, 100% 60%, 60% 100%, 20% 100%); }
  .unit-abs[data-stk="5"][data-stk-i="4"] { clip-path: polygon(100% 60%, 100% 100%, 60% 100%); }

  /* 同格时的动作标记（✦ / 🎯 / 💨 / ⏳n）：画进**自己那条斜带**。
     ★ z-index 41：必须高于 #unitLayer(40)，否则标记会被单位图标整个盖住
       （#board 与 .cell 都是 position:relative + z-index:auto，不建层叠上下文，
        所以这个 41 能直接和 40 比）；低于 #fxLayer(50)，浮字仍在最上层。
     ★ 深色圆底是必要的：标记会压在图标中心，没有底衬会糊成一团。 */
  .cell-mark { position:absolute; left:50%; top:50%; z-index:41; pointer-events:none; line-height:1;
    display:flex; align-items:center; justify-content:center; white-space:nowrap;
    /* 用 min-width 不用 width：⏳2 是两个字符，写死宽度会把第二个字符挤出圆底之外 */
    min-width: calc(var(--cell) * 0.40 * var(--stk-f, 1)); height: calc(var(--cell) * 0.40 * var(--stk-f, 1));
    padding: 0 calc(var(--cell) * 0.05 * var(--stk-f, 1));

  .enemy-arrow { position:absolute; width: calc(var(--cell) * 0.4); height: calc(var(--cell) * 0.4); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.3); font-weight:900; color:#ffd93d; background:rgba(0,0,0,0.6); border-radius:50%; text-shadow:0 0 4px #000, 0 0 6px #ffd93d; transform:translate(-50%,-50%); z-index:45; pointer-events:none; }

  /* 侧栏收窄（ISSUE-20261028-09 B）：六维图搬进抽屉后，侧栏只剩角色卡与日志占位，

  #sidebar { width: clamp(280px, 28vw, 450px); flex-shrink: 0; display:flex; flex-direction:column; gap:8px; height: 100%; min-height: 0; overflow: hidden; }

  .chip { font-size:11px; font-weight:700; padding:0 7px; border-radius:9px; background:#2c2c47; color:#c3c3da; white-space:nowrap; line-height:1.6; }

  #stats { flex: 1 1 auto; min-height: 0; overflow-y: auto; display:flex; flex-direction:column; gap:6px; }

  /* 竖屏：把「开始行动」按钮放到六维图上方（横屏时按钮仍在底部 #controls） */

  body.layout-v #actionSlot { display: block; flex: 0 0 auto; }

  #controls { flex-shrink: 0; display:flex; flex-direction:column; gap:8px; min-height: 90px; }
  #controls:empty { min-height: 0; }
  /* =========================================================================
   * 抽屉体系（ISSUE-20261028-09 G）
   * 设计语言：方形 = 信息 · 圆形 = 交互（仅手机）· 浮层 = 从右侧滑入的侧边栏。
   * 旧的 #logPanel「可拖动悬浮窗」整体废除 —— 不允许凭空悬浮，也没有拖动位置记忆。
   * z-index 一律收敛成变量，禁止各处硬编码（--z-corner 是地图角标专用：30，必须低于单位层 40）。
   * ========================================================================= */
  :root { --z-corner: 30; --z-mask: 1100; --z-drawer: 1101; --z-vpad: 1002; }
  /* 地图角标（ISSUE-20261029-21 · B 方案「叠层」；20261029-36 增角色面板）：
     ⚙ 设置 → 棋盘右上格；👤 账号与排行 → 棋盘左上格；♟️ 角色面板 → 棋盘右下格。尺寸 = 恰好一个格子（var(--cell)），
     随格子缩放；两者共用同一套样式（大小 / 圆角 / 配色 / 高亮态 / aria）。
     --corner-x / --corner-y 由 updateCellSize() 算出：#board 在 #boardWrap 里居中，
     四周可能各剩几像素，角标要贴的是「棋盘」的角而不是容器的角。
     ★ z-index 必须低于 #unitLayer(40)，且单位层本身 pointer-events:none —— 站在角落的
       敌人绘制在角标之上，血条 / 词缀 / 意图不会被盖住（本号 §B 强制处理 1）。
     ★ 代价（人类明确接受）：这两格点不到、也走不上去；攻击 / 技能 / 闪避都是点路径节点，
       所以角落里的敌人照样能打（§B 强制处理 3）。 */
  #setOpenBtn, #lobbyOpenBtn, #charOpenBtn, #cornerExtra {
    position: absolute; top: var(--corner-y); z-index: var(--z-corner);
    display: flex; width: var(--cell); height: var(--cell);
    align-items: center; justify-content: center; padding: 0;
    /* ISSUE-20261029-44 第1项：与「开始行动」(.start-btn) 同款绿色胶囊 */
    background: linear-gradient(135deg, #4ecdc4, #2ecc71); color: #fff;
    border: 1px solid rgba(255,255,255,.28); border-radius: 3px;
    font-size: calc(var(--cell) * 0.5); line-height: 1;
    cursor: pointer; touch-action: manipulation; font-family: inherit;
    box-shadow: 0 2px 8px rgba(46,204,113,.35), inset 0 0 0 1px rgba(0,0,0,.12);
    transition: filter .15s, box-shadow .15s, transform .12s;
  }
  #setOpenBtn { right: var(--corner-x); }
  #lobbyOpenBtn { left: var(--corner-x); }
  /* ★ 角色面板按钮：地图右下格（ISSUE-20261029-36） */
  #charOpenBtn { top: auto; bottom: var(--corner-y); right: var(--corner-x); }
  /* ★ ISSUE-20261029-44 第1项：第 4 角标（地图左下格），先留空占位，绿色，不接功能 */
  #cornerExtra { top: auto; bottom: var(--corner-y); left: var(--corner-x); pointer-events: none; cursor: default; }
  #setOpenBtn:hover, #lobbyOpenBtn:hover, #charOpenBtn:hover { filter: brightness(1.08); }
  #setOpenBtn:active, #lobbyOpenBtn:active, #charOpenBtn:active { transform: scale(.92); }
  /* ★ ISSUE-20261029-44 第3项：打开面板时角标浮到面板之上（z-index > --z-drawer），
     图标变 ✕（drawerSyncChrome），再按一下关闭；不再使用面板内的独立关闭按钮。 */
  #setOpenBtn.on, #lobbyOpenBtn.on, #charOpenBtn.on {
    z-index: calc(var(--z-drawer) + 1);
    box-shadow: 0 0 0 2px #fff inset, 0 2px 8px rgba(46,204,113,.5);
  }
  /* 直开 game.html（无外壳）时 ♟ 由 chrome.js 置 hidden，不留死按钮 */
  #lobbyOpenBtn[hidden] { display: none; }
  /* 遮罩：全屏半透明，抽屉本体 z-index 更高所以露在上面 */
  #drawerMask {
    position: fixed; inset: 0; z-index: var(--z-mask);
    background: rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: opacity .22s ease-out;
  }
  #drawerMask.on { opacity: 1; pointer-events: auto; }
  /* 抽屉本体：统一从右侧滑入 220ms ease-out，宽度 min(360px,86vw) */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: var(--z-drawer);
    width: min(360px, 86vw); display: flex; flex-direction: column;
    background: #15151f; border-left: 1px solid #33334f;
    box-shadow: -12px 0 32px rgba(0,0,0,.5);
    transform: translateX(100%); transition: transform .22s ease-out;
    will-change: transform; overflow: hidden;
  }
  .drawer.on { transform: translateX(0); }
  .drawer-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 10px 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07);
    background: #1b1b2a;
  }
  .drawer-title { font-size: 13px; font-weight: 900; color: #cfe6ff; letter-spacing: 1px; white-space: nowrap; }
  .drawer-x {
    flex: 0 0 auto; margin-left: auto; width: 30px; height: 30px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2c2c47; color: #cfe6ff; border: 1px solid #44445f; border-radius: 7px;
    font-size: 14px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .drawer-x:active { transform: scale(.94); }
  /* ★ 设置面板专用关闭按钮（2026-10-29 人类 01:42 指令）：
     「删掉面板里那个小 ✕，改成和 ⚙ 入口按钮同位置、同尺寸的关闭按钮，再按一下关闭，标题挪到顶部右侧」。
     尺寸/圆角/配色/边框全部照抄 #setOpenBtn（var(--cell)），位置也用同一套 --corner-x / --corner-y，
     所以抽屉滑进来时，视觉上就是「棋盘右上格那个 ⚙ 原地变成了 ✕」，点它即收起（.drawer 是 fixed，
     内部绝对定位的 top/right 与屏幕坐标同源）。
     属性/升级两个抽屉**不动**：它们的入口不在棋盘角上，没有「同一个位置」可对齐。 */
  /* ISSUE-20261029-44 第3项：设置面板内独立关闭按钮已删除，
     改由棋盘右上格的 ⚙ 角标本体（.on 时浮到面板上、变 ✕）关闭。 */
  /* =========================================================================
   * ★ 设置面板改为「覆盖棋盘格」（ISSUE-20261029-29，人类 2026-10-29 04:42）
   *   「设置按钮点开之后，弹窗改成覆盖棋盘格，相当于地图变成了显示设置的面板」。
   * 旧行为：从屏幕右侧滑入的 360px 宽抽屉，地图还露在左边。
   * 新行为：面板直接盖在棋盘那块正方形上（--board-* 由 JS 按 #board 的实时矩形写入），
   *   视觉上就是「地图原地变成了设置面板」，关掉后地图原样露出来。
   * ★ 显隐机制必须换掉：原 .drawer 靠 translateX(100%) 平移到屏幕外收起，
   *   而现在面板左边缘在棋盘位置，向右平移 100% 会正好盖住右侧栏 —— 收起=盖住别的东西。
   *   所以这里改用 opacity + visibility 淡入淡出（ID 选择器优先级高于 .drawer.on，覆盖安全）。
   * ★ 关闭按钮也从「对齐屏幕上的棋盘角」改成「对齐面板自己的右上角」：
   *   面板现在就是棋盘那块，top/right 归零即与 ⚙ 原位重合。
   * ========================================================================= */
  #drawerSettings {
    top: var(--board-top, 0); left: var(--board-left, 0);
    right: auto; bottom: auto;
    width: var(--board-w, min(360px, 86vw));
    height: var(--board-h, 100%);
    max-width: none; border-left: 1px solid #33334f; border-radius: 0; box-shadow: none;
    opacity: 0; visibility: hidden; transform: scale(.985);
    transition: opacity .18s ease-out, transform .18s ease-out, visibility .18s;
  }
  #drawerSettings.on { opacity: 1; visibility: visible; transform: none; }
  /* ISSUE-20261029-44：.drawer-corner-x 已移除（见上） */
  /* =========================================================================
   * ★ 角色面板弹窗（ISSUE-20261029-36）：与设置面板同款「覆盖棋盘格」机制。
   * 正方形（9×9 棋盘 = 正方形），视觉上就是「地图原地变成角色面板」。
   * 显隐同样用 opacity + visibility（ID 选择器优先级高于 .drawer.on，覆盖平移）。
   * 内容：顶部 = 名字；名字下 = 血条；左下 = 六维图；右下 = 空出一栏。无属性按钮。
   * ========================================================================= */
  #drawerChar {
    top: var(--board-top, 0); left: var(--board-left, 0);
    right: auto; bottom: auto;
    width: var(--board-w, min(360px, 86vw));
    height: var(--board-h, 100%);
    max-width: none; border-left: 1px solid #33334f; border-radius: 0; box-shadow: none;
    opacity: 0; visibility: hidden; transform: scale(.985);
    transition: opacity .18s ease-out, transform .18s ease-out, visibility .18s;
  }
  #drawerChar.on { opacity: 1; visibility: visible; transform: none; }
  /* =========================================================================

  /* ISSUE-20261030-59：右下格复用给「属性说明卡」时的容器样式。

  #logBar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; font-size: 12px; font-weight: 800; color: #9a9ab5; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,.06); user-select: none; touch-action: none; }

    /* 手机端布局模式：layout-h 左右分栏 / layout-v 上下堆叠 */
    body.layout-h #game { display: flex; flex-direction: row; align-items: stretch; gap: 6px; padding: 4px; }
    body.layout-h #boardWrap { width: auto; height: auto; aspect-ratio: auto; max-height: none; flex: 1 1 55%; }
    body.layout-h #sidebar { width: 45%; flex: 0 0 45%; height: 100%; max-height: none; }
    body.layout-h #dragHandle { display: none; }
    body.layout-h #radarCanvas { width: 104px; height: 104px; }
    /* ★ ISSUE-20261030-66：竖版手机「地图始终最大 = 宽度吃满屏幕」（人类 05:14 拍板）。
       棋盘宽度锁定后，总高可能超过视口 → 这里允许 #game 内部纵向滚动兜底，
       而不是让 body 的 overflow:hidden 把棋盘下沿切掉。vpad 的 padding-bottom
       已由 --vpad-h 补偿，滚动到底部不会压到虚拟键盘。 */
    body.layout-v #game { display: flex; flex-direction: column; gap: 6px; padding: 4px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    /* 竖屏正方形：高度由 updateCellSize() 按「宽度 vs 剩余高度」写死 */
    body.layout-v #boardWrap { width: 100%; height: auto; aspect-ratio: 1 / 1; flex: 0 0 auto; }
    body.layout-v #dragHandle { display: none; }
    body.layout-v #sidebar { width: 100%; height: auto; max-height: none; flex: 1 1 auto; min-height: 210px; }
    body.layout-v #sidebar > * { max-width: 100%; }
    #sidebar {
      width: 100%;
      height: 100%;
      max-height: none;
      min-height: 0;
      gap: 5px;
      padding-bottom: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #hero { padding: 5px 8px 5px 6px; gap: 4px; border-radius: 8px; }
    #radarCanvas { width: 150px; height: 150px; }
    #heroInfo { gap: 3px; }
    #heroKv .kv { padding: 3px 2px; }
    #heroKv .kv b { font-size: 9px; }
    #heroKv .kv span { font-size: 13px; }
    .hero-name { font-size: 12px; letter-spacing: 0; }
    .hero-lv-gold { font-size: 11px; }
    .hero-lv { font-size: 10px; }
    .hp-track { height: 12px; border-radius: 6px; }
    .hp-text { font-size: 9px; line-height:12px; }
    .sp-track { height: 9px; }
    .sp-text { font-size: 7px; line-height:9px; }
    #stats {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #stats .stat {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: break-word;
    }
    .kv span { font-size: 12px; }
    .kv b { font-size: 9px; }
    .mini { font-size: 10px; }
    .card { padding: 7px 9px; border-radius: 7px; }
    .card-title { font-size: 12px; margin-bottom: 3px; }
    .card-meta { font-size: 11px; margin-bottom: 5px; }
    .tips { gap: 3px; }
    .tips li { font-size: 11px; line-height: 1.42; }
    #controls {
      flex: 0 0 auto;
      flex-direction: column;
      gap: 4px;
      min-height: auto;
    }
    #controls .start-btn { padding: 12px; font-size: 15px; }
    .float-text { font-size:16px; }
    .float-text.crit { font-size:20px; }
    .float-text.crosskill { font-size:20px; }
    .unit .hp-bar, .unit-abs .hp-bar { height: 2px; }
  }

  /* =========================================================================
   * 手机虚拟圆钮（ISSUE-20261028-09 D / ISSUE-20261029-29 改版）
   * 挂载判据由 JS 负责：只有 (pointer:coarse) 且无 (any-pointer:fine) 才建 DOM，
   * PC 与「带鼠标的触屏笔记本」一律不渲染 —— 所以这里没有桌面分支。
   *
   * ★ 2026-10-29 04:16 人类指令：「虚拟按钮也做进独立面板，手机端固定在屏幕下方，
   *   电脑端不显示。开始行动的按钮放在虚拟按钮面板里面的顶部，布局是开始行动在上面，
   *   左下方向键，右下 等待/攻击/技能」。
   *   旧版是「方向键 + 三键」平铺在 #sidebar 底部（文档流），「开始行动」另找槽位；
   *   现在整块改成 fixed 底栏面板，从下往上依次是：
   *     ① 顶部 = 开始行动（整行宽，拇指最容易够到的第一排）
   *     ② 下方一行 = 左下方向键 / 右下 等待·攻击·技能
   *   面板 z-index(--z-vpad:1002) 低于抽屉遮罩(--z-mask:1100) —— 抽屉一开它自动被盖住，
   *   不会出现在「设置面板之上还能点棋盘」的荒唐状态。
   *   形状规则不变：圆形 = 交互，胶囊 = 特殊动作（开始行动）。
   * ========================================================================= */
  #vpadHost { display: none; }
  /* ★ ISSUE-20261029-31：长按虚拟按键会选中文字、弹出「拷贝 / 全选」菜单。
   * touch-action:none 只管「手势」（滚动 / 缩放），**管不住文本选择** ——
   * 必须再补 user-select:none（禁拖蓝）与 -webkit-touch-callout:none（禁 iOS 长按菜单）。
   * 作用域取「面板整体 + 所有子元素」：注入进 .vpad-top 的「开始行动」不在 .vbtn 里，
   * 只写 .vbtn 会漏掉它，只写面板又漏不掉缝隙里的残留选区。 */
  #vpadHost, #vpadHost * {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #vpadHost.on {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-vpad);
    display: flex; flex-direction: column; gap: 6px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(17,17,32,.96);
    border-top: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 -10px 26px rgba(0,0,0,.5);
  }
  /* 顶行：开始行动（renderControls 注入 .start-btn） */
  .vpad-top { display: flex; flex: 0 0 auto; }
  .vpad-top .start-btn { flex: 1 1 auto; width: 100%; }
  .vpad-top:empty { display: none; }
  /* 面板脱离文档流，用 --vpad-h（JS 实测写入）给 #game 补一圈底部留白。
     boardAvailSize() 算的是 clientHeight − padding，棋盘因此自动缩小让位，
     不需要在 JS 里再减一次高度。 */
  body.vpad-on #game { padding-bottom: calc(var(--vpad-h, 0px) + 8px); }
  /* 底行：左方向键 / 右三键 */
  .vpad-bot { display: flex; flex: 0 0 auto; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .vpad-dir { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 5px; }
  .vpad-dir .vbtn:nth-child(1) { grid-column: 2; grid-row: 1; }
  .vpad-dir .vbtn:nth-child(2) { grid-column: 1; grid-row: 2; }
  .vpad-dir .vbtn:nth-child(3) { grid-column: 2; grid-row: 2; }
  .vpad-dir .vbtn:nth-child(4) { grid-column: 3; grid-row: 2; }
  .vpad-act { display: flex; gap: 8px; align-items: flex-end; }
  .vact-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .vbtn-reset { width: 38px; height: 38px; font-size: 18px; background: rgba(120,58,58,.92); border: 1px solid #6b3a3a; }
  .vbtn-reset:active { transform: scale(.92); background: rgba(150,70,70,.96); }
  .vbtn { position: relative; width: 46px; height: 46px; padding: 0; border-radius: 50%;
    border: 1px solid #44445f; background: rgba(38,38,60,.94); color: #dbe6ff;
    font-size: 15px; font-weight: 900; line-height: 1; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent;
    box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  .vbtn:active { transform: scale(.92); background: rgba(62,62,96,.96); }
  .vbtn:disabled { opacity: .38; pointer-events: none; }
  .vbtn .vnum { font-size: 10px; font-weight: 900; color: #9fe6ff; line-height: 1; }
  .vbtn .vlab { font-size: 9px; font-weight: 700; color: #8f95a8; line-height: 1; }
  /* 攻击键上「×N」角标 */
  .vbtn .vbadge { position: absolute; top: -2px; right: -2px; min-width: 14px; height: 14px;
    padding: 0 3px; border-radius: 7px; background: #c0392b; color: #fff;
    font-size: 9px; font-weight: 900; line-height: 14px; text-align: center; }
  /* 技力环：SVG 叠在技能键外侧，按 spMax 等分扇段 */
  .vring { position: absolute; inset: -4px; pointer-events: none; overflow: visible; }

  /* =========================================================================
   * 选角厅「技能说明展开层」（ISSUE-20261029-29）
   * 盖在棋盘中部（第 1 行 ~ 倒数第 2 行）：出口所在的第一行、角色所在的最后一行都留在外面，
   * 否则玩家既看不见出口、也看不见自己走到哪。内容超出高度可滚轮 / 触摸滑动。
   * z-index 45：高于 #unitLayer(40)（说明展开时角色还没动，不存在盖住角色的问题），
   *            低于 #fxLayer(50) 与抽屉遮罩(1100)，不挡浮字与抽屉。
   * ========================================================================= */
  #charInfoSheet { position: absolute; z-index: 45; box-sizing: border-box;
    overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    background: rgba(15,15,29,.96); border: 1px solid rgba(255,255,255,.13); border-radius: 8px;
    padding: 10px 12px; box-shadow: 0 10px 28px rgba(0,0,0,.55);
    font-size: 12.5px; line-height: 1.6; color: #d5d5e6; }
  #charInfoSheet[hidden] { display: none; }
  .cis-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .cis-ico { font-size: 22px; line-height: 1; }
  .cis-name { font-size: 15px; font-weight: 900; color: #4ecdc4; letter-spacing: 1px; }
  .cis-hint { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #7e7e97; white-space: nowrap; }
  .cis-desc { font-size: 12.5px; color: #c3c3da; margin-bottom: 7px; }
  .cis-tips { gap: 5px; }
  /* ===================================================================
     ISSUE-20261029-45：账号与排行榜（原 index.html 外壳，已内联进单文件）
     -------------------------------------------------------------------
     为什么内联：外壳与游戏之间原有 3 条 postMessage、1 处直接读 iframe DOM、
     1 处注入脚本轮询顶层变量 phase/level/enemies、1 处反向劫持父文档 UI。
     隔离早已名存实亡，合并后全部消失；角标位置也能直接用 --corner-x/--cell，
     不再需要「量 iframe 里 #lobbyOpenBtn 的 rect 再换算坐标系」那套补丁。

     ★ 全部选择器以 #arkUi 作用域：避开与游戏重名的 .empty/.ghost/.tag/.lv/.nm。
     ★ z-index 并入游戏 --z-* 变量族（1200 起），不再自建 80/90/9999/10000。
     ★ 滚动条：显式接管 webkit 伪元素，消除系统默认白色滚动条。
     =================================================================== */
  #arkUi { --z-lobbyMask: 1200; --z-lobby: 1201; --z-fullrank: 1500; }

  #arkUi #lobbyMask { position:fixed; inset:0; z-index:var(--z-lobbyMask);
    background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .2s ease-out; }
  #arkUi #lobbyMask.on { opacity:1; pointer-events:auto; }

  #arkUi #lobbyDrawer { position:fixed; left:0; top:0; bottom:0; z-index:var(--z-lobby);
    width:min(360px, 86vw); display:flex; flex-direction:column; outline:none;
    background:#14142b; border:1px solid rgba(255,255,255,.12);
    box-shadow:12px 0 32px rgba(0,0,0,.5);
    opacity:0; visibility:hidden; transform:scale(.985);
    transition:opacity .18s ease-out, transform .18s ease-out, visibility .18s; }
  #arkUi #lobbyDrawer.on { opacity:1; visibility:visible; transform:none; }

  /* 关闭角标 = 棋盘 👤 角标的「打开态」：同文档后位置/尺寸直接吃棋盘变量，像素级一致 */
  #arkUi .dcorner { position:absolute; left:var(--corner-x); top:var(--corner-y);
    width:var(--cell); height:var(--cell); padding:0; display:flex; align-items:center; justify-content:center;
    border-radius:3px; border:1px solid rgba(255,255,255,.28);
    background:linear-gradient(135deg,#4ecdc4,#2ecc71); color:#fff;
    font-size:calc(var(--cell) * .5); line-height:1; cursor:pointer; font-family:inherit; touch-action:manipulation;
    box-shadow:0 0 0 2px #fff inset, 0 2px 8px rgba(46,204,113,.5);
    transition:filter .15s, box-shadow .15s, transform .12s; z-index:2; }
  #arkUi .dcorner:hover { filter:brightness(1.08); }
  #arkUi .dcorner:active { transform:scale(.92); }

  #arkUi .dhead { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 12px 8px calc(var(--corner-x) + var(--cell) + 8px);
    border-bottom:1px solid rgba(255,255,255,.08); }
  #arkUi .dtitle { font-size:13px; font-weight:800; letter-spacing:.5px; color:#ffd166; }
  #arkUi .dhead .meta { font-size:10.5px; color:#7d83a8; font-weight:400; white-space:nowrap; }

  /* 榜单主体：唯一滚动容器（面板内只显示排行榜，不再有左栏账号卡） */
  #arkUi .dbody { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:6px 8px; -webkit-overflow-scrolling:touch;
    overflow-anchor:none;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.22) transparent; }
  #arkUi .dbody::-webkit-scrollbar { width:6px; height:6px; }
  #arkUi .dbody::-webkit-scrollbar-track { background:transparent; }
  #arkUi .dbody::-webkit-scrollbar-thumb { background:rgba(255,255,255,.22); border-radius:3px; }
  #arkUi .dbody::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.34); }
  #arkUi .dbody::-webkit-scrollbar-corner { background:transparent; }

  /* 每项压缩：原 ≈62px/项（padding 8+8 + nm 13.5 + sc 11 + margin 6）→ 现 ≈38px，
     竖屏 390x844 下至少 8 名完整可见（AC-7）。 */
  #arkUi #miniBoard { list-style:none; margin:0; padding:0; }
  #arkUi #miniBoard > li { display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07);
    border-radius:8px; padding:5px 7px; margin-bottom:4px; min-height:38px; }
  #arkUi #miniBoard > li.me { border-color:#3ddc84;
    box-shadow:0 0 0 1px rgba(61,220,132,.28) inset; background:rgba(61,220,132,.07); }
  #arkUi .rk { width:19px; height:19px; flex:0 0 19px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:10.5px; font-weight:700;
    background:rgba(255,255,255,.08); color:#9aa0c0; font-variant-numeric:tabular-nums; }
  #arkUi #miniBoard > li:nth-child(1) .rk { background:#ffd166; color:#3a2a00; }
  #arkUi #miniBoard > li:nth-child(2) .rk { background:#cfd6e6; color:#2c3244; }
  #arkUi #miniBoard > li:nth-child(3) .rk { background:#d9a066; color:#3a2400; }
  #arkUi .who { flex:1 1 auto; min-width:0; display:flex; align-items:baseline; gap:5px; }
  #arkUi .nm { font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; min-width:0; flex:0 1 auto; }
  #arkUi li.me .nm { color:#3ddc84; }
  #arkUi .sc { font-size:10px; color:#7d83a8; white-space:nowrap; flex:0 0 auto; }
  #arkUi .lv { font-size:11.5px; font-weight:700; color:#ffd166; white-space:nowrap;
    flex:0 0 auto; font-variant-numeric:tabular-nums; }
  @media (max-width:420px) { #arkUi .sc { display:none; } }

  /* 自己那行的 [编辑]：取代原 [我] 徽标（ISSUE-20261029-45） */
  #arkUi .meEdit { flex:0 0 auto; padding:3px 8px; font-size:10.5px; font-weight:700;
    border-radius:6px; background:rgba(61,220,132,.16); color:#7ef0ab;
    border:1px solid rgba(61,220,132,.45); cursor:pointer; font-family:inherit;
    touch-action:manipulation; }
  #arkUi .meEdit:active { transform:scale(.94); }

  /* 编辑抽屉：展开在「自己那一行」下方（不是弹窗、不换屏） */
  #arkUi #miniBoard > li.editRow { display:block; padding:7px 8px 9px; margin:-1px 0 4px;
    border-radius:0 0 8px 8px; background:rgba(61,220,132,.05);
    border-color:rgba(61,220,132,.28); border-top:0; }
  #arkUi .edline { display:flex; gap:6px; align-items:center; }
  #arkUi .pname { flex:1 1 auto; min-width:0; background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.16); color:#fff; border-radius:8px;
    padding:7px 9px; font-size:12.5px; font-weight:600; outline:none; font-family:inherit; }
  #arkUi .pname:focus { border-color:#3ddc84; }
  #arkUi .psave { flex:0 0 auto; background:#3ddc84; color:#06301c; border:0; border-radius:8px;
    padding:7px 11px; font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; }
  #arkUi .psave:active { transform:scale(.96); }
  #arkUi .perr { margin-top:5px; font-size:11px; color:#ff8a8a; line-height:1.5; }
  #arkUi .ednote { margin-top:6px; font-size:10.5px; color:#7d83a8; line-height:1.55; }
  #arkUi .ednote b { color:#ffd166; font-weight:700; }

  /* 未上榜时的编辑入口（榜单底部一行，点开同一套编辑抽屉） */
  #arkUi #miniBoard > li.setRow { display:block; padding:0; border-style:dashed;
    border-color:rgba(255,255,255,.18); }
  #arkUi #btnSetName { display:block; width:100%; padding:9px; background:none; border:0;
    color:#9aa0c0; font-size:12px; font-family:inherit; cursor:pointer; touch-action:manipulation; }

  #arkUi .dfoot { flex:0 0 auto; padding:7px 8px 9px; border-top:1px solid rgba(255,255,255,.08); }
  #arkUi .ghost { display:block; width:100%; background:rgba(255,255,255,.06); color:#cfd2ff;
    border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:8px;
    font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
  #arkUi .ghost:active { transform:scale(.98); }
  #arkUi .empty { text-align:center; color:#9aa0c0; padding:24px 10px; font-size:12px; line-height:1.7; }

  /* 顶部提示条 / toast */
  #arkUi #hint { position:fixed; left:0; right:0; top:0; z-index:calc(var(--z-fullrank) + 1);
    padding:8px 12px; font-size:12.5px; line-height:1.5; font-family:inherit;
    background:#8a5a00; color:#fff; text-align:center; }
  #arkUi #hint.ok { background:#1f6f3f; }
  #arkUi #hint.hide { display:none; }
  #arkUi #toast { position:fixed; left:50%; bottom:14%; transform:translateX(-50%);
    z-index:calc(var(--z-fullrank) + 1); max-width:86%; padding:11px 15px; border-radius:10px;
    font-size:13px; line-height:1.6; background:rgba(0,0,0,.86); color:#fff;
    text-align:center; display:none; white-space:pre-line; }
</style>
</head>
<body>

<div id="topbar">
  <h1>方舟战棋</h1>
</div>
<div id="game">
  <div id="boardWrap">
    <div id="board"></div>
    <div id="unitLayer"></div>
    <div id="fxLayer"></div>
    <!-- 地图角标（ISSUE-20261029-21）：👤 左上格 / ⚙ 右上格 / ♟️ 右下格，尺寸 = 一格。
         不能放进 #board —— paintBoard() 每帧都 innerHTML 重刷那一层，角标会被冲掉。 -->
    <button id="lobbyOpenBtn" title="账号与排行" aria-label="账号与排行" aria-expanded="false">👤</button>
    <button id="setOpenBtn" title="设置" aria-label="设置" aria-expanded="false">⚙</button>
    <button id="charOpenBtn" title="角色面板" aria-label="角色面板" aria-expanded="false">♟️</button>
    <!-- ISSUE-20261029-44 第1项：第 4 角标（地图左下格），先留空不接功能，仅与其余角标同款绿色占位 -->
    <div id="cornerExtra" aria-hidden="true"></div>
    <!-- 选角厅「技能说明展开层」（ISSUE-20261029-29）：点角色后盖在棋盘中部（第 1 行 ~ 倒数第 2 行），
         出口所在的第一行不遮。放在 #boardWrap 里而不是 #board 里：paintBoard() 每次都 innerHTML
         重建 #board 那一层，放进去会被冲掉。位置由 layoutCharInfoSheet() 按格子矩形实算。 -->
    <div id="charInfoSheet" hidden></div>

<script>
/* ---- P0.1-1 冻结基线：版本号 ----
 * 用途：排障与回滚定位 + 让玩家确认「是不是最新版」。
 * 查法：控制台 `window.__ARK_VERSION__`，或点左上角 ⚙ 展开「设置」，标题栏「设置」右侧即可见。
 *
 * 字段说明：
 *   version  —— 语义版本（跟随 README §5 阶段里程碑）
 *   build    —— 构建号 `MMDDHHmm`（月日时分，如 10282132 = 10月28日 21:32）；★ 每次发版必须同时改这里和 DLC index.html 的 BUILD，
 *               否则 iframe 的 `game.html?v=BUILD` 不会刷新缓存，玩家会继续看旧版。
 *   commit   —— ★ 冻结基线提交（9a4137c），不是当前提交：git 无法自引用自身 sha。
 *               P0.1-3 构建脚本上线后，改为构建时注入真实 sha。
 *   builtAt  —— 基线冻结时间 */
window.__ARK_VERSION__ = {
  version: '0.1.0-prototype',
  build:   '10301634',
  commit:  'unknown',
  builtAt: '2026-10-30T08:54:54Z'
};
(function () {
  var v = window.__ARK_VERSION__, el = document.getElementById('setVer');
  if (!el) return;
  // 标题栏空间有限：只显示日期构建号；完整信息放 title，鼠标悬停/长按可看
  el.textContent = 'v' + v.build;
  el.title = 'v' + v.version + '\n构建 ' + v.build + '\n基线 ' + v.commit.slice(0, 7) + ' (' + v.builtAt.slice(0, 10) + ')';
})();

/* =========================================================================
 * 方舟战棋 · 单文件版（无构建、无依赖，双击即可玩）
 *
 * 代码分区（从上到下）：
 *   1. 数据与常量        — 角色 / 敌人 / buff / 阶段名 / 方向表
 *   2. 运行时状态        — 关卡、路径、技力、升级、UI 缓存
 *   3. DOM 引用与基础工具 — log / sleep / 距离 / 随机
 *   4. 掷骰与面板        — d20 检定、AC、派生属性、敌人面板
 *   5. 六维雷达图        — canvas 绘制 + 属性点点击热区
 *   6. 规则判定（纯逻辑） — 路径 → 主动行动（攻击 / 技能 / 闪避节点）、技力、冲锋
 *   7. 战斗反馈（DX）    — 浮动文字 / 粒子 / 弹道 / 受击闪烁
 *   8. 结算工具          — 击杀、落败、通关、玩家受伤反馈（收敛重复逻辑）
 *   9. 地图生成          — 连通区域生长 + 障碍 + 敌人 / 道具落点
 *  10. 关卡与回合生命周期 — initLevel / initCharSelect / 重置
 *  11. 渲染              — 棋盘、单位层、角色卡、数值面板、按钮
 *  12. 输入              — 键盘、指针拖拽、日志窗、布局切换
 *  13. 战斗结算          — resolveStep 及其子步骤
 *  14. 成长与奖励        — 升级、buff、下一关
 *  15. 启动              — initCharSelect()
 *
 * 约定：
 *   - 所有跨函数状态仍为顶层 let（便于热改与调试），命名统一见第 2 区。
 *   - 纯逻辑函数不碰 DOM；渲染函数不改战斗状态；结算函数通过返回值报告「是否致死」。
 *   - 新增角色时，只需在 CHARACTERS 里加数据 + 在「规则判定」区加它的技能分支。
 * ========================================================================= */
/* src: src/data/constants.js */
/* P0.1-4 机械拆分：从 game.html（20261028b 基线）第 487-522 行原样搬移（常量与方向表）。
 * 纯移动未改逻辑；顺序由 build/manifest.json 保证与拆分前一致。 */
const SPAWN_CLEAR_RADIUS = 2;
const OBSTACLE_MAX_GROUP = 4;
const OBSTACLE_GROUPS_TRY = 8;
/* ★ 固定棋盘尺寸（ISSUE-20261029-29，人类 2026-10-29 04:42 定为 9×9，2026-10-29 07:31 改为 11×11）
 * 「地图改成固定的 11*11，随机地图的机制不变，最长的列和最长的行都固定为 11」。
 * 旧公式按关卡把地图从 16×16 一路长到 25×25（格子越往后越小、走位越挤），
 * 现在行列都写死 11：内部可用 9×9 = 81 格，随机生成流程（growRegion → smooth →
 * placeObstacles → 起点筛选）一行不改，只是把「目标可走格数」从 70+ 降到适配 81 格的量级。 */
const BOARD_ROWS = 11;
const BOARD_COLS = 11;
/* 目标可走格数（喂给 growRegion，最终还要再被 smooth / placeObstacles 削一轮）。
 * 11×11 内部有 9×9 = 81 格：按 9×9 时代 46（＝内部 94%）等比放大到 70（≈内部 86%），
 * 既留得出掩体也留得出绕后的路；generateMap 的 ±15 容差会自动收口。 */
const BOARD_TARGET_WALKABLE = 70;
/* 单关敌人上限：9×9 定版后从 6 降到 5。
 * 旧地图 16×16（后期 25×25）装 6 只还有走位空间；9×9 内部只有 49 格、实际可走 ~38 格，
 * 6 只 + 玩家会把整张图塞满：generateMap 要求「两两曼哈顿 ≥2 且离玩家 ≥5」的起点，
 * 6 只经常凑不出来 → 400 次尝试全失败 → 掉进兜底空房间（地形变得千篇一律）。
 * 降到 5 后起点筛选稳定通过，同时难度不会崩（敌人数量公式 3+⌊(关-1)/2⌋ 不变，只是封顶低一档）。 */
const MAX_ENEMIES_PER_LEVEL = 5;
const UNIT_MOVE_MS = 120;
const ABILITY_CAP = 20;
/* 属性点改为绑定「升级」发放：每 LEVELUP_EVERY_N_LEVELS 关升 1 级时给 2 点（ISSUE-20261028-03）。
 * 旧常量 ABILITY_POINTS_PER_LEVEL = 1 已移除（曾每通关 1 关给 1 点）。 */
const ABILITY_POINTS_PER_LEVELUP = 2;
const PLAYER_RANGE = 3;   // 远程角色的攻击节点射程（近战角色攻击节点只打相邻 1 格）
/* ★ 玩家伤害骰（人类 2026-10-29 01:37 指定）：近战 2d4、远程 1d8。
 * 公式 = 骰子 + 属性修正（近战 STR / 远程 INT）+ 锈蚀刀片（仅近战），暴击再 ×2（乘在总伤害上）。
 * 与敌人侧同一套 dice 形（{n, s}），rollEnemyDamage 用掷骰、面板用 diceAvg 期望值。
 * 为什么不再用「1 + 属性修正」的定值：定值让近战只有 2 点，砍不动 18 HP 的敌人（删除自动补刀后
 * 一回合只能出手 1 次，定值撑不起单回合输出）；改成骰子后近战期望 2d4+1=6、远程 1d8+1=5.5。 */
const PLAYER_MELEE_DICE  = { n: 2, s: 4 };   // 2d4
const PLAYER_RANGED_DICE = { n: 1, s: 8 };   // 1d8
/* 玩家基础 HP 加成（ISSUE-20261028-04 配套）。
 * 敌人伤害从「常量 1」改为骰子后，首关承伤期望从每回合 0.99 涨到 1.38（+39%），
 * 玩家 HP10 撑不到清场，实测「第 1 关即死」比例 40% → 55%。补 4 点基础 HP 把它拉回来：
 * 前期收益最大（10→14，+40%），后期被 con/升级稀释（20→24，+20%），符合「前期该更宽容」。
 * 校准记录：+2 时 80 局测试仍为 -43%（旧 1.21 关 → 新 0.69 关），故提到 +4。
 * ★ ISSUE-20261029-25（2026-10-29）：删掉自动补刀被动后 100% 阵亡、73.8% 死在第 1 关，
 *   与「每回合 2 动作」同批把本值 4 → 9。80 局：均关 1.30 → 1.86、L1 死亡率 73.8% → 37.5%。
 *   单加 HP 治不了华法琳/阿米娅（她们是清场太慢），所以这条必须与 BASE_ACTIONS_PER_TURN 配套看。 */
const BASE_HP_BONUS = 9;

/* 每回合「可以做几件事」（攻击 / 技能 / 闪避各 1 件）—— ISSUE-20261029-25。
 * 删被动前玩家靠「每个 tick 对相邻补一刀」获得约两倍出手量；删掉后只剩一件/回合，
 * 清场速度腰斩 → 被围殴致死。把预算放回 2 件是最小、最可控的补偿：
 * 「攻击次数」上限（maxAttacks = 1 + extraAttacks）不变，所以不是简单翻倍输出。 */
const BASE_ACTIONS_PER_TURN = 2;

const ABILITY_ORDER = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
const ABILITY_FULL = { str: '力量', dex: '敏捷', con: '体质', int: '智力', wis: '感知', cha: '魅力' };

/* =========================================================
 * ★ 玩家经验制（ISSUE-20261028-10）
 * 升级不再按关卡号硬绑（旧：每 LEVELUP_EVERY_N_LEVELS 关升 1 级），改为：
 *   本关经验 = 保底 12 + 效率加成，效率 = 「该关允许的失血」− 实际失血。
 * 失血口径：关卡开始时血量 − 关卡结束时血量（关内回血会抵消，取 0 下限）。
 *
 * 为什么用「加法保底」而不是纯效率制：单关经验下限恒为 12，
 * 于是 12×3 = 36 = XP_TABLE[1]，第 3 关必升是纯算术保证，与玩家水平无关。
 * 单关上限 24 < 36 → 第 1 关永远升不了；两关满 48 ≥ 36 → 零失血可第 2 关升。
 *
 * 注意：这些常量与 enemies.js 的 LEVELUP_EVERY_N_LEVELS（敌人成长用）完全无关，
 * 禁止复用那个常量，改它会让 22 关所有敌人同时变形。
 * ========================================================= */
const XP_CLEAR_BASE = 12;        // 每关保底经验（决定保底升级的算术下限）
const XP_DMG_REF_RATIO = 0.40;   // 失血基准 = 本关开始血量 × 40%
const XP_DMG_REF_MIN = 2;        // 基准下限（残血进关时不至于 0 宽容度）
const XP_DMG_REF_MAX = 8;        // 基准上限
const XP_PER_STEP = 2;           // 少失 1 血 = +2 经验
const XP_EFF_CAP = 6;            // 效率步数封顶 → 最多 +12
const XP_MAX_LEVELUPS_PER_CLEAR = 3;  // 单次通关最多连升 3 级（防死循环）
/* 下标 = 当前等级，值 = 升到下一级所需经验。超出表长时按表尾 +100 递增。 */
const XP_TABLE = [0, 36, 64, 98, 140, 190, 250, 320, 400, 500];

/* =========================================================
 * 全局常量：阶段名 / 方向 / 朝向符号
 * 以前这些字面量散落在 60 多处（'planning'、[[1,0],...]、'▶' 等），
 * 改名或调整方向顺序时极易漏改。统一收在这里。
 * ========================================================= */
const PHASE = Object.freeze({
  CHAR_SELECT: 'char_select',
  PLANNING:    'planning',
  RESOLVING:   'resolving',
  LEVELCLEAR:  'levelclear',
  GAMEOVER:    'gameover',
  // 联机专用结束态。必须与 GAMEOVER 区分：正式版主页（index.html）会把
  // phase === 'gameover' 当成单人死亡，向排行榜上报 {level, kills}。
  // 联机局没有关卡与击杀语义，复用 'gameover' 会往榜单灌假成绩。
  PVP_OVER:    'pvp_over',
});
// 四方向表。顺序会影响 BFS 的先验路径（同距离时先探哪格），因此保留两套原始顺序，勿随意合并。
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];      // 邻格扫描 / 连通性

/* 精灵图挂载点。幂等：任意位置调都安全（代价是一次 getElementById）。
 * 插 body 末尾而不是头部：它就是一层 0x0 的定义库，位置不影响任何层叠。 */
function ensureIconSprite() {
  if (typeof document === 'undefined') return null;
  const exist = document.getElementById('arkIconSprite');
  if (exist) return exist;
  const host = document.body || document.documentElement;
  if (!host) return null;
  const box = document.createElement('div');
  box.id = 'arkIconSprite';
  box.setAttribute('aria-hidden', 'true');
  box.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
  box.innerHTML = ICON_SPRITE_HTML;
  host.appendChild(box);
  return box;
}

function escapeHtmlForIcon(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* 单个图标的内联 svg。class 默认 vico（尺寸 = 1em，跟随父级 font-size，不改就有通宿文本手感）。 */
function iconTag(slug, cls) {
  if (!slug) return '';
  return '<svg class="' + (cls || 'vico') + '" aria-hidden="true" focusable="false">' +
         '<use href="#ico-' + slug + '"/></svg>';
}

/* innerHTML 上下文用：字符串里的 emoji 全部换掉，已有的 HTML 标记不受影响。 */
function iconify(s) {
  if (s == null || s === '') return '';
  const str = String(s);
  EMOJI_ICON_RE.lastIndex = 0;
  if (!EMOJI_ICON_RE.test(str)) return str;     // 没有 emoji 是最常见的情况，早退
  EMOJI_ICON_RE.lastIndex = 0;
  ensureIconSprite();
  return str.replace(EMOJI_ICON_RE, function (m) {
    const slug = EMOJI_TO_ICON[m.split('\uFE0F').join('')];
    return slug ? iconTag(slug) : m;
  });
}

/* 纯文本上下文（战斗日志等）用：先转义再 iconify —— 顺序不能反，
 * 反了会把 svg 自己也转义掉，日志里出现一堆转义后的尖括号。 */
function iconifyText(s) {
  if (s == null || s === '') return '';
  return iconify(escapeHtmlForIcon(s));
}

/* ★ 静态 HTML 里的 emoji（例如模板里直接写死的 <button>👤</button>）不经过任何 JS 字符串，
 * iconify 够不到。这里用文本节点遍历补一刀 —— 只在启动时跑，不是每帧。
 * 每个命中的文本节点换成一个 display:contents 的 span，布局一像素都不会动。 */
function iconifyDom(root) {
  if (typeof document === 'undefined' || !document.createTreeWalker) return;
  const host = root || document.body;
  if (!host) return;
  ensureIconSprite();
  const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, null, false);
  const hits = [];
  while (walker.nextNode()) hits.push(walker.currentNode);
  for (let i = 0; i < hits.length; i++) {
    const node = hits[i];
    const v = node.nodeValue;
    if (!v) continue;
    EMOJI_ICON_RE.lastIndex = 0;
    if (!EMOJI_ICON_RE.test(v)) continue;
    EMOJI_ICON_RE.lastIndex = 0;
    const box = document.createElement('span');
    box.style.display = 'contents';
    box.innerHTML = iconifyText(v);
    if (node.parentNode) node.parentNode.replaceChild(box, node);
  }
}

try { ensureIconSprite(); } catch (_) {}
/* 模块求值点时脚本已在 body 末尾，静态 DOM 全部就位，可以立刻扫一遍。 */
try { iconifyDom(document.body); } catch (_) {}

/* 每个角色只有一种伤害方式，由攻击节点类型决定：
 *   近战 → 风笛、泥岩（用力量，面板显示「近战伤害」）
 *   远程 → 华法琳、阿米娅（用智力，面板显示「远程伤害」）
 * 因此 UI 只显示与角色对应的那一个伤害数值。
 * 注：远程角色被贴身时的趁乱打击固定 1 点保底伤害（不吃暴击/倍率），不读取近战伤害面板。
 */
function charAttackType(id) {
  const c = CHARACTERS[id];
  if (!c) return 'melee';
  return c.attackType || (c.profRanged ? 'ranged' : 'melee');
}
function isRangedChar(id) { return charAttackType(id) === 'ranged'; }
function charDmgLabel(id) { return isRangedChar(id) ? '远程伤害' : '近战伤害'; }

/* ISSUE-20261028-19：动态角色（预备干员）── 熟练与攻击类型由六维现算。
 *
 * 为什么不直接改 charAttackType()：它是纯函数、签名只有 id，读的是静态对象。
 * 硬改成「读当前 playerStats」会让 6 个消费点在选角 / 联机 / 结算不同相位下读到不同的东西。
 * 所以保留它原样给四个静态角色用，另开一个**可传六维**的版本，由调用方决定拿哪份数据。
 * 规则只有一句：int > str → 远程；否则（含相等）→ 近战。严格大于，不为相等单开分支。 */
function charIsDynamic(id) {
  const c = CHARACTERS[id];
  return !!(c && c.dynamicProf);
}
function dynamicAttackTypeOf(abilities) {
  return (abilities && abilities.int > abilities.str) ? 'ranged' : 'melee';
}
function charAttackTypeOf(id, abilities) {
  if (charIsDynamic(id)) {
    /* 动态角色必须给六维：缺省时退回静态兜底（attackType 写的是 melee，即「不加点」的结果） */
    return dynamicAttackTypeOf(abilities || CHARACTERS[id].abilities);
  }
  return charAttackType(id);
}
function isRangedCharOf(id, abilities) { return charAttackTypeOf(id, abilities) === 'ranged'; }
function charDmgLabelOf(id, abilities) {
  return isRangedCharOf(id, abilities) ? '远程伤害' : '近战伤害';
}

const BOSS_EVERY_N_LEVELS = 10;      // 第 10/20/30… 关各登场一次
const BOSS_TYPE = 'colossus';
const BOSS_INTENT_EXTRA_STEPS = 2;   // 意图预告额外多显示 2 步（让玩家预判推动方向）
const COLOSSUS_ROCK_EVERY = 2;       // 每 2 回合落一块粗圆岩
const COLOSSUS_ROCK_SELF_DAMAGE = 1; // 推动撞碎粗圆岩时 Boss 自己掉的 HP
/* ★ 眩晕取值 2 而不是 1：
 * 玩家被推发生在「敌人移动阶段」，紧接着 endRound 就会递减一次；
 * 若设 1 → 当回合就被减到 0 → 下一回合照常行动 = 完全没眩晕。
 * 设 2 → 本回合末减到 1（下一回合不能动），再一回合末减到 0（恢复）。
 * 与敌人的 `stunTurns = 2` 约定一致（见 templates 里 bomber/敌人眩晕注释）。 */
const COLOSSUS_PUSH_STUN = 2;

/* 本关是不是 Boss 关（第 10/20/30… 关） */
function isBossLevel(level) {
  return level > 0 && level % BOSS_EVERY_N_LEVELS === 0;
}

/* =========================================================
 * 类型解锁与权重（ISSUE-20261028-04）
 * 旧口径是 `ENEMY_TYPES[randInt(3)]` 均匀随机 → 第 1 关就有 33% 外星人（远程狙击），
 * 新手关挨狙且毫无节奏。现在按关卡分批解锁，前期只有近战骷髅。
 * ========================================================= */
const ENEMY_UNLOCK = [
  { from: 1,  type: 'skeleton', w: 4 },
  { from: 3,  type: 'ghost',    w: 3 },
  { from: 5,  type: 'alien',    w: 2 },
  { from: 8,  type: 'shield',   w: 2 },
  { from: 12, type: 'bomber',   w: 2 },
];

/* 按本关可用类型 + 权重抽一个。仍走全局 rng()，与旧版同一随机来源。 */
function pickEnemyType(level) {
  const pool = ENEMY_UNLOCK.filter(u => level >= u.from);
  if (pool.length === 0) return 'skeleton';
  let total = 0;
  for (const u of pool) total += u.w;
  let r = randInt(total);
  for (const u of pool) {
    if (r < u.w) return u.type;
    r -= u.w;
  }
  return pool[0].type;
}

/* 伤害骰：dice 形如 [n, sides]。未定义时退回面板常量的兜底。
 * 狂暴词缀的 +1 在掷骰之后叠加（ISSUE-20261028-05），保证「骰子本体不变、只是更疼」。 */
function rollEnemyDamage(e, kind) {
  const dd = kind === 'ranged' ? e.rangedDice : e.meleeDice;
  if (!dd) return (kind === 'ranged' ? e.rangedDmg : e.meleeDmg) + enemyDamageBonus(e);
  let total = 0;
  for (let i = 0; i < dd.n; i++) total += 1 + randInt(dd.s);
  return total + enemyDamageBonus(e);
}

/* 骰子期望值（面板展示 / AI 估算用）：n × (sides+1) / 2，四舍五入且至少 1。 */
function diceAvg(dd) {
  if (!dd) return 1;
  return Math.max(1, Math.round(dd.n * (dd.s + 1) / 2));
}
function diceLabel(dd) {
  if (!dd) return '';
  return `${dd.n}d${dd.s}`;
}

/* =========================================================
 * ★ 敌人成长推演（ISSUE-20261028-03）
 * 敌人每关都会整批重建（initLevel 里 enemies = []），没有跨关的个体身份，
 * 所以「第 6 关的敌人提了 6 次属性」不能靠运行时记忆，只能在生成时从 L1 推演到第 L 关。
 *
 * 随机源必须与全局 rng() 隔离：全局 rng() 有滚动状态，用它算成长会导致
 * 每次重绘敌人面板都换一批数值（本项目的硬要求是「意图可预判」）。
 * 因此按「本局种子 + 关卡 + 实例下标 + 类型」派生一颗固定种子。
 * ========================================================= */
function enemyGrowthRng(seed) {
  let a = (seed >>> 0) || 0x9E3779B9;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 生成第 level 关的第 idx 个敌人时，从 L1 逐关推演到 level：
 *   每关 1) 在当前「最高的 4 项」里随机 +1（排除上一次选的那项，相邻两次不重复）
 *        2) 每 3 关升 1 级 → HP 加成 += max(0, 体质调整值)（与角色升级算法同构）
 * 返回成长后的六维、HP 上限与敌人等级。 */
function computeEnemyGrowth(type, level, idx, runSeed) {
  const base = ENEMY_STATS[type].abilities;
  const a = { str: base.str, dex: base.dex, con: base.con, int: base.int, wis: base.wis, cha: base.cha };
  const typeIdx = Math.max(0, ENEMY_TYPES.indexOf(type));
  /* 种子**不含 level**：这样「第 L 关的第 i 个敌人」就是「第 1 关第 i 个敌人」连续成长 L 次的结果
   * （前缀稳定）。若把 level 混进种子，每次换关都会重掷一整条序列，同一只敌人前后不连贯。 */
  const rnd = enemyGrowthRng((((runSeed >>> 0) + idx * 977 + typeIdx * 7919) >>> 0));
  let hpBonus = 0;
  let lastKey = null;

  for (let lv = 1; lv <= level; lv++) {
    /* 1) 属性提升：候选池 = 当时最高的 4 项（并列按 ABILITY_ORDER 稳定排序），再排除上一次的选择 */
    const top4 = ABILITY_ORDER
      .filter(k => a[k] < ABILITY_CAP)
      .sort((x, y) => (a[y] - a[x]) || (ABILITY_ORDER.indexOf(x) - ABILITY_ORDER.indexOf(y)))
      .slice(0, 4)
      .filter(k => k !== lastKey);
    if (top4.length > 0) {
      const pick = top4[Math.floor(rnd() * top4.length)];
      a[pick] += 1;
      lastKey = pick;
    }
    /* 2) 每 3 关升级一次：HP 上限 += max(0, 体质调整值)，与角色 openLevelUp 完全同构 */
    if (lv % LEVELUP_EVERY_N_LEVELS === 0) hpBonus += Math.max(0, abilityMod(a.con));
  }
  return { abilities: a, maxHp: a.con + hpBonus, level: Math.floor(level / LEVELUP_EVERY_N_LEVELS), hpBonus };
}

/* =========================================================
 * ★ 词缀与精英（ISSUE-20261028-05）
 *
 * 目的：让第 13 关之后不再只是「同一件事数字变大」。词缀给敌人多一个**行为维度**，
 * 精英给单关一个**记忆点**。
 *
 * ★ 随机源：复用 enemyGrowthRng 工厂但换偏移量，**绝不用全局 rng()**
 *   （全局有滚动状态，用它会导致每次重绘面板词缀抖动，违反「意图可预判」）。
 *   种子含 level —— 与成长不同，这里不需要前缀稳定，只需要「同一 RUN_SEED 同一关一致」。
 *
 * ★ 首轮不做「分裂」词缀：它会在结算中途新增数组元素，破坏 enemyPathOrder 的落位顺序
 *   与 enemies[i].id 的稳定性（历史上「敌人永久罚站」的 bug 就源于落位顺序）。
 * ========================================================= */
const AFFIX_DEFS = {
  shield: { name: '护盾', short: '盾', icon: '🛡' },
  swift:  { name: '迅捷', short: '疾', icon: '💨' },
  frenzy: { name: '狂暴', short: '暴', icon: '🔥' },
  thorns: { name: '荆棘', short: '棘', icon: '🌵' },
};
const AFFIX_ORDER = ['shield', 'swift', 'frenzy', 'thorns'];
/* L5–L9 只放这两个（护盾/迅捷是"读得懂、不劝退"的），L10+ 再放开狂暴/荆棘 */
const AFFIX_POOL_EARLY = ['shield', 'swift'];
const AFFIX_POOL_LATE  = ['shield', 'swift', 'frenzy', 'thorns'];
const AFFIX_LATE_FROM_LEVEL = 10;
const AFFIX_CHANCE_EARLY = 0.30;
const AFFIX_CHANCE_LATE  = 0.45;

const ELITE_FROM_LEVEL = 5;      // L5 起每关至少 1 个精英
const ELITE_HP_MUL = 1.5;        // 精英 HP 上限 ×1.5（向上取整）
const ELITE_AFFIX_COUNT = 2;     // 精英必带 2 个词缀
const AFFIX_SEED_OFFSET = 104729;

/* 词缀/精英的专用随机工厂（与成长序列互不干扰） */
function affixRng(level, idx, runSeed, tag) {
  return enemyGrowthRng((((runSeed >>> 0) + level * 613 + idx * 3571 + tag * 8191 + AFFIX_SEED_OFFSET) >>> 0));
}

/* 本关精英是第几只（-1 = 本关没有精英）。确定性：同 RUN_SEED 同一关恒定。 */
function eliteIndexFor(level, count, runSeed) {
  if (level < ELITE_FROM_LEVEL || count <= 0) return -1;
  const r = affixRng(level, 0, runSeed, 1)();
  return Math.min(count - 1, Math.floor(r * count));
}

/* 生成第 level 关第 idx 只敌人的词缀方案：{ isElite, affixes[] } */
function rollEnemyAffixPlan(level, idx, count, runSeed) {
  const isElite = idx === eliteIndexFor(level, count, runSeed);
  const late = level >= AFFIX_LATE_FROM_LEVEL;
  const pool = (late ? AFFIX_POOL_LATE : AFFIX_POOL_EARLY).slice();
  const rnd = affixRng(level, idx, runSeed, 2);
  let want;
  if (isElite) want = ELITE_AFFIX_COUNT;
  else want = rnd() < (late ? AFFIX_CHANCE_LATE : AFFIX_CHANCE_EARLY) ? 1 : 0;
  want = Math.min(want, pool.length);
  const affixes = [];
  for (let i = 0; i < want; i++) affixes.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  return { isElite, affixes };
}

function enemyHasAffix(e, id) {
  return !!(e && e.affixes && e.affixes.indexOf(id) >= 0);
}
/* 狂暴：HP 严格低于一半时才生效（= 一半时还不生效，边界明确好测） */
function enemyIsFrenzied(e) {
  return enemyHasAffix(e, 'frenzy') && e.hp > 0 && e.hp * 2 < e.maxHp;
}
/* 实际移动力：基础 + 迅捷(+2) + 狂暴(+2)。AI 寻路与面板都读这个，别直接读 e.move。 */
function enemyMoveOf(e) {
  if (!e) return 1;
  let m = e.move || 1;
  if (enemyHasAffix(e, 'swift')) m += 2;
  if (enemyIsFrenzied(e)) m += 2;
  return m;
}
function enemyDamageBonus(e) {
  return enemyIsFrenzied(e) ? 1 : 0;
}

/* 词缀给玩家看的短标签，如「精英 🛡盾 💨疾」 */
function enemyAffixLabel(e) {
  if (!e || !e.affixes || e.affixes.length === 0) return '';
  return e.affixes.map(id => `${AFFIX_DEFS[id].icon}${AFFIX_DEFS[id].short}`).join(' ');
}

/* 玩家对敌人造成伤害的统一入口（护盾词缀在这里吃掉第一击）。
 * 返回实际扣掉的血量（0 = 被护盾完全吸收）。 */
function enemyTakeDamage(e, dmg) {
  if (!e || dmg <= 0) return 0;
  if (e.shieldLeft > 0) {
    e.shieldLeft -= 1;
    floatText(e.x, e.y, '护盾 -0', '#7fd1ff');
    ringFx(e.x, e.y, '#7fd1ff');
    log(`🛡 ${ENEMY_STATS[e.type].name}${e.id + 1} 的护盾吸收了 ${dmg} 点伤害，护盾破碎。`);
    refreshUnits();
    return 0;
  }
  e.hp -= dmg;
  return dmg;
}

/* 荆棘：被近战命中后反弹 1 点给玩家（被打死的不反弹）。
 * 返回 true 表示玩家因此阵亡。 */
function enemyThornsReflect(e) {
  if (!enemyHasAffix(e, 'thorns')) return false;
  if (!e.alive || e.hp <= 0) return false;          // 这一击已经打死它 → 不反弹
  if (!player || !player.alive) return false;
  const res = damagePlayer(1, '荆棘');
  if (res.dmg > 0) {
    log(`🌵 ${ENEMY_STATS[e.type].name}${e.id + 1} 的荆棘反弹 1 点伤害。`);
    floatText(player.x, player.y, '荆棘 -1', '#c77dff');
    updateStats();
  } else if (res.shielded) {
    log(`🌵 荆棘反弹被护盾抵消。`);
  }
  if (player.hp <= 0) { player.alive = false; refreshUnits(); endGame(); return true; }
  return false;
}

/* src: src/rules/state.js */
/* P0.1-4 拆分 · 20261028b 基线 673-728 行 · 运行时状态（关卡 / 路径 / 技力 / 闪避 / 冲锋额度） */
let phase = PHASE.CHAR_SELECT;
/* 联机模式开关：'solo' 单人 / 'pvp' 对战。
 * 必须在这里声明（而不是写在文件末尾的联机区块里）：
 * renderUnits / confirmAction 定义在前，而 setLayout 在顶层就会被调用，
 * 那时若 mode 还处于 TDZ，会直接抛 ReferenceError。 */
let mode = 'solo';
let peer = null;              // 联机时的对手显示单位
let charCandidates = [];
let selectedCandidate = null;
let isMoving = false;
let selMap = [];
let selExit = { x: 7, y: 4 };
let selectedChar = null;
let level = 1;
let ROWS = 11, COLS = 11;
let map = [];
/* ★ ISSUE-20261028-10-B：粗圆岩（Boss 每 2 回合落的动态墙）。
 * 记的是 "x,y" 字符串集合；`map[y][x]` 同步置 1，所以**所有既有的墙判定
 * （寻路 / 视线 / 站位）自动把它当墙**，不需要在别处再加判断。
 * 这个集合只用来做三件事：① 渲染成石头而不是灰墙 ② 被 Boss 撞碎时还原地板 ③ 关卡重置时清空。
 * ⚠️ initLevel 里必须 clear()：map 是新生成的，但集合是跨关的全局状态。 */
let roughRocks = new Set();
let player = null;
/* 整局击杀累计（ISSUE-20261030-52）：成绩上报改事件驱动后，击杀数不再由外壳每 300ms
 * 采样 enemies 数组去猜，而是游戏侧在这里累加、结算时一次性给外壳（避免快速清关
 * 紧接着换关时少记杀）。归零在 resetRunProgress()（src/rules/reset.js）——
 * 那是「整局」级重置；不要放到 initLevel，它每关都跑，会把整局累计冲掉。 */
let runKills = 0;
let enemies = [];
let rewardItems = [];
let bloodDrops = [];
let playerPath = [];
/* 路径节点：下标 = playerPath 下标。attackIndices = 攻击节点，skillIndices = 技能节点；
 * 同一个下标只能属于其中一种（单击攻击 / 双击技能）。 */
let attackIndices = [];
let skillIndices = [];
let enemyPaths = [];
// 寻路时的处理顺序（离玩家近的优先）。结算层必须用同一顺序落位，
// 否则「跟到同伴刚腾出的格子」这种合法走位会因为顺序错位被误判受阻。
let enemyPathOrder = [];
let logLines = [];
let enemyArrows = [];
// 调试模式：无敌 + 点击秒杀（ISSUE-20261028-11）。状态仅通过连点设置面板版本号 5 次切换，
// 且只在控制台暴露 window.__ARK_DEBUG__，游戏内无任何提示/日志/视觉标记（纯隐藏开关）。
// ISSUE-20261030-55 起有身份门槛：只有「账号口令 === ARK_ADMIN_CODE」的管理员能开。
let debugMode = false;
// 控制台可读隐藏开关状态（非玩家可见提示）。
Object.defineProperty(window, '__ARK_DEBUG__', { get: () => debugMode, configurable: true });

/**
 * 是不是管理员（ISSUE-20261030-55）：账号串尾部的数字口令 === ARK_ADMIN_CODE。
 * 判定实现在账号层 src/shell/02-account.js（本文件之后才加载），但本函数只在
 * **用户点击版本号 / 各处复位**时被调用，那时账号层一定已就绪；
 * 取不到账号层（裁剪版、单测裸环境）一律按「非管理员」处理 —— 失败方向必须是「关」。
 */
function isAdmin() {
  try {
    var acct = (window.ArkShell && window.ArkShell.account) ? window.ArkShell.account : null;
    return !!(acct && acct.isAdmin && acct.isAdmin());
  } catch (e) { return false; }
}

// 统一入口：切换/重置调试开关。改这里即可同步 window.__ARK_DEBUG__。
// 「开」过管理员闸门（绕过 UI 直接调也挡得住，见 ISSUE-20261030-55 期望 §3）；
// 「关」永远放行 —— 回选角 / 开新局 / 重置 / 联机四处的复位不能被闸门吃掉。
function setDebugMode(on) {
  if (on && !isAdmin()) { debugMode = false; return false; }
  debugMode = !!on;
  return debugMode;
}
let lastPathSignature = '';
let playerChargingThisTurn = false;
let playerAttacksDone = 0;
// 闪避机制：回合内第一次「等待」= 闪避动作（AC 加成，持续到回合结束）
let playerDodging = false;
let playerDodgeACBonus = 0;
// 本回合闪避触发的路径下标（-1 = 本回合不闪避）
let dodgeTriggerIndex = -1;
/* ISSUE-20261029-40：闪避的「到达闪避格即生效」改在落地 tick 判定后，等待步不再负责触发。
 * 这个标记表示本回合的闪避已经**结算过**（成功或动作不足被否决都算），
 * 防止后续等待步 tick 重复扣动作 / 重复刷日志。 */
let dodgeResolved = false;
// 本回合已使用的「动作」数：上限 = maxActionsThisTurn() = BASE_ACTIONS_PER_TURN(2) + extraAttacks，
// 闪避 / 攻击 / 技能各占 1 个（ISSUE-20261029-25 起不再是「一回合只做一件事」）
let playerActionsUsed = 0;
let fencerCounterActive = false;
let playerStats = {};
let playerChargeStopReason = null;
let playerChargeCausedDamage = false;
/* 冲锋额度（ISSUE-20261028-01）：剩余攻击次数 / 已命中次数 / 冲锋朝向（停下后按朝向找补充目标） */
let playerChargeBudget = 0;
let playerChargeHits = 0;
let playerChargeDir = { dx: 1, dy: 0 };
let pendingAttack = false;
/* ★ ISSUE-20261029-34：原地技能（技能节点落在起点 idx 0）——本回合第一个 tick 就发动，不移动。
 * 与 pendingAttack 同类：都是一个「先于路径步结算」的一次性标记。 */
let pendingStartSkill = false;
let pendingChargeInfo = null;
let amiyaBonusTargets = 0;
/* ★ ISSUE-20261029-28 预备干员「增援召唤」
 * rookieSp     技力（每次造成朝向攻击 +1，上限 5；跨关继承，换角色 / 重开清零）
 * squadUnits   场上小队成员（**不入 enemies 数组**：它们不是敌人，不该被 AI 当目标、也不参加相杀结算）
 * lastSquadType 上一次召唤的类型（「不连续重复」靠它排除）
 * squadSeq     成员 uid 自增源（渲染层拿它当 key，不能用数组下标 —— 数组会 filter） */
let rookieSp = 0;
let squadUnits = [];
let lastSquadType = null;
let squadSeq = 0;
let levelHpBonus = 0;
// 点角色卡里的「近战伤害 / 远程伤害」→ 在地块上叠蓝色显示攻击范围
let showRangeOverlay = false;

/* src: src/rules/relics.js */
/* P0.1-4 拆分 · 20261028b 基线 730-777 行 · 升级与奖励池 buff / 统一受伤入口 */
/* =========================================================
 * ★ 升级（ISSUE-20261028-10）
 * =========================================================
 * ★ ISSUE-20261028-06（2026-10-30 版本更新）：本模块从「buff 层」升级为「遗物层 + 关卡事件池」。
 *   · 原 6 个 buff 全部并入统一遗物池 RELIC_POOL，独立 `relics` 层删除（状态字典改名为 relics）；
 *   · 文件路径**故意不改**（仍叫 src/rules/relics.js）：改名必须同步 build/manifest.json，
 *     登记漏一格整个功能会静默不生效（本期已知坑），收益 < 风险。文件名里的 buff 只是历史痕迹。
 * ========================================================= */
const LEVELUP_EVERY_N_LEVELS = 3;
let heroLevel = 1;

/* ===== 玩家经验制（ISSUE-20261028-10） =====
 * xp            当前等级已累积的经验（升级时按阈值扣减）
 * pendingLevelUps 待结算的升级次数（通关时按 XP 一次算好，逐次弹奖励）
 *                旧变量 levelUpPending（布尔）已废弃：布尔装不下「一次连升 2 级」。
 * levelStartHp  本关开始时的血量（player.hp），失血口径的左端
 * levelActions  本关点了几次「开始行动」——**只用于日志**，不参与经验计算 */
let xp = 0;
let pendingLevelUps = 0;
let levelStartHp = 0;
let levelActions = 0;

/* 升到下一级所需经验（heroLevel 超出表长时按表尾 +100 递增） */
function xpThresholdForLevel(lv) {
  if (lv < XP_TABLE.length) return XP_TABLE[lv];
  return XP_TABLE[XP_TABLE.length - 1] + (lv - (XP_TABLE.length - 1)) * 100;
}
/* 该关「允许失血」的基准：按本关开始血量缩放，而不是 maxHp。
 * 挂 maxHp 会出现退化玩法：带 1 HP 进关 → 物理上掉不了血 → 每关都算零失血 → 永久满效率。 */
function xpDamageRef(startHp) {
  const raw = Math.round(startHp * XP_DMG_REF_RATIO);
  return Math.max(XP_DMG_REF_MIN, Math.min(XP_DMG_REF_MAX, raw));
}
/* 单关经验：hpLoss 取 0 下限（关内吃 ❤️ / 🩸 净回血时会算成负数，
 * 不夹会让 efficiency > ref，经验突破 24 上限，保底/上限两条算术保证同时失效）。 */
function computeLevelXp(startHp, endHp) {
  const hpLoss = Math.max(0, startHp - endHp);
  const ref = xpDamageRef(startHp);
  const eff = Math.max(0, Math.min(XP_EFF_CAP, ref - hpLoss));
  return { hpLoss, ref, eff, gain: XP_CLEAR_BASE + eff * XP_PER_STEP };
}
/* 通关时按经验排队升级次数（heroLevel 由 openLevelUp 逐次推进，这里只扣经验） */
function queueLevelUps() {
  let n = 0;
  while (n < XP_MAX_LEVELUPS_PER_CLEAR && xp >= xpThresholdForLevel(heroLevel + n)) {
    xp -= xpThresholdForLevel(heroLevel + n);
    n += 1;
  }
  pendingLevelUps = n;
  return n;
}
/* =========================================================================
 * ★ 遗物（ISSUE-20261028-06）

 * 为什么重做：原来的 buff 只是个「+1/+2」层数字典（6 项里 5 项是纯数值），打到第 20 关
 * 也只有 6 次选择，每局组合高度雷同。现在统一到遗物池 RELIC_POOL：
 *   · 15 项，普通 / 稀有两级；其中 10 项是**规则类**（改玩法规则，不只是加数）；
 *   · 「必中协议」「轻装引擎」这种**有代价**的遗物最能制造 build 差异，优先给了稀有位；
 *   · 遗物取得节奏见 RELIC_EVERY_N_LEVELS（每通关 N 关一次 3 选 1，与经验升级解耦）。
 *
 * 数据格式：{ id, name, icon, desc, rarity:'common'|'rare', rule:true 表示规则类 }
 *  effect 说明写在 desc 里给玩家看，**真正生效的地方**在下面的钩子函数（relicXxx）与各战斗模块。
 * ========================================================================= */
const BASE_CRIT_CHANCE = 0.08;          // 玩家基础暴击率（磨刀石在此之上叠加）
const RELIC_COMMON_WEIGHT = 4;          // 抽选权重：普通 4 / 稀有 1 → 稀有出现率 ≈ 7/(8×4+7) ≈ 18%
const RELIC_RARE_WEIGHT = 1;
const RELIC_CRIT_PER_SHARPEN = 0.08;    // 磨刀石：每层 +8% 暴击
const RELIC_INSTINCT_DODGE_BONUS = 3;   // 危险直觉：闪避 AC 加成 3 → 6
const RELIC_ENGINE_MOVE = 2;            // 轻装引擎：每层移动 +2
const RELIC_ENGINE_AC = -2;             // 轻装引擎：代价 —— 每层 AC -2

const RELIC_POOL = [
  /* ---------- 普通：数值为主 ---------- */

  { id: 'sharpen',name: '磨刀石',   icon: '🪨', rarity: 'common', rule: false, desc: '暴击率 +8%' },
  { id: 'sass',   name: '香草沙士', icon: '🥤', rarity: 'common', rule: false, desc: '获得技力时有 30% 概率额外 +1 点' },
  /* ---------- 普通：规则类 ---------- */
  { id: 'kit',    name: '急救药箱', icon: '🧰', rarity: 'common', rule: true, desc: '每张地图必定额外出现 1 个恢复地块 ❤️' },

  { id: 'aim',    name: '必中协议', icon: '⛓️', rarity: 'rare', rule: true, desc: '攻击必定命中，但每次伤害 -1' },

const RELIC_BY_ID = Object.fromEntries(RELIC_POOL.map(r => [r.id, r]));

/* 遗物层数统计（同一个遗物可重复获得，效果累加） */
function freshRelics() {
  const o = {};
  for (const r of RELIC_POOL) o[r.id] = 0;
  return o;
}
let relics = freshRelics();

/* ---- 跨局 / 跨关的状态（ISSUE-20261028-06） ----
 * relicShieldUsedThisLevel  硬化外壳：每关只免疫一次，进关时重置（initLevel）
 * relicEchoArmed            回响回路：施法是**装填**、下次攻击才消耗；跨关清掉，避免带回新关
 * relicMaxHpPenalty         事件（血色契约）扣掉的 HP 上限，独立记账 —— 不能直接砍 abilities.con
 *                           （con 同时决定了 AC 与初始 HP，扣 con 等于二次惩罚且不显示在遗物栏）
 * nextLevelEnemyDelta       事件给下一关的敌人数修正（+1/-1），进下一关时**用完即清**（initLevel）
 * relicLevelsCleared        本局已通关数；每满 RELIC_EVERY_N_LEVELS 关 → 一次遗物 3 选 1
 * relicOfferPendingCount    待结算的遗物三选一次数（正常只会有 0/1，用计数是为了让掉落不会丢）
 */
let relicShieldUsedThisLevel = false;
let relicEchoArmed = false;
let relicMaxHpPenalty = 0;
let nextLevelEnemyDelta = 0;
const RELIC_EVERY_N_LEVELS = 3;
let relicLevelsCleared = 0;
let relicOfferPendingCount = 0;
let relicOfferOpen = false;
let relicOfferChoices = [];
let levelEventDue = false;      // 本关是否还欠一次事件（决策③：每关必弹）
let levelEventOpen = false;
let levelEventData = null;

/* 层数读取口：别在各战斗模块里直接写 relics.xxx，缺 key 时会读到 undefined */
function relicCount(id) { return relics[id] || 0; }
function relicOfferPending() { return relicOfferPendingCount > 0; }
function levelEventPending() { return levelEventDue; }

/* ---- 钩子：供 dnd.js / 结算层读取（仍然沿用旧函数名，改的是内部读 relics） ---- */
function relicMeleeBonus() { return relicCount('blade'); }          // 锈蚀刀片：近战 +1/层
function relicHpBonus()    { return relicCount('kettle') * 2; }     // 热水壶：HP 上限 +2/层
function relicRangedBonus() { return relicCount('scope'); }        // 战术目镜：远程 +1/层
function relicCritBonus()   { return relicCount('sharpen') * RELIC_CRIT_PER_SHARPEN; }
function relicMoveBonus()   { return relicCount('engine') * RELIC_ENGINE_MOVE; }
function relicAcPenalty()   { return relicCount('engine') * RELIC_ENGINE_AC; }
function relicAlwaysHit()   { return relicCount('aim') > 0; }
function relicAimDamagePenalty() { return relicCount('aim'); }     // 必中协议的代价：伤害 -1/层
function relicDodgeAcBonus(dodgeBase) {
  return dodgeBase + (relicCount('instinct') > 0 ? RELIC_INSTINCT_DODGE_BONUS : 0);
}

/* 香草沙士：每次获得技力时 30% 额外 +1（返回额外点数） */
const SASS_CHANCE = 0.3;
function sassExtraSp() {
  return (relicCount('sass') > 0 && rng() < SASS_CHANCE) ? 1 : 0;
}

/* 按稀有度加权抽 n 个**互不重复**的遗物（随机源 = rng()，同 seed 可复现）。
 * 为什么用「加权 bag + used 去重」而不是直接 shuffle 取前 n 个：
 *   shuffle 会先消耗随机序列给池子整体排序，新增/删除一个遗物就改变所有后续骰点，
 *   历史表现是「改一行数据，20 局回归测试的随机序列全变」。加权抽样则是每次 n 次骰点，
 *   池子内容变动的影响面小得多（验收要求「同次三选一内不出现重复项」这条照样满足）。 */
function pickRelicChoices(n = 3) {
  const bag = [];
  for (const r of RELIC_POOL) {
    const w = r.rarity === 'rare' ? RELIC_RARE_WEIGHT : RELIC_COMMON_WEIGHT;
    for (let i = 0; i < w; i++) bag.push(r);
  }
  const out = [];
  const used = new Set();
  let guard = 0;
  while (out.length < n && guard < 500 && used.size < RELIC_POOL.length) {
    guard += 1;
    const pick = bag[randInt(bag.length)];
    if (!pick || used.has(pick.id)) continue;
    used.add(pick.id);
    out.push(pick);
  }
  return out;
}

/* 随机直接给 1 个遗物（事件 / 预备干员专属福利用），返回遗物对象 */
function relicGrantRandom() {
  const c = pickRelicChoices(1)[0];
  if (c) applyRelic(c.id);
  return c || null;
}

function applyRelic(id) {
  const r = RELIC_BY_ID[id];
  if (!r) return;
  relics[id] = relicCount(id) + 1;
  if (id === 'kettle') {
    /* HP 上限 +2，并回复等量生命 */
    const oldMax = playerStats.maxHp;
    recomputePlayerDerivedStats();
    const diff = playerStats.maxHp - oldMax;
    playerStats.currentHp = Math.min(playerStats.maxHp, playerStats.currentHp + diff);
    if (player) {
      player.maxHp = playerStats.maxHp;
      player.hp = Math.min(player.maxHp, player.hp + diff);
    }
  } else if (id === 'blade') {
    recomputePlayerDerivedStats();          // 近战伤害 +1（结算时读 relicMeleeBonus）
    if (player) {
      player.meleeDmg = playerStats.meleeDmg;
    }
  } else if (id === 'scout') {
    playerStats.extraAttacks += 1;
    if (player) player.extraAttacks = playerStats.extraAttacks;
  } else {
    /* 其余遗物（目镜 / 磨刀石 / 轻装引擎 / …）全部写在 recomputePlayerDerivedStats 里，
     * 这里只需要把派生面板重算一次并同步回战斗单位。 */
    recomputePlayerDerivedStats();
    if (player) syncPlayerFromStats();
  }
  log(`🎁 获得遗物：${r.icon} ${r.name}（${r.desc}）${relics[id] > 1 ? `　已叠加 ×${relics[id]}` : ''}`);
}

/* ---- 汲取核心：每次击败敌人回血（唯一入口 killEnemy 调用，别在结算层各处抄） ---- */
function relicHealOnKill() {
  const n = relicCount('core');
  if (n <= 0 || !player || !player.alive) return;
  if (player.hp <= 0 || player.hp >= player.maxHp) return;
  const before = player.hp;
  player.hp = Math.min(player.maxHp, player.hp + n);
  const got = player.hp - before;
  if (got <= 0) return;
  if (typeof playerStats !== 'undefined' && playerStats) playerStats.currentHp = player.hp;
  floatText(player.x, player.y, '+' + got, '#8fe28a', false, 0, 'player');
  log(`🩸 汲取核心：击败敌人回复 ${got} HP（${before} → ${player.hp}）。`);
}

/* ---- 回响回路：施法时装填，下次攻击消耗 ---- */
function relicArmEcho() { if (relicCount('echo') > 0) relicEchoArmed = true; }
function relicConsumeEcho() {
  if (!relicEchoArmed) return false;
  relicEchoArmed = false;
  return true;
}

/* ---- HP 修改原语（事件专用） ----
 * 全部走 player.hp + playerStats.currentHp 双写（战斗里这两个必须同步），上限以上夹取。
 * relicHurtPlayer 保底留 1 HP：**事件不能杀死玩家** —— 掉 xx HP 却死在通关界面没有 UI 解释，
 * 历史上这类「死了但界面还在 levelclear」的状态排查成本极高。 */
function relicHealPlayer(n) {
  if (!player || !player.alive || n <= 0) return 0;
  const before = player.hp;
  player.hp = Math.min(player.maxHp, player.hp + n);
  const got = player.hp - before;
  if (got > 0) {
    if (typeof playerStats !== 'undefined' && playerStats) playerStats.currentHp = player.hp;
    floatText(player.x, player.y, '+' + got, '#8fe28a', false, 0, 'player');
  }
  return got;
}
function relicHurtPlayer(n) {
  if (!player || !player.alive || n <= 0) return 0;
  const room = player.hp - 1;                 // 永远留 1 HP
  const real = Math.min(n, Math.max(0, room));
  if (real <= 0) return 0;
  player.hp -= real;
  if (typeof playerStats !== 'undefined' && playerStats) playerStats.currentHp = player.hp;
  floatText(player.x, player.y, '-' + real, '#ff6b6b', false, 0, 'player');
  return real;
}
/* 献祭 HP 上限（血色契约）：独立记账到 relicMaxHpPenalty，不动 abilities.con */
function relicSacrificeMaxHp(n) {
  relicMaxHpPenalty += n;
  recomputePlayerDerivedStats();
  if (typeof playerStats !== 'undefined' && playerStats) {
    playerStats.currentHp = Math.min(playerStats.currentHp, playerStats.maxHp);
  }
  if (player) {
    player.maxHp = playerStats.maxHp;
    player.hp = Math.min(player.hp, player.maxHp);
  }
  if (typeof syncPlayerFromStats === 'function') syncPlayerFromStats();
  return relicMaxHpPenalty;
}

/* 统一的玩家受伤入口：优先顺序 = 调试无敌 > 硬化外壳（每关一次）> 护盾（药枚层数）。
   返回 { dmg: 实际掉血, shielded: 是否被护盾抵消, immune: 调试无敌 } */
function damagePlayer(amount, label = '') {
  if (debugMode) return { dmg: 0, shielded: false, immune: true };
  if (!player || !player.alive) return { dmg: 0, shielded: false, immune: false };
  if (amount <= 0) return { dmg: 0, shielded: false, immune: false };
  /* 硬化外壳：每关第一次受到的伤害免疫。
   * 放在**护盾之前**：先吃掉这一下，护盾层数才不会因为「先扣盾」而白损失一层。 */
  if (relicCount('shell') > 0 && !relicShieldUsedThisLevel) {
    relicShieldUsedThisLevel = true;
    floatText(player.x, player.y, '硬化外壳', '#8fe28a');
    ringFx(player.x, player.y, '#8fe28a');
    log(`🛡️ 硬化外壳：本关第一次伤害被完全免疫（${label ? `「${label}」的` : ''}${amount} 点）。`);
    updateStats();
    return { dmg: 0, shielded: false, immune: false };
  }
  if (playerShield > 0) {
    playerShield -= 1;
    floatText(player.x, player.y, '护盾抵消', '#ffffff');
    ringFx(player.x, player.y, '#ffffff');
    log(`🛡️ 护盾抵消了${label ? `「${label}」的` : ''}${amount} 点伤害（剩余 ${playerShield} 层）。`);
    updateStats();
    return { dmg: 0, shielded: true, immune: false };
  }
  player.hp = Math.max(0, player.hp - amount);
  return { dmg: amount, shielded: false, immune: false };
}
