/* P0.1-4 拆分 · 20261028b 基线 779-809 行 · 角色技力 / 冲锋补刀范围 / 攻击欲望 */
// ★ 泥岩技力系统
const FENCER_SP_MAX = 5;
let fencerSp = 0;

// ★ 风笛技力系统（重做后）：沿同方向连续 ≥2 步移动 → 该段长度即技力，
// 等待 / 转向都会断开一段。例：wdds 得 2 点（d 段 2 步），wwwd 得 3 点（w 段 3 步）。
// 上限 5，跨回合、跨关保留（全局保留）；满 5 后路径里的攻击节点变为「冲锋」。
const WHEELCHAIR_SP_MAX = 5;
/* 冲锋额度（ISSUE-20261028-01）：进入冲锋时算出的剩余移动步数 = 可冲锋格数 = 可攻击次数。
 * 被挡住停下时，剩余次数改为打「朝向前方 CHARGE_FINISH_RANGE 格」内的敌人，不浪费。 */
const CHARGE_FINISH_RANGE = 3;
let wheelchairSp = 0;

// ★ 华法琳技力系统：拾取血迹 → 技力 +1（上限 5），跨关继承。
// 满技力后「在起始点（路径第 0 步）放攻击节点」= 发动技能「不稳定血浆」：
// 消耗全部技力，本关内远程攻击必定命中 + 必定暴击 + 必定留血迹，但每次攻击后自身失去 1 HP。
// 血迹只由「远程攻击」产生（平时命中 50%、技能生效时必定）；趁乱打击不参与。
const VAMPIRE_SP_MAX = 5;
let vampireSp = 0;
let vampireSkillActive = false;

// ★ 敌人攻击欲望随回合增长：每 2 个回合 +1 感知等效（阶梯式）。
// 10 感知的敌人到第 20 回合累积 +10 → 等效 20 感知 = 欲望拉满（clamp 上限）。
const AGGRESSION_WIS_PER_TWO_ROUNDS = 1;
let battleRound = 1;

// ★ 敌人攻击欲望系数（调参用）：1.0 = 原始强度（wis/20）。
// 调低之后，敌人的预判目标点会更靠近「玩家当前位置」而不是路径末端，
// 也就是不再提前堵你最远的落点，进攻性明显变弱。
// 0.6 时：骷髅 6/20×0.6=0.18、幽灵/外星人 8/20×0.6=0.24。
const ENEMY_AGGRESSION_SCALE = 0.6;

/* src: src/rules/squad.js */
/* ISSUE-20261029-28 · 预备干员「增援召唤」规则层
 *
 * 一套最小可用的小队系统：
 *   技力（rookieSp）→ 满 5 → 技能节点发动 → 预备干员**本格**召唤 1 名成员
 *   成员每回合独立行动一次：BFS（与敌人同一套 bfsPathTo）到最近的敌人 → 途中一旦能打就停下打
 *
 * ★ ISSUE-20261030-54（人类 2026-10-30 01:01 拍板，推翻本文件原有两条口径）：
 *   ① **召唤落点 = 预备干员本格**（原「周围 8 格随机空位」作废）。同格合法、是常态，
 *      所以「看不出一格里有几个单位」由 56 号的斜向分格负责表现。
 *   ② **成员跨关保留**（原「每关重新召唤」作废）。数值按「消耗品」语义冻结：
 *      跨关带过去的是**召唤当时的数值**（含受伤后的当前 HP），新召唤的成员才取新数值。
 *      换角色 / 整局重开仍然清空 —— 那条在 src/rules/reset.js#resetSkillState，别挪到 initLevel。
 *   ③ 成员类型**全局不重复**（原「不连续重复」作废）：候选池 = 四种 − 已拥有类型，
 *      池空 = 满编 4 个 → 召唤失败。上限 4 与「四种各一」互为兜底，不要再单独硬编码 count。
 *
 * 三条硬约束（改之前先读）：
 *  1) 伤害必须走 enemyTakeDamage()，否则护盾词缀不生效；
 *  2) 击杀必须走 killEnemy()，否则精英掉落 ❤️ / 连杀记账会漏；
 *  3) 成员不是敌人、也不是玩家：不进 enemies 数组（否则被相杀结算），
 *     只放在 squadUnits 里，由 renderUnits 单独渲染一层。
 *
 * ★ ISSUE-20261029-32（人类 05:48 拍板）：上面第 3 条**放宽** ——
 *   「成员无敌」原本是我在 28 号自己拍的口径，人类现在指出「敌人似乎不会攻击召唤单位」，
 *   并要求敌人改用「距离最近的路径格」索敌。人类逐项确认：
 *     · 成员**能被敌人打死**（HP 归 0 → 消失，玩家彻底失去该成员）；
 *     · ~~敌人同时能打到玩家和成员时 → 谁近打谁，平手打玩家~~
 *       ★ ISSUE-20261030-57（人类 2026-10-30 01:01）：这句已作废，改成
 *         **敌人攻击优先打小队成员**（只要身边有存活成员就打成员，玩家兜底），详见 57 号。
 *     · 伤害来源全部打通：近战贴身 / 外星人远程 / 自爆虫自爆 / 敌人踩进成员格 / Boss 推动。
 *   所以成员从「无敌炮台」变成「有代价的召唤」：会吸引火力，也会真的死。
 *   本文件因此新增：squadTakeDamage / squadUnitAt / squadAliveUnits / squadPredictedNextCell。
 */
function rookieSpMax() { return ROOKIE_SP_MAX; }

/* 获得技力（唯一入口，香草沙士在这里生效） */
function gainRookieSp(n = 1) {
  if (selectedChar !== 'rookie') return 0;
  const before = rookieSp;
  if (before >= ROOKIE_SP_MAX) return 0;
  let gain = n;
  if (sassExtraSp()) { gain += 1; log('🥤 香草沙士：额外获得 1 点技力！'); }
  rookieSp = Math.min(ROOKIE_SP_MAX, before + gain);
  const real = rookieSp - before;
  if (real > 0) {
    if (before < ROOKIE_SP_MAX && rookieSp >= ROOKIE_SP_MAX) {
      log(`😶 预备干员技力已满（${ROOKIE_SP_MAX}/${ROOKIE_SP_MAX}）！「增援召唤」就绪：双击路径节点设置技能节点。`);
      if (player && player.alive) floatText(player.x, player.y, '召唤就绪！', '#ffd700');
    } else {
      log(`😶 预备干员技力 +${real}（${rookieSp}/${ROOKIE_SP_MAX}）`);
    }
    updateStats();
  }
  return real;
}

/* 小队成员六维 = 预备干员六维里最低的一项（人类原话：「数值六项都为预备干员属性最低的一项数值」） */
function squadAbilityScore() {
  const a = playerStats && playerStats.abilities;
  if (!a) return 8;
  return Math.min(a.str, a.dex, a.con, a.int, a.wis, a.cha);
}

/* 成员的派生数值：与玩家同一套公式（HP = con + 基础加成、AC = 5+⌊(敏+体)/4⌋、移动 = ⌊敏/2⌋），
 * 只是六维全部取同一个分数。熟练加值跟随角色等级，跟玩家同步，免得后期成员完全打不中。 */
function squadDerivedStats(score) {
  const abilities = { str: score, dex: score, con: score, int: score, wis: score, cha: score };
  return {
    abilities,
    maxHp: Math.max(1, score + BASE_HP_BONUS),
    ac: computeAC(abilities),
    move: Math.max(1, Math.floor(score / 2)),
    prof: 4 + Math.max(0, heroLevel - 1),
  };
}

/* 周围 8 格空位（不含自己脚下那一格）
 * ⚠️ ISSUE-20261030-54 之后 summonSquadMember 不再用它（落点改本格），**暂时无人调用**；
 *    issue 明确要求保留不删（将来若要做「成员散开」还要用），别当死代码清掉。 */
function squadFreeCellsAround(x, y) {
  const out = [];
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (!inBounds(nx, ny)) continue;
      if (map[ny][nx] === 1) continue;
      if (enemies.some(e => e.alive && e.x === nx && e.y === ny)) continue;
      if (squadUnits.some(s => s.alive && s.x === nx && s.y === ny)) continue;
      out.push({ x: nx, y: ny });
    }
  }
  return out;
}

/* ★ ISSUE-20261030-54：召唤（落点 = 预备干员本格；类型全局不重复）。返回 { ok, member }
 *
 *  ① 落点：原来是「周围 8 格随机空位 + 全被占就向外逐圈搜」，现在**直接取 player.x/player.y**
 *     —— 同格合法（56 号 §6-1），所以不存在「没地方站」这回事，调用方不需要再判 no-cell。
 *     squadFreeCellsAround() 仍保留（将来要做「散开」还用得上），但这里不再调用。
 *  ② 类型池：原来是 `SQUAD_TYPE_ORDER.filter(id => id !== lastSquadType)`，只挡**连续**重复，
 *     先锋→重装→先锋 照样会出现。现在改成「四种 − 已拥有类型」：
 *     owned 用**存活**成员算（死掉的类型可以让位，否则残局永远补不齐人）。
 *     池空 = 四种集齐 = 满编 4 个 → 返回 { ok:false, reason:'full' }，调用方退技力与动作。
 */
function summonSquadMember() {
  const owned = new Set();
  for (const s of squadUnits) if (s.alive) owned.add(s.type);
  const pool = SQUAD_TYPE_ORDER.filter(id => !owned.has(id));
  if (pool.length === 0) return { ok: false, reason: 'full' };
  const typeId = pool[randInt(pool.length)];
  const typeDef = SQUAD_TYPES[typeId];
  const score = squadAbilityScore();
  const d = squadDerivedStats(score);
  const member = {
    uid: ++squadSeq,
    type: typeId,
    name: typeDef.name,
    icon: typeDef.icon,
    ranged: !!typeDef.ranged,
    x: player.x, y: player.y,
    hp: d.maxHp, maxHp: d.maxHp,
    ac: d.ac, move: d.move,
    prof: d.prof,
    range: typeDef.ranged ? PLAYER_RANGE : 1,
    abilities: d.abilities,
    score,
    facing: faceToward({ x: player.x, y: player.y }, player),
    alive: true,
  };
  squadUnits.push(member);
  lastSquadType = typeId;
  ringFx(member.x, member.y, '#7dd3fc', 'squad-' + member.uid);
  floatText(member.x, member.y, `${typeDef.icon} ${typeDef.name}`, '#7dd3fc', true, 0, 'squad-' + member.uid);
  log(`😶 增援召唤！${typeDef.icon} ${typeDef.name} 出现在 (${member.x},${member.y})：六维全 ${score}、HP ${d.maxHp}、AC ${d.ac}、移动 ${d.move}。${typeDef.onKillText}`);
  return { ok: true, member };
}

/* ★ ISSUE-20261030-54：跨关重定位（initLevel 里调一次，换角色 / 重开不走这里）。
 *  ① 先滤掉阵亡成员 —— 跨关带着死人会让「已拥有类型」算错（死掉的类型占着坑，召唤池永远不满）；
 *  ② 存活成员一律回到**预备干员本格**（白板 01:0x 推定 A，与召唤落点一致）。
 *     这也天然自愈了「上一关的坐标落在新地图的墙里 / 越界」—— 本格一定是合法可站格；
 *  ③ 数值冻结（消耗品语义）：HP / maxHp / ac / move / score 全都不动，**带伤过关不回满**；
 *     唯一例外是 prof —— issue 明确「prof = 4 + max(0, heroLevel-1) 仍随 heroLevel 走」，
 *     所以这里按当前等级刷新一次，免得老成员在高关卡完全打不中人。 */
function squadRelocateToPlayer() {
  squadUnits = squadUnits.filter(u => u.alive);
  if (!player) return 0;
  for (const u of squadUnits) {
    u.x = player.x;
    u.y = player.y;
    u.prof = 4 + Math.max(0, heroLevel - 1);
  }
  return squadUnits.length;
}

/* 这一格被谁占着（小队成员自己那格除外） */
function squadCellTaken(x, y, selfUid) {
  for (const s of squadUnits) if (s.uid !== selfUid && s.alive && s.x === x && s.y === y) return true;
  if (player && player.alive && player.x === x && player.y === y) return true;
  for (const e of enemies) if (e.alive && e.x === x && e.y === y) return true;
  return false;
}

/* =========================================================
 * ★ ISSUE-20261029-32：成员进入敌人索敌候选池 + 可被敌人打死
 * ========================================================= */

/* 存活的成员（敌人索敌、伤害结算都只看这些） */
function squadAliveUnits() {
  return (typeof squadUnits !== 'undefined' ? squadUnits : []).filter(u => u.alive);
}

/* 某个格子上有没有活着的成员 */
function squadUnitAt(x, y) {
  for (const s of squadUnits) if (s.alive && s.x === x && s.y === y) return s;
  return null;
}

/* ★ 成员「下一格」的预测：成员每回合朝**离它最近的敌人**走（见 squadAct），
 *   所以敌人索敌时用「成员下一步会站的那格」来算距离，
 *   而不是用成员此刻的格子 —— 这正是人类要的「正在朝我走的那个会被优先锁定」。
 *   注意：敌人先结算、成员后结算（endRound 顺序：玩家 → 敌人 → 小队），
 *   所以这里预测的是「本回合稍后成员真的会走到的位置」，不是空想。 */
function squadPredictedNextCell(u) {
  if (!u || !u.alive) return null;
  const target = squadNearestEnemy(u);
  if (!target) return { x: u.x, y: u.y };
  const path = bfsPathTo(u.x, u.y, target.x, target.y, 1, null, false, 0);
  /* bfsPathTo 在「目标不可达」时返回的是未截断的完整路径，但第 2 格仍然是它打算走的方向 */
  if (path && path.length > 1) return { x: path[1].x, y: path[1].y };
  return { x: u.x, y: u.y };
}

/* ★ 成员的统一受伤入口（与玩家侧的 damagePlayer 对等，但成员没有护盾 / 免疫 / 反击那套）。
 *   HP 归 0 → alive=false（渲染层与 resolveSquadTurn 都会跳过它）→ 玩家彻底失去该成员。 */
function squadTakeDamage(u, amount, source) {
  if (!u || !u.alive || !(amount > 0)) return { dealt: 0, dead: false };
  const uKey = 'squad-' + u.uid;   // ISSUE-20261030-56：浮字落进自己那条斜带，别和玩家的叠在一起
  const before = u.hp;
  u.hp = Math.max(0, u.hp - amount);
  const dealt = before - u.hp;
  floatText(u.x, u.y, '-' + dealt, '#ff6b6b', false, 0, uKey);
  if (u.hp <= 0) {
    u.alive = false;
    log(`💀 ${u.icon} ${u.name}被${source}击杀了（${u.maxHp} HP 归零）。`);
    ringFx(u.x, u.y, '#ff6b6b', uKey);
    return { dealt, dead: true };
  }
  log(`🩸 ${u.icon} ${u.name}被${source}命中，造成 ${dealt} 伤害（${u.hp}/${u.maxHp}）。`);
  return { dealt, dead: false };
}

function squadNearestEnemy(u) {
  let best = null, bestD = Infinity;
  for (const e of enemies) {
    if (!e.alive || e.hp <= 0) continue;
    const d = Math.abs(e.x - u.x) + Math.abs(e.y - u.y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

/* 「能打的节点」：近战 = 相邻；远程 = 射程内且有视线（与玩家同一套 canRangedAttack） */
function squadCanAttack(u, e) {
  if (!e || !e.alive || e.hp <= 0) return false;
  if (u.ranged) return canRangedAttack({ x: u.x, y: u.y }, e, u.range);
  return cheb(u, e) === 1;
}

function squadFindAttackable(u) {
  let best = null;
  for (const e of enemies) {
    if (!e.alive || e.hp <= 0) continue;
    if (!squadCanAttack(u, e)) continue;
    if (!best || cheb(u, e) < cheb(u, best)) best = e;
  }
  return best;
}

/* 小队成员击杀 → 给预备干员回报（人类指定的四种） */
function squadOnKill(u) {
  const def = SQUAD_TYPES[u.type];
  if (!def || !player || !player.alive) return;
  switch (def.onKill) {
    case 'sp':
      gainRookieSp(SQUAD_KILL_SP);
      break;
    case 'shield':
      playerShield += 1;
      floatText(player.x, player.y, '护盾 +1', '#ffffff', false, 0, 'player');
      log(`😑 ${def.name}击杀敌人：预备干员获得 1 层护盾（当前 ${playerShield} 层）。`);
      break;
    case 'heal': {
      const before = player.hp;
      player.hp = Math.min(player.maxHp, player.hp + SQUAD_KILL_HEAL);
      const real = player.hp - before;
      floatText(player.x, player.y, `+${real} HP`, '#2ecc71', false, 0, 'player');
      log(`😇 ${def.name}击杀敌人：预备干员恢复 ${real} HP（${player.hp}/${player.maxHp}）。`);
      break;
    }
    case 'extraNode':
      player.extraAttacks += 1;
      playerStats.extraAttacks = player.extraAttacks;
      floatText(player.x, player.y, '攻击节点 +1', '#ffd700', false, 0, 'player');
      log(`🤠 ${def.name}击杀敌人：预备干员获得 1 个额外攻击节点（本回合可出手 ${maxAttacksThisTurn()} 次）。`);
      break;
  }
  updateStats();
}

/* 一次成员攻击（每回合每成员最多 1 次） */
async function squadAttack(u, e) {
  const modKey = u.ranged ? 'int' : 'str';
  const mod = abilityMod(u.abilities[modKey]);
  const atk = attackRoll(mod, u.prof, e.ac);
  u.facing = faceToward(u, e);
  if (!atk.hit) {
    missFx(e.x, e.y);
    log(`${u.icon} ${u.name}攻击敌人${e.id + 1}未命中 (${fmtRoll(atk, e.ac)})`);
    refreshUnits();
    await sleep(140);
    return;
  }
  const dice = u.ranged ? PLAYER_RANGED_DICE : PLAYER_MELEE_DICE;
  let dmg = Math.max(1, rollDamageDice(dice) + mod);
  const isCrit = atk.nat20;
  if (isCrit) dmg *= 2;
  const dealt = enemyTakeDamage(e, dmg);
  if (dealt > 0) {
    const eKey = 'enemy-' + e.id;
    slashFx(e.x, e.y, isCrit ? '#ffd700' : '#7dd3fc', eKey);
    hitFlashCell(e.x, e.y);
    floatText(e.x, e.y, `${u.icon}-${dealt}`, isCrit ? '#ffd700' : '#7dd3fc', isCrit, 0, eKey);
    log(`${u.icon} ${u.name}${isCrit ? '暴击' : '命中'}敌人${e.id + 1}，造成 ${dealt} 伤害 (${fmtRoll(atk, e.ac)})`);
  }
  if (e.hp <= 0 && e.alive) {
    killEnemy(e, { logText: `敌人${e.id + 1}被${u.name}击败` });
    squadOnKill(u);
  }
  refreshUnits();
  await sleep(180);
}

/* 一名成员的一回合：找目标 → 能打就打 → 否则按 BFS 走向目标，途中一旦进入「能打的节点」就停下开火。
 * 寻路刻意复用敌人那套 bfsPathTo（人类要求「与敌人一致」），占位把玩家 / 敌人 / 其他成员都算进去。 */
async function squadAct(u) {
  if (!u.alive) return;
  const target = squadNearestEnemy(u);
  if (!target) return;
  /* 原地就能打（远程常见）→ 直接开火，不移动 */
  const first = squadFindAttackable(u);
  if (first) { await squadAttack(u, first); return; }

  const isOccupied = (t, x, y) => squadCellTaken(x, y, u.uid);
  let path = bfsPathTo(u.x, u.y, target.x, target.y, u.move, isOccupied, false, 0);
  if (path.length <= 1) {
    /* 被同伴挤住时忽略占位重算一次（与敌人侧反罚站补丁同思路） */
    path = bfsPathTo(u.x, u.y, target.x, target.y, u.move, null, false, 0);
  }
  /* ★ 必须自己截断：bfsPathTo 在「目标不可达」分支返回的是「最近可达点」的完整路径，
   * 那一步**没有**按 maxSteps 截断（敌人侧同样如此，它靠 tick 结算兜住）。
   * 不截断的话成员一回合能瞬移半张地图 —— 实测从 (9,9) 走到 (3,8)，移动力只有 4。 */
  if (path.length > u.move + 1) path = path.slice(0, u.move + 1);
  for (let i = 1; i < path.length; i++) {
    const from = { x: u.x, y: u.y };
    u.x = path[i].x; u.y = path[i].y;
    u.facing = faceToward(from, path[i]);
    refreshBoardOnly();
    await sleep(130);
    /* 走到这一格就能打了 → 停下开火（这就是「在能够进行攻击的节点自动攻击」） */
    const canHit = squadFindAttackable(u);
    if (canHit) { await squadAttack(u, canHit); return; }
  }
}

/* 回合末统一行动：每个成员各走一次。放在 endRound 里（玩家 → 敌人 → 小队），
 * 这样成员不会和玩家的移动抢格子，也不会被相杀结算误伤。 */
async function resolveSquadTurn() {
  if (!squadUnits.length || !player || !player.alive) return;
  if (phase !== PHASE.RESOLVING) return;
  /* 已被打死的敌人清掉引用（成员不会死，但保留兜底） */
  squadUnits = squadUnits.filter(u => u.alive);
  for (const u of squadUnits) {
    if (!player.alive) return;
    if (enemies.filter(e => e.alive).length === 0) return;
    await squadAct(u);
  }
  refreshBoardOnly();
}

/* ★ ISSUE-20261029-37：属性抽屉已移除，六维图加点入口改为「角色面板（♟️）里的六维图」。

if (charRadarCanvas) {

    if (phase === PHASE.GAMEOVER || phase === PHASE.RESOLVING) return;
    const rect = charRadarCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const hit = charRadarLabelHits.find(h => Math.hypot(h.x - x, h.y - y) <= h.r + 10);
    if (!hit) return;

/* src: src/ui/drawer.js */
/* =========================================================================
 * ISSUE-20261028-09 G · 抽屉组件（一套组件，四处复用）
 *
 * 设计约束（都是踩过或算过的坑，改之前先读）：
 *  1. 抽屉节点挂在 <body> 直属，不能挂进 #sidebar —— render() 每次都会重刷侧栏，
 *     挂里面的话玩家点一次「+1」，说明卡就被冲掉了。
 *  2. 只用 transform 过渡，不用 display:none —— 雷达画布在 display:none 的容器里
 *     clientWidth === 0，会画成 0×0 且不留痕。
 *  3. 同一时刻只允许一个抽屉：打开新的自动收起旧的（含二层）。
 *  4. Esc 用捕获阶段拦截并 stopPropagation，避免顺带触发 X（重置路径）等快捷键。
 *  5. 遮罩只挡游戏区：视觉上全屏，但抽屉 z-index 更高，露在遮罩之上。
 * ========================================================================= */
/* ★ ISSUE-20261028-06：`relic`（遗物 3 选 1）与 `event`（关卡事件）两块面板
 * 必须在这里登记。漏登记的表现极隐蔽：drawerOpen('relic') 会在 `if (!el) return`
 * 处**静默返回**，面板内容其实已经填进 DOM，但永远不显示 → 通关流程停在 LEVELCLEAR
 * 出不去（实测：AI 连点 3 次「下一关」关数不动，卡在第 3 关）。
 * 三块 .drawer 都带 data-drawer，下面按属性查，加进来就自动命中。 */
const DRAWER_IDS = ['settings', 'levelup', 'char', 'relic', 'event'];
const drawerEls = {};
/* ★ ISSUE-20261030-47：按 [data-drawer] 取，**不要再拿 id 猜名字**。
 * 原来是 document.getElementById('drawer' + id[0].toUpperCase() + id.slice(1))，
 * 'settings' → drawerSettings ✅、'char' → drawerChar ✅，但
 * 'levelup' → drawerLevelup ✗ —— 真实 id 是 drawerLevel**U**p（大写 U）。
 * 后果：drawerEls.levelup 恒为 undefined → drawerOpen('levelup') 在 if (!el) return 处
 * 静默返回 → 升级奖励抽屉永远弹不出来，而 showLevelUpOverlay 已经把 levelUpOpen 置了 true，
 * 于是第二次升级 openLevelUp() 直接早退 → pendingLevelUps 卡住 → 「下一关」按钮不渲染 → 永久卡关。
 * 三块 .drawer 本来就都带 data-drawer，用它查既对得上又不会被驼峰命名再坑一次。 */
DRAWER_IDS.forEach(function (id) {
  const el = document.querySelector('[data-drawer="' + id + '"]');
  if (el) drawerEls[id] = el;
});
const drawerMaskEl = document.getElementById('drawerMask');
let drawerCurrent = null;

function drawerIsOpen(id) { return drawerCurrent === id; }

/* ⚙ 按钮与遮罩跟随状态：入口按钮保持可见并进入高亮态（aria-expanded） */
function drawerSyncChrome() {
  const btn = document.getElementById('setOpenBtn');
  if (btn) {
    const on = drawerCurrent === 'settings';
    btn.classList.toggle('on', on);
    /* ★ ISSUE-20261030-64：齿轮原是 emoji，本机被降级成黑白，深色棋盘上看不见 → 换矢量。
     * ✕ 是普通文本符号（人 03:3x 拍板不换），保持原样。 */
    btn.innerHTML = on ? '✕' : iconTag('gear', 'vico');
    btn.title = on ? '收起设置' : '设置';
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  const cbtn = document.getElementById('charOpenBtn');
  if (cbtn) {
    const on = drawerCurrent === 'char';
    cbtn.classList.toggle('on', on);
    cbtn.innerHTML = on ? '✕' : iconTag('chess_pawn', 'vico');
    cbtn.title = on ? '收起角色面板' : '角色面板';
    cbtn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  if (drawerMaskEl) drawerMaskEl.classList.toggle('on', !!drawerCurrent);
}

/* 关闭二层（属性说明卡）而不关抽屉本身；返回是否真的关掉了一层 */
function drawerCloseLayer() {
  const layer = document.getElementById('abilityInfoLayer');
  if (layer && layer.classList.contains('on')) {
    layer.classList.remove('on');
    layer.setAttribute('aria-hidden', 'true');
    return true;
  }
  return false;
}

function drawerClose() {
  /* ★ ISSUE-20261030-47：升级奖励没选完，**不许关**（✕ / 遮罩 / Esc 一律拦在这里）。
   * 理由不是洁癖：关掉之后 pendingLevelUps 还挂着，renderControls 就不渲染「下一关」按钮，
   * 玩家唯一能做的只有刷新页面（进度全丢）。所以奖励抽屉只有一个出口 —— 选一个 buff。
   * 判断逻辑放在 game 侧（levelUpRewardPending），drawer.js 只问、不管规则。 */
  if (drawerCurrent === 'levelup'
      && typeof levelUpRewardPending === 'function'
      && levelUpRewardPending()) {
    return false;
  }
  if (!drawerCurrent) { drawerCloseLayer(); return false; }
  const el = drawerEls[drawerCurrent];
  if (el) { el.classList.remove('on'); el.setAttribute('aria-hidden', 'true'); }
  drawerCurrent = null;
  drawerCloseLayer();
  drawerSyncChrome();
  return true;
}

/* =========================================================================
 * ★ 设置面板贴棋盘（ISSUE-20261029-29）
 * #drawerSettings 的 CSS 用 --board-top / --board-left / --board-w / --board-h 定位，
 * 这四个变量在这里按 #board 的实时矩形写入 —— 不能只在打开时写一次：
 * 转屏 / 换布局 / 窗口缩放 / 抽屉开着时棋盘尺寸变了，面板必须跟着走，
 * 否则就会出现「面板比地图小一圈、边缘露出半格棋盘」这种错位。
 * ========================================================================= */
function syncBoardOverlayRect() {
  try {
    if (typeof boardEl === 'undefined' || !boardEl) return;
    const r = boardEl.getBoundingClientRect();
    if (!(r.width > 0) || !(r.height > 0)) return;
    const s = document.documentElement.style;
    s.setProperty('--board-top', Math.round(r.top) + 'px');
    s.setProperty('--board-left', Math.round(r.left) + 'px');
    s.setProperty('--board-w', Math.round(r.width) + 'px');
    s.setProperty('--board-h', Math.round(r.height) + 'px');
  } catch (_) {}
}
/* 棋盘矩形变化的所有时机都补一次（抽屉没开时写变量是白写，但代价只是一次 getBoundingClientRect） */
window.addEventListener('resize', function () { setTimeout(syncBoardOverlayRect, 150); });
window.addEventListener('scroll', function () { syncBoardOverlayRect(); }, { passive: true });

function drawerOpen(id) {
  const el = drawerEls[id];
  if (!el) return;
  if (id === 'settings') syncBoardOverlayRect();
  if (id === 'char') syncBoardOverlayRect();
  // 互斥：先收起别的抽屉与所有二层
  if (id === 'stats') return;   // 属性抽屉已移除（ISSUE-20261029-37），不再受理
  if (drawerCurrent && drawerCurrent !== id) {
    const prev = drawerEls[drawerCurrent];
    if (prev) { prev.classList.remove('on'); prev.setAttribute('aria-hidden', 'true'); }
  }
  drawerCloseLayer();
  drawerCurrent = id;
  el.classList.add('on');
  el.setAttribute('aria-hidden', 'false');
  drawerSyncChrome();
  if (id === 'stats') {
    // 抽屉必须在「已经滑入」之后画：下一帧 clientWidth 才是真实值
    requestAnimationFrame(function () {
      try { if (typeof renderAbilityDrawer === 'function') renderAbilityDrawer(); } catch (_) {}
      try { drawRadar(); } catch (_) {}
      try { if (typeof syncAbilityInfoIfOpen === 'function') syncAbilityInfoIfOpen(); } catch (_) {}
    });
  }
  if (id === 'char') {
    /* ★ ISSUE-20261030-59：每次打开都把右下格复位成遗物列表 ——
     * 上次停在属性说明卡的话再打开会直接挡住遗物，等于「不知道还有个池子在那」。
     * 是**打开时**复位不是关闭时：关闭后 drawRadar / render 还会重刷一次，写早了会被冲掉。 */
    try { if (typeof setCharAbilityInfo === 'function') setCharAbilityInfo(null); } catch (_) {}
    // 面板贴棋盘，下一帧 clientWidth 才是真实值；renderCharPanel 会绘制六维图到 #charRadarCanvas
    requestAnimationFrame(function () {
      try { if (typeof renderCharPanel === 'function') renderCharPanel(); } catch (_) {}
    });
  }
}

function drawerToggle(id) {
  if (drawerCurrent === id) drawerClose();
  else drawerOpen(id);
}

if (drawerMaskEl) drawerMaskEl.addEventListener('click', function () { drawerClose(); });
document.querySelectorAll('[data-drawer-close]').forEach(function (b) {
  b.addEventListener('click', function (e) { e.stopPropagation(); drawerClose(); });
});
// 角色面板入口（ISSUE-20261029-36）：右下角 ♟️ 按钮（六维图 / 加点入口并入面板与升级抽屉，不再单独留属性按钮）
const charOpenBtnEl = document.getElementById('charOpenBtn');
if (charOpenBtnEl) charOpenBtnEl.addEventListener('click', function (e) {
  e.stopPropagation();
  drawerToggle('char');
});
/* Esc：先关二层，再关抽屉。捕获阶段 + stopPropagation，避免落到 handleKeyDown 的其它键位 */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (drawerCloseLayer()) { e.stopPropagation(); e.preventDefault(); return; }
  if (drawerCurrent) { drawerClose(); e.stopPropagation(); e.preventDefault(); }
}, true);
/* ★ ISSUE-20261030-64 补齐：开局把 ⚙ / ♟ 角标的初始态收敛一次。
 * icons.js 的 iconifyDom() 已经扫过 body 的静态文本节点（首帧字形不会残留 emoji），
 * 但这两个按钮的内容/ title / aria-expanded 是「统一由 drawerSyncChrome() 写」的状态出口，
 * 开局不跑一次就会出现「字形对了、aria 与抽屉实际状态不同步」的漂移。
 * 此处 DOM 已解析完、icons.js 按 manifest 顺序先加载，调用安全。 */
drawerSyncChrome();

/* =========================================================================
 * ISSUE-20261028-09 G2 · 属性数据（属性抽屉与说明卡已随 ISSUE-20261029-37 移除）
 *
 * 六维数值公式仅保留给雷达图（canAlloc / 顶点提示）与角色面板（♟️）六维图加点使用。
 * 加点入口：角色面板里的六维图 —— 点属性名直接 +1（见 dom-refs.js 的 #charRadarCanvas 点击）。
 * ========================================================================= */
const ABILITY_INFO = {
  str: { name: '力量', desc: '近战伤害与近战命中。近战伤害 = <code>1 + 力量修正</code>；风笛 / 泥岩 用这一条。' },
  dex: { name: '敏捷', desc: '移动力与防御等级。移动力 = <code>⌊敏捷 / 2⌋</code>；AC = <code>5 + ⌊(敏捷 + 体质) / 4⌋</code>。' },
  con: { name: '体质', desc: '生命上限。maxHp = <code>体质 + 4 + 等级加成</code>；同时参与 AC 公式。' },
  int: { name: '智力', desc: '远程伤害与远程命中。远程伤害 = <code>1 + 智力修正</code>；阿米娅 / 华法琳 用这一条。' },
  wis: { name: '感知', desc: '战场预判与技力上限。敌人意图可见步数 = <code>1 + max(0, 感知修正)</code>；部分角色的技力上限 = 感知值。' },
  cha: { name: '魅力', desc: '当前版本无任何数值作用（只显示、只参与面板展示）。' }
};

/* 当前该属性的数值：选角时看候选人，局内看 playerStats
 * ★ ISSUE-20261028-19：动态角色（预备干员）在选角阶段读的是**副本**，不是 CHARACTERS 静态值。 */
function currentAbilityValue(k) {
  if (phase === PHASE.CHAR_SELECT && selectedCandidate && CHARACTERS[selectedCandidate.id]) {
    const a = candidateAbilitiesOf(selectedCandidate.id);
    return (a && a[k]) || 0;
  }
  if (playerStats && playerStats.abilities) return playerStats.abilities[k] || 0;
  if (player && player.abilities) return player.abilities[k] || 0;
  return 0;
}

/* 当前还能加几点：选角阶段看候选副本，局内看 playerStats */
function pointsLeftNow() {
  if (phase === PHASE.CHAR_SELECT) return candidatePointsLeft();
  return playerStats ? (playerStats.abilityPoints || 0) : 0;
}

function canAllocateNow() {
  if (phase === PHASE.CHAR_SELECT) {
    /* ISSUE-20261028-19 B1：选角阶段只有动态角色（预备干员）能加点，且必须有剩余点数。
     * 前四个角色在这一相位仍然不可加点 —— 行为与之前完全一致。 */
    return candidatePointsLeft() > 0;
  }
  return !!(playerStats && playerStats.abilityPoints > 0
    && (phase === PHASE.PLANNING || phase === PHASE.LEVELCLEAR));
}

/* src: src/rules/rng.js */
/* P0.1-4 拆分 · 20261028b 基线 847-873 行 · mulberry32 可播种随机（RNG_SEED / RUN_SEED） */
/* =========================================================
 * ★ 可播种伪随机（mulberry32）
 * 原来直接用 Math.random，导致同一份输入无法复现同一局：
 * 联机时两端各掷各的骰子，结果必然对不上。
 * 现在所有随机都走 rng()，单人用时间播种（行为与旧版一致），
 * 联机时由服务器下发种子，两端 seedRng(同一颗) 即可完全一致。
 * ========================================================= */
let RNG_SEED = 1;
/* ★ 本局初始种子（ISSUE-20261028-03 新增）。
 * 敌人成长要「同一局同一关永远算出同一套面板」，所以需要一颗**不滚动**的种子；
 * RNG_SEED 每一次 rng() 都在变，不能当种子用，必须在 seedRng() 里单独记一份。 */
let RUN_SEED = 1;
function seedRng(s) {
  RNG_SEED = (s >>> 0) || 0x9E3779B9;
  if (RNG_SEED === 0) RNG_SEED = 0x9E3779B9;
  RUN_SEED = RNG_SEED;                       // ← 锁定本局种子（关卡内不会重掷）
}
function rng() {
  RNG_SEED = (RNG_SEED + 0x6D2B79F5) | 0;
  let t = RNG_SEED;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* src: src/net/pvp-core.js */
/* P0.1-4 拆分 · 20261028b 基线 875-1062 行 · PVP-CORE 联机结算核心（勿在注释中复写区块起止标记） */
/* ==== PVP-CORE BEGIN ====
 * 联机对战的结算核心：纯函数，不碰 DOM、不读全局变量、不用全局 rng()。
 *
 * 为什么必须是纯函数：两个客户端要用「同一份代码 + 同一颗种子 + 同一份计划」
 * 算出「同一串事件」，否则画面会各说各话。任何对全局状态的依赖都会破坏这个等式。
 *
 * 约定：
 *   - slot 0 = 房主，slot 1 = 挑战者，与「谁是本机」无关（对称，不按自己优先排序）。
 *   - 计划格式 { path: [[x,y],...], attackIndices: [k,...] }，path[0] 是起点格。
 *   - 返回 { units, events, winner }，winner 为 -1 / 0 / 1。
 *   - 单测脚本按 PVP-CORE 标记切片 eval，勿在此区间引用外部标识符。
 * ==== PVP-CORE BEGIN ==== */
//#PVP_CORE_START
function pvpRng(seed) {
  let a = (seed >>> 0) || 0x9E3779B9;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pvpMod(score) { return Math.floor((score - 10) / 2); }

function pvpMakeUnit(chars, charId, slot, x, y, abilities) {
  // abilities 可选：联机里房主/挑战者各自带来的加点（ISSUE-20261029-26 预备干员加点）。
  // 传输格式为 6 维数组 [str, dex, con, int, wis, cha]，此处转为内部对象 {str,dex,con,int,wis,cha}；
  // 未提供（单人局 / 老客户端）时回退静态角色定义，向后兼容。
  let a;
  if (Array.isArray(abilities)) {
    a = { str: abilities[0], dex: abilities[1], con: abilities[2], int: abilities[3], wis: abilities[4], cha: abilities[5] };
  } else {
    a = { ...(abilities || chars[charId].abilities) };
  }
  return {
    slot: slot, charId: charId, x: x, y: y,
    abilities: a,
    maxHp: a.con, hp: a.con,
    ac: 5 + Math.floor((a.dex + a.con) / 4),
    meleeDmg: Math.max(1, 1 + pvpMod(a.str)),
    rangedDmg: Math.max(1, 1 + pvpMod(a.int)),
    ranged: chars[charId].attackType === 'ranged',
    prof: 2,
    alive: true,
    dodging: false,
    facing: { dx: slot === 0 ? 1 : -1, dy: 0 },
  };
}

function pvpCheb(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }
function pvpSame(a, b) { return !!a && !!b && a.x === b.x && a.y === b.y; }
function pvpRangeOf(u) { return u.ranged ? 3 : 1; }
function pvpDmgOf(u) { return u.ranged ? u.rangedDmg : u.meleeDmg; }
/* 相杀按「趁乱打击」算：远程角色贴身只有 1 点保底，近战用近战伤害 —— 与单人规则一致 */
function pvpClashDmgOf(u) { return u.ranged ? 1 : u.meleeDmg; }

function pvpRoll(r, mod, prof, ac) {
  const d20 = 1 + Math.floor(r() * 20);
  const total = d20 + mod + prof;
  if (d20 === 20) return { d20: d20, total: total, hit: true, crit: true };
  if (d20 === 1) return { d20: d20, total: total, hit: false, crit: false };
  return { d20: d20, total: total, hit: total >= ac, crit: false };
}

function pvpResolveTurn(chars, unitsIn, plans, seed) {
  const r = pvpRng(seed);
  const u = [JSON.parse(JSON.stringify(unitsIn[0])), JSON.parse(JSON.stringify(unitsIn[1]))];
  const plansSafe = [plans[0] || {}, plans[1] || {}];
  const path = [plansSafe[0].path || [], plansSafe[1].path || []];
  const nodes = [plansSafe[0].attackIndices || [], plansSafe[1].attackIndices || []];
  const idx = [1, 1];
  const stopped = [false, false];
  const events = [];
  let winner = -1;

  function hurt(s, dmg) {
    const t = u[s];
    t.hp -= dmg;
    if (t.hp <= 0) { t.hp = 0; t.alive = false; if (winner < 0) winner = 1 - s; }
  }

  function tryAttack(s) {
    const me = u[s], foe = u[1 - s];
    if (!me.alive || !foe.alive) return;
    const ac = foe.ac + (foe.dodging ? 3 : 0);
    if (pvpCheb(me, foe) > pvpRangeOf(me)) {
      events.push({ t: 'whiff', slot: s, ac: ac });
      return;
    }
    const mod = pvpMod(me.abilities[me.ranged ? 'int' : 'str']);
    const res = pvpRoll(r, mod, me.prof, ac);
    if (!res.hit) {
      events.push({ t: 'miss', slot: s, d20: res.d20, total: res.total, ac: ac });
      return;
    }
    let dmg = pvpDmgOf(me);
    if (res.crit) dmg *= 2;
    hurt(1 - s, dmg);
    events.push({ t: 'hit', slot: s, d20: res.d20, total: res.total, ac: ac,
                  crit: res.crit, dmg: dmg, hp: u[1 - s].hp });
    if (!u[1 - s].alive) events.push({ t: 'death', slot: 1 - s });
  }

  function clash(cell) {
    const d0 = u[1].alive ? pvpClashDmgOf(u[1]) * 2 : 0;
    const d1 = u[0].alive ? pvpClashDmgOf(u[0]) * 2 : 0;
    if (u[0].alive) hurt(0, d0);
    if (u[1].alive) hurt(1, d1);
    events.push({ t: 'clash', cell: { x: cell.x, y: cell.y },
                  dmg: [d0, d1], hp: [u[0].hp, u[1].hp] });
    if (!u[0].alive) events.push({ t: 'death', slot: 0 });
    if (!u[1].alive) events.push({ t: 'death', slot: 1 });
    /* 相杀是同归于尽：两人都倒 = 平局，不能因为「谁先被扣血」就判另一方赢 */
    if (!u[0].alive && !u[1].alive) winner = -2;
    stopped[0] = true; stopped[1] = true;
  }

  // 行动节点 0：原地攻击（对应单人的 pendingAttack）
  for (let s = 0; s < 2; s++) {
    if (nodes[s].indexOf(0) >= 0) tryAttack(s);
  }

  let guard = 0;
  while (!(stopped[0] && stopped[1]) && guard++ < 80) {
    const dest = [null, null], wait = [false, false], want = [false, false];

    for (let s = 0; s < 2; s++) {
      if (stopped[s] || !u[s].alive || idx[s] >= path[s].length) { stopped[s] = true; continue; }
      const p = path[s][idx[s]];
      // 非法步（越格传送 / 缺字段）直接终止该方移动，避免两端因坏计划分叉
      if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' || pvpCheb(u[s], p) > 1) {
        stopped[s] = true;
        events.push({ t: 'invalid', slot: s });
        continue;
      }
      dest[s] = p;
      if (pvpSame(p, u[s])) { wait[s] = true; }
      else { want[s] = true; }
    }

    if (stopped[0] && stopped[1]) break;

    // 等待步 = 闪避（每回合一次，AC +⌊敏捷 / 2⌋）
    // ★ ISSUE-20261030-60：与单人侧 actions.js#dodgeAcBonusBase() 同一套口径。
    //   PVP_CORE 是纯区不能引外部函数，所以用 unit 自带的 abilities 现算。
    for (let s = 0; s < 2; s++) {
      if (wait[s]) {
        idx[s]++;
        if (u[s].alive && !u[s].dodging) {
          u[s].dodging = true;
          const dodgeBonus = Math.floor((u[s].abilities.dex || 0) / 2);
          events.push({ t: 'dodge', slot: s, ac: u[s].ac + dodgeBonus });
        }
      }
    }

    const m0 = want[0] && !stopped[0];
    const m1 = want[1] && !stopped[1];

    if (m0 && m1 && pvpSame(dest[0], dest[1])) {
      clash(dest[0]);
      break;
    }
    if (m0 && m1 && pvpSame(dest[0], u[1]) && pvpSame(dest[1], u[0])) {
      clash(dest[0]);
      break;
    }

    // 同时推进：目的地被「本 tick 结束后仍占着的人」挡住则停下
    const otherEnd = [m0 ? dest[0] : u[0], m1 ? dest[1] : u[1]];
    const arrivals = [];
    for (let s = 0; s < 2; s++) {
      if (!(s === 0 ? m0 : m1)) { continue; }
      if (pvpSame(dest[s], otherEnd[1 - s])) {
        stopped[s] = true;
        events.push({ t: 'blocked', slot: s, at: { x: u[s].x, y: u[s].y } });
        continue;
      }
      const from = { x: u[s].x, y: u[s].y };
      u[s].x = dest[s].x; u[s].y = dest[s].y;
      const dx = Math.sign(u[s].x - from.x), dy = Math.sign(u[s].y - from.y);
      if (dx || dy) u[s].facing = { dx: dx, dy: dy };
      const arrival = idx[s];
      idx[s]++;
      events.push({ t: 'move', slot: s, from: from, to: { x: u[s].x, y: u[s].y } });
      arrivals.push({ slot: s, arrival: arrival });
    }

    for (const a of arrivals) {
      if (nodes[a.slot].indexOf(a.arrival) >= 0) tryAttack(a.slot);
    }

    if (!u[0].alive || !u[1].alive) { stopped[0] = true; stopped[1] = true; }
  }

  return { units: u, events: events, winner: winner };
}
//#PVP_CORE_END

/* P0.1-4 拆分 · 20261028b 基线 1063-1108 行 · 距离工具与战斗日志系统 */
function dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
function cheb(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }
function key(x, y) { return x + ',' + y; }
/* 战斗日志：按类型着色，提升可读性。logLines 仍按行存字符串（兼容关卡切换时的切片逻辑）。 */
const LOG_MAX = 600;          // 日志缓冲上限（防止长局内存无限增长）
const LOG_VIEW_MAX = 160;     // 日志可视区 DOM 行数上限
function autoLogType(msg) {
  if (msg == null || msg === '') return 'sep';
  if (/[=＝]{3,}|第\s*\d+\s*关/.test(msg)) return 'sys';
  if (/🥤|香草沙士|奖励|升级|热水壶|护盾|💊/.test(msg)) return 'buff';
  if (/闪避|躲避/.test(msg)) return 'dodge';
  if (/击杀|被击败|击败|倒下|阵亡|💀|死亡/.test(msg)) return 'kill';
  if (/⚡|✦|技力|技能|发动|就绪|高效冲击|岩崩|精神爆发|不稳定血浆|蓄力/.test(msg)) return 'skill';
  if (/回复|恢复|治疗|❤|回血|回复HP/.test(msg)) return 'heal';
  if (/⚠|警告|错误|失败|未命中|挥空|免疫|禁止|取消|无法|不能/.test(msg)) return 'warn';
  if (/命中|造成|伤害|暴击/.test(msg)) return 'damage';
  return 'info';
}
function makeLogLine(msg) {
  const div = document.createElement('div');
  div.className = 'logline log-' + autoLogType(msg);
  /* ★ ISSUE-20261030-64：日志里的 emoji 全部换矢量图。
   * 必须走 iconifyText（先转义再替换）—— 直接塞 innerHTML 会被日志里的 < > 注入。 */
  div.innerHTML = iconifyText(msg);
  return div;
}
function renderLogAll() {
  logEl.innerHTML = '';
  for (const m of logLines) logEl.appendChild(makeLogLine(m));
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(keepN) {
  logLines = keepN && keepN > 0 ? logLines.slice(-keepN) : [];
  renderLogAll();
}
function log(msg) {
  logLines.push(msg);
  if (logLines.length > LOG_MAX) logLines = logLines.slice(-LOG_MAX);
  logEl.appendChild(makeLogLine(msg));
  while (logEl.childNodes.length > LOG_VIEW_MAX) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function inBounds(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }
function findLastIndex(arr, predicate) {
  for (let i = arr.length - 1; i >= 0; i--) if (predicate(arr[i], i)) return i;
  return -1;
}

/* P0.1-4 机械拆分：从 game.html（20261028b 基线）第 536-609 行原样搬移
 * （泥岩技力获取 + DnD 六属性系统：abilityMod / computeAC / attackRoll / 掷骰检定 / recomputePlayerDerivedStats / 敌人 L1 基础面板只读查询）。
 * 纯移动未改逻辑；顺序由 build/manifest.json 保证与拆分前一致。 */
/* =========================================================
 * 泥岩技力
 * ========================================================= */
function gainFencerSp(n = 1) {
  if (selectedChar !== 'fencer') return;
  if (fencerSp >= FENCER_SP_MAX) return;
  const sass = sassExtraSp();
  if (sass) log('🥤 香草沙士：额外获得 1 点技力！');
  const oldSp = fencerSp;
  fencerSp = Math.min(FENCER_SP_MAX, fencerSp + n + sass);
  if (oldSp < FENCER_SP_MAX && fencerSp >= FENCER_SP_MAX) {
    log(`⚡ 泥岩技力已满（${FENCER_SP_MAX}/${FENCER_SP_MAX}）！「岩崩锤」就绪：反击状态下免疫所有攻击；下次反击触发眩晕+回复1/2HP。`);
    if (player && player.alive) floatText(player.x, player.y, '岩崩锤就绪！', '#ffd700');
  }
}

/* =========================================================
 * DnD 六属性系统
 * ========================================================= */
function abilityMod(score) { return Math.floor((score - 10) / 2); }
function abilityLabel(score) {
  const m = abilityMod(score);
  return score + (m >= 0 ? '(+' + m + ')' : '(' + m + ')');
}
function computeAC(abilities) {
  return 5 + Math.floor((abilities.dex + abilities.con) / 4);
}
function attackRoll(attackerMod, prof, targetAC) {
  const d20 = 1 + randInt(20);
  const total = d20 + attackerMod + prof;
  if (d20 === 20) return { roll: d20, total, hit: true, nat20: true, nat1: false, mod: attackerMod, prof };
  if (d20 === 1) return { roll: d20, total, hit: false, nat20: false, nat1: true, mod: attackerMod, prof };
  return { roll: d20, total, hit: total >= targetAC, nat20: false, nat1: false, mod: attackerMod, prof };
}
function attackRollDisadvantage(attackerMod, prof, targetAC) {
  const a1 = attackRoll(attackerMod, prof, targetAC);
  const a2 = attackRoll(attackerMod, prof, targetAC);
  const chosen = a1.total <= a2.total ? a1 : a2;
  const other  = a1.total <= a2.total ? a2 : a1;
  return {
    ...chosen,
    otherRoll: other.roll,
    otherTotal: other.total,
    disadvantage: true
  };
}
/* ISSUE-20261028-15：玩家「朝向必中」。
 * 正对目标出手时，不再由 d20 决定中不中 —— 一律算命中，伤害与暴击判定完全照旧。
 *   - A2 仍然掷骰：d20 照掷、自然 20 的暴击优先级不变（本函数只写 hit，不碰 nat20）。
 *   - B1 覆盖自然 1（推荐值）：否则玩家会遇到「我正对着它，还是空了」，规则等于没建立起来。
 *   - A4 / C1：玩家侧**近战与远程**都可调用（远程自 ISSUE-20261029-33 起）；
 *     技能爆发、敌人侧一律不调用本函数。
 * 不复用 atk.forcedHit —— 那个字段已经被「不稳定血浆」占用，混用会让日志串味。 */
function applyFacingGuaranteedHit(atk, target, shooter) {
  /* shooter 缺省 = 玩家本体（近战沿用既有语义）。
   * ★ ISSUE-20261029-33：远程分支传入「渲染朝向」版本 ——
   *   远程射程远，玩家更容易察觉「屏幕上朝哪」与「判定按哪」不一致，
   *   所以远程用 getPlayerRenderFacing()（规划阶段 = 计划路径的朝向），近战保持原样不动。 */
  const u = shooter || player;
  /* ISSUE-20261028-06 必中协议：攻击必定命中（代价在 rollPlayer*Damage 里统一 -1/层）。
   * 放在朝向判定**之前**：它不看朝向，正对/背对都算中。 */
  if (relicAlwaysHit() && !atk.hit) {
    atk.hit = true;
    atk.relicAimHit = true;
  }
  if (!u || !target || !isFacingTarget(u, target)) return atk;
  if (atk.hit) return atk;                 // 本来就命中：保留 total/AC 的原始展示，不多贴标签
  atk.hit = true;
  atk.facingHit = true;                    // 朝向必中（A3 的日志/浮字据此加「· 必定命中」）
  atk.nat1Overridden = !!atk.nat1;         // 记录「自然 1 被覆盖」，让战报能解释这行数字
  return atk;
}
function fmtRoll(atk, ac) {
  /* ISSUE-20261028-15：朝向必中的点数会「看起来打不中」，必须就地解释，否则像 bug。
   * 这种情况下比较符也要按真实总点数显示（`6<AC30（朝向必中…）`），不能因为 hit=true 就写成 ≥。 */
  const forced = atk.facingHit ? `（朝向必中${atk.nat1Overridden ? '，覆盖自然1' : ''}）` : '';
  const cmp = atk.facingHit ? (atk.total >= ac ? '≥' : '<') : (atk.hit ? '≥' : '<');
  if (atk.disadvantage) {
    return `劣势 d20=${atk.roll}${atk.mod >= 0 ? '+' : ''}${atk.mod}${atk.prof ? '+熟' + atk.prof : ''}=${atk.total} / d20=${atk.otherRoll}${atk.mod >= 0 ? '+' : ''}${atk.mod}${atk.prof ? '+熟' + atk.prof : ''}=${atk.otherTotal}，取低${cmp}AC${ac}${forced}`;
  }
  return `d20=${atk.roll}${atk.mod >= 0 ? '+' : ''}${atk.mod}${atk.prof ? '+熟' + atk.prof : ''}=${atk.total}${cmp}AC${ac}${forced}`;
}
/* =========================================================
 * ★ 玩家伤害骰（2026-10-29，人类指令：近战 2d4 / 远程 1d8）
 *
 * 唯一伤害公式（每次出手各掷一次，技能倍率乘在**掷完之后的总伤害**上）：
 *   近战 = 2d4 + ⌊(STR−10)/2⌋ + 锈蚀刀片层数      远程 = 1d8 + ⌊(INT−10)/2⌋
 *   暴击 ×2（自然20 / 朝向 —— 近战正面扇形、远程正前方直线 / 8% 随机暴击 / 技能必暴）
 *
 * 为什么保留属性修正：加点系统（每级 2 点、上限 20）是升级唯一手感来源，
 * 剥掉属性加成会让「加力量/智力」对伤害完全无效，六维只剩 HP/AC/移动/可见步。
 * 为什么用 randInt 而不是别的随机源：randInt → 全局 rng()，与命中检定同一条随机流，
 * 保证「同一回合内可复现」（测试用 __setD20 之类只替换 d20 时，伤害骰仍然真实随机）。
 * ★ 面板用的 meleeDmg / rangedDmg 从此只是**期望值**（diceAvg + 修正），不要再拿它们当伤害用。
 * ========================================================= */
function rollDamageDice(dd) {
  let total = 0;
  for (let i = 0; i < dd.n; i++) total += 1 + randInt(dd.s);
  return total;
}
/* 玩家攻击的固定加成（ISSUE-20261028-06）：
 *   近战 = 力量修正 + 锈蚀刀片层数（原 relicMeleeBonus）
 *   远程 = 智力修正 + 战术目镜层数（新遗物） */

function playerRangedFlatBonus() { return abilityMod(playerStats.abilities.int) + relicRangedBonus(); }
/* 真正用于扣血的入口 —— 战斗内所有近战/远程伤害都必须走这两个（含技能、冲锋、相杀、反击）。
 * ★ ISSUE-20261028-06：必中协议的代价（-1/层）在这里统一扣 —— 它是「每次伤害」，
 *   写在源头可以保证攻击 / 技能 / 冲锋 / 反击全都生效，不需要在每个结算分支补一份。
 *   夹取口径与旧版一致：减完后仍保底 1 点伤害。 */
/* ISSUE-20261028-06 回响回路：施法后**下一次攻击**伤害 ×2，且只吃一次。
 * 放在掷骰之后乘：先算基础伤害（含骰子/属性/刀片/必中代价），整段翻倍才符合「伤害 ×2」的直觉；
 * 若乘在骰子上，`Math.max(1, …)` 的保底会参与进来，数值会偏。 */
function withEchoMultiplier(base) {
  return relicConsumeEcho() ? base * 2 : base;
}
function rollPlayerMeleeDamage() {
  return withEchoMultiplier(Math.max(1, rollDamageDice(PLAYER_MELEE_DICE) + playerMeleeFlatBonus() - relicAimDamagePenalty()));
}
function rollPlayerRangedDamage() {
  return withEchoMultiplier(Math.max(1, rollDamageDice(PLAYER_RANGED_DICE) + playerRangedFlatBonus() - relicAimDamagePenalty()));
}
/* 面板文案：`2d4+1` / `1d8-1` / `2d4`（修正为 0 时不显示符号） */
function fmtDmgDice(dd, flat) {
  const base = diceLabel(dd);
  if (flat > 0) return base + '+' + flat;
  if (flat < 0) return base + '−' + Math.abs(flat);
  return base;
}
function playerMeleeDmgLabel() { return fmtDmgDice(PLAYER_MELEE_DICE, playerMeleeFlatBonus()); }
function playerRangedDmgLabel() { return fmtDmgDice(PLAYER_RANGED_DICE, playerRangedFlatBonus()); }

function recomputePlayerDerivedStats() {
  const a = playerStats.abilities;
  /* ISSUE-20261028-06：血包的 HP 上限加成（+）与事件的「血色契约」代价（−）都在这里结算。
   * 事件扣的上限走独立记账 relicMaxHpPenalty，**不去砍 abilities.con** ——
   * con 同时决定 AC 与初始 HP，砍它等于一次代价罚三遍，而且遗物栏里看不出来。 */
  playerStats.maxHp = Math.max(1, a.con + BASE_HP_BONUS + levelHpBonus + relicHpBonus() - relicMaxHpPenalty);
  /* ISSUE-20261028-06 轻装引擎：移动力 +2/层（代价是下面的 AC -2/层） */
  playerStats.move = Math.max(1, Math.floor(a.dex / 2) + relicMoveBonus());
  /* ★ 这两个字段**只是期望值**（AI 估值 / 面板兜底 / 日志），实际扣血一律用 rollPlayer*Damage()。
   * diceAvg 与 rollDamageDice 的期望对齐：2d4→5、1d8→5。 */
  playerStats.meleeDmg = Math.max(1, diceAvg(PLAYER_MELEE_DICE) + playerMeleeFlatBonus());
  playerStats.rangedDmg = Math.max(1, diceAvg(PLAYER_RANGED_DICE) + playerRangedFlatBonus());
  playerStats.visibleSteps = 1 + Math.max(0, abilityMod(a.wis));
  /* ISSUE-20261028-06 轻装引擎的代价：AC -2/层（允许为负，怪真能更容易打中） */
  playerStats.ac = computeAC(a) + relicAcPenalty();
  /* ISSUE-20261028-06 磨刀石：暴击率 +8%/层。放这里而不是只在 reset 里设一次，
   * 否则**中途拿到磨刀石不会生效**（reset 只在开局/重开跑）。 */
  playerStats.critChance = BASE_CRIT_CHANCE + relicCritBonus();
  /* ISSUE-20261028-07：熟练加值改为绑定**角色等级**，每级 +1。
   * 旧口径 `4 + ⌊(关卡-1)/5⌋` 与 heroLevel（每 3 关 +1）脱钩，升级当关玩家看不到熟练变化；
   * 新口径起手仍为 +4（heroLevel=1 → +4），第 1–3 关手感与旧版完全一致。
   * 实测（每方案 21 万次 attackRoll）：对当时真实敌人 AC，每级 +2 会在第 4 关就全类型封顶 95%，
   * 命中机制失效，故取 +1。 */
  playerStats.prof = 4 + Math.max(0, heroLevel - 1);
  /* ISSUE-20261028-19：动态角色（预备干员）的熟练项由六维现算 —— 每次加点都会重跑本函数，
   * 所以「先加智力变远程、再加力量翻回近战」是自动的，不需要额外挂钩。
   * 静态角色继续用 createPlayerStats() 里写好的值，一行都不覆盖（其他四人行为必须完全不变）。 */
  if (charIsDynamic(playerStats.charId)) {
    const ranged = dynamicAttackTypeOf(a) === 'ranged';
    playerStats.profMelee = !ranged;
    playerStats.profRanged = ranged;
  }
  playerStats.meleeProf = playerStats.profMelee ? playerStats.prof : 0;
  playerStats.rangedProf = playerStats.profRanged ? playerStats.prof : 0;
}

/* =========================================================
 * 玩家侧攻击类型（ISSUE-20261028-19）
 *
 * 前四人静态，预备干员按当前六维现算。**所有运行时判定都必须走这里**，
 * 不要再写 `selectedChar === 'wheelchair' || selectedChar === 'fencer'` 这种角色名硬判断 ——
 * 那条判断在预备干员身上会直接把近战角色送进远程分支。
 * ========================================================= */
function playerAttackType() {
  return charAttackTypeOf(selectedChar, playerStats && playerStats.abilities);
}
function playerIsRanged() { return playerAttackType() === 'ranged'; }
function playerDmgLabel() { return playerIsRanged() ? '远程伤害' : '近战伤害'; }

/* ★ 以下三个只读「基础面板（L1）」。
 * 运行时数值请一律用 computeEnemyGrowth(type, level, idx, RUN_SEED) —— 见上方 ISSUE-20261028-03。
 * 保留它们是为了让「基础值」的语义还查得到，不要再拿它们给场上单位赋值。 */
function getEnemyAbilities(type) { return { ...ENEMY_STATS[type].abilities }; }
function getEnemyProf(type) { return ENEMY_STATS[type].prof; }
function computeEnemyHp(type) { return ENEMY_STATS[type].abilities.con; }
function computeEnemyMove(type) {
  return Math.max(1, Math.floor(ENEMY_STATS[type].abilities.dex / 2));
}

/* P0.1-4 拆分 · 20261028b 基线 1185-1350 行 · 六维雷达图 drawRadar */
/* =========================================================
 * 六维雷达图
 * ========================================================= */
let charRadarLabelHits = [];   // drawRadar 写入：角色面板六维图 6 个属性文字的命中框（ISSUE-20261029-37）
function drawRadar(forceCanvas, forceAbilities) {
  const canvas = forceCanvas || radarCanvas;
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  /* ★ 角色面板六维图（#charRadarCanvas）也要记录命中区，让点击顶点文字直接加点（ISSUE-20261029-37） */
  const isChar = (canvas && canvas.id === 'charRadarCanvas');
  const recordHits = (canvas === radarCanvas) || isChar;
  if (recordHits) { if (isChar) charRadarLabelHits = []; else radarLabelHits = []; }
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 120;
  const cssH = canvas.clientHeight || 120;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const cx = cssW / 2, cy = cssH / 2;
  const n = ABILITY_ORDER.length;
  const max = ABILITY_CAP;
  // 轴上是 2 字全称，±30° 那两根轴最容易被裁 → 按横向余量反推半径
  const labelFont = Math.max(8, Math.round(Math.min(cssW, cssH) / 13));
  const pad = 3;
  const R = Math.min(
    Math.min(cssW, cssH) / 2 - labelFont * 0.95 - pad,
    (Math.min(cssW, cssH) / 2 - labelFont * 2.45) / 0.87 - pad
  );

  let abilities = forceAbilities || null;
  if (!abilities) {
    if (phase === PHASE.CHAR_SELECT) {
      /* ISSUE-20261028-19：动态角色读候选副本（加点后立刻反映），静态角色仍读常量 */
      if (selectedCandidate) abilities = candidateAbilitiesOf(selectedCandidate.id);
    } else if (player) {
      abilities = player.abilities;
    } else if (playerStats && playerStats.abilities) {
      abilities = playerStats.abilities;
    }
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (let ring = 1; ring <= 3; ring++) {
    const r = R * ring / 3;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.stroke();
  }

  if (abilities) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const k = ABILITY_ORDER[i];
      const v = Math.max(0, Math.min(max, abilities[k] || 0));
      const r = R * v / max;
      const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(78, 205, 196, 0.30)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(78, 205, 196, 0.95)';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // 最高属性（并列时都算）：数值用与「熟练项」相同的绿色，其余与属性名同色
    const LABEL_NORMAL = '#9aa';
    const LABEL_PROF = '#8fe28a';
    let topV = -1;
    for (let i = 0; i < n; i++) {
      const v = Math.max(0, Math.min(max, abilities[ABILITY_ORDER[i]] || 0));
      if (v > topV) topV = v;
    }

    // 顶点：小圆点 + 该属性的数值（沿轴外推，空间不足时往内收）
    const vFont = Math.max(8, Math.round(labelFont * 1.05));
    ctx.font = `bold ${vFont}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const k = ABILITY_ORDER[i];
      const v = Math.max(0, Math.min(max, abilities[k] || 0));
      const r = R * v / max;
      const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
      const ca = Math.cos(a), sa = Math.sin(a);
      const px = cx + ca * r, py = cy + sa * r;
      ctx.beginPath();
      ctx.arc(px, py, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = '#4ecdc4';
      ctx.fill();
      const outward = r + vFont * 1.25 < R;
      const off = outward ? vFont * 0.72 : -vFont * 1.0;
      const tx = px + ca * off, ty = py + sa * off;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(10,10,18,0.92)';
      ctx.strokeText(String(v), tx, ty);
      ctx.fillStyle = (v === topV) ? LABEL_PROF : LABEL_NORMAL;
      ctx.fillText(String(v), tx, ty);
    }
  }

  // 轴名：2 字全称，按左右方向对齐向外排版（避免被画布裁切）
  ctx.font = `bold ${labelFont}px system-ui, sans-serif`;
  ctx.textBaseline = 'middle';
  /* ISSUE-20261028-19：选角阶段的可加点提示要跟随候选副本（预备干员有 5 点，前四人没有）。
   * 这里不用 canAllocateNow() 是为了不让 radar.js 依赖 panels.js 的加载顺序 —— 语义完全一致。 */
  const canAlloc = !forceAbilities && ((phase === PHASE.CHAR_SELECT)
    ? (candidatePointsLeft() > 0)
    : !!(playerStats && playerStats.abilityPoints > 0 && (phase === PHASE.PLANNING || phase === PHASE.LEVELCLEAR)));
  for (let i = 0; i < n; i++) {
    const k = ABILITY_ORDER[i];
    const ang = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const dist = R + pad + labelFont * 0.2;
    const lx = cx + ca * dist, ly = cy + sa * dist;
    ctx.textAlign = ca > 0.2 ? 'left' : (ca < -0.2 ? 'right' : 'center');
    const inSelect = phase === PHASE.CHAR_SELECT;
    /* 熟练项：选角时动态角色按副本现算（int > str → 远程），静态角色照旧读常量 */
    const selRanged = inSelect
      ? (selectedCandidate ? isRangedCharOf(selectedCandidate.id, abilities) : false)
      : false;
    const profMelee = inSelect ? !selRanged : !!(playerStats && playerStats.profMelee);
    const profRanged = inSelect ? selRanged : !!(playerStats && playerStats.profRanged);
    const profMark = abilities && ((k === 'str' && profMelee) || (k === 'int' && profRanged));
    let col = profMark ? '#8fe28a' : '#9aa';
    if (canAlloc) col = '#cfe6ff';           // 可加点时整体提亮，提示可点击
    ctx.fillStyle = col;
    ctx.fillText(ABILITY_FULL[k], lx, ly);
    if (recordHits) { (isChar ? charRadarLabelHits : radarLabelHits).push({ k, x: lx, y: ly, r: labelFont }); }
    // 属性名外框：可加点 → 金色；角色面板中正在查看说明 → 绿色渐变（ISSUE-20261030-74 ③）
    const tw = ctx.measureText(ABILITY_FULL[k]).width;
    const padX = Math.max(3, labelFont * 0.34);
    const padY = Math.max(2, labelFont * 0.22);
    const bw = tw + padX * 2;
    const bh = labelFont + padY * 2;
    let bx = (ca > 0.2) ? (lx - padX)
           : (ca < -0.2) ? (lx - tw - padX)
           : (lx - tw / 2 - padX);
    bx = Math.max(1, Math.min(cssW - 1 - bw, bx));      // 贴边时收进画布，避免被裁
    let by = ly - bh / 2;
    by = Math.max(1, Math.min(cssH - 1 - bh, by));
    const rr = Math.min(4, bh / 2);
    function roundRectPath(rx, ry, rw, rh, rrad) {
      ctx.beginPath();
      ctx.moveTo(rx + rrad, ry);
      ctx.lineTo(rx + rw - rrad, ry);
      ctx.quadraticCurveTo(rx + rw, ry, rx + rw, ry + rrad);
      ctx.lineTo(rx + rw, ry + rh - rrad);
      ctx.quadraticCurveTo(rx + rw, ry + rh, rx + rw - rrad, ry + rh);
      ctx.lineTo(rx + rrad, ry + rh);
      ctx.quadraticCurveTo(rx, ry + rh, rx, ry + rh - rrad);
      ctx.lineTo(rx, ry + rrad);
      ctx.quadraticCurveTo(rx, ry, rx + rrad, ry);
    }
    if (isChar && charAbilityInfoKey === k) {
      const grad = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
      grad.addColorStop(0, 'rgba(120, 230, 140, 0.95)');
      grad.addColorStop(1, 'rgba(40, 180, 100, 0.95)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2.2;
      roundRectPath(bx, by, bw, bh, rr);
      ctx.stroke();
      ctx.fillStyle = 'rgba(80, 220, 120, 0.14)';
      roundRectPath(bx, by, bw, bh, rr);
      ctx.fill();
    } else if (canAlloc && abilities && abilities[k] < ABILITY_CAP) {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 1.4;
      roundRectPath(bx, by, bw, bh, rr);
      ctx.stroke();
    }
  }

  // 等级已移到角色卡「名字右侧」显示（金色 Lv.N），六维图中心不再绘制，保持留白。
}

/* P0.1-4 拆分 · 20261028b 基线 1352-1564 行 · 路径判定 / 冲锋计算 / 步数统计 */
/* =========================================================
 * 基础工具
 * ========================================================= */
function isWalkable(x, y) {
  if (phase === PHASE.CHAR_SELECT) return inBounds(x, y) && selMap[y][x] === 0;
  return inBounds(x, y) && map[y][x] === 0;
}
function faceToward(from, to) {
  const dx = to.x - from.x, dy = to.y - from.y;
  if (dx === 0 && dy === 0) return { dx: 1, dy: 0 };
  if (Math.abs(dx) >= Math.abs(dy)) return { dx: Math.sign(dx), dy: 0 };
  return { dx: 0, dy: Math.sign(dy) };
}
function isFacingTarget(unit, target) {
  if (!unit || !unit.facing) return false;
  const dx = Math.sign(target.x - unit.x);
  const dy = Math.sign(target.y - unit.y);
  if (dx === 0 && dy === 0) return false;
  return dx === unit.facing.dx && dy === unit.facing.dy;
}
function isInFacingCone(unit, target) {
  if (!unit || !unit.facing) return false;
  const dx = Math.sign(target.x - unit.x);
  const dy = Math.sign(target.y - unit.y);
  if (dx === 0 && dy === 0) return false;
  if (unit.facing.dx !== 0) {
    return dx === unit.facing.dx && Math.abs(dy) <= 1;
  } else {
    return dy === unit.facing.dy && Math.abs(dx) <= 1;
  }
}
/* =========================================================================
 * ISSUE-20261029-41 · 朝向 = 「下一步要去的方向」（人类 2026-10-29 16:18「3 是」）
 *
 * 旧语义是「来向」：落地时写 sign(目标格 - 起点格)，即**进入**方向。
 * 于是「朝上站着 → 原地攻击 → 下一步往左走」这一拳仍按朝上判，左边的敌人吃不到朝向必中。
 *
 * facingAt(path, i) = 从路径第 i 格出发、走向下一个**移动步**的方向：
 *   · path[i+1] 与 path[i] 同格（等待步）→ 继续往后找，即「等待步不转身」；
 *   · 没有下一步移动（终点 / 整条路径都在等）→ 用「进入该格」的方向兜底
 *     （起点格没有来向，才用调用方传进来的 fallback）。
 *
 * ★ 纯函数，不读全局、不碰 DOM：结算（移动落地 / 原地攻击）与渲染（previewFacing /
 *   路径格箭头）必须用同一个它，否则「屏幕上朝哪」和「按哪判」又会分成两套。
 * ========================================================================= */
function facingAt(path, i, fallback) {
  const fb = fallback || { dx: 0, dy: 0 };
  if (!path || !path.length) return fb;
  const start = Math.max(0, Math.min(i | 0, path.length - 1));
  for (let j = start; j < path.length - 1; j++) {
    const dx = Math.sign(path[j + 1].x - path[j].x);
    const dy = Math.sign(path[j + 1].y - path[j].y);
    if (dx !== 0 || dy !== 0) return { dx, dy };
  }
  if (start > 0) {
    const dx = Math.sign(path[start].x - path[start - 1].x);
    const dy = Math.sign(path[start].y - path[start - 1].y);
    if (dx !== 0 || dy !== 0) return { dx, dy };
  }
  return fb;
}
/* 规划期的渲染朝向 = facingAt(0)，即**第一个移动步**的方向。
 * 旧实现返回「整条路径最后一步」的方向（路径尽头），与结算用的 player.facing 不是同一套；
 * 改完「屏幕上朝哪就按哪判」（ISSUE-20261029-33 的口径）。
 * startX/startY 只为兼容旧调用签名保留：path[0] 与玩家位置不一致（异常态）时，
 * 用它补一个「玩家 → path[0]」的方向。 */
function previewFacing(path, startX, startY) {
  if (!path || !path.length) return null;
  const f = facingAt(path, 0, null);
  if (f && (f.dx || f.dy)) return f;
  const dx = Math.sign(path[0].x - startX);
  const dy = Math.sign(path[0].y - startY);
  if (dx !== 0 || dy !== 0) return { dx, dy };
  return null;
}
function calcPathSignature() {
  if (!player || !enemies) return '';
  // 修复：签名必须包含玩家正在规划的路径。
  // 原来只放玩家坐标，玩家画/撤回路径时坐标没变 → 签名不变 → 敌人意图永远不重算，
  // 于是「预判玩家路径」这套逻辑完全没有触发机会。
  const pathSig = playerPath.map(p => p.x + ',' + p.y).join('>');
  /* ISSUE-20261029-28：小队成员的位置也要进签名 —— 它们是敌人的移动占位，
   * 漏了这条会让「成员走开 / 召唤出新成员」不触发敌人意图重算，箭头指向过期格子。 */
  const squadSig = (typeof squadUnits !== 'undefined' ? squadUnits : [])
    .map(s => s.x + ',' + s.y).join(';');
  return player.x + ',' + player.y + '|' + pathSig + '|' + squadSig + '|' +
    enemies.map(e => e.alive ? key(e.x, e.y) : 'x').join(';');
}

/* 风笛技力：路径里每段「同方向连续 ≥2 步」贡献该段长度（1 步不算直线，得 0）。
 * 等待（同格重复）和转向都会断开一段。
 *   wdds → w(1=0) + d(2=2) + s(1=0) = 2 点
 *   wwwd → w(3=3) + d(1=0)        = 3 点
 */
function pathSpGain(path) {
  if (!path || path.length < 3) return 0;
  let gain = 0, runDx = 0, runDy = 0, runLen = 0;
  const flush = () => { if (runLen >= 2) gain += runLen; runLen = 0; };
  for (let i = 1; i < path.length; i++) {
    const dx = Math.sign(path[i].x - path[i - 1].x);
    const dy = Math.sign(path[i].y - path[i - 1].y);
    if (dx === 0 && dy === 0) { flush(); runDx = 0; runDy = 0; continue; }  // 等待：断开
    if (runLen > 0 && dx === runDx && dy === runDy) { runLen++; }

    .filter(i => i > 0 && i < path.length)

function previewChargeBudget(path) {

 * 冲锋距离不再「一路到墙」，而是最多推进 maxSteps 格——剩几步就冲几格、打几次。
 * 撞墙/出界提前结束返回 'wall'；走满额度仍未撞墙返回 'budget'（日志要区分这两种）。
 * maxSteps 省略时退回旧行为（到墙为止），仅供调试/兼容调用。 */
function computeStraightChargePath(path, trigger, maxSteps) {
  const startPos = path[trigger.endIdx];
  const dir = trigger.dir;

  const limit = (maxSteps === undefined || maxSteps === null) ? Infinity : Math.max(0, maxSteps | 0);

  while (safety < maxSafety) {
    if (result.length >= limit) return { chargePath: result, stopReason: 'budget' };
    safety++;

    if (!inBounds(nx, ny) || map[ny][nx] === 1) {

 * 只认朝向直线上的格子，侧后方一律不吃冲锋伤害。 */

  const out = [];
  if (!origin || !dir || (!dir.dx && !dir.dy)) return out;
  for (let k = 1; k <= maxDist; k++) {
    const x = origin.x + dir.dx * k, y = origin.y + dir.dy * k;
    if (!inBounds(x, y) || map[y][x] === 1) break;      // 墙挡视线
    for (const e of enemies) {
      if (!e.alive || e.hp <= 0) continue;
      if (e.x === x && e.y === y) out.push(e);
    }

 * 撞到没秒掉的敌人会立即停下，但剩余攻击次数不作废 —— 继续按朝向逐次输出，
 * 直到额度用完或前方 3 格内再无可命中的敌人。每次伤害与冲锋撞击一致：近战伤害骰（2d4+修正）× 2。 */
function resolveChargeRemainingHits() {
  if (!playerChargingThisTurn || !player || !player.alive || playerChargeBudget <= 0) return;

  while (playerChargeBudget > 0 && guard++ < 60) {
    const list = findFacingEnemiesWithin(origin, playerChargeDir, CHARGE_FINISH_RANGE);
    if (list.length === 0) break;
    const target = list[0];                 // 优先最近的
    const dmg = rollPlayerMeleeDamage() * 2;
    target.hp -= dmg;
    playerChargeCausedDamage = true;
    playerChargeBudget -= 1;
    playerChargeHits += 1;
    slashFx(target.x, target.y, '#ffd700');
    ringFx(target.x, target.y, '#ff4500');
    hitFlashCell(target.x, target.y);
    floatText(target.x, target.y, `冲锋追击 -${dmg}`, '#ffd700', true);
    log(`冲锋追击敌人${target.id + 1}，造成${dmg}点伤害！（剩余 ${playerChargeBudget} 次）`);
    if (target.hp <= 0) killEnemy(target, { logText: `敌人${target.id + 1}被冲锋追击击倒` });
  }
  if (playerChargeBudget > 0 && playerChargeHits > 0) {
    log(`冲锋结束：朝向前方 ${CHARGE_FINISH_RANGE} 格内已无可命中目标，剩余 ${playerChargeBudget} 次攻击作废。`);
  }
}

/* ===== 技能节点 =====
 * 技能节点由玩家「双击路径节点」设置，到达该步时发动各角色技能（见 resolveStep 的 triggerSkillNode）。
 * 是否可发动只取决于角色自己的技力/状态，因此这里集中给出「当前是否就绪」的预览信息。 */
function skillReadyInfo(path, usePreview = true) {
  switch (selectedChar) {
    case 'wheelchair': {
      const sp = usePreview ? wheelchairPreviewSp() : wheelchairSp;
      return { ready: sp >= WHEELCHAIR_SP_MAX, name: '高效冲击', spNow: sp, spMax: WHEELCHAIR_SP_MAX };
    }
    case 'vampire':
      return { ready: !vampireSkillActive && vampireSp >= VAMPIRE_SP_MAX, name: '不稳定血浆', spNow: vampireSp, spMax: VAMPIRE_SP_MAX };
    case 'fencer':
      return { ready: !fencerCounterActive && fencerSp >= FENCER_SP_MAX, name: '岩崩锤', spNow: fencerSp, spMax: FENCER_SP_MAX };
    case 'amiya':
      return { ready: amiyaBonusTargets > 0, name: '精神爆发', spNow: amiyaBonusTargets, spMax: amiyaSpMax() };
    case 'rookie':
      /* ISSUE-20261029-28：技力满 5 才能召唤，没有「部分发动」这回事 */
      return { ready: rookieSp >= ROOKIE_SP_MAX, name: '增援召唤', spNow: rookieSp, spMax: ROOKIE_SP_MAX };
    default:
      return { ready: false, name: '技能', spNow: 0, spMax: 0 };

/* 路径上有效的技能节点下标（升序、去重；下标 0 = 起点不算） */
function skillNodesOnPath(path) {
  const p = path || playerPath;
  return [...new Set(skillIndices.filter(i => i > 0 && i < p.length))].sort((a, b) => a - b);
}
/* 攻击范围高亮用的路径下标（第一个攻击/技能节点）；没有节点则以角色当前位置为圆心 */
function rangeDisplayOrigin() {
  if (!player) return null;
  const idxs = [...attackIndices, ...skillIndices].filter(i => i < playerPath.length).sort((a, b) => a - b);
  if (idxs.length) return playerPath[idxs[0]];
  return { x: player.x, y: player.y };

function countMoveSteps(path) {
  let n = 0;
  for (let i = 1; i < path.length; i++) {
    if (path[i].x !== path[i-1].x || path[i].y !== path[i-1].y) n++;

function countWaitSteps(path) {
  let n = 0;
  for (let i = 1; i < path.length; i++) {
    if (path[i].x === path[i-1].x && path[i].y === path[i-1].y) n++;
  }
  return n;

/* P0.1-4 拆分 · 20261028b 基线 1566-1621 行 · 动作机制与有效 AC 计算 */
/* =========================================================
 * ★ 动作机制（技能触发系统重做后）
 *
 * 主动行动只有三种，共用同一份动作预算：
 *   - 攻击：单击路径节点设攻击节点，到达该步时攻击。
 *     正对目标近战时触发「朝向必中」（dnd.js#applyFacingGuaranteedHit），伤害与暴击判定照旧。
 *   - 技能：双击路径节点设技能节点，到达该步时发动角色技能。
 *   - 闪避：路径里第一个「等待」自动成为闪避节点，AC +⌊敏捷 / 2⌋（ISSUE-20261030-60）。
 *
 * 【2026-10-29 删机制】旧的「自动补刀」被动已彻底移除 —— 本 tick 只要有动作，就对**所有**相邻
 * 敌人各补一刀，不占动作、无上限，实际占了玩家总输出的一大半；功能上和攻击节点重复。
 * 现在攻击只有一条路：设攻击节点（含朝向必中）。没有自动补刀、没有白嫖出手，不要加回来。
 *
 * 默认每回合 1 次动作（scout 的 extraAttacks 可 +1）。按路径先后先到先得，
 * 超出预算的动作在结算时报失败并写日志。
 * 技能节点占住第一个等待步且技能就绪时，技能优先，该步不结算闪避。
 * ========================================================= */
/* ISSUE-20261030-60（人类 2026-10-30 02:5x 拍板）：闪避的 AC 加成不再是固定 +3，
 * 而是 **⌊敏捷属性值 / 2⌋** —— 与「移动力 = ⌊敏捷 / 2⌋」同一套口径。
 *   dex 8 → +4 · dex 10 → +5 · dex 14 → +7
 * 人类当时否掉了另外两种候选口径：敏捷调整值再折半（dex 10 只给 +0，等于废掉闪避）
 * 与敏捷调整值本身；最终选的就是这句原话「AC + 敏捷/2」的字面算法。
 * 「危险直觉」遗物仍按**加算 +3** 叠在这上面（relicDodgeAcBonus），与旧版 3+3=6 语义连续。
 * 取数优先级：局内 playerStats → player → 0（选角相位没建号时不该走到这里）。 */
function dodgeAcBonusBase() {
  const ab = (playerStats && playerStats.abilities) || (player && player.abilities) || {};
  return Math.floor((ab.dex || 0) / 2);
}

// 路径里第一个「等待」步的下标；没有则 -1
function firstWaitIndex(path) {
  const p = path || playerPath;
  for (let i = 1; i < p.length; i++) {
    if (p[i].x === p[i-1].x && p[i].y === p[i-1].y) return i;
  }
  return -1;
}

/* 本回合规划出来的「动作」占用情况：{ dodge, dodgeIndex, actions, skillIdxs, attackCount, skillCount, order } */
function plannedActionInfo(path, atkIdxs, skillIdxs) {
  const p = path || playerPath;
  const atk = atkIdxs || attackIndices;
  const sk = skillIdxs || skillIndices;
  const wIdx = firstWaitIndex(p);
  /* ★ ISSUE-20261029-34：技能节点的过滤口径必须与攻击节点一致（都含起点 idx 0）。
   * 旧版写 `i > 0`，于是「在原地点技能」既不占动作预算、也永远不会被结算到
   * （resolveStep 只在 pathIdx >= 1 的移动步上检查技能节点）。现在统一成 `i >= 0`：
   * 起点技能 = 本回合第一个 tick 原地发动（见 templates/game.html#resolveStep）。 */
  const skOnPath = [...new Set(sk.filter(i => i >= 0 && i < p.length))].sort((a, b) => a - b);
  const skSet = new Set(skOnPath);
  /* 技能节点占了第一个等待步：技能就绪时技能优先（这一步不闪避）；技能没就绪时仍可闪避 */
  const dodge = wIdx >= 0 && !(skSet.has(wIdx) && skillReadyInfo(p).ready);

   * 结算时走 pendingAttack 分支、同样消耗 playerActionsUsed。
   * 旧版用 `i > 0` 把它漏掉，导致「起点攻击 + 另一个攻击节点」规划期不报超限、
   * 结算时才莫名其妙打空（ISSUE-20261028-17 / BUG-STARTCELL-ATTACK）。 */
  const atkOnPath = [...new Set(atk.filter(i => i >= 0 && i < p.length))];

  /* ★ ISSUE-20261029-34：动作显示顺序 = 实际结算顺序。
   * 旧版 UI 固定按「闪避 → 攻击 → 技能」拼类型序，与真实结算（按路径步序）相反 ——
   * 于是「原地先点攻击再点等待（闪避）」在界面上显示成「闪避+攻击」。
   * 真实顺序：
   *   ① 起点格（idx 0）的攻击 / 技能最先结算（不移动，先出手 / 先施法）；
   *   ② 其余按路径下标升序，同一下标上先闪避（步首判定）再攻击（步末出手）；
   *      技能与攻击互斥，不会落在同一格。

  const seq = [];

  if (skOnPath.includes(0)) seq.push({ kind: 'skill', idx: 0 });

    ...atkOnPath.filter(i => i > 0),
    ...skOnPath.filter(i => i > 0),
    ...(dodge ? [wIdx] : []),

  for (const i of stepIdxs) {
    if (dodge && i === wIdx) seq.push({ kind: 'dodge', idx: i });
    if (skOnPath.includes(i)) seq.push({ kind: 'skill', idx: i });
    if (atkOnPath.includes(i)) seq.push({ kind: 'attack', idx: i });

  const order = [];
  for (const s of seq) {
    const g = order.find(o => o.kind === s.kind);
    if (g) g.count += 1;
    else order.push({ kind: s.kind, count: 1, firstIdx: s.idx });
  }

  return {
    dodge,
    dodgeIndex: (dodge ? wIdx : -1),
    skillIdxs: skOnPath,
    attackCount: atkOnPath.length,
    skillCount: skOnPath.length,
    actions,
    order,
  };
}

// 再加一个节点会不会超出预算（用于设置节点时的提示）：
// ① 动作数 ≤ maxActionsThisTurn()（ISSUE-20261029-25 起为 2）② 攻击节点数 ≤ maxAttacksThisTurn()（仍为 1）
function nodeFitsBudget(path, atkIdxs, skillIdxs) {
  const info = plannedActionInfo(path, atkIdxs, skillIdxs);
  return info.actions <= maxActionsThisTurn() && info.attackCount <= maxAttacksThisTurn();
}
// 被拒时说清是哪条线撞的（ISSUE-20261029-25 起「动作数」与「攻击次数」是两个不同的上限，
// 一句「动作上限 2」会把玩家带偏 —— 明明只放了一个攻击节点也会被拒）
function budgetRejectReason(path, atkIdxs, skillIdxs) {
  const info = plannedActionInfo(path, atkIdxs, skillIdxs);
  if (info.attackCount > maxAttacksThisTurn()) {
    return `攻击次数上限 ${maxAttacksThisTurn()}：本回合只能出手 ${maxAttacksThisTurn()} 次（动作预算 ${maxActionsThisTurn()} 件里最多 1 件是攻击，其余留给技能/闪避）。`;
  }
  return `动作上限 ${maxActionsThisTurn()}：攻击节点 + 技能节点 + 闪避合计不能超过 ${maxActionsThisTurn()} 件。`;

/* ★ ISSUE-20261029-34：追加一个「等待」步（= 闪避动作）前先查预算。
 * 等待步本身不消耗移动力以外的东西，但**第一个**等待步会自动变成闪避动作（占 1 件）。
 * 旧版三处入口（等待按钮 / Q 键 / 长按 400ms）都只看「等待次数 < 移动力」，
 * 完全不查动作预算 —— 于是「攻击 + 技能 + 闪避」三件能被规划出来（预算只有 2），
 * 界面上出现红色的「3/2」，这就是「连续点会出现 3 个行动」的根因。
 * 注意：第二个及以后的等待步不会新增闪避动作，所以永远不会超预算。 */
function canAddWaitStep(path, atkIdxs, skillIdxs) {
  const p = path || playerPath;
  const last = p.length ? p[p.length - 1] : (player ? { x: player.x, y: player.y } : { x: 0, y: 0 });
  const next = [...p, { x: last.x, y: last.y }];
  if (!nodeFitsBudget(next, atkIdxs, skillIdxs)) {
    return { ok: false, reason: budgetRejectReason(next, atkIdxs, skillIdxs) };
  }
  return { ok: true, path: next };
}

/* 玩家当前有效 AC：闪避状态下额外 +N（闪避持续到本回合结束） */
function playerEffectiveAC() {
  let ac = player ? player.ac : 10;
  if (playerDodging) ac += playerDodgeACBonus;
  return ac;
}

/* ★ 动作预算（ISSUE-20261029-25 起）：一回合可以做 BASE_ACTIONS_PER_TURN = 2 件事。

/* =========================================================================
