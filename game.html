<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟战棋</title>
<style>
  * { box-sizing: border-box; }
  :root { --cell: 50px; --unit-move-ms: 120ms;
          /* ISSUE-20261029-21：角标相对 #boardWrap 的偏移（棋盘居中留下的边距），
             updateCellSize() 会改写；无 JS 时退回 0，角标仍贴在容器角上不跑位。 */
          --corner-x: 0px; --corner-y: 0px; }
  body { font-family: system-ui, -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; background:#1a1a2e; color:#eee; margin:0; padding:0; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; display:flex; flex-direction:column; touch-action: manipulation; }
  #topbar { display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; padding: 4px 12px; }
  #topbar h1 { font-size:18px; margin:4px 0; text-align:center; }
  /* ISSUE-20261028-09 A：地图贴左（原来 justify-content:center 会在侧栏挤压下把地图推到中间，
     左右都留白）；棋盘容器尺寸由 updateCellSize() 按「可用短边」写死，故 flex 不再增长。 */
  #game { display:flex; gap:8px; padding: 8px 16px 16px 16px; flex-grow: 1; min-height: 0; justify-content:flex-start; }
  /* 正方形棋盘：宽高都由 JS 设成同一个像素值（短边），aspect-ratio 只是无 JS 时的兜底。
     不能用 flex-grow —— 一旦拉伸就会破坏 1:1。 */
  #boardWrap { flex: 0 0 auto; display: flex; justify-content: center; align-items: center; position:relative; min-width: 0; min-height: 0; overflow: hidden; aspect-ratio: 1 / 1; }
  /* ISSUE-18 B5：iOS Safari 长按会弹「拷贝/放大镜」，拖动跟随前必须关掉 callout */
  #board { display:grid; grid-auto-rows: var(--cell); gap:2px; padding:0; border-radius:4px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; position: relative; }
  #unitLayer { position:absolute; inset:0; pointer-events:none; z-index:40; overflow:visible; }
  #fxLayer { position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:50; }
  /* 正方形格子（ISSUE-20261028-09 A）：原来 height 是 calc(var(--cell) * 1.12)，
     整块地图因此永远被竖向拉长；1:1 后地图才是正方。 */
  .cell { width: var(--cell); height: var(--cell); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.44); border-radius:2px; cursor:pointer; user-select:none; position:relative; overflow:hidden; }
  .cell.empty { background:#2d2d44; }
  .cell.void { background:transparent; cursor:default; pointer-events:none; }
  .cell.wall { background:#4a4a5a; cursor:not-allowed; border-radius:4px; }
  /* ISSUE-20261028-10-B：粗圆岩 = Boss 落的动态墙。用暖褐 + 内描边和灰墙区分开，
     但又不能比敌人/玩家更抢眼（它是地形，不是单位）。 */
  .cell.rock { background:#6b5233; cursor:not-allowed; border-radius:4px;
    box-shadow: inset 0 0 0 1px rgba(255,206,140,.45); }
  .cell.path { background:#3a5a8c; }
  /* 闪避节点：第一次等待（蓝色描边 + 内部蓝调） */
  .cell.dodge { box-shadow: inset 0 0 0 2px #7dd3fc; background:#2f5578; }
  .cell.dodge.attack { box-shadow: inset 0 0 0 2px #7dd3fc, inset 0 0 0 999px rgba(192,57,43,.35); }
  /* ISSUE-20261029-41：路径格朝向箭头 —— 指向「从这一格出发」的下一步方向。
     放右上角（右下角是单位朝向指示、格中央是节点/图标），0.3 格大小、30% 不透明，不抢注意力。
     四个方向靠旋转同一个向上三角实现，避免四套 border 组合写错。 */
  .cell-dir { position:absolute; top:9%; right:9%; width:0; height:0; opacity:.3; pointer-events:none;
    border-left: calc(var(--cell) * 0.13) solid transparent;
    border-right: calc(var(--cell) * 0.13) solid transparent;
    border-bottom: calc(var(--cell) * 0.22) solid #dbe4ff; }
  .cell-dir.l { transform: rotate(-90deg); }
  .cell-dir.r { transform: rotate(90deg); }
  .cell-dir.d { transform: rotate(180deg); }
  .cell.attack { background:#c0392b; }
  .cell.attack.used { background:#5c2b29; }
  /* 技能节点（双击设置）：紫色底 + 紫描边 + ✦ */
  .cell.skill { background:#5b3a8c; box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.used { background:#3d2a5c; }
  .cell.attack.skill { background: linear-gradient(135deg, #c0392b 0 45%, #5b3a8c 55% 100%); box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.dodge { box-shadow: inset 0 0 0 2px #c9a0ff, inset 0 0 0 4px #7dd3fc; }
  /* 攻击范围：在地块上叠一层蓝色（与路径格 #3a5a8c 接近），不遮挡格子内容 */
  .cell.in-range { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25); }
  .cell.in-range.attack, .cell.in-range.skill { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25), inset 0 0 0 1px rgba(201,160,255,.65); }
  .cell.item-cell { background: #4a1e2f; box-shadow: inset 0 0 10px #ff6b6b; }
  .cell.blood-cell { background: #3d1515; }
  .cell.exit-cell { background: #27ae60; box-shadow: inset 0 0 15px #2ecc71; }
  .cell.hitflash { animation: hitflash .35s ease-out; }
  @keyframes hitflash { 0%{box-shadow: inset 0 0 0 40px rgba(255,80,80,.9);} 100%{box-shadow: inset 0 0 0 0 rgba(255,80,80,0);} }
  .item-pulse { animation: itemPulse 1.5s ease-in-out infinite; display:inline-block; }
  @keyframes itemPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  /* 单位渲染（格内静态 .unit + 绝对定位 .unit-abs）共用同一套外观，避免两处分别维护 */
  .unit, .unit-abs { display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; pointer-events:none; position:relative; }
  .unit { width:100%; height:100%; }
  .unit-abs { position:absolute; left:0; top:0; width:auto; height:auto; transition: transform var(--unit-move-ms) linear; will-change: transform; border-radius:2px; }
  .unit .icon, .unit-abs .icon { font-size: calc(var(--cell) * 0.55); line-height:1; display:flex; align-items:center; justify-content:center; }
  .unit .icon.ghost-icon, .unit-abs .icon.ghost-icon { opacity: 0.7; filter: drop-shadow(0 0 5px #fff); }
  /* 选角大厅角色（ISSUE-20261028-12）：连续坐标 + 绝对定位。
     自由移动期间必须 transition:none —— 每帧写 transform 时若还有 transition，
     会把每帧目标再缓动一次，出现拖尾/松手后还在滑。 */
  .cand-unit { position:absolute; left:0; top:0; display:flex; align-items:center; justify-content:center;
    transition:none; will-change:transform; pointer-events:none; border-radius:6px; }
  .cand-unit .cand-icon { font-size: calc(var(--cell) * 0.55); line-height:1; display:flex; align-items:center; justify-content:center; }
  .cand-unit.sel { outline:3px solid #f39c12; box-shadow: inset 0 0 15px rgba(243,156,18,0.55); }
  /* 词缀 / 精英标记（ISSUE-20261028-05）：词缀做成右上角小标签，精英用金边 + 星标。
     刻意不用 CSS filter 改图标色 —— 会把 emoji 与后续像素画（ISSUE-07）的色阶一起毁掉。 */
  .affix-tag { position:absolute; top:0; right:0; display:flex; gap:1px; align-items:center;
    font-size: calc(var(--cell) * 0.2); line-height:1; padding:1px 2px; border-radius:4px;
    background: rgba(0,0,0,0.66); color:#ffd93d; font-weight:900; letter-spacing:0;
    pointer-events:none; z-index:46; white-space:nowrap; }
  .unit-abs.ua-elite { outline:2px solid #ffd700; outline-offset:-2px;
    box-shadow: inset 0 0 10px rgba(255,215,0,0.45); }
  .unit-abs.ua-elite .icon { text-shadow: 0 0 6px #ffd700; }
  .unit .hp-bar, .unit-abs .hp-bar { width: 78%; height: 3px; background: rgba(0,0,0,0.55); border-radius: 2px; margin-top: 1px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 2px rgba(0,0,0,0.6); }
  .unit .hp-fill, .unit-abs .hp-fill { height: 100%; border-radius: 2px; transition: width 0.25s ease; }
  .unit-abs.ua-player { outline:2px solid #4ecdc4; outline-offset:-2px; }
  .unit-abs.ua-player.ua-charging { outline:3px solid #ffd700; outline-offset:-3px; box-shadow: inset 0 0 15px #ffd700; }
  .unit-abs.ua-player.ua-attacked { outline:2px dashed #ffb86b; outline-offset:-2px; }
  .unit-abs.ua-enemy { outline:2px solid #e74c3c; outline-offset:-2px; }
  /* ISSUE-20261029-28：召唤出来的小队成员 = 友军，绿框，与玩家青框 / 敌人红框区分 */
  .unit-abs.ua-squad { outline:2px solid #4ade80; outline-offset:-2px; box-shadow: inset 0 0 8px rgba(74,222,128,0.25); }
  .unit-abs.ua-stunned { opacity: 0.55; filter: grayscale(0.35); }
  .unit-abs.ua-stunned::after {
    content: '💫';
    position: absolute;
    top: -2px;
    right: -2px;
    font-size: calc(var(--cell) * 0.28);
    animation: stunSpin 1.8s linear infinite;
    pointer-events: none;
    text-shadow: 0 0 4px #ffd700;
  }
  @keyframes stunSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .facing-ind { position: absolute; font-size: calc(var(--cell) * 0.2); color: rgba(255,255,255,0.55); text-shadow: 0 0 3px #000, 0 0 2px #000; line-height: 1; pointer-events: none; font-weight: 900; z-index: 2; }
  .facing-ind.r { right: 1px; top: 50%; transform: translateY(-50%); }
  .facing-ind.l { left: 1px; top: 50%; transform: translateY(-50%); }
  .facing-ind.d { bottom: 0; left: 50%; transform: translateX(-50%); }
  .facing-ind.u { top: 0; left: 50%; transform: translateX(-50%); }
  .enemy-arrow { position:absolute; width: calc(var(--cell) * 0.4); height: calc(var(--cell) * 0.4); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.3); font-weight:900; color:#ffd93d; background:rgba(0,0,0,0.6); border-radius:50%; text-shadow:0 0 4px #000, 0 0 6px #ffd93d; transform:translate(-50%,-50%); z-index:45; pointer-events:none; }
  .bullet { position:absolute; width:12px; height:12px; border-radius:50%; background:#ffe66d; box-shadow:0 0 10px 3px #ffd93d, 0 0 22px 6px rgba(255,217,61,.5); transform:translate(-50%,-50%); z-index:20; }
  .bullet.crit { background:#ff4500; box-shadow:0 0 12px 4px #ff4500, 0 0 26px 8px rgba(255,69,0,.6); width:14px; height:14px; }
  .bullet.alien { background:#a55eea; box-shadow:0 0 10px 3px #a55eea, 0 0 22px 6px rgba(165,94,234,.5); width:14px; height:14px; }
  .float-text { position:absolute; font-weight:900; font-size:20px; text-shadow:0 0 6px #000, 0 0 2px #000; pointer-events:none; z-index:30; transform:translate(-50%,-50%); white-space:nowrap; }
  .float-text.crit { font-size:26px; color:#ffd700 !important; text-shadow:0 0 10px #ff4500, 0 0 4px #000; }
  .float-text.crosskill { font-size:26px; color:#ff4500 !important; text-shadow:0 0 12px #ff4500, 0 0 4px #000, 0 0 2px #000; letter-spacing:2px; }
  .ring-fx { position:absolute; width:46px; height:46px; border:4px solid #fff; border-radius:50%; transform:translate(-50%,-50%); z-index:25; }
  .slash-fx { position:absolute; width:52px; height:52px; z-index:26; transform:translate(-50%,-50%); }
  .slash-fx::before, .slash-fx::after { content:''; position:absolute; left:50%; top:50%; width:6px; height:46px; background:linear-gradient(180deg,#fff,#ffb86b); border-radius:4px; transform:translate(-50%,-50%) rotate(45deg); box-shadow:0 0 8px #ffb86b; }
  .slash-fx::after { transform:translate(-50%,-50%) rotate(-45deg); }
  /* 侧栏收窄（ISSUE-20261028-09 B）：六维图搬进抽屉后，侧栏只剩角色卡与日志占位，
     再留 33vw 会把棋盘挤成小方块。 */
  #sidebar { width: clamp(280px, 28vw, 450px); flex-shrink: 0; display:flex; flex-direction:column; gap:8px; height: 100%; min-height: 0; overflow: hidden; }
  #dragHandle { flex: 0 0 16px; align-self: stretch; cursor: col-resize; position: relative; user-select: none; touch-action: none; }
  /* 细分隔线（颜色加深） */
  #dragHandle::before { content: ""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; transform: translateX(-50%); background: #10101e; border-radius: 2px; }
  /* 中间竖胶囊 */
  #dragHandle .grip { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 9px; height: 50px; border-radius: 6px; background: linear-gradient(180deg, #34334d, #2d2d44); box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.45); transition: background .15s, box-shadow .15s; }
  /* 胶囊上的细小抓握点 */
  #dragHandle .grip::before, #dragHandle .grip::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; border-radius: 50%; background: rgba(220,226,255,.55); }
  #dragHandle .grip::before { top: 16px; }
  #dragHandle .grip::after { bottom: 16px; }
  #dragHandle:hover .grip, #dragHandle.dragging .grip { background: linear-gradient(180deg, #3f3e5c, #353552); box-shadow: 0 0 0 1px rgba(150,160,210,.45), 0 2px 8px rgba(0,0,0,.5); }
  /* 侧栏角色卡 #hero 已整块删除（ISSUE-20261029-38）：信息并入「行动按钮上方 HUD」 */
  #radarWrap { display: flex; align-items: center; justify-content: center; }
  /* 六维图搬进抽屉后可以画大一点：抽屉宽 min(360px,86vw)，减 padding 后仍有余量 */
  #radarCanvas { display: block; width: min(268px, 74vw); height: min(268px, 74vw); touch-action: manipulation; }
  .hero-top { display:flex; align-items:baseline; gap:5px; flex-wrap:wrap; }
  .hero-name { font-size:14px; font-weight:900; color:#4ecdc4; letter-spacing:1px; white-space:nowrap; }
  /* 等级：紧贴名字右侧（金色），用于替代原先画在六维图中心的 Lv */
  .hero-lv-gold { font-size:12px; font-weight:900; color:#ffd700; letter-spacing:.5px; white-space:nowrap; text-shadow:0 0 6px rgba(255,215,0,.25); }
  .hero-lv { font-size:11px; font-weight:800; color:#8a8aa5; white-space:nowrap; margin-left:auto; }
  .hp-track { position:relative; height:13px; border-radius:7px; background:#101019; box-shadow:inset 0 0 0 1px #34344f; overflow:hidden; }
  .hp-fill-lg { display:block; height:100%; border-radius:7px; background:linear-gradient(90deg,#2ecc71,#4ecdc4); transition:width .25s ease; }
  .hp-track.warn .hp-fill-lg { background:linear-gradient(90deg,#e67e22,#f1c40f); }
  .hp-track.danger .hp-fill-lg { background:linear-gradient(90deg,#c0392b,#e74c3c); }
  .hp-track.danger { box-shadow:inset 0 0 0 1px rgba(231,76,60,.75), 0 0 8px rgba(231,76,60,.25); }
  .hp-text { position:absolute; inset:0; display:block; text-align:center; line-height:13px; font-size:10px; font-weight:900; letter-spacing:.5px; text-shadow:0 0 3px #000,0 0 2px #000; }
  /* ---- 技力条：比血条短、细，蓝色调（风格与血条一致） ---- */
  .sp-track { position:relative; width:100%; height:10px; border-radius:5px; background:#101019; box-shadow:inset 0 0 0 1px #30425f; overflow:hidden; }
  .sp-fill { display:block; height:100%; border-radius:5px; background:linear-gradient(90deg,#2f6fe0,#5cc9f5); transition:width .25s ease; }
  .sp-track.max .sp-fill { background:linear-gradient(90deg,#3f86ff,#7fd9ff); box-shadow:0 0 8px rgba(110,190,255,.9); }
  .sp-track.max { box-shadow:inset 0 0 0 1px rgba(120,200,255,.85), 0 0 8px rgba(90,170,255,.35); }
  .sp-track.max .sp-text { color:#062339; text-shadow:0 1px 1px rgba(255,255,255,.35); }
  .sp-text { position:absolute; inset:0; display:block; text-align:center; line-height:10px; font-size:8px; font-weight:900; letter-spacing:.5px; color:#eaf6ff; text-shadow:0 1px 2px #000,0 0 3px #001a33; }
  /* 条内标签（HP / SP）：半透明字母，位于数值左侧 */
  .bar-lbl { font-style:normal; opacity:.5; font-weight:700; letter-spacing:.5px; margin-right:3px; }
  /* ---- 经验条：方形无圆角（「方形=信息」，ISSUE-20261028-10） ---- */
  .xp-track { position:relative; width:100%; height:4px; background:#101019; box-shadow:inset 0 0 0 1px #3a3550; overflow:hidden; }
  .xp-fill { display:block; height:100%; background:linear-gradient(90deg,#8a6b1f,#ffd700); transition:width .25s ease; }
  /* ---- 护盾（药枚）：血条内右侧叠一段白条，每层 12% ---- */
  .hp-shield { position:absolute; top:0; bottom:0; right:0; border-radius:0 7px 7px 0;
    background:linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,.92));
    box-shadow:0 0 6px rgba(255,255,255,.55); transition:width .25s ease; pointer-events:none; }
  .hp-shield::after { content:''; position:absolute; left:0; top:0; bottom:0; width:1px; background:rgba(255,255,255,.95); }

  /* ---- 升级奖励选择（全屏遮罩） ---- */
  .lv-mask { position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(4,6,12,.82); backdrop-filter:blur(3px); }
  .lv-panel { width:min(900px,100%); max-height:90vh; overflow:auto; background:#12121c;
    border:1px solid #2f2f4a; border-radius:14px; padding:18px 18px 20px;
    box-shadow:0 18px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(255,215,0,.12) inset; }
  .lv-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .lv-title { font-size:20px; font-weight:900; color:#ffd700; letter-spacing:1px; }
  .lv-lv { font-size:13px; font-weight:900; color:#8fe28a; }
  .lv-sub { font-size:12px; color:#8f95a8; margin:6px 0 14px; line-height:1.6; }
  .lv-cards { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  .lv-card { position:relative; background:#171724; border:1px solid #33334d; border-radius:12px;
    padding:14px 13px; cursor:pointer; transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:4px; text-align:left; color:inherit; font:inherit; }
  .lv-card:hover { transform:translateY(-3px); border-color:#ffd700; box-shadow:0 10px 24px rgba(255,215,0,.16); }
  .lv-card:active { transform:translateY(-1px); }
  .lv-card .ico { font-size:26px; line-height:1.1; }
  .lv-card .nm { font-size:14px; font-weight:900; color:#fff; letter-spacing:.5px; }
  .lv-card .ds { font-size:12px; color:#a9b0c2; line-height:1.5; }
  .lv-card .own { margin-top:auto; padding-top:8px; font-size:11px; color:#7f8698; }
  .lv-card .own b { color:#ffd700; }
  @media (max-width:760px) {
    .lv-cards { grid-template-columns:1fr; gap:9px; }
    .lv-panel { padding:14px; border-radius:12px; }
    .lv-title { font-size:17px; }
    .lv-card { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:10px; row-gap:2px; align-items:center; }
    .lv-card .ico { grid-row:1 / span 3; font-size:22px; }
    .lv-card .nm, .lv-card .ds, .lv-card .own { grid-column:2; }
    .lv-card .own { padding-top:2px; }
  }
  .chip { font-size:11px; font-weight:700; padding:0 7px; border-radius:9px; background:#2c2c47; color:#c3c3da; white-space:nowrap; line-height:1.6; }
  .chip.teal { background:#0f3a38; color:#4ecdc4; }
  .chip.gold { background:#453609; color:#ffd700; }
  .chip.green { background:#20380f; color:#8fe28a; }
  #stats { flex: 1 1 auto; min-height: 0; overflow-y: auto; display:flex; flex-direction:column; gap:6px; }
  #footBar { flex-shrink:0; }
  /* 竖屏：把「开始行动」按钮放到六维图上方（横屏时按钮仍在底部 #controls） */
  #actionSlot { display: none; }
  body.layout-v #actionSlot { display: block; flex: 0 0 auto; }
  body.layout-v #actionSlot .start-btn { width: 100%; }
  #controls { flex-shrink: 0; display:flex; flex-direction:column; gap:8px; min-height: 90px; }
  #controls:empty { min-height: 0; }
  /* =========================================================================
   * 抽屉体系（ISSUE-20261028-09 G）
   * 设计语言：方形 = 信息 · 圆形 = 交互（仅手机）· 浮层 = 从右侧滑入的侧边栏。
   * 旧的 #logPanel「可拖动悬浮窗」整体废除 —— 不允许凭空悬浮，也没有拖动位置记忆。
   * z-index 一律收敛成变量，禁止各处硬编码（--z-corner 是地图角标专用：30，必须低于单位层 40）。
   * ========================================================================= */
  :root { --z-corner: 30; --z-mask: 1100; --z-drawer: 1101; --z-vpad: 1002; }
  /* 地图角标（ISSUE-20261029-21 · B 方案「叠层」；20261029-36 增角色面板）：
     ⚙ 设置 → 棋盘右上格；👤 账号与排行 → 棋盘左上格；♟️ 角色面板 → 棋盘右下格。尺寸 = 恰好一个格子（var(--cell)），
     随格子缩放；两者共用同一套样式（大小 / 圆角 / 配色 / 高亮态 / aria）。
     --corner-x / --corner-y 由 updateCellSize() 算出：#board 在 #boardWrap 里居中，
     四周可能各剩几像素，角标要贴的是「棋盘」的角而不是容器的角。
     ★ z-index 必须低于 #unitLayer(40)，且单位层本身 pointer-events:none —— 站在角落的
       敌人绘制在角标之上，血条 / 词缀 / 意图不会被盖住（本号 §B 强制处理 1）。
     ★ 代价（人类明确接受）：这两格点不到、也走不上去；攻击 / 技能 / 闪避都是点路径节点，
       所以角落里的敌人照样能打（§B 强制处理 3）。 */
  #setOpenBtn, #lobbyOpenBtn, #charOpenBtn, #cornerExtra {
    position: absolute; top: var(--corner-y); z-index: var(--z-corner);
    display: flex; width: var(--cell); height: var(--cell);
    align-items: center; justify-content: center; padding: 0;
    /* ISSUE-20261029-44 第1项：与「开始行动」(.start-btn) 同款绿色胶囊 */
    background: linear-gradient(135deg, #4ecdc4, #2ecc71); color: #fff;
    border: 1px solid rgba(255,255,255,.28); border-radius: 3px;
    font-size: calc(var(--cell) * 0.5); line-height: 1;
    cursor: pointer; touch-action: manipulation; font-family: inherit;
    box-shadow: 0 2px 8px rgba(46,204,113,.35), inset 0 0 0 1px rgba(0,0,0,.12);
    transition: filter .15s, box-shadow .15s, transform .12s;
  }
  #setOpenBtn { right: var(--corner-x); }
  #lobbyOpenBtn { left: var(--corner-x); }
  /* ★ 角色面板按钮：地图右下格（ISSUE-20261029-36） */
  #charOpenBtn { top: auto; bottom: var(--corner-y); right: var(--corner-x); }
  /* ★ ISSUE-20261029-44 第1项：第 4 角标（地图左下格），先留空占位，绿色，不接功能 */
  #cornerExtra { top: auto; bottom: var(--corner-y); left: var(--corner-x); pointer-events: none; cursor: default; }
  #setOpenBtn:hover, #lobbyOpenBtn:hover, #charOpenBtn:hover { filter: brightness(1.08); }
  #setOpenBtn:active, #lobbyOpenBtn:active, #charOpenBtn:active { transform: scale(.92); }
  /* ★ ISSUE-20261029-44 第3项：打开面板时角标浮到面板之上（z-index > --z-drawer），
     图标变 ✕（drawerSyncChrome），再按一下关闭；不再使用面板内的独立关闭按钮。 */
  #setOpenBtn.on, #lobbyOpenBtn.on, #charOpenBtn.on {
    z-index: calc(var(--z-drawer) + 1);
    box-shadow: 0 0 0 2px #fff inset, 0 2px 8px rgba(46,204,113,.5);
  }
  /* 直开 game.html（无外壳）时 ♟ 由 chrome.js 置 hidden，不留死按钮 */
  #lobbyOpenBtn[hidden] { display: none; }
  /* 遮罩：全屏半透明，抽屉本体 z-index 更高所以露在上面 */
  #drawerMask {
    position: fixed; inset: 0; z-index: var(--z-mask);
    background: rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: opacity .22s ease-out;
  }
  #drawerMask.on { opacity: 1; pointer-events: auto; }
  /* 抽屉本体：统一从右侧滑入 220ms ease-out，宽度 min(360px,86vw) */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: var(--z-drawer);
    width: min(360px, 86vw); display: flex; flex-direction: column;
    background: #15151f; border-left: 1px solid #33334f;
    box-shadow: -12px 0 32px rgba(0,0,0,.5);
    transform: translateX(100%); transition: transform .22s ease-out;
    will-change: transform; overflow: hidden;
  }
  .drawer.on { transform: translateX(0); }
  .drawer-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 10px 10px 12px; border-bottom: 1px solid rgba(255,255,255,.07);
    background: #1b1b2a;
  }
  .drawer-title { font-size: 13px; font-weight: 900; color: #cfe6ff; letter-spacing: 1px; white-space: nowrap; }
  .drawer-x {
    flex: 0 0 auto; margin-left: auto; width: 30px; height: 30px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: #2c2c47; color: #cfe6ff; border: 1px solid #44445f; border-radius: 7px;
    font-size: 14px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .drawer-x:active { transform: scale(.94); }
  /* ★ 设置面板专用关闭按钮（2026-10-29 人类 01:42 指令）：
     「删掉面板里那个小 ✕，改成和 ⚙ 入口按钮同位置、同尺寸的关闭按钮，再按一下关闭，标题挪到顶部右侧」。
     尺寸/圆角/配色/边框全部照抄 #setOpenBtn（var(--cell)），位置也用同一套 --corner-x / --corner-y，
     所以抽屉滑进来时，视觉上就是「棋盘右上格那个 ⚙ 原地变成了 ✕」，点它即收起（.drawer 是 fixed，
     内部绝对定位的 top/right 与屏幕坐标同源）。
     属性/升级两个抽屉**不动**：它们的入口不在棋盘角上，没有「同一个位置」可对齐。 */
  /* ISSUE-20261029-44 第3项：设置面板内独立关闭按钮已删除，
     改由棋盘右上格的 ⚙ 角标本体（.on 时浮到面板上、变 ✕）关闭。 */
  /* =========================================================================
   * ★ 设置面板改为「覆盖棋盘格」（ISSUE-20261029-29，人类 2026-10-29 04:42）
   *   「设置按钮点开之后，弹窗改成覆盖棋盘格，相当于地图变成了显示设置的面板」。
   * 旧行为：从屏幕右侧滑入的 360px 宽抽屉，地图还露在左边。
   * 新行为：面板直接盖在棋盘那块正方形上（--board-* 由 JS 按 #board 的实时矩形写入），
   *   视觉上就是「地图原地变成了设置面板」，关掉后地图原样露出来。
   * ★ 显隐机制必须换掉：原 .drawer 靠 translateX(100%) 平移到屏幕外收起，
   *   而现在面板左边缘在棋盘位置，向右平移 100% 会正好盖住右侧栏 —— 收起=盖住别的东西。
   *   所以这里改用 opacity + visibility 淡入淡出（ID 选择器优先级高于 .drawer.on，覆盖安全）。
   * ★ 关闭按钮也从「对齐屏幕上的棋盘角」改成「对齐面板自己的右上角」：
   *   面板现在就是棋盘那块，top/right 归零即与 ⚙ 原位重合。
   * ========================================================================= */
  #drawerSettings {
    top: var(--board-top, 0); left: var(--board-left, 0);
    right: auto; bottom: auto;
    width: var(--board-w, min(360px, 86vw));
    height: var(--board-h, 100%);
    max-width: none; border-left: 1px solid #33334f; border-radius: 0; box-shadow: none;
    opacity: 0; visibility: hidden; transform: scale(.985);
    transition: opacity .18s ease-out, transform .18s ease-out, visibility .18s;
  }
  #drawerSettings.on { opacity: 1; visibility: visible; transform: none; }
  /* ISSUE-20261029-44：.drawer-corner-x 已移除（见上） */
  /* =========================================================================
   * ★ 角色面板弹窗（ISSUE-20261029-36）：与设置面板同款「覆盖棋盘格」机制。
   * 正方形（9×9 棋盘 = 正方形），视觉上就是「地图原地变成角色面板」。
   * 显隐同样用 opacity + visibility（ID 选择器优先级高于 .drawer.on，覆盖平移）。
   * 内容：顶部 = 名字；名字下 = 血条；左下 = 六维图；右下 = 空出一栏。无属性按钮。
   * ========================================================================= */
  #drawerChar {
    top: var(--board-top, 0); left: var(--board-left, 0);
    right: auto; bottom: auto;
    width: var(--board-w, min(360px, 86vw));
    height: var(--board-h, 100%);
    max-width: none; border-left: 1px solid #33334f; border-radius: 0; box-shadow: none;
    opacity: 0; visibility: hidden; transform: scale(.985);
    transition: opacity .18s ease-out, transform .18s ease-out, visibility .18s;
  }
  #drawerChar.on { opacity: 1; visibility: visible; transform: none; }
  /* ✕ 已删除（ISSUE-20261029-42）：点面板外部或 Esc 关闭 */
  /* 角色面板内部：上 = 角色信息（与 HUD 同源）／下 = 左六维 · 右 BUFF 池 */
  .char-body { gap: 10px; padding: 10px; }
  .char-top { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px;
    padding: 8px 10px 8px 8px; border-radius: 10px;
    background: linear-gradient(135deg,#26263f,#1c1c2d); border: 1px solid #33334f; }
  .char-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: stretch; flex: 1 1 auto; min-height: 0; }
  .char-radar { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0; min-height: 0; }
  .char-radar canvas { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 1 / 1; touch-action: manipulation; }
  .char-alloc { font-size: 11px; font-weight: 800; color: #ffd700; text-align: center; min-height: 14px; line-height: 14px; }
  /* 右下：升级 BUFF 奖励池（层数常驻可见） */
  .char-buffs { display: flex; flex-direction: column; gap: 5px; min-width: 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .char-buffs-title { font-size: 11px; font-weight: 900; color: #8a8aa5; letter-spacing: 1px; flex: 0 0 auto; }
  .char-buff { display: flex; align-items: center; gap: 6px; padding: 4px 7px; border-radius: 6px;
    background: #20202f; box-shadow: inset 0 0 0 1px #33334d; flex: 0 0 auto; }
  .char-buff .ico { font-size: 15px; line-height: 1; flex: 0 0 auto; }
  .char-buff .nm { flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 800; color: #cdd3e2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-buff .ct { flex: 0 0 auto; font-size: 12px; font-weight: 900; color: #ffd700; }
  .char-buffs-empty { padding: 10px 8px; border-radius: 6px; border: 1px dashed #33334d;
    font-size: 11.5px; color: #6f6f8a; text-align: center; }
  /* 标题靠右：右侧要给那个格子大小的关闭按钮让出位置（不然会压在标题上） */
  .drawer-head.head-end { justify-content: flex-end; padding-right: calc(var(--corner-x) + var(--cell) + 8px); }
  .drawer-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  /* 二层（属性说明卡）：在同一个抽屉容器内再滑一层，不新开浮层 */
  .drawer-layer {
    position: absolute; inset: 0; z-index: 2; background: #15151f;
    display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform .2s ease-out;
  }
  .drawer-layer.on { transform: translateX(0); }
  /* 「+1」加点：方形按钮（方形 = 信息块里的操作），不用圆形 */
  .ab-plus { padding: 6px 14px; font-size: 14px; font-weight: 900; border-radius: 6px;
    background: #ffd166; color: #3a2a00; border: 0; cursor: pointer; font-family: inherit; }
  .ab-plus:disabled { background: #3a3a4d; color: #7e7e97; cursor: not-allowed; }
  .ab-info-name { font-size: 15px; font-weight: 900; color: #4ecdc4; letter-spacing: 1px; }
  .ab-info-val { font-size: 12px; color: #c3c3da; }
  .ab-info-val b { color: #ffd700; font-size: 14px; }
  .ab-info-desc { font-size: 12.5px; line-height: 1.65; color: #d5d5e6; }
  .ab-info-desc code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    background: #232338; color: #9fe6ff; padding: 1px 5px; border-radius: 4px; }
  .ab-back { align-self: flex-start; padding: 5px 12px; font-size: 12px; font-weight: 700;
    background: #2c2c47; color: #cfe6ff; border: 1px solid #44445f; border-radius: 6px;
    cursor: pointer; font-family: inherit; }
  /* 属性抽屉里的雷达图 + 剩余点数行 */
  #statsDrawerRadar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #abilityPointsRow { font-size: 12px; color: #ffd700; font-weight: 800; text-align: center; min-height: 16px; }
  /* 六维图入口（方形信息块按钮） */
  #statsOpenBtn { flex: 0 0 auto; width: 100%; padding: 6px 8px; font-size: 12px; font-weight: 800;
    background: #232338; color: #cfe6ff; border: 1px solid #3a3a55; border-radius: 7px;
    cursor: pointer; font-family: inherit; touch-action: manipulation; }
  #statsOpenBtn:active { transform: scale(.97); }
  #statsOpenBtn.on { color: #ffd700; border-color: #6b5a1f; }
  body.layout-v #statsOpenBtn { max-width: 760px; margin: 0 auto; }
  /* 升级奖励在抽屉里：三选一改竖排（360px 宽放不下三列） */
  .drawer .lv-cards { grid-template-columns: 1fr; gap: 9px; }
  .drawer .lv-card { display: grid; grid-template-columns: auto minmax(0,1fr); column-gap: 10px; row-gap: 2px; align-items: center; }
  .drawer .lv-card .ico { grid-row: 1 / span 3; font-size: 22px; }

  /* ---- 布局模式：layout-h 地图左/UI右（桌面默认）；layout-v 地图上/UI下（竖版） ---- */
  body.layout-v #game { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
  /* 竖版：宽度撑满，高度由 updateCellSize() 按「宽度 vs 剩余高度」的短边写死（正方形）；

  body.layout-v #boardWrap { width: 100%; flex: 0 0 auto; min-height: 96px; align-self: center; }

     「开始行动」要落在拇指区（就在方向键上方），不能留在侧栏顶部够不着。 */
  body.layout-v #sidebar { display: flex; flex-direction: column; }
  body.layout-v #statsOpenBtn{ order: 2; }

  /* 竖版中间的可上下拖动分隔条（横线 + 横胶囊），与横版竖线呼应 */

  body.layout-v #dragHandle { display: none; }
  #logBar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; font-size: 12px; font-weight: 800; color: #9a9ab5; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,.06); user-select: none; touch-action: none; }

  #setVer { flex: 1 1 auto; min-width: 0; font-size: 10px; font-weight: 700; letter-spacing: .3px;

  #logBar button { padding: 2px 6px; font-size: 12px; line-height: 1.1; background: #2c2c47; color: #cfe6ff; border: 1px solid #44445f; border-radius: 5px; cursor: pointer; touch-action: manipulation; }

   *   左下方向键，右下 等待/攻击/技能」。
   *   旧版是「方向键 + 三键」平铺在 #sidebar 底部（文档流），「开始行动」另找槽位；

   *     ① 顶部 = 开始行动（整行宽，拇指最容易够到的第一排）

   *   面板 z-index(--z-vpad:1002) 低于抽屉遮罩(--z-mask:1100) —— 抽屉一开它自动被盖住，
   *   不会出现在「设置面板之上还能点棋盘」的荒唐状态。
   *   形状规则不变：圆形 = 交互，胶囊 = 特殊动作（开始行动）。
   * ========================================================================= */
  #vpadHost { display: none; }
  /* ★ ISSUE-20261029-31：长按虚拟按键会选中文字、弹出「拷贝 / 全选」菜单。
   * touch-action:none 只管「手势」（滚动 / 缩放），**管不住文本选择** ——
   * 必须再补 user-select:none（禁拖蓝）与 -webkit-touch-callout:none（禁 iOS 长按菜单）。
   * 作用域取「面板整体 + 所有子元素」：注入进 .vpad-top 的「开始行动」不在 .vbtn 里，
   * 只写 .vbtn 会漏掉它，只写面板又漏不掉缝隙里的残留选区。 */
  #vpadHost, #vpadHost * {
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #vpadHost.on {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-vpad);
    display: flex; flex-direction: column; gap: 6px;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: rgba(17,17,32,.96);
    border-top: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 -10px 26px rgba(0,0,0,.5);
  }
  /* 顶行：开始行动（renderControls 注入 .start-btn） */
  .vpad-top { display: flex; flex: 0 0 auto; }
  .vpad-top .start-btn { flex: 1 1 auto; width: 100%; }
  .vpad-top:empty { display: none; }
  /* 面板脱离文档流，用 --vpad-h（JS 实测写入）给 #game 补一圈底部留白。
     boardAvailSize() 算的是 clientHeight − padding，棋盘因此自动缩小让位，
     不需要在 JS 里再减一次高度。 */
  body.vpad-on #game { padding-bottom: calc(var(--vpad-h, 0px) + 8px); }
  /* 底行：左方向键 / 右三键 */
  .vpad-bot { display: flex; flex: 0 0 auto; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .vpad-dir { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); gap: 5px; }
  .vpad-dir .vbtn:nth-child(1) { grid-column: 2; grid-row: 1; }
  .vpad-dir .vbtn:nth-child(2) { grid-column: 1; grid-row: 2; }
  .vpad-dir .vbtn:nth-child(3) { grid-column: 2; grid-row: 2; }
  .vpad-dir .vbtn:nth-child(4) { grid-column: 3; grid-row: 2; }
  .vpad-act { display: flex; gap: 8px; align-items: flex-end; }
  .vact-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .vbtn-reset { width: 38px; height: 38px; font-size: 18px; background: rgba(120,58,58,.92); border: 1px solid #6b3a3a; }
  .vbtn-reset:active { transform: scale(.92); background: rgba(150,70,70,.96); }
  .vbtn { position: relative; width: 46px; height: 46px; padding: 0; border-radius: 50%;
    border: 1px solid #44445f; background: rgba(38,38,60,.94); color: #dbe6ff;
    font-size: 15px; font-weight: 900; line-height: 1; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;

    box-shadow: 0 2px 10px rgba(0,0,0,.45); }
  .vbtn:active { transform: scale(.92); background: rgba(62,62,96,.96); }
  .vbtn:disabled { opacity: .38; pointer-events: none; }
  .vbtn .vnum { font-size: 10px; font-weight: 900; color: #9fe6ff; line-height: 1; }
  .vbtn .vlab { font-size: 9px; font-weight: 700; color: #8f95a8; line-height: 1; }
  /* 攻击键上「×N」角标 */
  .vbtn .vbadge { position: absolute; top: -2px; right: -2px; min-width: 14px; height: 14px;
    padding: 0 3px; border-radius: 7px; background: #c0392b; color: #fff;
    font-size: 9px; font-weight: 900; line-height: 14px; text-align: center; }

  /* =========================================================================

<script>
/* ---- P0.1-1 冻结基线：版本号 ----
 * 用途：排障与回滚定位 + 让玩家确认「是不是最新版」。
 * 查法：控制台 `window.__ARK_VERSION__`，或点左上角 ⚙ 展开「设置」，标题栏「设置」右侧即可见。
 *
 * 字段说明：
 *   version  —— 语义版本（跟随 README §5 阶段里程碑）
 *   build    —— 构建号 `MMDDHHmm`（月日时分，如 10282132 = 10月28日 21:32）；★ 每次发版必须同时改这里和 DLC index.html 的 BUILD，
 *               否则 iframe 的 `game.html?v=BUILD` 不会刷新缓存，玩家会继续看旧版。
 *   commit   —— ★ 冻结基线提交（9a4137c），不是当前提交：git 无法自引用自身 sha。
 *               P0.1-3 构建脚本上线后，改为构建时注入真实 sha。
 *   builtAt  —— 基线冻结时间 */
window.__ARK_VERSION__ = {
  version: '0.1.0-prototype',
  build:   '10292300',
  commit:  '3ea8c30f7f62bb54625efe0016e9a56bcc76a86b',
  builtAt: '2026-10-29T15:03:20Z'
};
(function () {
  var v = window.__ARK_VERSION__, el = document.getElementById('setVer');
  if (!el) return;
  // 标题栏空间有限：只显示日期构建号；完整信息放 title，鼠标悬停/长按可看
  el.textContent = 'v' + v.build;
  el.title = 'v' + v.version + '\n构建 ' + v.build + '\n基线 ' + v.commit.slice(0, 7) + ' (' + v.builtAt.slice(0, 10) + ')';
})();

/* =========================================================================
 * 方舟战棋 · 单文件版（无构建、无依赖，双击即可玩）
 *

/* 每个角色只有一种伤害方式，由攻击节点类型决定：
 *   近战 → 风笛、泥岩（用力量，面板显示「近战伤害」）
 *   远程 → 华法琳、阿米娅（用智力，面板显示「远程伤害」）
 * 因此 UI 只显示与角色对应的那一个伤害数值。
 * 注：远程角色被贴身时的趁乱打击固定 1 点保底伤害（不吃暴击/倍率），不读取近战伤害面板。
 */
function charAttackType(id) {
  const c = CHARACTERS[id];
  if (!c) return 'melee';
  return c.attackType || (c.profRanged ? 'ranged' : 'melee');
}
function isRangedChar(id) { return charAttackType(id) === 'ranged'; }
function charDmgLabel(id) { return isRangedChar(id) ? '远程伤害' : '近战伤害'; }

/* ISSUE-20261028-19：动态角色（预备干员）── 熟练与攻击类型由六维现算。
 *
 * 为什么不直接改 charAttackType()：它是纯函数、签名只有 id，读的是静态对象。
 * 硬改成「读当前 playerStats」会让 6 个消费点在选角 / 联机 / 结算不同相位下读到不同的东西。
 * 所以保留它原样给四个静态角色用，另开一个**可传六维**的版本，由调用方决定拿哪份数据。
 * 规则只有一句：int > str → 远程；否则（含相等）→ 近战。严格大于，不为相等单开分支。 */
function charIsDynamic(id) {
  const c = CHARACTERS[id];
  return !!(c && c.dynamicProf);
}
function dynamicAttackTypeOf(abilities) {
  return (abilities && abilities.int > abilities.str) ? 'ranged' : 'melee';
}
function charAttackTypeOf(id, abilities) {
  if (charIsDynamic(id)) {
    /* 动态角色必须给六维：缺省时退回静态兜底（attackType 写的是 melee，即「不加点」的结果） */
    return dynamicAttackTypeOf(abilities || CHARACTERS[id].abilities);
  }
  return charAttackType(id);
}
function isRangedCharOf(id, abilities) { return charAttackTypeOf(id, abilities) === 'ranged'; }
function charDmgLabelOf(id, abilities) {
  return isRangedCharOf(id, abilities) ? '远程伤害' : '近战伤害';
}

/* 击杀回报枚举 —— 结算在 src/rules/squad.js#squadOnKill，这里只描述。 */

/* src: src/data/enemies.js */
/* P0.1-4 机械拆分：从 game.html（20261028b 基线）第 596-671 行原样搬移（敌人类型 / L1 基础面板 / 成长推演（computeEnemyGrowth））。
 * 纯移动未改逻辑；顺序由 build/manifest.json 保证与拆分前一致。 */
/* ★ ISSUE-20261028-10-B：'colossus' 追加在**最末尾**。
 * 它是 Boss，不进 ENEMY_UNLOCK（pickEnemyType 永远不会抽到它），只由 initLevel 按关卡注入。
 * 追加在末尾的理由同下面 21 行的注释：computeEnemyGrowth 用 indexOf 派生种子，
 * 只有追加才不会动前五种的成长序列。 */
const ENEMY_TYPES = ['skeleton', 'ghost', 'alien', 'shield', 'bomber', 'colossus'];

/* =========================================================
 * 敌人基础面板（L1 起点，实际数值由 computeEnemyGrowth 推演，ISSUE-20261028-03）
 *
 * ★ ISSUE-20261028-04：伤害改为**骰子**。
 *   旧口径 `Math.max(1, 1 + abilityMod(力))` 把三类型的伤害全截平成 1
 *   （骷髅力10→0、幽灵力8→-1、外星的远程智10→0，全被 max(1,…) 兜底），
 *   玩家挨打完全分不出是谁打的。现在按类型给不同骰子：
 *     骷髅 1d2（1–2，期望 1.5，硬碰硬最疼）
 *     幽灵 1d1（恒 1，最快但最轻）
 *     外星 远程 1d2（期望 1.5），近战 1
 *   骰子仍走全局 rng()，与既有随机序列同一来源。
 *
 *   ⚠️ 强度校准记录：首版用 1d3/1d2/1d3，实测 40 局通关层数 1.10 → 0.35（-68%），
 *   远超 issue 的 40% 回调线（单关承伤从每回合 1.09 涨到 2.0，玩家 HP10 撑不过 5 回合）。
 *   故整体下调一档，保持「骷髅 > 幽灵」的感知差（1d2 vs 1d1）而不破坏前期可玩性。
 *
 * ★ 新类型追加在数组末尾：computeEnemyGrowth 用 ENEMY_TYPES.indexOf(type) 派生种子，
 *   追加不影响前三种的 typeIdx（既有存档/种子下的成长序列保持一致）。
 * ========================================================= */
const ENEMY_STATS = {
  skeleton: {
    name: '骷髅', icon: '💀',
    // 力10 智6 敏6 感6 魅3 体10
    abilities: { str: 10, int: 6, dex: 6, wis: 6, cha: 3, con: 10 },
    prof: 1,
    dice: { melee: [1, 2] },
  },
  ghost: {
    name: '幽灵', icon: '👻',
    // 力8 智8 敏10 感8 魅6 体6
    abilities: { str: 8, int: 8, dex: 10, wis: 8, cha: 6, con: 6 },
    prof: 2,
    dice: { melee: [1, 1] },
  },
  alien: {
    name: '外星人', icon: '👾',
    // 力0 智10 敏8 感8 魅6 体8
    abilities: { str: 0, int: 10, dex: 8, wis: 8, cha: 6, con: 8 },
    prof: 2,
    dice: { melee: [1, 1], ranged: [1, 2] },
  },
  /* 盾卫（L8+）：慢、硬、不疼。AC 由 (敏4+体18)/4 → 5+5 = 10 起步，
   * 是唯一 AC 明显高于基础三类的类型，逼玩家绕后或用远程磨。 */
  shield: {
    name: '盾卫', icon: '🛡️',
    // 力10 智4 敏6 感8 魅4 体18
    abilities: { str: 10, int: 4, dex: 6, wis: 8, cha: 4, con: 18 },
    prof: 1,
    dice: { melee: [1, 2] },
  },
  /* 自爆虫（L12+）：极脆、极快，贴到身边就自爆（固定 3 伤害，不吃命中检定）。
   * 逼玩家拉开距离，而不是像对其它类型那样站着换血。 */
  bomber: {
    name: '自爆虫', icon: '💣',
    // 力6 智2 敏12 感6 魅2 体4
    abilities: { str: 6, int: 2, dex: 12, wis: 6, cha: 2, con: 4 },
    prof: 1,
    dice: { melee: [1, 1] },
    explode: 4,
  },
  /* =========================================================
   * ★ ISSUE-20261028-10-B：Boss「圆岩巨像」
   *
   * 设计定位：**不是「血厚的普通怪」**，而是逼玩家改变站位的机制怪。
   *   ① 移动时把挡路的玩家沿自己朝向推开 1 格，并让玩家眩晕 1 回合 → 「别站在它正前方」
   *   ② 每 2 回合在玩家身边落一块「粗圆岩」（= 动态墙）→ 棋盘逐渐被切碎，走位空间变小
   *   ③ 它推自己的石头会把石头撞碎，自己掉 1 HP → 玩家可以「引导它撞石头」白嫖伤害
   *
   * 数值口径：力 18（近战修正 +4）、体 24（HP 起点 24，每 3 关再涨）、敏 4（移动 2、AC 低）。
   * 刻意做成「慢、硬、一拳很疼」：玩家能跑，但跑不出它的推动范围。
   * ⚠️ 它只在第 10/20/30… 关登场（`isBossLevel`），且**替换该关最后一只普通敌人**，
   *   不额外增加单关敌人数 —— 否则第 10 关等于「6 普通 + 1 Boss」，难度会直接崩。
   * ========================================================= */
  colossus: {
    name: '圆岩巨像', icon: '🗿',
    // 力18 智2 敏4 感4 魅2 体24
    abilities: { str: 18, int: 2, dex: 4, wis: 4, cha: 2, con: 24 },
    prof: 2,
    dice: { melee: [1, 4] },
    boss: true,
  }
};

/* =========================================================
 * Boss 相关常量（ISSUE-20261028-10-B）
 * ========================================================= */
const BOSS_EVERY_N_LEVELS = 10;      // 第 10/20/30… 关各登场一次
const BOSS_TYPE = 'colossus';
const BOSS_INTENT_EXTRA_STEPS = 2;   // 意图预告额外多显示 2 步（让玩家预判推动方向）
const COLOSSUS_ROCK_EVERY = 2;       // 每 2 回合落一块粗圆岩
const COLOSSUS_ROCK_SELF_DAMAGE = 1; // 推动撞碎粗圆岩时 Boss 自己掉的 HP
/* ★ 眩晕取值 2 而不是 1：
 * 玩家被推发生在「敌人移动阶段」，紧接着 endRound 就会递减一次；
 * 若设 1 → 当回合就被减到 0 → 下一回合照常行动 = 完全没眩晕。
 * 设 2 → 本回合末减到 1（下一回合不能动），再一回合末减到 0（恢复）。
 * 与敌人的 `stunTurns = 2` 约定一致（见 templates 里 bomber/敌人眩晕注释）。 */
const COLOSSUS_PUSH_STUN = 2;

/* 本关是不是 Boss 关（第 10/20/30… 关） */
function isBossLevel(level) {
  return level > 0 && level % BOSS_EVERY_N_LEVELS === 0;
}

/* =========================================================
 * 类型解锁与权重（ISSUE-20261028-04）
 * 旧口径是 `ENEMY_TYPES[randInt(3)]` 均匀随机 → 第 1 关就有 33% 外星人（远程狙击），
 * 新手关挨狙且毫无节奏。现在按关卡分批解锁，前期只有近战骷髅。
 * ========================================================= */
const ENEMY_UNLOCK = [
  { from: 1,  type: 'skeleton', w: 4 },
  { from: 3,  type: 'ghost',    w: 3 },
  { from: 5,  type: 'alien',    w: 2 },
  { from: 8,  type: 'shield',   w: 2 },
  { from: 12, type: 'bomber',   w: 2 },
];

/* 按本关可用类型 + 权重抽一个。仍走全局 rng()，与旧版同一随机来源。 */
function pickEnemyType(level) {
  const pool = ENEMY_UNLOCK.filter(u => level >= u.from);
  if (pool.length === 0) return 'skeleton';
  let total = 0;
  for (const u of pool) total += u.w;
  let r = randInt(total);
  for (const u of pool) {
    if (r < u.w) return u.type;
    r -= u.w;
  }
  return pool[0].type;
}

/* 伤害骰：dice 形如 [n, sides]。未定义时退回面板常量的兜底。
 * 狂暴词缀的 +1 在掷骰之后叠加（ISSUE-20261028-05），保证「骰子本体不变、只是更疼」。 */
function rollEnemyDamage(e, kind) {
  const dd = kind === 'ranged' ? e.rangedDice : e.meleeDice;
  if (!dd) return (kind === 'ranged' ? e.rangedDmg : e.meleeDmg) + enemyDamageBonus(e);
  let total = 0;
  for (let i = 0; i < dd.n; i++) total += 1 + randInt(dd.s);
  return total + enemyDamageBonus(e);
}

/* 骰子期望值（面板展示 / AI 估算用）：n × (sides+1) / 2，四舍五入且至少 1。 */
function diceAvg(dd) {
  if (!dd) return 1;
  return Math.max(1, Math.round(dd.n * (dd.s + 1) / 2));
}
function diceLabel(dd) {
  if (!dd) return '';
  return `${dd.n}d${dd.s}`;
}

/* =========================================================
 * ★ 敌人成长推演（ISSUE-20261028-03）
 * 敌人每关都会整批重建（initLevel 里 enemies = []），没有跨关的个体身份，
 * 所以「第 6 关的敌人提了 6 次属性」不能靠运行时记忆，只能在生成时从 L1 推演到第 L 关。
 *
 * 随机源必须与全局 rng() 隔离：全局 rng() 有滚动状态，用它算成长会导致
 * 每次重绘敌人面板都换一批数值（本项目的硬要求是「意图可预判」）。
 * 因此按「本局种子 + 关卡 + 实例下标 + 类型」派生一颗固定种子。
 * ========================================================= */
function enemyGrowthRng(seed) {
  let a = (seed >>> 0) || 0x9E3779B9;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 生成第 level 关的第 idx 个敌人时，从 L1 逐关推演到 level：
 *   每关 1) 在当前「最高的 4 项」里随机 +1（排除上一次选的那项，相邻两次不重复）
 *        2) 每 3 关升 1 级 → HP 加成 += max(0, 体质调整值)（与角色升级算法同构）
 * 返回成长后的六维、HP 上限与敌人等级。 */
function computeEnemyGrowth(type, level, idx, runSeed) {
  const base = ENEMY_STATS[type].abilities;
  const a = { str: base.str, dex: base.dex, con: base.con, int: base.int, wis: base.wis, cha: base.cha };
  const typeIdx = Math.max(0, ENEMY_TYPES.indexOf(type));
  /* 种子**不含 level**：这样「第 L 关的第 i 个敌人」就是「第 1 关第 i 个敌人」连续成长 L 次的结果
   * （前缀稳定）。若把 level 混进种子，每次换关都会重掷一整条序列，同一只敌人前后不连贯。 */
  const rnd = enemyGrowthRng((((runSeed >>> 0) + idx * 977 + typeIdx * 7919) >>> 0));
  let hpBonus = 0;
  let lastKey = null;

  for (let lv = 1; lv <= level; lv++) {
    /* 1) 属性提升：候选池 = 当时最高的 4 项（并列按 ABILITY_ORDER 稳定排序），再排除上一次的选择 */
    const top4 = ABILITY_ORDER
      .filter(k => a[k] < ABILITY_CAP)
      .sort((x, y) => (a[y] - a[x]) || (ABILITY_ORDER.indexOf(x) - ABILITY_ORDER.indexOf(y)))
      .slice(0, 4)
      .filter(k => k !== lastKey);
    if (top4.length > 0) {
      const pick = top4[Math.floor(rnd() * top4.length)];
      a[pick] += 1;
      lastKey = pick;
    }
    /* 2) 每 3 关升级一次：HP 上限 += max(0, 体质调整值)，与角色 openLevelUp 完全同构 */
    if (lv % LEVELUP_EVERY_N_LEVELS === 0) hpBonus += Math.max(0, abilityMod(a.con));
  }
  return { abilities: a, maxHp: a.con + hpBonus, level: Math.floor(level / LEVELUP_EVERY_N_LEVELS), hpBonus };
}

/* =========================================================
 * ★ 词缀与精英（ISSUE-20261028-05）
 *
 * 目的：让第 13 关之后不再只是「同一件事数字变大」。词缀给敌人多一个**行为维度**，
 * 精英给单关一个**记忆点**。
 *
 * ★ 随机源：复用 enemyGrowthRng 工厂但换偏移量，**绝不用全局 rng()**
 *   （全局有滚动状态，用它会导致每次重绘面板词缀抖动，违反「意图可预判」）。
 *   种子含 level —— 与成长不同，这里不需要前缀稳定，只需要「同一 RUN_SEED 同一关一致」。
 *
 * ★ 首轮不做「分裂」词缀：它会在结算中途新增数组元素，破坏 enemyPathOrder 的落位顺序
 *   与 enemies[i].id 的稳定性（历史上「敌人永久罚站」的 bug 就源于落位顺序）。
 * ========================================================= */
const AFFIX_DEFS = {
  shield: { name: '护盾', short: '盾', icon: '🛡' },
  swift:  { name: '迅捷', short: '疾', icon: '💨' },
  frenzy: { name: '狂暴', short: '暴', icon: '🔥' },
  thorns: { name: '荆棘', short: '棘', icon: '🌵' },
};
const AFFIX_ORDER = ['shield', 'swift', 'frenzy', 'thorns'];
/* L5–L9 只放这两个（护盾/迅捷是"读得懂、不劝退"的），L10+ 再放开狂暴/荆棘 */
const AFFIX_POOL_EARLY = ['shield', 'swift'];
const AFFIX_POOL_LATE  = ['shield', 'swift', 'frenzy', 'thorns'];
const AFFIX_LATE_FROM_LEVEL = 10;
const AFFIX_CHANCE_EARLY = 0.30;
const AFFIX_CHANCE_LATE  = 0.45;

const ELITE_FROM_LEVEL = 5;      // L5 起每关至少 1 个精英
const ELITE_HP_MUL = 1.5;        // 精英 HP 上限 ×1.5（向上取整）
const ELITE_AFFIX_COUNT = 2;     // 精英必带 2 个词缀
const AFFIX_SEED_OFFSET = 104729;

/* 词缀/精英的专用随机工厂（与成长序列互不干扰） */
function affixRng(level, idx, runSeed, tag) {
  return enemyGrowthRng((((runSeed >>> 0) + level * 613 + idx * 3571 + tag * 8191 + AFFIX_SEED_OFFSET) >>> 0));
}

/* 本关精英是第几只（-1 = 本关没有精英）。确定性：同 RUN_SEED 同一关恒定。 */
function eliteIndexFor(level, count, runSeed) {
  if (level < ELITE_FROM_LEVEL || count <= 0) return -1;
  const r = affixRng(level, 0, runSeed, 1)();
  return Math.min(count - 1, Math.floor(r * count));
}

/* 生成第 level 关第 idx 只敌人的词缀方案：{ isElite, affixes[] } */
function rollEnemyAffixPlan(level, idx, count, runSeed) {
  const isElite = idx === eliteIndexFor(level, count, runSeed);
  const late = level >= AFFIX_LATE_FROM_LEVEL;
  const pool = (late ? AFFIX_POOL_LATE : AFFIX_POOL_EARLY).slice();
  const rnd = affixRng(level, idx, runSeed, 2);
  let want;
  if (isElite) want = ELITE_AFFIX_COUNT;
  else want = rnd() < (late ? AFFIX_CHANCE_LATE : AFFIX_CHANCE_EARLY) ? 1 : 0;
  want = Math.min(want, pool.length);
  const affixes = [];
  for (let i = 0; i < want; i++) affixes.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  return { isElite, affixes };
}

function enemyHasAffix(e, id) {
  return !!(e && e.affixes && e.affixes.indexOf(id) >= 0);
}
/* 狂暴：HP 严格低于一半时才生效（= 一半时还不生效，边界明确好测） */
function enemyIsFrenzied(e) {
  return enemyHasAffix(e, 'frenzy') && e.hp > 0 && e.hp * 2 < e.maxHp;
}
/* 实际移动力：基础 + 迅捷(+2) + 狂暴(+2)。AI 寻路与面板都读这个，别直接读 e.move。 */
function enemyMoveOf(e) {
  if (!e) return 1;
  let m = e.move || 1;
  if (enemyHasAffix(e, 'swift')) m += 2;
  if (enemyIsFrenzied(e)) m += 2;
  return m;
}
function enemyDamageBonus(e) {
  return enemyIsFrenzied(e) ? 1 : 0;
}

/* 词缀给玩家看的短标签，如「精英 🛡盾 💨疾」 */
function enemyAffixLabel(e) {
  if (!e || !e.affixes || e.affixes.length === 0) return '';
  return e.affixes.map(id => `${AFFIX_DEFS[id].icon}${AFFIX_DEFS[id].short}`).join(' ');
}

/* 玩家对敌人造成伤害的统一入口（护盾词缀在这里吃掉第一击）。
 * 返回实际扣掉的血量（0 = 被护盾完全吸收）。 */
function enemyTakeDamage(e, dmg) {
  if (!e || dmg <= 0) return 0;
  if (e.shieldLeft > 0) {
    e.shieldLeft -= 1;
    floatText(e.x, e.y, '护盾 -0', '#7fd1ff');
    ringFx(e.x, e.y, '#7fd1ff');
    log(`🛡 ${ENEMY_STATS[e.type].name}${e.id + 1} 的护盾吸收了 ${dmg} 点伤害，护盾破碎。`);
    refreshUnits();
    return 0;
  }
  e.hp -= dmg;
  return dmg;
}

/* 荆棘：被近战命中后反弹 1 点给玩家（被打死的不反弹）。
 * 返回 true 表示玩家因此阵亡。 */
function enemyThornsReflect(e) {
  if (!enemyHasAffix(e, 'thorns')) return false;
  if (!e.alive || e.hp <= 0) return false;          // 这一击已经打死它 → 不反弹
  if (!player || !player.alive) return false;
  const res = damagePlayer(1, '荆棘');
  if (res.dmg > 0) {
    log(`🌵 ${ENEMY_STATS[e.type].name}${e.id + 1} 的荆棘反弹 1 点伤害。`);
    floatText(player.x, player.y, '荆棘 -1', '#c77dff');
    updateStats();
  } else if (res.shielded) {
    log(`🌵 荆棘反弹被护盾抵消。`);
  }
  if (player.hp <= 0) { player.alive = false; refreshUnits(); endGame(); return true; }
  return false;
}

/* P0.1-4 拆分 · 20261028b 基线 730-777 行 · 升级与奖励池 buff / 统一受伤入口 */
/* =========================================================
 * ★ 升级与奖励池（buff）
 * 升级由经验驱动（ISSUE-20261028-10）：通关得经验，本关掉血越少经验越多，经验满即升级。
 * 升级时：HP 上限 + 体质加值、回满血，并从奖励池 3 选 1。
 * LEVELUP_EVERY_N_LEVELS 现在**只服务敌人成长**（enemies.js），玩家侧不再引用。
 * ========================================================= */
const LEVELUP_EVERY_N_LEVELS = 3;
let heroLevel = 1;
let playerShield = 0;                 // 药枚：护盾层数（抵消一次任意伤害）
let levelUpOpen = false;
let lastLevelUpConMod = 0;
/* ===== 玩家经验制（ISSUE-20261028-10） =====
 * xp            当前等级已累积的经验（升级时按阈值扣减）
 * pendingLevelUps 待结算的升级次数（通关时按 XP 一次算好，逐次弹奖励）
 *                旧变量 levelUpPending（布尔）已废弃：布尔装不下「一次连升 2 级」。
 * levelStartHp  本关开始时的血量（player.hp），失血口径的左端
 * levelActions  本关点了几次「开始行动」——**只用于日志**，不参与经验计算 */
let xp = 0;
let pendingLevelUps = 0;
let levelStartHp = 0;
let levelActions = 0;

/* 升到下一级所需经验（heroLevel 超出表长时按表尾 +100 递增） */
function xpThresholdForLevel(lv) {
  if (lv < XP_TABLE.length) return XP_TABLE[lv];
  return XP_TABLE[XP_TABLE.length - 1] + (lv - (XP_TABLE.length - 1)) * 100;
}
/* 该关「允许失血」的基准：按本关开始血量缩放，而不是 maxHp。
 * 挂 maxHp 会出现退化玩法：带 1 HP 进关 → 物理上掉不了血 → 每关都算零失血 → 永久满效率。 */
function xpDamageRef(startHp) {
  const raw = Math.round(startHp * XP_DMG_REF_RATIO);
  return Math.max(XP_DMG_REF_MIN, Math.min(XP_DMG_REF_MAX, raw));
}
/* 单关经验：hpLoss 取 0 下限（关内吃 ❤️ / 🩸 净回血时会算成负数，
 * 不夹会让 efficiency > ref，经验突破 24 上限，保底/上限两条算术保证同时失效）。 */
function computeLevelXp(startHp, endHp) {
  const hpLoss = Math.max(0, startHp - endHp);
  const ref = xpDamageRef(startHp);
  const eff = Math.max(0, Math.min(XP_EFF_CAP, ref - hpLoss));
  return { hpLoss, ref, eff, gain: XP_CLEAR_BASE + eff * XP_PER_STEP };
}
/* 通关时按经验排队升级次数（heroLevel 由 openLevelUp 逐次推进，这里只扣经验） */
function queueLevelUps() {
  let n = 0;
  while (n < XP_MAX_LEVELUPS_PER_CLEAR && xp >= xpThresholdForLevel(heroLevel + n)) {
    xp -= xpThresholdForLevel(heroLevel + n);
    n += 1;
  }
  pendingLevelUps = n;
  return n;
}
// buff 层数统计（同一 buff 可重复获得，效果累加）
let buffs = { kettle: 0, blade: 0, sass: 0, kit: 0, pill: 0, scout: 0 };

const BUFF_POOL = [
  { id: 'kettle', name: '热水壶', icon: '☕', desc: 'HP 上限 +2（并回复等量生命）' },
  { id: 'blade',  name: '锈蚀刀片', icon: '🗡️', desc: '近战伤害 +1' },
  { id: 'sass',   name: '香草沙士', icon: '🥤', desc: '获得技力时有 30% 概率额外获得 1 点技力' },
  { id: 'kit',    name: '急救药箱', icon: '🧰', desc: '每张地图必定额外出现一个恢复地块 ❤️' },
  { id: 'pill',   name: '药枚', icon: '💊', desc: '每关开始时获得 1 层护盾（抵消一次任意伤害）' },
  { id: 'scout',  name: '探测先锋', icon: '🔭', desc: '每回合动作上限 +1（可多放一次攻击/技能/闪避）' },
];
const BUFF_BY_ID = Object.fromEntries(BUFF_POOL.map(b => [b.id, b]));

/* 香草沙士：每次获得技力时 30% 额外 +1（返回额外点数） */
const SASS_CHANCE = 0.3;
function sassExtraSp() {
  return (buffs.sass > 0 && rng() < SASS_CHANCE) ? 1 : 0;
}
function buffMeleeBonus() { return buffs.blade; }
function buffHpBonus() { return buffs.kettle * 2; }

/* 统一的玩家受伤入口：有护盾（药枚）先消耗 1 层抵消整次伤害。
   返回 { dmg: 实际掉血, shielded: 是否被护盾抵消, immune: 调试无敌 } */
function damagePlayer(amount, label = '') {
  if (debugMode) return { dmg: 0, shielded: false, immune: true };
  if (!player || !player.alive) return { dmg: 0, shielded: false, immune: false };
  if (amount <= 0) return { dmg: 0, shielded: false, immune: false };
  if (playerShield > 0) {
    playerShield -= 1;
    floatText(player.x, player.y, '护盾抵消', '#ffffff');
    ringFx(player.x, player.y, '#ffffff');
    log(`🛡️ 护盾抵消了${label ? `「${label}」的` : ''}${amount} 点伤害（剩余 ${playerShield} 层）。`);
    updateStats();
    return { dmg: 0, shielded: true, immune: false };
  }
  player.hp = Math.max(0, player.hp - amount);
  return { dmg: amount, shielded: false, immune: false };
}

/* src: src/rules/sp.js */
/* P0.1-4 拆分 · 20261028b 基线 779-809 行 · 角色技力 / 冲锋补刀范围 / 攻击欲望 */
// ★ 泥岩技力系统
const FENCER_SP_MAX = 5;
let fencerSp = 0;

// ★ 风笛技力系统（重做后）：沿同方向连续 ≥2 步移动 → 该段长度即技力，
// 等待 / 转向都会断开一段。例：wdds 得 2 点（d 段 2 步），wwwd 得 3 点（w 段 3 步）。
// 上限 5，跨回合、跨关保留（全局保留）；满 5 后路径里的攻击节点变为「冲锋」。
const WHEELCHAIR_SP_MAX = 5;
/* 冲锋额度（ISSUE-20261028-01）：进入冲锋时算出的剩余移动步数 = 可冲锋格数 = 可攻击次数。
 * 被挡住停下时，剩余次数改为打「朝向前方 CHARGE_FINISH_RANGE 格」内的敌人，不浪费。 */
const CHARGE_FINISH_RANGE = 3;
let wheelchairSp = 0;

// ★ 华法琳技力系统：拾取血迹 → 技力 +1（上限 5），跨关继承。
// 满技力后「在起始点（路径第 0 步）放攻击节点」= 发动技能「不稳定血浆」：
// 消耗全部技力，本关内远程攻击必定命中 + 必定暴击 + 必定留血迹，但每次攻击后自身失去 1 HP。
// 血迹只由「远程攻击」产生（平时命中 50%、技能生效时必定）；趁乱打击不参与。
const VAMPIRE_SP_MAX = 5;
let vampireSp = 0;
let vampireSkillActive = false;

// ★ 敌人攻击欲望随回合增长：每 2 个回合 +1 感知等效（阶梯式）。
// 10 感知的敌人到第 20 回合累积 +10 → 等效 20 感知 = 欲望拉满（clamp 上限）。
const AGGRESSION_WIS_PER_TWO_ROUNDS = 1;
let battleRound = 1;

// ★ 敌人攻击欲望系数（调参用）：1.0 = 原始强度（wis/20）。
// 调低之后，敌人的预判目标点会更靠近「玩家当前位置」而不是路径末端，
// 也就是不再提前堵你最远的落点，进攻性明显变弱。
// 0.6 时：骷髅 6/20×0.6=0.18、幽灵/外星人 8/20×0.6=0.24。
const ENEMY_AGGRESSION_SCALE = 0.6;

/* src: src/rules/squad.js */
/* ISSUE-20261029-28 · 预备干员「增援召唤」规则层
 *
 * 一套最小可用的小队系统：
 *   技力（rookieSp）→ 满 5 → 技能节点发动 → 周围 8 格随机召唤 1 名成员
 *   成员每回合独立行动一次：BFS（与敌人同一套 bfsPathTo）到最近的敌人 → 途中一旦能打就停下打
 *
 * 三条硬约束（改之前先读）：
 *  1) 伤害必须走 enemyTakeDamage()，否则护盾词缀不生效；
 *  2) 击杀必须走 killEnemy()，否则精英掉落 ❤️ / 连杀记账会漏；
 *  3) 成员不是敌人、也不是玩家：不进 enemies 数组（否则被相杀结算），
 *     只放在 squadUnits 里，由 renderUnits 单独渲染一层。
 *
 * ★ ISSUE-20261029-32（人类 05:48 拍板）：上面第 3 条**放宽** ——
 *   「成员无敌」原本是我在 28 号自己拍的口径，人类现在指出「敌人似乎不会攻击召唤单位」，
 *   并要求敌人改用「距离最近的路径格」索敌。人类逐项确认：
 *     · 成员**能被敌人打死**（HP 归 0 → 消失，玩家彻底失去该成员）；
 *     · 敌人同时能打到玩家和成员时 → **谁近打谁，平手打玩家**；
 *     · 伤害来源全部打通：近战贴身 / 外星人远程 / 自爆虫自爆 / 敌人踩进成员格 / Boss 推动。
 *   所以成员从「无敌炮台」变成「有代价的召唤」：会吸引火力，也会真的死。
 *   本文件因此新增：squadTakeDamage / squadUnitAt / squadAliveUnits / squadPredictedNextCell。
 */
function rookieSpMax() { return ROOKIE_SP_MAX; }

/* 获得技力（唯一入口，香草沙士在这里生效） */
function gainRookieSp(n = 1) {
  if (selectedChar !== 'rookie') return 0;
  const before = rookieSp;
  if (before >= ROOKIE_SP_MAX) return 0;
  let gain = n;
  if (sassExtraSp()) { gain += 1; log('🥤 香草沙士：额外获得 1 点技力！'); }
  rookieSp = Math.min(ROOKIE_SP_MAX, before + gain);
  const real = rookieSp - before;
  if (real > 0) {
    if (before < ROOKIE_SP_MAX && rookieSp >= ROOKIE_SP_MAX) {
      log(`😶 预备干员技力已满（${ROOKIE_SP_MAX}/${ROOKIE_SP_MAX}）！「增援召唤」就绪：双击路径节点设置技能节点。`);
      if (player && player.alive) floatText(player.x, player.y, '召唤就绪！', '#ffd700');
    } else {
      log(`😶 预备干员技力 +${real}（${rookieSp}/${ROOKIE_SP_MAX}）`);
    }
    updateStats();
  }
  return real;
}

/* 小队成员六维 = 预备干员六维里最低的一项（人类原话：「数值六项都为预备干员属性最低的一项数值」） */
function squadAbilityScore() {
  const a = playerStats && playerStats.abilities;
  if (!a) return 8;
  return Math.min(a.str, a.dex, a.con, a.int, a.wis, a.cha);
}

/* 成员的派生数值：与玩家同一套公式（HP = con + 基础加成、AC = 5+⌊(敏+体)/4⌋、移动 = ⌊敏/2⌋），
 * 只是六维全部取同一个分数。熟练加值跟随角色等级，跟玩家同步，免得后期成员完全打不中。 */
function squadDerivedStats(score) {
  const abilities = { str: score, dex: score, con: score, int: score, wis: score, cha: score };
  return {
    abilities,
    maxHp: Math.max(1, score + BASE_HP_BONUS),
    ac: computeAC(abilities),
    move: Math.max(1, Math.floor(score / 2)),
    prof: 4 + Math.max(0, heroLevel - 1),
  };
}

/* 周围 8 格空位（不含自己脚下那一格） */
function squadFreeCellsAround(x, y) {
  const out = [];
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (!inBounds(nx, ny)) continue;
      if (map[ny][nx] === 1) continue;
      if (enemies.some(e => e.alive && e.x === nx && e.y === ny)) continue;
      if (squadUnits.some(s => s.alive && s.x === nx && s.y === ny)) continue;
      out.push({ x: nx, y: ny });
    }
  }
  return out;
}

/* 召唤：随机类型（不与上一次重复）+ 随机空位。返回 { ok, member } */
function summonSquadMember() {
  const cells = squadFreeCellsAround(player.x, player.y);
  if (cells.length === 0) return { ok: false, reason: 'no-cell' };
  /* 不连续重复：上次召唤过的类型从池里剔除；池空了（只有 4 种，理论上不会）就退回全池 */
  let pool = SQUAD_TYPE_ORDER.filter(id => id !== lastSquadType);
  if (pool.length === 0) pool = SQUAD_TYPE_ORDER.slice();
  const typeId = pool[randInt(pool.length)];
  const typeDef = SQUAD_TYPES[typeId];
  const cell = cells[randInt(cells.length)];
  const score = squadAbilityScore();
  const d = squadDerivedStats(score);
  const member = {
    uid: ++squadSeq,
    type: typeId,
    name: typeDef.name,
    icon: typeDef.icon,
    ranged: !!typeDef.ranged,
    x: cell.x, y: cell.y,
    hp: d.maxHp, maxHp: d.maxHp,
    ac: d.ac, move: d.move,
    prof: d.prof,
    range: typeDef.ranged ? PLAYER_RANGE : 1,
    abilities: d.abilities,
    score,
    facing: faceToward({ x: cell.x, y: cell.y }, player),
    alive: true,
  };
  squadUnits.push(member);
  lastSquadType = typeId;
  ringFx(cell.x, cell.y, '#7dd3fc');
  floatText(cell.x, cell.y, `${typeDef.icon} ${typeDef.name}`, '#7dd3fc', true);
  log(`😶 增援召唤！${typeDef.icon} ${typeDef.name} 出现在 (${cell.x},${cell.y})：六维全 ${score}、HP ${d.maxHp}、AC ${d.ac}、移动 ${d.move}。${typeDef.onKillText}`);
  return { ok: true, member };
}

/* 这一格被谁占着（小队成员自己那格除外） */
function squadCellTaken(x, y, selfUid) {
  for (const s of squadUnits) if (s.uid !== selfUid && s.alive && s.x === x && s.y === y) return true;
  if (player && player.alive && player.x === x && player.y === y) return true;
  for (const e of enemies) if (e.alive && e.x === x && e.y === y) return true;
  return false;
}

/* =========================================================
 * ★ ISSUE-20261029-32：成员进入敌人索敌候选池 + 可被敌人打死
 * ========================================================= */

/* 存活的成员（敌人索敌、伤害结算都只看这些） */
function squadAliveUnits() {
  return (typeof squadUnits !== 'undefined' ? squadUnits : []).filter(u => u.alive);
}

/* 某个格子上有没有活着的成员 */
function squadUnitAt(x, y) {
  for (const s of squadUnits) if (s.alive && s.x === x && s.y === y) return s;
  return null;
}

/* ★ 成员「下一格」的预测：成员每回合朝**离它最近的敌人**走（见 squadAct），
 *   所以敌人索敌时用「成员下一步会站的那格」来算距离，
 *   而不是用成员此刻的格子 —— 这正是人类要的「正在朝我走的那个会被优先锁定」。
 *   注意：敌人先结算、成员后结算（endRound 顺序：玩家 → 敌人 → 小队），
 *   所以这里预测的是「本回合稍后成员真的会走到的位置」，不是空想。 */
function squadPredictedNextCell(u) {
  if (!u || !u.alive) return null;
  const target = squadNearestEnemy(u);
  if (!target) return { x: u.x, y: u.y };
  const path = bfsPathTo(u.x, u.y, target.x, target.y, 1, null, false, 0);
  /* bfsPathTo 在「目标不可达」时返回的是未截断的完整路径，但第 2 格仍然是它打算走的方向 */
  if (path && path.length > 1) return { x: path[1].x, y: path[1].y };
  return { x: u.x, y: u.y };
}

/* ★ 成员的统一受伤入口（与玩家侧的 damagePlayer 对等，但成员没有护盾 / 免疫 / 反击那套）。
 *   HP 归 0 → alive=false（渲染层与 resolveSquadTurn 都会跳过它）→ 玩家彻底失去该成员。 */
function squadTakeDamage(u, amount, source) {
  if (!u || !u.alive || !(amount > 0)) return { dealt: 0, dead: false };
  const before = u.hp;
  u.hp = Math.max(0, u.hp - amount);
  const dealt = before - u.hp;
  floatText(u.x, u.y, '-' + dealt, '#ff6b6b');
  if (u.hp <= 0) {
    u.alive = false;
    log(`💀 ${u.icon} ${u.name}被${source}击杀了（${u.maxHp} HP 归零）。`);
    ringFx(u.x, u.y, '#ff6b6b');
    return { dealt, dead: true };
  }
  log(`🩸 ${u.icon} ${u.name}被${source}命中，造成 ${dealt} 伤害（${u.hp}/${u.maxHp}）。`);
  return { dealt, dead: false };
}

function squadNearestEnemy(u) {
  let best = null, bestD = Infinity;
  for (const e of enemies) {
    if (!e.alive || e.hp <= 0) continue;
    const d = Math.abs(e.x - u.x) + Math.abs(e.y - u.y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

/* 「能打的节点」：近战 = 相邻；远程 = 射程内且有视线（与玩家同一套 canRangedAttack） */
function squadCanAttack(u, e) {
  if (!e || !e.alive || e.hp <= 0) return false;
  if (u.ranged) return canRangedAttack({ x: u.x, y: u.y }, e, u.range);
  return cheb(u, e) === 1;
}

function squadFindAttackable(u) {
  let best = null;
  for (const e of enemies) {
    if (!e.alive || e.hp <= 0) continue;
    if (!squadCanAttack(u, e)) continue;
    if (!best || cheb(u, e) < cheb(u, best)) best = e;
  }
  return best;
}

/* 小队成员击杀 → 给预备干员回报（人类指定的四种） */
function squadOnKill(u) {
  const def = SQUAD_TYPES[u.type];
  if (!def || !player || !player.alive) return;
  switch (def.onKill) {
    case 'sp':
      gainRookieSp(SQUAD_KILL_SP);
      break;
    case 'shield':
      playerShield += 1;
      floatText(player.x, player.y, '护盾 +1', '#ffffff');
      log(`😑 ${def.name}击杀敌人：预备干员获得 1 层护盾（当前 ${playerShield} 层）。`);
      break;
    case 'heal': {
      const before = player.hp;
      player.hp = Math.min(player.maxHp, player.hp + SQUAD_KILL_HEAL);
      const real = player.hp - before;
      floatText(player.x, player.y, `+${real} HP`, '#2ecc71');
      log(`😇 ${def.name}击杀敌人：预备干员恢复 ${real} HP（${player.hp}/${player.maxHp}）。`);
      break;
    }
    case 'extraNode':
      player.extraAttacks += 1;
      playerStats.extraAttacks = player.extraAttacks;
      floatText(player.x, player.y, '攻击节点 +1', '#ffd700');
      log(`🤠 ${def.name}击杀敌人：预备干员获得 1 个额外攻击节点（本回合可出手 ${maxAttacksThisTurn()} 次）。`);
      break;
  }
  updateStats();
}

/* 一次成员攻击（每回合每成员最多 1 次） */
async function squadAttack(u, e) {
  const modKey = u.ranged ? 'int' : 'str';
  const mod = abilityMod(u.abilities[modKey]);
  const atk = attackRoll(mod, u.prof, e.ac);
  u.facing = faceToward(u, e);
  if (!atk.hit) {
    missFx(e.x, e.y);
    log(`${u.icon} ${u.name}攻击敌人${e.id + 1}未命中 (${fmtRoll(atk, e.ac)})`);
    refreshUnits();
    await sleep(140);
    return;
  }
  const dice = u.ranged ? PLAYER_RANGED_DICE : PLAYER_MELEE_DICE;
  let dmg = Math.max(1, rollDamageDice(dice) + mod);
  const isCrit = atk.nat20;
  if (isCrit) dmg *= 2;
  const dealt = enemyTakeDamage(e, dmg);
  if (dealt > 0) {
    slashFx(e.x, e.y, isCrit ? '#ffd700' : '#7dd3fc');
    hitFlashCell(e.x, e.y);
    floatText(e.x, e.y, `${u.icon}-${dealt}`, isCrit ? '#ffd700' : '#7dd3fc', isCrit);
    log(`${u.icon} ${u.name}${isCrit ? '暴击' : '命中'}敌人${e.id + 1}，造成 ${dealt} 伤害 (${fmtRoll(atk, e.ac)})`);
  }
  if (e.hp <= 0 && e.alive) {
    killEnemy(e, { logText: `敌人${e.id + 1}被${u.name}击败` });
    squadOnKill(u);
  }
  refreshUnits();
  await sleep(180);
}

/* 一名成员的一回合：找目标 → 能打就打 → 否则按 BFS 走向目标，途中一旦进入「能打的节点」就停下开火。
 * 寻路刻意复用敌人那套 bfsPathTo（人类要求「与敌人一致」），占位把玩家 / 敌人 / 其他成员都算进去。 */
async function squadAct(u) {
  if (!u.alive) return;
  const target = squadNearestEnemy(u);
  if (!target) return;
  /* 原地就能打（远程常见）→ 直接开火，不移动 */
  const first = squadFindAttackable(u);
  if (first) { await squadAttack(u, first); return; }

  const isOccupied = (t, x, y) => squadCellTaken(x, y, u.uid);
  let path = bfsPathTo(u.x, u.y, target.x, target.y, u.move, isOccupied, false, 0);
  if (path.length <= 1) {
    /* 被同伴挤住时忽略占位重算一次（与敌人侧反罚站补丁同思路） */
    path = bfsPathTo(u.x, u.y, target.x, target.y, u.move, null, false, 0);
  }
  /* ★ 必须自己截断：bfsPathTo 在「目标不可达」分支返回的是「最近可达点」的完整路径，
   * 那一步**没有**按 maxSteps 截断（敌人侧同样如此，它靠 tick 结算兜住）。
   * 不截断的话成员一回合能瞬移半张地图 —— 实测从 (9,9) 走到 (3,8)，移动力只有 4。 */
  if (path.length > u.move + 1) path = path.slice(0, u.move + 1);
  for (let i = 1; i < path.length; i++) {
    const from = { x: u.x, y: u.y };
    u.x = path[i].x; u.y = path[i].y;
    u.facing = faceToward(from, path[i]);
    refreshBoardOnly();
    await sleep(130);
    /* 走到这一格就能打了 → 停下开火（这就是「在能够进行攻击的节点自动攻击」） */
    const canHit = squadFindAttackable(u);
    if (canHit) { await squadAttack(u, canHit); return; }
  }
}

/* 回合末统一行动：每个成员各走一次。放在 endRound 里（玩家 → 敌人 → 小队），
 * 这样成员不会和玩家的移动抢格子，也不会被相杀结算误伤。 */
async function resolveSquadTurn() {
  if (!squadUnits.length || !player || !player.alive) return;
  if (phase !== PHASE.RESOLVING) return;
  /* 已被打死的敌人清掉引用（成员不会死，但保留兜底） */
  squadUnits = squadUnits.filter(u => u.alive);
  for (const u of squadUnits) {
    if (!player.alive) return;
    if (enemies.filter(e => e.alive).length === 0) return;
    await squadAct(u);
  }
  refreshBoardOnly();
}

/* P0.1-4 拆分 · DOM 引用与六维图点击热区 */
const boardWrap = document.getElementById('boardWrap');
const boardEl = document.getElementById('board');
const unitLayer = document.getElementById('unitLayer');
const fxLayer = document.getElementById('fxLayer');
const logEl = document.getElementById('log');
const statsEl = document.getElementById('stats');
const footEl = document.getElementById('footBar');
/* #heroInfo / #heroKv 已随侧栏角色卡删除（ISSUE-20261029-38）：
   角色信息改由 heroInnerHtml() 生成、renderHeroCard() 写入 #hud 与 #charTop。 */
const controlsEl = document.getElementById('controls');
const actionSlotEl = document.getElementById('actionSlot');   // 竖屏时「开始行动」按钮的槽位
const radarCanvas = document.getElementById('radarCanvas');
const charRadarCanvas = document.getElementById('charRadarCanvas');
let radarLabelHits = [];   // drawRadar 写入：六维图 6 个属性文字的命中框

/* 点六维图顶点文字：有可分配点数 → 直接 +1；否则 → 打开属性说明卡。
 *
 * ★ ISSUE-20261029-29（人类 04:16）：「升属性的时候点击六维图顶点文字直接升属性，
 *   不要跳转属性说明面板」。
 *   历史变迁：最早是「点一次 = 加一点」→ ISSUE-09 G2 改成「点一次 = 看说明、加点在说明卡里」
 *   → 现在回到「直接加点」，但**说明卡不删**：点数用完 / 该项已到上限时点它仍然弹出说明，
 *   这样既有「一键加点」的顺手，又保留「这属性到底管什么」的查法。
 * 判定用 canAllocateNow()（panels.js 定义，函数声明提升可跨文件调用），
 * 与说明卡里「+1」按钮的启用条件完全同源 —— 不会出现「图能点、按钮灰着」的错位。 */
/* ★ ISSUE-20261029-37：属性抽屉已移除，六维图加点入口改为「角色面板（♟️）里的六维图」。
 * 点顶点文字：有可分配点数 → 直接 +1（canAllocateNow 与 allocateAbilityPoint 同源）；
 * 点数用完 / 该项已满 → 不弹说明卡（属性说明卡已随属性抽屉移除），仅忽略点击。 */
if (charRadarCanvas) {
  charRadarCanvas.addEventListener('click', (e) => {
    if (phase === PHASE.GAMEOVER || phase === PHASE.RESOLVING) return;
    const rect = charRadarCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const hit = charRadarLabelHits.find(h => Math.hypot(h.x - x, h.y - y) <= h.r + 10);
    if (!hit) return;
    if (canAllocateNow() && currentAbilityValue(hit.k) < ABILITY_CAP) {
      allocateAbilityPoint(hit.k);
      try { if (drawerIsOpen('char')) renderCharPanel(); } catch (_) {}
      /* 加点后刷新「下一关」按钮禁用态（点数归零才放行）；升级加点全部加完会自动收起面板 */
      try { render(); } catch (_) {}
      return;
    }
  });
  charRadarCanvas.addEventListener('mousemove', (e) => {
    const rect = charRadarCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const hit = charRadarLabelHits.find(h => Math.hypot(h.x - x, h.y - y) <= h.r + 10);
    charRadarCanvas.style.cursor = hit ? 'pointer' : '';
  });
}

const unitEls = new Map();

/* src: src/ui/drawer.js */
/* =========================================================================
 * ISSUE-20261028-09 G · 抽屉组件（一套组件，四处复用）
 *
 * 设计约束（都是踩过或算过的坑，改之前先读）：
 *  1. 抽屉节点挂在 <body> 直属，不能挂进 #sidebar —— render() 每次都会重刷侧栏，
 *     挂里面的话玩家点一次「+1」，说明卡就被冲掉了。
 *  2. 只用 transform 过渡，不用 display:none —— 雷达画布在 display:none 的容器里
 *     clientWidth === 0，会画成 0×0 且不留痕。
 *  3. 同一时刻只允许一个抽屉：打开新的自动收起旧的（含二层）。
 *  4. Esc 用捕获阶段拦截并 stopPropagation，避免顺带触发 X（重置路径）等快捷键。
 *  5. 遮罩只挡游戏区：视觉上全屏，但抽屉 z-index 更高，露在遮罩之上。
 * ========================================================================= */
const DRAWER_IDS = ['settings', 'levelup', 'char'];
const drawerEls = {};
DRAWER_IDS.forEach(function (id) {
  const el = document.getElementById('drawer' + id.charAt(0).toUpperCase() + id.slice(1));
  if (el) drawerEls[id] = el;
});
const drawerMaskEl = document.getElementById('drawerMask');
let drawerCurrent = null;

function drawerIsOpen(id) { return drawerCurrent === id; }

/* ⚙ 按钮与遮罩跟随状态：入口按钮保持可见并进入高亮态（aria-expanded） */
function drawerSyncChrome() {
  const btn = document.getElementById('setOpenBtn');
  if (btn) {
    const on = drawerCurrent === 'settings';
    btn.classList.toggle('on', on);
    btn.textContent = on ? '✕' : '⚙';
    btn.title = on ? '收起设置' : '设置';
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  const cbtn = document.getElementById('charOpenBtn');
  if (cbtn) {
    const on = drawerCurrent === 'char';
    cbtn.classList.toggle('on', on);
    cbtn.textContent = on ? '✕' : '♟️';
    cbtn.title = on ? '收起角色面板' : '角色面板';
    cbtn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  if (drawerMaskEl) drawerMaskEl.classList.toggle('on', !!drawerCurrent);
}

/* 关闭二层（属性说明卡）而不关抽屉本身；返回是否真的关掉了一层 */
function drawerCloseLayer() {
  const layer = document.getElementById('abilityInfoLayer');
  if (layer && layer.classList.contains('on')) {
    layer.classList.remove('on');
    layer.setAttribute('aria-hidden', 'true');
    return true;
  }
  return false;
}

function drawerClose() {
  if (!drawerCurrent) { drawerCloseLayer(); return false; }
  const el = drawerEls[drawerCurrent];
  if (el) { el.classList.remove('on'); el.setAttribute('aria-hidden', 'true'); }
  drawerCurrent = null;
  drawerCloseLayer();
  drawerSyncChrome();
  return true;
}

/* =========================================================================
 * ★ 设置面板贴棋盘（ISSUE-20261029-29）
 * #drawerSettings 的 CSS 用 --board-top / --board-left / --board-w / --board-h 定位，
 * 这四个变量在这里按 #board 的实时矩形写入 —— 不能只在打开时写一次：
 * 转屏 / 换布局 / 窗口缩放 / 抽屉开着时棋盘尺寸变了，面板必须跟着走，
 * 否则就会出现「面板比地图小一圈、边缘露出半格棋盘」这种错位。
 * ========================================================================= */
function syncBoardOverlayRect() {
  try {
    if (typeof boardEl === 'undefined' || !boardEl) return;
    const r = boardEl.getBoundingClientRect();
    if (!(r.width > 0) || !(r.height > 0)) return;
    const s = document.documentElement.style;
    s.setProperty('--board-top', Math.round(r.top) + 'px');
    s.setProperty('--board-left', Math.round(r.left) + 'px');
    s.setProperty('--board-w', Math.round(r.width) + 'px');
    s.setProperty('--board-h', Math.round(r.height) + 'px');
  } catch (_) {}
}
/* 棋盘矩形变化的所有时机都补一次（抽屉没开时写变量是白写，但代价只是一次 getBoundingClientRect） */
window.addEventListener('resize', function () { setTimeout(syncBoardOverlayRect, 150); });
window.addEventListener('scroll', function () { syncBoardOverlayRect(); }, { passive: true });

function drawerOpen(id) {
  const el = drawerEls[id];
  if (!el) return;
  if (id === 'settings') syncBoardOverlayRect();
  if (id === 'char') syncBoardOverlayRect();
  // 互斥：先收起别的抽屉与所有二层
  if (id === 'stats') return;   // 属性抽屉已移除（ISSUE-20261029-37），不再受理
  if (drawerCurrent && drawerCurrent !== id) {
    const prev = drawerEls[drawerCurrent];
    if (prev) { prev.classList.remove('on'); prev.setAttribute('aria-hidden', 'true'); }
  }
  drawerCloseLayer();
  drawerCurrent = id;
  el.classList.add('on');
  el.setAttribute('aria-hidden', 'false');
  drawerSyncChrome();
  if (id === 'stats') {
    // 抽屉必须在「已经滑入」之后画：下一帧 clientWidth 才是真实值
    requestAnimationFrame(function () {
      try { if (typeof renderAbilityDrawer === 'function') renderAbilityDrawer(); } catch (_) {}
      try { drawRadar(); } catch (_) {}
      try { if (typeof syncAbilityInfoIfOpen === 'function') syncAbilityInfoIfOpen(); } catch (_) {}
    });
  }
  if (id === 'char') {
    // 面板贴棋盘，下一帧 clientWidth 才是真实值；renderCharPanel 会绘制六维图到 #charRadarCanvas
    requestAnimationFrame(function () {
      try { if (typeof renderCharPanel === 'function') renderCharPanel(); } catch (_) {}
    });
  }
}

function drawerToggle(id) {
  if (drawerCurrent === id) drawerClose();
  else drawerOpen(id);
}

if (drawerMaskEl) drawerMaskEl.addEventListener('click', function () { drawerClose(); });
document.querySelectorAll('[data-drawer-close]').forEach(function (b) {
  b.addEventListener('click', function (e) { e.stopPropagation(); drawerClose(); });
});
// 角色面板入口（ISSUE-20261029-36）：右下角 ♟️ 按钮（六维图 / 加点入口并入面板与升级抽屉，不再单独留属性按钮）
const charOpenBtnEl = document.getElementById('charOpenBtn');
if (charOpenBtnEl) charOpenBtnEl.addEventListener('click', function (e) {
  e.stopPropagation();
  drawerToggle('char');
});
/* Esc：先关二层，再关抽屉。捕获阶段 + stopPropagation，避免落到 handleKeyDown 的其它键位 */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (drawerCloseLayer()) { e.stopPropagation(); e.preventDefault(); return; }
  if (drawerCurrent) { drawerClose(); e.stopPropagation(); e.preventDefault(); }
}, true);

/* src: src/ui/panels.js */
/* =========================================================================
 * ISSUE-20261028-09 G2 · 属性数据（属性抽屉与说明卡已随 ISSUE-20261029-37 移除）
 *
 * 六维数值公式仅保留给雷达图（canAlloc / 顶点提示）与角色面板（♟️）六维图加点使用。
 * 加点入口：角色面板里的六维图 —— 点属性名直接 +1（见 dom-refs.js 的 #charRadarCanvas 点击）。
 * ========================================================================= */
const ABILITY_INFO = {
  str: { name: '力量', desc: '近战伤害与近战命中。近战伤害 = <code>1 + 力量修正</code>；风笛 / 泥岩 用这一条。' },
  dex: { name: '敏捷', desc: '移动力与防御等级。移动力 = <code>⌊敏捷 / 2⌋</code>；AC = <code>5 + ⌊(敏捷 + 体质) / 4⌋</code>。' },
  con: { name: '体质', desc: '生命上限。maxHp = <code>体质 + 4 + 等级加成</code>；同时参与 AC 公式。' },
  int: { name: '智力', desc: '远程伤害与远程命中。远程伤害 = <code>1 + 智力修正</code>；阿米娅 / 华法琳 用这一条。' },
  wis: { name: '感知', desc: '战场预判与技力上限。敌人意图可见步数 = <code>1 + max(0, 感知修正)</code>；部分角色的技力上限 = 感知值。' },
  cha: { name: '魅力', desc: '当前版本无任何数值作用（只显示、只参与面板展示）。' }
};

/* 当前该属性的数值：选角时看候选人，局内看 playerStats
 * ★ ISSUE-20261028-19：动态角色（预备干员）在选角阶段读的是**副本**，不是 CHARACTERS 静态值。 */
function currentAbilityValue(k) {
  if (phase === PHASE.CHAR_SELECT && selectedCandidate && CHARACTERS[selectedCandidate.id]) {
    const a = candidateAbilitiesOf(selectedCandidate.id);
    return (a && a[k]) || 0;
  }
  if (playerStats && playerStats.abilities) return playerStats.abilities[k] || 0;
  if (player && player.abilities) return player.abilities[k] || 0;
