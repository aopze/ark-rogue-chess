<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟战棋</title>
<style>
  * { box-sizing: border-box; }
  :root { --cell: 50px; --unit-move-ms: 120ms; }
  body { font-family: system-ui, -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; background:#1a1a2e; color:#eee; margin:0; padding:0; height: 100vh; height: 100dvh; width: 100vw; overflow: hidden; display:flex; flex-direction:column; touch-action: manipulation; }
  #topbar { display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0; padding: 4px 12px; }
  #topbar h1 { font-size:18px; margin:4px 0; text-align:center; }
  #game { display:flex; gap:8px; padding: 8px 16px 16px 16px; flex-grow: 1; min-height: 0; justify-content:center; }
  #boardWrap { flex-grow: 1; display: flex; justify-content: center; align-items: center; position:relative; min-width: 0; min-height: 0; overflow: hidden; }
  #board { display:grid; gap:2px; padding:0; border-radius:4px; touch-action: none; user-select: none; -webkit-user-select: none; position: relative; }
  #unitLayer { position:absolute; inset:0; pointer-events:none; z-index:40; overflow:visible; }
  #fxLayer { position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:50; }
  .cell { width: var(--cell); height: calc(var(--cell) * 1.12); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.44); border-radius:2px; cursor:pointer; user-select:none; position:relative; overflow:hidden; }
  .cell.empty { background:#2d2d44; }
  .cell.void { background:transparent; cursor:default; pointer-events:none; }
  .cell.wall { background:#4a4a5a; cursor:not-allowed; border-radius:4px; }
  .cell.path { background:#3a5a8c; }
  /* 闪避节点：第一次等待（蓝色描边 + 内部蓝调） */
  .cell.dodge { box-shadow: inset 0 0 0 2px #7dd3fc; background:#2f5578; }
  .cell.dodge.attack { box-shadow: inset 0 0 0 2px #7dd3fc, inset 0 0 0 999px rgba(192,57,43,.35); }
  .cell.attack { background:#c0392b; }
  .cell.attack.used { background:#5c2b29; }
  /* 技能节点（双击设置）：紫色底 + 紫描边 + ✦ */
  .cell.skill { background:#5b3a8c; box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.used { background:#3d2a5c; }
  .cell.attack.skill { background: linear-gradient(135deg, #c0392b 0 45%, #5b3a8c 55% 100%); box-shadow: inset 0 0 0 2px #c9a0ff; }
  .cell.skill.dodge { box-shadow: inset 0 0 0 2px #c9a0ff, inset 0 0 0 4px #7dd3fc; }
  /* 攻击范围：在地块上叠一层蓝色（与路径格 #3a5a8c 接近），不遮挡格子内容 */
  .cell.in-range { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25); }
  .cell.in-range.attack, .cell.in-range.skill { box-shadow: inset 0 0 0 999px rgba(58,90,140,.25), inset 0 0 0 1px rgba(201,160,255,.65); }
  .cell.item-cell { background: #4a1e2f; box-shadow: inset 0 0 10px #ff6b6b; }
  .cell.blood-cell { background: #3d1515; }
  .cell.candidate { outline:2px dashed #aaa; }
  .cell.candidate.selected { outline:3px solid #f39c12; box-shadow: inset 0 0 15px #f39c12; }
  .cell.exit-cell { background: #27ae60; box-shadow: inset 0 0 15px #2ecc71; }
  .cell.hitflash { animation: hitflash .35s ease-out; }
  @keyframes hitflash { 0%{box-shadow: inset 0 0 0 40px rgba(255,80,80,.9);} 100%{box-shadow: inset 0 0 0 0 rgba(255,80,80,0);} }
  .item-pulse { animation: itemPulse 1.5s ease-in-out infinite; display:inline-block; }
  @keyframes itemPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
  /* 单位渲染（格内静态 .unit + 绝对定位 .unit-abs）共用同一套外观，避免两处分别维护 */
  .unit, .unit-abs { display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; pointer-events:none; position:relative; }
  .unit { width:100%; height:100%; }
  .unit-abs { position:absolute; left:0; top:0; width:auto; height:auto; transition: transform var(--unit-move-ms) linear; will-change: transform; border-radius:2px; }
  .unit .icon, .unit-abs .icon { font-size: calc(var(--cell) * 0.55); line-height:1; display:flex; align-items:center; justify-content:center; }
  .unit .icon.ghost-icon, .unit-abs .icon.ghost-icon { opacity: 0.7; filter: drop-shadow(0 0 5px #fff); }
  /* 词缀 / 精英标记（ISSUE-20261028-05）：词缀做成右上角小标签，精英用金边 + 星标。
     刻意不用 CSS filter 改图标色 —— 会把 emoji 与后续像素画（ISSUE-07）的色阶一起毁掉。 */
  .affix-tag { position:absolute; top:0; right:0; display:flex; gap:1px; align-items:center;
    font-size: calc(var(--cell) * 0.2); line-height:1; padding:1px 2px; border-radius:4px;
    background: rgba(0,0,0,0.66); color:#ffd93d; font-weight:900; letter-spacing:0;
    pointer-events:none; z-index:46; white-space:nowrap; }
  .unit-abs.ua-elite { outline:2px solid #ffd700; outline-offset:-2px;
    box-shadow: inset 0 0 10px rgba(255,215,0,0.45); }
  .unit-abs.ua-elite .icon { text-shadow: 0 0 6px #ffd700; }
  .unit .hp-bar, .unit-abs .hp-bar { width: 78%; height: 3px; background: rgba(0,0,0,0.55); border-radius: 2px; margin-top: 1px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 2px rgba(0,0,0,0.6); }
  .unit .hp-fill, .unit-abs .hp-fill { height: 100%; border-radius: 2px; transition: width 0.25s ease; }
  .unit-abs.ua-player { outline:2px solid #4ecdc4; outline-offset:-2px; }
  .unit-abs.ua-player.ua-charging { outline:3px solid #ffd700; outline-offset:-3px; box-shadow: inset 0 0 15px #ffd700; }
  .unit-abs.ua-player.ua-attacked { outline:2px dashed #ffb86b; outline-offset:-2px; }
  .unit-abs.ua-enemy { outline:2px solid #e74c3c; outline-offset:-2px; }
  .unit-abs.ua-enemy.ua-debug { outline:2px dashed #ffcc00; outline-offset:-2px; }
  .unit-abs.ua-stunned { opacity: 0.55; filter: grayscale(0.35); }
  .unit-abs.ua-stunned::after {
    content: '💫';
    position: absolute;
    top: -2px;
    right: -2px;
    font-size: calc(var(--cell) * 0.28);
    animation: stunSpin 1.8s linear infinite;
    pointer-events: none;
    text-shadow: 0 0 4px #ffd700;
  }
  @keyframes stunSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .facing-ind { position: absolute; font-size: calc(var(--cell) * 0.2); color: rgba(255,255,255,0.55); text-shadow: 0 0 3px #000, 0 0 2px #000; line-height: 1; pointer-events: none; font-weight: 900; z-index: 2; }
  .facing-ind.r { right: 1px; top: 50%; transform: translateY(-50%); }
  .facing-ind.l { left: 1px; top: 50%; transform: translateY(-50%); }
  .facing-ind.d { bottom: 0; left: 50%; transform: translateX(-50%); }
  .facing-ind.u { top: 0; left: 50%; transform: translateX(-50%); }
  .enemy-arrow { position:absolute; width: calc(var(--cell) * 0.4); height: calc(var(--cell) * 0.4); display:flex; align-items:center; justify-content:center; font-size: calc(var(--cell) * 0.3); font-weight:900; color:#ffd93d; background:rgba(0,0,0,0.6); border-radius:50%; text-shadow:0 0 4px #000, 0 0 6px #ffd93d; transform:translate(-50%,-50%); z-index:45; pointer-events:none; }
  .bullet { position:absolute; width:12px; height:12px; border-radius:50%; background:#ffe66d; box-shadow:0 0 10px 3px #ffd93d, 0 0 22px 6px rgba(255,217,61,.5); transform:translate(-50%,-50%); z-index:20; }
  .bullet.crit { background:#ff4500; box-shadow:0 0 12px 4px #ff4500, 0 0 26px 8px rgba(255,69,0,.6); width:14px; height:14px; }
  .bullet.alien { background:#a55eea; box-shadow:0 0 10px 3px #a55eea, 0 0 22px 6px rgba(165,94,234,.5); width:14px; height:14px; }
  .float-text { position:absolute; font-weight:900; font-size:20px; text-shadow:0 0 6px #000, 0 0 2px #000; pointer-events:none; z-index:30; transform:translate(-50%,-50%); white-space:nowrap; }
  .float-text.crit { font-size:26px; color:#ffd700 !important; text-shadow:0 0 10px #ff4500, 0 0 4px #000; }
  .float-text.crosskill { font-size:26px; color:#ff4500 !important; text-shadow:0 0 12px #ff4500, 0 0 4px #000, 0 0 2px #000; letter-spacing:2px; }
  .ring-fx { position:absolute; width:46px; height:46px; border:4px solid #fff; border-radius:50%; transform:translate(-50%,-50%); z-index:25; }
  .slash-fx { position:absolute; width:52px; height:52px; z-index:26; transform:translate(-50%,-50%); }
  .slash-fx::before, .slash-fx::after { content:''; position:absolute; left:50%; top:50%; width:6px; height:46px; background:linear-gradient(180deg,#fff,#ffb86b); border-radius:4px; transform:translate(-50%,-50%) rotate(45deg); box-shadow:0 0 8px #ffb86b; }
  .slash-fx::after { transform:translate(-50%,-50%) rotate(-45deg); }
  #sidebar { width: clamp(300px, 33vw, 620px); flex-shrink: 0; display:flex; flex-direction:column; gap:8px; height: 100%; min-height: 0; overflow: hidden; }
  #dragHandle { flex: 0 0 16px; align-self: stretch; cursor: col-resize; position: relative; user-select: none; touch-action: none; }
  /* 细分隔线（颜色加深） */
  #dragHandle::before { content: ""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; transform: translateX(-50%); background: #10101e; border-radius: 2px; }
  /* 中间竖胶囊 */
  #dragHandle .grip { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 9px; height: 50px; border-radius: 6px; background: linear-gradient(180deg, #34334d, #2d2d44); box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.45); transition: background .15s, box-shadow .15s; }
  /* 胶囊上的细小抓握点 */
  #dragHandle .grip::before, #dragHandle .grip::after { content: ""; position: absolute; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; border-radius: 50%; background: rgba(220,226,255,.55); }
  #dragHandle .grip::before { top: 16px; }
  #dragHandle .grip::after { bottom: 16px; }
  #dragHandle:hover .grip, #dragHandle.dragging .grip { background: linear-gradient(180deg, #3f3e5c, #353552); box-shadow: 0 0 0 1px rgba(150,160,210,.45), 0 2px 8px rgba(0,0,0,.5); }
  /* ---- 角色卡：左侧六维图 / 右上 HP+技力 / 右下 2×2 仪表 ---- */
  #hero { flex-shrink:0; display:grid; grid-template-columns:auto minmax(0,1fr); align-items:stretch; gap:6px; padding:8px 10px 8px 8px; border-radius:10px; background:linear-gradient(135deg,#26263f,#1c1c2d); border:1px solid #33334f; }
  #radarWrap { display: flex; align-items: center; justify-content: center; }
  #radarCanvas { display: block; width: 188px; height: 188px; }
  #heroRight { display:flex; flex-direction:column; justify-content:space-between; gap:5px; min-width:0; }
  #heroInfo { min-width:0; display:flex; flex-direction:column; gap:4px; }
  #heroKv { min-width:0; }
  .hero-top { display:flex; align-items:baseline; gap:5px; flex-wrap:wrap; }
  .hero-name { font-size:14px; font-weight:900; color:#4ecdc4; letter-spacing:1px; white-space:nowrap; }
  /* 等级：紧贴名字右侧（金色），用于替代原先画在六维图中心的 Lv */
  .hero-lv-gold { font-size:12px; font-weight:900; color:#ffd700; letter-spacing:.5px; white-space:nowrap; text-shadow:0 0 6px rgba(255,215,0,.25); }
  .hero-lv { font-size:11px; font-weight:800; color:#8a8aa5; white-space:nowrap; margin-left:auto; }
  .hp-track { position:relative; height:13px; border-radius:7px; background:#101019; box-shadow:inset 0 0 0 1px #34344f; overflow:hidden; }
  .hp-fill-lg { display:block; height:100%; border-radius:7px; background:linear-gradient(90deg,#2ecc71,#4ecdc4); transition:width .25s ease; }
  .hp-track.warn .hp-fill-lg { background:linear-gradient(90deg,#e67e22,#f1c40f); }
  .hp-track.danger .hp-fill-lg { background:linear-gradient(90deg,#c0392b,#e74c3c); }
  .hp-track.danger { box-shadow:inset 0 0 0 1px rgba(231,76,60,.75), 0 0 8px rgba(231,76,60,.25); }
  .hp-text { position:absolute; inset:0; display:block; text-align:center; line-height:13px; font-size:10px; font-weight:900; letter-spacing:.5px; text-shadow:0 0 3px #000,0 0 2px #000; }
  /* ---- 技力条：比血条短、细，蓝色调（风格与血条一致） ---- */
  .sp-track { position:relative; width:100%; height:10px; border-radius:5px; background:#101019; box-shadow:inset 0 0 0 1px #30425f; overflow:hidden; }
  .sp-fill { display:block; height:100%; border-radius:5px; background:linear-gradient(90deg,#2f6fe0,#5cc9f5); transition:width .25s ease; }
  .sp-track.max .sp-fill { background:linear-gradient(90deg,#3f86ff,#7fd9ff); box-shadow:0 0 8px rgba(110,190,255,.9); }
  .sp-track.max { box-shadow:inset 0 0 0 1px rgba(120,200,255,.85), 0 0 8px rgba(90,170,255,.35); }
  .sp-track.max .sp-text { color:#062339; text-shadow:0 1px 1px rgba(255,255,255,.35); }
  .sp-text { position:absolute; inset:0; display:block; text-align:center; line-height:10px; font-size:8px; font-weight:900; letter-spacing:.5px; color:#eaf6ff; text-shadow:0 1px 2px #000,0 0 3px #001a33; }
  /* 条内标签（HP / SP）：半透明字母，位于数值左侧 */
  .bar-lbl { font-style:normal; opacity:.5; font-weight:700; letter-spacing:.5px; margin-right:3px; }
  /* ---- 经验条：方形无圆角（「方形=信息」，ISSUE-20261028-10） ---- */
  .xp-track { position:relative; width:100%; height:4px; background:#101019; box-shadow:inset 0 0 0 1px #3a3550; overflow:hidden; }
  .xp-fill { display:block; height:100%; background:linear-gradient(90deg,#8a6b1f,#ffd700); transition:width .25s ease; }
  /* ---- 护盾（药枚）：血条内右侧叠一段白条，每层 12% ---- */
  .hp-shield { position:absolute; top:0; bottom:0; right:0; border-radius:0 7px 7px 0;
    background:linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,.92));
    box-shadow:0 0 6px rgba(255,255,255,.55); transition:width .25s ease; pointer-events:none; }
  .hp-shield::after { content:''; position:absolute; left:0; top:0; bottom:0; width:1px; background:rgba(255,255,255,.95); }

  /* ---- 升级奖励选择（全屏遮罩） ---- */
  .lv-mask { position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(4,6,12,.82); backdrop-filter:blur(3px); }
  .lv-panel { width:min(900px,100%); max-height:90vh; overflow:auto; background:#12121c;
    border:1px solid #2f2f4a; border-radius:14px; padding:18px 18px 20px;
    box-shadow:0 18px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(255,215,0,.12) inset; }
  .lv-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .lv-title { font-size:20px; font-weight:900; color:#ffd700; letter-spacing:1px; }
  .lv-lv { font-size:13px; font-weight:900; color:#8fe28a; }
  .lv-sub { font-size:12px; color:#8f95a8; margin:6px 0 14px; line-height:1.6; }
  .lv-cards { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  .lv-card { position:relative; background:#171724; border:1px solid #33334d; border-radius:12px;
    padding:14px 13px; cursor:pointer; transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:4px; text-align:left; color:inherit; font:inherit; }
  .lv-card:hover { transform:translateY(-3px); border-color:#ffd700; box-shadow:0 10px 24px rgba(255,215,0,.16); }
  .lv-card:active { transform:translateY(-1px); }
  .lv-card .ico { font-size:26px; line-height:1.1; }
  .lv-card .nm { font-size:14px; font-weight:900; color:#fff; letter-spacing:.5px; }
  .lv-card .ds { font-size:12px; color:#a9b0c2; line-height:1.5; }
  .lv-card .own { margin-top:auto; padding-top:8px; font-size:11px; color:#7f8698; }
  .lv-card .own b { color:#ffd700; }
  @media (max-width:760px) {
    .lv-cards { grid-template-columns:1fr; gap:9px; }
    .lv-panel { padding:14px; border-radius:12px; }
    .lv-title { font-size:17px; }
    .lv-card { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:10px; row-gap:2px; align-items:center; }
    .lv-card .ico { grid-row:1 / span 3; font-size:22px; }
    .lv-card .nm, .lv-card .ds, .lv-card .own { grid-column:2; }
    .lv-card .own { padding-top:2px; }
  }
  .chip { font-size:11px; font-weight:700; padding:0 7px; border-radius:9px; background:#2c2c47; color:#c3c3da; white-space:nowrap; line-height:1.6; }
  .chip.teal { background:#0f3a38; color:#4ecdc4; }
  .chip.gold { background:#453609; color:#ffd700; }
  .chip.green { background:#20380f; color:#8fe28a; }
  #stats { flex: 1 1 auto; min-height: 0; overflow-y: auto; display:flex; flex-direction:column; gap:6px; }
  #footBar { flex-shrink:0; }
  /* 竖屏：把「开始行动」按钮放到六维图上方（横屏时按钮仍在底部 #controls） */
  #actionSlot { display: none; }
  body.layout-v #actionSlot { display: block; flex: 0 0 auto; }
  body.layout-v #actionSlot .start-btn { width: 100%; }
  #controls { flex-shrink: 0; display:flex; flex-direction:column; gap:8px; min-height: 90px; }
  #controls:empty { min-height: 0; }
  /* ---- 战斗日志：左上角悬浮窗（可拖动，标题栏带重开/旋转/折叠） ---- */
  #logPanel {
    position: fixed; left: 8px; top: 4px; z-index: 1001;
    width: 268px; max-width: calc(100vw - 16px);
    display: flex; flex-direction: column;
    background: rgba(12,12,20,0.96);
    border: 1px solid #3a3a55; border-radius: 10px;
    box-shadow: 0 8px 26px rgba(0,0,0,.55);
    overflow: hidden;
    --set-mini: clamp(26px, calc(var(--cell) * 0.5), 40px);
  }
  #logPanel.folded #log { display: none; }
  #logPanel.folded #logBar { border-bottom: none; }
  /* ---- 收起态：只剩一个约半格大小的 ⚙ 按钮（点击展开 / 再点收起，位置不变） ---- */
  #setOpenBtn {
    position: absolute; left: 1px; top: 1px; z-index: 3;
    display: flex; width: var(--set-mini); height: var(--set-mini);
    align-items: center; justify-content: center; padding: 0;
    background: rgba(24,24,42,.96); color: #cfe6ff;
    border: 1px solid #3a3a55; border-radius: 9px;
    font-size: calc(var(--set-mini) * 0.5); line-height: 1;
    cursor: pointer; touch-action: manipulation;
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
    transition: color .15s, border-color .15s, background .15s;
  }
  #setOpenBtn:active { transform: scale(.94); }
  #setOpenBtn.on { color: #ffd700; border-color: #6b5a1f; }
  #logPanel.collapsed {
    width: calc(var(--set-mini) + 2px); height: calc(var(--set-mini) + 2px);
    max-width: none; background: transparent;
    border-color: transparent; box-shadow: none; overflow: visible;
    border-radius: 9px;
  }
  #logPanel.collapsed #logBar,
  #logPanel.collapsed #setBtns,
  #logPanel.collapsed #log { display: none; }
  /* 展开时标题栏给按钮让位，按钮位置与收起态完全一致 */
  #logPanel:not(.collapsed) #logBar { padding-left: calc(var(--set-mini) + 8px); }
  /* ---- 布局模式：layout-h 地图左/UI右（桌面默认）；layout-v 地图上/UI下（竖版） ---- */
  body.layout-v #game { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
  body.layout-v #boardWrap { width: 100%; flex: 0 0 auto; height: min(62vh, 100%); min-height: 96px; }
  body.layout-v #sidebar { width: 100%; max-width: 100%; height: auto; flex: 1 1 auto; min-height: 0; }
  body.layout-v #sidebar > * { width: 100%; max-width: 760px; margin-left: auto; margin-right: auto; }
  /* 竖版中间的可上下拖动分隔条（横线 + 横胶囊），与横版竖线呼应 */
  body.layout-v #dragHandle { display: block; flex: 0 0 14px; align-self: stretch; cursor: row-resize; }
  body.layout-v #dragHandle::before { left: 8px; right: 8px; top: 50%; bottom: auto; width: auto; height: 2px; transform: translateY(-50%); }
  body.layout-v #dragHandle .grip { width: 50px; height: 9px; }
  body.layout-v #dragHandle .grip::before, body.layout-v #dragHandle .grip::after { left: auto; top: 50%; transform: translateY(-50%); }
  body.layout-v #dragHandle .grip::before { left: 16px; }
  body.layout-v #dragHandle .grip::after { right: 16px; }
  #logBar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px; font-size: 12px; font-weight: 800; color: #9a9ab5; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,.06); cursor: grab; user-select: none; touch-action: none; }
  #logPanel.dragging #logBar { cursor: grabbing; }

<!-- 设置：默认收成左上角半格大小的 ⚙ 按钮，点击展开（主页/联机/重开/旋转 + 战斗日志） -->

<script>
/* ---- P0.1-1 冻结基线：版本号 ----
 * 用途：排障与回滚定位 + 让玩家确认「是不是最新版」。
 * 查法：控制台 `window.__ARK_VERSION__`，或点左上角 ⚙ 展开「设置」，标题栏「设置」右侧即可见。
 *
 * 字段说明：
 *   version  —— 语义版本（跟随 README §5 阶段里程碑）
 *   build    —— 日期构建号 `YYYYMMDDx`；★ 每次发版必须同时改这里和 DLC index.html 的 BUILD，
 *               否则 iframe 的 `game.html?v=BUILD` 不会刷新缓存，玩家会继续看旧版。
 *   commit   —— ★ 冻结基线提交（9a4137c），不是当前提交：git 无法自引用自身 sha。
 *               P0.1-3 构建脚本上线后，改为构建时注入真实 sha。
 *   builtAt  —— 基线冻结时间 */
window.__ARK_VERSION__ = {
  version: '0.1.0-prototype',
  build:   '20261028e',
  commit:  'unknown',
  builtAt: '2026-10-28T09:26:40Z'
};
(function () {
  var v = window.__ARK_VERSION__, el = document.getElementById('setVer');
  if (!el) return;
  // 标题栏空间有限：只显示日期构建号；完整信息放 title，鼠标悬停/长按可看
  el.textContent = 'v' + v.build;
  el.title = 'v' + v.version + '\n构建 ' + v.build + '\n基线 ' + v.commit.slice(0, 7) + ' (' + v.builtAt.slice(0, 10) + ')';
})();

/* =========================================================================
 * 方舟战棋 · 单文件版（无构建、无依赖，双击即可玩）
 *
 * 代码分区（从上到下）：
 *   1. 数据与常量        — 角色 / 敌人 / buff / 阶段名 / 方向表
 *   2. 运行时状态        — 关卡、路径、技力、升级、UI 缓存
 *   3. DOM 引用与基础工具 — log / sleep / 距离 / 随机
 *   4. 掷骰与面板        — d20 检定、AC、派生属性、敌人面板
 *   5. 六维雷达图        — canvas 绘制 + 属性点点击热区
 *   6. 规则判定（纯逻辑） — 路径 → 主动行动（攻击 / 技能 / 闪避节点）、技力、冲锋
 *   7. 战斗反馈（DX）    — 浮动文字 / 粒子 / 弹道 / 受击闪烁
 *   8. 结算工具          — 击杀、落败、通关、玩家受伤反馈（收敛重复逻辑）
 *   9. 地图生成          — 连通区域生长 + 障碍 + 敌人 / 道具落点
 *  10. 关卡与回合生命周期 — initLevel / initCharSelect / 重置
 *  11. 渲染              — 棋盘、单位层、角色卡、数值面板、按钮
 *  12. 输入              — 键盘、指针拖拽、日志窗、布局切换
 *  13. 战斗结算          — resolveStep 及其子步骤
 *  14. 成长与奖励        — 升级、buff、下一关
 *  15. 启动              — initCharSelect()
 *
 * 约定：
 *   - 所有跨函数状态仍为顶层 let（便于热改与调试），命名统一见第 2 区。
 *   - 纯逻辑函数不碰 DOM；渲染函数不改战斗状态；结算函数通过返回值报告「是否致死」。
 *   - 新增角色时，只需在 CHARACTERS 里加数据 + 在「规则判定」区加它的技能分支。
 * ========================================================================= */
/* src: src/data/constants.js */
/* P0.1-4 机械拆分：从 game.html（20261028b 基线）第 487-522 行原样搬移（常量与方向表）。
 * 纯移动未改逻辑；顺序由 build/manifest.json 保证与拆分前一致。 */
const SPAWN_CLEAR_RADIUS = 2;
const OBSTACLE_MAX_GROUP = 4;
const OBSTACLE_GROUPS_TRY = 8;
const UNIT_MOVE_MS = 120;
const ABILITY_CAP = 20;
/* 属性点改为绑定「升级」发放：每 LEVELUP_EVERY_N_LEVELS 关升 1 级时给 2 点（ISSUE-20261028-03）。
 * 旧常量 ABILITY_POINTS_PER_LEVEL = 1 已移除（曾每通关 1 关给 1 点）。 */
const ABILITY_POINTS_PER_LEVELUP = 2;
const PLAYER_RANGE = 3;   // 远程角色的攻击节点射程（近战角色攻击节点只打相邻 1 格）
/* 玩家基础 HP 加成（ISSUE-20261028-04 配套）。
 * 敌人伤害从「常量 1」改为骰子后，首关承伤期望从每回合 0.99 涨到 1.38（+39%），
 * 玩家 HP10 撑不到清场，实测「第 1 关即死」比例 40% → 55%。补 4 点基础 HP 把它拉回来：
 * 前期收益最大（10→14，+40%），后期被 con/升级稀释（20→24，+20%），符合「前期该更宽容」。
 * 校准记录：+2 时 80 局测试仍为 -43%（旧 1.21 关 → 新 0.69 关），故提到 +4。 */
const BASE_HP_BONUS = 4;

const ABILITY_ORDER = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
const ABILITY_FULL = { str: '力量', dex: '敏捷', con: '体质', int: '智力', wis: '感知', cha: '魅力' };

/* =========================================================
 * ★ 玩家经验制（ISSUE-20261028-10）
 * 升级不再按关卡号硬绑（旧：每 LEVELUP_EVERY_N_LEVELS 关升 1 级），改为：
 *   本关经验 = 保底 12 + 效率加成，效率 = 「该关允许的失血」− 实际失血。
 * 失血口径：关卡开始时血量 − 关卡结束时血量（关内回血会抵消，取 0 下限）。
 *
 * 为什么用「加法保底」而不是纯效率制：单关经验下限恒为 12，
 * 于是 12×3 = 36 = XP_TABLE[1]，第 3 关必升是纯算术保证，与玩家水平无关。
 * 单关上限 24 < 36 → 第 1 关永远升不了；两关满 48 ≥ 36 → 零失血可第 2 关升。
 *
 * 注意：这些常量与 enemies.js 的 LEVELUP_EVERY_N_LEVELS（敌人成长用）完全无关，
 * 禁止复用那个常量，改它会让 22 关所有敌人同时变形。
 * ========================================================= */
const XP_CLEAR_BASE = 12;        // 每关保底经验（决定保底升级的算术下限）
const XP_DMG_REF_RATIO = 0.40;   // 失血基准 = 本关开始血量 × 40%
const XP_DMG_REF_MIN = 2;        // 基准下限（残血进关时不至于 0 宽容度）
const XP_DMG_REF_MAX = 8;        // 基准上限
const XP_PER_STEP = 2;           // 少失 1 血 = +2 经验
const XP_EFF_CAP = 6;            // 效率步数封顶 → 最多 +12
const XP_MAX_LEVELUPS_PER_CLEAR = 3;  // 单次通关最多连升 3 级（防死循环）
/* 下标 = 当前等级，值 = 升到下一级所需经验。超出表长时按表尾 +100 递增。 */
const XP_TABLE = [0, 36, 64, 98, 140, 190, 250, 320, 400, 500];

/* =========================================================
 * 全局常量：阶段名 / 方向 / 朝向符号
 * 以前这些字面量散落在 60 多处（'planning'、[[1,0],...]、'▶' 等），
 * 改名或调整方向顺序时极易漏改。统一收在这里。
 * ========================================================= */
const PHASE = Object.freeze({
  CHAR_SELECT: 'char_select',
  PLANNING:    'planning',
  RESOLVING:   'resolving',
  LEVELCLEAR:  'levelclear',
  GAMEOVER:    'gameover',
  // 联机专用结束态。必须与 GAMEOVER 区分：正式版主页（index.html）会把
  // phase === 'gameover' 当成单人死亡，向排行榜上报 {level, kills}。
  // 联机局没有关卡与击杀语义，复用 'gameover' 会往榜单灌假成绩。
  PVP_OVER:    'pvp_over',
});
// 四方向表。顺序会影响 BFS 的先验路径（同距离时先探哪格），因此保留两套原始顺序，勿随意合并。
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];      // 邻格扫描 / 连通性

/* 每个角色只有一种伤害方式，由攻击节点类型决定：
 *   近战 → 风笛、泥岩（用力量，面板显示「近战伤害」）

 * 因此 UI 只显示与角色对应的那一个伤害数值。
 * 注：远程角色被贴身时的趁乱打击固定 1 点保底伤害（不吃暴击/倍率），不读取近战伤害面板。
 */
function charAttackType(id) {
  const c = CHARACTERS[id];
  if (!c) return 'melee';
  return c.attackType || (c.profRanged ? 'ranged' : 'melee');
}
function isRangedChar(id) { return charAttackType(id) === 'ranged'; }
function charDmgLabel(id) { return isRangedChar(id) ? '远程伤害' : '近战伤害'; }

/* P0.1-4 机械拆分：从 game.html（20261028b 基线）第 596-671 行原样搬移（敌人类型 / L1 基础面板 / 成长推演（computeEnemyGrowth））。
 * 纯移动未改逻辑；顺序由 build/manifest.json 保证与拆分前一致。 */
const ENEMY_TYPES = ['skeleton', 'ghost', 'alien', 'shield', 'bomber'];

/* =========================================================
 * 敌人基础面板（L1 起点，实际数值由 computeEnemyGrowth 推演，ISSUE-20261028-03）
 *
 * ★ ISSUE-20261028-04：伤害改为**骰子**。
 *   旧口径 `Math.max(1, 1 + abilityMod(力))` 把三类型的伤害全截平成 1
 *   （骷髅力10→0、幽灵力8→-1、外星的远程智10→0，全被 max(1,…) 兜底），
 *   玩家挨打完全分不出是谁打的。现在按类型给不同骰子：
 *     骷髅 1d2（1–2，期望 1.5，硬碰硬最疼）
 *     幽灵 1d1（恒 1，最快但最轻）
 *     外星 远程 1d2（期望 1.5），近战 1
 *   骰子仍走全局 rng()，与既有随机序列同一来源。
 *
 *   ⚠️ 强度校准记录：首版用 1d3/1d2/1d3，实测 40 局通关层数 1.10 → 0.35（-68%），
 *   远超 issue 的 40% 回调线（单关承伤从每回合 1.09 涨到 2.0，玩家 HP10 撑不过 5 回合）。
 *   故整体下调一档，保持「骷髅 > 幽灵」的感知差（1d2 vs 1d1）而不破坏前期可玩性。
 *
 * ★ 新类型追加在数组末尾：computeEnemyGrowth 用 ENEMY_TYPES.indexOf(type) 派生种子，
 *   追加不影响前三种的 typeIdx（既有存档/种子下的成长序列保持一致）。
 * ========================================================= */
const ENEMY_STATS = {
  skeleton: {
    name: '骷髅', icon: '💀',
    // 力10 智6 敏6 感6 魅3 体10
    abilities: { str: 10, int: 6, dex: 6, wis: 6, cha: 3, con: 10 },
    prof: 1,
    dice: { melee: [1, 2] },
  },
  ghost: {
    name: '幽灵', icon: '👻',
    // 力8 智8 敏10 感8 魅6 体6
    abilities: { str: 8, int: 8, dex: 10, wis: 8, cha: 6, con: 6 },
    prof: 2,
    dice: { melee: [1, 1] },
  },
  alien: {
    name: '外星人', icon: '👾',
    // 力0 智10 敏8 感8 魅6 体8
    abilities: { str: 0, int: 10, dex: 8, wis: 8, cha: 6, con: 8 },
    prof: 2,
    dice: { melee: [1, 1], ranged: [1, 2] },
  },
  /* 盾卫（L8+）：慢、硬、不疼。AC 由 (敏4+体18)/4 → 5+5 = 10 起步，
   * 是唯一 AC 明显高于基础三类的类型，逼玩家绕后或用远程磨。 */
  shield: {
    name: '盾卫', icon: '🛡️',
    // 力10 智4 敏6 感8 魅4 体18
    abilities: { str: 10, int: 4, dex: 6, wis: 8, cha: 4, con: 18 },
    prof: 1,
    dice: { melee: [1, 2] },
  },
  /* 自爆虫（L12+）：极脆、极快，贴到身边就自爆（固定 3 伤害，不吃命中检定）。
   * 逼玩家拉开距离，而不是像对其它类型那样站着换血。 */
  bomber: {
    name: '自爆虫', icon: '💣',
    // 力6 智2 敏12 感6 魅2 体4
    abilities: { str: 6, int: 2, dex: 12, wis: 6, cha: 2, con: 4 },
    prof: 1,
    dice: { melee: [1, 1] },
    explode: 4,
  }
};

/* =========================================================
 * 类型解锁与权重（ISSUE-20261028-04）
 * 旧口径是 `ENEMY_TYPES[randInt(3)]` 均匀随机 → 第 1 关就有 33% 外星人（远程狙击），
 * 新手关挨狙且毫无节奏。现在按关卡分批解锁，前期只有近战骷髅。
 * ========================================================= */
const ENEMY_UNLOCK = [
  { from: 1,  type: 'skeleton', w: 4 },
  { from: 3,  type: 'ghost',    w: 3 },
  { from: 5,  type: 'alien',    w: 2 },
  { from: 8,  type: 'shield',   w: 2 },
  { from: 12, type: 'bomber',   w: 2 },
];

/* 按本关可用类型 + 权重抽一个。仍走全局 rng()，与旧版同一随机来源。 */
function pickEnemyType(level) {
  const pool = ENEMY_UNLOCK.filter(u => level >= u.from);
  if (pool.length === 0) return 'skeleton';
  let total = 0;
  for (const u of pool) total += u.w;
  let r = randInt(total);
  for (const u of pool) {
    if (r < u.w) return u.type;
    r -= u.w;
  }
  return pool[0].type;
}

/* 伤害骰：dice 形如 [n, sides]。未定义时退回面板常量的兜底。
 * 狂暴词缀的 +1 在掷骰之后叠加（ISSUE-20261028-05），保证「骰子本体不变、只是更疼」。 */
function rollEnemyDamage(e, kind) {
  const dd = kind === 'ranged' ? e.rangedDice : e.meleeDice;
  if (!dd) return (kind === 'ranged' ? e.rangedDmg : e.meleeDmg) + enemyDamageBonus(e);
  let total = 0;
  for (let i = 0; i < dd.n; i++) total += 1 + randInt(dd.s);
  return total + enemyDamageBonus(e);
}

/* 骰子期望值（面板展示 / AI 估算用）：n × (sides+1) / 2，四舍五入且至少 1。 */
function diceAvg(dd) {
  if (!dd) return 1;
  return Math.max(1, Math.round(dd.n * (dd.s + 1) / 2));
}
function diceLabel(dd) {
  if (!dd) return '';
  return `${dd.n}d${dd.s}`;
}

/* =========================================================
 * ★ 敌人成长推演（ISSUE-20261028-03）
 * 敌人每关都会整批重建（initLevel 里 enemies = []），没有跨关的个体身份，
 * 所以「第 6 关的敌人提了 6 次属性」不能靠运行时记忆，只能在生成时从 L1 推演到第 L 关。
 *
 * 随机源必须与全局 rng() 隔离：全局 rng() 有滚动状态，用它算成长会导致
 * 每次重绘敌人面板都换一批数值（本项目的硬要求是「意图可预判」）。
 * 因此按「本局种子 + 关卡 + 实例下标 + 类型」派生一颗固定种子。
 * ========================================================= */
function enemyGrowthRng(seed) {
  let a = (seed >>> 0) || 0x9E3779B9;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 生成第 level 关的第 idx 个敌人时，从 L1 逐关推演到 level：
 *   每关 1) 在当前「最高的 4 项」里随机 +1（排除上一次选的那项，相邻两次不重复）
 *        2) 每 3 关升 1 级 → HP 加成 += max(0, 体质调整值)（与角色升级算法同构）
 * 返回成长后的六维、HP 上限与敌人等级。 */
function computeEnemyGrowth(type, level, idx, runSeed) {
  const base = ENEMY_STATS[type].abilities;
  const a = { str: base.str, dex: base.dex, con: base.con, int: base.int, wis: base.wis, cha: base.cha };
  const typeIdx = Math.max(0, ENEMY_TYPES.indexOf(type));
  /* 种子**不含 level**：这样「第 L 关的第 i 个敌人」就是「第 1 关第 i 个敌人」连续成长 L 次的结果
   * （前缀稳定）。若把 level 混进种子，每次换关都会重掷一整条序列，同一只敌人前后不连贯。 */
  const rnd = enemyGrowthRng((((runSeed >>> 0) + idx * 977 + typeIdx * 7919) >>> 0));
  let hpBonus = 0;
  let lastKey = null;

  for (let lv = 1; lv <= level; lv++) {
    /* 1) 属性提升：候选池 = 当时最高的 4 项（并列按 ABILITY_ORDER 稳定排序），再排除上一次的选择 */
    const top4 = ABILITY_ORDER
      .filter(k => a[k] < ABILITY_CAP)
      .sort((x, y) => (a[y] - a[x]) || (ABILITY_ORDER.indexOf(x) - ABILITY_ORDER.indexOf(y)))
      .slice(0, 4)
      .filter(k => k !== lastKey);
    if (top4.length > 0) {
      const pick = top4[Math.floor(rnd() * top4.length)];
      a[pick] += 1;
      lastKey = pick;
    }
    /* 2) 每 3 关升级一次：HP 上限 += max(0, 体质调整值)，与角色 openLevelUp 完全同构 */
    if (lv % LEVELUP_EVERY_N_LEVELS === 0) hpBonus += Math.max(0, abilityMod(a.con));
  }
  return { abilities: a, maxHp: a.con + hpBonus, level: Math.floor(level / LEVELUP_EVERY_N_LEVELS), hpBonus };
}

/* =========================================================
 * ★ 词缀与精英（ISSUE-20261028-05）
 *
 * 目的：让第 13 关之后不再只是「同一件事数字变大」。词缀给敌人多一个**行为维度**，
 * 精英给单关一个**记忆点**。
 *
 * ★ 随机源：复用 enemyGrowthRng 工厂但换偏移量，**绝不用全局 rng()**
 *   （全局有滚动状态，用它会导致每次重绘面板词缀抖动，违反「意图可预判」）。
 *   种子含 level —— 与成长不同，这里不需要前缀稳定，只需要「同一 RUN_SEED 同一关一致」。
 *
 * ★ 首轮不做「分裂」词缀：它会在结算中途新增数组元素，破坏 enemyPathOrder 的落位顺序
 *   与 enemies[i].id 的稳定性（历史上「敌人永久罚站」的 bug 就源于落位顺序）。
 * ========================================================= */
const AFFIX_DEFS = {
  shield: { name: '护盾', short: '盾', icon: '🛡' },
  swift:  { name: '迅捷', short: '疾', icon: '💨' },
  frenzy: { name: '狂暴', short: '暴', icon: '🔥' },
  thorns: { name: '荆棘', short: '棘', icon: '🌵' },
};
const AFFIX_ORDER = ['shield', 'swift', 'frenzy', 'thorns'];
/* L5–L9 只放这两个（护盾/迅捷是"读得懂、不劝退"的），L10+ 再放开狂暴/荆棘 */
const AFFIX_POOL_EARLY = ['shield', 'swift'];
const AFFIX_POOL_LATE  = ['shield', 'swift', 'frenzy', 'thorns'];
const AFFIX_LATE_FROM_LEVEL = 10;
const AFFIX_CHANCE_EARLY = 0.30;
const AFFIX_CHANCE_LATE  = 0.45;

const ELITE_FROM_LEVEL = 5;      // L5 起每关至少 1 个精英
const ELITE_HP_MUL = 1.5;        // 精英 HP 上限 ×1.5（向上取整）
const ELITE_AFFIX_COUNT = 2;     // 精英必带 2 个词缀
const AFFIX_SEED_OFFSET = 104729;

/* 词缀/精英的专用随机工厂（与成长序列互不干扰） */
function affixRng(level, idx, runSeed, tag) {
  return enemyGrowthRng((((runSeed >>> 0) + level * 613 + idx * 3571 + tag * 8191 + AFFIX_SEED_OFFSET) >>> 0));
}

/* 本关精英是第几只（-1 = 本关没有精英）。确定性：同 RUN_SEED 同一关恒定。 */
function eliteIndexFor(level, count, runSeed) {
  if (level < ELITE_FROM_LEVEL || count <= 0) return -1;
  const r = affixRng(level, 0, runSeed, 1)();
  return Math.min(count - 1, Math.floor(r * count));
}

/* 生成第 level 关第 idx 只敌人的词缀方案：{ isElite, affixes[] } */
function rollEnemyAffixPlan(level, idx, count, runSeed) {
  const isElite = idx === eliteIndexFor(level, count, runSeed);
  const late = level >= AFFIX_LATE_FROM_LEVEL;
  const pool = (late ? AFFIX_POOL_LATE : AFFIX_POOL_EARLY).slice();
  const rnd = affixRng(level, idx, runSeed, 2);
  let want;
  if (isElite) want = ELITE_AFFIX_COUNT;
  else want = rnd() < (late ? AFFIX_CHANCE_LATE : AFFIX_CHANCE_EARLY) ? 1 : 0;
  want = Math.min(want, pool.length);
  const affixes = [];
  for (let i = 0; i < want; i++) affixes.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  return { isElite, affixes };
}

function enemyHasAffix(e, id) {
  return !!(e && e.affixes && e.affixes.indexOf(id) >= 0);
}
/* 狂暴：HP 严格低于一半时才生效（= 一半时还不生效，边界明确好测） */
function enemyIsFrenzied(e) {
  return enemyHasAffix(e, 'frenzy') && e.hp > 0 && e.hp * 2 < e.maxHp;
}
/* 实际移动力：基础 + 迅捷(+2) + 狂暴(+2)。AI 寻路与面板都读这个，别直接读 e.move。 */
function enemyMoveOf(e) {
  if (!e) return 1;
  let m = e.move || 1;
  if (enemyHasAffix(e, 'swift')) m += 2;
  if (enemyIsFrenzied(e)) m += 2;
  return m;
}
function enemyDamageBonus(e) {
  return enemyIsFrenzied(e) ? 1 : 0;
}

/* 词缀给玩家看的短标签，如「精英 🛡盾 💨疾」 */
function enemyAffixLabel(e) {
  if (!e || !e.affixes || e.affixes.length === 0) return '';
  return e.affixes.map(id => `${AFFIX_DEFS[id].icon}${AFFIX_DEFS[id].short}`).join(' ');
}

/* 玩家对敌人造成伤害的统一入口（护盾词缀在这里吃掉第一击）。
 * 返回实际扣掉的血量（0 = 被护盾完全吸收）。 */
function enemyTakeDamage(e, dmg) {
  if (!e || dmg <= 0) return 0;
  if (e.shieldLeft > 0) {
    e.shieldLeft -= 1;
    floatText(e.x, e.y, '护盾 -0', '#7fd1ff');
    ringFx(e.x, e.y, '#7fd1ff');
    log(`🛡 ${ENEMY_STATS[e.type].name}${e.id + 1} 的护盾吸收了 ${dmg} 点伤害，护盾破碎。`);
    refreshUnits();
    return 0;
  }
  e.hp -= dmg;
  return dmg;
}

/* 荆棘：被近战命中后反弹 1 点给玩家（被打死的不反弹）。
 * 返回 true 表示玩家因此阵亡。 */
function enemyThornsReflect(e) {
  if (!enemyHasAffix(e, 'thorns')) return false;
  if (!e.alive || e.hp <= 0) return false;          // 这一击已经打死它 → 不反弹
  if (!player || !player.alive) return false;
  const res = damagePlayer(1, '荆棘');
  if (res.dmg > 0) {
    log(`🌵 ${ENEMY_STATS[e.type].name}${e.id + 1} 的荆棘反弹 1 点伤害。`);
    floatText(player.x, player.y, '荆棘 -1', '#c77dff');
    updateStats();
  } else if (res.shielded) {
    log(`🌵 荆棘反弹被护盾抵消。`);
  }
  if (player.hp <= 0) { player.alive = false; refreshUnits(); endGame(); return true; }
  return false;
}

/* =========================================================
 * ★ 升级与奖励池（buff）
 * 升级由经验驱动（ISSUE-20261028-10）：通关得经验，本关掉血越少经验越多，经验满即升级。
 * 升级时：HP 上限 + 体质加值、回满血，并从奖励池 3 选 1。
 * LEVELUP_EVERY_N_LEVELS 现在**只服务敌人成长**（enemies.js），玩家侧不再引用。
 * ========================================================= */
const LEVELUP_EVERY_N_LEVELS = 3;
let heroLevel = 1;
let playerShield = 0;                 // 药枚：护盾层数（抵消一次任意伤害）
let levelUpOpen = false;
let lastLevelUpConMod = 0;
/* ===== 玩家经验制（ISSUE-20261028-10） =====
 * xp            当前等级已累积的经验（升级时按阈值扣减）
 * pendingLevelUps 待结算的升级次数（通关时按 XP 一次算好，逐次弹奖励）
 *                旧变量 levelUpPending（布尔）已废弃：布尔装不下「一次连升 2 级」。
 * levelStartHp  本关开始时的血量（player.hp），失血口径的左端
 * levelActions  本关点了几次「开始行动」——**只用于日志**，不参与经验计算 */
let xp = 0;
let pendingLevelUps = 0;
let levelStartHp = 0;
let levelActions = 0;

/* 升到下一级所需经验（heroLevel 超出表长时按表尾 +100 递增） */
function xpThresholdForLevel(lv) {
  if (lv < XP_TABLE.length) return XP_TABLE[lv];
  return XP_TABLE[XP_TABLE.length - 1] + (lv - (XP_TABLE.length - 1)) * 100;
}
/* 该关「允许失血」的基准：按本关开始血量缩放，而不是 maxHp。
 * 挂 maxHp 会出现退化玩法：带 1 HP 进关 → 物理上掉不了血 → 每关都算零失血 → 永久满效率。 */
function xpDamageRef(startHp) {
  const raw = Math.round(startHp * XP_DMG_REF_RATIO);
  return Math.max(XP_DMG_REF_MIN, Math.min(XP_DMG_REF_MAX, raw));
}
/* 单关经验：hpLoss 取 0 下限（关内吃 ❤️ / 🩸 净回血时会算成负数，
 * 不夹会让 efficiency > ref，经验突破 24 上限，保底/上限两条算术保证同时失效）。 */
function computeLevelXp(startHp, endHp) {
  const hpLoss = Math.max(0, startHp - endHp);
  const ref = xpDamageRef(startHp);
  const eff = Math.max(0, Math.min(XP_EFF_CAP, ref - hpLoss));
  return { hpLoss, ref, eff, gain: XP_CLEAR_BASE + eff * XP_PER_STEP };
}
/* 通关时按经验排队升级次数（heroLevel 由 openLevelUp 逐次推进，这里只扣经验） */
function queueLevelUps() {
  let n = 0;
  while (n < XP_MAX_LEVELUPS_PER_CLEAR && xp >= xpThresholdForLevel(heroLevel + n)) {
    xp -= xpThresholdForLevel(heroLevel + n);
    n += 1;
  }
  pendingLevelUps = n;
  return n;
}
// buff 层数统计（同一 buff 可重复获得，效果累加）

  { id: 'pill',   name: '药枚', icon: '💊', desc: '每关开始时获得 1 层护盾（抵消一次任意伤害）' },
  { id: 'scout',  name: '探测先锋', icon: '🔭', desc: '每回合动作上限 +1（可多放一次攻击/技能/闪避）' },
];
const BUFF_BY_ID = Object.fromEntries(BUFF_POOL.map(b => [b.id, b]));

/* 香草沙士：每次获得技力时 30% 额外 +1（返回额外点数） */

}

/* 统一的玩家受伤入口：有护盾（药枚）先消耗 1 层抵消整次伤害。
   返回 { dmg: 实际掉血, shielded: 是否被护盾抵消, immune: 调试无敌 } */
function damagePlayer(amount, label = '') {
  if (debugMode) return { dmg: 0, shielded: false, immune: true };
  if (!player || !player.alive) return { dmg: 0, shielded: false, immune: false };
  if (amount <= 0) return { dmg: 0, shielded: false, immune: false };
  if (playerShield > 0) {
    playerShield -= 1;
    floatText(player.x, player.y, '护盾抵消', '#ffffff');
    ringFx(player.x, player.y, '#ffffff');
    log(`🛡️ 护盾抵消了${label ? `「${label}」的` : ''}${amount} 点伤害（剩余 ${playerShield} 层）。`);
    updateStats();
    return { dmg: 0, shielded: true, immune: false };
  }
  player.hp -= amount;
  return { dmg: amount, shielded: false, immune: false };
}

/* src: src/rules/rng.js */
/* P0.1-4 拆分 · 20261028b 基线 847-873 行 · mulberry32 可播种随机（RNG_SEED / RUN_SEED） */
/* =========================================================
 * ★ 可播种伪随机（mulberry32）
 * 原来直接用 Math.random，导致同一份输入无法复现同一局：
 * 联机时两端各掷各的骰子，结果必然对不上。
 * 现在所有随机都走 rng()，单人用时间播种（行为与旧版一致），
 * 联机时由服务器下发种子，两端 seedRng(同一颗) 即可完全一致。
 * ========================================================= */
let RNG_SEED = 1;
/* ★ 本局初始种子（ISSUE-20261028-03 新增）。
 * 敌人成长要「同一局同一关永远算出同一套面板」，所以需要一颗**不滚动**的种子；
 * RNG_SEED 每一次 rng() 都在变，不能当种子用，必须在 seedRng() 里单独记一份。 */
let RUN_SEED = 1;
function seedRng(s) {
  RNG_SEED = (s >>> 0) || 0x9E3779B9;
  if (RNG_SEED === 0) RNG_SEED = 0x9E3779B9;
  RUN_SEED = RNG_SEED;                       // ← 锁定本局种子（关卡内不会重掷）
}
function rng() {
  RNG_SEED = (RNG_SEED + 0x6D2B79F5) | 0;
  let t = RNG_SEED;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
seedRng(Date.now());   // 单人默认：时间播种

function randInt(n) { return Math.floor(rng() * n); }

/* src: src/net/pvp-core.js */
/* P0.1-4 拆分 · 20261028b 基线 875-1062 行 · PVP-CORE 联机结算核心（勿在注释中复写区块起止标记） */
/* ==== PVP-CORE BEGIN ====
 * 联机对战的结算核心：纯函数，不碰 DOM、不读全局变量、不用全局 rng()。
 *
 * 为什么必须是纯函数：两个客户端要用「同一份代码 + 同一颗种子 + 同一份计划」
 * 算出「同一串事件」，否则画面会各说各话。任何对全局状态的依赖都会破坏这个等式。
 *
 * 约定：
 *   - slot 0 = 房主，slot 1 = 挑战者，与「谁是本机」无关（对称，不按自己优先排序）。
 *   - 计划格式 { path: [[x,y],...], attackIndices: [k,...] }，path[0] 是起点格。
 *   - 返回 { units, events, winner }，winner 为 -1 / 0 / 1。
 *   - 单测脚本按 PVP-CORE 标记切片 eval，勿在此区间引用外部标识符。
 * ==== PVP-CORE BEGIN ==== */
//#PVP_CORE_START
function pvpRng(seed) {
  let a = (seed >>> 0) || 0x9E3779B9;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pvpMod(score) { return Math.floor((score - 10) / 2); }

function pvpMakeUnit(chars, charId, slot, x, y) {
  const a = { ...chars[charId].abilities };
  return {
    slot: slot, charId: charId, x: x, y: y,
    abilities: a,
    maxHp: a.con, hp: a.con,
    ac: 5 + Math.floor((a.dex + a.con) / 4),
    meleeDmg: Math.max(1, 1 + pvpMod(a.str)),
    rangedDmg: Math.max(1, 1 + pvpMod(a.int)),
    ranged: chars[charId].attackType === 'ranged',
    prof: 2,
    alive: true,
    dodging: false,
    facing: { dx: slot === 0 ? 1 : -1, dy: 0 },
  };
}

function pvpCheb(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }
function pvpSame(a, b) { return !!a && !!b && a.x === b.x && a.y === b.y; }
function pvpRangeOf(u) { return u.ranged ? 3 : 1; }
function pvpDmgOf(u) { return u.ranged ? u.rangedDmg : u.meleeDmg; }
/* 相杀按「趁乱打击」算：远程角色贴身只有 1 点保底，近战用近战伤害 —— 与单人规则一致 */
function pvpClashDmgOf(u) { return u.ranged ? 1 : u.meleeDmg; }

function pvpRoll(r, mod, prof, ac) {
  const d20 = 1 + Math.floor(r() * 20);
  const total = d20 + mod + prof;
  if (d20 === 20) return { d20: d20, total: total, hit: true, crit: true };
  if (d20 === 1) return { d20: d20, total: total, hit: false, crit: false };
  return { d20: d20, total: total, hit: total >= ac, crit: false };
}

function pvpResolveTurn(chars, unitsIn, plans, seed) {
  const r = pvpRng(seed);
  const u = [JSON.parse(JSON.stringify(unitsIn[0])), JSON.parse(JSON.stringify(unitsIn[1]))];
  const plansSafe = [plans[0] || {}, plans[1] || {}];
  const path = [plansSafe[0].path || [], plansSafe[1].path || []];
  const nodes = [plansSafe[0].attackIndices || [], plansSafe[1].attackIndices || []];
  const idx = [1, 1];
  const stopped = [false, false];
  const events = [];
  let winner = -1;

  function hurt(s, dmg) {
    const t = u[s];
    t.hp -= dmg;
    if (t.hp <= 0) { t.hp = 0; t.alive = false; if (winner < 0) winner = 1 - s; }
  }

  function tryAttack(s) {
    const me = u[s], foe = u[1 - s];
    if (!me.alive || !foe.alive) return;
    const ac = foe.ac + (foe.dodging ? 3 : 0);
    if (pvpCheb(me, foe) > pvpRangeOf(me)) {
      events.push({ t: 'whiff', slot: s, ac: ac });
      return;
    }
    const mod = pvpMod(me.abilities[me.ranged ? 'int' : 'str']);
    const res = pvpRoll(r, mod, me.prof, ac);
    if (!res.hit) {
      events.push({ t: 'miss', slot: s, d20: res.d20, total: res.total, ac: ac });
      return;
    }
    let dmg = pvpDmgOf(me);
    if (res.crit) dmg *= 2;
    hurt(1 - s, dmg);
    events.push({ t: 'hit', slot: s, d20: res.d20, total: res.total, ac: ac,
                  crit: res.crit, dmg: dmg, hp: u[1 - s].hp });
    if (!u[1 - s].alive) events.push({ t: 'death', slot: 1 - s });
  }

  function clash(cell) {
    const d0 = u[1].alive ? pvpClashDmgOf(u[1]) * 2 : 0;
    const d1 = u[0].alive ? pvpClashDmgOf(u[0]) * 2 : 0;
    if (u[0].alive) hurt(0, d0);
    if (u[1].alive) hurt(1, d1);
    events.push({ t: 'clash', cell: { x: cell.x, y: cell.y },
                  dmg: [d0, d1], hp: [u[0].hp, u[1].hp] });
    if (!u[0].alive) events.push({ t: 'death', slot: 0 });
    if (!u[1].alive) events.push({ t: 'death', slot: 1 });
    /* 相杀是同归于尽：两人都倒 = 平局，不能因为「谁先被扣血」就判另一方赢 */
    if (!u[0].alive && !u[1].alive) winner = -2;
    stopped[0] = true; stopped[1] = true;
  }

  // 行动节点 0：原地攻击（对应单人的 pendingAttack）
  for (let s = 0; s < 2; s++) {
    if (nodes[s].indexOf(0) >= 0) tryAttack(s);
  }

  let guard = 0;
  while (!(stopped[0] && stopped[1]) && guard++ < 80) {
    const dest = [null, null], wait = [false, false], want = [false, false];

    for (let s = 0; s < 2; s++) {
      if (stopped[s] || !u[s].alive || idx[s] >= path[s].length) { stopped[s] = true; continue; }
      const p = path[s][idx[s]];
      // 非法步（越格传送 / 缺字段）直接终止该方移动，避免两端因坏计划分叉
      if (!p || typeof p.x !== 'number' || typeof p.y !== 'number' || pvpCheb(u[s], p) > 1) {
        stopped[s] = true;
        events.push({ t: 'invalid', slot: s });
        continue;
      }
      dest[s] = p;
      if (pvpSame(p, u[s])) { wait[s] = true; }
      else { want[s] = true; }
    }

    if (stopped[0] && stopped[1]) break;

    // 等待步 = 闪避（每回合一次，AC +3）
    for (let s = 0; s < 2; s++) {
      if (wait[s]) {
        idx[s]++;
        if (u[s].alive && !u[s].dodging) {
          u[s].dodging = true;
          events.push({ t: 'dodge', slot: s, ac: u[s].ac + 3 });
        }
      }
    }

    const m0 = want[0] && !stopped[0];
    const m1 = want[1] && !stopped[1];

    if (m0 && m1 && pvpSame(dest[0], dest[1])) {
      clash(dest[0]);
      break;
    }
    if (m0 && m1 && pvpSame(dest[0], u[1]) && pvpSame(dest[1], u[0])) {
      clash(dest[0]);
      break;
    }

    // 同时推进：目的地被「本 tick 结束后仍占着的人」挡住则停下
    const otherEnd = [m0 ? dest[0] : u[0], m1 ? dest[1] : u[1]];
    const arrivals = [];
    for (let s = 0; s < 2; s++) {
      if (!(s === 0 ? m0 : m1)) { continue; }
      if (pvpSame(dest[s], otherEnd[1 - s])) {
        stopped[s] = true;
        events.push({ t: 'blocked', slot: s, at: { x: u[s].x, y: u[s].y } });
        continue;
      }
      const from = { x: u[s].x, y: u[s].y };
      u[s].x = dest[s].x; u[s].y = dest[s].y;
      const dx = Math.sign(u[s].x - from.x), dy = Math.sign(u[s].y - from.y);
      if (dx || dy) u[s].facing = { dx: dx, dy: dy };
      const arrival = idx[s];
      idx[s]++;
      events.push({ t: 'move', slot: s, from: from, to: { x: u[s].x, y: u[s].y } });
      arrivals.push({ slot: s, arrival: arrival });
    }

    for (const a of arrivals) {
      if (nodes[a.slot].indexOf(a.arrival) >= 0) tryAttack(a.slot);
    }

    if (!u[0].alive || !u[1].alive) { stopped[0] = true; stopped[1] = true; }
  }

  return { units: u, events: events, winner: winner };
}
//#PVP_CORE_END

/* P0.1-4 拆分 · 20261028b 基线 1063-1108 行 · 距离工具与战斗日志系统 */
function dist(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
function cheb(a, b) { return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)); }
function key(x, y) { return x + ',' + y; }
/* 战斗日志：按类型着色，提升可读性。logLines 仍按行存字符串（兼容关卡切换时的切片逻辑）。 */
const LOG_MAX = 600;          // 日志缓冲上限（防止长局内存无限增长）
const LOG_VIEW_MAX = 160;     // 日志可视区 DOM 行数上限
function autoLogType(msg) {
  if (msg == null || msg === '') return 'sep';
  if (/[=＝]{3,}|第\s*\d+\s*关/.test(msg)) return 'sys';
  if (/🥤|香草沙士|奖励|升级|热水壶|护盾|💊/.test(msg)) return 'buff';
  if (/闪避|躲避/.test(msg)) return 'dodge';
  if (/击杀|被击败|击败|倒下|阵亡|💀|死亡/.test(msg)) return 'kill';
  if (/⚡|✦|技力|技能|发动|就绪|高效冲击|岩崩|精神爆发|不稳定血浆|蓄力/.test(msg)) return 'skill';
  if (/回复|恢复|治疗|❤|回血|回复HP/.test(msg)) return 'heal';
  if (/⚠|警告|错误|失败|未命中|挥空|免疫|禁止|取消|无法|不能/.test(msg)) return 'warn';
  if (/命中|造成|伤害|暴击/.test(msg)) return 'damage';
  return 'info';
}
function makeLogLine(msg) {
  const div = document.createElement('div');
  div.className = 'logline log-' + autoLogType(msg);
  div.textContent = msg;
  return div;
}
function renderLogAll() {
  logEl.innerHTML = '';
  for (const m of logLines) logEl.appendChild(makeLogLine(m));
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(keepN) {
  logLines = keepN && keepN > 0 ? logLines.slice(-keepN) : [];
  renderLogAll();
}
function log(msg) {
  logLines.push(msg);
  if (logLines.length > LOG_MAX) logLines = logLines.slice(-LOG_MAX);
  logEl.appendChild(makeLogLine(msg));
  while (logEl.childNodes.length > LOG_VIEW_MAX) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function inBounds(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }
function findLastIndex(arr, predicate) {
  for (let i = arr.length - 1; i >= 0; i--) if (predicate(arr[i], i)) return i;
  return -1;
}

/* P0.1-4 机械拆分：从 game.html（20261028b 基线）第 536-609 行原样搬移

/* =========================================================

function gainFencerSp(n = 1) {
  if (selectedChar !== 'fencer') return;
  if (fencerSp >= FENCER_SP_MAX) return;
  const sass = sassExtraSp();
  if (sass) log('🥤 香草沙士：额外获得 1 点技力！');
  const oldSp = fencerSp;
  fencerSp = Math.min(FENCER_SP_MAX, fencerSp + n + sass);
  if (oldSp < FENCER_SP_MAX && fencerSp >= FENCER_SP_MAX) {
    log(`⚡ 泥岩技力已满（${FENCER_SP_MAX}/${FENCER_SP_MAX}）！「岩崩锤」就绪：反击状态下免疫所有攻击；下次反击触发眩晕+回复1/2HP。`);
    if (player && player.alive) floatText(player.x, player.y, '岩崩锤就绪！', '#ffd700');
  }
}

/* =========================================================
 * DnD 六属性系统
 * ========================================================= */
function abilityMod(score) { return Math.floor((score - 10) / 2); }
function abilityLabel(score) {
  const m = abilityMod(score);
  return score + (m >= 0 ? '(+' + m + ')' : '(' + m + ')');
}
function computeAC(abilities) {
  return 5 + Math.floor((abilities.dex + abilities.con) / 4);
}
function attackRoll(attackerMod, prof, targetAC) {
  const d20 = 1 + randInt(20);
  const total = d20 + attackerMod + prof;
  if (d20 === 20) return { roll: d20, total, hit: true, nat20: true, nat1: false, mod: attackerMod, prof };
  if (d20 === 1) return { roll: d20, total, hit: false, nat20: false, nat1: true, mod: attackerMod, prof };
  return { roll: d20, total, hit: total >= targetAC, nat20: false, nat1: false, mod: attackerMod, prof };
}
function attackRollDisadvantage(attackerMod, prof, targetAC) {
  const a1 = attackRoll(attackerMod, prof, targetAC);
  const a2 = attackRoll(attackerMod, prof, targetAC);
  const chosen = a1.total <= a2.total ? a1 : a2;
  const other  = a1.total <= a2.total ? a2 : a1;
  return {
    ...chosen,
    otherRoll: other.roll,
    otherTotal: other.total,
    disadvantage: true
  };
}
function fmtRoll(atk, ac) {
  if (atk.disadvantage) {
    return `劣势 d20=${atk.roll}${atk.mod >= 0 ? '+' : ''}${atk.mod}${atk.prof ? '+熟' + atk.prof : ''}=${atk.total} / d20=${atk.otherRoll}${atk.mod >= 0 ? '+' : ''}${atk.mod}${atk.prof ? '+熟' + atk.prof : ''}=${atk.otherTotal}，取低${atk.hit ? '≥' : '<'}AC${ac}`;
  }
  return `d20=${atk.roll}${atk.mod >= 0 ? '+' : ''}${atk.mod}${atk.prof ? '+熟' + atk.prof : ''}=${atk.total}${atk.hit ? '≥' : '<'}AC${ac}`;
}
function recomputePlayerDerivedStats() {
  const a = playerStats.abilities;
  playerStats.maxHp = a.con + BASE_HP_BONUS + levelHpBonus + buffHpBonus();
  playerStats.move = Math.max(1, Math.floor(a.dex / 2));
  playerStats.meleeDmg = Math.max(1, 1 + abilityMod(a.str)) + buffMeleeBonus();
  playerStats.rangedDmg = Math.max(1, 1 + abilityMod(a.int));
  playerStats.visibleSteps = 1 + Math.max(0, abilityMod(a.wis));
  playerStats.ac = computeAC(a);
  /* ISSUE-20261028-07：熟练加值改为绑定**角色等级**，每级 +1。
   * 旧口径 `4 + ⌊(关卡-1)/5⌋` 与 heroLevel（每 3 关 +1）脱钩，升级当关玩家看不到熟练变化；
   * 新口径起手仍为 +4（heroLevel=1 → +4），第 1–3 关手感与旧版完全一致。
   * 实测（每方案 21 万次 attackRoll）：对当时真实敌人 AC，每级 +2 会在第 4 关就全类型封顶 95%，
   * 命中机制失效，故取 +1。 */
  playerStats.prof = 4 + Math.max(0, heroLevel - 1);
  playerStats.meleeProf = playerStats.profMelee ? playerStats.prof : 0;
  playerStats.rangedProf = playerStats.profRanged ? playerStats.prof : 0;
}

/* ★ 以下三个只读「基础面板（L1）」。
 * 运行时数值请一律用 computeEnemyGrowth(type, level, idx, RUN_SEED) —— 见上方 ISSUE-20261028-03。
 * 保留它们是为了让「基础值」的语义还查得到，不要再拿它们给场上单位赋值。 */
function getEnemyAbilities(type) { return { ...ENEMY_STATS[type].abilities }; }
function getEnemyProf(type) { return ENEMY_STATS[type].prof; }
function computeEnemyHp(type) { return ENEMY_STATS[type].abilities.con; }
function computeEnemyMove(type) {
  return Math.max(1, Math.floor(ENEMY_STATS[type].abilities.dex / 2));
}

/* src: src/ui/radar.js */
/* P0.1-4 拆分 · 20261028b 基线 1185-1350 行 · 六维雷达图 drawRadar */
/* =========================================================
 * 六维雷达图
 * ========================================================= */
function drawRadar() {
  if (!radarCanvas) return;
  const ctx = radarCanvas.getContext('2d');
  if (!ctx) return;
  radarLabelHits = [];
  const dpr = window.devicePixelRatio || 1;
  const cssW = radarCanvas.clientWidth || 120;
  const cssH = radarCanvas.clientHeight || 120;
  if (radarCanvas.width !== Math.round(cssW * dpr) || radarCanvas.height !== Math.round(cssH * dpr)) {
    radarCanvas.width = Math.round(cssW * dpr);
    radarCanvas.height = Math.round(cssH * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const cx = cssW / 2, cy = cssH / 2;
  const n = ABILITY_ORDER.length;
  const max = ABILITY_CAP;
  // 轴上是 2 字全称，±30° 那两根轴最容易被裁 → 按横向余量反推半径
  const labelFont = Math.max(8, Math.round(Math.min(cssW, cssH) / 13));
  const pad = 3;
  const R = Math.min(
    Math.min(cssW, cssH) / 2 - labelFont * 0.95 - pad,
    (Math.min(cssW, cssH) / 2 - labelFont * 2.45) / 0.87 - pad
  );

  let abilities = null;
  if (phase === PHASE.CHAR_SELECT) {
    if (selectedCandidate) abilities = CHARACTERS[selectedCandidate.id].abilities;
  } else if (player) {
    abilities = player.abilities;
  } else if (playerStats && playerStats.abilities) {
    abilities = playerStats.abilities;
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (let ring = 1; ring <= 3; ring++) {
    const r = R * ring / 3;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.stroke();
  }

  if (abilities) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const k = ABILITY_ORDER[i];
      const v = Math.max(0, Math.min(max, abilities[k] || 0));
      const r = R * v / max;
      const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(78, 205, 196, 0.30)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(78, 205, 196, 0.95)';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // 最高属性（并列时都算）：数值用与「熟练项」相同的绿色，其余与属性名同色
    const LABEL_NORMAL = '#9aa';
    const LABEL_PROF = '#8fe28a';
    let topV = -1;
    for (let i = 0; i < n; i++) {
      const v = Math.max(0, Math.min(max, abilities[ABILITY_ORDER[i]] || 0));
      if (v > topV) topV = v;
    }

    // 顶点：小圆点 + 该属性的数值（沿轴外推，空间不足时往内收）
    const vFont = Math.max(8, Math.round(labelFont * 1.05));
    ctx.font = `bold ${vFont}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const k = ABILITY_ORDER[i];
      const v = Math.max(0, Math.min(max, abilities[k] || 0));
      const r = R * v / max;
      const a = -Math.PI / 2 + (Math.PI * 2 * i) / n;
      const ca = Math.cos(a), sa = Math.sin(a);
      const px = cx + ca * r, py = cy + sa * r;
      ctx.beginPath();
      ctx.arc(px, py, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = '#4ecdc4';
      ctx.fill();
      const outward = r + vFont * 1.25 < R;
      const off = outward ? vFont * 0.72 : -vFont * 1.0;
      const tx = px + ca * off, ty = py + sa * off;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(10,10,18,0.92)';
      ctx.strokeText(String(v), tx, ty);
      ctx.fillStyle = (v === topV) ? LABEL_PROF : LABEL_NORMAL;
      ctx.fillText(String(v), tx, ty);
    }
  }

  // 轴名：2 字全称，按左右方向对齐向外排版（避免被画布裁切）
  ctx.font = `bold ${labelFont}px system-ui, sans-serif`;
  ctx.textBaseline = 'middle';
  const canAlloc = !!(playerStats && playerStats.abilityPoints > 0 && (phase === PHASE.PLANNING || phase === PHASE.LEVELCLEAR));
  for (let i = 0; i < n; i++) {
    const k = ABILITY_ORDER[i];
    const ang = -Math.PI / 2 + (Math.PI * 2 * i) / n;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const dist = R + pad + labelFont * 0.2;
    const lx = cx + ca * dist, ly = cy + sa * dist;
    ctx.textAlign = ca > 0.2 ? 'left' : (ca < -0.2 ? 'right' : 'center');
    const inSelect = phase === PHASE.CHAR_SELECT;
    const profMelee = inSelect ? !!(selectedCandidate && CHARACTERS[selectedCandidate.id].profMelee) : !!(playerStats && playerStats.profMelee);
    const profRanged = inSelect ? !!(selectedCandidate && CHARACTERS[selectedCandidate.id].profRanged) : !!(playerStats && playerStats.profRanged);
    const profMark = abilities && ((k === 'str' && profMelee) || (k === 'int' && profRanged));
    let col = profMark ? '#8fe28a' : '#9aa';
    if (canAlloc) col = '#cfe6ff';           // 可加点时整体提亮，提示可点击
    ctx.fillStyle = col;
    ctx.fillText(ABILITY_FULL[k], lx, ly);
    radarLabelHits.push({ k, x: lx, y: ly, r: labelFont });
    // 可加点且未达上限：在属性名外画一圈金色方框，明确「点我加点」
    if (canAlloc && abilities && abilities[k] < ABILITY_CAP) {
      const tw = ctx.measureText(ABILITY_FULL[k]).width;
      const padX = Math.max(3, labelFont * 0.34);
      const padY = Math.max(2, labelFont * 0.22);
      const bw = tw + padX * 2;
      const bh = labelFont + padY * 2;
      let bx = (ca > 0.2) ? (lx - padX)
             : (ca < -0.2) ? (lx - tw - padX)
             : (lx - tw / 2 - padX);
      bx = Math.max(1, Math.min(cssW - 1 - bw, bx));      // 贴边时收进画布，避免被裁
      let by = ly - bh / 2;
      by = Math.max(1, Math.min(cssH - 1 - bh, by));
      const rr = Math.min(4, bh / 2);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(bx + rr, by);
      ctx.lineTo(bx + bw - rr, by);
      ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + rr);
      ctx.lineTo(bx + bw, by + bh - rr);
      ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - rr, by + bh);
      ctx.lineTo(bx + rr, by + bh);
      ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - rr);
      ctx.lineTo(bx, by + rr);
      ctx.quadraticCurveTo(bx, by, bx + rr, by);
      ctx.stroke();
    }
  }

  // 等级已移到角色卡「名字右侧」显示（金色 Lv.N），六维图中心不再绘制，保持留白。
}

/* src: src/rules/path.js */
/* P0.1-4 拆分 · 20261028b 基线 1352-1564 行 · 路径判定 / 冲锋计算 / 步数统计 */
/* =========================================================
 * 基础工具
 * ========================================================= */
function isWalkable(x, y) {
  if (phase === PHASE.CHAR_SELECT) return inBounds(x, y) && selMap[y][x] === 0;
  return inBounds(x, y) && map[y][x] === 0;
}
function faceToward(from, to) {
  const dx = to.x - from.x, dy = to.y - from.y;
  if (dx === 0 && dy === 0) return { dx: 1, dy: 0 };
  if (Math.abs(dx) >= Math.abs(dy)) return { dx: Math.sign(dx), dy: 0 };
  return { dx: 0, dy: Math.sign(dy) };
}
function isFacingTarget(unit, target) {
  if (!unit || !unit.facing) return false;
  const dx = Math.sign(target.x - unit.x);
  const dy = Math.sign(target.y - unit.y);
  if (dx === 0 && dy === 0) return false;
  return dx === unit.facing.dx && dy === unit.facing.dy;
}
function isInFacingCone(unit, target) {
  if (!unit || !unit.facing) return false;
  const dx = Math.sign(target.x - unit.x);
  const dy = Math.sign(target.y - unit.y);
  if (dx === 0 && dy === 0) return false;
  if (unit.facing.dx !== 0) {
    return dx === unit.facing.dx && Math.abs(dy) <= 1;
  } else {
    return dy === unit.facing.dy && Math.abs(dx) <= 1;
  }
}
function previewFacing(path, startX, startY) {
  let face = null;
  let px = startX, py = startY;
  for (const p of path) {
    const dx = Math.sign(p.x - px);
    const dy = Math.sign(p.y - py);
    if (dx !== 0 || dy !== 0) face = { dx, dy };
    px = p.x; py = p.y;
  }
  return face;
}
function calcPathSignature() {
  if (!player || !enemies) return '';
  // 修复：签名必须包含玩家正在规划的路径。
  // 原来只放玩家坐标，玩家画/撤回路径时坐标没变 → 签名不变 → 敌人意图永远不重算，
  // 于是「预判玩家路径」这套逻辑完全没有触发机会。
  const pathSig = playerPath.map(p => p.x + ',' + p.y).join('>');
  return player.x + ',' + player.y + '|' + pathSig + '|' +
    enemies.map(e => e.alive ? key(e.x, e.y) : 'x').join(';');
}

/* 风笛技力：路径里每段「同方向连续 ≥2 步」贡献该段长度（1 步不算直线，得 0）。
 * 等待（同格重复）和转向都会断开一段。
 *   wdds → w(1=0) + d(2=2) + s(1=0) = 2 点
 *   wwwd → w(3=3) + d(1=0)        = 3 点
 */
function pathSpGain(path) {
  if (!path || path.length < 3) return 0;
  let gain = 0, runDx = 0, runDy = 0, runLen = 0;
  const flush = () => { if (runLen >= 2) gain += runLen; runLen = 0; };
  for (let i = 1; i < path.length; i++) {
    const dx = Math.sign(path[i].x - path[i - 1].x);
    const dy = Math.sign(path[i].y - path[i - 1].y);
    if (dx === 0 && dy === 0) { flush(); runDx = 0; runDy = 0; continue; }  // 等待：断开
    if (runLen > 0 && dx === runDx && dy === runDy) { runLen++; }
    else { flush(); runDx = dx; runDy = dy; runLen = 1; }
  }
  flush();
  return gain;
}
/* 规划时预览用的技力（真实值 + 当前路径将获得的量，封顶 5） */
function wheelchairPreviewSp() {
  if (selectedChar !== 'wheelchair') return wheelchairSp;
  return Math.min(WHEELCHAIR_SP_MAX, wheelchairSp + pathSpGain(playerPath));
}
/* 冲锋模式：技力满 5 时，路径里第一个「移动步上的技能节点」就是冲锋触发点，返回其路径下标。
 * sp 省略时用「预览技力」（真实值 + 当前路径将获得的量）；结算阶段传真实值，避免重复计入增量。 */
function findChargeSkillIndex(path, sp) {
  const spNow = (sp === undefined) ? wheelchairPreviewSp() : sp;
  if (!path || spNow < WHEELCHAIR_SP_MAX) return null;
  const idxs = [...skillIndices]
    .filter(i => i > 0 && i < path.length)
    .filter(i => !(path[i].x === path[i - 1].x && path[i].y === path[i - 1].y))
    .sort((a, b) => a - b);
  return idxs.length ? idxs[0] : null;
}
function pathHasCharge(path, sp) { return findChargeSkillIndex(path, sp) !== null; }
/* 规划期预览：若在当前路径上发动冲锋，额度（= 剩余移动步数）是多少（ISSUE-20261028-01）。
 * 返回 null 表示当前不满足发动条件；返回 0 表示额度不够、发不动。 */
function previewChargeBudget(path) {
  const p = path || playerPath;
  if (!p || !player) return null;
  const idx = findChargeSkillIndex(p, wheelchairPreviewSp());
  if (idx === null) return null;
  const usedMove = countMoveSteps(p.slice(0, idx + 1));
  return Math.max(0, (player.move || 1) - usedMove);
}
/* 生成冲锋段。maxSteps = 本回合剩余移动步数（ISSUE-20261028-01）：
 * 冲锋距离不再「一路到墙」，而是最多推进 maxSteps 格——剩几步就冲几格、打几次。
 * 撞墙/出界提前结束返回 'wall'；走满额度仍未撞墙返回 'budget'（日志要区分这两种）。
 * maxSteps 省略时退回旧行为（到墙为止），仅供调试/兼容调用。 */
function computeStraightChargePath(path, trigger, maxSteps) {
  const startPos = path[trigger.endIdx];
  const dir = trigger.dir;
  const result = [];
  const limit = (maxSteps === undefined || maxSteps === null) ? Infinity : Math.max(0, maxSteps | 0);
  let cx = startPos.x, cy = startPos.y;
  let safety = 0;
  const maxSafety = COLS + ROWS + 4;
  while (safety < maxSafety) {
    if (result.length >= limit) return { chargePath: result, stopReason: 'budget' };
    safety++;
    const nx = cx + dir.dx, ny = cy + dir.dy;
    if (!inBounds(nx, ny) || map[ny][nx] === 1) {
      return { chargePath: result, stopReason: 'wall' };
    }
    result.push({ x: nx, y: ny });
    cx = nx; cy = ny;
  }
  return { chargePath: result, stopReason: 'maxSafety' };
}

/* 冲锋停下后，找出「朝向前方 maxDist 格」内的存活敌人（由近到远，遇墙截断视线）。
 * 只认朝向直线上的格子，侧后方一律不吃冲锋伤害。 */
function findFacingEnemiesWithin(origin, dir, maxDist) {
  const out = [];
  if (!origin || !dir || (!dir.dx && !dir.dy)) return out;
  for (let k = 1; k <= maxDist; k++) {
    const x = origin.x + dir.dx * k, y = origin.y + dir.dy * k;
    if (!inBounds(x, y) || map[y][x] === 1) break;      // 墙挡视线
    for (const e of enemies) {
      if (!e.alive || e.hp <= 0) continue;
      if (e.x === x && e.y === y) out.push(e);
    }
  }
  return out;
}

/* 结算冲锋「剩余额度」（ISSUE-20261028-01）：
 * 撞到没秒掉的敌人会立即停下，但剩余攻击次数不作废 —— 继续按朝向逐次输出，
 * 直到额度用完或前方 3 格内再无可命中的敌人。每次伤害与冲锋撞击一致（meleeDmg × 2）。 */
function resolveChargeRemainingHits() {
  if (!playerChargingThisTurn || !player || !player.alive || playerChargeBudget <= 0) return;
  const origin = { x: player.x, y: player.y };
  let guard = 0;
  while (playerChargeBudget > 0 && guard++ < 60) {
    const list = findFacingEnemiesWithin(origin, playerChargeDir, CHARGE_FINISH_RANGE);
    if (list.length === 0) break;
    const target = list[0];                 // 优先最近的
    const dmg = player.meleeDmg * 2;
    target.hp -= dmg;
    playerChargeCausedDamage = true;
    playerChargeBudget -= 1;
    playerChargeHits += 1;
    slashFx(target.x, target.y, '#ffd700');
    ringFx(target.x, target.y, '#ff4500');
    hitFlashCell(target.x, target.y);
    floatText(target.x, target.y, `冲锋追击 -${dmg}`, '#ffd700', true);
    log(`冲锋追击敌人${target.id + 1}，造成${dmg}点伤害！（剩余 ${playerChargeBudget} 次）`);
    if (target.hp <= 0) killEnemy(target, { logText: `敌人${target.id + 1}被冲锋追击击倒` });
  }
  if (playerChargeBudget > 0 && playerChargeHits > 0) {
    log(`冲锋结束：朝向前方 ${CHARGE_FINISH_RANGE} 格内已无可命中目标，剩余 ${playerChargeBudget} 次攻击作废。`);
  }
}

/* ===== 技能节点 =====
 * 技能节点由玩家「双击路径节点」设置，到达该步时发动各角色技能（见 resolveStep 的 triggerSkillNode）。
 * 是否可发动只取决于角色自己的技力/状态，因此这里集中给出「当前是否就绪」的预览信息。 */
function skillReadyInfo(path, usePreview = true) {
  switch (selectedChar) {
    case 'wheelchair': {
      const sp = usePreview ? wheelchairPreviewSp() : wheelchairSp;
      return { ready: sp >= WHEELCHAIR_SP_MAX, name: '高效冲击', spNow: sp, spMax: WHEELCHAIR_SP_MAX };
    }
    case 'vampire':
      return { ready: !vampireSkillActive && vampireSp >= VAMPIRE_SP_MAX, name: '不稳定血浆', spNow: vampireSp, spMax: VAMPIRE_SP_MAX };
    case 'fencer':
      return { ready: !fencerCounterActive && fencerSp >= FENCER_SP_MAX, name: '岩崩锤', spNow: fencerSp, spMax: FENCER_SP_MAX };
    case 'amiya':
      return { ready: amiyaBonusTargets > 0, name: '精神爆发', spNow: amiyaBonusTargets, spMax: amiyaSpMax() };
    default:
      return { ready: false, name: '技能', spNow: 0, spMax: 0 };
  }
}
/* 路径上有效的技能节点下标（升序、去重；下标 0 = 起点不算） */
function skillNodesOnPath(path) {
  const p = path || playerPath;
  return [...new Set(skillIndices.filter(i => i > 0 && i < p.length))].sort((a, b) => a - b);
}
/* 攻击范围高亮用的路径下标（第一个攻击/技能节点）；没有节点则以角色当前位置为圆心 */
function rangeDisplayOrigin() {
  if (!player) return null;
  const idxs = [...attackIndices, ...skillIndices].filter(i => i < playerPath.length).sort((a, b) => a - b);
  if (idxs.length) return playerPath[idxs[0]];
  return { x: player.x, y: player.y };
}

function countMoveSteps(path) {
  let n = 0;
  for (let i = 1; i < path.length; i++) {
    if (path[i].x !== path[i-1].x || path[i].y !== path[i-1].y) n++;
  }
  return n;
}
function countWaitSteps(path) {
  let n = 0;
  for (let i = 1; i < path.length; i++) {
    if (path[i].x === path[i-1].x && path[i].y === path[i-1].y) n++;
  }
  return n;
}

/* src: src/rules/actions.js */
/* P0.1-4 拆分 · 20261028b 基线 1566-1621 行 · 动作机制与有效 AC 计算 */
/* =========================================================
 * ★ 动作机制（技能触发系统重做后）
 *
 * 主动行动只有三种，共用同一份动作预算：
 *   - 攻击：单击路径节点设攻击节点，到达该步时攻击。
 *   - 技能：双击路径节点设技能节点，到达该步时发动角色技能。
 *   - 闪避：路径里第一个「等待」自动成为闪避节点，AC +3。
 * 被动行动：趁乱攻击，本 tick 有主动行动时自动结算，不占动作。
 *
 * 默认每回合 1 次动作（scout 的 extraAttacks 可 +1）。按路径先后先到先得，
 * 超出预算的动作在结算时报失败并写日志。
 * 技能节点占住第一个等待步且技能就绪时，技能优先，该步不结算闪避。
 * ========================================================= */
const DODGE_AC_BONUS = 3;

// 路径里第一个「等待」步的下标；没有则 -1
function firstWaitIndex(path) {
  const p = path || playerPath;
  for (let i = 1; i < p.length; i++) {
    if (p[i].x === p[i-1].x && p[i].y === p[i-1].y) return i;
  }
  return -1;
}

// 本回合规划出来的「动作」占用情况：{ dodge, dodgeIndex, actions, skillIdxs, attackCount, skillCount }
function plannedActionInfo(path, atkIdxs, skillIdxs) {
  const p = path || playerPath;
  const atk = atkIdxs || attackIndices;
  const sk = skillIdxs || skillIndices;
  const wIdx = firstWaitIndex(p);
  const skOnPath = [...new Set(sk.filter(i => i > 0 && i < p.length))].sort((a, b) => a - b);
  const skSet = new Set(skOnPath);
  /* 技能节点占了第一个等待步：技能就绪时技能优先（这一步不闪避）；技能没就绪时仍可闪避 */
  const dodge = wIdx >= 0 && !(skSet.has(wIdx) && skillReadyInfo(p).ready);
  const atkOnPath = [...new Set(atk.filter(i => i > 0 && i < p.length))];
  return {
    dodge,
    dodgeIndex: (dodge ? wIdx : -1),
    skillIdxs: skOnPath,
    attackCount: atkOnPath.length,
    skillCount: skOnPath.length,
    actions: (dodge ? 1 : 0) + atkOnPath.length + skOnPath.length,
  };
}

// 再加一个节点会不会超出动作上限（用于设置节点时的提示）
function nodeFitsBudget(path, atkIdxs, skillIdxs) {
  return plannedActionInfo(path, atkIdxs, skillIdxs).actions <= maxActionsThisTurn();
}

/* 玩家当前有效 AC：闪避状态下额外 +N（闪避持续到本回合结束） */
function playerEffectiveAC() {
  let ac = player ? player.ac : 10;
  if (playerDodging) ac += playerDodgeACBonus;
  return ac;
}

/* src: src/ui/units.js */
/* P0.1-4 拆分 · 20261028b 基线 1623-1768 行 · 动作预算与单位渲染 */
/* ★ 动作预算：一回合只能进行一次动作。
 * 闪避节点与攻击节点互斥 —— 闪避后不能再攻击，攻击后也不能再闪避。
 * scout 奖励提供的额外攻击次数同样受动作预算限制。
 * playerActionsUsed = 本回合已消耗的动作数（闪避占 1，攻击每执行一次占 1）。 */
function maxActionsThisTurn() {
  return 1 + (player ? player.extraAttacks : 0);
}
function canPerformAttackAction() {
  return playerActionsUsed < maxActionsThisTurn();
}
function clearUnitLayer() {
  unitEls.forEach(rec => rec.el.remove());
  unitEls.clear();
}
function getUnitIcon() {
  const c = CHARACTERS[selectedChar];
  return c ? c.icon : '🧝';
}
function getPlayerRenderFacing() {
  if (!player) return null;
  if (phase === PHASE.PLANNING) {
    return previewFacing(playerPath, player.x, player.y) || player.facing;
  }
  return player.facing;
}
function isPlayerPreviewCharging() {
  if (phase !== PHASE.PLANNING) return playerChargingThisTurn || fencerCounterActive;
  return skillReadyInfo(playerPath).ready || vampireSkillActive;
}

function renderUnits() {
  if (phase === PHASE.CHAR_SELECT || !player) { clearUnitLayer(); return; }
  const lr = unitLayer.getBoundingClientRect();
  const toRender = [];
  if (player.alive) {
    toRender.push({
      key: 'player', x: player.x, y: player.y,
      icon: getUnitIcon(), hp: player.hp, maxHp: player.maxHp,
      isPlayer: true, isGhost: false, facing: getPlayerRenderFacing(),
      stunTurns: 0,
    });
  }
  for (const e of enemies) {
    if (!e.alive) continue;
    /* 图标统一由数据层提供（ISSUE-20261028-04 新增盾卫/自爆虫） */
    const stat = ENEMY_STATS[e.type] || {};
    const icon = stat.icon || '💀';
    const isGhost = e.type === 'ghost';
    toRender.push({
      key: 'enemy-' + e.id, x: e.x, y: e.y,
      icon, hp: e.hp, maxHp: e.maxHp,
      isPlayer: false, isGhost, facing: e.facing,
      stunTurns: e.stunTurns || 0,
      /* 词缀 / 精英（ISSUE-20261028-05）：标签文字由数据层拼，渲染层只负责显示 */
      isElite: !!e.isElite,
      affixTag: enemyAffixLabel(e),
    });
  }
  /* 联机对战：对手是玩家控制的单位，不是敌人，单独一个渲染条目 */
  if (mode === 'pvp' && peer && peer.alive) {
    toRender.push({
      key: 'peer', x: peer.x, y: peer.y,
      icon: (CHARACTERS[peer.charId] && CHARACTERS[peer.charId].icon) || '❓',
      hp: peer.hp, maxHp: peer.maxHp,
      isPlayer: false, isPeer: true, isGhost: false,
      facing: peer.facing, stunTurns: 0,
    });
  }
  for (const u of toRender) {
    if (unitEls.has(u.key)) continue;
    const el = document.createElement('div');
    el.className = 'unit-abs';
    el.style.transition = 'none';
    el.innerHTML = `
      <div class="facing-ind" style="display:none"></div>
      <div class="icon"></div>
      <div class="hp-bar"><div class="hp-fill"></div></div>
      <div class="affix-tag" style="display:none"></div>
    `;
    unitLayer.appendChild(el);
    unitEls.set(u.key, {
      el,
      icon: el.querySelector('.icon'),
      hpFill: el.querySelector('.hp-fill'),
      facingEl: el.querySelector('.facing-ind'),
      affixEl: el.querySelector('.affix-tag'),
      lastPos: null,
    });
  }
  const positions = new Map();
  for (const u of toRender) {
    const cell = getCellEl(u.x, u.y);
    if (cell) {
      const r = cell.getBoundingClientRect();
      positions.set(u.key, {
        left: r.left - lr.left, top: r.top - lr.top,
        w: r.width, h: r.height,
      });
    }
  }
  const maxAtk = 1 + player.extraAttacks;
  const playerCharging = isPlayerPreviewCharging();
  const playerAttacked = playerAttacksDone >= maxAtk;
  for (const u of toRender) {
    const rec = unitEls.get(u.key);
    const pos = positions.get(u.key);
    if (!rec || !pos) continue;
    rec.el.style.width = pos.w + 'px';
    rec.el.style.height = pos.h + 'px';
    if (rec.lastPos === null) {
      rec.el.style.transform = `translate(${pos.left}px, ${pos.top}px)`;
      void rec.el.offsetWidth;
      rec.el.style.transition = '';
    } else if (rec.lastPos.left !== pos.left || rec.lastPos.top !== pos.top) {
      rec.el.style.transform = `translate(${pos.left}px, ${pos.top}px)`;
    }
    rec.lastPos = { left: pos.left, top: pos.top };
    if (rec.icon.textContent !== u.icon) rec.icon.textContent = u.icon;
    rec.icon.classList.toggle('ghost-icon', !!u.isGhost);
    /* 词缀标签：无词缀时藏起来，避免空格子挂一个空胶囊 */
    if (rec.affixEl) {
      const tagText = u.affixTag || '';
      if (rec.affixEl.textContent !== tagText) rec.affixEl.textContent = tagText;
      rec.affixEl.style.display = tagText ? 'flex' : 'none';
    }
    const pct = u.maxHp > 0 ? Math.max(0, Math.min(100, (u.hp / u.maxHp) * 100)) : 0;
    rec.hpFill.style.width = pct + '%';
    rec.hpFill.style.background = u.isPlayer ? '#3b9eff' : (u.isPeer ? '#e8a33d' : '#e74c3c');
    if (u.facing) {
      const v = FACING_GLYPH[u.facing.dx + ',' + u.facing.dy];
      if (v) {
        rec.facingEl.style.display = 'flex';
        rec.facingEl.textContent = v[0];
        rec.facingEl.className = 'facing-ind ' + v[1];
      } else rec.facingEl.style.display = 'none';
    } else {
      rec.facingEl.style.display = 'none';
    }
    if (u.isPlayer) {
      rec.el.classList.add('ua-player');
      rec.el.classList.remove('ua-enemy', 'ua-debug', 'ua-stunned');
      rec.el.classList.toggle('ua-charging', playerCharging);
      rec.el.classList.toggle('ua-attacked', playerAttacked && !playerCharging);
    } else if (u.isPeer) {
      rec.el.classList.add('ua-peer');
      rec.el.classList.remove('ua-player', 'ua-enemy', 'ua-charging', 'ua-attacked', 'ua-debug', 'ua-stunned');
    } else {
      rec.el.classList.add('ua-enemy');
      rec.el.classList.remove('ua-player', 'ua-charging', 'ua-attacked');
      rec.el.classList.toggle('ua-debug', debugMode);
      rec.el.classList.toggle('ua-stunned', u.stunTurns > 0);
      rec.el.classList.toggle('ua-elite', !!u.isElite);
    }
  }
  const seen = new Set(toRender.map(u => u.key));
  for (const [k, rec] of unitEls) {
    if (!seen.has(k)) { rec.el.remove(); unitEls.delete(k); }
  }
}

/* src: src/rules/reset.js */
/* P0.1-4 拆分 · 20261028c 基线 1908-2003 行 · 状态重置（整局 / 整轮两级收敛）：freshBuffs / clearLevelUpOverlay / resetSkillState / resetRunProgress / resetTurnState / createPlayerStats / createPlayerUnit / syncPlayerFromStats */
/* =========================================================
 * ★ 状态重置：开局 / 换角色 / 通关 / 回合切换
 * 原来同一个变量表在 initCharSelect、selectCharacter、initLevel、
 * confirmAction、endRound 里各抄了一份，新增状态时极容易漏清。
 * 这里按「整局 / 整轮」两级收敛。
 * ========================================================= */
function freshBuffs() {
  return { kettle: 0, blade: 0, sass: 0, kit: 0, pill: 0, scout: 0 };
}
function clearLevelUpOverlay() {
  document.querySelectorAll('.lv-mask').forEach(m => m.remove());
}
/* 技力与角色专属技能状态（换角色 / 重开时清零） */
function resetSkillState() {
  fencerSp = 0;
  wheelchairSp = 0;
  vampireSp = 0;
  vampireSkillActive = false;
  amiyaBonusTargets = 0;
}
/* 整局成长：等级 / 经验 / buff / 护盾 / 升级弹窗 */
function resetRunProgress() {
  levelHpBonus = 0;
  heroLevel = 1;
  xp = 0;                       // 漏重置 → 二周目带经验开局
  pendingLevelUps = 0;
  levelStartHp = 0;
  levelActions = 0;
  buffs = freshBuffs();
  playerShield = 0;
  levelUpOpen = false;
  lastLevelUpConMod = 0;
  clearLevelUpOverlay();
  resetSkillState();
}
/* 一回合内的临时状态（每回合开始 / 结束时都清）。
 * clearCounter=true 时连反击状态一起清（回合结束时需要）。 */
function resetTurnState({ clearCounter = false } = {}) {
  playerChargingThisTurn = false;
  playerAttacksDone = 0;
  playerActionsUsed = 0;
  playerDodging = false;
  playerDodgeACBonus = 0;
  dodgeTriggerIndex = -1;
  pendingAttack = false;
  pendingChargeInfo = null;
  playerChargeStopReason = null;
  playerChargeCausedDamage = false;
  playerChargeBudget = 0;
  playerChargeHits = 0;
  if (clearCounter) fencerCounterActive = false;
}

function createPlayerStats(charId) {
  const char = CHARACTERS[charId];
  return {
    abilities: { ...char.abilities },
    profMelee: char.profMelee,
    profRanged: char.profRanged,
    abilityPoints: 0,
    currentHp: 0,
    extraTargets: 0,
    extraAttacks: 0,
    critChance: 0.08,
  };
}
function createPlayerUnit(start) {
  return {
    x: start.x, y: start.y,
    hp: playerStats.currentHp, maxHp: playerStats.maxHp,
    move: playerStats.move, range: PLAYER_RANGE,
    rangedDmg: playerStats.rangedDmg,
    meleeDmg: playerStats.meleeDmg,
    critChance: playerStats.critChance,
    extraTargets: playerStats.extraTargets,
    extraAttacks: playerStats.extraAttacks,
    visibleSteps: playerStats.visibleSteps,
