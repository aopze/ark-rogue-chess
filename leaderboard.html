<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>方舟战棋 · 排行榜</title>
<!--
  方舟战棋 · 排行榜模块（独立 HTML，像 DLC 一样可单独更新）
  ------------------------------------------------------------------
  · 数据源：同域的 leaderboard.json（由 bot 侧写入 GitHub Pages）
  · 刷新：手动按钮 + 30 秒自动刷新；fetch 带 cache-busting 绕过 CDN 缓存
  · 高亮：外壳在游戏结束时 postMessage {type:'my_score', level, kills} → 高亮「我」的那行
  · 零外部依赖，可直接单独打开这个文件预览
-->
<style>
  :root{
    --card: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.12);
    --fg:#eef0ff; --dim:#9aa0c0; --gold:#ffd166; --me:#3ddc84;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#111226;color:var(--fg);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{padding:16px 14px 24px;max-width:520px;margin:0 auto;}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
  .sub{font-size:12px;color:var(--dim);margin-top:3px}
  button.refresh{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid var(--line);
    color:var(--fg);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer}
  button.refresh:active{background:rgba(255,255,255,.22)}
  .meta{font-size:11px;color:var(--dim);margin-bottom:10px;min-height:14px}
  ol{list-style:none;margin:0;padding:0}
  li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;margin-bottom:7px}
  li.me{border-color:var(--me);box-shadow:0 0 0 1px rgba(61,220,132,.3) inset}
  .rank{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.08);color:var(--dim)}
  li:nth-child(1) .rank{background:var(--gold);color:#3a2a00}
  li:nth-child(2) .rank{background:#cfd6e6;color:#2c3244}
  li:nth-child(3) .rank{background:#d9a066;color:#3a2400}
  .who{flex:1;min-width:0}
  .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .nm{color:var(--me)}
  .sc{font-size:12px;color:var(--dim);margin-top:2px}
  .lv{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}
  .empty{text-align:center;color:var(--dim);padding:44px 10px;font-size:14px;line-height:1.9}
  .err{color:#ff8a8a;font-size:12px;margin-top:8px}
  .tag{font-size:10px;background:var(--me);color:#063;padding:1px 6px;border-radius:6px;margin-left:6px;
    vertical-align:middle}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🏆 方舟战棋排行榜</h1>
      <div class="sub">按最深层数排序 · 同层数比击杀</div>
    </div>
    <button class="refresh" id="btnRefresh">刷新</button>
  </header>
  <div class="meta" id="meta">加载中…</div>
  <ol id="list"></ol>
  <div class="empty hide" id="empty">还没有人上榜<br>去玩一把，把名字留在上面 ✦</div>
  <div class="err" id="err"></div>
</div>
<script>
var MY = null;      // 我这次的成绩 {level, kills}
var MY_ID = 0;      // 我的 Telegram id（外壳传入，优先用于高亮）
var LIST = [];
var UPDATED = 0;

function fmtTime(ts){
  if(!ts) return '';
  var d = new Date(ts*1000);
  function p(n){ return n<10 ? '0'+n : ''+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function render(){
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var meta = document.getElementById('meta');
  list.innerHTML = '';
  if(!LIST.length){
    empty.classList.remove('hide');
    meta.textContent = '';
    return;
  }
  empty.classList.add('hide');
  LIST.forEach(function(u, i){
    var isMe = false;
    if(MY_ID && String(u.id) === String(MY_ID)) isMe = true;
    else if(MY && u.level === MY.level && u.kills === MY.kills) isMe = true;
    var li = document.createElement('li');
    if(isMe) li.className = 'me';

    var rank = document.createElement('div');
    rank.className = 'rank';
    rank.textContent = (i+1);

    var who = document.createElement('div');
    who.className = 'who';
    var nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = u.name || '匿名';
    if(isMe){
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = '我';
      nm.appendChild(tag);
    }
    var sc = document.createElement('div');
    sc.className = 'sc';
    sc.textContent = '击杀 ' + (u.kills||0) + ' · 挑战 ' + (u.runs||1) + ' 次';
    who.appendChild(nm);
    who.appendChild(sc);

    var lv = document.createElement('div');
    lv.className = 'lv';
    lv.textContent = '第 ' + (u.level||0) + ' 层';

    li.appendChild(rank); li.appendChild(who); li.appendChild(lv);
    list.appendChild(li);
  });
  meta.textContent = '共 ' + LIST.length + ' 位玩家' + (UPDATED ? ' · 更新于 ' + fmtTime(UPDATED) : '');
}

function load(){
  document.getElementById('err').textContent = '';
  fetch('leaderboard.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d){
      UPDATED = d.updated_at || 0;
      LIST = (d.entries || []).slice().sort(function(a, b){
        if((b.level||0) !== (a.level||0)) return (b.level||0) - (a.level||0);
        return (b.kills||0) - (a.kills||0);
      });
      render();
    })
    .catch(function(e){
      document.getElementById('err').textContent = '榜单加载失败：' + e.message;
      document.getElementById('meta').textContent = '';
    });
}

document.getElementById('btnRefresh').addEventListener('click', load);

// 接收游戏外壳传来的「我的成绩 / 我的 id」→ 高亮对应行
window.addEventListener('message', function(e){
  var d = e.data;
  if(!d) return;
  if(d.type === 'my_score'){
    MY = {level: d.level || 0, kills: d.kills || 0};
    render();
  } else if(d.type === 'my_id'){
    MY_ID = d.id || 0;
    render();
  }
});

load();
setInterval(load, 30000);
</script>
</body>
</html>
